<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#134e4a">
<title>용접기능사 이론요약</title>
<style>
:root{
  --bg:#f5f7f6; --card:#ffffff; --ink:#14201e; --muted:#5f716e; --line:#e2e8e6;
  --brand:#0f766e; --brand-soft:#d7f0ec; --ok:#15803d; --ok-soft:#dcfce7;
  --no:#b91c1c; --no-soft:#fee2e2; --warn:#a16207; --warn-soft:#fdf3d7;
  --fix:#9a3412; --fix-soft:#ffedd5;
  --shadow:0 1px 2px rgba(20,32,30,.06),0 4px 14px rgba(20,32,30,.06); --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1413;--card:#161f1e;--ink:#eef4f2;--muted:#93a5a2;--line:#25302e;
        --brand:#5eead4;--brand-soft:#0d2b28;--ok:#4ade80;--ok-soft:#0f2818;
        --no:#fca5a5;--no-soft:#3a1414;--warn:#fbbf24;--warn-soft:#2a2113;
        --fix:#fdba74;--fix-soft:#341c0c;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
body.hasnav .wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:54px}
.hd h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:15px 16px}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:22px 4px 8px}
.muted{color:var(--muted)}.small{font-size:13px}.hide{display:none!important}
.ttl{font-weight:800;font-size:15.5px;letter-spacing:-.01em}

/* 목록 */
.glist{display:grid;gap:10px;margin-top:14px}
.glist.g2{grid-template-columns:1fr 1fr}
.gcard{display:block;padding:15px 16px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.gcard .gt{display:block;font-weight:800;font-size:16px;letter-spacing:-.02em}
.gcard .gm{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.glist.g2 .gt{font-size:14.5px}
.bar{display:block;height:4px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.ulist{box-shadow:var(--shadow);border-radius:var(--r)}
.unit{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-bottom:0;cursor:pointer}
.ulist .unit:first-child{border-radius:var(--r) var(--r) 0 0}
.ulist .unit:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:1px solid var(--line)}
.unum{flex:0 0 46px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:12.5px}
.unit.done .unum{background:var(--ok-soft);color:var(--ok)}
.ubody{flex:1;min-width:0;display:block}
.utitle{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.umeta{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* 이론 본문 */
.theory h2{font-size:15px;font-weight:800;margin:24px 0 8px;padding-bottom:6px;
  border-bottom:2px solid var(--brand);color:var(--brand)}
.theory p{margin:9px 0;font-size:14.8px;line-height:1.75;white-space:pre-line}
.theory ul{margin:9px 0;padding-left:0;list-style:none}
.theory li{position:relative;padding:5px 0 5px 17px;font-size:14.6px;line-height:1.7}
.theory li::before{content:'';position:absolute;left:2px;top:14px;width:5px;height:5px;border-radius:1px;background:var(--brand)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:11px 0;border:1px solid var(--line);
  border-radius:11px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.03em;
  padding:9px 11px;border-bottom:1px solid var(--line);background:var(--brand-soft);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-line}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;min-width:80px}
.fx{margin:11px 0;padding:12px 14px;border-radius:11px;background:var(--brand-soft)}
.fx .fn{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.03em}
.fx .ff{font-size:15px;font-weight:700;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.55;word-break:break-word}
.fx .fd{font-size:13px;color:var(--muted);margin-top:4px}
.nt{margin:12px 0;padding:12px 14px;border-radius:11px;background:var(--fix-soft);
  border-left:3px solid var(--fix);font-size:13.8px;line-height:1.7}
.nt b.nh{display:block;font-weight:800;color:var(--fix);font-size:12.5px;letter-spacing:.02em;margin-bottom:3px}
mark{background:var(--fix-soft);color:var(--fix);font-weight:700;padding:0 3px;border-radius:3px}
.tip{margin:14px 0 0;padding:12px 14px;border-radius:11px;background:var(--ok-soft);
  color:var(--ok);font-size:13.8px;font-weight:600}
.tip b{display:block;font-size:11.5px;letter-spacing:.05em;margin-bottom:2px;opacity:.85}

/* 문제 */
.q .qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.qno{font-weight:800;color:var(--brand);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.f{background:var(--fix-soft);color:var(--fix)}
.qstem{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.65;white-space:pre-line}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card);font-size:14.3px;cursor:pointer;line-height:1.5}
.ch .k{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--line);
  font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}.ch.ok .k{background:var(--ok);color:#fff}
.ch.no{border-color:var(--no);background:var(--no-soft)}.ch.no .k{background:var(--no);color:#fff}
.ch:disabled{cursor:default}
.reveal{margin-top:10px;padding:12px 13px;border-radius:11px;background:var(--brand-soft);font-size:14px;
  scroll-margin-bottom:104px;scroll-margin-top:96px}
.reveal.ok{background:var(--ok-soft)}.reveal.no{background:var(--no-soft)}
.reveal .lab{font-weight:800;font-size:12px;letter-spacing:.04em;display:block;margin-bottom:3px;color:var(--brand)}
.reveal.ok .lab{color:var(--ok)}.reveal.no .lab{color:var(--no)}
.reveal .ansv{font-weight:700;font-size:14.5px}
.reveal .exp{margin-top:7px;padding-top:7px;border-top:1px solid rgba(120,140,135,.28);
  font-size:13.6px;line-height:1.65;white-space:pre-line}
.reveal .exp b{font-weight:800;color:var(--muted);font-size:11.5px;letter-spacing:.04em;display:block;margin-bottom:2px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.btn{padding:11px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0d1413}}
.btn:disabled{opacity:.45}
.progress{position:sticky;top:54px;z-index:20;background:var(--bg);padding:10px 0 6px}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--brand);transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.navbtns{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-top:14px;background:var(--card);padding:5px;border-radius:13px;
  border:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border:0;background:none;border-radius:9px;font-weight:700;
  font-size:14px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#0d1413}}
.result{padding:26px 18px;text-align:center;margin-top:16px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800;font-size:24px}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:14px}
.spin{padding:60px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.chip{padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);
  font-size:12.8px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0d1413}}
.fix{padding:14px 15px;border-bottom:1px solid var(--line)}
.fix:last-child{border-bottom:0}
.fix .fh{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.fix .pg{font-size:11.5px;font-weight:800;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.gr{font-size:10.8px;font-weight:800;padding:2px 8px;border-radius:999px}
.gr.A{background:var(--no-soft);color:var(--no)}
.gr.B{background:var(--warn-soft);color:var(--warn)}
.gr.C{background:var(--brand-soft);color:var(--brand)}
.fix .fk{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.ba{display:grid;gap:7px;margin-top:8px}
.ba div{font-size:13.6px;line-height:1.6;padding:9px 11px;border-radius:9px}
.ba .o{background:var(--no-soft);color:var(--ink)}
.ba .n{background:var(--ok-soft);color:var(--ink)}
.ba .o::before{content:'원문  ';font-weight:800;font-size:11px;color:var(--no)}
.ba .n::before{content:'수정  ';font-weight:800;font-size:11px;color:var(--ok)}
.fix .fw{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:60}
.toast.on{opacity:.94}
.wkft{max-width:760px;margin:22px auto 0;padding:0 14px calc(24px + env(safe-area-inset-bottom));text-align:center}
body.hasnav .wkft{display:none}
.wkft a{display:inline-block;margin:0 3px 6px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);
  text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;background:var(--card)}
</style>
</head>

<header><div class="hd">
  <button class="iconbtn hide" id="back" aria-label="뒤로">‹</button>
  <h1 id="title">용접기능사 이론요약<span class="sub" id="sub">이론 · 계산문제 · 정오표</span></h1>
  <button class="iconbtn" id="home" aria-label="홈">⌂</button>
</div></header>
<div class="wrap" id="app"><div class="spin">불러오는 중…</div></div>
<div class="toast" id="toast"></div>

: "A변태점 / A변태점 / A변태점", "n": "A₂(768℃) / A₃(910℃) / A₄(1400℃) / 용융점 1538℃", "w": "아래첨자가 빠져 셋이 구분되지 않았습니다."}, {"p": "p.16", "g": "B", "k": "담금질 조직 오스테나이트", "o": "오스테나이트 : 냉각속도가 지나치게 빠름", "n": "잔류 오스테나이트 : 급랭했을 때 변태하지 못하고 남는 조직", "w": "냉각속도 순서(마텐자이트 수랭 > 트루스타이트 유랭 > 소르바이트 공랭)와 섞이지 않게 고쳤습니다."}, {"p": "p.16", "g": "B", "k": "청열취성 원인", "o": "청열 메짐 … 인(P)의 영향", "n": "청열취성(200~300℃) : 질소(N)가 주원인, 산소가 조장 / 인(P)은 상온취성(냉간취성)의 원인", "w": "인(P)으로 가르치는 교재도 있으나 원인 원소는 질소(N)입니다. 상온취성과 구분해 두었습니다."}, {"p": "p.17", "g": "A", "k": "플래티나이트", "o": "플래티나이트 : Ni 42~46%, Cr 18%", "n": "플래티나이트 : Ni 42~46% + Fe (Cr 없음)", "w": "Fe-Ni 불변강계 합금입니다. Cr 18%는 사실이 아닙니다."}, {"p": "p.19", "g": "A", "k": "순철 탄소량", "o": "0.085% 미만 탄소량 함유", "n": "탄소 0.02~0.03% 이하", "w": "순철의 탄소량 기준이 과대했습니다."}, {"p": "p.19", "g": "A", "k": "자기변태 설명", "o": "원자의 배열은 변화가 없어 강도만 변화", "n": "원자 배열은 변하지 않고 자성(자기적 성질)만 변한다", "w": "15쪽에는 '자성만 변함'으로 맞게 적혀 있어 서로 모순이었습니다."}, {"p": "p.19", "g": "A", "k": "철광석", "o": "갈철광(30~40Fe) 많이 생산", "n": "적철광(Fe₂O₃, Fe 약 70%)이 가장 많이 생산·사용된다. 자철광 72.4%, 능철광 48.2%", "w": "가장 많이 쓰는 철광석은 적철광입니다."}, {"p": "p.19", "g": "A", "k": "저온취성 방지", "o": "저온취성 = Mo첨가 방지", "n": "저온취성 방지 = 니켈(Ni) 첨가", "w": "저온인성 개선은 Ni입니다."}, {"p": "p.19", "g": "C", "k": "체심입방격자", "o": "체임입방격자", "n": "체심입방격자", "w": "오타."}, {"p": "p.20", "g": "A", "k": "13Cr 스테인리스", "o": "Cr13형 = 페라이트계 스테인리스강", "n": "13Cr계 = 마텐자이트계 (담금질하면 마텐자이트 조직) / 18Cr계 = 페라이트계", "w": "바로 아래 줄에 마텐자이트계를 따로 적어 놓아 서로 모순이었습니다."}, {"p": "p.20", "g": "A", "k": "공구강 기호", "o": "합금공구강(STC)", "n": "합금공구강 = STS / 탄소공구강 = STC", "w": "17쪽에는 STS로 맞게 적혀 있었습니다."}, {"p": "p.20", "g": "A", "k": "회주철 냉각속도", "o": "회주철 : 규소량이 많고 냉각속도가 빠를 때", "n": "회주철 : 규소량이 많고 냉각속도가 느릴 때 / 백주철 : 규소량이 적고 냉각속도가 빠를 때", "w": "백주철과 회주철이 둘 다 '빠를 때'로 되어 있었습니다."}, {"p": "p.20", "g": "A", "k": "주철 장점", "o": "녹슬지 않고, 담금질이 잘 된다", "n": "녹이 잘 슬지 않는다 (담금질은 잘 되지 않는다 — 단점)", "w": "주철은 담금질이 어렵습니다. 장점 자리에 있으면 안 됩니다."}, {"p": "p.20", "g": "B", "k": "A1 변태", "o": "Al변태의 체적변화", "n": "A₁변태의 체적변화", "w": "알루미늄(Al)로 읽히던 것을 A₁로 바로잡았습니다."}, {"p": "p.21", "g": "A", "k": "하이드로날륨", "o": "하이드로날륨(Al-Mg) : 내연기관 실린더·피스톤", "n": "하이드로날륨(Al-Mg 12% 이하) : 내식성이 가장 큰 알루미늄 합금 (선박·화학장치)", "w": "18쪽에는 '내식성이 가장 크다'로 맞게 적혀 있어 모순이었습니다. 내연기관용은 Y합금·로엑스입니다."}, {"p": "p.21", "g": "A", "k": "연청동", "o": "연청동 : 탄성한계가 높아 베어링·스프링재", "n": "인청동(Cu-Sn-P 0.35%) : 탄성한계가 높아 스프링·베어링·밸브시트 / 연청동(Pb 첨가) : 베어링용", "w": "스프링재 설명은 인청동의 것입니다."}, {"p": "p.21", "g": "A", "k": "초두랄루민", "o": "초두랄루민 = 두랄루민 + Cr + Zn", "n": "초두랄루민 : 두랄루민에서 Mg 증가·Si 감소 / Cr·Zn을 넣은 것은 초강두랄루민", "w": "18쪽 서술과 모순이었습니다."}, {"p": "p.21", "g": "B", "k": "켈밋과 베빗메탈", "o": "켈밋 = 고속 중하중 / 베빗메탈 = 고속 고하중 (18쪽과 반대)", "n": "켈밋(Cu+Pb 30~40%) = 고속·고하중 베어링 / 베빗메탈(화이트메탈) = 고속·중하중 베어링", "w": "18쪽과 21쪽의 설명이 서로 반대였습니다."}, {"p": "p.21", "g": "A", "k": "티타늄 용융점", "o": "티탄 용융점 1800℃", "n": "티타늄(Ti) : 비중 4.5, 용융점 1668℃", "w": "정확한 값은 1668℃입니다."}, {"p": "p.21", "g": "A", "k": "니켈 용융점", "o": "니켈 융점 1445℃", "n": "니켈(Ni) : 비중 8.9, 용융점 1455℃, 자기변태점 358℃", "w": "1455℃입니다."}, {"p": "p.21", "g": "C", "k": "엘린바", "o": "엘인바 / 코엘인바 / 초인바", "n": "엘린바 / 코엘린바 / 슈퍼인바", "w": "오타."}, {"p": "p.20", "g": "C", "k": "7:3황동", "o": "7:3황동 ( Cu70% + Zn% )", "n": "7:3 황동 (Cu 70% + Zn 30%)", "w": "숫자 누락."}, {"p": "p.23", "g": "A", "k": "강재 기호 SPS", "o": "SPS = 일반구조용 탄소강재", "n": "SPS = 스프링 강재 / 일반구조용 압연강재 = SS", "w": "기호가 서로 바뀌어 있었습니다."}, {"p": "p.23", "g": "A", "k": "사다리꼴 나사", "o": "TW 29도 / TW 30도", "n": "TW = 휘트워스계 29° / TM = 미터계 30°", "w": "30°짜리 기호는 TM입니다."}, {"p": "p.23", "g": "A", "k": "가공방법 기호 C", "o": "C = 치핑(표면을 거칠게 표현)", "n": "C = 주조(Casting) / 치핑 = FCH", "w": "KS B 0107 기준입니다."}, {"p": "p.26", "g": "A", "k": "안전표지 색채", "o": "파란색 : 지시, 주의", "n": "파란색 : 지시 (주의는 노란색)", "w": "노란색의 뜻이 파란색에 겹쳐 들어가 있었습니다."}, {"p": "p.26", "g": "B", "k": "화재 분류", "o": "E급화재 (가스화재)", "n": "E급 = 가스화재 (교재에 따라 B급에 포함) / K급 = 주방화재(식용유)", "w": "국내 자료가 갈립니다. 둘 다 알아두는 편이 안전합니다."}, {"p": "p.22", "g": "C", "k": "바퀴", "o": "바뀌의 암", "n": "바퀴의 암", "w": "오타."}, {"p": "p.6", "g": "A", "k": "액체 산소의 색", "o": "50기압 압축시 담황색의 액체로 된다", "n": "담청색(옅은 푸른색) 액체가 된다 — 일부 교재는 담황색으로 적고 있어 함께 표기", "w": "액체 산소는 옅은 푸른색입니다. 다만 담황색으로 쓰는 국내 교재가 있어 두 표기를 같이 실었습니다."}, {"p": "p.4", "g": "A", "k": "필릿 각장과 목두께", "o": "용접다리(각장) : 한(판) 두께의 70%", "n": "각장(다리길이) z ≒ 모재 판 두께 / 이론 목두께 a ≒ 0.7z — 70%인 것은 각장이 아니라 목두께", "w": "70%가 붙는 자리는 각장이 아니라 목두께입니다. 각장은 판 두께 정도로 잡습니다."}, {"p": "p.3", "g": "B", "k": "심선 KS 기호", "o": "SWRW (저탄소 림드강의 영문약자)", "n": "SWRW로 가르치는 교재가 많으나, 현행 KS 기호는 SWW11·SWW12(KS D 3550) / 심선재 SWR11(KS D 3508)", "w": "시험에서는 SWRW로 나올 수 있어 지우지 않고 현행 기호를 함께 적었습니다."}, {"p": "p.10", "g": "A", "k": "TIG 토치 냉각 방식", "o": "100A미만(공냉식), 100A이상(수냉식)", "n": "200A 이하 공랭식 / 200A 이상 수랭식 (교재에 따라 100A 기준)", "w": "용접학원 표준 자료는 200A 기준입니다."}, {"p": "p.14", "g": "B", "k": "예열 온도", "o": "고장력강, 저합금강, 스테인레스강, 연강(25t이상) 50~250℃로 예열", "n": "50~350℃ (교재에 따라 50~250℃로 쓰기도 함)", "w": "현대중공업 기술교육원 자료 기준은 50~350℃입니다."}, {"p": "p.10", "g": "B", "k": "용제 소결 온도", "o": "소결형 800~1,000℃ / 혼성형 300~500℃", "n": "용융형 1,300℃ 이상 / 소결형 400~1,000℃ (혼성형의 300~500℃는 근거를 찾지 못해 뺐습니다)", "w": "용접학원·부산대 자료 모두 소결형을 400~1,000℃로 씁니다."}, {"p": "p.12", "g": "A", "k": "포지셔너와 매니퓰레이터", "o": "용접 포지셔너 … (매니 플레이트)", "n": "포지셔너 = 모재를 회전·경사시켜 아래보기 자세를 만드는 장치 / 매니퓰레이터 = 용접 헤드를 지지·이동시키는 장치 — 서로 다른 장비", "w": "원본의 \"매니 플레이트\"를 매니퓰레이터로만 고치면 두 장비를 같은 것으로 오해합니다."}, {"p": "p.26", "g": "A", "k": "안전표지 색채", "o": "흰색: 통로, 정돈 / 자주: 방사능 / 황적: 항해·항공 보안시설", "n": "현행 산업안전보건법은 빨강·노랑·파랑·녹색·흰색·검정 6색. 흰색과 검정은 보조색이고 자주색은 없다", "w": "자주=방사능은 옛 KS 안전색채 표의 내용입니다. 현행 법령 문제에서는 오답이 될 수 있습니다."}, {"p": "p.26", "g": "A", "k": "조도 기준", "o": "초정밀 700~1500 / 정밀 300~700 / 거친 작업 70~150 lx", "n": "초정밀 750 lx 이상 / 정밀 300 lx 이상 / 보통 150 lx 이상 / 그 밖의 작업 75 lx 이상", "w": "산업안전보건기준에 관한 규칙 제8조의 법정 수치입니다. 보통 작업 구간도 빠져 있었습니다."}], "calc": [{"n": 1, "q": "피복 아크 용접에서 발생하는 아크의 온도 범위로 가장 적당한 것은?", "c": ["약 1,000~2,000℃", "약 2,000~3,000℃", "약 5,000~6,000℃", "약 8,000~9,000℃"], "a": 3, "w": "아크의 최고 온도는 약 6,000℃이고 실제로는 3,500~5,000℃를 이용한다.", "g": "용접기", "fix": ""}, {"n": 2, "q": "피복 아크 용접에서 용접 단위 길이 1cm당 발생하는 전기적 열에너지 H(J/cm)를 구하는 식은?", "c": ["H = 60EI ÷ V", "H = 60V ÷ EI", "H = EI ÷ 60V", "H = 60EV ÷ I"], "a": 1, "w": "E 아크전압(V), I 아크전류(A), V 용접속도(cm/min).", "g": "용접기", "fix": "원본은 보기가 그림으로만 있어 식으로 옮겨 적었습니다."}, {"n": 3, "q": "아크전압 25V, 용접속도 12.5cm/min, 아크전류 120A로 용접할 때 1cm당 용접입열은?", "c": ["144 J", "1,440 J", "14,400 J", "144,000 J"], "a": 3, "w": "H = 60 × 25 × 120 ÷ 12.5 = 180,000 ÷ 12.5 = 14,400 J/cm", "g": "용접기", "fix": ""}, {"n": 4, "q": "일반적으로 모재에 흡수되는 열량은 용접입열의 몇 % 정도인가?", "c": ["40~50%", "70~80%", "75~85%", "80~90%"], "a": 3, "w": "모재 흡수 열량은 입열의 75~85%.", "g": "용접기", "fix": ""}, {"n": 5, "q": "규격이 AW 200인 교류 아크 용접기로 조정할 수 있는 정격 2차 전류의 최대값은?", "c": ["200 A", "220 A", "240 A", "260 A"], "a": 2, "w": "조정 범위는 정격 2차 전류의 20~110%. 200 × 1.1 = 220 A", "g": "용접기", "fix": ""}, {"n": 6, "q": "용접기의 사용률(duty cycle)을 구하는 식은?", "c": ["아크발생시간 ÷ (아크발생시간 + 휴식시간) × 100", "휴식시간 ÷ (아크발생시간 + 휴식시간) × 100", "(아크발생시간 + 휴식시간) ÷ 아크발생시간 × 100", "아크발생시간 ÷ 휴식시간 × 100"], "a": 1, "w": "전체 시간 중 아크가 난 시간의 비율.", "g": "용접기", "fix": "보기를 식으로 옮겨 적었습니다."}, {"n": 7, "q": "아크를 8분간 발생시키고 2분간 쉬었다면 사용률은 몇 %인가?", "c": ["25", "40", "65", "80"], "a": 4, "w": "8 ÷ (8+2) × 100 = 80%", "g": "용접기", "fix": ""}, {"n": 8, "q": "아크 발생 시간이 4분이고 휴식 시간이 6분일 때 사용률은?", "c": ["40%", "100%", "60%", "50%"], "a": 1, "w": "4 ÷ (4+6) × 100 = 40%", "g": "용접기", "fix": ""}, {"n": 9, "q": "사용률 40%인 교류 아크 용접기로 정격전류에서 4분 용접했다면 휴식 시간은?", "c": ["2분", "4분", "6분", "8분"], "a": 3, "w": "40 = 4 ÷ (4+x) × 100 → 40(4+x) = 400 → x = 6분", "g": "용접기", "fix": ""}, {"n": 10, "q": "용접기의 허용 사용률(%)을 나타내는 식은?", "c": ["(정격2차전류)² ÷ (실제 용접전류)² × 정격사용률", "(실제 용접전류)² ÷ (정격2차전류)² × 100", "정격2차전류 ÷ 실제 용접전류 × 정격사용률", "실제 용접전류 ÷ 정격2차전류 × 100"], "a": 1, "w": "전류의 제곱임에 주의. 이론요약집 원본에는 제곱이 빠져 있었다.", "g": "용접기", "fix": ""}, {"n": 11, "q": "2차측 사용전류 120A, 정격 2차 전류 300A일 때 허용 사용률은? (정격 사용률 40%)", "c": ["100%", "150%", "250%", "360%"], "a": 3, "w": "300² ÷ 120² × 40 = 90,000 ÷ 14,400 × 40 = 250%", "g": "용접기", "fix": ""}, {"n": 12, "q": "피복 아크 용접에서 용융 속도를 결정하는 것은?", "c": ["아크 전류 × 용접봉 쪽 전압강하", "아크 전압 × 용접봉 쪽 전압강하", "아크 전류 × 용접봉 지름", "아크 전류 × 아크 전압"], "a": 1, "w": "용융 속도는 아크 전압과 무관하다.", "g": "용접기", "fix": ""}, {"n": 13, "q": "양극 전압강하 VA, 음극 전압강하 Vk, 아크기둥 전압강하 Vp일 때 아크전압 Va의 관계식은?", "c": ["Va = Vk + Vp + VA", "Va = Vk − Vp + VA", "Va = Vk + Vp − VA", "Va = Vk × Vp × VA"], "a": 1, "w": "세 전압강하의 합이 아크전압.", "g": "용접기", "fix": "보기를 식으로 옮겨 적었습니다."}, {"n": 14, "q": "다음 중 역률을 구하는 식은?", "c": ["소비전력(kW) ÷ 전원입력(kVA) × 100", "전원입력(kVA) ÷ 소비전력(kW) × 100", "전원입력 × 소비전력 × 100", "전원입력 × 소비전력 ÷ 100"], "a": 1, "w": "역률은 낮을수록 좋다.", "g": "용접기", "fix": ""}, {"n": 15, "q": "다음 중 효율을 구하는 식은?", "c": ["아크출력(kW) ÷ 소비전력(kW) × 100", "소비전력 ÷ 아크출력 × 100", "아크출력 × 소비전력 × 100", "아크출력 × 소비전력 ÷ 100"], "a": 1, "w": "효율은 높을수록 좋다.", "g": "용접기", "fix": ""}, {"n": 16, "q": "AW-300, 무부하 전압 80V, 아크 전압 30V인 교류 용접기의 역률과 효율은? (내부손실 4kW)", "c": ["역률 54%, 효율 69%", "역률 89%, 효율 72%", "역률 80%, 효율 72%", "역률 54%, 효율 80%"], "a": 1, "w": "소비전력 = 30×300 + 4,000 = 13,000W / 전원입력 = 80×300 = 24,000VA\n역률 = 13,000 ÷ 24,000 = 54.1%\n효율 = 9,000 ÷ 13,000 = 69.2%", "g": "용접기", "fix": ""}, {"n": 17, "q": "용접봉의 용착효율을 구하는 식은?", "c": ["용착금속의 중량 ÷ 사용한 용접봉의 중량 × 100", "사용한 용접봉의 중량 ÷ 용착금속의 중량 × 100", "용착금속의 중량 × 사용한 용접봉의 중량", "모재의 중량 ÷ 용착금속의 중량 × 100"], "a": 1, "w": "용접봉 소요량과 작업시간을 판단할 때 쓴다.", "g": "용접기", "fix": "보기를 식으로 옮겨 적었습니다."}, {"n": 18, "q": "필릿 용접에서 이론 목두께 a와 용접 다리 길이 z의 관계는?", "c": ["a ≒ 0.3z", "a ≒ 0.5z", "a ≒ 0.7z", "a ≒ 0.9z"], "a": 3, "w": "a = z × cos45° ≒ 0.707z", "g": "설계", "fix": ""}, {"n": 19, "q": "P 최대하중, D 재료의 지름, A 재료의 최초 단면적일 때 인장강도를 구하는 식은?", "c": ["P ÷ πD", "P ÷ A", "P ÷ A²", "A ÷ P"], "a": 2, "w": "인장강도 = 하중 ÷ 단면적", "g": "설계", "fix": ""}, {"n": 20, "q": "판 두께 10cm, 용접선 길이 200cm, 하중 9,000kgf일 때 인장응력은?", "c": ["4.5 kgf/cm²", "3.5 kgf/cm²", "2.5 kgf/cm²", "1.5 kgf/cm²"], "a": 1, "w": "σ = 9,000 ÷ (10 × 200) = 4.5 kgf/cm²", "g": "설계", "fix": ""}, {"n": 21, "q": "두께 9mm, 길이 150mm인 맞대기 용접부를 P = 3,000kg으로 당겼다면 인장응력은?", "c": ["약 5.1 kg/mm²", "약 25 kg/mm²", "약 2.2 kg/mm²", "약 4.2 kg/mm²"], "a": 3, "w": "σ = 3,000 ÷ (9 × 150) = 2.22 kg/mm²", "g": "설계", "fix": ""}, {"n": 22, "q": "최대 인장하중 800kgf, 판 두께 5mm, 용접선 길이 20cm일 때 용착금속의 인장강도는?", "c": ["0.8 kgf/mm²", "8 kgf/mm²", "80 kgf/mm²", "800 kgf/mm²"], "a": 1, "w": "단위를 mm로 통일. σ = 800 ÷ (5 × 200) = 0.8 kgf/mm²", "g": "설계", "fix": ""}, {"n": 23, "q": "하중 100N, 시험편의 최초 단면적 20mm²일 때 응력은?", "c": ["5 N/mm²", "10 N/mm²", "15 N/mm²", "20 N/mm²"], "a": 1, "w": "σ = 100 ÷ 20 = 5 N/mm²", "g": "설계", "fix": ""}, {"n": 24, "q": "용착금속의 인장강도가 45 kgf/mm²이고 안전율이 9일 때 허용응력은?", "c": ["5 kgf/mm²", "36 kgf/mm²", "53 kgf/mm²", "405 kgf/mm²"], "a": 1, "w": "안전율 = 인장강도 ÷ 허용응력 → 9 = 45 ÷ x → x = 5", "g": "설계", "fix": ""}, {"n": 25, "q": "용접봉의 큰 쪽 지름이 8mm, 작은 쪽이 7.5mm일 때 편심률은?", "c": ["3.3%", "5.2%", "6.7%", "7.6%"], "a": 3, "w": "편심률 = (8 − 7.5) ÷ 7.5 × 100 = 6.67% (3% 이내여야 하므로 불합격)", "g": "용접봉", "fix": ""}, {"n": 26, "q": "가변압식 토치의 팁 번호 400번으로 중성불꽃을 써서 1시간 용접할 때 아세틸렌 소비량은?", "c": ["800 ℓ", "1,600 ℓ", "2,400 ℓ", "400 ℓ"], "a": 4, "w": "가변압식(프랑스식) 팁 번호 = 1시간에 소비되는 아세틸렌의 양(ℓ). 400번 → 400ℓ", "g": "가스", "fix": ""}, {"n": 27, "q": "표준 불꽃으로 1시간 용접할 때 아세틸렌 소모량이 100ℓ인 팁은?", "c": ["고압식 200번 팁", "중압식 200번 팁", "가변압식 100번 팁", "불변압식 120번 팁"], "a": 3, "w": "가변압식은 시간당 아세틸렌 소비량(ℓ)으로 번호를 매긴다.", "g": "가스", "fix": ""}, {"n": 28, "q": "내용적 33.7ℓ 용기에 120 kgf/cm²가 충전되어 있을 때 대기압 환산 용적은?", "c": ["2,803 ℓ", "4,044 ℓ", "40,440 ℓ", "28,030 ℓ"], "a": 2, "w": "33.7 × 120 = 4,044 ℓ", "g": "가스", "fix": ""}, {"n": 29, "q": "33.7ℓ 산소 용기에 150 kgf/cm²로 충전했을 때 산소는 몇 ℓ인가?", "c": ["5,055 ℓ", "6,066 ℓ", "7,077 ℓ", "8,088 ℓ"], "a": 1, "w": "33.7 × 150 = 5,055 ℓ", "g": "가스", "fix": ""}, {"n": 30, "q": "35℃에서 150기압으로 내용적 40.7ℓ 용기에 충전했을 때 용기 속 산소량은?", "c": ["4,015 ℓ", "5,210 ℓ", "6,105 ℓ", "7,210 ℓ"], "a": 3, "w": "40.7 × 150 = 6,105 ℓ", "g": "가스", "fix": ""}, {"n": 31, "q": "표준불꽃으로 60분간 용접해 아세틸렌 200ℓ를 소비했다면 알맞은 가변압식 팁 번호는?", "c": ["100번", "200번", "300번", "400번"], "a": 2, "w": "가변압식 팁 번호 = 1시간 소비량(ℓ) = 200번", "g": "가스", "fix": ""}, {"n": 32, "q": "가변압식 팁 400번으로 중성불꽃을 써서 1시간 용접할 때 아세틸렌 소비량은?", "c": ["400 ℓ", "800 ℓ", "1,600 ℓ", "2,400 ℓ"], "a": 1, "w": "400번 → 시간당 400ℓ", "g": "가스", "fix": ""}, {"n": 33, "q": "가변압식 팁 200번으로 10시간 용접할 때 아세틸렌 소비량은?", "c": ["20 ℓ", "200 ℓ", "2,000 ℓ", "4,000 ℓ"], "a": 3, "w": "200 × 10 = 2,000 ℓ", "g": "가스", "fix": "원본은 보기 다·라가 둘 다 2,000으로 되어 있어 라를 4,000으로 고쳤습니다."}, {"n": 34, "q": "내용적 40ℓ, 충전 압력 150 kgf/cm²인 산소용기가 100 kgf/cm²까지 내려갔다면 소비한 산소량은?", "c": ["2,000 ℓ", "3,000 ℓ", "4,000 ℓ", "5,000 ℓ"], "a": 1, "w": "40 × (150 − 100) = 2,000 ℓ", "g": "가스", "fix": ""}, {"n": 35, "q": "내용적 40.7ℓ 용기에 100 kgf/cm²로 충전. 프랑스식 100번 팁으로 표준불꽃 용접이 가능한 시간은?", "c": ["약 16시간", "약 22시간", "약 31시간", "약 40시간"], "a": 4, "w": "충전량 = 40.7 × 100 = 4,070ℓ, 시간당 100ℓ → 40.7시간", "g": "가스", "fix": ""}, {"n": 36, "q": "규격 AW 300인 교류 아크 용접기의 정격 2차 전류 범위는?", "c": ["0~300 A", "20~330 A", "60~330 A", "120~430 A"], "a": 3, "w": "정격 2차 전류의 20~110% → 300 × 0.2 = 60, 300 × 1.1 = 330", "g": "용접기", "fix": ""}, {"n": 37, "q": "15℃ 15기압에서 아세톤 2ℓ에 아세틸렌은 몇 ℓ가 용해되는가?", "c": ["150 ℓ", "225 ℓ", "375 ℓ", "750 ℓ"], "a": 4, "w": "아세틸렌은 1기압에서 아세톤에 25배 녹는다. 25 × 15기압 × 2ℓ = 750ℓ", "g": "가스", "fix": ""}, {"n": 38, "q": "A 병 전체 무게, B 빈 병 무게일 때 용해 아세틸렌 가스의 양 C(ℓ)를 구하는 식은?", "c": ["C = 905(B − A)", "C = 905 + (B − A)", "C = 905(A − B)", "C = 905 + (A − B)"], "a": 3, "w": "줄어든 무게(kg)에 905를 곱한다.", "g": "가스", "fix": ""}, {"n": 39, "q": "사용 전 50kgf, 사용 후 47kgf인 아세틸렌 병에서 사용한 아세틸렌 양은?", "c": ["2,915 ℓ", "2,815 ℓ", "3,815 ℓ", "2,715 ℓ"], "a": 4, "w": "905 × (50 − 47) = 2,715 ℓ", "g": "가스", "fix": ""}, {"n": 40, "q": "가스 절단면의 표준 드래그 길이는?", "c": ["판 두께의 1/2", "판 두께의 1/3", "판 두께의 1/5", "판 두께의 1/7"], "a": 3, "w": "표준 드래그는 판 두께의 약 1/5 (20%).", "g": "절단", "fix": ""}, {"n": 41, "q": "가스 절단 작업에서 표준 드래그 길이는 모재 두께의 몇 % 정도인가?", "c": ["5%", "10%", "20%", "25%"], "a": 3, "w": "1/5 = 20%", "g": "절단", "fix": ""}, {"n": 42, "q": "두께 25mm 연강판을 가스절단할 때 경제적인 표준 드래그 길이는?", "c": ["약 2mm", "약 5mm", "약 8mm", "약 10mm"], "a": 2, "w": "25 × 0.2 = 5mm", "g": "절단", "fix": ""}, {"n": 43, "q": "모재 두께가 1mm 이상일 때 용접봉 지름을 결정하는 식은? (D 지름, T 판두께)", "c": ["D = 1/2 + T", "D = 2/1 + T", "D = 2/T + 1", "D = T/2 + 1"], "a": 4, "w": "판 두께의 절반에 1을 더한다.", "g": "가스", "fix": ""}, {"n": 44, "q": "가스용접봉을 선택하는 식으로 옳은 것은?", "c": ["D = T/2 + 1", "D = T/2 + 2", "D = T/2 − 2", "D = T/2 − 1"], "a": 1, "w": "", "g": "가스", "fix": ""}, {"n": 45, "q": "모재 두께 2.0mm일 때 가스 용접봉의 지름은?", "c": ["2.0 mm", "2.6 mm", "3.2 mm", "4.0 mm"], "a": 1, "w": "2 ÷ 2 + 1 = 2 mm", "g": "가스", "fix": ""}, {"n": 46, "q": "두께 3.2mm 연강판을 V형 맞대기 이음할 때 알맞은 가스 용접봉 지름은?", "c": ["4.6 mm", "3.2 mm", "3.6 mm", "2.6 mm"], "a": 4, "w": "3.2 ÷ 2 + 1 = 2.6 mm", "g": "가스", "fix": ""}, {"n": 47, "q": "연강판 두께 6.0mm를 가스 용접할 때 알맞은 용접봉 지름은?", "c": ["1.6 mm", "2.6 mm", "4.0 mm", "5.0 mm"], "a": 3, "w": "6 ÷ 2 + 1 = 4 mm", "g": "가스", "fix": ""}, {"n": 48, "q": "연강판 두께 4.4mm를 가스 용접할 때 알맞은 용접봉 지름은?", "c": ["1.0 mm", "1.6 mm", "2.0 mm", "3.2 mm"], "a": 4, "w": "4.4 ÷ 2 + 1 = 3.2 mm", "g": "가스", "fix": ""}, {"n": 49, "q": "가스 용접봉의 지름이 2.6mm일 때 알맞은 강판의 두께는?", "c": ["1.6 mm", "3.2 mm", "4.5 mm", "6.0 mm"], "a": 2, "w": "2.6 = T ÷ 2 + 1 → T ÷ 2 = 1.6 → T = 3.2 mm", "g": "가스", "fix": ""}, {"n": 50, "q": "KS에 규정된 연강용 가스 용접봉의 지름(mm)에 해당하지 않는 것은?", "c": ["1.6", "4.2", "3.2", "5.0"], "a": 2, "w": "KS 규격 지름은 1.0 · 1.6 · 2.0 · 2.6 · 3.2 · 4.0 · 5.0 · 6.0. 4.2는 없다.", "g": "가스", "fix": ""}, {"n": 51, "q": "가스 용접 작업에서 보통 압력 조정기의 산소 압력은 몇 kgf/cm² 정도인가?", "c": ["5~6", "3~4", "1~2", "0.1~0.3"], "a": 2, "w": "산소 게이지 압력 3~4 kgf/cm², 아세틸렌 0.1~0.3 kgf/cm².", "g": "가스", "fix": "원본은 단위가 kgf/㎟로 적혀 있었습니다. cm²가 맞습니다."}, {"n": 52, "q": "형틀 굽힘(굴곡) 시험에서 시험편을 보통 몇 도까지 굽히는가?", "c": ["120°", "180°", "240°", "300°"], "a": 2, "w": "표면·이면 굽힘 모두 180°까지 굽힌다.", "g": "검사", "fix": ""}, {"n": 53, "q": "아크에어 가우징 작업 시 압축공기의 압력으로 옳은 것은?", "c": ["3~4 kgf/cm²", "5~7 kgf/cm²", "8~10 kgf/cm²", "11~13 kgf/cm²"], "a": 2, "w": "아크에어 가우징은 직류 역극성, 전압 35~45V, 압축공기 5~7 kgf/cm².", "g": "절단", "fix": "이론요약집 본문에는 3~7기압으로 적혀 있어 본문 쪽을 고쳤습니다."}, {"n": 54, "q": "수동 가스 절단기의 저압식 절단토치는 아세틸렌 압력이 보통 몇 kgf/cm² 이하에서 쓰이는가?", "c": ["0.07", "0.40", "0.70", "1.40"], "a": 1, "w": "저압식 0.07 이하 / 중압식 0.07~1.3 / 고압식 1.3 이상", "g": "가스", "fix": ""}, {"n": 55, "q": "MIG 용접의 전류 밀도는 피복 아크 용접에 비해 약 몇 배인가?", "c": ["2배", "6배", "10배", "12배"], "a": 2, "w": "피복아크의 6배, TIG의 2배.", "g": "특수용접", "fix": ""}, {"n": 56, "q": "모재의 인장강도 45 kgf/mm², 용접 시험편의 인장강도 47 kgf/mm²일 때 이음효율은?", "c": ["104%", "96%", "60%", "69%"], "a": 1, "w": "47 ÷ 45 × 100 = 104.4%", "g": "설계", "fix": ""}, {"n": 57, "q": "CO₂ 아크 용접의 보호가스 설비에서 저전류 영역의 가스 유량은?", "c": ["1~5 ℓ/min", "6~9 ℓ/min", "10~15 ℓ/min", "20~25 ℓ/min"], "a": 3, "w": "저전류 영역 10~15 ℓ/min, 고전류 영역 20~25 ℓ/min.", "g": "특수용접", "fix": ""}, {"n": 58, "q": "액체 CO₂ 25kg 용기의 가스량이 12,700ℓ일 때 20ℓ/min으로 연속 사용하면 몇 시간 쓰는가?", "c": ["60시간", "6시간", "10시간", "1시간"], "a": 3, "w": "12,700 ÷ 20 = 635분 = 10.6시간", "g": "특수용접", "fix": ""}, {"n": 59, "q": "CO₂ 아크 용접에서 인체에 위험한 상태가 되는 CO₂ 농도(체적 %)는?", "c": ["0.1% 이상", "3% 이상", "8% 이상", "15% 이상"], "a": 4, "w": "3~4%면 두통, 15% 이상이면 생명이 위험하다.", "g": "안전", "fix": ""}, {"n": 60, "q": "CO₂ 아크 용접 시 작업장의 CO₂가 몇 % 이상이면 인체에 위험한가?", "c": ["1%", "4%", "10%", "15%"], "a": 4, "w": "", "g": "안전", "fix": ""}, {"n": 61, "q": "서브머지드 아크 용접의 V형 맞대기에서 받침쇠가 없을 때 루트 간격은?", "c": ["0.8mm 이하", "1.2mm 이하", "1.8mm 이하", "2.0mm 이하"], "a": 1, "w": "간격이 크면 용융금속이 용락된다.", "g": "특수용접", "fix": ""}, {"n": 62, "q": "TIG 용접에서 직류 정극성으로 용접할 때 전극 선단의 각도로 가장 적합한 것은?", "c": ["5~10°", "10~20°", "20~50°", "60~70°"], "a": 3, "w": "정극성에서는 전극을 뾰족하게(20~50°) 갈아 쓴다.", "g": "특수용접", "fix": ""}, {"n": 63, "q": "테르밋 용접에서 산화철 분말과 알루미늄 분말의 중량비로 옳은 것은?", "c": ["1~2 : 1", "3~4 : 1", "5~6 : 1", "7~8 : 1"], "a": 2, "w": "산화철 3~4 : 알루미늄 1. (묻는 순서를 바꿔 \"알루미늄과 산화철의 비\"로 물으면 1 : 3~4가 된다.)", "g": "특수용접", "fix": "원본은 \"알루미늄 분말과 산화철 분말의 중량비\"라고 물으면서 보기는 산화철 기준이라 앞뒤가 맞지 않았습니다. 묻는 순서를 바로잡았습니다."}, {"n": 64, "q": "아세틸렌가스는 몇 ℃ 이상이면 산소 없이도 자연폭발하는가?", "c": ["406℃", "505℃", "780℃", "850℃"], "a": 3, "w": "자연발화 406~408℃, 분해폭발 505~515℃, 산소 없이도 폭발 780℃.", "g": "가스", "fix": ""}, {"n": 65, "q": "구멍이 13개, 한 칸의 간격이 20mm인 도면에서 A 부분의 치수는?", "c": ["100", "120", "240", "260"], "a": 3, "w": "(13 − 1) × 20 = 240", "g": "제도", "fix": ""}, {"n": 66, "q": "안지름 550mm, 두께 6mm, 높이 900mm인 원통을 만들 때 필요한 철판 크기는?", "c": ["900 × 1,709", "900 × 1,727", "900 × 1,747", "900 × 1,765"], "a": 3, "w": "안지름 기준 전개 길이 = (550 + 6) × 3.1416 = 1,746.7 ≒ 1,747", "g": "제도", "fix": ""}, {"n": 67, "q": "전압 200V, 전류 50A일 때 전력 P는?", "c": ["1 kW", "10 kW", "20 kW", "30 kW"], "a": 2, "w": "P = 200 × 50 = 10,000W = 10 kW", "g": "전기", "fix": ""}, {"n": 68, "q": "전기 모터의 마력이 5 HP라면 전력은?", "c": ["2 kW", "3.73 kW", "5.23 kW", "7.23 kW"], "a": 2, "w": "1 HP = 746W → 5 × 746 = 3,730W = 3.73 kW", "g": "전기", "fix": ""}, {"n": 69, "q": "전압 200V, 전류 50A일 때 저항 R은?", "c": ["2 Ω", "4 Ω", "6 Ω", "8 Ω"], "a": 2, "w": "R = E ÷ I = 200 ÷ 50 = 4 Ω", "g": "전기", "fix": ""}, {"n": 70, "q": "직렬 접속에서 R₁ = 4Ω, R₂ = 5Ω, R₃ = 10Ω일 때 합성저항은?", "c": ["15 Ω", "17 Ω", "19 Ω", "21 Ω"], "a": 3, "w": "직렬은 그냥 더한다. 4 + 5 + 10 = 19 Ω", "g": "전기", "fix": ""}, {"n": 71, "q": "병렬 접속에서 R₁ = 4Ω, R₂ = 5Ω, R₃ = 10Ω일 때 합성저항은?", "c": ["1.8 Ω", "18 Ω", "19 Ω", "1.9 Ω"], "a": 1, "w": "1/R = 1/4 + 1/5 + 1/10 = 0.25 + 0.2 + 0.1 = 0.55 → R = 1 ÷ 0.55 = 1.82 ≒ 1.8 Ω", "g": "전기", "fix": "원본 풀이에는 1.9로 적혀 있었으나 계산하면 1.82입니다."}, {"n": 72, "q": "1차 입력 22kVA, 전원 전압 220V일 때 퓨즈 용량은?", "c": ["1,000 A", "100 A", "10 A", "1 A"], "a": 2, "w": "22,000 ÷ 220 = 100 A", "g": "전기", "fix": ""}, {"n": 73, "q": "200V용 아크 용접기의 1차 입력이 15kVA일 때 퓨즈 용량은?", "c": ["65 A", "75 A", "90 A", "100 A"], "a": 2, "w": "15,000 ÷ 200 = 75 A", "g": "전기", "fix": ""}, {"n": 74, "q": "1차 입력 10kVA, 전원 전압 200V일 때 퓨즈 용량은?", "c": ["50 A", "100 A", "150 A", "200 A"], "a": 1, "w": "10,000 ÷ 200 = 50 A", "g": "전기", "fix": ""}, {"n": 75, "q": "변압기의 1차 코일 20회, 2차 코일 10회, 1차 전압 220V일 때 2차 전압은?", "c": ["55 V", "110 V", "220 V", "440 V"], "a": 2, "w": "E₁ : E₂ = N₁ : N₂ → 220 : E₂ = 20 : 10 → E₂ = 110 V", "g": "전기", "fix": ""}, {"n": 76, "q": "변압기의 1차 전압 220V, 2차 전압 80V, 1차 전류 20A일 때 2차 전류는?", "c": ["55 A", "550 A", "440 A", "4,400 A"],   lsSet(LOGKEY, JSON.stringify(L));
}catch(e){} }
function mark(id, ok){ ST.q[id]= ok?1:2; save(); logStudy(ok); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* ★…★ → <mark> */
function em(s){ return esc(s).replace(/★([^★]+)★/g,'<mark>$1</mark>'); }
function el(h){ var d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; }
function go(h){ location.hash=h; }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('on');},1600); }
var $app=document.getElementById('app'), $title=document.getElementById('title'),
    $back=document.getElementById('back');
function setHead(t,s,b){ $title.innerHTML=esc(t)+'<span class="sub">'+esc(s||'')+'</span>';
  $back.classList.toggle('hide',!b); }
document.getElementById('home').onclick=function(){ go('#/'); };
$back.onclick=function(){ history.length>1?history.back():go('#/'); };
function killNav(){ var n=document.querySelector('.navbtns'); if(n) n.remove();
  document.body.classList.remove('hasnav'); }
function showRv(rv){ rv.classList.remove('hide');
  try{ requestAnimationFrame(function(){
    var r=rv.getBoundingClientRect(), nav=document.querySelector('.navbtns');
    var lim=window.innerHeight-(nav?nav.getBoundingClientRect().height:0)-10;
    if(r.bottom>lim||r.top<64) rv.scrollIntoView({block:(r.height>lim-80?'start':'end'),behavior:'smooth'});
  }); }catch(e){} }

/* ── 라우터 ── */
window.addEventListener('hashchange',render);
function render(){
  var h=(location.hash||'#/').replace(/^#/,''), m;
  killNav(); window.scrollTo(0,0);
  if((m=h.match(/^\/ch\/(\d+)$/))) return viewChapter(+m[1]);
  if((m=h.match(/^\/s\/(\d+)$/))) return viewSection(+m[1]);
  if(h==='/calc') return viewCalcHome();
  if((m=h.match(/^\/calc\/(all|wrong|[^\/]+)\/(quiz|book)$/))) return viewCalc(decodeURIComponent(m[1]),m[2]);
  if(h==='/fix') return viewFix();
  return viewHome();
}
function chStat(ci){
  var us=SEC.filter(function(s){return s.ch===CHS[ci];});
  var d=0; us.forEach(function(s){ if(ST.read[SEC.indexOf(s)]) d++; });
  return {n:us.length, done:d};
}
function calcStat(){
  var d=0, ok=0;
  CALC.forEach(function(q){ var v=ST.q['c'+q.n]; if(v){ d++; if(v===1) ok++; } });
  return {n:CALC.length, done:d, ok:ok};
}

/* ── 홈 ── */
function viewHome(){
  setHead('용접기능사 이론요약','이론 '+SEC.length+'절 · 계산문제 '+CALC.length+'문항',false);
  var cs=calcStat(), rd=0; SEC.forEach(function(s,i){ if(ST.read[i]) rd++; });
  var h='<div class="card pad" style="margin-top:14px">'+
    '<div class="ttl">이 자료에 대하여</div>'+
    '<p class="muted small" style="margin:6px 0 0">「용접기능사 이론요약집」(은갈치 윤용운) 28쪽과 계산문제 '+CALC.length+'문항을 옮긴 것입니다. '+
    '옮기면서 <b>틀린 곳 '+FIX.length+'군데를 바로잡았고</b>, 고친 자리는 본문에 <mark>이렇게</mark> 표시했습니다. '+
    '근거를 못 찾아 그대로 둔 항목은 정오표 맨 아래에 따로 적어 두었습니다.</p></div>';
  h+='<div class="sec-t">이론 요약</div><div class="glist">';
  CHS.forEach(function(c,i){
    var s=chStat(i);
    h+='<button class="gcard" onclick="go(\'#/ch/'+i+'\')"><span class="gt">'+esc(c)+'</span>'+
       '<span class="gm">'+s.n+'절 · 읽은 절 '+s.done+'</span>'+
       '<span class="bar"><i style="width:'+Math.round(100*s.done/s.n)+'%"></i></span></button>';
  });
  h+='</div><div class="sec-t">문제 풀기</div><div class="glist">'+
     '<button class="gcard" onclick="go(\'#/calc\')"><span class="gt">계산문제 '+CALC.length+'문항</span>'+
     '<span class="gm">푼 문항 '+cs.done+' · 정답 '+cs.ok+'</span>'+
     '<span class="bar"><i style="width:'+Math.round(100*cs.done/cs.n)+'%"></i></span></button></div>'+
     '<div class="sec-t">선생님용</div><div class="glist">'+
     '<button class="gcard" onclick="go(\'#/fix\')"><span class="gt">정오표 '+FIX.length+'건</span>'+
     '<span class="gm">원본에서 고친 곳과 그 이유</span></button></div>';
  $app.innerHTML=h;
}

/* ── 대단원 ── */
function viewChapter(ci){
  var name=CHS[ci]; if(!name) return go('#/');
  setHead(name,'',true);
  var h='<div class="ulist" style="margin-top:14px">';
  SEC.forEach(function(s,i){
    if(s.ch!==name) return;
    h+='<button class="unit'+(ST.read[i]?' done':'')+'" onclick="go(\'#/s/'+i+'\')">'+
       '<span class="unum">'+esc(s.no)+'</span><span class="ubody">'+
       '<span class="utitle">'+esc(s.t)+'</span>'+
       '<span class="umeta">'+(ST.read[i]?'읽음':'아직 안 읽음')+'</span></span></button>';
  });
  $app.innerHTML=h+'</div>';
}

/* ── 절 본문 ── */
function blockHTML(b){
  var t=b[0];
  if(t==='h') return '<h2>'+em(b[1])+'</h2>';
  if(t==='p') return '<p>'+em(b[1])+'</p>';
  if(t==='l') return '<ul>'+b[1].map(function(x){return '<li>'+em(x)+'</li>';}).join('')+'</ul>';
  if(t==='t'){
    var s='<div class="tblw"><table><thead><tr>'+
      b[1].map(function(x){return '<th>'+em(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    b[2].forEach(function(r){ s+='<tr>'+r.map(function(x){return '<td>'+em(x)+'</td>';}).join('')+'</tr>'; });
    return s+'</tbody></table></div>';
  }
  if(t==='f') return '<div class="fx"><div class="fn">'+em(b[1])+'</div><div class="ff">'+em(b[2])+'</div>'+
    (b[3]?'<div class="fd">'+em(b[3])+'</div>':'')+'</div>';
  if(t==='n') return '<div class="nt"><b class="nh">'+em(b[1])+'</b>'+em(b[2])+'</div>';
  return '';
}
function viewSection(i){
  var s=SEC[i]; if(!s) return go('#/');
  setHead(s.no+' '+s.t, s.ch, true);
  var h='<div class="theory" style="margin-top:6px">';
  s.b.forEach(function(b){ h+=blockHTML(b); });
  h+='</div>';
  if(s.tip) h+='<div class="tip"><b>한 줄 정리</b>'+em(s.tip)+'</div>';
  h+='<div class="act" style="margin-top:16px"><button class="btn primary" id="rd">'+
     (ST.read[i]?'읽음 취소':'읽음 표시')+'</button>';
  var prev=null,next=null;
  SEC.forEach(function(x,j){ if(x.ch===s.ch){ if(j<i&&(prev===null||j>prev)) prev=j; if(j>i&&(next===null||j<next)) next=j; } });
  if(prev!==null) h+='<button class="btn" onclick="go(\'#/s/'+prev+'\')">이전 절</button>';
  if(next!==null) h+='<button class="btn" onclick="go(\'#/s/'+next+'\')">다음 절</button>';
  h+='</div>';
  $app.innerHTML=h;
  document.getElementById('rd').onclick=function(){
    if(ST.read[i]) delete ST.read[i]; else ST.read[i]=1;
    save(); this.textContent=ST.read[i]?'읽음 취소':'읽음 표시';
    toast(ST.read[i]?'읽음으로 표시했습니다':'표시를 지웠습니다');
  };
}

/* ── 계산문제 ── */
function calcGroups(){
  var g={}; CALC.forEach(function(q){ g[q.g]=(g[q.g]||0)+1; }); return g;
}
function wrongCalc(){ return CALC.filter(function(q){ return ST.q['c'+q.n]===2; }); }
function viewCalcHome(){
  var cs=calcStat(), g=calcGroups(), wr=wrongCalc().length;
  setHead('계산문제', CALC.length+'문항', true);
  var h='<div class="card pad" style="margin-top:14px"><div class="ttl">푼 문항 '+cs.done+' / '+cs.n+
    (cs.done?' · 정답률 '+Math.round(100*cs.ok/cs.done)+'%':'')+'</div>'+
    '<div class="act"><button class="btn primary" onclick="go(\'#/calc/all/quiz\')">전체 풀기</button>'+
    '<button class="btn" onclick="go(\'#/calc/all/book\')">문제집으로 보기</button>'+
    (wr?'<button class="btn" onclick="go(\'#/calc/wrong/quiz\')">틀린 문제 '+wr+'개 다시</button>':'')+
    '</div></div>';
  h+='<div class="sec-t">분류별</div><div class="ulist">';
  Object.keys(g).forEach(function(k){
    var qs=CALC.filter(function(q){return q.g===k;});
    var d=qs.filter(function(q){return ST.q['c'+q.n];}).length;
    h+='<button class="unit" onclick="go(\'#/calc/'+encodeURIComponent(k)+'/quiz\')">'+
       '<span class="unum">'+g[k]+'</span><span class="ubody">'+
       '<span class="utitle">'+esc(k)+'</span>'+
       '<span class="umeta">푼 문항 '+d+' / '+g[k]+'</span></span></button>';
  });
  $app.innerHTML=h+'</div>';
}
function qCardHTML(q, label){
  var h='<div class="card pad q"><div class="qhead"><span class="qno">'+esc(label)+'</span>'+
    '<span class="badge">'+esc(q.g)+'</span><span class="badge" style="background:transparent;color:var(--muted)">원본 '+q.n+'번</span>'+
    (q.fix?'<span class="badge f">문제 수정</span>':'')+'</div>'+
    '<div class="qstem">'+esc(q.q)+'</div><div class="chwrap">';
  q.c.forEach(function(c,i){
    h+='<button class="ch" data-c="'+(i+1)+'"><span class="k">'+KCH[i]+'</span>'+esc(c)+'</button>';
  });
  return h+'</div><div class="act"></div><div class="reveal hide"></div></div>';
}
function revealHTML(q, correct){
  var h='<span class="lab">'+(correct===true?'정답입니다 ✓':correct===false?'오답입니다 ✕':'정답')+'</span>'+
    '<div class="ansv">'+KCH[q.a-1]+' '+esc(q.c[q.a-1])+'</div>';
  if(q.w) h+='<div class="exp"><b>풀이</b>'+esc(q.w)+'</div>';
  if(q.fix) h+='<div class="exp"><b>원본에서 고친 곳</b>'+esc(q.fix)+'</div>';
  return h;
}
function paneBook(pane, qs){
  pane.innerHTML='<div class="act" style="margin:12px 0"><button class="btn" id="allon">정답 모두 보기</button>'+
    '<button class="btn" id="alloff">모두 감추기</button></div><div id="list"></div>';
  var list=document.getElementById('list');
  qs.forEach(function(q,i){
    var c=el(qCardHTML(q,'문항 '+(i+1)));
    c.style.marginTop='10px';
    var rv=c.querySelector('.reveal'), act=c.querySelector('.act');
    act.innerHTML='<button class="btn primary">정답·풀이 보기</button>';
    var btn=act.firstChild;
    function show(on){ rv.classList.toggle('hide',!on); btn.textContent=on?'풀이 접기':'정답·풀이 보기';
      if(on&&!rv.innerHTML) rv.innerHTML=revealHTML(q,null);
      c.querySelectorAll('.ch').forEach(function(b,ci){ b.classList.toggle('ok',on&&ci+1===q.a); }); }
    btn.onclick=function(){ show(rv.classList.contains('hide')); };
    c.querySelectorAll('.ch').forEach(function(b){ b.onclick=function(){ show(true); }; });
    c._show=show; list.appendChild(c);
  });
  document.getElementById('allon').onclick=function(){ list.childNodes.forEach(function(c){c._show(true);}); };
  document.getElementById('alloff').onclick=function(){ list.childNodes.forEach(function(c){c._show(false);}); };
}
function viewCalc(key, mode){
  var qs, name;
  if(key==='all'){ qs=CALC.slice(); name='계산문제 전체'; }
  else if(key==='wrong'){ qs=wrongCalc(); name='틀린 문제 다시 풀기'; }
  else { qs=CALC.filter(function(q){return q.g===key;}); name=key; }
  if(!qs.length){ setHead(name,'',true);
    $app.innerHTML='<div class="card pad empty">문항이 없습니다.</div>'; return; }
  setHead(name, qs.length+'문항', true);
  $app.innerHTML='<div id="pane"></div>';
  var pane=document.getElementById('pane');
  if(mode==='book') return paneBook(pane, qs);
  runQuiz(pane, qs, {title:name, backTo:'#/calc'});
}
function runQuiz(pane, qs, opt){
  opt=opt||{};
  var i=0, res=new Array(qs.length).fill(0);
  pane.innerHTML='<div class="progress"><div class="pbar"><i id="pb"></i></div>'+
    '<div class="pmeta"><span id="pm1"></span><span id="pm2"></span></div></div><div id="stage"></div>';
  var stage=document.getElementById('stage');
  var nav=el('<div class="navbtns"><button class="btn" id="prev">이전</button>'+
             '<button class="btn primary" id="next">다음</button></div>');
  document.body.appendChild(nav); document.body.classList.add('hasnav');
  var $prev=document.getElementById('prev'), $next=document.getElementById('next');
  $prev.onclick=function(){ if(i>0){ i--; draw(); } };
  $next.onclick=function(){ if(i<qs.length-1){ i++; draw(); } else finish(); };
  function draw(){
    var q=qs[i];
    document.getElementById('pb').style.width=Math.round(100*(i+1)/qs.length)+'%';
    document.getElementById('pm1').textContent=(i+1)+' / '+qs.length;
    var ok=res.filter(function(v){return v===1;}).length, no=res.filter(function(v){return v===2;}).length;
    document.getElementById('pm2').textContent='정답 '+ok+' / 채점 '+(ok+no);
    stage.innerHTML='';
    var c=el(qCardHTML(q,'문항 '+(i+1)));
    var rv=c.querySelector('.reveal');
    c.querySelectorAll('.ch').forEach(function(b){
      b.onclick=function(){
        var pick=+b.dataset.c;
        c.querySelectorAll('.ch').forEach(function(x){ x.disabled=true;
          var n=+x.dataset.c;
          if(n===q.a) x.classList.add('ok'); else if(n===pick) x.classList.add('no'); });
        var right = pick===q.a;
        res[i]= right?1:2; mark('c'+q.n, right);
        rv.className='reveal '+(right?'ok':'no');
        rv.innerHTML=revealHTML(q,right); showRv(rv);
        $next.textContent=(i<qs.length-1)?'다음':'결과 보기';
      };
    });
    if(res[i]){
      c.querySelectorAll('.ch').forEach(function(x){ x.disabled=true;
        if(+x.dataset.c===q.a) x.classList.add('ok'); });
      rv.className='reveal '+(res[i]===1?'ok':'no');
      rv.innerHTML=revealHTML(q,res[i]===1); rv.classList.remove('hide');
    }
    stage.appendChild(c);
    $prev.disabled = i===0;
    $next.textContent=(i<qs.length-1)?'다음':'결과 보기';
  }
  function finish(){
    killNav();
    var ok=res.filter(function(v){return v===1;}).length;
    var graded=res.filter(function(v){return v>0;}).length;
    var pct=graded?Math.round(100*ok/graded):0, pass=pct>=60;
    pane.innerHTML='<div class="card result"><div class="ring" style="background:'+
      (pass?'var(--ok-soft)':'var(--no-soft)')+';color:'+(pass?'var(--ok)':'var(--no)')+'">'+pct+'점</div>'+
      '<div style="font-weight:800;font-size:17px">'+esc(opt.title||'결과')+'</div>'+
      '<div class="muted small" style="margin-top:6px">'+graded+'문항 중 '+ok+'문항 정답 · 합격선 60점 '+
      (pass?'통과':'미달')+'</div><div class="act" style="margin-top:16px;justify-content:center">'+
      '<button class="btn" id="again">다시 풀기</button>'+
      '<button class="btn primary" id="tohome">돌아가기</button></div></div>';
    document.getElementById('again').onclick=function(){ i=0; res=new Array(qs.length).fill(0);
      pane.innerHTML=''; runQuiz(pane,qs,opt); };
    document.getElementById('tohome').onclick=function(){ go(opt.backTo||'#/'); };
  }
  draw();
}

/* ── 정오표 ── */
var GRN={A:'사실 오류',B:'단위·수치',C:'오타·표기'};
function viewFix(){
  setHead('정오표', FIX.length+'건 · 원본에서 고친 곳', true);
  var cnt={A:0,B:0,C:0}; FIX.forEach(function(f){ cnt[f.g]++; });
  var h='<div class="card pad" style="margin-top:14px">'+
    '<p class="muted small" style="margin:0">「용접기능사 이론요약집」을 옮기면서 확인한 오류입니다. '+
    '학생에게 나눠 주기 전에 한 번 훑어보시면 좋습니다.</p>'+
    '<div class="chips" id="chips">'+
    '<button class="chip on" data-g="">전체 '+FIX.length+'</button>'+
    '<button class="chip" data-g="A">사실 오류 '+cnt.A+'</button>'+
    '<button class="chip" data-g="B">단위·수치 '+cnt.B+'</button>'+
    '<button class="chip" data-g="C">오타·표기 '+cnt.C+'</button></div></div>'+
    '<div class="card" style="margin-top:12px" id="flist"></div>';
  $app.innerHTML=h;
  function draw(g){
    var list=FIX.filter(function(f){ return !g||f.g===g; });
    document.getElementById('flist').innerHTML = list.map(function(f){
      return '<div class="fix"><div class="fh"><span class="pg">'+esc(f.p)+'</span>'+
        '<span class="gr '+f.g+'">'+GRN[f.g]+'</span>'+
        '<span class="fk">'+esc(f.k)+'</span></div>'+
        '<div class="ba"><div class="o">'+esc(f.o)+'</div><div class="n">'+esc(f.n)+'</div></div>'+
        '<div class="fw">'+esc(f.w)+'</div></div>';
    }).join('') || '<div class="empty">해당하는 항목이 없습니다.</div>';
  }
  draw('');
  var NT=D.note;
  if(NT){
    var box=document.createElement('div'); box.className='card pad'; box.style.marginTop='12px';
    box.innerHTML='<div class="ttl" style="color:var(--warn)">'+esc(NT.title)+'</div>'+
      '<p class="muted small" style="margin:6px 0 0">'+esc(NT.body)+'</p>'+
      '<ul class="theory" style="margin:8px 0 0;padding:0;list-style:none">'+
      NT.items.map(function(x){return '<li style="position:relative;padding:5px 0 5px 17px;font-size:13.8px">'+
        '<span style="position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:1px;background:var(--warn);display:block"></span>'+
        esc(x)+'</li>';}).join('')+'</ul>';
    $app.appendChild(box);
  }
  document.querySelectorAll('#chips .chip').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#chips .chip').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); draw(b.dataset.g);
    };
  });
}

/* ── 시작 ── */
function boot(){
  if(!SEC.length){ $app.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; return; }
  render();
}
boot();
</script>
</body>
