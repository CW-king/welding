부를 메운 뒤 아크를 끊는다.","explain":"용접 비드 마무리 지점(크레이터)은 급랭 수축으로 크레이터 균열 및 기공이 생기기 아주 쉬우며, 함몰 부위를 전용 크레이터 제어 기능 하에 원형으로 2~3회 나선 회전 운봉하여 완전히 메운 다음 아크를 꺼 주는 것이 정석 크레이터 처리법입니다."},{"n":51,"type":"mcq","stem":"솔리드와이어 필릿용접 시 비드 표면에 핀홀 및 벌집형 다공 기공 결함이 빈발하게 군집 형성되는 원인 요인 중 용접 기계적 트러블과 관련된 직접적 원인으로 타당한 것은?","choices":["가스 조정기 입구가 동결되어 이산화탄소 실드가스 유량이 중단 또는 저하되었을 때","와이어 스풀의 회전 속도가 용접 전류에 동반 반응하여 스스로 감축했을 때","와이어 송급 장치의 지그가 모재에 대해 90도 정수각으로 배치되었을 때","용접기 1차 케이블의 단면적이 100㎟로 비상식적으로 너무 굵게 시공되어 있을 때"],"answerIndex":1,"answerText":"① 가스 조정기 입구가 동결되어 이산화탄소 실드가스 유량이 중단 또는 저하되었을 때","explain":"가스 레귤레이터 동결 등으로 가스 공급이 차단되어 실드막이 유실되면, 용융 금속이 공기 중에 완전 무방비 노출되어 질소 분진 등이 가공 기입되면서 대량의 다공 기공(Blowhole)을 야기합니다."},{"n":52,"type":"mcq","stem":"솔리드와이어(Solid Wire)와 플럭스코어드와이어(Flux Cored Wire / FCAW)의 야금 공학적 및 형태학적 근본 차이점을 가장 적합하게 해독한 설명은?","choices":["솔리드와이어는 내부에 미립 슬래그 형성제가 채워져 있는 튜브형 구조이다.","솔리드와이어는 단면 전체가 균일한 금속 심선 단일체여서 슬래그 발생량이 매우 적다.","플럭스코어드와이어는 심선 없이 구리 코일로만 구성된 전도성 파이프이다.","두 와이어의 전기 전도 특성은 완전히 대조적이며 직류 전원은 솔리드와이어만 전담한다."],"answerIndex":2,"answerText":"② 솔리드와이어는 단면 전체가 균일한 금속 심선 단일체여서 슬래그 발생량이 매우 적다.","explain":"솔리드와이어는 내부가 비어있지 않은 단일 순금속 성분의 합금 와이어로, 플럭스 성분이 들어있지 않기 때문에 비드 사후 슬래그(Slag)가 거의 형성되지 않아 청소 효율이 우수한 특징을 지니고 있습니다."},{"n":53,"type":"mcq","stem":"T형 필릿용접부 비드 각장 양끝의 '발 길이(다리길이)'가 비대칭적(예: 수평판 각장 14mm, 수직판 각장 8mm)으로 무너져 용착 불량이 발생하였다. 이러한 현상의 주된 작업 조작상 실수 원인은?","choices":["수평판과 수직판 사이에서 토치 작업각 45°를 지키지 못하고 한쪽으로 치우쳐 진행했을 때","전격방지기의 설치 경사 각도가 90도로 직립되어 무부하 전압이 계속 그대로 유지되고 있을 때","와이어 표면 구리 도금의 두께가 비정상적으로 얇아져 거의 완전히 소멸되었을 때","용접 전원의 출력 전류를 40A 이하로 지나치게 낮게 제어하여 시공하였을 때"],"answerIndex":1,"answerText":"① 수평판과 수직판 사이에서 토치 작업각 45°를 지키지 못하고 한쪽으로 치우쳐 진행했을 때","explain":"각장의 불균형(비대칭 비드)은 수평판과 수직판 사이에서 균등하게 45° 작업각을 유지하지 못하고 아크를 특정판 측으로 치우치게 조준했거나, 눕혀 시공했을 때 한쪽 판으로 열이 가 과도하게 집중되어 녹아내리면서 발생합니다."},{"n":54,"type":"mcq","stem":"용접 구조물의 외관 기밀 성능을 판독하기 위해, 비파괴 시험(NDT) 기호 중 용접부 이음새 주위에 액체 침투 반응액을 도포한 후 미세 표면 균열을 육안으로 침투 탐상 추출하는 시험 기호 명칭은?","choices":["RT","UT","PT","MT"],"answerIndex":3,"answerText":"③ PT","explain":"RT는 방사선 투과 시험, UT는 초음파 탐상 시험, PT는 침투 탐상 시험(Liquid Penetrant Test), MT는 자분 탐상 시험을 각각 대변합니다. 표면 균열 탐지에는 PT가 널리 쓰입니다."},{"n":55,"type":"mcq","stem":"작업 후 사후 정리정돈 및 안전 규칙에 해당되는 3정 5행 체제 중, 직장 현장의 불필요한 보관 부재, 시험편 편재 부속들을 완전히 판정 분류하여 과감하게 정리 소거 처분하는 행동 수칙의 정식 한글 명칭은?","choices":["정리 (Seiri)","정돈 (Seiton)","청소 (Seiso)","청결 (Seiketsu)"],"answerIndex":1,"answerText":"① 정리 (Seiri)","explain":"5행의 대전제 첫 단추인 '정리(Seiri)'란 현장의 물품 중 필요한 것과 불필요한 것을 정확히 식별 판정하여, 불필요한 대상물은 완전히 용적 소거하고 처분하는 폐기 일련 과정을 뜻합니다. 필요한 것을 제자리에 놓는 것은 정돈입니다."},{"n":56,"type":"short","stem":"T형 필릿용접 조인트 설계 시 다리길이(각장)가 h = 10.0 mm인 등각장 결합일 때, 설계 인장 강도 검증의 중심 기준 인자인 기하학적 '이론 목두께(a)'를 계산 공식을 대입하여 소수점 첫째 자리(mm 단위)까지 명확히 구하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"7.1 mm (또는 7.07 mm)","explain":"공식 a = h * cos(45°) ≒ h * 0.707을 대입합니다. a = 10.0 mm * 0.7071 = 7.071 mm 이므로, 소수점 둘째 자리에서 반올림을 조치하여 단답식 첫째 자리까지 표기하면 정답은 '7.1 mm'가 완벽 도출됩니다."},{"n":57,"type":"short","stem":"과정평가형 외부실기 치수 적합성 기준에 근거하여, 설계도상 기밀 지정된 다리길이 규격 각장 h = 12.0 mm 인 T-필릿 비드를 완성하였다. 감점 누적 처리를 받지 않고 무난히 통과되는 실제 외관 검사 측정상의 '허용되는 최소 각장(다리길이) 치수(mm 단위)'를 계산하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"9.6 mm","explain":"각장 허용공차 -20%~+50%의 하한을 적용해 12.0×(1-0.20)=9.6mm. 현장·규격에 따라 AWS D1.1의 -1.6mm 기준을 써 10.4mm로 보기도 한다."},{"n":58,"type":"short","stem":"수평 필릿용접 결합부의 기계 파단 저항 안전 강도를 검산하고자 한다. 이음 용접 유효 비드 단면에 총 작용하는 외부 전단 하중이 P = 5,000 N 이며, 기하 설계 목두께와 유효 비드 길이를 곱해 산출한 유효 목단면적(Throat Area)이 A = 250 ㎟ 로 확보되었다면, 전단 응력(Shear Stress)의 단면 가해 압력 강도를 MPa(N/㎟) 단위로 정수로 정확히 계산하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"20 MPa (또는 20 N/㎟)","explain":"응력(Stress) 계산 공식 σ = 하중(P) / 면적(A)을 이용합니다. 공식 대입: σ = 5,000 N / 250 ㎟ = 20 N/㎟ (MPa) 입니다. 따라서 공학 응력 정수 정답은 20 MPa 입니다."},{"n":59,"type":"short","stem":"GMAW/CO2 반자동 용접 작업을 수행 시 용접 전류 I = 200 A, 아크 전압 V = 25 V 세팅 조정을 수립하고, 진행 운봉 이동속도를 v = 15 cm/min 으로 유지하여 시공하였다. 이때 용접 비드 유효길이 1cm당 용융 야금학적으로 투입되는 공학적 '용접 입열량(Heat Input)'을 공식 대입하여 J/cm 단위를 기준으로 정확히 계산하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"20,000 J/cm","explain":"용접 입열량 공식: H = 60 * I * V / v (단, v속도는 cm/min 기준일 때 J/cm가 도출됨)을 적용합니다. H = 60 * 200 * 25 / 15 = 300,000 / 15 = 20,000 J/cm 입니다. 입열량 정답은 20,000 J/cm 입니다."},{"n":60,"type":"short","stem":"기계 정격 사양 아크 사용률 40%, 정격 출력 2차측 250A 전기 용접 장비를 사용하여, 실제 전공 실무 운봉 시 아크 전류를 I = 150A 로 하향 제어하여 안전 시공하고자 한다. 이때 용접기 수명을 해치지 않고 하루 작업 중 가동 가능한 '허용 사용률(%)'의 최대 전력 가용 수치 범위를 소수점을 절삭한 최종 정수(%) 단위로 구하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"111 %","explain":"허용사용률 계산 공식: 허용사용률 = 정격사용률 * (정격전류 / 실제사용전류)^2 입니다. 수식 대입: 40% * (250 / 150)^2 = 40% * (1.6667)^2 = 40% * 2.7778 = 111.11% 가 최종 계산됩니다. 소수점 아래를 절사 정수 표기하여 정답은 111% 입니다."},{"n":61,"type":"short","stem":"과정평가형 외부 기계 시험인 파면시험(T-Joint Fracture Test)을 이행한 결과, 시험 부재의 총 결합 용접 비드 유효 길이가 L = 120 mm 로 확보된 상태였다. 강제 파단 개방 후 돋보기 단면 검사를 한 결과, 용접 루트 단면에 기공 및 불착 결함 없이 정상적으로 융착 용융된 누적 기계적 합산 길이가 72 mm 로 확보되었다면 본 시편의 '파면합격률(%)'을 구하여 정수 단위로 쓰시오.","choices":[],"answerIndex":null,"answerText":"60 %","explain":"파면합격률(%) 계산식: (정상 루트 융착 누적 길이 / 총 용접 비드 유효 길이) * 100을 적용합니다. 계산식 대입: (72 mm / 120 mm) * 100 = 0.60 * 100 = 60% 입니다. 합격 기준인 50% 이상을 만족하므로 최종 정답률은 60% 가 도출됩니다."},{"n":62,"type":"short","stem":"용접 구조물의 유해 결함 종류 중, 아크 열량이 지나치게 세거나 운봉 진행 조작 속도가 지나치게 빠를 때 비드 표면 가장자리 경계와 모재 모서리가 부분적으로 깊고 오목하게 녹아 파인 상태로 남은 채 마감 비드로 보수 채워지지 않아 인장 전단 균열의 응력집중 노치가 되는 불합격 표면 결함 명칭은?","choices":[],"answerIndex":null,"answerText":"언더컷 (Undercut)","explain":"비드 상단이나 양 발끝을 따라 모재가 가혹한 전류 과다나 과속 조작에 의해 홈으로 남은 채 채워지지 않는 대표 불량 현상을 '언더컷(Undercut)'이라고 명명합니다."},{"n":63,"type":"short","stem":"구조 평판 조립 및 시공 시 가열 수축 응력 작용에 따른 각변형 및 뒤틀림 뒤틀림 현상을 예방 제어하기 위해, 가용접 가조립 단계에서 미리 수축 반대 방향 각도로 약 2° ~ 3°가량 꺾어서 배치 조립 고정하는 변형 제어 시공 공법의 정식 명칭은?","choices":[],"answerIndex":null,"answerText":"역변형법 (Reverse Deformation Method)","explain":"열화 변형 발생 방향과 정확하게 동 대칭 반대 방향으로 인위적인 역방향 굴곡 경사각을 미리 주어 가접 조립한 다음, 본용접 열수축 응력을 평판 상태로 회생시키는 정합 변형 예방 기술을 '역변형법'이라 합니다."},{"n":64,"type":"short","stem":"직류 용접 아크 전기를 사용하여 작업대 위에서 비드 운봉 조작 시, 가선 전선 및 도체 지그 주변의 전기 자기장 불균형 작용에 기인해 아크가 자력선의 끌림 현상을 받아 중앙을 유지하지 못하고 특정 한 방향으로 요동치고 무섭게 휘어 쏠리는 해로운 물리적 이탈 현상의 명칭은?","choices":[],"answerIndex":null,"answerText":"자기 쏠림 (또는 아크 쏠림, Magnetic Arc Blow)","explain":"도선에 고전류가 흐르면 전기 자기장이 형성됩니다. 이 자력선 흐름이 한쪽으로 밀집되면 아크가 휩쓸려 치우치는 이탈 현상이 일어나는데, 이를 자기 쏠림(아크 쏠림)이라고 칭합니다. 교류 용접 전원 교체나 접지 위치 이격 분산 등으로 예방합니다."},{"n":65,"type":"short","stem":"보호가스 계통 조정 장치 가동 중, 액화 탄산가스 용기 메인 병밸브를 개방하여 상온 감압 방출 시 기화 잠열 가혹 반응에 의해 밸브 기어 유량관 내부 수분이 얼어붙어 통로가 막히거나 작동 불능이 초래되는 동결 파손을 예방 방어하기 위해 조정기 가스 유로 외함에 결선해 사용하는 전열 히터 전기 설비의 올바른 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"가열 가스 히터 (CO2 Regulator Heater)","explain":"액체 가스가 기체로 변화할 때 대량의 주변 열에너지를 기화 잠열로 환수 소모하므로 가압 밸브 내부가 즉시 영하로 냉각됩니다. 이를 오프 방지하기 위해 가습관 주변에 전선 코일을 결합한 AC 전력 110V/220V 가열 가스 히터를 사용해야 동결 오작동을 차단합니다."},{"n":66,"type":"short","stem":"한계 측정 장비인 마이크로미터 판독 시험 문제이다. 슬리브 상단 기준의 가로 지시선 눈금이 6.0 mm를 넘어 지나가 있고 하단의 0.5 mm 회전 지침 보조선 역시 명확하게 한 칸 완전히 노출되어 있으며, 회전하는 원통 심블(Thimble) 테두리의 지시 눈금 숫자가 '34'에 칼같이 마킹 일치하여 배열되어 있을 때 정밀 판독값을 mm 단위 숫자로 쓰시오.","choices":[],"answerIndex":null,"answerText":"6.84 mm","explain":"계산 조합 과정: 슬리브 주눈금 6.0 mm + 하단 0.5 mm 보온선 노출 확인 = 6.50 mm 대입. 여기에 미세 회전 회전 심블 판독값 34 / 100 = 0.34 mm 가산. 최종 판정: 6.50 + 0.34 = 6.84 mm 입니다."},{"n":67,"type":"short","stem":"보호 가스 종류의 비중 물리 특성 판별 문제이다. 표준 건조 상태 공기(질소, 산소, 아르곤 등 혼합 기체)의 평균 수치 분자량을 약 29.0 g/mol로 기준 정의하고, 이산화탄소 가스 분자 기체의 질량 화학 분자량을 44.0 g/mol 로 산출 정의할 때, 탄산가스의 공기 대비 무거운 비중 비률(소수점 둘째 자리까지의 비율 수치)을 구하여 기술하시오.","choices":[],"answerIndex":null,"answerText":"1.52 (또는 1.51 ~ 1.53 범위)","explain":"비중 산출 계산 과정: 44.0 (CO2) / 29.0 (공기) ≒ 1.5172 가 계산됩니다. 소수점 셋째 자리에서 반올림을 조치하여 둘째 자리까지 기입하면 정답은 '1.52' 또는 '1.517'이 도출되며, 공기보다 약 1.5배 무거워 용접 풀에 가라앉아 깔끔한 가스 담장을 이룸을 판별합니다."},{"n":68,"type":"short","stem":"용접 기호 및 가공 기호 판독 문제이다. 용접 이음 도면 설계 사양서 꼬리 및 용접 상세 기호 보조란에 알파벳 대문자로 'C' 라고 기재 표기되어 있을 때, 완성된 용접 비드 표면의 모난 가장자리 슬래그 적체부를 물리적으로 때려 깎아 다듬으라는 마감 가공 가공법 수칙의 한글 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"치핑 (Chipping)","explain":"치핑(Chipping) 가공은 영문 알파벳 대문자 'C'로 도면에 지정 규정합니다. 참고로 그라인딩은 G, 절삭가공 머시닝은 M, 해머링은 H로 매칭됩니다."},{"n":69,"type":"short","stem":"직장 정리정돈의 기본 초석인 3정 5행(정리, 정돈, 청소, 청결, 습관화) 운동을 추진하고 관리하기 위한 3정의 구체적인 '3가지 필수 대원칙' 구성요소들을 단어 단답형 명칭으로 바르게 기술하시오.","choices":[],"answerIndex":null,"answerText":"정위치, 정품, 정량","explain":"3정의 대의적 기본 3요소는, 지정된 명확한 구역 내에 물건을 적치하는 '정위치', 지정된 품질 규격을 통과한 물품인 '정품', 그리고 사전에 제한된 규정 수량만큼만 수용하는 '정량'으로 규격화되어 있습니다."},{"n":70,"type":"short","stem":"가스 실드 솔리드와이어 릴(스풀) 규격인 YGW 11 과 YGW 13 은 동일한 연강용 재질이나, 사용이 금지되거나 엄격 지정되는 매칭 보호가스의 종류가 상이하게 화학 설계되어 있습니다. 이 중 혼합 실드가스 전용 와이어로 지정된 'YGW 13'에 적용하는 아르곤과 탄산 혼합 충전 가스의 한글 정식 명칭(또는 화학식 기호)을 쓰시오.","choices":[],"answerIndex":null,"answerText":"Ar + CO2 (또는 아르곤 + 탄산가스 혼합 가스)","explain":"YGW 11 솔리드와이어는 순도 99.5% 이상의 순수 탄산가스(CO2 100%) 보호가스 하에서 가장 안정된 단락 아크 성능을 보이며, YGW 13 은 알루미늄/혼합 이행용으로 설계되어 알곤 가스와 탄산가스의 혼합가스(Ar + CO2) 조준 상태에서 스프레이 아크 및 최상의 통전 물성을 발휘하도록 정밀 기밀되어 있습니다. 참고 자료 및 출처 (References) 1. 한국산업인력공단 NCS 능력단위 교재: 솔리드와이어 필릿용접 (LM1601050212) 2. 국가검정 용접산업기사 필기 기출문제집 및 과정평가형 외부평가 기준(HRDK) 3. 창원기계공업고등학교 과정평가형 용접산업기사 실기 모의고사 기밀 문항 DB 4. 대한용접·접합학회 용접공학편람 및 설계 강도 역학 지표 표준 표준안"}]},"14":{"unit":14,"title":"솔리드와이어 맞대기용접","code":"LM1601050211","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1장. NCS 기반 핵심 공학 이론 요약"},{"t":"h3","v":"1.1 솔리드와이어 맞대기용접 도면 파악 및 홈 설계"},{"t":"p","v":"솔리드와이어 CO2 가스 아크 용접 맞대기 이음(Butt Joint)은 동일 평면상에 놓인 두 부재의 맞대기 면을 용접하는 정밀 접합 공정이다. 과정평가형 용접산업기사의 대표적 모재 설계 규격은 연강판(SS275) 50mm x 150mm x t9.0 2장을 사용하며, 용접 자세는 아래보기(1G/F), 수직(3G/V), 수평(2G/H)이 대표적이다. 완전 용입(Full Penetration)을 얻고 용착금속 내부의 결함을 원천 방지하기 위해 정밀한 홈(Groove) 개선 가공이 선행된다."},{"t":"table","rows":[["[공학적 개선 가공 기준 요약] 1. 개선 홈 형상: V형 맞대기 홈을 기본 채택한다. 홈 각도(Groove Angle)는 60°~70° 범위로 형성한다. 2. 베벨 각도(Bevel Angle): 수직선을 기준으로 한 개별 모재의 개선 각도로서 30°~35°를 유지한다. 3. 루트 면(Root Face): 용락(Burn-through) 현상을 방지하기 위해 핸드 그라인더 및 평줄을 이용하여 1.5~2.5mm 범위로 균일하게 가공한다. 4. 루트 간격(Root Gap): 시점과 종점의 루트 간격을 3.0mm 전후로 균일하게 설정하여 완전 용입(백비드 형성)을 도모한다."]]},{"t":"p","v":"다음 표는 1.2mm 연강용 솔리드와이어(YGW11)를 사용하여 t9.0 연강판 V형 맞대기 용접을 진행할 때의 자세별 정석 표준 조건표이다. 수험생은 아크 전압과 용접 전류의 상호적 비례 거동을 완전히 암기해야 한다."},{"t":"table","rows":[["용접 자세","용접 층(Pass)","와이어 지름","적정 전류(A)","아크 전압(V)","가스 유량(LPM)"],["아래보기(F)","1층(이자비드) 2,3층(표면)","O1.2 mm O1.2 mm","90 ~ 110 110 ~ 130","18 ~ 19 19 ~ 21","15 ~ 20 15 ~ 20"],["수직상진(V-Up)","1층(이자비드) 2,3층(표면)","O1.2 mm O1.2 mm","90 ~ 100 100 ~ 120","18 ~ 19 19 ~ 20","15 ~ 20 15 ~ 20"],["수평보기(H)","1층(이자비드) 2,3층(표면)","O1.2 mm O1.2 mm","90 ~ 105 100 ~ 120","18 ~ 19 19 ~ 21","15 ~ 20 15 ~ 20"]]},{"t":"h3","v":"1.2 용접 제어 패널 조작 및 크레이터 제어 원리"},{"t":"p","v":"CO2 용접기 제어 패널 조작은 용접 작업 전 필수적이다. 와이어 송급 속도는 아크의 용접 전류와 완전한 비례 관계를 가지며, 전압은 아크 길이를 직접 제어하는 독립 변수이다. 용착 거동 안정화를 위해 전면 패널의 크레이터(Crater) 제어 스위치 설정을 명확히 이해해야 한다."},{"t":"li","v":"크레이터 OFF 설정 (개별 제어): 토치 스위치를 누르면 용접 전류와 전압이 가해지며 아크가 즉시 발생하고, 스위치를 놓으면 즉시 소멸된다. 가용접(Tack)이나 짧은 점용접, 극박판 용접 시 주로 적용된다."},{"t":"li","v":"크레이터 ON 설정 (유 제어): 토치 스위치를 최초 누르면 초기 전류가 발생하고, 스위치를 놓으면 사전에 조절된 본 용접 전류/전압으로 이행하여 자기유지(Self-holding) 상태가 된다. 다시 한 번 토치 스위치를 누르면 미리 조절된 낮고 안정적인 크레이터 전류(보통 본 전류보다 30~40% 감압)로 전환되어 크레이터 부위의 용락을 방지하고 균열을 메운다. 최종적으로 스위치를 놓으면 아크가 소멸된다. 용접선이 길거나 다층 맞대기 용접 시 반드시 채택된다."},{"t":"h3","v":"1.3 자세별 정밀 운봉 기법 및 열쇠구멍(Key Hole) 제어"},{"t":"p","v":"이면비드(1차 백비드) 용접 시 결함이 없는 완전한 용입을 도모하기 위해서는 용접 아크 열원에 의해 개선 홈 하단의 루트 면 두 개가 동시에 균일하게 용융되어 동그란 구멍을 형성하는 열쇠구멍(Key Hole)의 개방 및 일정화가 완벽하게 이루어져야 한다."},{"t":"p","v":"1. 아래보기(F) 자세: 진행각은 진행 반대 방향으로 70°~80°, 작업각은 모재 수평면에 대해 90°를 엄격히 유지하며 루트 면 하단의 용융지와 키홀의 진행 상태를 보며 전진 속도를 미세 제어한다."},{"t":"p","v":"2. 수직 자세(V-Up): 진행각은 상진(아래에서 위로) 진행 방향으로 80°~90°의 수직에 가까운 각도를 취하고, 작업각은 90°를 준수한다. 수직 자세에서는 중력의 영향으로 용융지가 아래로 처지기 쉬우므로, 좁고 정밀한 위빙(반달형 또는 U자형)을 취하며 모재 개선 양 끝단에서 일시적으로 0.5초 머무르고 중앙부는 신속히 지나가는 속도 제어가 결함(언더컷, 융합 불량) 방지에 절대적이다."},{"t":"p","v":"3. 수평 자세(H): 진행각은 70°~80°, 작업각은 90°를 적용하되 중력으로 인해 비드가 아래쪽 모재로 처지는 것을 극복하기 위해 아크를 약간 위쪽 개선 면에 조준하여 운봉 각도를 수시로 밀세 보정한다. 용융지가 길게 흘러내리면 토치 진행 각도를 신속히 세워 아크 분사력으로 밀어 올려 비드 대칭을 유지한다."},{"t":"h3","v":"1.4 용접 변형 및 잔류응력 야금학적 제어 수칙"},{"t":"p","v":"용접이란 인위적인 국부 초고온 가열 후 급랭이 수반되므로 수축으로 인한 변형 및 기계적 성질을 악화시키는 인장 잔류응력의 형성이 필연적으로 발생한다. 수축 변형을 강제로 억제(구속)하면 내부 잔류응력이 대폭 증폭되며, 반대로 구속을 완전히 해제하면 잔류응력은 낮아지나 엄청난 뒤틀림과 치수 비틀림 변형이 초래된다. 따라서 공학적 상충(Trade-off) 관계에 기초하여 적절한 완화 대책이 필요하다."},{"t":"table","rows":[["[시공학적 변형 및 잔류응력 완화 공법] 1. 사전 역변형법: 용접 진행 과정에서 발생할 각변형량과 수축량을 설계 수치로 예측하여, 가용접 시 용접선 홈의 반대 방향으로 약 2°~5°의 역변형 각도를 사전에 인위적으로 부여하는 공법이다. 2. 시공 순서 조정법: 용접 진행 방향과 용착 방향을 반대로 취하는 후진법(좌에서 우로 토치 방향을 향하나 실제 진행은 우측에서 순차적으로 마감), 이음 중심을 기준 대칭으로 분산하는 대칭법, 구간을 나누는 비석법(스킵법) 등을 배합 적용한다. 3. 물리적 피닝법(Peening): 이면비드 용접 완료 직후 또는 비드가 고온 상태(약 700°C 이상)를 유지할 때, 둥근 머리를 가진 전용 해머로 비드 표면을 연속 타격하여 소성 변형을 유도함으로써 가해진 수축 인장 잔류응력을 거동 수축 완화 압축응력으로 상쇄시키는 공법이다."]]},{"t":"h2","v":"제2장. 대표 엄선 50제 평가 문항 및 상세 해설집"},{"t":"h2","v":"제1부. 진위형 (O / X) 문항 [1번 ~ 10번]"}],"questions":[{"n":1,"type":"mcq","stem":"CO2 솔리드와이어 맞대기 용접 시, 크레이터 OFF(개별) 모드는 아크 발생 도중에 수동으로 용접 전류와 전압을 실시간 가변 조정하여 용접 비드 폭을 넓힐 수 있는 기능이다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"크레이터 OFF(개별) 모드는 토치 스위치를 누르면 미리 조절된 정격 전류/전압이 통전되어 아크가 즉시 발생하고 스위치를 놓으면 즉시 아크가 꺼지는 단순 제어 방식이다. 실시간 수동 가변 가동을 유도하는 것과는 무관하며 가용접이나 점용접에 적합하다."},{"n":2,"type":"mcq","stem":"연강용 솔리드와이어 YGW11 규격은 용착금속의 최소 인장강도가 50 kgf/mm²급 이상임을 의미하며 표면에 전도성과 방청성(녹 방지)을 향상시키기 위해 구리(Cu) 도금이 주로 입혀져 있다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"YGW11 규격은 탄소강 및 50kgf/mm²급 고장력강용 가스실드 아크 용접용 솔리드 와이어를 나타내며, 신선 과정을 거쳐 표면에 전기 전도율 향상 및 녹 방지를 위해 구리(Cu) 피막 도금 처리가 되어 공급된다."},{"n":3,"type":"mcq","stem":"맞대기 용접 전에 가용접(Tack)을 진행할 때의 배치 간격은 모재 두께의 25배(25t) 전후가 가장 공학적으로 무난하며, 본용접 전류보다 약 20% 이상 낮은 소전류를 주어 가접 비드를 얇게 형성하는 것이 원칙이다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"가용접 시에는 짧은 비드로 인해 용접부 주위가 급격히 냉각(급랭)되어 저온 균열이 발생하기 쉬운 상태가 된다. 따라서 본 용접에서 이면까지의 충분한 용입과 융합을 도모하고 가용접부의 야금학적 취성을 방지하기 위해 가용접 전류는 본 용접보다 다소 높게(120~150A) 설정하여 튼튼하게 결합시키는 것이 정석이다."},{"n":4,"type":"mcq","stem":"용접부 가열 직후 급랭에 의해 수축을 강하게 구속 지그 등으로 억제하면 모재 내부에 발생하는 수축 비틀림 변형은 감소하는 반면, 재료 내부에 축적되는 인장 잔류응력은 대폭 증가한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"용접의 변형과 잔류응력은 상충 거동을 지닌다. 기계적 지그나 억제 기구를 통해 수축을 강제로 억제하면 외관상의 변형(각변형, 수축 등)은 제어할 수 있으나, 금속이 자유롭게 수축하지 못한 에너지 가 응력 상태로 재료 내부에 그대로 축적되어 인장 잔류응력이 최대로 형성된다."},{"n":5,"type":"mcq","stem":"수평 자세(H) V형 맞대기 용접에서 이면비드를 형성할 때, 중력에 의해 용착 용융지가 아래쪽 개선면으로 처지는 경향을 극복하기 위해 토치 진행각은 90° 수직각을 무조건 고수해야 한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"수평 자세에서는 용융지가 아래로 처지는 것을 방지하기 위해 토치의 진행 방향을 70°~80° 각도로 비드 끝을 유지하며 경사각을 정밀 조절해야 한다. 용융지가 타원형으로 길어지면 토치를 약간 세워 분사 아크 압력으로 처짐을 밀어 올려 형상을 제어한다."},{"n":6,"type":"mcq","stem":"용접 부위가 고온 상태(약 700°C 이상)일 때 타격을 가하여 인장 잔류응력을 가벼운 해머링 압축 소성 변형으로 완화해 주는 보수 공법을 피닝(Peening) 공법이라 칭한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"피닝(Peening) 공법은 용접 직후 고온 상태의 비드를 전용 라운드 해머로 가볍게 연속 타격하여 금속 내부에 소성 변형을 일으킴으로써 용접 시 축적된 유해한 인장 잔류응력을 완화시키는데 탁절한 효과를 발휘한다."},{"n":8,"type":"mcq","stem":"용접 절차의 핵심 사양서인 WPS(용접절차사양서)에서 필수 변수(Essential Variables)란 용접 공정의 물리적 기계적 강도 성능에 직접적 영향을 주는 중요 세팅 인자로, 변경 시 필히 PQ(절차인증시험)를 다시 실시해야 한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"WPS에서 필수 변수는 모재의 재질, 두께 범위, 용착금속 종류, 용접 프로세스 등 성능 검증에 핵심적인 인자들이다. 이 인자들이 수정·변경될 경우 기존 인정을 유실하므로 반드시 절차인증 기록인 PQR 시험을 처음부터 다시 가동하여 WPS를 개정해야 한다."},{"n":9,"type":"mcq","stem":"이면비드 완전 용입을 위해 1층 비드를 쌓을 때 개선 홈 폭 안쪽 하단부에 키홀(Key Hole)이 균일하게 발생하도록 토치 작업각 45°를 측면에 대해 단단히 유지하며 위빙을 넓게 주는 것이 아래보기 자세의 정석 수칙이다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"아래보기(F) 맞대기 용접 시 토치의 작업각은 모재 수평 기준선 및 개선 그루브 중앙선에 대해 정확히 수직인 90°를 준수하는 것이 정석이다. 작업각을 45°로 편심 조작하면 그루브 한쪽 벽면만 국부적으로 녹아들어 편용, 이면 용입 불량 및 단차 언더컷이 발생한다."},{"n":10,"type":"mcq","stem":"탄소강 SS275, 두께 9.0mm 강판을 수직(V-Up) V형 개선 맞대기 용접을 진행할 때, 층간 온도를 규제하기 위한 이면비드(1차) 완료 후 비드 표면의 적정 제어 온도는 보통 250°C 전후이다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"연강 및 저탄소강 맞대기 용접 시, 과도한 열 축적으로 인한 열영향부(HAZ)의 결정립 조대화 및 연성 저하를 방지하고 용접 품질의 일정성을 유지하기 위해 다층 용접 시 층간 온도는 250°C 내외를 상한선으로 조율하며 관리하는 것이 야금학적 정석이다. 제2부. 연결형 문항 [11번 ~ 15번] 다음 용접 공학적 설명 및 기호 기재 내용에 부합하는 항목끼리 올바르게 연결(매칭)하시오."},{"n":11,"type":"short","stem":"용접 결함 종류와 표준 거동 원인 매칭","choices":[],"answerIndex":null,"answerText":"(A) - (나), (B) - (다), (C) - (라), (D) - (가)","explain":"언더컷은 과대전류·긴 아크·고속 운봉으로 개선 끝이 파이고(나), 오버랩은 전류 과소·용착 과다로 모재를 덮으며(다), 선상조직은 급랭 결(라), 기공은 수소·질소가 갇힌 구멍(가)이다.","tables":[[["(A) 언더컷 (Undercut)","(가) 용융 용착물이 냉각 변태될 때 수소, 질소 기포가 빠져나가지 못하고 갇히는 현상"],["(B) 오버랩 (Overlap)","(나) 용접 전류가 과도하게 높고 아크 길이가 너무 길며 토치 속도가 빠를 때 개선 단면부가 파이는 현상"],["(C) 선상 조직 (Band structure)","(다) 전류가 과소하게 낮고 용착량이 느릴 때, 용융 용착물이 모재 위를 단순히 덮어 씌우는 형상 불량"],["(D) 기공 (Blowhole)","(라) 용접 비드 및 용융 야금이 너무 급속도로 냉각되어 금속 조직이 특정 방향으로 결을 형성하는 결함"]]]},{"n":12,"type":"short","stem":"ISO/KS 규격상 용접 자세 기호와 세부 동작 정의 매칭","choices":[],"answerIndex":null,"answerText":"(A) - (나), (B) - (다), (C) - (라), (D) - (가)","explain":"KS B ISO 6947 자세 기호로 PA=아래보기(나), PC=수평보기(다), PE=위보기(라), PF=수직상진(가)이며 PG는 수직하진이다.","tables":[[["(A) PA 자세","(가) 수직 자세 맞대기 용접에서 아래에서 위 방향으로 진행하는 수직상진 용접 (Vertical-Up)"],["(B) PC 자세","(나) 모재를 아래 바닥에 수평 평탄하게 고정하고 위에서 내려다보는 아래보기 용접 (Flat)"],["(C) PE 자세","(다) 모재가 수직 판이고 용접선이 수평 수평선과 평행하게 도열된 수평보기 용접 (Horizontal)"],["(D) PF 자세","(라) 작업자 머리 위의 모재 천장 면을 우러러보며 시공하는 고난도 위보기 용접 (Overhead)"]]]},{"n":13,"type":"short","stem":"맞대기 홈 용접부 표면 가공방법 기호 매칭","choices":[],"answerIndex":null,"answerText":"(A) - (다), (B) - (라), (C) - (가), (D) - (나)","explain":"표면 다듬질 보조기호는 영문 머리글자로 G=그라인딩(다), C=치핑(라), H=해머링(가), M=머시닝(나)이며 R=롤링, P=플래니싱이다.","tables":[[["(A) G 기호","(가) 해머링(Hammering) 다듬질에 의한 표면 보정 처리 지시"],["(B) C 기호","(나) 기계 머시닝(Machining) 정밀 깎기 가공에 의한 마감 처리 지시"],["(C) H 기호","(다) 그라인딩(Grinding) 연삭 숫돌휠 회전 다듬질에 의한 평탄 마감 처리 지시"],["(D) M 기호","(라) 치핑(Chipping) 정이나 해머 정 가압에 의한 표면 파내기 가공 처리 지시"]]]},{"n":14,"type":"short","stem":"용접부 수축 및 뒤틀림 변형 방지 시공 설계 공법 매칭","choices":[],"answerIndex":null,"answerText":"(A) - (다), (B) - (라), (C) - (가), (D) - (나)","explain":"역변형법은 반대 각을 미리 주어 고정(다), 후진법은 전체 진행과 반대로 끊어 메움(라), 스킵법은 건너뛰며 열을 분산(가), 피닝법은 비드 타격으로 인장응력 완화(나)이다.","tables":[[["(A) 사전 역변형법","(가) 용접 길이를 여러 개 짧은 구간으로 쪼개고 한 칸씩 건너뛰며 용접을 무질서 분산하는 비석 공법"],["(B) 후진법 (Backstep)","(나) 각 패스 완료 직후 비드 야금이 뜨거울 때 정밀 타격을 가해 가해진 인장 응력을 상쇄시키는 압축소성 완화법"],["(C) 스킵법 (Skip)","(다) 수축 뒤틀림 각도를 미리 예측하여 가접 시 모재를 반대 각으로 구부려 고정하는 변형 방지법"],["(D) 피닝법 (Peening)","(라) 토치 진행 방향을 우측으로 가되 실제 용착 비드는 좌측에서 끊어서 우측으로 메워가는 방향 완화법"]]]},{"n":15,"type":"short","stem":"강재 및 모재 규격 약어와 정의 매칭","choices":[],"answerIndex":null,"answerText":"(A) - (나), (B) - (다), (C) - (라), (D) - (가)","explain":"SS275=일반구조용 압연강, 항복 275MPa(나) / SM400=용접구조용 압연강, 인장 400MPa(다) / WT-20=토륨 2% 적색 텅스텐 전극봉(라) / SWR11=연강 선재로 심선재(가).","tables":[[["(A) SS275","(가) 피복아크용접 심선재로 사용되며 저탄소 림드강 강종 규격을 나타내는 명칭"],["(B) SM400","(나) 일반 구조용 연강판 철재로서 항복강도 하한 기준치가 275 MPa인 강재 규격 명칭"],["(C) WT-20","(다) 용접구조용 압연 강재로서 최소 인장강도 기준이 400 MPa인 고장력 계통의 강재 규격 명칭"],["(D) SWR11","(라) GTAW 용접에 쓰이는 2% 토륨 함유 텅스텐 전극봉(적색 식별용)을 나타내는 전문 코드"]]]},{"n":16,"type":"mcq","stem":"다음 중 CO2 가스 아크 용접 시 크레이터 ON(유) 상태에서 토치 스위치를 조작할 때 일어나는 작동 계통 순서로 가장 올바른 것은?","choices":["스위치를 계속 누르고 있는 동안에만 전류·전압이 가해지고 손을 놓는 즉시 아크가 꺼짐","최초로 누르면 고주파 불꽃이 전극봉을 청정시키고 놓으면 아르곤 보호가스만 단독으로 배출됨","최초 1회 누르면 본전류 아크 발생 → 놓으면 아크 전압 소멸 → 다시 누르면 크레이터 처리 완료","누르면 초기전류 → 놓으면 본 용접전류로 자기유지 → 다시 누르면 크레이터 전류 → 놓으면 소멸"],"answerIndex":4,"answerText":"④ 누르면 초기전류 → 놓으면 본 용접전류로 자기유지 → 다시 누르면 크레이터 전류 → 놓으면 소멸","explain":"크레이터 ON(유) 설정은 토치 조작의 편의와 크레이터 처리를 도모한다. 처음에 누르면 초기 전류, 놓으면 본 용접 전류/전압 상태로 아크가 유지(자기유지)되어 긴 용접선의 연속 시공을 돕고, 최종 마감 지점에서 다시 누르고 있으면 본 전류보다 낮게 설정된 크레이터 전류로 작동하여 비틀림 균열과 구멍을 메운 후 손을 떼면 비로소 아크가 안전하게 소멸된다."},{"n":17,"type":"mcq","stem":"t9.0 탄소강 강판에 V형 맞대기 그루브 가공을 실시할 때, 루트 면(Root Face)의 두께를 2.0mm로 일정하게 평줄로 다듬질 가공하는 목적과 가장 밀접한 용접 야금학적 이유는?","choices":["초층(1차) 이면비드 용접 시 과도한 열 농축에 의한 용융 용락(Burn-through) 현상을 물리적으로 방지하기 위함","개선 홈 양쪽에 부착되어 있는 밀 스케일의 산화막이 와이어와 융착되는 속도를 배가시키기 위함","맞대기 홈 각도를 90° 이상으로 가변 확대하여 용접 효율을 끌어올리기 위함","아크 전류의 흐름을 강제로 방해하여 입열량을 낮추기 위함"],"answerIndex":1,"answerText":"① 초층(1차) 이면비드 용접 시 과도한 열 농축에 의한 용융 용락(Burn-through) 현상을 물리적으로 방지하기 위함","explain":"루트 면(Root face)은 개선 홈 하단의 접합부 두께이다. 루트 면이 없거나 너무 가늘게 깎이면(예: 0.5mm 이하) 아크 열량을 견디지 못하고 이면 부분이 완전히 뻥 뚫려 흘러내리는 용락(Burn-through) 결함이 필연적으로 일어난다. 따라서 1.5~2.5mm 정도의 두께를 정밀 확보하여 아크를 지탱하며 안정적인 열쇠구멍을 형성해야 한다."},{"n":18,"type":"mcq","stem":"1.2mm 연강용 솔리드와이어(YGW11)를 사용하여 아래보기(F) 자세로 이면비드를 적정 적치하려 할 때, 가장 교재에서 지시하는 정석 표준 전류 및 전압 조건의 조합 범위는?","choices":["용접 전류 50~60 A, 아크 전압 12~14 V","용접 전류 100 A 전후, 아크 전압 18~19 V","용접 전류 250~300 A, 아크 전압 32~35 V","용접 전류 380~420 A, 아크 전압 36~42 V"],"answerIndex":2,"answerText":"② 용접 전류 100 A 전후, 아크 전압 18~19 V","explain":"탄소강 t9.0, 와이어 지름 1.2mm의 이면비드(초층 용접) 표준 조건은 전류 100A(±10A), 전압 18~19V 부근이다. 전류가 이보다 너무 낮으면 개선 하단 루트가 전혀 녹지 않아 이면 용입 부족이 생기고, 너무 과도하게 높으면(예: 150A 이상) 구멍이 뚫려 용락을 일으킨다."},{"n":19,"type":"mcq","stem":"CO2 용접에서 동일 와이어 송급 속도 조건일 때, 토치 노즐과 모재 사이의 간격 즉 '와이어 돌출 길이(Contact Tube to Work Distance)'를 인위적으로 너무 길게 뺐을 때 야금학적으로 즉각 일어나는 현상으로 옳은 것은?","choices":["용접 전류가 현저히 감소하고 아크가 불안정해지며 가스 실드가 흐트러져 기공이 발생한다.","아크의 정전압 자기제어 작동 한계치가 크게 확장되어 모재의 용입 깊이가 훨씬 깊어진다.","노즐에서 나오는 보호 아르곤 가스의 분사 압력이 배가되어 청정작용이 강화된다.","와이어 심선 내부의 규소·망가니즈 탈산 성분이 급격히 활성화되어 모두 증발한다."],"answerIndex":1,"answerText":"① 용접 전류가 현저히 감소하고 아크가 불안정해지며 가스 실드가 흐트러져 기공이 발생한다.","explain":"송급 속도가 고정된 조건에서 와이어의 돌출 길이가 증가하면, 와이어 심선 자체의 전기저항 열이 급증한다. 이에 따라 실제 아크 점에 가해지는 용접 전류는 종속적으로 확 떨어지게 된다. 또한 토치와 모재가 멀어져 노즐에서 분사되는 CO2 보호가스의 도달 실드가 불안정해지므로 대기 중의 산소와 질소가 침입하여 비드 내부에 벌집 모양의 기공(Blowhole)을 야기한다."},{"n":20,"type":"mcq","stem":"다음 중 피닝(Peening) 공법을 맞대기 이음 용접에 가동할 때 준수해야 할 사항으로 가장 타당하지 않은 것은?","choices":["용접 직후 또는 비드가 적정 고온 상태(700°C 이상)를 지닐 때 가볍게 타격을 가한다.","수축 인장 잔류응력을 거동 수축 상쇄로 완화시키는 것에 대단히 탁월하다.","초층 이면비드(1층 백비드) 표면을 강한 압축 에어로 먼저 피닝하면 백비드 품질이 최고조에 달한다.","타격 끝단이 구면(둥근 머리)으로 가공된 전용의 피닝 해머를 사용하는 것이 정석이다."],"answerIndex":3,"answerText":"③ 초층 이면비드(1층 백비드) 표면을 강한 압축 에어로 먼저 피닝하면 백비드 품질이 최고조에 달한다.","explain":"초층 이면비드(1차 백비드)는 두께가 얇고 기계적 구속력이 약한 상태이다. 여기에 강력한 피닝 타격을 가하면 용착 비드가 쪼개지는 파단 균열이 발생하거나 형상이 우그러지는 파손이 일어나므로, 초층 비드에는 원천적으로 피닝 작업을 적용해서는 안 된다. 주로 2층(중간층) 이상의 다층 용접 비드부에 순차 적용한다."},{"n":21,"type":"mcq","stem":"CO2 아크 용접 시 비드가 평탄하게 형성되지 못하고, 양쪽 끝 개선 모서리 면을 따라 깊은 홈으로 파여서 보강 살이 채워지지 않고 비어 있는 외관 구조적 불량 결함의 명칭은?","choices":["오버랩 (Overlap)","언더컷 (Undercut)","언더필 (Underfill)","용락 (Burn-through)"],"answerIndex":2,"answerText":"② 언더컷 (Undercut)","explain":"언더컷(Undercut)은 전류 과다, 너무 빠른 속도 또는 부정확한 토치 운봉 각도로 인해 비드 양끝 모재와의 교점(토우부) 영역이 아크 열에 파여 들어가 살이 채워지지 않고 함몰 구렁으로 남아 있는 대표적인 치수상 및 구조상 결함이다."},{"n":22,"type":"mcq","stem":"다음 중 물질안전보건자료(MSDS)를 용접 실습장에서 반드시 이행·관리해야 하는 사업주와 학생의 행동 수칙으로 틀린 것은?","choices":["사업장 내에 경고 표지를 작성하여 누구나 볼 수 있는 곳에 상시 부착한다.","용접 와이어, 탄산가스 실린더 등 화학물질이 입고되면 MSDS 해당 16개 항목 내용을 상시 게시 비치한다.","사용 와이어 화학 성분의 정확한 영문 학술 명칭은 극비 영업비밀에 해당하므로 학생들에게 비공개 고수해야 한다.","취급 학생들을 대상으로 화학 원소 유해성과 MSDS 경고 수칙 교육을 철저히 진행해야 한다."],"answerIndex":3,"answerText":"③ 사용 와이어 화학 성분의 정확한 영문 학술 명칭은 극비 영업비밀에 해당하므로 학생들에게 비공개 고수해야 한다.","explain":"화학 성분의 정확한 명칭과 안전 취급 규격은 MSDS의 핵심 요소로 수험생과 작업자의 안전을 위해 반드시 공개되고 비치되어야 한다. 영업비밀이라는 이유로 안전 정보를 누락하거나 비공개 처리를 임의 고수해서는 안 된다."},{"n":23,"type":"mcq","stem":"수직 자세(V-Up) V형 맞대기 용접 시, 다층 용접 2층(중간층)을 전개하려 할 때 1차 비드의 적정 표면온도 제어 하한과 2층 용접 적정 조건 조합으로 가장 알맞은 것은?","choices":["표면 온도 100°C 이하, 전류 50A, 전압 12V","표면 온도 250°C 전후, 전류 120A, 전압 20V","표면 온도 400°C 이상, 전류 250A, 전압 32V","표면 온도 600°C 이상, 전류 300A, 전압 38V"],"answerIndex":2,"answerText":"② 표면 온도 250°C 전후, 전류 120A, 전압 20V","explain":"수직 자세 t9.0 다층 용접 시, 2차 중간층 용접의 적정 조건은 전류 120A(±10A), 전압 20V 범위이다. 이때 1차 이면 비드의 예열 축적 층간 온도를 약 250°C 부근으로 유지하며 이행하여야 급랭 마르텐사이트 취화 방지 및 슬래그 혼입 방지 제어가 원활하다."},{"n":24,"type":"mcq","stem":"용접부의 연성(Ductility) 정도를 파악하기 위해, 국가기술 자격시험 채점 기준에서 외관 검사 통과 시편을 정해진 폭(보통 38mm)으로 가공 절단한 후 프레스로 강제 굴곡시켜 판정하는 시험은?","choices":["샤르피 충격 시험 (Charpy Impact Test)","에릭센 연성 시험 (Erichsen Test)","Guided 굽힘 시험 (Guided Bend Test)","브리넬 경도 시험 (Brinell Hardness Test)"],"answerIndex":3,"answerText":"③ Guided 굽힘 시험 (Guided Bend Test)","explain":"과정평가형 용접산업기사의 핵심 파괴 시험은 'Guided 굽힘 시험(Guided Bend Test)'이다. 규정된 폭 38mm(실제 도면 기준 38±2mm)로 절단한 용접 시편의 표면 및 이면을 각각 상하 굽힘 롤러 지그로 굴곡시켜 연성 저하에 의한 균열 크기를 mm 단위로 판정한다."},{"n":25,"type":"mcq","stem":"다음 중 용접 굽힘시험(Guided Bend Test)을 마친 후 외관 균열 여부를 측정하여 채점할 때, 즉시 0점(실격/불합격) 처리되는 3대 불합격 감점 한계 기준에 해당하지 않는 것은?","choices":["시편 굽힘면에 발생한 단일 균열의 최대 길이가 3mm 이상인 경우","3mm 미만의 미세 균열이라도 굽힘면에 나타난 모든 균열 합계가 7mm 이상인 경우","굽힘면 표면에 발생한 기포 및 작은 균열의 개수 합계가 총 10개를 초과하는 경우","용착 비드 중심부가 아닌 모재 경계부(열영향부) 외곽에 1mm짜리 균열이 단 1개만 검출된 경우"],"answerIndex":4,"answerText":"④ 용착 비드 중심부가 아닌 모재 경계부(열영향부) 외곽에 1mm짜리 균열이 단 1개만 검출된 경우","explain":"굽힘시험 합격 기준은 엄격하다. 1) 단일 균열 3mm 이상, 2) 3mm 이하 균열의 누적 합계가 7mm 이상, 3) 기포 및 미소 균열 개수가 10개 초과 시 즉시 0점 처리된다. 모재 경계부에 발생한 1mm 크기의 단일 미세 균열은 기준 이내이므로 만점 또는 최소 감점 사항일 뿐 즉시 0점 실격 사항은 아니다."},{"n":26,"type":"mcq","stem":"다음 용접 이음 중 접합하려는 두 모재가 직각 또는 임의의 경사각으로 만나는 부면(구석 부분)에 정삼각형 형상의 단면 비드를 육성 접합하는 이음의 명칭은?","choices":["필릿 이음 (Fillet Joint)","변두리 이음 (Edge Joint)","겹치기 이음 (Lap Joint)","맞대기 이음 (Butt Joint)"],"answerIndex":1,"answerText":"① 필릿 이음 (Fillet Joint)","explain":"두 부재가 직각 또는 경사각으로 교차하는 모서리 부위에 정삼각형 형상 비드를 쌓아 접합시키는 공법을 필릿 이음(Fillet Joint)이라 한다."},{"n":27,"type":"mcq","stem":"다음 중 이산화탄소 가스 아크 용접(CO2 용접) 시, 보호가스로 사용하는 이산화탄소(CO2)의 순도 및 수분 함량 제어 수칙으로 가장 올바른 조합은?","choices":["CO2 가스 순도 90% 이상, 수분 1.0% 이하","CO2 가스 순도 99.5% 이상, 수분 0.005% 이하","CO2 가스 순도 95% 이상, 수분 0.05% 이하","CO2 가스 순도 99.99% 이상, 수분 0.0001% 이하"],"answerIndex":2,"answerText":"② CO2 가스 순도 99.5% 이상, 수분 0.005% 이하","explain":"CO2 아크 용접용 고압 용기에 충전된 액화 탄산가스의 공학적 보호가스 표준 요건은 가스 순도 99.5% 이상, 수분 함량 0.005%(50ppm) 이하이다. 수분이 이보다 많으면 아크 고온 상태에서 산소와 수소로 해리되어 용융지에 수소가 다량 침입, 저온 균열 및 기공을 대량 야기한다."},{"n":28,"type":"mcq","stem":"고압 탄산가스 용기 내의 액화가스가 기화할 때 기화열(잠열) 흡수로 인해 압력조정기(레귤레이터) 내부 배관이 얼어붙어 가스 공급이 정지되는 동결 현상을 예방하기 위해 설치하는 설비는?","choices":["고주파 동조 여과기","가압 노즐 집진기","가열 가스 히터(Heater)","오일 분무 여과 조정기"],"answerIndex":3,"answerText":"③ 가열 가스 히터(Heater)","explain":"탄산가스는 방출 시 단열 팽창 및 기화 잠열 흡수로 인해 조정기가 쉽게 결빙된다. 이를 보정하기 위해 용접기 후면 전용 전원(보통 AC 110V 또는 220V)을 연결하여 튜브 배관을 상시 따뜻하게 유지시켜주는 가압 조정기 가열 히터(Heater)를 필히 설치 구동해야 한다."},{"n":29,"type":"mcq","stem":"용접 시공에 있어서 아크 열량이 모재로 이행되는 정도를 정량화한 수식인 용접 입열량(J/cm)을 구하는 공식으로 가장 올바른 것은? (단, I: 전류(A), E: 전압(V), v: 용접속도(cm/min)로 정의한다.)","choices":["H = (I * E) / v","H = (I * E * 60) / v","H = (I * E) / (60 * v)","H = (I * E * 100) / v"],"answerIndex":2,"answerText":"② H = (I * E * 60) / v","explain":"용접 입열량(Heat Input)의 표준 연산 공식은 H = (60 * E * I) / v (Joule/cm)이다. 용접 전류(I)와 아크 전압(E)에 비례하고 분당 용접 속도(v, cm/min)에 반비례하며 초 단위(60)를 곱하여 단위 cm당 방출된 열량을 계산한다."},{"n":30,"type":"mcq","stem":"다음 비파괴 시험법(NDT) 기호 중 도면해독 시 방사선 투과 시험(Radiographic Testing)을 지시하는 표준 약어 명칭은?","choices":["UT","MT","PT","RT"],"answerIndex":4,"answerText":"④ RT","explain":"RT는 Radiographic Testing(방사선 투과 시험), UT는 Ultrasonic Testing(초음파 탐상 시험), PT는 Penetrant Testing(침투 탐상 시험), MT는 Magnetic Particle Testing(자분 탐상 시험)을 가리키는 KS 규격 국제 약어이다."},{"n":31,"type":"mcq","stem":"아크 용접 진행 도중 일시적으로 아크가 한쪽 방향으로 가압 자기작동 유도 작용에 의해 쏠리는 현상인 '아크 쏠림(Arc Blow)'을 제어하기 위한 완화 대책으로 부적절한 것은?","choices":["교류(AC) 전원을 사용하여 극성의 자기 거동을 상쇄시킨다.","접지점(Ground) 위치를 용접 작업 지점에서 멀리 이격시킨다.","후진법으로 운봉을 전개한다.","아크 길이를 가급적 매우 길게 유도하여 분사력을 증대시킨다."],"answerIndex":4,"answerText":"④ 아크 길이를 가급적 매우 길게 유도하여 분사력을 증대시킨다.","explain":"아크 쏠림(Arc blow) 발생 시, 아크 길이를 길게 하면 전자기 기류의 영향을 더 강하게 받아 쏠림 요동 현상이 극도로 증폭된다. 따라서 가급적 아크 길이를 최대한 짧게 유지하고, 접지선을 접합부 반대 방향으로 멀리 분산하거나, 교류 전원으로 전환하는 것이 올바른 완화 기법이다."},{"n":32,"type":"mcq","stem":"용접 마감 비드의 마지막 끝단 부분에 깊게 파여 들어간 물방울 형태의 응고 홈 결함을 크레이터(Crater)라 한다. 이 부위의 구조적 결함(균열 등)을 방지하기 위한 토치 조작 기법으로 가장 적절한 것은?","choices":["비드 종점부에서 토치 스위치를 톡톡 2~3회 끊어 넣으며 용착 살을 일정하게 채운 뒤 아크를 차단한다.","마감부에서 와이어 브러시로 급속 마찰을 주어 열을 뺏는다.","전류를 최대로 상향 조정하여 남은 부분을 한 번에 세게 융합시킨다.","마감 시점에서 토치를 즉시 머리 위로 수직으로 들어 올려 아크를 날카롭게 끊는다."],"answerIndex":1,"answerText":"① 비드 종점부에서 토치 스위치를 톡톡 2~3회 끊어 넣으며 용착 살을 일정하게 채운 뒤 아크를 차단한다.","explain":"크레이터 처리는 다층 용접 결함 방지의 기본이다. 토치 스위치를 마지막 마감 시점에서 아크 끊었다 넣기를 2~3회 반복 조작하여 오목하게 파인 수축 홈 구덩이에 용착 금속을 평평하게 가득 채워준 뒤 아크를 완전히 차단하는 것이 정석이다."},{"n":33,"type":"mcq","stem":"다음 중 용접 작업장 주변 정리정돈의 기본 기틀이 되는 3정 5행(3정 5S) 항목에 해당하지 않는 것은?","choices":["정품, 정위치, 정량","정리, 정돈, 청소","청결, 습관화","정시, 정색, 정조"],"answerIndex":4,"answerText":"④ 정시, 정색, 정조","explain":"3정 5행(3정 5S)의 기틀 구성은 3정(정품, 정위치, 정량), 5행(정리, 정돈, 청소, 청결, 습관화)으로 완벽하게 연계되어 안전하고 효율적인 작업장 구축의 기틀이 된다."},{"n":34,"type":"mcq","stem":"용접 작업 중 발생하는 유해 환경 인자인 자외선에 의해 눈의 각막 부위가 가볍게 화상을 입어 붉게 충혈되고 통증을 동반하는 전공 염증의 전문 의학 명칭은?","choices":["아크 아이 / 전안염 (Arc Eye)","결막하 출혈","망막 박리","백내장 (Cataract)"],"answerIndex":1,"answerText":"① 아크 아이 / 전안염 (Arc Eye)","explain":"용접 아크 유해 유독 광선(자외선)에 보안경 없이 노출되었을 때 눈의 각막 상피가 손상되어 밤에 심한 통증과 눈물이 유도되는 일시적 광 화학적 눈 화상 염증을 아크 아이(Arc Eye) 또는 전안염이라 부른다. 예방을 위해 차광 보호구 착용이 필수이다."},{"n":35,"type":"mcq","stem":"맞대기 이음부 홈 설계 시, 랜드(Land)가 존재하는 U형 홈이나 J형 홈을 구성하여 자동 용접을 설계하려 할 때, 개선 깊이에 내접하는 원의 랜드 끝 곡률 반경을 지칭하는 용어는?","choices":["베벨각","루트 간격","루트 반지름","덧붙임 높이"],"answerIndex":3,"answerText":"③ 루트 반지름","explain":"U형 및 J형 맞대기 개선 홈 설계에서 가압 가동 곡률을 구성하는 끝단 원호의 곡률 한계 치수를 '루트 반지름(Root radius)'이라 호칭한다."},{"n":36,"type":"short","stem":"용접기 정격 사용률이 60%이고 정격 2차 전류(정격 용량)가 300A인 아크 용접기를 활용하여 실제 현장에서 200A의 전류 세기로 맞대기 용접을 전개할 때, 이 용접기의 안전 작동 한계 지수인 '허용 사용률(%)'을 공학 공식을 대입하여 계산 과정을 쓰고 답안을 작성하시오.","choices":[],"answerIndex":null,"answerText":"100% (또는 계산 수치 적용 시 135%)","explain":"공식: 허용사용률(%) = (정격2차전류 / 실제용접전류)^2 * 정격사용률 연산 과정: 허용사용률 = (300 / 200)^2 * 60% = 1.5^2 * 60% = 2.25 * 60 = 135% 이때 계산상 135%가 도출되나 실제 용접기의 물리적 허용 최대 사용률은 최대 100%를 초과할 수 없으므로 안전 한계 작동 지수는 100%로 판정한다."},{"n":37,"type":"short","stem":"아크 전압이 20V이고 용접 전류가 120A이며 토치의 전진 속도가 분당 12cm/min 일 때, 두 모재에 최종 가해지는 단위 cm당 열에너지 지수인 '용접 입열량(Joule/cm)'을 산출 공식에 대입하여 계산 과정과 정답을 도출하시오.","choices":[],"answerIndex":null,"answerText":"12,000 J/cm (또는 12 kJ/cm)","explain":"공식: H = (60 * E * I) / v 연산 과정: E = 20 V, I = 120 A, v = 12 cm/min 이므로, H = (60 * 20 * 120) / 12 = 144,000 / 12 = 12,000 Joule/cm"},{"n":38,"type":"short","stem":"아크 전압이 25V이고 용접 전류가 150A이며 토치의 전진 속도가 초당 2.5mm/sec 일 때, 최종 가해지는 단위 mm당 '용접 입열량(J/mm)'을 계산 과정을 거쳐 산출하시오.","choices":[],"answerIndex":null,"answerText":"1,500 J/mm","explain":"공식: H(J/mm) = (전압(V) * 전류(A)) / 용접속도(mm/sec) 연산 과정: E = 25 V, I = 150 A, v = 2.5 mm/sec 이므로, H = (25 * 150) / 2.5 = 3750 / 2.5 = 1,500 J/mm (참고: 이를 cm 단위로 환산하면 15,000 J/cm 가 된다.)"},{"n":39,"type":"short","stem":"KS D 3566 규격에 명기된 가스배관용 탄소강 강관 기호 중 'SGT275'에서 숫자 '275'가 보장하는 모재의 최소 공학 물리적 성질 수치 명칭과 세부 단위를 쓰시오.","choices":[],"answerIndex":null,"answerText":"최소 항복강도, 275 MPa","explain":"SGT275 기호 표기법에서 수치 '275'는 해당 강재 강관의 '최소 항복강도(Yield Strength)' 규격을 보증하는 값이며, 표준 공학적 보증 단위는 MPa (또는 N/mm²)를 적용한다."},{"n":40,"type":"short","stem":"용착 금속의 인장 시험 또는 파면 파단 시험을 치렀을 경우, 절단된 내부 파단면에 대기 중 수소 유입 및 급랭 취성으로 인해 물고기 눈 모양의 미세 은백색 타원형 반점이 무리 지어 나타나는 정성적 슬래그 결함의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"은점 (Flake / Fish Eye)","explain":"이 결함의 정식 명칭은 은점(Flake / Fish Eye) 결함이다. 용착금속 내부 야금 응고 시 용해되어 갇혀 있던 과포화 수소가 국부 영역으로 확산 석출되어 취성 연화 영역을 형성하여 파단면에 은백색 고기 눈 모양으로 흔적을 남긴다."},{"n":41,"type":"short","stem":"맞대기 이음 설계 시, 이음 효율(%)을 구하기 위해 분모와 분자에 매칭되어 대입되는 두 개의 인장강도 변수 명칭을 공식 구조로 기재하시오.","choices":[],"answerIndex":null,"answerText":"(용접시편 인장강도 / 모재 인장강도) x 100","explain":"공식: 이음효율(%) = (용접시편의 인장강도 / 모재의 규격 인장강도) * 100 즉, 실제 접합부를 용접 완료한 상태에서 전단 인장시험을 진행하여 얻은 실측 파단 응력을 본래 접합하기 전 완전한 모재의 인장 성능 규격 한계값으로 나누어 계산한다."},{"n":42,"type":"short","stem":"용접 야금에서 연강 용착 금속의 규격 인장강도가 45 kgf/mm²이고, 구조물의 안전 거동을 담보하기 위한 공학적 안전율(Factor of Safety)이 9로 규정되었을 때, 이 용접 이음 접합부에 허용되는 최종 '허용 응력(kgf/mm²)' 수치를 산출하시오.","choices":[],"answerIndex":null,"answerText":"5 kgf/mm²","explain":"공식: 허용응력 = 인장강도 / 안전율 연산 과정: 인장강도 = 45 kgf/mm², 안전율 = 9 이므로, 허용응력 = 45 / 9 = 5 kgf/mm^2"},{"n":43,"type":"short","stem":"용접 변형 방지 시공 중, 루트 간격이 좁아지는 종점부 엇갈림 뒤틀림을 미세 교정하기 위해 적용되는 루트 간격 수축 역변형 관계식인 D = d + 0.015L 에서 계수 'L'과 'd'가 의미하는 세부 설계 변수 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"d: 용접 시작점의 루트 간격, L: 전체 용접 길이","explain":"수식 D = d + 0.015L 은 수축 각변형 제어를 위한 루트갭 예측 공식이다. 여기서 변수 d는 '용접 시작점(시점)에서의 초기 루트 간격(mm)'을 뜻하며, 변수 L은 '용접선 전체 유효 용접 길이(mm)'를 나타낸다."},{"n":44,"type":"short","stem":"ASME Sec.IX 코드를 준수하는 WPS(용접절차사양서)에서 용접 전 모재 표면 청소 다듬질 및 시작점 층간 슬래그 제거를 위해 쇠솔질 및 디스크 연삭 숫돌휠 가공을 수행할 때 기재하는 표준 공학 영문 표기법을 쓰시오.","choices":[],"answerIndex":null,"answerText":"BRUSHING AND/OR GRINDING","explain":"ASME 기준 WPS의 초층 및 층간 청결(Initial or Interpass Cleaning) 제어 항목에 기술되는 표준적 영문 시공 표기는 BRUSHING AND/OR GRINDING 이다. 이는 쇠솔질(Brushing)과 핸드그라인딩(Grinding)을 병행함을 지시한다."},{"n":45,"type":"short","stem":"도면해독 시 비파괴 시험 기호 표기법에서, 용접 기준선(수평실선)과 60°의 경사 각도로 뻗어 나가 용접 지점부를 지시하는 비파괴 고유 경사선의 정식 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"지시선 (또는 경사지시선)","explain":"비파괴 시험 기호의 주요 요소인 이 경사선의 명칭은 '지시선(Arrow line / Reference line slope)' 또는 간단히 '경사 지시선'이라 지칭한다."},{"n":46,"type":"short","stem":"맞대기 V형 개선 홈에 1층 이면비드를 안정적으로 유착시키기 위해, 토치 노즐 단면 끝 부위로부터 구리 압착 튜브 단자까지 돌출되어 흐르는 가스 차폐 와이어의 최적 길이를 일컫는 전문 용어와 표준 적정 수치 범위를 쓰시오.","choices":[],"answerIndex":null,"answerText":"와이어 돌출 길이, 10~15mm","explain":"이 전문 용어는 '와이어 돌출 길이(Contact Tube to Work Distance)' 또는 간단히 '돌출 길이'이며, 연강용 솔리드와이어 O1.2 mm 전력 제어 거동 안정성을 유지하기 위한 최적의 표준 수치 범위는 10~15mm 범위이다."},{"n":47,"type":"short","stem":"수평 자세(H) V형 맞대기 용접 2층 중간층 용접 작업 완료 직후, 3층 최종 표면비드 전개를 위한 예열 관리 규정에 의거하여 2층 비드의 표면온도를 정밀 제어하는 한계 온도를 적으시오.","choices":[],"answerIndex":null,"answerText":"250°C 이하","explain":"수평 맞대기 용접 다층 공정 관리 수칙상 2층 비드 완료 후 3층 표면비드 진입 시 층간 온도는 최대 250°C 이하로 냉각 대기 조율 제어하여 열영향부 조대화를 방지해야 한다."},{"n":48,"type":"short","stem":"수직 자세(V-Up) V형 개선 맞대기 홈에 이면비드를 쌓을 때, 용가재가 융착되지 않고 아크 전자기력의 분사 압력에 의해 이면부 반대편으로 관통하여 완전 용락 유실 구멍을 크게 야기하는 과도 전력 거동 원인 2가지를 전류 및 토치 각도 측면에서 약술하시오.","choices":[],"answerIndex":null,"answerText":"1) 용접 전류의 과다 설정, 2) 토치 진행각도의 정밀 조작 오차(각도 불량)","explain":"가장 큰 원인 2가지는 다음과 같다. 1) 용접 전류가 과도하게 기준치(110A 이상)보다 높게 설정된 경우, 2) 토치의 진행 각도가 수직 기준선(80°~90°)에서 과도하게 벗어나 편심 경사 각도로 아크 압력이 홈 중앙 하단부를 예리하게 관통 제어한 경우이다."},{"n":49,"type":"short","stem":"용접 아크 중 가스 상태의 금속 기류가 순간적으로 수천 도의 고온 가열을 받아 기체 분자가 원자핵과 전자로 전리되어 양(+)이온과 음(-)이온이 혼재하는 고전리 불안정 초고온 전도체 상태를 일컫는 물리 학술 용어를 쓰시오.","choices":[],"answerIndex":null,"answerText":"플라스마 (Plasma)","explain":"이 물리적 현상태의 정식 학술 명칭은 플라스마 (Plasma) 현상태이다. 아크 주위의 기체가 원자 수준에서 완전히 전리되어 도전성을 지닌 가스 구름 상태를 형성한다."},{"n":50,"type":"short","stem":"맞대기 홈 가공 시 거친 연삭면 주위에 그을음 가열 찌꺼기나 거칠게 삐져나온 얇은 금속 거스러미 편을 일컬어 현장 실무 및 교재에서 지칭하는 전공 영문 용어를 쓰시오.","choices":[],"answerIndex":null,"answerText":"버 (Burr) 또는 거스러미","explain":"개선 홈 가공 완료 후 단면에 거칠게 잔존하는 금속 편 찌꺼기는 '거스러미' 또는 슬래그 전단계인 '버(Burr)'라 칭하며 줄로 다듬어 제거한다."}]},"15":{"unit":15,"title":"플럭스코어드와이어 맞대기용접","code":"LM1601050216","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1부: NCS 기반 플럭스코어드와이어 맞대기용접 공학 이론"},{"t":"h3","v":"1. 플럭스코어드와이어용접(FCAW)의 기본 특징 및 경제성 분석"},{"t":"p","v":"플럭스코어드와이어용접(FCAW, Flux Cored Arc Welding)은 금속 외피(튜브) 내부에 다양한 화학 성분의 플럭스 분말을 채워 넣은 와이어를 전극으로 사용하는 반자동 또는 자동 용접 프로세스이다. FCAW는 타 용접법과 비교할 때 매우 높은 경제성과 능률성을 보유하고 있는데, 핵심 지표는 다음과 같다:"},{"t":"p","v":"1) 초고속 용착 속도(g/h): FCAW의 표준 용착 속도는 약 9,000g/h 수준으로, 피복아크용접(SMAW, 3,000g/h)의 3배, 가스금속아크용접(GMAW, 5,000g/h)의 약 1.8배에 이른다."},{"t":"p","v":"2) 우수한 이음 효율 및 깊은 용입: 와이어 단면적이 작고 전류 밀도가 매우 높아 용입이 아주 깊다. 이에 따라 맞대기 홈 개선 각도를 솔리드와이어 대비 최소화할 수 있어 와이어 소모량과 충전 시간이 크게 절감된다."},{"t":"p","v":"3) 야금학적 화학 반응 우수성: 와이어 코어 내부의 탈산제, 탈질제 및 슬래그 형성 성분들이 용융지 내의 기공 및 유해 불순물(P, S)을 효율적으로 결합 제거하며, 냉각 시 두꺼운 슬래그 층을 형성해 대기 오염으로부터 비드를 완벽히 보호한다."},{"t":"table","rows":[["용접 기법","표준 용착 속도 (g/h)","비드 및 슬래그 형태","주요 경제적 및 기량적 단점"],["피복아크용접 (SMAW)","약 3,000 g/h","조밀한 슬래그 형성, 제거 필요","수동 잔여봉 교체(선입선출 시간 손실)"],["솔리드와이어 (GMAW)","약 5,000 g/h","슬래그 거의 없음, 얇은 아일랜드","바람막이 필수, 스패터 다량 부착"],["플럭스코어드와이어 (FCAW)","약 9,000 g/h","두껍고 균일한 슬래그 보호막","와이어 단가가 비싸고 흄 발생이 많음"]]},{"t":"h3","v":"2. 예열(Preheating)과 온도 제어 기준"},{"t":"p","v":"FCAW 다층 맞대기 용접 시, 후판의 급랭으로 인한 저온 균열 및 열영향부(HAZ)의 취화(마르텐사이트 형성)를 억제하기 위하여 예열 관리가 의무적이다. 예열 가스 토치 가동을 위한 산소와 아세틸렌의 가스 제어 기준은 다음과 같다:"},{"t":"li","v":"가스 토치 산소 압력: 0.2 ~ 0.5 [MPa] 압력 범위 유지."},{"t":"li","v":"가스 토치 아세틸렌 압력: 0.02 ~ 0.05 [MPa] 압력 범위 유지."},{"t":"li","v":"예열 불꽃 조건: 화학적으로 금속 산화나 침탄을 일으키지 않는 백심이 뚜렷한 중성 불꽃(Neutral Flame)을 고수한다."},{"t":"li","v":"후판 및 구속이 큰 경우 예열 온도 범위: 저온 균열을 강력히 예방하기 위해 모재 사양에 따라 50℃ ~ 150℃ 수준의 최적 예열을 조절한다."},{"t":"h3","v":"3. 맞대기 자세별(아래보기, 수직, 수평) 개선 홈 설계 및 작업 요건"},{"t":"p","v":"ASME Sec. IX 및 국가기술자격검정 시험을 충족하기 위한 9.0t 탄소강(SS275) 평판의 자세별 개선 홈(V-Groove) 형상 요건 및 작업 수칙은 서로 다른 물리적 변수를 가진다. 아래의 비교 가이드를 마스터해야 한다."},{"t":"h3","v":"가. 아래보기 자세 (PA / 1G) V형 맞대기 용접"},{"t":"li","v":"루트 면(Root Face) 가공 유무: 아래보기 자세 FCAW 용접 시에는 가급적 루트 면 가공을 전혀 시행하지 않고 날카로운 칼날 상태를 유지(0mm)한다. 아래보기는 중력 방향으로 용융 쇳물이 흐르므로 루트 면이 존재할 경우 이면비드(백비드) 용입 부족 또는 용입 불량 결함률이 과도하게 증가하기 때문이다."},{"t":"li","v":"홈 가공 규격: 개선 베벨 각도는 30°~35°(홈 각도 총합 60°~70°), 루트 간격(Root Gap)은 3.2±0.8mm이며 세라믹 백킹재를 정밀 밀착 배치한다."},{"t":"li","v":"작업 요령: 와이어 돌출 길이(CTWD) 15~20mm 유지, 작업각 90°, 진행각 75°~85°를 잡고 직선비드(Stringer) 형태로 우측으로 후진 진행(우진법)한다."},{"t":"h3","v":"나. 수직 자세 (PF / 3G) V형 맞대기 용접"},{"t":"li","v":"루트 면(Root Face) 가공 유무: 수직 자세에서는 반드시 1.5mm ~ 2.0mm 크기의 정밀 루트 면을 가공해야 한다. 수직 자세는 용착 금속이 자중에 의해 아래로 처지는 거동을 보인다. 만약 루트 면 가공 없이 가용접 시공하면 아크 열 집중으로 인해 열쇠 구멍(Key Hole)이 과도하게 뚫리며 용착부가 녹아내리는 용락(Burn Through)이나 이면부 관통 구멍 결함이 다량 발생한다."},{"t":"li","v":"홈 가공 규격: 베벨 각도 30°~35°, 루트 간격은 4.0mm로 고정 조절(Ø4.0 피복아크용접봉 심선을 게이지로 응용하여 단차 없이 고정)하며 자석 지그로 고정 가접한다."},{"t":"li","v":"작업 요령: 작업각 90°, 진행각 90°를 고수한 채 와이어 돌출 길이 10~15mm로 일정하게 유지하며 위로 상진(Vertical Up)한다. 특히 표면 비드를 쌓을 때는 비드 처짐과 언더컷을 차단하기 위해 이면 비드 전류 대비 전압을 1~2V 낮추어 시공해야 한다."},{"t":"h3","v":"다. 수평 자세 (PC / 2G) V형 맞대기 용접"},{"t":"li","v":"루트 면(Root Face) 가공 유무: 수평 자세에서도 반드시 1.5mm ~ 2.0mm 크기의 루트 면을 평평하고 일정하게 가공해야 한다. 수평 개선 홈 내에서 루트 면 가공이 누락되면 아크 열로 인해 상단 모재가 쉽게 용락되거나, 아래쪽으로 쇳물이 비대칭으로 쏠리며 이면비드 비대칭 쏠림 및 용입 불량을 야기한다."},{"t":"li","v":"홈 가공 규격: 베벨 각도 30°~35°, 루트 간격은 넓게 5.0mm로 고정(Ø3.2 저수소계 용접봉 피복재 포함 두께가 약 5mm인 점을 응용하여 간격 세팅)한다."},{"t":"li","v":"작업 요령: 작업각 70°~80°(토치를 약간 위쪽 모재를 겨냥해 아래로 처지는 쇳물을 받치도록 설계), 진행각 60°~70°로 노즐을 개선 모서리에 지지한 채 후진한다. 수평 자세 다층 속살(2층) 용접 시에는 여러 패스로 나누는 것보다 1패스로 일정한 폭의 지그재그 또는 돼지꼬리 위빙을 가동해 채우는 것이 슬래그 혼입 결함을 최소화하는 특효 시공법이다."},{"t":"h3","v":"4. 와이어 및 보호가스 품질 관리 기준"},{"t":"li","v":"플럭스코어드와이어 표준 분류 기호 해석: 가장 널리 사용되는 YFW-C50DR 규격에서 'Y'는 용접와이어, 'FW'는 플럭스코어드와이어, 'C'는 100% CO2 보호가스 전용(A는 Ar-CO2 혼합), '50'은 용착금속의 최소 인장강도인 490 N/mm²(50 kgf/mm²급), '2'는 저온 충격 인성 보증, 'R'은 루틸(Rutile)계 플럭스 계통을 지시한다."},{"t":"li","v":"흡습 관리 및 오븐 재건조 원칙: 플럭스코어드와이어는 내부 분말에 미세한 공극이 있어 흡습이 아주 쉽다. 수분 유입 시 기공(Blowhole) 및 수소 기인 균열이 직접적으로 발생하므로 보관 관리가 생명이다. 건조 시 플라스틱 스풀(Spool) 방식 와이어는 열변형 방지를 위해 50℃ 저온에서 최소 48시간 이상 서서히 재건조하고, 철재 스풀 또는 코일 제품은 150℃ 고온에서 최소 5시간 이상 정밀 건조를 실시해야 한다."},{"t":"li","v":"보호가스 정밀 세팅: 보호가스는 순도 99.5% 이상의 이산화탄소(CO2) 가스를 사용하며, 가스 토치로 배출되는 표준 유량은 20 ~ 25 [L/min]을 준수한다. 바람 부는 실외 현장 작업 시 가스 실드가 불안정해지는 차단 기준 풍속은 2 [m/sec] 이상이며, 이 기준을 초과하면 반드시 견고한 방풍막을 설치한 후 유량을 상향 조절해 시공해야 한다."},{"t":"h3","v":"5. 주요 용접 결함의 발생 원인 및 공학적 대책 일람"},{"t":"p","v":"FCAW는 초고능률적인 공법이나 부적절한 세팅 시 가스 및 슬래그 기인 결함에 쉽게 노출된다. 다음의 인과 관계와 해결 대책을 정밀 숙지해야 자격 검정과 품질 검사 단계에서 불합격을 원천 예방할 수 있다."},{"t":"table","rows":[["결함 종류","물리적/기계적 발생 원인","공학적 조치 및 작업적 해결 대책"],["기공 (Blowhole)","보호가스 유량 부족 또는 초과(풍속 2m/s 이상 기류 교란), 와이어 흡습, 모재 표면 유지류 및 밀스케일 미제거","방풍막 설치, 가스 유량 20~25 LPM 조절, 와이어 사양별 온도 건조, 개선 홈 좌우 20mm 구역 그라인딩 세정"],["슬래그 혼입 (Slag Inclusion)","다층 용접 전층 슬래그 브러싱/그라인딩 제거 불량, 전류 과소로 인한 용착 지연, 부적절한 토치 진행각으로 슬래그가 아크를 선행함","매 층마다 와이어브러싱 및 디스크 그라인딩 청소 철저, 적정 전류 세팅 및 토치 진행각(75~85°) 유지로 슬래그 배출 유도"],["고온/저온 균열 (Cracking)","이음부 구속력이 극도로 높은 경우, 모재 내 C/Mn 불순물 함량 과다, 와이어 건조 불량으로 용착 금속 내 확산성 수소 다량 함입","용접 전 50~150℃ 정밀 예열 가동, 층간 적정 온도 유지, 잔류응력 완화를 위해 비드 표면 가벼운 열간 피닝(Peening) 적용"],["용입 부족 (Incomplete Pen.)","루트 간격이 지나치게 좁음, 용접 진행 속도가 전류량 대비 너무 빠름, 전압이 비상식적으로 낮아 용입 깊이 저하","자세별 루트 간격(3.2~5.0mm) 규격 유지, 용접 속도를 늦추고 아크 정전압 특성을 이용하여 전류 세팅을 올바르게 매칭"],["언더컷 (Undercut)","아크 전압이 너무 높음, 아크 길이가 너무 길어 토치 상단 모재가 용융 유실됨, 진행 속도가 과도하게 빠름","아크 전압을 1~2V 낮추어 정밀 세팅, 팁-모재 간 돌출 길이(15~20mm) 유지, 위빙 시 양끝단에서 0.5~1초 일시 정지(Dwell)하여 쇳물 보충"]]},{"t":"h2","v":"제2부: 대표 엄선 50제 실전 평가 문항"},{"t":"h3","v":"1. 객관식 4지선다형 평가 (1~35번)"}],"questions":[{"n":1,"type":"mcq","stem":"FCAW의 경제성 및 생산성에 대한 설명 중 가장 타당하지 않은 것은?","choices":["피복아크용접(SMAW) 대비 용착 속도가 약 3배 가량 높아 다층 맞대기 시공 시 공기 단축에 유리하다.","솔리드와이어 아크용접 대비 고전류 영역에서 스패터 발생량이 비약적으로 증가하여 후처리가 어렵다.","슬래그의 보호 피포성이 우수하고 기계적 성능과 기량 변수의 허용 폭이 넓다.","용입이 매우 깊어 맞대기이음 설계 시 개선 각도를 최소화하여 용가재 소비를 극절감할 수 있다."],"answerIndex":2,"answerText":"② 솔리드와이어 아크용접 대비 고전류 영역에서 스패터 발생량이 비약적으로 증가하여 후처리가 어렵다.","explain":"FCAW는 플럭스가 만든 슬래그와 가스가 용적을 감싸 이행을 안정시키므로 고전류에서도 CO2 솔리드와이어보다 스패터가 오히려 적다. 따라서 2번 설명이 사실과 반대다."},{"n":2,"type":"mcq","stem":"FCAW 전극 와이어 종류 중 하나인 YFW-C50DR 기호에서 'C'가 지시하는 핵심적인 기술적 기준은?","choices":["Ar 80% + CO2 20%의 혼합 보호가스 전용 규격이다.","보호가스 없이 사용하는 자체 보호(Self-Shielded) 전용 규격이다.","100% 탄소강용 순텅스텐 전극 규격을 의미한다.","100% CO2 탄산가스를 보호가스로 사용하도록 규정된 와이어이다."],"answerIndex":4,"answerText":"④ 100% CO2 탄산가스를 보호가스로 사용하도록 규정된 와이어이다.","explain":"YFW-C50DR의 C는 보호가스 종류 표시로 100% CO2 전용을 뜻하고, Ar+CO2 혼합가스용은 M으로 구분한다. 보호가스가 필요 없는 자체보호형은 별도 기호를 쓴다."},{"n":3,"type":"mcq","stem":"FCAW 용접 시 저온 균열 방지 및 열영향부(HAZ) 급랭 방지를 위한 토치 예열 제어 압력으로 옳은 조합은?","choices":["산소: 0.1~0.2 MPa, 아세틸렌: 0.01~0.02 MPa","산소: 0.2~0.5 MPa, 아세틸렌: 0.02~0.05 MPa","산소: 0.5~0.8 MPa, 아세틸렌: 0.05~0.10 MPa","산소: 1.0~1.5 MPa, 아세틸렌: 0.10~0.20 MPa"],"answerIndex":2,"answerText":"② 산소: 0.2~0.5 MPa, 아세틸렌: 0.02~0.05 MPa","explain":"예열 토치는 산소 0.2~0.5MPa, 아세틸렌 0.02~0.05MPa가 표준이다. 아세틸렌은 0.13MPa를 넘으면 자연분해 폭발 위험이 있어 4번 같은 고압은 절대 쓰지 않는다."},{"n":4,"type":"mcq","stem":"예열 토치 가동 시 모재의 침탄이나 산화를 방지하기 위해 생성하는 가장 이상적인 가스 불꽃 형태는?","choices":["백심이 선명하고 산소와 아세틸렌 비율이 균형을 이루는 중성불꽃","산소가 과잉 공급되어 청색 백심을 띠는 산화불꽃","아세틸렌 가스가 과잉 공급되어 그을음이 발생하는 탄화불꽃","주위 바람에 의해 산소 공급이 단절된 환원불꽃"],"answerIndex":1,"answerText":"① 백심이 선명하고 산소와 아세틸렌 비율이 균형을 이루는 중성불꽃","explain":"중성불꽃은 산소와 아세틸렌이 1:1로 완전연소해 여분의 탄소나 산소가 없어 모재를 침탄·산화시키지 않는다. 탄화불꽃은 침탄, 산화불꽃은 산화를 일으킨다."},{"n":5,"type":"mcq","stem":"FCAW 아래보기 자세(PA/1G) V형 맞대기용접의 홈 설계 요건으로 옳은 것은?","choices":["루트 면 가공 크기를 1.5~2.0mm로 견고하게 가공한다.","이면비드 완전 용입 유도를 위해 루트 면 가공을 생략(0mm)하여 날카롭게 유지한다.","루트 간격을 최대한 좁혀 0~0.5mm 수준으로 가접한다.","세라믹 백킹재 없이 공중에서 표면 비드 압력으로 이면을 형성한다."],"answerIndex":2,"answerText":"② 이면비드 완전 용입 유도를 위해 루트 면 가공을 생략(0mm)하여 날카롭게 유지한다.","explain":"아래보기는 용융지를 받쳐줄 여유가 커서 루트 면을 0mm로 날카롭게 두어야 이면까지 완전 용입된 이면비드가 나온다. 루트 간격도 0.5mm 이하로 좁히면 용입 부족이 생긴다."},{"n":6,"type":"mcq","stem":"FCAW 아래보기 자세(1G) 맞대기용접에서 왜 루트 면 가공을 가급적 생략하는가?","choices":["아래보기는 용착 속도가 빨라 루트 면이 남으면 이면에 용입 부족이 생기기 때문이다.","와이어 송급 장치와 콘딧 라이너의 기계적 마찰 저항을 크게 줄이기 위함이다.","스패터가 슬래그 내부로 혼입되는 열역학적 거동을 사전에 차단하기 위함이다.","다층 용접 시 표면 비드의 폭이 지나치게 넓어지는 현상을 방지하기 위한 제도적 규정이다."],"answerIndex":1,"answerText":"① 아래보기는 용착 속도가 빨라 루트 면이 남으면 이면에 용입 부족이 생기기 때문이다.","explain":"FCAW는 용착 속도가 빠르고 슬래그가 아크를 덮어 루트 면이 남아 있으면 그 두께만큼 아크가 못 미쳐 이면에 용입 부족이 생긴다. 그래서 아래보기는 루트 면을 0mm로 둔다."},{"n":7,"type":"mcq","stem":"FCAW 수직 자세(PF/3G) V형 맞대기용접 시 루트 면 가공을 1.5~2.0mm 크기로 반드시 시행하는 주된 이유는?","choices":["루트 면이 없으면 중력과 아크 열로 용융지가 흘러내려 용락 결함이 발생하기 때문이다.","수직자세에서 와이어 송급 속도를 2배 이상 높여 용착 생산성을 제어하기 위함이다.","세라믹 백킹재의 이중 탈산 반응 속도를 항상 일정하게 유도하기 위함이다.","이면비드의 외관 평탄도를 인위적으로 거칠게 만들어 외관 검사 시 식별을 돕기 위함이다."],"answerIndex":1,"answerText":"① 루트 면이 없으면 중력과 아크 열로 용융지가 흘러내려 용락 결함이 발생하기 때문이다.","explain":"수직 자세는 중력 방향으로 용융금속이 흘러내려 루트가 과열되기 쉬우므로, 1.5~2.0mm 루트 면을 남겨 녹아 없어질 살을 확보해야 용락을 막을 수 있다."},{"n":8,"type":"mcq","stem":"수직 V형 t9.0 맞대기용접의 가조립 간격을 정확하게 맞추기 위해 사용하기 편리한 수공구 보조 요령은?","choices":["Ø4.0 피복아크용접봉의 피복 부분째로 틈새에 끼워 간격을 조절한다.","Ø4.0 피복아크용접봉의 심선(4.0mm)을 간격재로 끼워 가접한다.","Ø1.2 솔리드와이어를 세 겹으로 꼬아 틈새에 넣어 간격을 유도한다.","쇠톱 날의 두께를 그대로 대입하여 루트 갭을 임시로 억제해 가접한다."],"answerIndex":2,"answerText":"② Ø4.0 피복아크용접봉의 심선(4.0mm)을 간격재로 끼워 가접한다.","explain":"수직 V형 t9.0의 루트 간격은 약 4mm이므로 Ø4.0 용접봉의 심선(피복을 벗긴 지름 4.0mm)을 틈새에 끼우고 가접하면 간격이 정확히 맞는다. 피복째 끼우면 5mm 이상으로 벌어진다."},{"n":9,"type":"mcq","stem":"수평 자세(PC/2G) V형 맞대기용접 시 루트 면 가공 크기와 간격 조절 기준으로 가장 적합한 것은?","choices":["루트 면: 0mm (칼날), 루트 간격: 3.2mm","루트 면: 1.5~2.0mm, 루트 간격: 5.0mm 내외","루트 면: 3.0~4.0mm, 루트 간격: 1.0mm","루트 면: 0.5mm, 루트 간격: 0mm (밀착)"],"answerIndex":2,"answerText":"② 루트 면: 1.5~2.0mm, 루트 간격: 5.0mm 내외","explain":"수평 자세는 용융지가 아래쪽으로 쏠려 처지므로 루트 면 1.5~2.0mm로 받쳐주고 루트 간격은 5.0mm 내외로 넓혀 이면비드가 형성될 통로를 확보한다."},{"n":10,"type":"mcq","stem":"수평 자세(2G) 맞대기용접 조립 시 루트 간격을 약 5.0mm로 유지하기 위해 활용하면 편리한 보조 재료는?","choices":["Ø4.0 용접봉의 심선 지름을 틈새에 끼운다.","세라믹 백킹재의 돌기를 직접 홈 안에 끼워 구속한다.","동판 조각을 틈새에 가공 배치한다.","Ø3.2 저수소계 피복아크용접봉의 피복 부분을 간격재로 활용한다."],"answerIndex":4,"answerText":"④ Ø3.2 저수소계 피복아크용접봉의 피복 부분을 간격재로 활용한다.","explain":"Ø3.2 저수소계 용접봉은 피복까지 포함한 바깥지름이 약 5mm여서, 피복 부분을 그대로 틈에 끼우면 목표 루트 간격 5.0mm가 손쉽게 맞는다. Ø4.0 심선은 4mm라 부족하다."},{"n":11,"type":"mcq","stem":"FCAW 수평 자세 V형 맞대기용접의 1층 이면비드 작업 시 용융지 쏠림 및 처짐을 제어하기 위한 토치 표준 각도는?","choices":["작업각 90°, 진행각 90° 수직 유지","작업각 45°, 진행각 45° 우진법 유지","작업각 70°~80°, 진행각 60°~70°","작업각 100°~110°, 진행각 10°~20° 후진"],"answerIndex":3,"answerText":"③ 작업각 70°~80°, 진행각 60°~70°","explain":"수평 자세는 용융금속이 아래로 흘러내리므로 작업각을 70~80°로 들어 위쪽 모재를 겨냥하고 진행각 60~70°로 유지해야 쏠림과 처짐 없이 이면비드가 형성된다."},{"n":12,"type":"mcq","stem":"FCAW 수평 자세 다층 속살(2층) 용접 시 슬래그 혼입 결함을 원천 예방하는 가장 우수한 운봉 시공법은?","choices":["다중 패스로 얇게 나누어 직선 비드를 연속으로 적층한다.","1패스로 일정한 폭의 지그재그 또는 돼지꼬리 위빙을 가동해 슬래그 배출을 촉진한다.","진행 각도를 수시로 바꾸어 아크 쏠림을 인위적으로 유도한다.","정전압 특성을 무시하고 전압을 비상식적으로 낮추어 아래로 쇳물을 쳐낸다."],"answerIndex":2,"answerText":"② 1패스로 일정한 폭의 지그재그 또는 돼지꼬리 위빙을 가동해 슬래그 배출을 촉진한다.","explain":"지그재그·돼지꼬리 위빙은 아크가 용융지 앞쪽 슬래그를 계속 뒤로 밀어내 표면으로 떠오르게 하므로 슬래그 혼입을 막는다. 직선 다패스는 층간 경계에 슬래그가 갇히기 쉽다."},{"n":13,"type":"mcq","stem":"플럭스코어드와이어 보관 중 흡습이 심할 때 용접부에 직접적으로 나타나는 가장 심각한 야금학적 결함은?","choices":["표면 피트 및 내부 기공(Blowhole)과 확산성 수소 유입에 따른 균열","다리 길이 초과 및 목두께 과소에 따른 단차","용접 전류량 급감에 따른 아크 완전 요동 및 전원 스위치 차단","슬래그 박리력 과도로 인한 비드 표면 탈락 현상"],"answerIndex":1,"answerText":"① 표면 피트 및 내부 기공(Blowhole)과 확산성 수소 유입에 따른 균열","explain":"와이어가 흡습하면 플럭스 속 수분이 아크열로 분해되어 가스가 되고 미처 못 빠져나가면 피트·기공이 되며, 남은 수소는 확산성 수소로 침투해 지연균열을 일으킨다. 2번은 형상 결함, 4번은 슬래그 문제로 야금학적 결함이 아니다."},{"n":14,"type":"mcq","stem":"FCAW 보호가스인 CO2의 배출 표준 유량 범위로 가장 적합한 것은?","choices":["5 ~ 10 L/min","10 ~ 15 L/min","20 ~ 25 L/min","40 ~ 50 L/min"],"answerIndex":3,"answerText":"③ 20 ~ 25 L/min","explain":"FCAW의 CO2 표준 유량은 20~25 L/min이다. 이보다 적으면 실드가 부족해 기공이 생기고, 40 L/min 이상은 가스 흐름이 난류가 되어 오히려 대기를 빨아들이고 가스만 낭비된다."},{"n":15,"type":"mcq","stem":"보호가스 가스가 용접 아크를 대기로부터 실드하지 못하고 교란되기 시작하는 표준 풍속 기준치는?","choices":["0.5 m/sec 이상","1.0 m/sec 이상","2.0 m/sec 이상","5.0 m/sec 이상"],"answerIndex":3,"answerText":"③ 2.0 m/sec 이상","explain":"풍속 2 m/s 이상이면 보호가스 층이 날려 아크가 대기에 노출되므로 방풍막을 설치해야 한다. 이것이 옥외 용접에서 방풍 조치를 하는 기준값이다."},{"n":16,"type":"mcq","stem":"FCAW 용접 시 기공(Blowhole) 발생 요인과 가장 관계가 먼 것은?","choices":["용접부 주위에 풍속 2m/s 이상의 강한 바람이 불어 실드가 왜곡됨","와이어가 습한 공기에 노출되어 내부 플럭스 분말이 수분을 흡수함","모재 개선 홈 표면에 적색 녹이나 페인트, 오일이 잔류함","용접 전 모재를 50~150℃ 범위로 예열하여 건조 상태를 일정하게 제어함"],"answerIndex":4,"answerText":"④ 용접 전 모재를 50~150℃ 범위로 예열하여 건조 상태를 일정하게 제어함","explain":"50~150℃ 예열은 모재의 수분을 말리고 냉각속도를 늦춰 가스가 빠져나갈 시간을 주므로 기공을 오히려 막는 대책이다. 1·2·3번은 각각 실드 교란, 흡습, 이물질 분해가스로 모두 기공의 직접 원인이다."},{"n":17,"type":"mcq","stem":"FCAW 다층 용접 시 슬래그 혼입(Slag Inclusion)이 발생하는 주요 원인은?","choices":["이전 패스의 잔여 슬래그를 브러시나 그라인더로 완전히 제거하지 않음","전류 밀도가 너무 높아 모재 용입이 과도하게 깊이 발생함","팁과 모재 사이의 거리가 항상 15~20mm 범위로 매우 일정하게 유지됨","보호가스 CO2 유량을 25 L/min으로 넉넉하게 세팅함"],"answerIndex":1,"answerText":"① 이전 패스의 잔여 슬래그를 브러시나 그라인더로 완전히 제거하지 않음","explain":"FCAW는 패스마다 슬래그가 두껍게 덮이므로, 다음 패스 전에 브러시나 그라인더로 완전히 제거하지 않으면 그 슬래그가 용착금속 안에 갇혀 혼입이 된다. 특히 비드 경계와 홈 모서리에 남기 쉽다."},{"n":18,"type":"mcq","stem":"FCAW에서 발생하는 언더컷(Undercut) 결함의 직접적인 원인에 해당하지 않는 것은?","choices":["용접 전압을 너무 높게 설정해 아크가 과도하게 넓어짐","진행 속도가 너무 빨라 홈 양 끝단에 용융 금속이 채워지기 전에 지나감","팁과 모재 간의 거리를 너무 좁혀 아크 열이 중앙에 집중됨","좌우 위빙 운봉 시 양쪽 끝단에서 잠시 정지(Dwell)하여 쇳물을 균일하게 공급함"],"answerIndex":4,"answerText":"④ 좌우 위빙 운봉 시 양쪽 끝단에서 잠시 정지(Dwell)하여 쇳물을 균일하게 공급함","explain":"위빙 양 끝단에서 잠시 멈추면 파인 자리에 쇳물이 채워져 언더컷을 막는 정상 운봉법이다. 1·2·3번은 과전압, 과속, 아크열 집중으로 모두 끝단이 파이게 만드는 직접 원인이다."},{"n":19,"type":"mcq","stem":"FCAW에서 발생하는 용입 부족(Incomplete Penetration) 결함을 억제하기 위한 시공 대책은?","choices":["수랭 동판을 이면에 밀착시켜 용접부의 냉각 속도를 최대한 높인다.","루트 간격을 최대한 좁게 고정하고 진행 속도를 비약적으로 높여 빠르게 시공한다.","아크 전압을 과도하게 낮추어 비드 폭을 좁고 볼록하게 제어한다.","자세별 루트 간격을 지키고 슬래그가 아크를 앞서지 않도록 속도를 조절한다."],"answerIndex":4,"answerText":"④ 자세별 루트 간격을 지키고 슬래그가 아크를 앞서지 않도록 속도를 조절한다.","explain":"용입 부족은 루트가 제대로 녹지 않아 생기므로, 자세별 표준 루트 간격을 지키고 슬래그가 아크를 앞질러 덮지 않도록 속도를 맞춰야 한다. 속도를 높이거나 전압을 낮추면 열량이 줄어 용입이 더 얕아진다."},{"n":20,"type":"mcq","stem":"용접부의 인장 강도를 판정하는 굽힘 시험(Guided Bend Test) 시편 폭 규격으로 가장 올바른 것은?","choices":["10 ± 1 mm","20 ± 2 mm","38 ± 2 mm","50 ± 5 mm"],"answerIndex":3,"answerText":"③ 38 ± 2 mm","explain":"굽힘시험편의 표준 폭은 38 ± 2 mm이다. 시편 폭·두께가 규격을 벗어나면 굽힘 시 응력 분포가 달라져 판정 자체가 무효가 되므로 절단 단계에서 정확히 맞춰야 한다."},{"n":21,"type":"mcq","stem":"굽힘시험편 표면 검사 시 불합격(0점)으로 판정하는 단일 균열의 최소 크기 요건은?","choices":["1 mm 이상","2 mm 이상","3 mm 이상","5 mm 이상"],"answerIndex":3,"answerText":"③ 3 mm 이상","explain":"굽힘 후 표면에서 길이 3 mm 이상인 균열이 하나라도 발견되면 그 시편은 0점 처리된다. 3 mm 미만은 단독으로는 즉시 불합격이 아니고 누적 길이로 따로 판정한다."},{"n":22,"type":"mcq","stem":"굽힘시험편 표면 검사 시 단일 균열이 3mm 미만이라도, 전체 균열의 누적 합계가 몇 mm 이상이면 불합격 처리되는가?","choices":["3 mm 이상","5 mm 이상","7 mm 이상","10 mm 이상"],"answerIndex":3,"answerText":"③ 7 mm 이상","explain":"개별 균열이 3 mm 미만이어도 표면 전체 균열 길이를 합산해 7 mm 이상이면 불합격이다. 작은 균열이 여러 개 흩어져 있어도 결국 용착부 건전성이 떨어졌다고 보기 때문이다."},{"n":23,"type":"mcq","stem":"굽힘시험 시 기포 및 미세 균열의 누적 개수가 몇 개를 초과하면 즉시 불합격 처리되는가?","choices":["3개 초과","5개 초과","10개 초과","20개 초과"],"answerIndex":3,"answerText":"③ 10개 초과","explain":"기포와 미세 균열의 누적 개수가 10개를 초과하면 길이와 상관없이 즉시 불합격이다. 결함 하나하나는 작아도 개수가 많다는 것은 실드 불량이나 흡습 같은 공정 전반의 문제를 뜻한다."},{"n":24,"type":"mcq","stem":"FCAW 아래보기(1G) 이면비드 용접 완료 후 세라믹 백킹재를 분리 제거하기 전, 용접부를 냉각하는 표준 조치법은?","choices":["찬물을 살수하여 급랭 마르텐사이트 변태를 유도한다.","압축 공기를 뿜어 에어 세정 방식으로 강제 냉각한다.","대기 중에서 1~2분간 서서히 자연 공랭(서랭)시킨다.","모재를 물통에 침전시켜 고온 열 균열을 강제 구속한다."],"answerIndex":3,"answerText":"③ 대기 중에서 1~2분간 서서히 자연 공랭(서랭)시킨다.","explain":"용접 직후 대기 중에서 1~2분간 자연 공랭한 뒤 백킹재를 떼는 것이 표준이다. 살수나 침수로 급랭하면 마르텐사이트가 생겨 경화·균열이 발생하므로 절대 해서는 안 된다."},{"n":25,"type":"mcq","stem":"플럭스코어드와이어 중 루틸(Rutile)계 플럭스의 주성분에 해당하는 화학 원소는?","choices":["이산화티타늄 (TiO2)","산화망가니즈 (MnO2)","규산나트륨 (Na2SiO3)","형석 및 석회석 (CaF2, CaCO3)"],"answerIndex":1,"answerText":"① 이산화티타늄 (TiO2)","explain":"루틸계 플럭스는 산화티타늄(TiO2)이 주성분이라 아크가 안정되고 슬래그 박리성과 비드 외관이 좋다. 4번의 CaF2·CaCO3는 염기성(저수소계) 플럭스의 주성분이다."},{"n":26,"type":"mcq","stem":"FCAW 용접기의 출력 외관 제어 특성으로 가장 보편적으로 사용되는 전기적 원리는?","choices":["정전류특성 (CC)","고주파 고전압 특성","수하특성 (CC, Constant Current)","정전압 특성 (CV, Constant Voltage)"],"answerIndex":4,"answerText":"④ 정전압 특성 (CV, Constant Voltage)","explain":"FCAW는 와이어를 일정 속도로 송급하므로 전압을 일정하게 유지하는 정전압(CV) 특성을 쓴다. 수하·정전류(CC) 특성은 전류를 일정하게 두는 피복아크·TIG 수동 용접용이다."},{"n":27,"type":"mcq","stem":"FCAW에서 '아크 길이 자기 제어 작용'이란 아크 전압(길이)의 변화에 따라 일어나는 어떤 물리적 변화를 의미하는가?","choices":["아크가 멀어지면 전류(와이어 송급속도)가 자동 급증하여 아크 길이를 원래대로 복원한다.","아크가 멀어지면 전압이 기하급수적으로 증폭되어 아크 소리를 고주파화한다.","아크가 가까워지면 전류 밀도가 낮아져 모재 용입을 억제한다.","와이어 송급 속도가 주 전원 전압 변화에 따라 비선형적으로 제어된다."],"answerIndex":1,"answerText":"① 아크가 멀어지면 전류(와이어 송급속도)가 자동 급증하여 아크 길이를 원래대로 복원한다.","explain":"정전압 특성이라 아크 길이가 변하면 전류가 스스로 변해 와이어 용융속도를 조절, 원래 길이로 복원한다. 엄밀히는 아크가 짧아질 때 전류가 급증하고 길어지면 감소한다."},{"n":28,"type":"mcq","stem":"플라스틱 릴(스풀)에 감긴 FCAW 와이어의 흡습 방지를 위한 정밀 재건조 온도와 시간은?","choices":["70~100℃에서 30~60분","150℃에서 5시간 이상","300~350℃에서 1~2시간","50℃에서 최소 48시간 이상"],"answerIndex":4,"answerText":"④ 50℃에서 최소 48시간 이상","explain":"플라스틱 릴은 열에 약해 고온 건조가 불가능하므로 50℃ 정도 저온에서 48시간 이상 길게 말린다. 150℃ 이상이면 릴이 변형·용융되어 송급이 불가능해진다."},{"n":29,"type":"mcq","stem":"철재 코일 또는 와이어 바스켓으로 제작된 고온용 FCAW 와이어의 오븐 재건조 기준은?","choices":["50℃에서 48시간","150℃에서 최소 5시간 이상","300℃에서 1시간","400℃에서 10시간"],"answerIndex":2,"answerText":"② 150℃에서 최소 5시간 이상","explain":"철재 코일·바스켓은 고온을 견디므로 150℃에서 5시간 이상 오븐 재건조한다. 300~400℃는 와이어 표면 산화와 플럭스 변질을 부르는 과도한 조건이다."},{"n":30,"type":"mcq","stem":"FCAW 작업 중 4시간 이상 장시간 용접을 쉬어야 할 때, 와이어의 수분 흡수를 원천 차단하기 위한 현장 조치법으로 올바른 것은?","choices":["와이어 표면에 가벼운 방청유를 얇게 분사한 뒤 그대로 릴에 걸어 보관한다.","와이어를 밀폐된 물탱크 속에 완전히 잠기도록 그대로 침전시켜 보관한다.","와이어를 송급 장치에 그대로 걸어 둔 채 주변에 작업등을 켜 두어 계속 건조시킨다.","와이어를 릴에서 빼내 건조제와 함께 밀봉하거나 30±10℃ 건조 오븐에 보관한다."],"answerIndex":4,"answerText":"④ 와이어를 릴에서 빼내 건조제와 함께 밀봉하거나 30±10℃ 건조 오븐에 보관한다.","explain":"4시간 이상 중단하면 플럭스가 대기 중 수분을 흡수해 기공·저온균열의 원인이 되므로, 릴에서 빼내 건조제와 함께 밀봉하거나 30±10℃ 건조 오븐에 보관한다."},{"n":31,"type":"mcq","stem":"수직상진(3G) 표면비드 용접 시 이면비드 용접 조건 대비 아크 전압을 1~2V 가량 낮추어 시공해야 하는 기술적 이유는?","choices":["전압이 높으면 쇳물이 흘러내려 생기는 처짐·오버랩·언더컷을 막기 위함이다.","슬래그의 화학적 환원 분해 속도를 의도적으로 크게 지연시키기 위함이다.","용융지의 표면 점성을 기하급수적으로 낮추어 유동성을 높이기 위함이다.","와이어의 기계적 송급 속도를 2배 이상 높여 용착량을 크게 늘리기 위함이다."],"answerIndex":1,"answerText":"① 전압이 높으면 쇳물이 흘러내려 생기는 처짐·오버랩·언더컷을 막기 위함이다.","explain":"수직상진은 중력 때문에 쇳물이 아래로 흘러내리기 쉬워 전압을 1~2V 낮춰 입열과 용융량을 줄인다. 그래야 비드 처짐·오버랩·언더컷을 막을 수 있다."},{"n":32,"type":"mcq","stem":"FCAW 용접부 외관 검사 시 실격 및 오작 오감점을 회피하기 위해, 모재 두께 t9.0 대비 표면 덧살 비드 높이의 국가기술자격검정 한계치 기준은?","choices":["덧살 높이가 모재 두께의 10% 이내여야 하고, 비드 폭은 제한 없음","모재 두께의 50%(4.5mm) 초과 금지, 비드 폭 25mm 이내","덧살 높이가 모재 두께의 100%까지 허용, 비드 폭은 무제한","덧살 비드 두께가 모재 두께와 무관하게 10mm로 일정해야 함"],"answerIndex":2,"answerText":"② 모재 두께의 50%(4.5mm) 초과 금지, 비드 폭 25mm 이내","explain":"t9.0이면 덧살 높이는 모재 두께의 50%인 4.5mm를 넘으면 안 되고 비드 폭도 25mm 이내여야 한다. 이 한계를 넘으면 외관검사에서 오작·실격으로 처리된다."},{"n":33,"type":"mcq","stem":"FCAW 용착 금속 내에 과도하게 혼입된 망가니즈(Mn) 성분이 미치는 부정적 금속학적 영향은?","choices":["인성과 연성을 떨어뜨리고 고온 균열 민감성을 증가시킬 수 있다.","비드 위에 덮인 슬래그의 박리 속도를 비약적으로 단축시킨다.","비드 표면 색상을 짙은 흑색으로 완전히 산화 변색시킨다.","용착 금속의 항복점만 약 10% 가량 선택적으로 강하시키는 데 그친다."],"answerIndex":1,"answerText":"① 인성과 연성을 떨어뜨리고 고온 균열 민감성을 증가시킬 수 있다.","explain":"Mn은 적당량이면 탈산과 강도에 도움이 되지만 과다하면 인성·연성이 떨어지고 고온균열 민감성이 커진다. 슬래그 박리성이나 비드 색과는 직접 관계가 없다."},{"n":34,"type":"mcq","stem":"용접부의 인장 잔류응력을 소성 완화 방식으로 회복하기 위해, 특수 해머로 비드 표면층을 고속 타격하는 기법의 명칭은?","choices":["에이징 (Aging)","피닝 (Peening)","풀림 (Annealing)","노멀라이징 (Normalizing)"],"answerIndex":2,"answerText":"② 피닝 (Peening)","explain":"피닝은 비드 표면을 해머로 고속 타격해 소성변형을 주어 인장 잔류응력을 압축 쪽으로 바꾸는 기법이다. 풀림·노멀라이징은 가열로 응력을 제거하는 열처리다."},{"n":35,"type":"mcq","stem":"FCAW 작업 안전 수칙 중 밀폐 공간 질식 재해를 예방하기 위해 준수해야 하는 최저 적정 산소 농도 규격은?","choices":["12% 이상","15% 이상","18% 이상","21% 이상"],"answerIndex":3,"answerText":"③ 18% 이상","explain":"밀폐공간 적정 산소농도는 18% 이상 23.5% 미만이다. 18% 미만이면 산소결핍으로 질식 위험이 있어 반드시 농도 측정과 환기를 한 뒤 작업해야 한다."},{"n":36,"type":"short","stem":"FCAW 아래보기(1G) 맞대기 용접 시, 중력 방향 흐름 특성을 극복하고 용입 부족 결함을 차단하기 위해 규정하는 루트 면(Root Face)의 가공 치수는 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"0 mm (칼날 상태 유지, 가공 생략)","explain":"아래보기 자세에서는 용착 금속이 중력에 의해 용입되므로 루트 면이 존재할 경우 이면비드 형성이 방해받아 용입 부족 결함이 발생한다. 따라서 루트 면을 가공하지 않는다."},{"n":37,"type":"short","stem":"FCAW 수직 자세(3G) 맞대기 용접 시, 쇳물 처짐으로 인한 용락(Burn Through) 결함을 방지하기 위해 가공하는 적정 루트 면의 크기 범위[mm]를 기술하시오.","choices":[],"answerIndex":null,"answerText":"1.5mm ~ 2.0mm","explain":"수직 자세에서는 루트 면이 없으면 중력과 아크 열 집중으로 인해 용입 구멍이 너무 크게 뚫려 용락이 쉽게 발생한다. 이를 제어하기 위해 반드시 1.5~2.0mm의 루트 면을 남겨 가공해야 한다."},{"n":38,"type":"short","stem":"FCAW 수평 자세(2G) 맞대기 용접 시, 쇳물이 한쪽 모재로 쏠려 비대칭 비드가 되는 현상을 방지하기 위해 가공하는 적정 루트 면 크기 범위[mm]는?","choices":[],"answerIndex":null,"answerText":"1.5mm ~ 2.0mm","explain":"수평 자세에서는 루트 면이 없으면 아크 압력과 중력에 의해 상단 모재가 용융 유실되며 비대칭 쏠림이 가중된다. 1.5~2.0mm의 평평한 루트 면을 균일하게 가공해야 좌우 비드 평형을 유지할 수 있다."},{"n":39,"type":"short","stem":"수직 V형 t9.0 맞대기용접의 가조립 간격을 약 4.0mm로 세팅하려 한다. 이때 가압 상태의 개선 홈 틈새를 고정하기 위해 용접봉 심선으로 활용하면 가장 편리한 용접봉 규격 지름[mm]은?","choices":[],"answerIndex":null,"answerText":"Ø4.0 mm","explain":"Ø4.0 피복아크용접봉의 심선 지름이 정확히 4.0mm인 점을 응용하여 가조립 시 간격재로 틈새에 끼워넣어 가접 고정하면 매우 편리하게 오차를 제어할 수 있다."},{"n":40,"type":"short","stem":"수평 V형 t9.0 맞대기용접 가조립 시 루트 간격을 약 5.0mm로 벌린 상태에서 가접하려 한다. 이때 간격 게이지로 대용하기 가장 우수한 피복아크용접봉 규격 지름[mm]은?","choices":[],"answerIndex":null,"answerText":"Ø3.2 mm 저수소계 용접봉","explain":"Ø3.2 피복아크용접봉의 피복 부분 전체 지름이 약 5.0mm인 점을 응용하여 간격 세팅 게이지로 홈 사이에 직접 대용하여 가접을 시공한다."},{"n":41,"type":"short","stem":"FCAW 용접 시 기공(Blowhole) 결함을 유발하는 바람의 영향과 관련하여, 바람막이(방풍막) 설치를 의무적으로 가동해야 하는 기준 한계 풍속[m/sec]은?","choices":[],"answerIndex":null,"answerText":"2.0 m/sec 이상","explain":"풍속이 2.0m/s 이상일 경우 가스 노즐에서 토출되는 가스 제트 기류가 외풍에 의해 교란되어 대기 차단 실드가 완전히 무력화되므로 기공이 다량 발생한다. 반드시 바람막이를 설치해야 한다."},{"n":42,"type":"short","stem":"플라스틱 스풀(Spool)로 구성된 FCAW 전극 와이어가 다량의 대기 수분을 흡수했을 때, 열변형을 방지하기 위해 가동하는 표준 저온 재건조 시간[시간]은?","choices":[],"answerIndex":null,"answerText":"최소 48시간 이상","explain":"플라스틱 스풀은 고온 건조 시 변형되어 송급 불량을 일으키므로 50℃ 내외 저온 오븐에서 최소 48시간 재건조한다. 제조사·교재에 따라 24시간으로 보기도 한다."},{"n":43,"type":"short","stem":"강도 490 N/mm²급 탄소강 FCAW 전극 와이어 분류 기호 YFW-C50DR에서 수치 '50'이 지시하는 구체적인 용착 금속의 품질 규격 기준은 무엇인가?","choices":[],"answerIndex":null,"answerText":"최소 인장강도 490 N/mm² (50 kgf/mm²급)","explain":"수치 50은 인장시험 편에 가해지는 최소 인장 강도를 kgf/mm² 단위의 급수로 나타낸 것으로, 490 MPa급의 고장력강 이음이 충족되어야 함을 지시한다."},{"n":44,"type":"short","stem":"수직상진(3G) 표면비드 용접 시 이면비드 용접 대비 적정 아크 전압을 낮추어 조정해야 하는 구체적인 목표 전압 차이[V] 범위는?","choices":[],"answerIndex":null,"answerText":"1V ~ 2V","explain":"이면비드 전류 전압 그대로 표면비드를 올리면 수직 자세 특성상 쇳물이 자중에 의해 아래로 처져 언더컷, 오버랩이 극도로 발생하므로 전압을 1~2V 가량 의도적으로 낮추어 처짐을 억제한다."},{"n":45,"type":"short","stem":"FCAW 용접 시 정전압 특성(CV)에 따라, 토치와 모재 간의 거리가 가까워지면 용접 전류의 세기(A)는 어떻게 변화(상승/하강)하는가?","choices":[],"answerIndex":null,"answerText":"상승 (전류가 기하급수적으로 높아짐)","explain":"정전압 제어기에서는 아크 길이가 가까워져 아크 전압이 강하하려 할 때, 아크 전류를 극대화해 와이어 용융 속도를 가속시켜 원래의 아크 길이를 고속 복원하려 거동하므로 전류가 상승한다."},{"n":46,"type":"short","stem":"용접부의 기계적 굽힘성 검증을 위한 Guided 굽힘시험편 표면을 육안 검사할 때, 단일 균열의 크기가 최소 몇 mm 이상 발견되면 즉시 불합격(0점)으로 판정하는가?","choices":[],"answerIndex":null,"answerText":"3.0 mm 이상","explain":"Guided 굽힘시험 합격 판정 KS 기준에 따르면 단일 균열의 폭이 3.0mm 이상 발생하거나, 균열 크기가 3mm 미만이라도 균열의 누적 합계가 7.0mm를 넘으면 즉시 불합격 처리된다."},{"n":47,"type":"short","stem":"굽힘시험편 표면 외관 검사 시, 미세 기포 및 작은 균열의 누적 총 개수가 몇 개를 넘으면 기공 결함 누적으로 인해 즉시 0점 처리되는가?","choices":[],"answerIndex":null,"answerText":"10개 초과","explain":"굽힘시험편 표면의 기포·미세균열 누계가 10개를 초과하면 가스 오염 과다로 즉시 0점 처리된다. ASME QW-163은 개수 대신 결함 길이 합 10mm를 기준으로 삼기도 한다."},{"n":48,"type":"short","stem":"FCAW 다층 맞대기 용접 시, 층간 적정 온도 관리 범위를 충족하며, 과도한 열영향부 취화를 막기 위해 규정하는 층간 최고 제어 온도 기준은 일반적으로 몇 ℃ 이하인가?","choices":[],"answerIndex":null,"answerText":"250℃ ~ 350℃ 이하 (강종에 따라 차이)","explain":"WPS에 규정된 층간 최고 온도(탄소강 기준 일반적으로 250~350℃)를 초과하여 적층하면 열영향부 결정립의 과도한 조대화가 일어나 인성 저하 및 고온 균열 민감도가 상승한다."},{"n":49,"type":"short","stem":"FCAW 용접 시 보호가스(CO2)의 배출 속도와 유량이 적절히 흐르는지 가스체크 모드에서 측정할 때, 기계적으로 유도되는 가스 유량의 정석 범위[L/min]를 기술하시오.","choices":[],"answerIndex":null,"answerText":"20 ~ 25 L/min","explain":"FCAW는 단면적이 크고 고전류를 사용하므로 솔리드와이어보다 넓은 가스 장막이 요구되어 통상 20~25 L/min의 보호 유량을 고수해야 산소, 질소 혼입을 원천 차단할 수 있다."},{"n":50,"type":"short","stem":"용접 인장 잔류응력을 소성 변형 효과로 완화하기 위해 비드 표면층을 전용 해머로 균일하게 연속 타격하는 표면 피닝(Peening) 처리는 열간 상태와 냉간 상태 중 어느 상태에서 실행해야 소성 흐름 완화 효과가 극대화되는가?","choices":[],"answerIndex":null,"answerText":"열간 (Hot) 상태 (용접 직후 적열 상태)","explain":"용접부 온도가 매우 높은 열간 상태에서 가볍게 타격을 가해야 금속 결정 구조 내의 소성 전위 이동이 유연하게 유도되어 열수축 인장 잔류응력을 가장 효율적으로 이완 소멸시킬 수 있다."}]},"16":{"unit":16,"title":"가스텅스텐아크용접 도면 해독","code":"LM1601050302","group":"GTAW","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 공학이론"},{"t":"h3","v":"1. 제도 선의 종류와 쓰임새 및 우선순위 법칙"},{"t":"p","v":"한국산업표준(KS)에 의거한 설계 도면 작성 시 사용되는 선은 모양과 두께에 따라 그 물리적, 기하학적 의미가 철저하게 규정되어 있습니다. 특히 시험 도중 선이 겹쳤을 때의 대처 능력은 과정평가형 자격 외부평가의 고득점 합격 요인입니다."},{"t":"table","rows":[["선의 명칭 및 규격","선의 모양 및 특징","도면에서의 기능 및 구체적인 용도"],["외형선 (굵은 실선)","녹색 마감, 0.5mm 전후 연속된 실선 형태","대상 물체의 눈에 보이는 실제 형상을 표현하는 제도 바이블 선"],["숨은선/은선 (중간 파선)","황색 마감, 0.35mm 전후 일정한 단속적인 파선","대상 물체의 가려져 눈에 직접적으로 보이지 않는 내부 형상 및 윤곽 표현"],["중심선 (가는 1점 쇄선)","적색 마감, 0.25mm 전후 긴 선과 짧은 점 1개의 조화","도형의 가상의 대칭축, 구멍 및 보스의 기하학적 중심축을 명시하는 가이드 선"],["치수선 / 치수보조선 / 지시선 (가는 실선)","적색 마감, 0.25mm 전후 연속된 가는 실선 형태","치수 수치 표기선, 외곽 치수 도출 보조선, 기호 및 비파괴시험을 지시하는 인출선"],["가상선 (가는 2점 쇄선)","백색/적색 마감, 0.25mm 전후 긴 선과 점 2개의 연속 조화","인접부 가공 전후 상태의 가상 경계, 가동 부품의 한계 가동 영역 지시"],["절단선 (가는 쇄선 및 끝단 굵게)","적색 가는 실선 끝단에 녹색 실선 화살표와 단면기호 배치","단면도의 절단 위치 및 가상의 절단 경로를 단면도 상에 지시하는 선"]]},{"t":"p","v":"★ 실기 및 필기 초특급 필수 법칙 - 선의 우선순위 (Overlapping Lines Principle):"},{"t":"p","v":"도면 상에서 기하학적으로 서로 다른 선들이 동일한 지점에 겹칠 경우, 임의로 그리는 것이 아니라 법적으로 정해진 표준 우선순위에 의하여 가장 상위의 선을 표기해야 합니다. 순서는 다음과 같이 기하학적 중요성에 의해 구속됩니다:"},{"t":"p","v":"1순위: 외형선 (Visible Outline) - 최우선 표기"},{"t":"p","v":"2순위: 숨은선 (Hidden Line)"},{"t":"p","v":"3순위: 절단선 (Cutting Plane Line)"},{"t":"p","v":"4순위: 중심선 (Center Line)"},{"t":"p","v":"5순위: 무게 중심선 (Centroidal Line)"},{"t":"p","v":"6순위: 치수 보조선 (Dimension Extension Line)"},{"t":"h3","v":"2. 정투상법의 3각법 및 1각법 기하학적 비교"},{"t":"p","v":"용접 구조물 제작 도면은 입체물을 평면 제도 용지에 정확한 기하 구조로 전개하는 정투상법을 사용합니다. 한국산업표준(KS B 0001)에서는 제3각법을 표준 제도의 원칙으로 합니다."},{"t":"table","rows":[["구분 항목","제3각법 (Third Angle Projection)","제1각법 (First Angle Projection)"],["기본 투상 공간 범위","제3상한 공간에 배치 후 정사영","제1상한 공간에 배치 후 정사영"],["정사영 투상 순서","관찰자의 눈(Eye) → 투상면(Plane) → 물체(Object)","관찰자의 눈(Eye) → 물체(Object) → 투상면(Plane)"],["표준 3면도 배치 관계","정면도 위에 평면도, 우측에 우측면도가 위치 (ㄴ자 배치)","정면도 아래에 평면도, 좌측에 우측면도가 위치 (ㄱ자 배치)"],["용접기호 식별선 구분","실선(기준선)이 파선(식별선)보다 위쪽에 작도","실선(기준선)이 파선(식별선)보다 아래쪽에 작도"]]},{"t":"h3","v":"3. 용접 기호 및 가공 보조기호 완벽 해독 수칙"},{"t":"p","v":"KS B 0052 및 ISO 2553 규격과 미국의 AWS A2.4 규격은 용접 기호 표시법에 있어 결정적인 차이를 지니므로 과정평가형 구술 실기 구도에서 명확히 정답을 내리는 훈련이 요구됩니다."},{"t":"table","rows":[["구분 지표","KS B 0052 & ISO 2553 표준 규정","AWS A2.4 규격 표준 규정"],["용접 기선 시스템","수평의 기준선(실선) + 평행한 식별선(파선)","수평의 기준선(실선) 단일선으로만 작도 구성"],["화살표 쪽(Arrow Side)","용접 기호가 실선(기준선) 쪽에 밀착하여 기입됨","용접 기호가 기준선 아래(Below) 쪽에 기입됨"],["화살표 반대쪽(Other Side)","용접 기호가 파선(식별선) 쪽에 밀착하여 기입됨","용접 기호가 기준선 위(Above) 쪽에 기입됨"],["치수 기입 레이아웃","가로 단면 치수(S, 목두께)는 좌측, 세로 치수는 우측","KS와 대체적으로 유사하나 일부 보조기호 병기 위치 상이"],["표면 다듬질 가공 표기","꼬리표(Tail)의 텍스트 혹은 기본 용접부 기호 표면에 표기","표면 다듬질 보조기호 위에 직접 머시닝 기호(C, G, M) 부가"]]},{"t":"h2","v":"제2부: 대표 엄선 50제 평가 문항 및 모범 해설"}],"questions":[{"n":1,"type":"mcq","stem":"용접 구조물 제도 시 물체의 직접 눈에 보이는 실제 형태를 도시할 때 사용하며, 실습 도면 상에서 주로 녹색선(굵기 0.5mm 전후)으로 작도하는 표준 선의 명칭으로 옳은 것은?","choices":["가상선","숨은선","외형선","해칭선"],"answerIndex":3,"answerText":"③ 외형선","explain":"외형선은 물체의 보이는 부분의 형상을 나타내는 굵은 실선으로 제도에서 가장 기본적이고 비중이 높은 최우선선입니다. 녹색으로 가공되며 두께는 약 0.5mm를 규격으로 삼습니다."},{"n":2,"type":"mcq","stem":"도면 상에서 여러 선들이 단일 좌표 지점에 중복될 경우, 법적으로 수립된 선의 표기 우선순위가 높은 것부터 낮은 순으로 올바르게 나열된 것은?","choices":["외형선 → 숨은선 → 절단선 → 중심선","중심선 → 외형선 → 숨은선 → 치수보조선","숨은선 → 외형선 → 중심선 → 절단선","절단선 → 중심선 → 무게중심선 → 외형선"],"answerIndex":1,"answerText":"① 외형선 → 숨은선 → 절단선 → 중심선","explain":"선의 겹침 우선법칙에 의거하여 외형선 > 숨은선 > 절단선 > 중심선 > 무게중심선 > 치수보조선 순으로 작도 우선권이 귀속됩니다."},{"n":3,"type":"mcq","stem":"정투상법에서 투상하는 순서가 '관찰자의 눈 → 투상면 → 대상 물체'로 전개되며, 한국산업표준(KS) 및 공업제도 통칙에서 표준 원칙으로 삼고 있는 투상각법의 종류는?","choices":["제1각법","제2각법","제3각법","제4각법"],"answerIndex":3,"answerText":"③ 제3각법","explain":"제3각법은 눈, 투상면, 물체 순으로 투상되는 배치로서 정면도를 기준으로 상단에 평면도, 우측에 우측면도가 배치되므로 실물 파악이 용이하여 KS의 대원칙입니다."},{"n":4,"type":"mcq","stem":"정투상법의 각법을 도면상에 식별 기호로 작도할 때, 용접기호에서 실선(기준선)이 파선(식별선)의 위쪽에 작도되어 있으면 어떤 각법으로 작도되었음을 인지해야 하는가?","choices":["제1각법","제2각법","제3각법","제4각법"],"answerIndex":3,"answerText":"③ 제3각법","explain":"제3각법의 식별을 위한 용접기호 기준선 조합은 실선이 파선의 상부에 놓일 때를 규정하며, 실선이 파선의 하부에 배치되어 있으면 제1각법으로 식별합니다."},{"n":5,"type":"mcq","stem":"제3각법 정투상도 전개 배치 시, 정면도(Front View)를 수평축 기준으로 직교하여 수직 바로 위쪽에 배치해야만 하는 필수 투상면 투상도의 명칭은 무엇인가?","choices":["평면도","우측면도","좌측면도","저면도"],"answerIndex":1,"answerText":"① 평면도","explain":"제3각법 배치 도면 규칙에 따라 정면도의 수직 상부에는 물체를 위에서 아래로 내려다본 평면도(Top View)가 엄격하게 배치되어야 합니다."},{"n":6,"type":"mcq","stem":"용접부 비파괴 시험(NDT) 기호를 도면에 기입할 때, 지시선(Arrow Line)이 시험 대상 접합부를 향하여 이루어야 하는 기준선과의 표준 권장 각도로 옳은 것은?","choices":["30°","45°","60°","90°"],"answerIndex":3,"answerText":"③ 60°","explain":"비파괴 시험기호 제도 통칙에 따르면, 지시선은 시험 부위를 정밀 표기하는 인출선으로서 기준선(수평선)에 대해 약 60°의 경사를 이끌어 직선 작도하는 것이 정석입니다."},{"n":7,"type":"mcq","stem":"용접부 비파괴 시험에서 용접 접합부 표면에 침투액을 모세관 현상으로 강제 침투시킨 후 현상액을 도포하여 미세 표면 균열을 육안으로 검출하는 탐상 시험의 기호는?","choices":["RT","UT","MT","PT"],"answerIndex":4,"answerText":"④ PT","explain":"PT(Penetrant Testing)는 침투 탐상 시험으로, 표면에 노출된 기공, 언더컷, 균열을 형광 또는 염색 적색 침투액을 사용하여 모세관 침투력으로 손쉽게 검출하는 경제적인 NDT 방식입니다."},{"n":8,"type":"mcq","stem":"초음파의 고주파 음향 에너지를 용접부 내부로 투과시켜 반사되어 돌아오는 에코 음파를 디지털 오실로스코프 지표로 검출해 내부 결함을 검사하는 초음파 탐상 시험의 규격 기호는?","choices":["RT","UT","MT","ET"],"answerIndex":2,"answerText":"② UT","explain":"UT(Ultrasonic Testing)는 초음파 탐상 시험입니다. 내부 결함의 깊이와 평면적 위치를 정밀 디지털 파형으로 식별 가능한 최고 신뢰도 내부 비파괴 시험 기법입니다."},{"n":9,"type":"mcq","stem":"용접부에 방사선 원(X-ray 또는 Gamma-ray)을 조사하여 뒷면 필름 감광 현상 및 흑화도 농도 밀도를 기반으로 기공 및 슬래그 혼입을 영구 사진 판독하는 시험 기호는?","choices":["RT","PT","UT","MT"],"answerIndex":1,"answerText":"① RT","explain":"RT(Radiographic Testing)는 방사선 투과 시험으로, 결과가 X선 건판 사진으로 영구 보존 가능한 장점을 가져 과정평가형 자격 실기 굽힘시험의 면제 기준이 되기도 합니다."},{"n":10,"type":"mcq","stem":"비파괴 시험 기호 표기법 상, 샘플링(Sampling) 방식으로 시공 접합부의 전체가 아닌 일부 구간에 대해서만 부분 검사를 실시할 때 적용하는 표준 시험 기호 형식은?","choices":["RT-O","RT-Δ","RT-W","RT-S"],"answerIndex":4,"answerText":"④ RT-S","explain":"부분(샘플링) 시험은 시험 방법 기호 뒤에 Sampling의 S를 붙여 RT-S로 표기하고, 부기가 없으면 전체 시험을 뜻한다."},{"n":11,"type":"mcq","stem":"표면 용접부 다듬질 가공 및 사상 작업을 연삭기로 실행하라는 명령의 가공 보조기호 규격 철자로 올바른 것은?","choices":["M","H","C","G"],"answerIndex":4,"answerText":"④ G","explain":"G(Grinding)는 연삭기(그라인더)를 사용하여 표면 용접 비드의 과도한 보강 덧살을 평면 혹은 매끄럽게 가공 사상하는 연삭 마무리 가공 기호입니다."},{"n":12,"type":"mcq","stem":"용접 기호 기준선 끝부분에 붙여 용접의 적용 공법, 시방 규정, 품질 등급 및 비파괴시험의 기준 등의 추가 요구사항을 문자 정보로 수록하는 요소의 명칭은?","choices":["기준선","식별선","지시선 화살표","꼬리(Tail)"],"answerIndex":4,"answerText":"④ 꼬리(Tail)","explain":"꼬리(Tail)는 생략 가능하나, 용접방법(GTAW, SMAW 등), 적용 법적 규정, 상세 비파괴검사 요건 등 도면 상에 기입하기 복잡한 사양을 문자로 지정하는 중요 지면입니다."},{"n":13,"type":"mcq","stem":"KS B 0052 규격에 따른 용접 기본 기호 중, 용접 비드의 표면 마무리를 동일 면으로 편평하게 일치시키라는 보조 기호인 '평면'의 기호 형태는?","choices":["⌢ (위로 볼록한 곡선)","⌣ (아래로 오목한 곡선)","⎯ (수평 일직선)","○ (완전한 원형)"],"answerIndex":3,"answerText":"③ ⎯ (수평 일직선)","explain":"수평의 일직선(⎯) 보조기호는 용접 후 비드 표면 형상을 그라인딩이나 머시닝 공정 등을 이용하여 모재와 편평한 동일 평면으로 가공 처리하라는 의미의 평면 기호입니다."},{"n":14,"type":"mcq","stem":"T이음이나 십자형(十字) 접합부의 한쪽 모재 면을 사전에 경사지게 깎아내는 개선 홈 형태를 지니며, 외관 상 한쪽 베벨형으로 작도되는 개선 홈 가공 기호 형상은?","choices":["I","V","K","⌿ (베벨형)"],"answerIndex":4,"answerText":"④ ⌿ (베벨형)","explain":"한쪽 베벨 홈 용접 기호는 한쪽 판만을 비스듬히 가공하여 이음하는 것으로, 용접 기호상 사선 한 개와 수직선 한 개가 조합된 '⌿' 모양으로 기입됩니다."},{"n":15,"type":"mcq","stem":"용접부 가공방법 기호 중 'U'가 도면 꼬리표나 기준선 영역 상에 단독 지정되어 있을 때, 해당 이니셜이 내포하고 있는 공학적 해독 의미는?","choices":["그라인더 사상 가공이 이미 완료됨","치핑으로 정밀 제거 작업이 필요함","가공은 필요하나 방법은 미정 상태","기계 머시닝 가공이 강제 의무임"],"answerIndex":3,"answerText":"③ 가공은 필요하나 방법은 미정 상태","explain":"U는 'Unspecified'의 약어로, 도면 가공 필요성은 절실하지만 공장에서 연삭을 할지 머시닝을 할지 구체적인 가공방법을 확정하지 않고 비워둔 미정 상태를 뜻합니다."},{"n":16,"type":"mcq","stem":"제조 도면에 기입된 용접 기호 중 기호의 왼쪽에 아라비아 숫자 '5'가 적혀 있고, 해당 용접부 기본 기호가 필릿(Fillet) 삼각형 '⊿'인 경우, 이 숫자 '5'의 의미는?","choices":["연속 용접 길이 50mm","목두께(각장) 치수 5mm","용접 피치 간격 5mm","용접 비드의 볼록 보강 치수 5mm"],"answerIndex":2,"answerText":"② 목두께(각장) 치수 5mm","explain":"용접 가로 단면 방향의 주요 치수인 목두께(a) 또는 다리길이(각장 z) 수치는 기본 용접 기호의 좌측(앞쪽)에 밀착 기입하게 되어 있으므로 각장/목두께 5mm를 뜻합니다."},{"n":17,"type":"mcq","stem":"도면에 기입된 용접 기호 오른쪽에 '3×50(100)'과 같이 연속된 수치가 수록되어 있는 경우, 괄호 내부의 수치인 '100'이 지시하는 공학적 정의는?","choices":["단속 용접부의 총 비드 수","단속 용접부 비드 1개의 개별 길이","단속 용접부 인접 비드 중심 간의 거리(피치)","단속 용접부의 용입 깊이"],"answerIndex":3,"answerText":"③ 단속 용접부 인접 비드 중심 간의 거리(피치)","explain":"단속 필릿용접부 수치 배치 식인 n×ℓ(e)에서, 괄호 내부 또는 피치 위치인 (e)는 용접부 중심과 인접 용접부 중심 간의 간격(피치, Pitch)인 100mm를 엄격히 의미합니다."},{"n":18,"type":"mcq","stem":"구조물 제조 용접 도면에 용접 기호 화살표와 수평 기준선이 만나는 교점(Intersection) 지점에 동그란 원형 '○' 기호가 작도되어 있을 때, 현장 용접사에게 지시하는 시공 수칙은?","choices":["공장 안에서만 제작하는 공장 용접 진행","용접부 전체 둘레를 돌아가며 시공하는 일주 용접","용접부 일부만 뽑아 시행하는 부분 샘플링 비파괴시험","이면 용접을 위한 뒷면 가우징 작업 실행"],"answerIndex":2,"answerText":"② 용접부 전체 둘레를 돌아가며 시공하는 일주 용접","explain":"기준선과 화살표 지시선이 맞닿은 경계 교점에 작은 원(○)이 그려져 있으면, 접합 부품의 전체 모서리 둘레를 빈틈없이 한 바퀴 돌며 용접하는 '일주용접(온둘레용접)'을 강제합니다."},{"n":19,"type":"mcq","stem":"도면 상에서 용접 기준선과 지시선의 교점에 깃발(Flag) 보조 기호가 서 있도록 배치되어 있는 경우, 용접 작업이 수행되어야 하는 최적 장소 지침은 무엇인가?","choices":["제작 공장 내부의 사내 조립 라인 공정","구조물이 실제로 설치되는 '현장(Field)'","온도가 정밀 통제되는 사내 정밀 기계실 가공대","외주 전문 업체에 위탁하는 협력 공장 라인"],"answerIndex":2,"answerText":"② 구조물이 실제로 설치되는 '현장(Field)'","explain":"깃발(Flag) 보조 기호는 '현장용접(Field Weld)'을 명시하는 것으로, 제품을 제작 공장에서 완료하지 않고 건설 또는 설치를 진행하는 최종 야외/현장에서 직시 용접 조립할 것을 지시합니다."},{"n":20,"type":"mcq","stem":"미국용접협회(AWS A2.4) 용접 규격을 적용한 도면 해독 시, 맞대기 용접 기호가 수평 기준선의 상부(Above) 영역에 단독으로 위치해 있다면, 이는 용접 시공을 어디에 하라는 지시인가?","choices":["화살표가 가리키는 지시선 쪽(Arrow Side)","지시선 화살표의 반대쪽(Other Side)","접합부 양면 대칭 동시 용접","수직 자세 위보기 용접"],"answerIndex":2,"answerText":"② 지시선 화살표의 반대쪽(Other Side)","explain":"AWS 기호 규정은 기준선 아래쪽이 화살표 쪽(Arrow side)이고, 기준선 위쪽에 기재된 모든 용접기호는 화살표 반대쪽(Other side) 용접 시공을 명시합니다. KS 및 ISO의 파선 식별선 시스템과 가장 상충되는 고변별력 구술 단골 요건입니다."},{"n":21,"type":"mcq","stem":"용접 제작 도면의 부품란에서 모재 규격이 'SF400'으로 지칭되어 표기되어 있는 경우, 이 재료 기호가 나타내는 금속 소재의 올바른 학술적 분류는 무엇인가?","choices":["기계 구조용 탄소 강재","일반 구조용 압연 강재","탄소강 단조품","보일러용 탄소 강관"],"answerIndex":3,"answerText":"③ 탄소강 단조품","explain":"SF(Steel Forging) 기호는 단조 가공을 거친 탄소강 단조품을 명확하게 지칭하며, 뒤의 400은 재료의 최저 인장강도 수치(400 MPa 또는 40 kg/mm²)를 대변합니다."},{"n":22,"type":"mcq","stem":"KS 재료 기호 표기법 체계 중 'SM45C' 규격의 명칭은 무엇이며, 숫자 '45'가 내포하고 있는 화학적 탄소 배합 제어 수치는?","choices":["기계구조용 탄소강재, 대표 탄소 함유량 0.45% 배합","일반구조용 강재, 최저 인장강도 45 kg/mm² 보증","용접 구조용 강관, 규소 함유량 0.45% 규제","합금 공구강재, 망가니즈 함유량 4.5% 보장"],"answerIndex":1,"answerText":"① 기계구조용 탄소강재, 대표 탄소 함유량 0.45% 배합","explain":"SM45C(Steel Machine)는 기계 구조용 탄소 강재를 뜻하며, 뒤의 45C는 모재 내에 포함된 평균 탄소량 수치가 0.45%($0.42\\% \\sim 0.48\\%$)임을 지칭하는 기계가공 핵심 소재입니다."},{"n":23,"type":"mcq","stem":"가스텅스텐아크용접(GTAW) 도면해독 실무 중, 스테인리스강(STS 304) 파이프 맞대기 용접 도면에서 이면에 산화를 방지하기 위해 불활성 가스를 불어넣는 공정 명칭과 가스 유량은?","choices":["이면 층간 청소 및 산소 5 LPM","백 가스 퍼징 및 10~15 LPM","플럭스 이면 보수 및 공기 30 LPM","이면 예열 처리 및 가스 불필요"],"answerIndex":2,"answerText":"② 백 가스 퍼징 및 10~15 LPM","explain":"오스테나이트계 스테인리스강 등은 고온 용접 시 공기 중 산소와 결합해 이면이 과도하게 산화(산화 비드 낙하)되므로, 아르곤 불활성 가스를 이면 챔버 내에 가두고 가밀 유출시키는 이면 퍼징(Purging, 약 10~15 LPM)을 법적으로 필수화합니다."},{"n":24,"type":"mcq","stem":"용접절차사양서(WPS)에 등재된 모재의 대분류 식별 번호로서 탄소강의 화학 조성에 따라 'P-No. 1'로 분류하고 기록을 보증하는 글로벌 관리 표준 코드는?","choices":["ASME Section IX (QW-403)","AWS D1.1 (Chapter 2)","KS B ISO 9606","ISO 5817"],"answerIndex":1,"answerText":"① ASME Section IX (QW-403)","explain":"WPS/PQR 자격 승인 요건인 ASME Sec.IX 규정 상 QW-403 모재 데이터에서 연강 및 일반 구조용 탄소강의 대분류 코드번호는 P-No.1로 분류 보증 관리되고 있습니다."},{"n":25,"type":"mcq","stem":"정투상도 도면 제도 영역에 참고할 목적으로 기입되는 참고 치수를 표현할 때, 수치 숫자를 둘러싸며 표기해야 하는 표준 약속 기호는 무엇인가?","choices":["정사각형 사각 틀 (□)","둥근 원형 틀 (○)","둥근 괄호 기호 ( ( ) )","하단 밑줄 선 ( _ )"],"answerIndex":3,"answerText":"③ 둥근 괄호 기호 ( ( ) )","explain":"정부 규격 및 제도 규칙 상 도면 기하 파악에 참고용으로만 사용하고 제작 검사 공차 기준에서는 배제되는 '참고 치수'는 치수 수치 앞뒤를 괄호( ( ) )로 감싸서 제도합니다."},{"n":26,"type":"mcq","stem":"도면 치수 수치 사방을 완벽하게 밀폐형 사각 테두리 사각형(□)으로 감싸서 감정 없이 단독 기입한 치수가 나타내는 공학적 해독 명칭은?","choices":["45° 모따기 가공 규격 지시 치수","이론적으로 정확한 치수(TED)","판재 두께 하한 보장 지시 치수","오차가 ±10% 허용되는 비제어 치수"],"answerIndex":2,"answerText":"② 이론적으로 정확한 치수(TED)","explain":"숫자 전체에 정밀 사각 틀(□)이 둘러쳐진 수치는 '이론적으로 정확한 치수'로서, 비파괴 시험 위치 지시 및 정밀 공차 누적이 발생하지 않는 기하학적 기준 거리를 설정할 때 쓰입니다."},{"n":27,"type":"mcq","stem":"도면에 표기되는 치수 보조기호 중 구(Sphere, 원형 공 모양)의 반지름 치수를 완벽하게 지시하고자 할 때 치수 수치 바로 앞에 항시 기입해야 하는 표준 기호는?","choices":["SR","Sø","R","CR"],"answerIndex":1,"answerText":"① SR","explain":"치수 보조기호 표준 약속에 따라 평면 원호의 반지름은 'R', 원형의 지름은 'ø'이지만 구체(Sphere) 형상을 띠는 삼차원 구의 지름은 'Sø', 구의 반지름은 'SR'로 약식 지정해야 합니다."},{"n":28,"type":"mcq","stem":"제조 제도 도면의 표제란(Title Block)에 투상법을 명시할 때 'NS'라고 기입되어 표기되어 있다면, 이 약어가 내포하고 있는 제도적 척도 비율 배율의 해독은?","choices":["실물과 같은 크기의 1:1 현척 지시","실물 비와 무관한 비비례(Not to Scale)","실물 크기 대비 10배로 확대 기입하는 배척 지시","도면 크기가 임의로 가변되는 가변척 지시"],"answerIndex":2,"answerText":"② 실물 비와 무관한 비비례(Not to Scale)","explain":"NS(Not to Scale)는 비비례를 나타냅니다. 즉 물체의 크기가 도면에 표시된 척도와 정확한 비례 관계를 띠지 않고 임의의 규격으로 형상만을 명확히 그렸음을 의미합니다."},{"n":29,"type":"mcq","stem":"용접부 도면 작성 시 얇은 판재 또는 형강류 등 아주 얇은 강판 단면을 도면상에 시각적으로 도식 전개할 때 가장 적합한 제도 작도 선 형태는?","choices":["굵은 실선 단일 두께로 작도 표기","아주 가는 파선으로 가공 표기","해칭선을 촘촘하게 규칙 배열","가는 이점쇄선으로 대칭 전개"],"answerIndex":1,"answerText":"① 굵은 실선 단일 두께로 작도 표기","explain":"박판(얇은 판)이나 형강의 단면 부위를 정투상할 경우, 공간 해상 한계로 개선 홈 형상을 세밀히 그리기 곤란하므로 '굵은 실선' 단일 선을 이용하여 간략하게 덧칠하듯 수평 작도하는 것이 원칙입니다."},{"n":30,"type":"mcq","stem":"가스텅스텐아크용접(TIG) 토치와 용가재를 수작업 제어할 때, 도면에 표기된 수평(H) 및 수직(V) 용접 자세에 따른 AWS 맞대기(Groove) 그루브 표준 자격 인정 시험 기호 매칭이 옳은 것은?","choices":["수평 자세: 2G , 수직 자세: 3G","수평 자세: 1G , 수직 자세: 4G","수평 자세: 4G , 수직 자세: 2G","수평 자세: 3G , 수직 자세: 1G"],"answerIndex":1,"answerText":"① 수평 자세: 2G , 수직 자세: 3G","explain":"미국용접학회(AWS) 홈 용접자세 규격 코드 매칭 상 수평자세는 2G(Horizontal Groove), 수직 상진/하진 자세는 3G(Vertical Groove)로 지칭됩니다."},{"n":31,"type":"mcq","stem":"가스텅스텐아크용접(GTAW) 시험편 맞대기 개선 홈에 이면비드 용융 풀의 구멍을 유지하며 완전히 용입 관통시키는 비드 형성을 위해, 전면 패널에서 조작해야 하는 '초기 가스 방출 시간(Pre-Flow)'의 권장 표준 범위는?","choices":["0.1 ~ 0.5초","10 ~ 15초","30초 이상 연속","기압 수치에 비례 제어"],"answerIndex":1,"answerText":"① 0.1 ~ 0.5초","explain":"용접 시작 전 아크 스타트 부위의 대기 오염(질화·산화 결함)을 원천 차단하기 위해 아르곤 가스를 사전에 밀어내는 초기 가스 분사 시간(Pre-flow)은 약 0.1~0.5초(보통 0.3초)가 가장 공학적입니다."},{"n":32,"type":"mcq","stem":"TIG 용접 토치의 소모성 내부 부품 중, 세라믹 노즐 내부에서 분출되는 아르곤 보호가스의 흐름을 소용돌이 치지 않는 균일한 층류(Laminar Flow)로 형성시켜 전극봉 돌출 한계를 15~20mm 이상 확장시켜 주는 부품 명칭은?","choices":["콜릿 척","가스 렌즈","토치 롱 캡","콘택트 팁"],"answerIndex":2,"answerText":"② 가스 렌즈","explain":"가스 렌즈(Gas Lens)는 내부에 미세 구리 망 필터를 지녀 난류 형태의 가스 분출을 완전한 직선 층류로 정류해 줍니다. 깊은 홈 용접 시 전극봉을 무리하게 길게 뽑아도 산화 결함을 완벽히 억제하는 고정밀 부품입니다."},{"n":33,"type":"mcq","stem":"TIG 맞대기용접 도면 상에 모재 두께 9.0t 철판 가공 규격이 지시되어 있다. 이면 용융비드(백비드) 완전 용입 시험을 수행하기 위한 수동 TIG 운봉 시, 용가재(용접봉)의 가장 보편적인 최적 송급 진입각도 범위는?","choices":["90° 직각 수직 낙하 송급","진행 각의 반대방향 45° 역송급","용접 토치 축 기준 10° ~ 20° 범위 송급","모재 표면 수평면 기준 10° ~ 20° 범위 송급"],"answerIndex":4,"answerText":"④ 모재 표면 수평면 기준 10° ~ 20° 범위 송급","explain":"용가재는 전극봉에 닿아 녹아 달라붙지(텅스텐 혼입) 않도록 아크 용융 풀 끝단에 살며시 밀어 넣어 주어야 합니다. 이때 용가재와 모재 평판 표면 사이의 송급 진입각도는 약 10°~20°를 일정히 제어하는 것이 정석입니다."},{"n":34,"type":"mcq","stem":"오스테나이트 스테인리스강(STS 304) 맞대기 용접 완료 후 표면 및 이면 비드를 검사했을 때, 가스 실딩 부족 및 입열 과다 제어 실패로 인해 나타나는 산화막 변색 비드의 불합격 외관 결함 명칭은?","choices":["용락 현상","루트 균열","언더컷","산화 비드"],"answerIndex":4,"answerText":"④ 산화 비드","explain":"산소와 수분이 완벽히 차단되지 않은 고온의 STS 표면은 크롬 탄화물 형성 및 격렬한 산화로 비드가 회흑색으로 타버립니다. 이 산화 비드는 내식성을 영구히 상실하므로 즉시 불합격 요인으로 판정됩니다."},{"n":35,"type":"mcq","stem":"TIG 용접 공사 중 아크 열을 모재에 지속 가한 후 용접 단점이 끝나는 부위에 아크 급격 소멸로 인해 납작하거나 오목하게 파인 함몰 구멍 결함이 형성되는 명칭과 대책은?","choices":["기공 - 아크 발생 도중 보호가스 공급의 완전 차단","언더컷 - 용가재 봉 각도를 90도로 변경","오버랩 - 용접 속도를 저속으로 고정화","크레이터 균열 - 다운슬로프 및 크레이터 전류 조작"],"answerIndex":4,"answerText":"④ 크레이터 균열 - 다운슬로프 및 크레이터 전류 조작","explain":"용착 비드의 최후 종단점 함몰 부위를 '크레이터(Crater)'라고 부르며, 이를 방치하면 내부 수축 균열이 유발됩니다. 예방을 위해 용접기 조작반의 전류 감쇄 하강 시간(Down-slope)과 크레이터 제어(Crater fill) 회로를 이용해 잔류 풀을 보충 충전해야 합니다."},{"n":36,"type":"short","stem":"용접부 비파괴 검사 기호 중, 방사선 투과 시험의 표준 영문 약어(2글자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"RT","explain":"방사선 투과 시험은 Radiographic Testing의 약어로 도면에 'RT'로 표기합니다."},{"n":37,"type":"short","stem":"용접부 비파괴 검사 기호 중, 초음파 탐상 시험의 표준 영문 약어(2글자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"UT","explain":"초음파 탐상 시험은 Ultrasonic Testing의 약어로 도면에 'UT'로 표기합니다."},{"n":38,"type":"short","stem":"용접부 비파괴 검사 기호 중, 침투 탐상 시험의 표준 영문 약어(2글자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"PT","explain":"침투 탐상 시험은 Penetrant Testing의 약어로 도면에 'PT'로 표기합니다."},{"n":39,"type":"short","stem":"용접부 비파괴 검사 기호 중, 자분 탐상 시험의 표준 영문 약어(2글자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"MT","explain":"자분 탐상 시험은 Magnetic Particle Testing의 약어로 도면에 'MT'로 표기합니다."},{"n":40,"type":"short","stem":"용접부 비파괴 검사 기호 중, 육안 검사의 표준 영문 약어(2글자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"VT","explain":"육안 검사는 Visual Testing의 약어로 도면에 'VT'로 표기합니다."},{"n":41,"type":"short","stem":"용접 가공 보조 기호 중, 용접 비드 표면의 과도한 덧살 부강부를 연삭기로 평면 또는 매끄럽게 처리하는 사상 작업 지시 기호 철자 1자를 쓰시오.","choices":[],"answerIndex":null,"answerText":"G","explain":"연삭 가공(Grinding)을 나타내는 기호는 대문자 'G'입니다."},{"n":42,"type":"short","stem":"용접 가공 보조 기호 중, 이면 용접이나 루트 면 가공 시 기계 가공 및 기계 절삭 가공을 지시하는 가공 기호 철자 1자를 쓰시오.","choices":[],"answerIndex":null,"answerText":"M","explain":"머시닝 기계 절삭 가공(Machining)을 나타내는 기호는 대문자 'M'입니다."},{"n":43,"type":"short","stem":"WPS의 필수 변수 관리 항목 중, 가스텅스텐아크용접(GTAW) 시 전기적 특성에 해당하며 용접 시 사용하는 전류와 극성을 지칭하는 영문 명칭(Current & ____)의 빈칸 단어를 쓰시오.","choices":[],"answerIndex":null,"answerText":"Polarity","explain":"WPS QW-409 항목에서 전류와 극성은 'Current & Polarity'로 공식 명명하여 직류 역극성(DCRP) 혹은 직류 정극성(DCSP) 등을 식별 기록합니다."},{"n":44,"type":"short","stem":"ASME Section IX 코드에 따른 모재 특성 분류에서, 일반 연강 및 구조용 탄소강 모재가 가지는 고유 분류 규격 코드인 'P-No. '에 들어갈 해당 숫자를 기입하시오.","choices":[],"answerIndex":null,"answerText":"1","explain":"ASME 용접 절차 인정 코드에서 연강의 화학 조성에 근거한 대분류 번호는 'P-No. 1'입니다."},{"n":45,"type":"short","stem":"제3각법 정투상 도면의 표준 기본 3면도 배치에서, 정면도(Front View)를 기준으로 바로 상부 수직 방향에 놓여야만 하는 투상도 면의 한글 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"평면도","explain":"제3각법 정투상 배치 규칙 상 정면도의 바로 위에는 평면도가 와야 합니다."},{"n":46,"type":"short","stem":"제3각법 정투상 도면의 표준 기본 3면도 배치에서, 정면도(Front View)를 기준으로 수평 방향 오른쪽에 일정 간격을 두고 배치되는 투상도 면의 한글 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"우측면도","explain":"제3각법 정투상 배치 규칙 상 정면도의 우측에는 우측면도가 와야 합니다."},{"n":47,"type":"short","stem":"WPS/PQR에서 용접 시 가해지는 열량을 의미하며, 전류(A) × 전압(V) × 60 / 용접속도(mm/min) 공식으로 산출하는 '용접 ______(Heat Input)'의 빈칸 공학 단어를 쓰시오.","choices":[],"answerIndex":null,"answerText":"입열량","explain":"용접 입열량(Heat Input)은 열영향부의 연성 저하와 변형을 제어하는 아주 중차대한 관리 공학 변수입니다."},{"n":48,"type":"short","stem":"WPS 기재 항목 중, 용접 완료 후 열영향부 잔류 응력 소멸 및 마르텐사이트 연화 연성을 회복시키기 위해 가해지는 후열 처리 공정의 대표 영문 약어 4자(PWHT)의 원형 풀네임(Post Weld ____ Treatment) 빈칸 단어를 쓰시오.","choices":[],"answerIndex":null,"answerText":"Heat","explain":"PWHT는 'Post Weld Heat Treatment'의 약어로, 용접 후 열처리를 공식 지칭합니다."},{"n":49,"type":"short","stem":"용접 산업 기사 굽힘 시험 합격 판정 기준에 의거하여, 시편을 굽힘 시험기에 가압 성형한 후 인장 연성 표면 외관 검사 시, 단일 균열이 최대 몇 mm 이상 발생하는 즉시 감점 없는 불합격(0점)으로 실격 판정되는지 해당 한계 수치(숫자)를 적으시오.","choices":[],"answerIndex":null,"answerText":"3","explain":"굽힘시험에서 단일 표면 균열의 치수가 '3mm' 이상 돌출되어 나타나는 경우에는 공학적 취성 한계 돌파 불량으로 보아 즉시 실격(0점) 기준을 적용하는 것이 법적 규정입니다."},{"n":50,"type":"short","stem":"용접 기호 기준선 끝부분에 붙여 용접의 적용 규정이나 비파괴검사법 등 상세 지시사항을 기록하는 부위의 명칭(한글 2자)을 쓰시오.","choices":[],"answerIndex":null,"answerText":"꼬리","explain":"용접 기호의 맨 우측 끝 부분에 갈라진 모양으로 작도되는 부분은 '꼬리(Tail)'라고 부르며, 특별 시방 요건을 명문화합니다."}]},"17":{"unit":17,"title":"가스텅스텐아크용접 재료 준비","code":"LM1601050303","group":"GTAW","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 공학이론"},{"t":"h3","v":"1. 모재 재질 특성 및 분석 (학습모듈 1)"},{"t":"p","v":"가스텅스텐아크용접(GTAW/TIG)을 효율적으로 수행하기 위해서는 용접 대상이 되는 모재의 물리적, 화학적, 야금학적 특성을 올바르게 분석하고 이에 대응하는 용접 전략을 수립해야 합니다. 현장에서 가장 널리 사용되는 탄소강, 스테인리스강, 알루미늄 및 동합금의 재질 거동은 다음과 같습니다."},{"t":"h3","v":"1.1 철강 재료의 분류와 탄소 및 합금 원소의 영향"},{"t":"p","v":"철강 재료는 탄소 함유량에 따라 크게 순철(Fe 99.9% 이상, C ≤ 0.01%), 강(Steel, C 0.02% ~ 2.0% 미만), 주철(Cast Iron, C 2.0% 이상)로 분류할 수 있습니다. 수험생들이 반드시 정리해야 하는 분류 기준 및 특성은 아래와 같습니다."},{"t":"li","v":"순철(Pure Iron): 인성과 연성은 우수하나 너무 연해 구조용 재료로 부적합하며, 주로 전기용 자재나 실험용 소재로 제한 적용됩니다."},{"t":"li","v":"탄소강(Carbon Steel): 탄소량에 따라 극저탄소강(C ≤ 0.08%), 저탄소강(C 0.08% ~ 0.3%), 중탄소강(C 0.3% ~ 0.5%), 고탄소강(C 0.5% ~ 1.7% 수준)으로 분할됩니다."},{"t":"li","v":"용접성 검토: 탄소(C) 함유량이 0.22% 이하인 극저탄소강 및 저탄소강은 야금학적 자경성이 거의 발생하지 않아 우수한 용접성을 나타내므로 특별한 예열 없이도 용접이 가능합니다."},{"t":"li","v":"예열 요건: 탄소량이 0.3%를 초과하는 중탄소강의 경우, 용접부의 급랭 시 마르텐사이트 조직 변태로 인한 고온 경화 균열(Cold Crack)을 방지하기 위해 반드시 97℃ ~ 297℃ 온도 범위의 국부 예열(Preheating)이 요구됩니다."},{"t":"h3","v":"1.2 스테인리스강(STS)의 조직별 분류 및 특성"},{"t":"p","v":"스테인리스강은 크롬(Cr)을 12% 이상 첨가하여 표면에 부동태 피막(Passive Film)을 형성해 내식성을 극대화한 합금강으로, 금속 조직에 따라 다음과 같이 3대 계열로 구분됩니다."},{"t":"table","rows":[["조직 계열","대표 성분","자성 여부","용접성 및 특징"],["페라이트계","13% ~ 18% Cr","강한 자성","열처리에 의해 크게 경화되지 않으며 연성이 다소 있어 용접은 양호하나 고온에서 결정립 조대화로 연성 저하가 발생할 수 있습니다."],["마텐자이트계","12% ~ 13% Cr","강한 자성","담금질(Quenching)에 의해 강력히 자경하여 높은 강도와 내마모성을 갖는 대신 취성이 매우 강해 용접성이 현저히 불량하며 냉간 균열에 극히 취약합니다."],["오스테나이트계","18% Cr - 8% Ni (대표: STS 304)","비자성 (자성 없음)","스테인리스강 중 가장 연성과 인성이 우수하며, 담금질 열처리에 의해 경화되지 않습니다. TIG 용접에서 가장 우수한 용접성을 보이나 500~800℃ 노출 시 예민화 및 입계부식이 일어납니다."]]},{"t":"h3","v":"1.3 알루미늄 및 비철 합금의 계열별 특징"},{"t":"p","v":"알루미늄 및 그 합금은 높은 열전도율과 급속 열확산, 그리고 표면의 견고한 산화피막(Al₂O₃) 성질로 인해 용접 시 고도의 전공 기술이 수반됩니다. 합금 성분에 따른 분류 체계는 아래와 같습니다."},{"t":"li","v":"1000계열 (순 알루미늄): 순도 99.0% 이상으로 가공성과 내식성은 매우 우수하나 강도가 다소 떨어지며 전기/화학용으로 주로 쓰입니다."},{"t":"li","v":"4000계열 (Al-Si 합금): 규소(Si)를 첨가하여 응고 수축 균열을 극도로 억제한 열처리 합금의 대표 소재로, 고온 균열 저항성이 우수해 용가재로 단골 채택됩니다."},{"t":"li","v":"5000계열 (Al-Mg 합금): 마그네슘(Mg)을 다량 첨가하여 인장강도와 변형 저항성을 비약적으로 증가시킨 비열처리 합금이며, 해양 및 조선 구조용 압연 부품의 대표 자재입니다."},{"t":"li","v":"6000계열 (Al-Mg-Si 합금): 우수한 내식성과 기계적 균형 성능을 갖추고 있으나, 용접 작업 시 발생하는 열량 과다 축적으로 인해 용접열영향부(HAZ)가 연화(Softening)되는 공학적 고유 단점을 내포하고 있습니다."},{"t":"li","v":"7000계열 (Al-Zn-Mg 합금): 최고 강도를 낼 수 있는 알루미늄 합금으로 상온 시효성이 우수하여 초고강도 방산 및 항공기용 가공재에 활용됩니다."},{"t":"table","rows":[["★ 알루미늄 청정 작용 (Cleaning Action) 대원칙 • 알루미늄 용융 온도(약 660℃)보다 무려 3배 이상 높은 용융점(약 2,015℃)을 갖는 표면 산화피막(Al₂O₃)은 일반 용접열로는 제거하기가 어렵습니다. • 가스텅스텐아크용접(GTAW)을 직류 역극성(DCEP) 또는 교류(AC) 주파수 고주파 조건에서 시공할 때, 양이온(Ar+)이 모재 표면을 고속으로 타격하면서 이 산화막을 기계적으로 때려 부수는 청정 작용(Cleaning Action)이 발생합니다. • 이를 통해 용착 금속과 모재가 균일하게 융합되므로, 알루미늄 용접에는 교류 고주파(ACHF) 또는 직류 역극성이 필수적입니다."]]},{"t":"h3","v":"2. 용접이음 홈 가공 및 모재 보관 수칙"},{"t":"p","v":"완전 용입 및 용접 품질의 극대화를 유도하기 위해 홈 가공 정밀도와 모재의 청결한 보관 상태는 가장 기본적인 품질 변수입니다. NCS 17편 모듈에서는 다음과 같은 관리 가이드를 준수하도록 강제하고 있습니다."},{"t":"h3","v":"2.1 모재의 물리적 준비 및 보관 방법"},{"t":"li","v":"선입선출(First-In, First-Out) 원칙: 먼저 적재되거나 수급된 철판과
