 구조물 맞대기 이음에서 판 상호 간의 배면 단차 허용 오차는 얇은 쪽 판 두께의 10% (0.1t) 이하 및 최대 3mm 이하 범위로 엄격히 규제하여 조립 오차에 따른 균열 및 응력 편차를 상쇄시킵니다."},{"n":31,"type":"mcq","stem":"용접 열 영향부 배면에 수랭 동판을 밀착하여 열량을 급속 유도 제거하는 '도열법(냉각법)'에 시공 시, 열전도율이 최고 수준인 동판의 전자기적 청정 전도 열전도도를 최대한 보존하기 위하여 동판에 묻지 않도록 관리해야 할 유기 이물질은 무엇입니까?","choices":["철솜 산화막 가루","비눗물 누설 점검 흔적","윤활 그리스, 오일, 석유류 등의 탄화 유분 물질","규정된 냉각수 파이프 튜브 결합 나사"],"answerIndex":3,"answerText":"③ 윤활 그리스, 오일, 석유류 등의 탄화 유분 물질","explain":"냉각 구리 동판 표면에 윤활제, 그리스, 기름(오일) 등의 유기 탄화 화합물이 부착된 상태로 열을 가하면, 동판의 청정 열전도가 차단될 뿐 아니라 아크 고열에 유기 오일이 탄화 분해되면서 수소 가스 및 일산화탄소 가스를 대량 방출하여 기공, 언더컷 및 심각한 고온 저온 균열 결함을 유발하게 됩니다."},{"n":32,"type":"mcq","stem":"용접 잔류 응력과 변형의 유기적인 역학 관계를 설명한 조항으로 공학적으로 옳은 기술은 무엇입니까?","choices":["잔류 응력이 완벽히 완화되어 풀릴수록, 이음 구조물의 전체적 열변형 및 굴곡량은 증대된다.","잔류 응력과 수축 변형량은 항상 비례하여 상호 간섭 없이 동시에 소멸한다.","가용접 피치를 최대로 조밀하게 가접하면 응력과 변형이 동시에 0으로 통제된다.","변형이 완벽히 감소하여 구속도가 커질수록, 고장력 모재 내부의 잔류 응력은 급격히 감소한다."],"answerIndex":1,"answerText":"① 잔류 응력이 완벽히 완화되어 풀릴수록, 이음 구조물의 전체적 열변형 및 굴곡량은 증대된다.","explain":"용접 이음의 잔류 응력과 변형은 상반되는(Trade-off) 상호 억제적 거동 관계를 가집니다. 따라서 변형을 줄이기 위해 치공구로 강하게 구속하면 변형량은 감소하지만 가두어지는 내부 인장 잔류응력은 오히려 증대되며, 반대로 구속도를 낮춰 잔류응력을 완화시키면 수축 변형량은 상대적으로 증대되는 상반 현상이 작용합니다."},{"n":33,"type":"mcq","stem":"피복아크 가용접 실무에서 좁은 홈 내부의 단단한 시공성과 완전 용입을 위해 채택하는 표준 비드잇기 기법인 '키홀(Key hole)'의 설명으로 올바른 조항은 무엇입니까?","choices":["그루브 가공 시 홈 밑면에 미리 뚫어 두는 열쇠 모양의 구멍을 의미한다.","초층 이면 비드 용접 시 아크열로 루트 면이 녹아 생기는 열쇠구멍 모양의 통공이다.","콘택트 팁 내부의 와이어 가이드 구멍을 일컫는 AWS 규정상의 명칭이다.","가용접 모재를 잡아 주는 보조지그의 크램프 체결 구멍의 크기를 뜻한다."],"answerIndex":2,"answerText":"② 초층 이면 비드 용접 시 아크열로 루트 면이 녹아 생기는 열쇠구멍 모양의 통공이다.","explain":"키홀(Key hole, 열쇠구멍)은 맞대기 홈 용접 시 초층(이면 비드)의 완전 용입을 위해 아크열로 루트 단면의 양단을 확실히 녹여 전방에 둥글게 뚫린 채 전진하는 열쇠구멍 모양의 용융 구멍을 뜻하며, 이 키홀이 일정하게 지속 형성되어야 균일한 이면 백비드가 형성됩니다."},{"n":34,"type":"mcq","stem":"가용접 비드를 시공한 이음부에 본용접을 개시할 때, 아크 재발생 및 이음 잇기 시 '시작점의 용입 부족 및 기공 결함'을 예방하기 위해 취하는 표준 아크 발생 조작법은 무엇입니까?","choices":["가용접 비드 약 15~20mm 앞에서 아크를 발생시켜 안정시킨 뒤 비드로 후퇴하여 진행한다.","가접부 바로 위에 아크를 여러 번 점찍어 충분히 가열한 뒤 끊고 다시 시작한다.","고주파 펄스 전류를 수랭 동판으로 우회시켜 시작점의 열량을 미리 높여 둔다.","개선 홈 밖 모재 표면 정중앙에 스크래치 아크를 길게 낸 뒤 옮겨 붙인다."],"answerIndex":1,"answerText":"① 가용접 비드 약 15~20mm 앞에서 아크를 발생시켜 안정시킨 뒤 비드로 후퇴하여 진행한다.","explain":"아크 개시점의 용입 부족과 기공 발생을 원천 방지하기 위한 후퇴법(Back step) 또는 사전 점화법에 따르면, 가접부 전방 15~20mm 앞 개선 홈 내에서 아크를 먼저 안정되게 발생시킨 후 신속히 가접부 시종점으로 후퇴하여 이행 금속을 충분히 쌓은 뒤 전진 용접을 실행해야 결함을 방지할 수 있습니다."},{"n":35,"type":"mcq","stem":"용접 잔류 응력을 제거하기 위해 용접부 전체를 가열한 후 노내에서 서랭시키는 가장 강력한 사후 열처리 방안의 명칭은 무엇입니까?","choices":["좁은 구역만 데우는 저온 응력 완화법","응력 제거 풀림 (노내 풀림법, PWHT)","용접 전 이음부만 데우는 국부 예열법","표면을 두드려 처리하는 수랭 피닝 경화법"],"answerIndex":2,"answerText":"② 응력 제거 풀림 (노내 풀림법, PWHT)","explain":"용접 구조물의 가장 보편적이고 확실한 잔류 응력 완화 열처리 공법은 용접물을 노 내부에 장입하고 규정 온도(연강의 경우 대략 600~650℃)로 일정 시간 유지 가열한 후 서랭시키는 '응력 제거 풀림(노내 풀림법, Post Weld Heat Treatment)'입니다."},{"n":36,"type":"short","stem":"모재 두께 t가 16.0 mm이고, 용접하고자 하는 전체 이음 길이가 400 mm일 때, '루트 간격 역변형 공식 (D = d + 0.015L)'을 사용하여 가용접 시 시점의 루트 간격을 d = 2.5 mm로 맞추어 고정했습니다. 용접 전진 시 수축 폐쇄량을 차단하기 위해 설정해야 하는 이음 종점부의 예측 설계 루트 간격 D는 몇 mm입니까?","choices":[],"answerIndex":null,"answerText":"8.5 mm","explain":"수식 대입: D = d + 0.015 * L 공식을 적용합니다. 시작 간격 d = 2.5 mm, 전체 용접 길이 L = 400 mm이므로, D = 2.5 + (0.015 * 400) = 2.5 + 6 = 8.5 mm입니다. 따라서 종점부 루트 간격을 정확히 8.5mm로 벌려 시공해야 용접 후 수축이 상쇄되어 평행한 루트 간격 오차가 상쇄됩니다."},{"n":37,"type":"short","stem":"용접 설계 구조물이 동적이고 충격적인 반복 압력을 받는 '충격하중(Impact Load)' 조건 하에 작용할 때, 안전 설계 규정에 따라 적용되는 용접이음부의 표준 안전율 수치는 얼마입니까?","choices":[],"answerIndex":null,"answerText":"12","explain":"언윈(Unwin) 안전율은 정하중 3, 동하중(편진) 5, 교번하중 8, 충격하중 12다. 충격하중이므로 8이 아니라 12다."},{"n":38,"type":"short","stem":"가용접(Tack welding) 시공 시, 비드 시작부 및 용융풀 냉각으로 인한 급랭 균열이나 융합 불량 등 시공적 결함을 방지하기 위해 가용접 전류 설정값은 본용접 시 적용하는 규정 표준 전류 범위와 비교할 때 상대적으로 어떻게(높게 혹은 낮게) 제어해야 합니까?","choices":[],"answerIndex":null,"answerText":"높게 (고전류 조정)","explain":"가용접은 열량 방출과 급랭이 매우 가혹한 극소 부피 용융 공정이므로, 본용접 대비 약 10~20%가량 다소 높은 전류(고전류)를 인가하여 순간 용융 및 아크 기둥 침투력을 보완해야 아크 시작 결함을 방지할 수 있습니다."},{"n":39,"type":"short","stem":"두 판재를 조립 가접할 때, 판 상호 간의 수평 어긋남인 '이면 단차'를 최소화하기 위한 KS 공차 한계에 따르면, 어긋남 단차는 얇은 쪽 판 두께의 최소 몇 % 이하(혹은 최대 몇 mm 이하) 범위 이내로 오차 조정되어야 합니까?","choices":[],"answerIndex":null,"answerText":"10% (또는 0.1t, 최대 3mm 이하)","explain":"강판 맞대기 용접이음 시공 허용 공차에 의하면 맞대기 이음부의 상호 편차 단차 e는 얇은 강판 두께의 10% (0.1t) 이내 및 최대 3mm 이하를 허용 한계치로 규제합니다."},{"n":40,"type":"short","stem":"NCS 능력단위 기준 상, 판 두께 t가 3.2 mm를 초과하고 25.0 mm 이하인 중간 판재(중판)를 가용접할 때 부과되는 단일 가용접 비드의 표준 최소 길이는 몇 mm입니까?","choices":[],"answerIndex":null,"answerText":"40 mm","explain":"NCS 피복아크 가용접 학습모듈 기준(표 2-3 및 표 3-1): 판 두께 3.2mm 이하는 30mm, 3.2mm 초과 25mm 이하는 40mm, 25mm 이상은 50mm 이상 확보하여 지지 강성을 보증해야 합니다."},{"n":41,"type":"short","stem":"용접 후 변형을 제어하는 열소성 기계 교정법 중, 형재(H형강, I형강, 앵글, 찬넬 등)나 두꺼운 모재의 직선형 휘어짐 굴곡에 적용하며 가열선에 따라 고속 가열 후 수랭 조작을 반복하는 굴곡 변형 가열 교정 공법의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"직선 수축법 (선상 가열법)","explain":"용접으로 발생한 굴곡 변형 교정 시, 얇은 판은 점 형태의 '점 수축법'을 주로 사용하는 반면, 기하학적 형태를 가진 형재(형강 등)에는 직선 열을 가해 급랭하는 '직선 수축법(선상 가열법)'을 적용하여 기하학적 직각도를 보정합니다."},{"n":42,"type":"short","stem":"맞대기 용접 이음의 인장강도 신뢰 지수인 '이음 효율(%)' 산출 시 적용하는 계산 공식인 '이음 효율 = ( A / B ) * 100'에서 분모 항인 B와 분자 항인 A에 위치하는 공학적 응력 극한인자 항목의 올바른 명칭을 순서대로 쓰시오.","choices":[],"answerIndex":null,"answerText":"A: 용접 시험편의 인장강도, B: 모재의 인장강도","explain":"이음 효율 [%] = (용접 시험편의 실제 파단 인장강도 / 모재의 정격 표준 극한 인장강도) * 100 공식을 기반으로 용접 품질 안정도를 도출하게 됩니다."},{"n":43,"type":"short","stem":"NCS 피복아크 가용접 시공 표준 가이드에 따라, 가용접 작업 시 아크 집중 제어와 홈 융합을 원활히 하기 위해 사용해야 하는 피복아크 용접봉의 지름(굵기) 규격은 본용접 시 적용 예정인 정격 용접봉 지름과 비교하여 상대적으로 어떠한 지름(굵기)의 용접봉을 선정하여 가접하는 것이 원칙입니까?","choices":[],"answerIndex":null,"answerText":"가는 지름 (소경 용접봉)","explain":"가용접은 순간적으로 좁은 홈이나 틈새 내부를 신속 고정해야 하므로, 본용접봉 규격에 비해 지름이 한 단계 가는 '가는 지름(소경) 용접봉'을 물려 시공해야 루트 끝단 융합 불량과 전력 집중 오차를 상쇄할 수 있습니다."},{"n":44,"type":"short","stem":"용접 이음의 변형 제어 4대 시공 대책 중, 수축 변형을 기계적으로 전면 구속하기 위해 강성 지그나 클램프 장치를 고정 부착하여 거동을 원천 통제하는 공학적 시공 대책의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"억제법 (구속법)","explain":"지그, 구속 장치, 강제 바이스를 통해 수축을 기계적 구속력으로 원천 제어하는 공법을 억제법(구속법)이라 칭합니다."},{"n":45,"type":"short","stem":"가용접 비드를 배치하는 이음 간격(Tack pitch) 산출 공식은 일반적으로 모재 두께 t를 기준으로 삼습니다. 가용접 적정 시공을 위한 표준 가접 배치 피치 간격의 공학적 범위는 모재 두께 t의 최소 몇 배에서 최대 몇 배 범위 이내입니까?","choices":[],"answerIndex":null,"answerText":"15배에서 30배 (15t ~ 30t)","explain":"NCS 능력단위 규정에 따라 가용접 간격의 배치 준수 범위는 모재 판 두께 t의 15~30배(15t~30t)를 최적의 표준 피치 범위로 선량하고 있습니다."},{"n":46,"type":"short","stem":"용접 잔류 응력과 변형 제어를 위한 특수 용착법 중, 용착 비드가 짧은 전진 블록 형태로 쌓여 단계적으로 완공되어 나가는 적층 순서 제어법을 지칭하며, 후판 구조물의 고온/저온 용접 균열 방지 목적으로 전진법 또는 비석법과 정밀 조합하여 다층 용접을 완성하는 공착법의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"블록법 (Block sequence)","explain":"부분적으로 최종 층까지 비드를 차례로 완성해놓고 옆 블록으로 전진하는 방식을 블록법이라 하며, 고구속 후판 구조 균열 파손 억제에 극히 유용합니다."},{"n":47,"type":"short","stem":"두 모재 V홈 맞대기 용접 시, 초층 이면 용입(백비드)을 균일하게 얻기 위해 본용접 전류 아크 열량에 의하여 그루브 루트 면이 녹으면서 열쇠구멍 모양 형태로 아크 전방에 형성되어 나가는 특수 용융 구멍의 공학적 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"키홀 (Key hole)","explain":"용입 깊이 확보와 완전 융합의 척도가 되는 이면 용융 구멍 통공을 키홀(Key hole, 열쇠구멍)이라 정의합니다."},{"n":48,"type":"short","stem":"용접 구조물의 설계 시, 하중 한도 보정을 위해 극한 강도 대비 허용 응력의 비율로 가이드 한계 비율을 보수적으로 산출하는 공학적 신뢰 비율 지수를 지칭하는 용어는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"안전율 (Safety Factor)","explain":"재료의 극한강도를 설계상 적용 가능한 최대 허용응력으로 나눈 보수적 여유 지수를 안전율이라 칭합니다."},{"n":49,"type":"short","stem":"용접 응력 및 수축을 완화하기 위하여 시공된 비드의 표면을 가열 직후 해머나 전용 피닝 기구로 연속 타격하여 표면층에 압축 소성변형을 줌으로써 가혹한 인장 잔류응력을 크게 완화하는 보조 시공법의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"피닝법 (Peening)","explain":"해머나 구형 다이로 비드 표면을 연속적으로 기계적 타격하여 표면에 소성 유동을 줌으로써 용접 인장 응력을 상쇄 완화하는 기법을 피닝법이라 정의합니다."},{"n":50,"type":"short","stem":"용접 후 변형 교정에 있어서 가열 온도 500~600℃로 국부적인 포인트를 가열한 즉시 급랭 조작을 적용하여 얇은 강판(박판)의 면 외 굽힘 찌그러짐 변형을 국부 수축으로 교정하는 열적 가열 수축 교정법의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"점 수축법 (점 가열법)","explain":"박판에 유발된 면 외 변형에 주로 사용하는 열소성 수축 교정법으로서, 좁은 구역을 점 형태로 급가열 급냉시키는 대표 공법을 점 수축법(점 가열법)이라 칭합니다. 제3장. 참고 문헌 및 교육 자료 출처 NCS 학습모듈: 피복아크용접 가용접 작업 (LM1601050105_21v3), 한국직업능력개발원 및 교육부 발행. 원영휘(2021), 『실용용접설계 시공』, 교문사 발행. 정균호(2014), 『용접 설계 시공』, 한국산업인력공단 교재 편찬위원회. ASME Sec. IX (QW-400), Welding and Brazing Qualifications, American Society of Mechanical Engineers. 한국산업표준 규격 KS B 0106 (용접 이음 그루브 형상 각부 명칭 및 표시 방법)."}]},"8":{"unit":8,"title":"피복아크용접 맞대기용접","code":"LM1601050111","group":"피복아크용접","theory":[{"t":"h2","v":"■ 제1부: NCS 8편 맞대기용접 핵심 이론 단권화 요약"},{"t":"h3","v":"▶ 제1장 맞대기용접부 홈 설계 및 개선 가공 수칙"},{"t":"p","v":"피복아크 맞대기용접은 대략 동일 평면에 위치한 두 모재를 맞대어 접합하는 대표적인 이음 방식이다. 용접부의 건전한 강도를 확보하기 위해서는 모재의 두께와 가공 형식에 맞는 형상 규격 설계가 절대적 필수 요인이다."},{"t":"h3","v":"• 1. 모재 두께별 홈(Groove) 가공 및 적용 기준"},{"t":"li","v":"I형 맞대기이음: 홈 가공을 생략하거나 전가공만으로 적용하는 형태로, 두께 6.0mm 이하의 박판 및 중판에 적합하다. 6.0mm 두께에서는 완전 용입을 위해 일정한 루트 간격을 벌리고 용접한다."},{"t":"li","v":"V형 맞대기이음: 가장 보편적인 홈 형상으로, 두께 6.0mm ~ 20.0mm 이하의 판재에 적용한다. 홈 각도(베벨합)는 보통 60°~70°로 설계하며, 루트 간격은 2.5~3.0mm를 표준으로 한다."},{"t":"li","v":"X형 맞대기이음: 양면 V형 홈 가공 방식이며, 두께 20.0mm 이상의 후판 구조물에 적극 사용된다. 양면 대칭 혹은 비대칭 용착을 유도하여 용착금속량을 최소화하고 열팽창에 의한 굽힘 변형을 방지한다."},{"t":"table","rows":[["★ 공학 핵심 수칙 (X형 아래보기 맞대기이음) X형 아래보기 수동 가공 시, 양면의 용착 깊이를 정확히 대칭으로 두지 않고 상하 용입 깊이비를 대략 6:4로 가공하여 잔류 응력에 따른 각변형을 효과적으로 무력화한다. 개선각은 한 단면 기준 22.5°(양면 합 45°)로 맞춤 조절한다."]]},{"t":"h3","v":"• 2. 표준 V형 홈 가공 규격 및 가용접(Tack) 조건"},{"t":"p","v":"시험편이나 실제 기계 및 건축용 구조 강재(SS275)를 V형 맞대기 용접을 하고자 할 때에는 다음과 같은 표준 개선 형상 정밀 가공 요건을 엄수하여야 한다."},{"t":"table","rows":[["개선 요소","표준 정밀 규격 및 치수","수험 및 실무 준수 사항"],["베벨 각도 (Bevel Angle)","30° ~ 35° (홈 각도: 60°~70°)","기계 가공(수직 밀링) 또는 가스 절단기 각도 게이지 조절 정밀 가공"],["루트 면 (Root Face, f)","1.5mm ~ 2.5mm","줄(File)을 이용하여 수평 바이스에 모재를 물리고 일정 두께로 가공"],["루트 간격 (Root Gap, g)","시점: 2.5 ~ 3.0mm 종점: 3.0 ~ 3.5mm","수축력에 대비하여 시점보다 종점 간격을 0.5mm 전후로 더 벌려 가조립"]]},{"t":"p","v":"가용접(Tack Welding) 수칙: 용접선 양 끝(시점 및 종점부)에서 안쪽으로 약 20mm ~ 30mm 유효 구간 안쪽에 길이 10mm 이내의 가접 비드를 형성한다. 응력이 집중되거나 뒤틀리기 쉬운 모재의 맨 끝단 코너부 가접은 고온 균열 발생 우려가 커 금지한다."},{"t":"h3","v":"• 3. 역변형(Pre-deformation) 제어 및 모재 배치 요령"},{"t":"p","v":"용접이 완료된 후 냉각 시 수축에 기인하는 뒤틀림(각변형)을 차단하기 위하여 가조립 단계에서 미리 용접 반대 방향으로 2° ~ 5° 각도로 꺾어주는 역변형 조치 상태로 고정 지그에 고정시킨다."},{"t":"p","v":"중요 시공 안전 수칙: 이면비드(백비드) 용접 작업 시에는 모재 시험편이 평평한 작업대 바닥에 닿아 있으면 열 배출과 통풍 저하로 이면비드가 형성되지 않고 작업대에 녹아 붙을 위험이 크다. 따라서 반드시 지그대를 조절하여 작업대 바닥면으로부터 모재를 최소 10mm 이상 띄우는 이격 배치 요건을 지켜야 한다."},{"t":"h3","v":"▶ 제2장 피복아크 용접 조건 및 자세별 운봉 기법"},{"t":"h3","v":"• 1. 수평·수직·아래보기·위보기 자세별 표준 전류 세팅 가이드"},{"t":"p","v":"피복아크용접은 전류 선택에 따라 아크 안정성과 용입 품질이 좌우된다. 아래 표준 가이드는 저수소계(E4316) Ø3.2 용접봉을 기준으로 한다."},{"t":"table","rows":[["용접 종류 및 구분","자세 기호(AWS / KS)","1차 비드 (초층 백비드)","표면 비드 (Cover Pass)"],["아래보기 맞대기 (t9.0/6.0)","F (1G / PA)","80A ~ 90A (또는 75~90A)","100A ~ 120A"],["수직 상진 맞대기 (t9.0/6.0)","V (3G / PF)","80A ~ 90A","100A ~ 120A"],["수평 맞대기 (t9.0/6.0)","H (2G / PC)","80A ~ 90A (또는 80~90A)","100A ~ 120A"],["위보기 맞대기 V형","OH (4G / PE)","85A ~ 105A","100A ~ 120A"],["T형 필릿 전자세","전자세 (t9.0/t6.0)","130A ~ 140A (단일/일괄)","-"]]},{"t":"h3","v":"• 2. 저수소계 용접봉(E4316) 품질 수칙 및 운봉 기법"},{"t":"li","v":"용접봉 정밀 건조 요건: 수소로 인한 냉간지연균열을 완벽 방지하기 위해 사용 전 반드시 건조로에서 300°C ~ 350°C 온도로 1시간 ~ 2시간 가량 강제 정밀 건조 후 꺼내어 보온병에 휴대 보관하면서 쓴다. 용접봉 피복제의 편심률 허용 기준치는 3% 이내이다. 편심률이 3%를 초과할 경우 한쪽으로 치우쳐 녹는 편용 현상과 아크 불안정 거동이 극도로 유발된다."},{"t":"li","v":"1차 초층 용입과 열쇠구멍(Key Hole) 제어: V형 그루브 맞대기에서 완전한 이면 백비드 형성을 위해서는 용착 시작 시점부터 루트 면 끝을 고르게 녹여 눈에 보이는 타원형의 Key Hole을 일정 크기로 개방 형성하며 전진하는 능력이 성패를 좌우한다. 직선법, 위빙법, 열량 조절을 가하는 휘핑법을 복합적으로 운용한다."},{"t":"li","v":"비드 잇기(Restarting) 기법: 용접봉 교체를 위해 아크를 끊은 부분에서 다시 비드를 이을 때에는, 끊어진 크레이터 지시선의 뒤편으로 10mm ~ 20mm 정도 떨어진 유효 비드 위에서 아크를 점화하여 시작점으로 신속히 진행하며 아크 길이를 극도로 짧게 눌러 준 뒤 정상 진행하여 결함을 소멸시킨다."},{"t":"h3","v":"▶ 제3장 맞대기용접 야금학적 온도 제어 및 비파괴 평가"},{"t":"h3","v":"• 1. 예열(Preheat) 가스 토치 안전 조작 수칙"},{"t":"p","v":"후판(25.0mm 이상)이나 급랭 경화에 따른 비드 밑 저온 균열 발생 가능성이 높은 재질의 개선 부위는 가스 토치를 이용해 적절히 예열해야 한다. 가스 조작 요건은 다음과 같다."},{"t":"li","v":"1) 압력 조정: 예열 점화 전 게이지 압력을 확인하고, 산소 압력은 2 ~ 5 kgf/cm², 아세틸렌 압력은 0.2 ~ 0.5 kgf/cm²로 각각 조절하여 안전하게 가용한다."},{"t":"li","v":"2) 불꽃 조절 및 가열: 먼저 과잉 아세틸렌 형태의 탄화불꽃 상태로 점화한 후, 산소 밸브를 신속히 조작하여 선명한 백심과 파란 외염을 지닌 중성불꽃(표준불꽃) 상태로 완벽히 전환시켜 예열 가동한다. 이때 가스 불꽃 백심의 끝단에서 모재 개선면까지의 이격 거리는 2mm ~ 3mm 범위를 유지한다."},{"t":"h3","v":"• 2. 강재 분류별 층간 온도(Interpass Temperature) 허용 규격"},{"t":"p","v":"다층 비드를 정렬 쌓을 때 지나치게 온도가 상승하여 강재의 연성 인성이 하락하고 취성이 급증하는 불량을 방지하기 위한 강종별 최대 허용 한계 온도는 다음과 같다."},{"t":"li","v":"탄소강 및 저합금강 (ASME P-No 1 ~ 5): 최대 260°C ~ 350°C 범위 이내 유지"},{"t":"li","v":"오스테나이트계 스테인리스강 (ASME P-No 8): 입계부식 및 기공 억제를 위해 최대 176°C 이하로 엄격 제한"},{"t":"li","v":"구리 및 구리합금: 열확산 관리를 위해 최대 150°C 이하 유지 관리"},{"t":"h3","v":"• 3. guided 굽힘시험(Guided Bend Test) 정밀 평가 기준"},{"t":"p","v":"시험편 맞대기부 중앙을 38±2mm의 일정한 단면 규격으로 절단하여 표면 및 이면 방향으로 프레스 가압 굽힘시험을 실시한다. KS 및 국가기술자격시험 기준에 의거하여 다음과 같은 균열 흠집 발견 시 즉시 0점(불합격) 처리하는 3대 절대 규칙은 필히 마스터해야 한다."},{"t":"table","rows":[["평가 항목","감점 및 0점 불합격 실무 기준치","학습 가이드 및 기술적 논거"],["단일 최대 균열 길이","굽힘 면에 단 1개라도 3.0mm 이상(3.0mm 포함) 크기의 균열이 터져 나왔을 때","3.0mm 이상 균열은 내부의 미용융, 이물질 혼입 부위가 연성에 의해 확장 파단된 징후"],["누적 균열 길이 합계","3.0mm 미만의 미세 균열이라도 굽힘면 전체의 길이 합이 7.0mm 이상(7.0mm 포함) 시","다수의 미소 결함이 밀집해 존재하여 실제 사용 중 응력 분산에 취약한 구조임이 입증됨"],["기포 및 미세 흠집 개수","기포(Blow Hole) 및 기공, 극미세 크랙 등의 총 개수가 10개를 초과할 때","용접부 차폐 가스 거동 결함 및 습기 흡습 등으로 인한 야금학적 기공 결함 대량 축적 상태"]]},{"t":"h2","v":"■ 제2부: 'NCS 8편: 피복아크용접 맞대기용접' 대표 엄선 50제"},{"t":"h3","v":"▶ 제1장 진위형 (O/X) 문항 [1번 ~ 10번]"},{"t":"p","v":"※ 다음 설명이 올바르면 O, 틀리면 X를 선택하거나 기입하시오."}],"questions":[{"n":1,"type":"mcq","stem":"피복아크용접 맞대기 V형 홈 설계 시, 시점부 루트 간격이 2.5mm라면 수축 닫힘 현상에 대비하여 종점부는 약 0.5mm 전후로 가용한 수치인 3.0~3.5mm 정도로 더 넓게 가가공 배치하는 것이 공학적으로 정당하다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"모재 수축력에 따른 개선 닫힘을 고려하여, 시점보다 종점 간격을 약 0.5mm 정도 크게 조립한다."},{"n":2,"type":"mcq","stem":"V형 홈 맞대기용접의 1층 초층 비드(이면비드) 용접 작업 시, 모재가 작업대 바닥과 수평으로 완전히 밀착 고정되어 있으면 냉각 도열 효율이 극도로 향상되어 이면 비드가 양호하게 형성된다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"모재가 작업대에 밀착하면 이면비드가 형성되지 않고 달라붙으므로, 최소 10mm 이상 반드시 공중에 띄워 배치해야 한다."},{"n":3,"type":"mcq","stem":"저수소계 피복금속아크용접봉(E4316)은 석회석과 형석이 주성분이며, 대기 중 습기를 쉽게 흡수하는 흡습성이 강하므로 사용 전에 반드시 70~100℃의 저온에서 30~60분 동안 고속 건조하여 사용해야 한다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"저수소계 E4316은 석회석과 형석이 주성분으로 습기 제거를 위해 300~350℃에서 1~2시간 고온 건조가 대원칙이다."},{"n":4,"type":"mcq","stem":"편심률이 3%를 초과하는 피복아크용접봉을 사용하면, 아크 방향이 비틀려 한쪽 피복제만 과도하게 먼저 녹는 편용 현상과 아크 쏠림에 기인하는 용접 결함이 일어날 확률이 절대적으로 크다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"편심률이 3%를 초과하는 용접봉은 편용과 아크 불안정을 절대적으로 야금 유발하므로 허용 한계를 벗어난다."},{"n":5,"type":"mcq","stem":"피복아크 맞대기용접부의 굽힘시험용 Guided 시험편 규격 폭은 일반적으로 38(±2)mm 크기로 가스절단 및 표면 평탄 가공하여 가습 프레스를 투입한다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"Guided 굽힘시험용 표면/이면 프레스 굽힘 시험편 규격 표준 폭은 38(±2)mm이다."},{"n":6,"type":"mcq","stem":"굽힘시험 평가 도중 시편에서 단 1개라도 3.0mm 크기를 넘는 균열이 식별되는 순간, 해당 굽힘 시험편은 무조건 감점 없이 즉시 0점(불합격)으로 완벽하게 처리된다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"굽힘면에 단 1개라도 3.0mm 크기 이상의 균열 결함이 터져 나오면 즉시 0점(불합격) 처리된다."},{"n":7,"type":"mcq","stem":"굽힘시험 시 단일 균열의 크기가 모두 3.0mm 미만인 상태에서 굽힘면에 터져 나온 미세 균열들의 전체 길이 합계가 6.5mm가 되었다면, 이는 불합격(0점) 기준치인 7.0mm 미만이므로 합격 판정을 받는다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"모든 균열이 3.0mm 미만이며 누적 길이 합이 6.5mm인 경우는 불합격 기준치인 7.0mm 미만이므로 합격 판정을 취득한다."},{"n":8,"type":"mcq","stem":"ASME Sec.IX 기준에 따라 탄소강 및 저합금강(P-No 1~5)의 다층 용접작업을 전개할 때, 모재의 야금학적 결정 거동 하락 방지를 위해 최대 층간 온도 한계치는 260℃~350℃ 범위 내로 조율되어야 한다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"ASME P-No 1~5 계열 탄소강의 다층 용접 시 야금학적 연성 인성 보존을 위한 최대 층간 온도는 260℃~350℃ 범위 내이다."},{"n":9,"type":"mcq","stem":"오스테나이트 스테인리스강(P-No 8) 맞대기 다층 용접의 최대 허용 층간 온도는 일반 탄소강보다 열전도율과 수소 영향이 달라 176℃ 이하로 극도로 억제 관리하는 것이 정당하다. ( )","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"STS304(P-No 8) 스테인리스 다층 용접부는 입계부식 방지를 위해 최대 층간 온도를 176℃ 이하로 정밀 통제해야 한다."},{"n":10,"type":"mcq","stem":"아래보기 자세 V형 맞대기이음(t9.0) 작업 전, 가용접(Tack)은 수축 닫힘 각 변형을 완전히 통제하기 위해 모재 시험판의 최외곽 꼭짓점 모서리 끝단에 비드 길이 15mm 이상으로 견고하게 가접 조립하여야 한다. ( ) ▶ 제2장 연결형 문항 [11번 ~ 15번] ※ 다음 각 항목의 내용과 우측의 표준 가스 불꽃 온도를 올바르게 선점 연결하 ,"answerText":"⑤ 2,820 °C (일산화탄소 대조용)","explain":"산소를 조연성 가스로 사용할 때 가연성 가스별 최고 불꽃 온도는 아세틸렌 3,430℃ > 수소 2,900℃ > 프로판 2,820℃ ≒ 일산화탄소 2,820℃ > 메탄 2,700℃ 순입니다. 아세틸렌이 가장 높아 가스 절단·예열에 표준으로 쓰입니다."},{"n":16,"type":"mcq","stem":"다음 중 피복아크용접 맞대기 홈 설계에 대한 설명으로 공학적으로 틀린 것은?","choices":["박판(6.0mm 이하) 구조물에는 가공이 간단하고 경제적인 I형 홈을 널리 가용한 규격이다.","V형 홈은 두께 6.0~20.0mm 이하의 판재 이음에 가장 널리 이용되며 홈각도는 60~70°가 표준이다.","양면 V형 홈인 X형 가조립 시, 상하 용입비는 1:1로 엄격히 고정해야만 변형을 무력화할 수 있다.","U형 홈은 한쪽 면 U자 형태로 가공하여 두께 15.0mm 이하 중판 및 후판에 유리하게 사용된다."],"answerIndex":3,"answerText":"③ 양면 V형 홈인 X형 가조립 시, 상하 용입비는 1:1로 엄격히 고정해야만 변형을 무력화할 수 있다.","explain":"상하 용입비를 정확히 5:5 대칭이 아닌, 약 6:4로 가공 배치 시공함으로써 각변형 모멘트를 보상 제어한다."},{"n":17,"type":"mcq","stem":"다음 중 피복아크용접 V형 맞대기이음 준비 시 가용접(Tack) 위치 수칙에 대한 설명으로 옳은 것은?","choices":["가용접용 비드 길이는 30mm 이상으로 가능한 길게 올려야 본용접 시 터짐 결함이 완벽히 방지된다.","가용접 전류값은 안전한 결합을 위해 실제 본용접 전류값보다 약 50% 이상 낮게 설정해야 정당하다.","응력 집중과 고온 균열 방지를 위하여 용접선 유효 시작부와 종료부 맨 끝 모서리에 점가접을 실시한다.","용접 시작 부분과 아크가 완전히 끝나는 끝단으로부터 안쪽으로 대략 20mm~30mm 들어온 위치에 배치한다."],"answerIndex":4,"answerText":"④ 용접 시작 부분과 아크가 완전히 끝나는 끝단으로부터 안쪽으로 대략 20mm~30mm 들어온 위치에 배치한다.","explain":"가용접은 모재 양단 코너 응력 집중부를 피하여 20~30mm 안쪽 영역에 비드 길이 10mm 이내로 조립한다."},{"n":18,"type":"mcq","stem":"저수소계 피복금속아크용접봉(E4316)을 맞대기용접 전 가동할 때 요구되는 표준 건조 조작 온도로 가장 적합한 것은?","choices":["70°C ~ 100°C에서 약 30분 ~ 60분 간 건조한다.","150°C ~ 200°C에서 약 1시간 전후 건조한다.","300°C ~ 350°C에서 약 1시간 ~ 2시간 가량 집중 정밀 건조한다.","450°C ~ 500°C에서 약 3시간 이상 강력 고온 소생 건조한다."],"answerIndex":3,"answerText":"③ 300°C ~ 350°C에서 약 1시간 ~ 2시간 가량 집중 정밀 건조한다.","explain":"E4316 저수소계 용접봉은 수소 유입 차단이 핵심이므로 300~350℃에서 1~2시간 고온 건조해야 한다."},{"n":19,"type":"mcq","stem":"맞대기 V형 초층 용접 중 아크가 불안정하게 튀며 편심률 기준 하락으로 용접봉이 고르게 용융되지 못하는 '편용 현상'이 일어났다. E4316 용접봉의 허용 편심률 한계치 기준으로 옳은 것은?","choices":["1% 이내","3% 이내","5% 이내","10% 이내"],"answerIndex":2,"answerText":"② 3% 이내","explain":"용접봉 편심률은 아크 쏠림과 불균일 용융 방지를 위해 규격상 3% 이내여야 한다."},{"n":20,"type":"mcq","stem":"V형 맞대기용접(t9.0) 아래보기(F) 자세에서 E4316 Ø3.2 용접봉으로 1차 초층(이면 백비드)을 낼 때 실기 표준으로 권장하는 용접 전류 범위는?","choices":["40A ~ 60A","80A ~ 90A","120A ~ 140A","160A ~ 180A"],"answerIndex":2,"answerText":"② 80A ~ 90A","explain":"E4316 Ø3.2의 일반 표준 전류는 110~140A이지만, 이면 백비드 초층은 키홀을 유지하며 용락을 막아야 하므로 이보다 낮은 80~90A(75~90A)로 내려서 작업한다."},{"n":21,"type":"mcq","stem":"다음 수직 자세(V) V형 맞대기 초층 용접 중 결함을 방지하기 위한 운봉 기법 설명으로 공학적으로 틀린 것은?","choices":["시작 위치에서 약간 위(10~20mm) 지점에 아크를 점화하여 안정시킨 후 수직 시작부로 이동한다.","루트 면 끝단의 양쪽을 고르게 용융시켜 타원형의 일정한 열쇠구멍(Key Hole)을 연속 형성하며 올라간다.","운봉 시 토치 작업 각은 90°로 잡고 진행 각도는 진행 방향의 반대 방향으로 75°~85° 각도를 엄격 준수한다.","이면 백비드가 닿는 작업대 수평바닥면에 시험판 모재를 완전히 밀착 고정하여 아크가 튀는 것을 강제 방지한다."],"answerIndex":4,"answerText":"④ 이면 백비드가 닿는 작업대 수평바닥면에 시험판 모재를 완전히 밀착 고정하여 아크가 튀는 것을 강제 방지한다.","explain":"이면비드 용접 시에는 절대 모재를 작업대에 수평 밀착 배치하면 안 되며, 지그를 써서 최소 10mm 이격해야 한다."},{"n":22,"type":"mcq","stem":"피복아크 맞대기용접을 마친 후 시험편을Guided 굽힘시험용 표면/이면 시편으로 정밀 가공할 때 규격 폭 수치로 가장 옳은 것은?","choices":["15mm ± 1mm","25mm ± 2mm","38mm ± 2mm","50mm ± 5mm"],"answerIndex":3,"answerText":"③ 38mm ± 2mm","explain":"Guided 굽힘시험편의 KS 및 자격 표준 폭은 38(±2)mm이다."},{"n":23,"type":"mcq","stem":"굽힘시험 후 굴곡시험면을 검사한 결과 균열(Crack) 흠집이 식별되어 불합격 판정을 받았다. 다음 중 '합격'에 속하는 경우는?","choices":["시편 굽힘면에 단 1개 생성된 균열의 단일 최대 측정 길이가 3.2mm인 경우","단일 최대 길이가 2.0mm 크기이나 굽힘면 전체에 산재된 균열 길이의 총 합이 8.0mm인 경우","굽힘 시편 표면에 터져 나온 미세 기포 및 극미세 기공의 총 개수가 합쳐서 12개인 경우","균열의 최대 길이가 2.5mm이고 굽힘면의 모든 미세 균열 총 누적 합계가 6.0mm이며 기공은 3개인 경우"],"answerIndex":4,"answerText":"④ 균열의 최대 길이가 2.5mm이고 굽힘면의 모든 미세 균열 총 누적 합계가 6.0mm이며 기공은 3개인 경우","explain":"단일 균열이 3mm 미만이고, 전체 균열의 누적 합이 6.0mm이며, 기포 개수가 3개인 경우는 0점 불합격 기준치를 초과하지 않아 합격이다."},{"n":24,"type":"mcq","stem":"탄소강 및 저합금강(P-No 1~5) 구조물의 피복아크 맞대기용접 시, 금속 조직 변태 관리 및 수소 지연 균열을 억제하기 위해 규정된 최대 허용 층간 온도 관리 범위는?","choices":["최대 150°C 이하","최대 176°C 이하","최대 260°C ~ 350°C 범위 이내","최대 450°C ~ 500°C 고온 유지"],"answerIndex":3,"answerText":"③ 최대 260°C ~ 350°C 범위 이내","explain":"ASME 규격상 탄소강 및 저합금강(P-No 1~5)의 최대 허용 층간 온도 한계 범위는 260℃~350℃ 이내이다."},{"n":25,"type":"mcq","stem":"가스 불꽃 조작 수칙에 따라 예열 토치 작업을 진행할 때, 아세틸렌과 산소를 정밀 혼합하여 청정하게 가용하는 '중성 불꽃'의 점화 조절 순서로 가장 옳은 것은?","choices":["아세틸렌 밸브를 열어 점화한 후 예열 산소 밸브를 신속 조작해 백심이 선명한 표준 중성 불꽃을 형성한다.","고압 산소를 먼저 불출한 상태에서 가스를 유도 점화하여 가열 불꽃을 강제 제어한다.","산소와 아세틸렌 밸브를 동시에 100% 최대로 완전 개방한 직후 라이터 점화를 유도한다.","안전 퓨즈와 가압 레귤레이터 지침 바늘을 완전히 차단한 무압 상태에서 예열을 강제 유도한다."],"answerIndex":1,"answerText":"① 아세틸렌 밸브를 열어 점화한 후 예열 산소 밸브를 신속 조작해 백심이 선명한 표준 중성 불꽃을 형성한다.","explain":"가스 예열용 중성 불꽃은 먼저 탄화 불꽃(아세틸렌 과잉)을 만든 후, 서서히 산소 밸브를 열어 표준 불꽃을 형성한다."},{"n":26,"type":"mcq","stem":"45° 경사 수직 자세 V형 맞대기용접을 실습하기 위해 지그대에 모재 시험판을 고정하는 배치 원칙으로 가장 옳은 것은?","choices":["홈 가공부 개선면이 수평 바닥을 바라보는 역위치 위보기 경사 배치 형태","모재 루트 간격이 상대적으로 좁은 쪽(2.0~3.0mm)을 아래쪽으로 위치하도록 고정","수축 닫힘을 고려하여 루트 간격이 벌어지는 종점부 넓은 쪽(3.0~3.5mm)을 아래쪽으로 고정","고정 지그대 높이를 극도로 낮추어 작업자의 무릎 높이에 고정한 상태로 시공"],"answerIndex":2,"answerText":"② 모재 루트 간격이 상대적으로 좁은 쪽(2.0~3.0mm)을 아래쪽으로 위치하도록 고정","explain":"45° 경사 수직 자세 이음은 수축 변형을 상쇄하도록 루트 간격이 좁은 쪽(시점)이 아래쪽으로 향하도록 배치한다."},{"n":27,"type":"mcq","stem":"다음 중 피복아크용접 맞대기이음 작업에서 이면비드(백비드)의 비드 끊김부 '비드 잇기(Restarting)' 요령으로 옳은 것은?","choices":["아크가 끊어진 크레이터 지점 내부의 정중앙에 봉을 곧바로 꽂아 새 아크를 일으킨 뒤 진행한다.","끊어진 크레이터 종점보다 약 10mm ~ 20mm 진행방향 앞선 개선면 홈벽에서 점화해 후진한다.","크레이터 뒤편 10mm ~ 20mm의 쌓인 비드 위에서 점화 후 짧은 아크로 key hole을 재개방한다.","새 용접봉으로 교체할 때는 아크 길이를 본용접의 약 2배 이상 띄워 예열 효과만 낸 뒤 잇는다."],"answerIndex":3,"answerText":"③ 크레이터 뒤편 10mm ~ 20mm의 쌓인 비드 위에서 점화 후 짧은 아크로 key hole을 재개방한다.","explain":"이면비드(백비드) 잇기는 크레이터 뒤편 10~20mm의 이미 쌓인 비드 위에서 점화한 뒤 짧은 아크로 크레이터까지 나아가 키홀을 다시 열고 진행한다. 크레이터보다 앞쪽 개선면에서 점화해 후진하는 요령은 표면 비드 잇기에 쓰는 방법이다."},{"n":28,"type":"mcq","stem":"오스테나이트계 스테인리스강(STS304, ASME P-No 8)의 다층 맞대기용접부 품질을 관리하기 위한 최대 층간 온도 한계치는?","choices":["최대 150°C 이하","최대 176°C 이하","최대 350°C 이하","최대 450°C 이하"],"answerIndex":2,"answerText":"② 최대 176°C 이하","explain":"오스테나이트 STS304(P-No 8)의 다층 최대 허용 층간 온도는 176℃ 이하로 엄격 통제 관리한다."},{"n":29,"type":"mcq","stem":"다음 중 피복아크 용접 조건 설정 시 극성과 특성에 대한 설명으로 공학적으로 틀린 것은?","choices":["피복아크 교류(AC) 용접기는 극성의 주기적 변동이 없어 아크 자기쏠림(자기쏠림 방지 대책)이 직류 용접기보다 훨씬 강하다.","용접기의 표준 출력 전기 제어 특성에는 수하특성과 정전류특성이 주로 활용된다.","직류 정극성(DCSP)은 용접봉을 음극(-), 모재를 양극(+)에 두며 모재 발열량이 70% 수준으로 용입이 깊다.","직류 역극성(DCRP)은 용접봉이 양극(+), 모재가 음극(-)이며 박판 용접이나 표면 청정 작용 유도 시 사용된다."],"answerIndex":1,"answerText":"① 피복아크 교류(AC) 용접기는 극성의 주기적 변동이 없어 아크 자기쏠림(자기쏠림 방지 대책)이 직류 용접기보다 훨씬 강하다.","explain":"교류(AC) 용접기는 1초당 100~120회 극성이 교번하므로 아크 쏠림(자기쏠림) 현상이 직류 대비 극히 미미하다."},{"n":30,"type":"mcq","stem":"다음 중 용착법의 종류와 그 설명이 잘못 연결된 것은?","choices":["캐스케이드법: 현장 다층용접에서 비드를 완전히 한 층 다 쌓은 후 다음 층으로 전체 길이를 다 덮는 표준 방법이다.","전진블록법: 후판 다층 용접 시 1개의 블록마다 다층을 최종층까지 용접 완료하고 다른 부위로 전개하는 방식이다.","전진법: 용접 진행 방향과 용착 방향이 같은 평범한 방법으로 잔류 응력 관리에 다소 미흡하다.","비석법(스킵법): 일정한 이격 간격을 두고 한 칸씩 건너뛰어 용접한 후 복귀하는 방식으로 잔류 응력이 가장 적다."],"answerIndex":1,"answerText":"① 캐스케이드법: 현장 다층용접에서 비드를 완전히 한 층 다 쌓은 후 다음 층으로 전체 길이를 다 덮는 표준 방법이다.","explain":"캐스케이드법은 전체 길이를 매 층 다 덮는 것이 아니라, 후판 다층 용접 시 부분별로 계단 형태로 층을 정렬하는 기법이다."},{"n":31,"type":"mcq","stem":"아래보기 X형 맞대기용접 시 모재 가공 방법 및 시공 요건으로 가장 적합한 설명은?","choices":["2구 토치 자동절단기를 활용하여 절단 토치 각도를 수직 기준 각각 22.5°로 정밀 조정하여 개선 홈을 판다.","루트 간격은 이면비드 백패스를 흘려야 하므로 시점 3.0mm, 종점 4.0mm로 조립한다.","판 두께 9.0mm 이하 박판 구조물에 양면 V형 홈을 가공하는 공정이다.","상부와 하부의 V홈 깊이비를 정확히 5:5 완벽 대칭으로 설계해야 수축 뒤틀림이 제로가 된다."],"answerIndex":1,"answerText":"① 2구 토치 자동절단기를 활용하여 절단 토치 각도를 수직 기준 각각 22.5°로 정밀 조정하여 개선 홈을 판다.","explain":"X형 개선 가공은 t15~40mm 후판에 적용하며, 2구 토치 자동 가스 절단기 각도를 수직 22.5° 조정 가공한다."},{"n":32,"type":"mcq","stem":"피복아크 V형 맞대기 아래보기 자세 용접 중, 표면 비드(Cover Pass)를 올릴 때 운봉 폭의 양 끝단에서 약 0.5~1.0초간 약간씩 일시 정지(머무름)를 취하는 기술적 이유는?","choices":["운봉 속도를 늦추어 용접봉과 전력의 소모량을 절약하기 위해서","비드 가장자리가 깎이는 언더컷(Undercut) 결함을 방지하기 위해서","용융지에 뜬 슬래그를 모재 표면 밖으로 강제 분출시키기 위해서","아크 자기쏠림에 의한 불꽃 쏠림을 물리적으로 차단하기 위해서"],"answerIndex":2,"answerText":"② 비드 가장자리가 깎이는 언더컷(Undercut) 결함을 방지하기 위해서","explain":"양 끝단 정지(머무름)는 모재 양 개선홈 가장자리를 충분히 녹여 채움으로써 파이는 언더컷 결함을 방지하는 필수 기법이다."},{"n":33,"type":"mcq","stem":"다음 중 피복아크 맞대기용접 시 모재의 고온 급랭을 저지하고 응력을 분산하는 '예열 작업 준비' 안전 사항으로 틀린 것은?","choices":["가스 토치 예열 조작 전 가스 누설 여부를 비눗물로 확실히 점검 확인한다.","모재 개선면 부위의 기름, 녹, 페인트, 도장막 등을 사전에 확실히 그라인더 그라인딩으로 세정한다.","가스 토치 가동 시 반드시 주변에 연강판이나 목재 등 가연성 물질이 있는지 정돈 확인하고 방화 조치한다.","점화 시에는 아세틸렌 밸브를 100% 완전 개방한 상태에서 수 분간 가스가 체류하도록 기다린 후 라이터를 댄다."],"answerIndex":4,"answerText":"④ 점화 시에는 아세틸렌 밸브를 100% 완전 개방한 상태에서 수 분간 가스가 체류하도록 기다린 후 라이터를 댄다.","explain":"가스 조작 시 아세틸렌 밸브를 100% 완전 개방 체류 후 점화하면 역화 및 폭발의 위험성이 극대화된다."},{"n":34,"type":"mcq","stem":"피복아크용접 맞대기 이음에서 이면비드(백비드) 형성 시 가장 우수한 내균열성과 풍부한 연성 및 인성을 확보하기 위해 사용되는 피복 계통은?","choices":["고셀룰로오스계 (E4311)","고티탄계 (E4313)","일미나이트계 (E4301)","저수소계 (E4316)"],"answerIndex":4,"answerText":"④ 저수소계 (E4316)","explain":"연성과 기계적 성질이 우수하며 내균열성이 가장 최고인 피복 계통은 저수소계 E4316이다."},{"n":35,"type":"mcq","stem":"V형 맞대기 모재 조립 시 모재 엇갈림 단차(엇갈림) 및 루트 간격 조정을 올바르게 확인 점검하기 위해 훈련교사가 사용하는 가장 실용적인 공구는?","choices":["용접게이지","블록게이지","마이크로미터","버니어 캘리퍼스"],"answerIndex":1,"answerText":"① 용접게이지","explain":"모재 가공 홈 형상 정밀도, 루트 간격, 엇갈림 단차를 한 번에 검출 계측할 수 있는 전용 게이지는 용접게이지이다. ▶ 4. 단답식 주관식 및 계산형 정답 및 해설"},{"n":36,"type":"short","stem":"피복아크용접봉 E4316의 규격 표기에서 로마자 'E'와 수치 '43'이 의미하는 공학적 의미를 각각 명확히 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"E: 피복 아크 용접봉 (Electrode) / 43: 용착금속의 최소 인장강도 수준 (43 kgf/mm² 이상)","explain":"E4316 피복아크용접봉의 표준 명칭 규칙 체계이다."},{"n":37,"type":"short","stem":"Guided 굽힘시험기 프레스로 시험편을 구부린 후, 굽힘면에서 단 1개라도 터져 나왔을 때 즉시 불합격(0점) 처리되는 '단일 균열의 최소 길이 기준치(mm)'를 숫자로 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"3.0mm","explain":"굽힘면에 단 1개라도 3.0mm 이상의 균열 발생 시 즉시 0점 처리된다."},{"n":38,"type":"short","stem":"굽힘시험 3대 채점 기준 중, 3.0mm 이하의 작은 균열 흠집들이라 하더라도 굽힘시험편 전체 굽힘면에서 발견된 모든 균열의 누적 합계 길이가 몇 mm 이상(해당 수치 포함)인 경우 0점 처리되는지 그 한계 수치(mm)를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"7.0mm","explain":"미세한 균열이라 하더라도 누적 길이 합계가 7.0mm 이상이면 0점 불합격이다."},{"n":39,"type":"short","stem":"굽힘시험편 전체 표면에서 식별된 기포(Blow Hole) 및 야금학적 미세 크랙 등의 총 누적 합산 개수가 최소 몇 개를 초과하면 불합격(0점)이 되는지 그 기준 개수를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"10개","explain":"기포 및 작은 균열의 발견 총 개수가 10개를 초과(11개부터)하면 0점 처리된다."},{"n":40,"type":"short","stem":"피복아크용접봉 사용 전, 용착금속 저항과 아크 거동에 치명적 불량을 가져오는 '편심률'의 한계치 규격은 몇 % 이내이어야 하는지 숫자로 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"3% 이내","explain":"용접봉의 균일 융착 소모 및 편용 방지를 위한 최대 피복 편심 기준치이다."},{"n":41,"type":"short","stem":"V형 맞대기용접의 1층 초층 비드(이면 백비드) 용접 작업 시, 모재가 작업대 바닥과 녹아 붙는 감전 및 물리적 융합 불량을 방지하기 위해 지그대를 이용해 작업대 평평한 바닥면으로부터 모재 시험판을 최소 몇 mm 이상 띄워 이격 배치하여야 하는지 최저 이격 한계 수치(mm)를 기재하시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"10mm","explain":"이면 백비드 시공 시 모재가 작업대에 융착·통전되지 않도록 지그로 바닥에서 최소 10mm 이상 띄운다. 실기장에 따라 20mm 이상 두기도 한다."},{"n":42,"type":"short","stem":"피복아크용접 아래보기 V형 맞대기(t9.0) 표준 가용접(Tack) 시, 조립 비드의 최대 허용 길이(mm) 한계치를 규격 근거에 준하여 기재하시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"10mm 이내","explain":"가용접 비드의 유효 길이는 본용접부 결함 영향 최소화를 위해 10mm 이내로 설계한다."},{"n":43,"type":"short","stem":"탄소강 및 저합금강(P-No 1~5) 구조물의 피복아크 다층 맞대기용접을 시행할 때, 규정된 최대 허용 층간 온도의 상한 수치(°C) 범위를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"260°C ~ 350°C","explain":"탄소강/저합금강 계열의 조직 연성 보호를 위한 표준 한계 층간 온도 범위이다."},{"n":44,"type":"short","stem":"오스테나이트계 스테인리스강(ASME P-No 8) 다층 용접 시, 야금학적 입계 부식 및 균열을 방지하기 위해 요구되는 최대 허용 층간 온도 한계치(°C)를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"176°C 이하","explain":"오스테나이트 스테인리스 STS304 계열의 예민화 및 부식 방지 층간 상한선이다."},{"n":45,"type":"short","stem":"수직 V형 맞대기(t9.0, E4316 Ø3.2) 초층 상진 용접 시, 토치 작업 각도는 대략 90°를 이루고 진행 반대 방향으로 꺾어주는 진행 방향 각도(진행각/진행반대각)의 권장 범위(°) 수치를 기재하시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"75°~ 85° (진행반대각)","explain":"수직 V형 상진 용접 시 최적 아크력 분산과 key hole 형성을 위한 표준 진행 각도이다."},{"n":46,"type":"short","stem":"가용접(Tack) 조립을 진행할 때, 모재의 수축 닫힘 현상을 공학적으로 상쇄하기 위해 용접 종료부(종점)의 루트 간격을 시작부(시점)보다 약 몇 mm 전후 더 벌려 세팅하는 것이 정석인지 그 단차 제어 수치(mm)를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"0.5mm","explain":"용접이 진행되면 수축으로 루트가 닫히므로 종점 간격을 시점보다 약 0.5mm 더 벌려 조립한다. 교재·현장에 따라 1~2mm로 잡기도 한다."},{"n":47,"type":"short","stem":"아래보기 V형 맞대기(SS275 t9.0) 조립 후 수축 각변형을 사전에 완전히 상쇄하기 위해 용접선 시작부의 반대 방향으로 꺾어주는 정석 '역변형(Pre-deformation) 범위(°)'를 규격에 준하여 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"2° ~ 5° (경험 각도 중시)","explain":"각변형을 물리적 수축각 보상으로 극복하는 사전 변형 방지 역변형 범위이다."},{"n":48,"type":"short","stem":"수동 가스 절단기를 이용하여 맞대기 시험용 강재(SS275)를 V형 개선 홈으로 정밀 기공하기 위해 각도 조정 지시 침을 세팅해야 하는 표준 '베벨 각도(Bevel Angle) 범위(°)'를 기재하시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"30° ~ 35°","explain":"모재 두께 9.0mm 기준, V-butt 개선 정밀 가공을 위한 한 단면 베벨 가공 각도이다."},{"n":49,"type":"short","stem":"고압 산소와 아세틸렌가스 조정기 레귤레이터를 세팅할 때, 예열 토치 안전 가동을 위해 설정해야 하는 아세틸렌의 가압 계통 압력 범위(kgf/㎠)를 쓰시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"0.2 ~ 0.5 kgf/㎠","explain":"예열 가스 토치의 가압 계통에서 권장되는 표준 안전 아세틸렌 압력 범위이다."},{"n":50,"type":"short","stem":"고압 산소를 이용하여 예열 가열을 전개하고자 할 때, 레귤레이터 지침 바늘을 조절하여 분출 가압하는 고압 산소 계통 압력 범위(kgf/㎠)를 숫자로 기재하시오. 답: __________________________________________________________________","choices":[],"answerIndex":null,"answerText":"2 ~ 5 kgf/㎠","explain":"예열 가스 토치의 조작 레귤레이터 게이지 설정 산소 가압 표준 압력 범위이다."}]},"9":{"unit":9,"title":"피복아크용접 필릿용접","code":"LM1601050112","group":"피복아크용접","theory":[{"t":"h2","v":"제1부 NCS 기반 핵심 이론 요약"},{"t":"h4","v":"T형 필릿용접의 본질과 경제적 특성"},{"t":"p","v":"필릿용접(Fillet Welding)은 두 부재를 홈 가공(그루브 가공) 없이 대략 직각 형태로 겹쳐서 만나는 구석진 코너부를 용접하는 이음법이다. 주로 T이음(T-Joint), 모서리이음, 겹치기이음에 널리 사용되며, 맞대기 용접에 비해 다음과 같은 고유의 물리적·경제적 특성을 지닌다."},{"t":"h4","v":"경제성과 작업성:"},{"t":"p","v":"별도의 모재 개선 홈 가공(베벨/그루브 가공)이 필요 없어 준비 작업이 매우 간단하고 공수가 대폭 감소한다. 구조물 조립 및 가조립이 용이하여 전체적인 시공 속도가 매우 빠르고 생산 비용이 저렴해지므로 기계 부품 및 철골 구조물의 보강재 접합에서 최고의 경제성을 발휘한다."},{"t":"h4","v":"공학적 단점 및 취약점:"},{"t":"p","v":"용접부가 겹치는 부분이 많아 맞대기 이음에 비해 제작 완료된 구조물의 전체 중량이 크게 증가한다는 단점이 있다. 또한, 이음의 루트(Root)부에 발생한 내부 용입 결함이나 균열은 육안이나 비파괴 검사로 발견하기가 매우 어렵다. 용접 비드 끝단(토우)에는 단면 형상이 급격히 변하므로 응력 집중(Stress Concentration)이 크게 발생한다. 이로 인해 피로 강도(Fatigue Strength)가 취약하여 반복적인 충격 하중, 굽힘 하중을 받는 구조물 설계에서는 강도 보강 계산에 각별히 유의해야 한다."},{"t":"h4","v":"T형 필릿용접 이음 홈의 각부 명칭 및 치수 계산"},{"t":"p","v":"필릿용접부의 설계 강도를 정확하게 평가하고 결함을 제어하기 위해서는 다음 각부의 명칭과 수학적 상관관계를 정확하게 숙지해야 한다."},{"t":"table","rows":[["각부 기호","명칭(용어)","공학적 정의 및 세부 해설"],["h","각장 (다리 길이, Leg Length)","필릿용접부의 루트(Root) 중심점에서 모재 표면의 비드 경계선인 토우(Toe)까지의 거리를 말한다. 일반적으로 상각장과 하각장의 길이가 같으면 '등각장', 다르면 '부등각장'이라 부르며 도면에 지시되는 기본 치수다."],["a (또는 c)","이론 목두께 (Theoretical Throat)","필릿용접부의 가로 단면 내에 내접하는 최대 직각이등변삼각형의 높이를 의미한다. 즉, 용입 깊이를 고려하지 않은 상태에서 직각 코너의 이음 루트(정점)에서 빗변에 내린 수선(높이)의 길이다."],["ha (또는 c_act)","실제 목두께 (Actual Throat)","용접 후 비드 단면을 잘랐을 때, 모재 내부로 깊게 들어간 실제 '용입의 루트 바닥'에서부터 필릿용접 비드 표면까지의 최단 거리를 말한다. 실제 강도 유지의 핵심 지표다."],["Toe (토우)","용접 토우","용접 비드 표면(용착 금속)과 모재 표면이 만나는 경계 지점을 말한다. 형상이 급변하여 응력이 크게 집중되므로 언더컷이나 토우 균열이 자주 발생하는 취약 부위다."],["용입 깊이 (Penetration)","용입 깊이","아크 열에 의해 용융된 금속이 모재 내부로 침투하여 파고들어 간 깊이를 의미한다. 루트부 용입이 불량하면 응력에 의해 쉽게 파단된다."]]},{"t":"h4","v":"목두께와 각장의 기하학적 계산 공식"},{"t":"p","v":"설계 시 응력 계산에 기초가 되는 이론 목두께(a)와 다리 길이(각장 h) 사이에는 직각이등변삼각형(각도 45°)의 기하학적 원리에 의해 다음과 같은 공식이 성립한다:"},{"t":"h4","v":"필릿용접 공학 핵심 공식 ■ 이론 목두께 (a) = h · cos(45°) ≒ 0.707 · h 다리 길이 (각장 h) = a / cos(45°) ≒ 1.414 · a"},{"t":"p","v":"※ 단순히 필릿용접에서 '목두께'라고 칭할 때는 통상 이 '이론 목두께(a)'를 지칭하며, 전단 강도 계산 시 설계 단면적으로 적용된다."},{"t":"h4","v":"필릿용접 비드 형상 및 용접 자세 분류"},{"t":"h4","v":"비드 형상의 3대 분류:"},{"t":"p","v":"필릿용접부 비드 표면의 돌출 정도에 따라 다음과 같이 구분된다."},{"t":"p","v":"1) 볼록형 필릿(Convex Fillet): 비드 중앙부가 바깥으로 볼록하게 솟아오른 형상이다. 보강 덧살이 많아 안정적으로 보이지만, 토우(Toe) 부분의 각도가 급격해져 응력 집중이 심화되는 단점이 있다."},{"t":"h3","v":"2) 평면형 필릿(Flat Fillet): 표면이 모재 토우 경계선과 직선으로 연결되는 형상이다. 가장 표준적인 비드 상태다."},{"t":"p","v":"3) 오목형 필릿(Concave Fillet): 표면이 아크 모양으로 오목하게 들어간 형상이다. 피로 하중(반복 하중)을 많이 받는 구조물에 사용 시 단면 급변부가 부드럽게 완화되어 응력 집중을 최소화할 수 있는 매우 우수한 형상이다. 단, 목두께가 너무 얇아지지 않도록 다리 길이를 충분히 길게 확보해야만 전단 응력을 견딜 수 있다."},{"t":"h4","v":"필릿용접의 4대 기본 자세 (ASME / AWS 규격 매칭):"},{"t":"h3","v":"1) 아래보기 자세 (1F / Flat Position): 용접하는 부재들을 아래로 고정하고 용접봉을 수직으로 내려다보며 작업하는 가장 안정적인 자세다."},{"t":"p","v":"2) 수평 자세 (2F / Horizontal Position): 바닥 판재와 수직으로 교차하는 부재의 구석선(수평선)을 따라 옆으로 진행하는 자세다. 토치 작업 각도를 정확히 45°로 유지하는 숙련도가 필요하다."},{"t":"p","v":"3) 수직 자세 (3F / Vertical Position): 용접선이 수직으로 서 있는 이음이다. 아래에서 위로 쌓아 올라가는 '수직 상진(Vertical Up / PF)'과 위에서 아래로 빠르게 진행하는 '수직 하진(Vertical Down / PG)'으로 나뉜다. 수직 상진 시에는 중력에 의해 쇳물이 흘러내리지 않도록 적정 층간 운봉과 약간 낮은 전류 조작이 필수적이다."},{"t":"p","v":"4) 위보기 자세 (4F / Overhead Position): 머리 위에 위치한 수평 구석선을 올려다보며 거꾸로 용접하는 가장 고난도의 자세다. 중력에 의해 스패터나 슬래그, 용융 쇳물이 작업자의 얼굴로 떨어질 수 있어 개인 방호구(가죽 자켓, 안전모, 방진마스크) 착용이 엄격히 요구되며 극도로 짧은 아크 길이를 유지해야 한다."},{"t":"h4","v":"자세별 표준 수동 피복아크용접 전류 및 토치 각도 조건"},{"t":"p","v":"피복아크용접봉을 사용하여 T형 필릿용접을 시공할 때, 중력과 열전달 거동에 대처하기 위한 표준 작업 조건(각도 및 전류 범위)은 다음과 같다."},{"t":"table","rows":[["자세 (NCS)","용접봉 지름 (mm)","추천 용접전류 (A)","토치 표준 각도 제어 요령"],["아래보기 (1F)","Ø3.2 또는 Ø4.0","90~110A (Ø3.2) 140~160A (Ø4.0)","작업 각: 45°~50° 유지 진행 각: 75°~85° 제어"],["수평 (2F)","Ø4.0 (2층 비드용)","130~160A","1층 작업 각: 45°~50° 2층 각도: 60°~70° 및 35°~45° 배분 진행 각: 75°~85° 고정"],["수직 상진 (3F)","Ø3.2","80~100A (아래보기 대비 10~20% 강압)","작업 각: 45°~50° 진행 각(상진): 역진방향 70°~80° 비드가 처지지 않게 일정 위빙"],["위보기 (4F)","Ø3.2 또는 Ø4.0","80~100A (Ø3.2) 140~160A (Ø4.0)","작업 각: 45°~50° 진행 각: 70°~80° 제어 중력 극복을 위해 아크 길이 극단축"]]},{"t":"h4","v":"비드 잇기 및 크레이터 처리 요령"},{"t":"h4","v":"비드 잇기(Jointing Beads) 기법:"},{"t":"p","v":"용접 중 용접봉 소모로 인해 비드를 이어서 나갈 때는 결함이 발생하기 쉽다. 올바른 방법은 새로운 용접봉으로 기존 비드가 끝난 크레이터(용융풀이 응고된 오목한 부분)의 전방 10~20mm 지점에서 아크를 먼저 일으켜 아크를 안정시킨 후, 기존 비드의 크레이터 쪽으로 신속히 역진하여 이동하는 것이다. 크레이터가 충분히 재용융되어 쇳물이 완전히 채워진 것을 확인한 뒤, 다시 본래 용접 진행 방향으로 전진 비드를 전개한다. 이 방식을 통해 이음부의 기공이나 융합 불량을 근본적으로 방지할 수 있다."},{"t":"h4","v":"크레이터(Crater) 처리 방법:"},{"t":"p","v":"용접선 종점에서 급격히 아크를 끊으면 수축 구멍이나 균열, 기공 등이 집중적으로 남는 '크레이터 결함'이 발생한다. 종점에 도달하기 2~3mm 전방에서 아크 길이를 매우 짧게 축소한 뒤, 용접봉 끝으로 가볍게 원(Circle)을 2~3회 반복하여 그리면서 용착 금속을 두껍고 풍부하게 채워 넣는다. 이후 아크를 서서히 뒤쪽(이미 용접이 완료된 비드 방향)으로 이동시키며 끊어줌으로써 오목하게 들어간 종점 부위를 평탄하게 메워 시공을 마무리한다."},{"t":"h4","v":"엄격한 외관검사 규격 및 합격 판정 기준"},{"t":"p","v":"필릿용접부의 품질 평가는 먼저 구조물에 해를 끼치지 않는 비파괴적인 방식인 육안 외관 검사를 통해 다리 길이(각장)의 적정성과 치수 정밀도를 엄밀하게 평가한다."},{"t":"h4","v":"각장 허용 한계 규격 (초특급 단골 기출):"},{"t":"p","v":"도면에 지시된 설계 각장 치수를 기준으로 외관검사 시 허용되는 오차 치수 범위는 대원칙적으로 다음과 같다."},{"t":"p","v":"도면 지정 각장의 -20% ~ +50% 이내 범위만 합격 판정"},{"t":"p","v":"예를 들어, 용접 도면에 필릿용접의 다리 길이(각장)가 '6mm'로 지정된 경우, 실제 측정값은 최소 4.8mm(6 x 0.8)에서 최대 9.0mm(6 x 1.5) 범위 내에 있어야만 외관 검사에서 정상 합격 판정을 받는다. 이 범위를 벗어나면 미달 시에는 인장 강도 부족, 초과 시에는 과도한 변형 및 경제성 결여로 불합격(연삭 또는 재용접 수정 대상) 처리된다."},{"t":"h4","v":"비드 외관 결함 제거 가이드라인:"},{"t":"p","v":"비드의 파형이 일정하고 중심선이 직선도를 유지해야 하며, 언더컷(Under-cut)이나 오버랩(Overlap), 유해한 스패터는 그라인더나 치핑 해머로 완벽하게 제거 정돈되어야 한다."},{"t":"h4","v":"필릿용접 파면(파단) 시험 기준 및 요령"},{"t":"p","v":"맞대기 용접은 연성을 측정하기 위해 '굽힘 시험(Bend Test)'을 실시하지만, T형 필릿용접의 기계적 건전성과 루트부 용입 성능을 평가하기 위해서는 구조상 시험편을 꺾어 부수는 '파면 시험(파단 시험, Fracture Test / Rupture Test)'을 반드시 실시한다."},{"t":"h4","v":"시험 요령 및 프레스 가압 방식:"},{"t":"h3","v":"1) 외관검사가 완료된 T형 필릿 용접 시험편을 프레스(Press) 베드 위에 거꾸로 뒤집어 'ㅅ'자 모양(용접부가 하늘을 향하도록)으로 안정되게 배치한다."},{"t":"p","v":"2) 시험편 수직판 정중앙(정점)을 프레스 날로 서서히 강력하게 내리눌러서 수직판과 수평판의 용접부가 반으로 쩍 갈라져 파단되도록 하중을 가한다. 이때 변형에 의한 손상을 방지하기 위해 제품 위에 보강 철판을 덧대고 누르는 경우가 많다."},{"t":"h4","v":"공학적 파면 합격 판정 기준 (매우 중요):"},{"t":"p","v":"파단된 단면의 내부 품질을 검사하여 다음과 같은 기준으로 판정한다."},{"t":"p","v":"★ 필릿 파면시험 절대 합격 규격 ★"},{"t":"p","v":"용접 길이 전체 범위 중 '두 모재가 완전히 용융되어 들어간 깊이(용입)'가"},{"t":"p","v":"용접 총 길이의 최소 '50% 이상' 확보될 것"},{"t":"h4","v":"파면 형태에 따른 불량 진단 분석:"},{"t":"p","v":"1) 두 모재가 프레스로 누르자마자 완전 분리되어 떨어지는 경우: 용접 전류가 너무 낮았거나 속도가 지나치게 빨라 루트부 접합면에 쇳물이 녹아들지 못한 '극심한 용입 부족 및 융합 불량' 상태다."},{"t":"p","v":"2) 완전 분리는 안 되었으나 2/3 이상 갈라져 틈이 보이는 경우: 용접 입열 부족 또는 비드 내부에 과도한 슬래그 섞임(슬래그 혼입)이나 다량의 기공(블로홀)이 발생하여 단면 강도가 급격히 약해진 불량 상태다."},{"t":"h3","v":"3) 파단면이 전체적으로 치밀하고 은백색 또는 미세한 회색 파면으로 균일하게 깨진 경우: 루트 모서리까지 완벽하게 용융 결합된 최고의 양호한 상태다."},{"t":"p","v":"4) 수직판 루트 끝 모서리가 날카롭게 살아있고 전혀 녹지 않은 파면: 토치의 작업 각도가 한쪽으로 지나치게 치우쳤거나 아크 길이가 길어 열집중이 실패한 운봉 불량 상태다."},{"t":"h2","v":"제2부 단원별 대표 엄선 50제 실전 평가"},{"t":"p","v":"본 평가는 고등학교 3학년 과정평가형 자격 외부평가와 실기 구술 시험의 출제 빈도가 가장 높은 알짜 문항들을 수록했습니다. 실제 시험이라 생각하고 꼼꼼히 풀어보시기 바랍니다."},{"t":"h4","v":"제1절 대표 평가 문항 (1번 ~ 50번)"}],"questions":[{"n":1,"type":"mcq","stem":"필릿용접(Fillet Welding)의 특징에 대한 설명으로 가장 적절하지 않은 것은?","choices":["맞대기 용접에 비해 개선 홈 가공을 할 필요가 없어 준비 작업이 수월하다.","용접 구조물의 조립이 쉬워 전체적으로 공정의 경제성이 우수하다.","용접 이음부 부근에 응력이 균일하게 분산되므로 피로 강도가 대단히 우수하다.","겹치는 부분이 발생하기 때문에 구조물의 전체적인 중량이 증가하기 쉽다."],"answerIndex":3,"answerText":"③ 용접 이음부 부근에 응력이 균일하게 분산되므로 피로 강도가 대단히 우수하다.","explain":"용접 이음부 부근에 응력이 균일하게 분산되므로 피로 강도가 대단히 우수하다.\n공학적 근거 및 풀이 해설: 필릿용접은 비드 양단에서 단면이 급변하기 때문에 토우(Toe) 및 이음 루트(Root)부에 극심한 응력 집중이 발생합니다. 이로 인해 피로 강도와 충격, 굽힘 하중에 취약한 구조적 한계를 가집니다. 따라서 피로 강도가 대단히 우수하다는 3번은 완전히 잘못된 설명입니다."},{"n":2,"type":"mcq","stem":"필릿용접부의 다리 길이(각장)를 h라고 가정할 때, 기하학적 직각이등변삼각형 원리에 의한 '이론 목두께(a)'를 구하는 계산 공식으로 옳은 것은?","choices":["a = h · cos(30°)","a = h · cos(45°) ≒ 0.707 · h","a = h / cos(45°) ≒ 1.414 · h","a = h · sin(60°)"],"answerIndex":2,"answerText":"② a = h · cos(45°) ≒ 0.707 · h","explain":"a = h · cos(45°) ≒ 0.707 · h\n공학적 근거 및 풀이 해설: 각장 a와 b가 동일한 등각장 필릿용접의 경우, 단면은 직각이등변삼각형을 이룹니다. 직각부(루트)에서 대변에 내린 높이인 이론 목두께 a는 각장 h에 cos(45°)(즉, 약 0.707)를 곱하여 구합니다."},{"n":3,"type":"mcq","stem":"필릿용접 비드 표면의 돌출 형상에 따른 3대 분류에 해당하지 않는 것은 무엇인가?","choices":["볼록형 필릿 (Convex Fillet)","평면형 필릿 (Flat Fillet)","오목형 필릿 (Concave Fillet)","나팔형 필릿 (Flare Fillet)"],"answerIndex":4,"answerText":"④ 나팔형 필릿 (Flare Fillet)","explain":"나팔형 필릿 (Flare Fillet)\n공학적 근거 및 풀이 해설: 필릿용접부의 단면 형상에 따른 비드 종류는 크게 '볼록형', '평면형', '오목형'의 세 가지로 분류됩니다. 나팔형(플레어)은 개선 홈 형상의 일종입니다."},{"n":4,"type":"mcq","stem":"반복적인 피로 하중이나 진동 하중을 지속적으로 받아 응력 집중을 최소화해야 하는 고장력 강골 구조물의 필릿용접에 가장 유리하고 추천되는 비드 형상은?","choices":["볼록형 필릿 (Convex Fillet)","평면형 필릿 (Flat Fillet)","오목형 필릿 (Concave Fillet)","덧살이 대단히 두꺼운 필릿"],"answerIndex":3,"answerText":"③ 오목형 필릿 (Concave Fillet)","explain":"오목형 필릿 (Concave Fillet)\n공학적 근거 및 풀이 해설: 오목형 필릿은 단면의 급격한 변화를 부드러운 아크 곡선 형태로 이완시켜 응력 집중을 완화하는 특성을 지녀 피로 하중을 받는 구조물에 공학적으로 가장 우수합니다. 단, 중심 목두께가 얇아져서 허용 응력 범위 내에 들도록 다리 길이(각장)를 충분히 길게 시공해야 합니다."},{"n":5,"type":"mcq","stem":"필릿용접 자세를 지시하는 AWS / ASME 규격 기호와 KS 규격의 한글 명칭 매칭 중 옳은 것은?","choices":["1F - 위보기 자세","2F - 수직 자세","3F - 수직 자세","4F - 아래보기 자세"],"answerIndex":3,"answerText":"③ 3F - 수직 자세","explain":"3F - 수직 자세\n공학적 근거 및 풀이 해설: AWS 필릿용접 자세는 1F(아래보기), 2F(수평), 3F(수직), 4F(위보기)로 구분됩니다. 따라서 3F가 수직 자세와 올바르게 매칭되었습니다."},{"n":6,"type":"mcq","stem":"피복아크용접봉 Ø3.2(E4316)를 사용하여 수직 보기 자세(3F) T형 필릿용접을 상진으로 시공하고자 한다. 가장 적절한 표준 아크 용접 전류의 범위는?","choices":["50 ~ 70A","80 ~ 100A","130 ~ 150A","180 ~ 200A"],"answerIndex":2,"answerText":"② 80 ~ 100A","explain":"80 ~ 100A\n공학적 근거 및 풀이 해설: 수직 자세(3F)에서 Ø3.2 용접봉을 사용할 때 중력에 의한 용융 쇳물의 처짐과 낙하를 방지하기 위하여, 아래보기 자세보다 약 10~20%가량 낮은 전류 범위인 '80~100A'로 정밀하게 제어 조정해야 합니다."},{"n":7,"type":"mcq","stem":"T형 필릿 수평보기 자세(2F) 용접 시, 상하 판재에 아크 열과 용착 금속을 균일하게 배분하기 위해 제어해야 하는 용접봉(토치)의 최적 표준 작업 각도는?","choices":["수평판과 15° ~ 20°","수평판과 30° ~ 35°","수평판과 수직판 사이를 정확히 2등분하는 45° ~ 50°","수평판과 거의 직각을 이루는 85° ~ 90°"],"answerIndex":3,"answerText":"③ 수평판과 수직판 사이를 정확히 2등분하는 45° ~ 50°","explain":"수평판과 수직판 사이를 정확히 2등분하는 45° ~ 50°\n공학적 근거 및 풀이 해설: 수평 필릿 용접 시, 양쪽 판재(바닥판과 수직판)에 고르게 입열을 가해 대칭 비드를 올리고 한쪽만 녹는 현상을 막기 위해 토치의 작업 각도는 모재 정면 기준 45°~50°를 정확히 유지해야 합니다."},{"n":8,"type":"mcq","stem":"아래보기 자세 T형 필릿용접 시 비드를 원활하게 쌓기 위해 유지해야 하는 표준 진행 방향 각도는 얼마인가?","choices":["용접 진행 방향으로 30° ~ 40°","용접 진행 방향으로 55° ~ 60°","용접 진행 방향으로 75° ~ 85°","용접 진행 방향과 직각인 90°"],"answerIndex":3,"answerText":"③ 용접 진행 방향으로 75° ~ 85°","explain":"용접 진행 방향으로 75° ~ 85°\n공학적 근거 및 풀이 해설: 필릿 용접 시 용가재 이송과 용융지(용융 쇳물) 관찰 및 슬래그 밀어내기를 완벽하게 수행하기 위한 표준 진행 각도는 전진 방향 기준 75°~85°를 권장합니다."},{"n":9,"type":"mcq","stem":"수평 보기 자세(2F) 필릿 용접에서 2층(다층) 용접을 시행할 때 추천되는 용접봉 지름(mm)과 용접 전류 조건의 조합으로 가장 적절한 것은?","choices":["용접봉 Ø2.6, 용접 전류 50 ~ 70A","용접봉 Ø3.2, 용접 전류 80 ~ 100A","용접봉 Ø4.0, 용접 전류 130 ~ 160A","용접봉 Ø5.0, 용접 전류 190 ~ 210A"],"answerIndex":3,"answerText":"③ 용접봉 Ø4.0, 용접 전류 130 ~ 160A","explain":"용접봉 Ø4.0, 용접 전류 130 ~ 160A\n공학적 근거 및 풀이 해설: 수평 필릿 용접 2층(다층 비드) 시공 시 신속하게 각장을 채우기 위해 일반적으로 Ø4.0 용접봉을 사용하며, 이 경우 표준 아크 용접 전류는 '130~160A' 범위로 상향 조정합니다."},{"n":10,"type":"mcq","stem":"T형 필릿용접부 비드 끝단(시점과 종점) 부위의 단면 급변에 의한 응력 집중을 완화하고 강도를 보충하기 위해 양 끝단에서 연속하여 용접을 감아 돌리는 보강 기법의 명칭은?","choices":["휘핑 기법","크레이터 필링","복스웰딩 / 크래들 용접","슬롯 가공 용접"],"answerIndex":3,"answerText":"③ 복스웰딩 / 크래들 용접","explain":"복스웰딩 / 크래들 용접 (Box Welding / Cradle)\n공학적 근거 및 풀이 해설: 필릿 용접 시 모서리나 끝단부의 응력 집중과 피로 파괴를 방지하기 위해 모퉁이를 따라 비드를 연속하여 감아 돌려서 마감하는 기법을 '복수 용접(Box Welding)' 또는 '감아올림 용접'이라고 부릅니다."},{"n":11,"type":"mcq","stem":"용접 도면에 지시된 설계 다리 길이(각장)가 '6mm'일 때, 현장 육안 외관검사 규정에 따라 최종 불합격 처리되는 다리 길이 측정값은?","choices":["4.8mm","5.5mm","7.2mm","9.5mm"],"answerIndex":4,"answerText":"④ 9.5mm","explain":"9.5mm\n공학적 근거 및 풀이 해설: 외관 검사 시 각장 허용 오차는 도면 지시 각장의 -20%에서 +50% 이내여야 합니다. 도면 지정 각장이 6mm이므로 허용 범위는 [6 * 0.8 = 4.8mm]에서 [6 * 1.5 = 9.0mm]까지입니다. 따라서 9.5mm는 상한선인 9.0mm를 초과하여 불합격 판정을 받습니다."},{"n":12,"type":"mcq","stem":"용접 게이지(Welding Gauge)를 활용하여 측정할 수 있는 용접부 요소가 아닌 것은?","choices":["필릿용접의 각장(Leg Length) 치수","필릿용접의 이론 목두께(Throat Thickness) 치수","맞대기 용접부의 비드 표면 덧살 높이","용접 열영향부(HAZ)의 기계적 항복 강도 값"],"answerIndex":4,"answerText":"④ 용접 열영향부(HAZ)의 기계적 항복 강도 값","explain":"용접 열영향부(HAZ)의 기계적 항복 강도 값\n공학적 근거 및 풀이 해설: 용접 게이지는 각장, 목두께, 비드 높이, 개선 각도 등의 물리적 치수를 현장에서 정밀 측정하기 위한 보조 측정 기구입니다. 열영향부(HAZ)의 기계적 강도 값은 인장 시험과 같은 파괴 성능 시험을 통해서만 도출될 수 있습니다."},{"n":13,"type":"mcq","stem":"T형 필릿 용접부의 내부 건전성과 결함 유무를 기계적으로 확인하기 위해 파면 시험(Fracture Test)을 실시할 때, 가압 프레스 상에서의 올바른 시편 배치 방법은?","choices":["용접부가 위로 향하도록 'ㅅ'자 모양으로 프레스 위에 올려놓는다.","수직판을 바닥에 눕히고 용접 비드면을 프레스 날로 직접 가압한다.","용접부가 아래를 향하도록 완전히 거꾸로 뒤집어 'V'자 모양으로 걸쳐놓는다.","수평판이 프레스 날과 직각이 되도록 세워서 배치한다."],"answerIndex":1,"answerText":"① 용접부가 위로 향하도록 'ㅅ'자 모양으로 프레스 위에 올려놓는다.","explain":"용접부가 위로 향하도록 'ㅅ'자 모양으로 프레스 위에 올려놓는다.\n공학적 근거 및 풀이 해설: 필릿용접 파면 시험 시에는 외관검사 완료 후, 평판을 프레스 위에 용접 비드부가 위(하늘)로 향하도록 뒤집어 'ㅅ'자 모양으로 배치한 후 정점을 가압하여 강제 파단시킵니다."},{"n":14,"type":"mcq","stem":"T형 필릿용접부의 기계적 파면 시험(Rupture Test)에서 '합격'으로 판단하기 위한 가장 정밀한 공학적 판정 기준은?","choices":["두 모재가 흔적도 없이 완전히 똑같이 분리되어 깨끗이 파단되어야 한다.","파단된 용착 금속부 단면에 기공의 누적 합계가 100개를 초과할 것","용접부 전체 길이에 대하여 두 모재의 용입(녹아들어 간 부분) 깊이가 50% 이상이어야 한다.","프레스로 최대 하중을 가해도 시험편이 전혀 깨지지 않고 굽어지기만 해야 한다."],"answerIndex":3,"answerText":"③ 용접부 전체 길이에 대하여 두 모재의 용입(녹아들어 간 부분) 깊이가 50% 이상이어야 한다.","explain":"용접부 전체 길이에 대하여 두 모재의 용입(녹아들어 간 부분) 깊이가 50% 이상이어야 한다.\n공학적 근거 및 풀이 해설: T형 필릿용접 파단(파면) 검사의 핵심 합격 대원칙은 용접부 총 길이에 걸쳐 두 모재의 용착부 용입 깊이가 최소 '50% 이상' 확보되는 것입니다."},{"n":15,"type":"mcq","stem":"파면 시험 시 프레스로 눌렀을 때 두 모재가 완전 분리되며 탈락하는 불합격 현상이 발생하였다. 이때 추정할 수 있는 가장 대표적인 결함 원인은?","choices":["아크 전류가 너무 과소하여 모재가 녹지 않은 '극심한 용입 부족 및 융합 불량'","용접 속도가 지나치게 느려 비드가 너무 두껍게 형성된 경우","용접 아크 전류의 과다로 인한 모재 용락","보호가스의 수분량이 부적절하여 아크 소리가 너무 부드러운 경우"],"answerIndex":1,"answerText":"① 아크 전류가 너무 과소하여 모재가 녹지 않은 '극심한 용입 부족 및 융합 불량'","explain":"아크 전류가 너무 과소하여 모재가 녹지 않은 '극심한 용입 부족 및 융합 불량'\n공학적 근거 및 풀이 해설: 프레스 가압 시 두 모재가 쉽게 완전 분리되어 떨어지는 것은 루트부 접착 계면에 아크 열이 닿지 않아 용가재만 얹어진 '용입 부족 및 융착 불량'이 근본 원인이며, 이는 전류 과소 및 운봉 각도 불량에서 기인합니다."},{"n":16,"type":"mcq","stem":"다음 중 T형 필릿 용접 비드 단면 형상에서 응력 집중이 가장 적게 발생하여 피로 설계상 가장 유리한 비드 형태는?","choices":["오목형 필릿 비드","볼록형 필릿 비드","부등각장 볼록 비드","덧살이 과도한 평면 비드"],"answerIndex":1,"answerText":"① 오목형 필릿 비드","explain":"오목형 필릿 비드\n공학적 근거 및 풀이 해설: 오목형 필릿 비드는 단면 변화율이 완만하여 응력 집중이 가장 적게 분산되므로, 피로 응력을 지속적으로 받는 부품 구조물에서 기하학적으로 대단히 유리합니다."},{"n":17,"type":"mcq","stem":"피복 아크 용접 시 아크 열에 의해 녹은 용융 금속의 대기 산화 및 질화를 원천 방지하여 아크 안정성과 비드 품질을 지켜주는 용접봉 구성 요소는?","choices":["외부 피복제","홀더 단자 접촉부","모재 산화막","용접봉 중심 심선"],"answerIndex":1,"answerText":"① 외부 피복제","explain":"외부 피복제 (Flux Coating)\n공학적 근거 및 풀이 해설: 용접봉 주위를 감싸고 있는 피복제는 아크 연소 시 강력한 탄산가스(CO2) 등의 보호가스와 슬래그를 풍부하게 방출하여 공기 중의 유해한 산소, 질소 유입을 전면 차단합니다."},{"n":18,"type":"mcq","stem":"필릿용접부의 실제 목두께(Actual Throat Thickness)에 대한 정의로 옳은 것은?","choices":["용입을 무시하고 설계상 산출된 삼각형의 높이","용입을 고려한 루트 바닥에서 비드 표면까지의 최단 거리","수평판에서부터 용접 토우 끝단까지의 수직 거리","비드 중심부에서 양쪽 토우까지의 빗변 길이"],"answerIndex":2,"answerText":"② 용입을 고려한 루트 바닥에서 비드 표면까지의 최단 거리","explain":"용입을 고려한 실제 '용입의 루트 바닥'에서 비드 표면까지의 최단 거리\n공학적 근거 및 풀이 해설: 실제 목두께는 실제 모재 내부로 깊게 침투한 '용입 루트의 최하단부 정점'에서 비드 표면까지의 실질적인 용착 깊이(최단 거리)를 뜻합니다."},{"n":19,"type":"mcq","stem":"T형 필릿 용접작업을 진행하기 전에 모재를 견고하게 고정하고 변형을 억제하기 위해 가접하는 '가용접(Tack Weld)'의 올바른 조립 준수 사항이 아닌 것은?","choices":["가용접사는 반드시 본용접을 수행할 수 있는 자격을 지닌 숙련자여야 한다.","응력이 빽빽하게 뭉치기 쉬운 코너 모서리 정점부나 시작점에 가용접을 조밀하게 배치한다.","본용접 그루브 홈 내부에 가용접 비드가 영구적으로 포함될 때 결함이 의심되면 완전 연삭해 낸다.","가용접 비드의 길이는 강도와 급랭을 감안하여 규격화된 최소 길이를 유지해야 한다."],"answerIndex":2,"answerText":"② 응력이 빽빽하게 뭉치기 쉬운 코너 모서리 정점부나 시작점에 가용접을 조밀하게 배치한다.","explain":"응력이 빽빽하게 뭉치기 쉬운 코너 모서리 정점부나 시작점에 가용접을 조밀하게 배치한다.\n공학적 근거 및 풀이 해설: 안전율 저하 및 슬래그 혼입 기공 결함의 온상이 되기 쉬운 모서리 끝단, 코너, 정점부 등 응력 집중 지역에는 가용접 배치를 철저히 피해야 합니다."},{"n":20,"type":"mcq","stem":"T형 필릿용접의 수동 위빙 운봉 기법 중 비드 양 끝단에서 운봉 속도를 정밀하게 제어하는 요령으로 옳은 것은?","choices":["양끝에서는 쇳물이 흘러내려 처지지 않도록 아주 신속하게 통과한다.","양끝 부분에서는 언더컷을 채우기 위해 1~2초간 충분히 머물러 주고(Pause), 중앙부는 신속하게 패스한다.","처음부터 끝까지 속도 변화를 전혀 주지 않고 등속도로만 직선 진행한다.","양끝에서 오래 머무르면 용락되므로 중앙에서만 오래 머물러 아크 길이를 길게 유지한다."],"answerIndex":2,"answerText":"② 양끝 부분에서는 언더컷을 채우기 위해 1~2초간 충분히 머물러 주고(Pause), 중앙부는 신속하게 패스한다.","explain":"양끝 부분에서는 언더컷을 채우기 위해 1~2초간 충분히 머물러 주고(Pause), 중앙부는 신속하게 패스한다.\n공학적 근거 및 풀이 해설: 수직 상진이나 수평 필릿 위빙 시, 용융 쇳물이 중앙으로 몰려 토우 부분이 깎이는 언더컷 결함을 예방하기 위해 양끝 경계선에서는 '잠시 머무름(Pause)'을 주어 용착 금속을 충실히 채우고, 중앙은 빠르게 지나쳐야 비드가 평탄하게 안착됩니다."},{"n":21,"type":"mcq","stem":"필릿용접부 비드 표면의 불균일함이나 비드 폭의 오차 허용치 규격(KS 기준)으로 옳은 것은?","choices":["용접 길이 150mm 범위 내에 대해 최대 '5mm 이하'여야 한다.","용접 길이 전체 범위에 대해 오차는 무제한 허용된다.","용접 길이 300mm에 대해 단차 편차가 10mm 이하일 것","비드 폭 오차는 ±0.1mm 이내의 기계 정밀도를 유지해야 한다."],"answerIndex":1,"answerText":"① 용접 길이 150mm 범위 내에 대해 최대 '5mm 이하'여야 한다.","explain":"용접 길이 150mm 범위 내에 대해 최대 '5mm 이하'여야 한다.\n공학적 근거 및 풀이 해설: 외관 품질 기준상, 필릿용접 비드 표면의 불균일이나 비드 폭의 급격한 편차는 용접 길이 150mm 범위 내에서 '5mm 이하'로 일정하게 안착되어야 합격 처리됩니다."},{"n":22,"type":"mcq","stem":"T형 필릿용접의 파단 시험 결과, 수직판 모재의 정수리 끝 정점 모서리가 둥글게 녹지 않고 칼날처럼 선명하게 살아있었다. 이로 인한 공학적 원인 분석으로 가장 타당한 것은?","choices":["토치 작업 각도가 한쪽 판재로 치우치고 전류가 부적합해 아크 열집중에 실패함","충분히 건조된 저수소계 용접봉을 규정대로 사용하였기 때문에 생긴 현상","파단 시험 프레스의 하중이 비대칭으로 전달되어 생긴 전단 응력 오차","용접 전압이 너무 높아 스패터가 과도하게 튄 결과로 나타난 현상"],"answerIndex":1,"answerText":"① 토치 작업 각도가 한쪽 판재로 치우치고 전류가 부적합해 아크 열집중에 실패함","explain":"용접 토치의 작업 각도가 한쪽 판재로 심하게 치우쳤거나, 부적합한 전류 조작으로 인한 아크 열집중 실패\n공학적 근거 및 풀이 해설: 수직 모재 정점이 둥글게 깎이듯이 용융되지 않고 날카롭게 남아있는 파면은, 용접 시 토치 작업 각도를 45°로 유지하지 못하고 아래판이나 위판으로 한쪽으로 기울여 쇳물이 루트부 정점을 감싸며 균일하게 녹이지 못했을 때 발생합니다."},{"n":23,"type":"mcq","stem":"수직 자세(3F) 필릿 용접 시 쇳물이 아래로 흘러내리는 현상을 억제하기 위해 용접 전류를 조작하는 일반적인 방법은?","choices":["아래보기 표준 전류보다 대략 10~20% 가량 낮춰 조절한다.","아크가 잘 끊기지 않도록 고전압 전압 부하를 강제로 증대시킨다.","용융율을 극한으로 높이기 위해 전류를 50% 이상 강력하게 증폭한다.","아래보기(1F) 자세와 완벽하게 동일한 고전류를 유지한다."],"answerIndex":1,"answerText":"① 아래보기 표준 전류보다 대략 10~20% 가량 낮춰 조절한다.","explain":"아래보기 표준 전류보다 대략 10~20% 가량 낮춰 조절한다.\n공학적 근거 및 풀이 해설: 수직 자세에서는 입열량이 과도하면 용융 쇳물의 점성이 떨어져 중력에 의해 주르륵 처지는 용락 및 언더컷 결함이 동반됩니다. 따라서 반드시 추천되는 전류 조정 요령은 아래보기 대비 10~20% 낮추는 것입니다."},{"n":24,"type":"mcq","stem":"위보기 자세(4F) 필릿 용접 시, 중력에 대처하고 슬래그 혼입을 방지하기 위한 가장 정석적인 아크 길이 조작 수칙은?","choices":["용융지 안착을 관찰하기 위해 아크 길이를 길게(3~5mm) 유지한다.","아크 길이를 가능한 극단적으로 짧게(1.5~2.5mm) 유지하여 열 집중을 강화한다.","아크 길이를 연속하여 늘였다 줄였다 반복적으로 휘핑 조작한다.","아크 길이와 상관없이 토치 진행 속도만 빠르게 전개한다."],"answerIndex":2,"answerText":"② 아크 길이를 가능한 극단적으로 짧게(1.5~2.5mm) 유지하여 열 집중을 강화한다.","explain":"아크 길이를 가능한 극단적으로 짧게(1.5~2.5mm) 유지하여 열 집중을 강화한다.\n공학적 근거 및 풀이 해설: 위보기 자세에서는 중력의 영향으로 아크 길이가 조금만 길어져도 용융 금속이 팁에 들러붙거나 밑으로 떨어져 버려 큰 결함이 됩니다. 반드시 아크 길이를 극도로 짧고 촘촘하게 제어하는 것이 기초 기술입니다."},{"n":25,"type":"mcq","stem":"다음 비파괴 검사(NDT) 기호 중, 용접부의 표면 결함(토우 균열, 언더컷) 검출에 널리 활용되며 침투액을 사용하여 모세관 현상으로 결함을 찾아내는 시험법은?","choices":["RT (Radiographic Testing)","UT (Ultrasonic Testing)","PT (Penetrant Testing)","MT (Magnetic Particle Testing)"],"answerIndex":3,"answerText":"③ PT (Penetrant Testing)","explain":"PT (Penetrant Testing)\n공학적 근거 및 풀이 해설: 침투 탐상 시험(PT)은 침투액, 세척액, 현상액을 분사하여 표면에 열린 균열이나 결함을 모세관 물리 현상에 의해 적색 지시 모양으로 시각화해 식별하는 대표 표면 검사법입니다."},{"n":26,"type":"mcq","stem":"필릿용접 이음의 파단 강도 계산 시 적용되는 '이론 단면적'의 기준 요소로 옳은 것은?","choices":["실제 각장의 폭과 비드 전체 외경 길이의 곱","이론 목두께(a)와 용접부 길이(ℓ)의 곱 (a · ℓ)","두 모재 판 두께(t)의 자승 비례 값","수평 다리 길이와 수직 다리 길이의 단순 산술 평균 면적"],"answerIndex":2,"answerText":"② 이론 목두께(a)와 용접부 길이(ℓ)의 곱 (a · ℓ)","explain":"이론 목두께(a)와 용접부 길이(ℓ)의 곱 (a · ℓ)\n공학적 근거 및 풀이 해설: 공학 설계 및 전단 응력 계산 시 필릿이음의 목단면적(Throat Area)은 '이론 목두께(a) x 용접 비드 총 길이(ℓ)'로 명확히 산출되어 적용됩니다."},{"n":27,"type":"mcq","stem":"E4316 저수소계 용접봉을 습기가 가득 찬 상태에서 그대로 사용할 경우 용접부에 직접적으로 발생하는 결함이 아닌 것은?","choices":["피트(Pit) 및 기공(Blow hole)","수소 침입으로 인한 저온 지연 균열","아크 분위기 중의 수소 원자의 급격한 확산","용착 금속의 화학 성분 중 탄소 함량의 무한대 증가"],"answerIndex":4,"answerText":"④ 용착 금속의 화학 성분 중 탄소 함량의 무한대 증가","explain":"용착 금속의 화학 성분 중 탄소 함량의 무한대 증가\n공학적 근거 및 풀이 해설: 용접봉 흡습 시 피복제 내부의 수분(H2O)이 분해되어 다량의 확산성 수소가 용착 금속 내부로 유입됩니다. 이로 인해 기공, 피트, 지연 균열이 심화되나 용착부의 화학 원소 중 탄소 함량을 무한대로 높이는 현상과는 무관합니다."},{"n":28,"type":"mcq","stem":"다음 중 슬래그 해머와 브러시를 사용하여 필릿용접 완료 후 층간 슬래그를 완벽하게 털어내야 하는 공학적 이유로 가장 알맞은 것은?","choices":["슬래그가 남아 있으면 용접기의 허용 사용률이 절반으로 하락하기 때문이다.","잔류 슬래그 위에 덧용접하면 비드 내부에 슬래그 혼입 결함이 생기기 때문이다.","슬래그가 용접 전류를 무선으로 증폭시키는 금속 전도체이기 때문이다.","슬래그가 산소 조정기 내부의 폭발을 유도하는 발화원이 되기 때문이다."],"answerIndex":2,"answerText":"② 잔류 슬래그 위에 덧용접하면 비드 내부에 슬래그 혼입 결함이 생기기 때문이다.","explain":"잔류 슬래그 위에 그대로 덮어쓰기 용접을 전개하면 슬래그가 비드 내부에 갇혀 응고되는 '슬래그 혼입(Inclusion)' 결함이 직접 동반되기 때문이다.\n공학적 근거 및 풀이 해설: 전층 비드의 슬래그 청소가 미흡하면, 다음 적층 용접 시 슬래그가 용융되지 않고 그대로 비드 내부에 영구 포획되는 슬래그 혼입 결함을 야기하여 강도를 심각하게 훼손시킵니다."},{"n":29,"type":"mcq","stem":"필릿용접 외관 검사에서 오버랩(Overlap) 결함이 발견되었다. 이 결함이 발생했을 때의 정석적인 연삭 및 수정 조치 요령으로 옳은 것은?","choices":["결함 부위를 가우징이나 그라인더로 부드럽게 깎아내고 경계부를 완만하게 다듬은 후 부족 시 재용접한다.","오버랩은 허용 한계 규격이 없으므로 무시하고 즉시 본도장을 전개한다.","모재를 산소 가스로 약 300mm 이상 통째로 잘라내어 신품 모재로 교체한다.","오버랩이 발생한 부위에 E4316 Ø5.0 고전류 용접봉으로 덧씌우기 아크를 강력하게 쏜다."],"answerIndex":1,"answerText":"① 결함 부위를 가우징이나 그라인더로 부드럽게 깎아내고 경계부를 완만하게 다듬은 후 부족 시 재용접한다.","explain":"결함 부위를 가우징이나 그라인더로 부드럽게 깎아내고 경계부를 완만하게 다듬은 후 부족 시 재용접한다.\n공학적 근거 및 풀이 해설: 오버랩은 용융 금속이 모재 표면에 녹아들지 못하고 얹어진 상태이므로, 그라인더 연삭 작업을 통해 급변 단면 경계부를 제거한 뒤 부족하면 적정 전류로 재용접해야 합니다."},{"n":30,"type":"mcq","stem":"T형 필릿용접 가가용접 시 모재의 열변형과 수축을 미연에 방지하기 위해 가하는 시공 요령으로 옳은 것은?","choices":["가용접 길이를 수평판 전체 길이와 동일하게 연속으로 길게 시공한다.","가용접 직후 모재에 얼음물을 끼얹어 온도를 급랭시켜 수축을 막는다.","모재를 도면상의 직각보다 안쪽으로 더 꺾어 그대로 구속해 둔다.","용접 반대 방향으로 모재를 미리 약 1°~2° 꺾어 역변형을 준다."],"answerIndex":4,"answerText":"④ 용접 반대 방향으로 모재를 미리 약 1°~2° 꺾어 역변형을 준다.","explain":"용접 수축을 보상하기 위해 용접 반대 방향으로 모재를 사전에 약 1°~2° 가량 꺾어 역변형(Pre-bending)을 준다.\n공학적 근거 및 풀이 해설: 용접 열수축 거동에 의한 직각 비틀림 변형에 미리 대응하기 위하여 수축 반대(역방향) 쪽으로 사전에 '1~2° 역변형'을 준 후 구속해 놓는 것이 올바른 용접 공법입니다."},{"n":31,"type":"mcq","stem":"과정평가형 시험에 사용되는 대표 연강판 모재 규격 명칭 'SS275'에서 수치 '275'의 공학적 의미는?","choices":["최소 인장 강도가 275 kgf/mm² 임을 지시","항복 강도의 최솟값이 275 N/mm² (MPa) 임을 지시","모재 내부에 규소 함유량이 2.75% 포함되었음을 지시","철판의 최고 허용 사용 한계 온도가 275°C 임을 지시"],"answerIndex":2,"answerText":"② 항복 강도의 최솟값이 275 N/mm² (MPa) 임을 지시","explain":"항복 강도의 최솟값이 275 N/mm² (MPa) 임을 지시\n공학적 근거 및 풀이 해설: KS 강재 표준 명칭 체계에서 SS275의 'SS'는 일반 구조용 압연강재를 뜻하고, 뒤의 수치 '275'는 '최소 항복 강도가 275 MPa(N/mm²)' 이상임을 명확히 규정하는 식별 기호입니다."},{"n":32,"type":"mcq","stem":"필릿용접 시 비드 폭 전체가 고르게 안착되지 않고 지그재그 형태로 흔들리는 결함이 생겼을 때, 용접사에게 조언해야 할 가장 시급한 보완 요령은?","choices":["석필로 직선 가이드선을 긋고 일정한 운봉 각도와 등속 운봉을 연습시킨다.","용접봉의 건조 온도를 500°C로 높여 장시간 재건조한 뒤 쓰게 한다.","피복제를 물에 담가 흡습시켜 수소 용량을 넉넉히 확보하도록 유도한다.","아크 전압 게이지의 무부하 전압을 300V 이상으로 강제 상승시켜 둔다."],"answerIndex":1,"answerText":"① 석필로 직선 가이드선을 긋고 일정한 운봉 각도와 등속 운봉을 연습시킨다.","explain":"토치 진행선에 평행한 직선 가이드선(석필 가이드선)을 긋고, 일정한 토치 운봉 각도와 등속 운봉을 집중 연습시킨다.\n공학적 근거 및 풀이 해설: 비드가 삐뚤빼뚤하게 불균일한 것은 용접사의 손 떨림이나 등속 진행 미흡, 토치 각도 거동 불균일이 주원인입니다. 석필로 모재에 선명한 진행 안내 가이드를 그어주고 안정된 자세로 등속 조작하도록 학습시키는 것이 표준 대책입니다."},{"n":33,"type":"mcq","stem":"필릿용접 파면 시험 평가 후, 부적절한 아크 조작으로 판단되어 '수직판 루트 끝 단 모서리가 용융되지 않은 상태'가 발견되었다. 이 결함이 발생할 가능성이 가장 높은 경우는?","choices":["용접전류를 Ø3.2 기준 100A 전후로 세팅하여 균일하게 전진했을 때","피닝(Peening) 처리를 정석적으로 실시했을 때","아크 길이를 적절히 아주 짧게 유지하여 입열을 가했을 때","토치 작업 각도를 수평판 쪽으로만 치우치게 눕혀서 아크를 길게 띄워 용접했을 때"],"answerIndex":4,"answerText":"④ 토치 작업 각도를 수평판 쪽으로만 치우치게 눕혀서 아크를 길게 띄워 용접했을 때","explain":"토치 작업 각도를 수평판 쪽으로만 치우치게 눕혀서 아크를 길게 띄워 용접했을 때\n공학적 근거 및 풀이 해설: 수직 모재 정점 모퉁이가 녹지 않고 날카롭게 남아있는 단면 불량은, 작업 각도가 한쪽으로 쏠리거나 아크가 너무 길어서 정점 루트의 국소 부위에 집중 열전달이 되지 않고 옆면만 녹아버렸을 때 주로 발생합니다."},{"n":34,"type":"mcq","stem":"T형 필릿용접 수직 자세(3F) 용접을 수행할 때, 비드 처짐을 방지하기 위해 권장되는 가장 표준적인 수동 위빙 조작 형태는?","choices":["아크 길이를 대폭 키워서 원형으로 크게 회전하는 나선 위빙","후진법으로 빠르게 슬래그를 선행시키는 후퇴 쾌속법","종점까지 직선으로 빠르게 밀고 나가는 직선법","반달형 또는 지그재그형 위빙(양끝에서 잠깐 멈추고 중앙은 신속 통과)"],"answerIndex":4,"answerText":"④ 반달형 또는 지그재그형 위빙(양끝에서 잠깐 멈추고 중앙은 신속 통과)","explain":"반달형 또는 지그재그형 위빙(양끝에서 잠깐 멈추고 중앙은 신속 통과)\n공학적 근거 및 풀이 해설: 수직 자세 용접 시에는 반달형이나 지그재그 위빙을 사용해 쇳물을 모재 구석 양 끝단에 골고루 걸쳐 안착시켜야 처지지 않고 고른 각장이 형성됩니다."},{"n":35,"type":"mcq","stem":"과정평가형 시험장에서 피복아크용접 작업 완료 후 정리정돈 안전 수칙으로 가장 올바른 것은?","choices":["아르곤 메인 실린더 밸브는 열어둔 채 계통 가스만 잠그고 주위를 정리한다.","장비 보존을 위해 용접기 전원을 무부하 가동 상태로 켜둔 채 퇴실한다.","소모된 용접봉을 홀더에 그대로 물려둔 채 홀더를 접지대 위에 방치한다.","용접기 스위치 → 벽면 1차 전원 → 메인 배전반 순서로 차단하고 주변을 소제한다."],"answerIndex":4,"answerText":"④ 용접기 스위치 → 벽면 1차 전원 → 메인 배전반 순서로 차단하고 주변을 소제한다.","explain":"용접기 전원 차단 스위치 OFF → 벽면 1차 전원 스위치 OFF → 메인 배전반 스위치 OFF 순서로 계통 전원을 순차적으로 차단하고 주변 슬래그 꽁다리를 소제한다.\n공학적 근거 및 풀이 해설: 작업 후 감전 및 설비 화재 예방을 위하여 용접기의 로컬 스위치를 끄고, 이어서 개별 전원과 메인 전원 순서로 에너지를 완전 차단한 후 수공구와 잔여 모재를 선입선출 정위치에 정돈 소제하는 것이 안전보건 대원칙입니다."},{"n":36,"type":"short","stem":"필릿용접부 단면 내접 직각이등변삼각형의 루트(Root)부 정점에서부터 빗변 사면까지의 수직 최단 거리를 뜻하는 '이 용어'의 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"이론 목두께 (또는 목두께)","explain":"이론 목두께는 필릿용접의 설계 강도 계산 시 단면적의 핵심 높이 성분으로 적용됩니다."},{"n":37,"type":"short","stem":"T형 필릿용접 완료 후 비파괴 육안 외관 검사에서 실제 측정한 각장(다리 길이) 오차 범위는 도면에 지시된 지정 각장 치수 대비 최소 몇 %에서 최대 몇 % 이내 범위여야만 합격 처리되는가?","choices":[],"answerIndex":null,"answerText":"20% ~ +50%","explain":"예를 들어, 지정 각장 6mm인 경우 허용 오차는 4.8mm ~ 9.0mm 범위입니다."},{"n":38,"type":"short","stem":"필릿용접부의 비드 형상 중 피로 하중(반복 충격)을 지속적으로 받는 동하중 구조물 시공 시, 단면 급변부의 응력 집중을 최소화하기 위해 비드 표면 형상을 움푹한 곡선 형태로 다듬는 이 비드의 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"오목형 필릿 비드 (또는 오목형 필릿)","explain":"오목형 비드는 응력 분산 효과가 매우 우수해 피로 응력 완화용 구조물에 추천되는 형상입니다."},{"n":39,"type":"short","stem":"필릿용접부의 실제 용융이 일어난 실제 루트(Root) 바닥 정점에서부터 용접 비드 표면까지의 최단 실질 거리를 뜻하는 용어 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"실제 목두께","explain":"실제 목두께는 모재 내부로 들어간 실제 용입 깊이를 포함하는 물리적 두께 지표입니다."},{"n":40,"type":"short","stem":"T형 필릿용접의 기계적 성질과 루트 품질을 검사하기 위해, 시험편을 ㅅ자 형태로 배치한 후 유압 기계로 가압하여 꺾어 깨뜨리는 기계적 시험법 명칭은?","choices":[],"answerIndex":null,"answerText":"파면 시험 (또는 파단 시험)","explain":"맞대기 용접의 굽힘 시험 대신, 필릿용접에서는 용입 상태를 눈으로 직접 확인하는 파면(파단) 시험을 적용합니다."},{"n":41,"type":"short","stem":"필릿용접 파면 시험의 합격 판정 기준으로, 파단된 단면의 두 모재 용착부 용입(녹아들어 간 부분) 깊이가 용접부 전체 길이 범위 중 최소 몇 % 이상이어야 하는가?","choices":[],"answerIndex":null,"answerText":"50% 이상 (또는 50%)","explain":"용입 깊이가 전체 비드 길이의 50% 이상 확보되어야 비로소 실무 기준에 도달하는 합격 품질로 판정합니다."},{"n":42,"type":"short","stem":"필릿용접 비드 양 끝단에서 단면이 급변하는 경계 부위의 응력 집중과 균열 결함을 보완하기 위하여 모퉁이를 따라 비드를 끊지 않고 연속하여 감아 용접하는 기법을 무엇이라 부르는가?","choices":[],"answerIndex":null,"answerText":"복스 웰딩 (Box Welding 또는 감아올림 용접)","explain":"수평 및 수직 필릿용접 마감 시 응력 보강을 위해 모서리를 따라 자연스럽게 감아 처리하는 기법입니다."},{"n":43,"type":"short","stem":"용접 도면에 지정 각장(Leg Length) 치수가 6mm로 정밀하게 주어졌을 때, 허용 오차 규정을 만족하는 합격 판정의 최소 각장 측정값은 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"4.8mm","explain":"지정 각장 6mm의 -20% 오차를 계산하면 4.8mm가 최소 한계 치수가 됩니다."},{"n":44,"type":"short","stem":"용접 도면에 지정 각장 치수가 6mm로 주어졌을 때, 허용 오차 규정을 만족하는 합격 판정의 최대 각장 측정값은 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"9.0mm (또는 9mm)","explain":"지정 각장 6mm의 +50% 오차를 적용하여 산출하면 9.0mm가 최대 한계 치수가 됩니다."},{"n":45,"type":"short","stem":"용접 중 새로운 용접봉으로 교체하여 비드를 이어 붙일 때, 결함을 방지하기 위해 기존 크레이터의 전방 몇 mm 지점에서 사전에 아크를 일으켜 안정시킨 후 역진해야 하는가?","choices":[],"answerIndex":null,"answerText":"10~20mm (또는 10mm ~ 20mm)","explain":"크레이터 전방 10~20mm 영역에서 미리 아크를 띄우는 것이 비드 잇기 결함 예방 수칙입니다."},{"n":46,"type":"short","stem":"필릿용접 이음의 각부 명칭 중, 비드 표면의 용착 금속과 모재 금속 표면이 급격한 경사를 이루며 서로 만나는 비드의 바깥쪽 경계선을 뜻하는 명어는?","choices":[],"answerIndex":null,"answerText":"토우 (Toe)","explain":"토우는 국소적인 형상 급변으로 인해 언더컷이나 토우 균열의 발생 위험이 매우 높은 경계 지점입니다."},{"n":47,"type":"short","stem":"수평 필릿 용접 시공 시 1층 비드를 완전히 마감하고 2층(겹침 적층) 용접을 시행할 때, 2층의 첫 번째 비드 안착을 위해 토치가 모재 수평판과 유지해야 하는 표준 작업 각도는?","choices":[],"answerIndex":null,"answerText":"40° ~ 50° (또는 40도 ~ 50도)","explain":"수평필릿 2층은 아래쪽(수평판 쪽) 비드를 먼저 쌓아 받침을 만드므로 첫 비드 작업각은 40°~50°이고, 60°~70°는 그다음 위쪽(수직판 쪽) 비드의 각도다."},{"n":48,"type":"short","stem":"필릿용접 시 비드 표면에 미세한 슬래그나 스패터가 남지 않도록 깨끗이 소제하고, 슬래그 꽁다리 분진을 청소하기 위해 가공 그라인더실을 청소할 때 호흡기 보강을 위해 반드시 의무 착용해야 하는 안전 보호구의 한글 명칭은?","choices":[],"answerIndex":null,"answerText":"방진 마스크","explain":"연삭 작업 및 그라인더실 분진 청소 시에는 석면 및 미세 쇳가루 흡입 방지를 위해 1급 이상의 방진 마스크를 필수 착용해야 합니다."},{"n":49,"type":"short","stem":"필릿용접의 수평자세(2F) 2층 적층 시, 두 번째(아래쪽 경계 보강) 비드를 적층할 때 토치 가이드 각도로 권장되는 모재 수평판과의 표준 작업 각도는?","choices":[],"answerIndex":null,"answerText":"35° ~ 45° (또는 35도 ~ 45도)","explain":"2층 두 번째 아래쪽 비드는 바닥판 경계를 보강하기 위해 각도를 35°~45°로 눕혀 적층합니다."},{"n":50,"type":"short","stem":"필릿용접 용어인 '등각장'과 '부등각장'을 구분하는 명확한 기준은 무엇인가?","choices":[],"answerIndex":null,"answerText":"상각장과 하각장의 길이 일치 여부 (또는 두 다리 길이의 같고 다름)","explain":"두 다리 길이(각장)의 치수가 일치하면 등각장, 차이가 나면 부등각장으로 용어를 식별합니다."}]},"10":{"unit":10,"title":"CO₂용접 재료 준비","code":"LM1601050203","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1부: NCS 10편 - CO₂용접 재료 준비 핵심 이론 요약"},{"t":"h3","v":"1.1 용접 모재의 보관 및 표면 청결 관리 수칙"},{"t":"p","v":"건전한 용접 이음을 얻기 위해 모재의 전처리는 필수적인 절차입니다. 모재의 적치 및 보관, 그리고 이물질 제거는 기공 및 고온/지연 균열 등의 치명적인 결함을 방지하는 제1관문입니다."},{"t":"li","v":"철판 적치 및 보관 원칙: 철판과 철판 사이에는 반드시 받침판(기반목)을 사용하여 틈새를 두고 통풍이 되도록 해야 합니다. 물기나 과도한 습기는 수분 흡착으로 인한 용접 기공의 원인이 되므로 습기가 없는 서늘한 장소에 보관하며, 선입선출 방식을 적용해 자재 노화(녹 발생)를 차단합니다."},{"t":"li","v":"표면 산화막 및 이물질 제어: 모재 표면에 형성된 산화막(밀스케일), 녹, 페인트, 수분, 기름 등은 용접 아크 열에 의해 수소나 산소 가스를 유입시켜 기공, 슬래그 혼입, 융합 불량(Lack of Fusion)을 초래합니다. 평평 줄, 핸드 그라인더, 와이어 브러시 등을 사용해 용접부 주위 최소 10~20mm 영역까지 광택이 날 정도로 표면 피막을 완벽히 제거한 후 시공해야 합니다."},{"t":"h3","v":"1.2 모재 개선(Groove) 홈 정밀 가공 기법"},{"t":"p","v":"CO₂ 가스아크용접은 피복아크용접에 비해 전류 밀도가 높고 용입이 깊으므로, 더욱 정확하고 균일한 홈 가공 정도가 요구됩니다. 치수의 편차는 용락, 용입 부족, 비드 비대칭 등 결함을 유발합니다."},{"t":"li","v":"밀링머신 기계 가공: 수직 밀링머신과 평평 바이스(혹은 특수 조가 장착된 전용 밀링 바이스)에 모재를 고정하여 가공합니다. 가공 시 칩 비산에 대비해 보안경과 안전모를 필히 착용하며, 상하 이송 핸들을 사용해 한 번에 과도하게 연삭하지 않고 0.5~1.0mm씩 미세 이송하며 정밀하게 홈을 깎아냅니다."},{"t":"li","v":"표준 가공 치수 표준 (V형 맞대기이음): WPS 기준에 맞추어 홈 가공(베벨각 30°~35°, 총 개선각 60°~70°)을 수행하며, 루트 면(Root Face) 두께는 균일하게 1.5~2.5mm 범위로 정밀 다듬질합니다. 단차가 있거나 루트 면 두께가 불균일하면 이면 비드(Back bead) 돌출이 불균일해지거나 용락(Burn through)이 발생하기 쉽습니다."},{"t":"h3","v":"1.3 CO₂ 용접 야금학 및 고유의 탈산 메커니즘"},{"t":"p","v":"CO₂ 가스는 아크의 고열 조건 하에서 해리 반응을 일으켜 강한 산화성 분위기를 조성하게 됩니다. 이러한 물리화학적 특성 때문에 용접 와이어에는 야금학적 대책이 반드시 반영되어야 합니다."},{"t":"p","v":"2CO₂ ⇄ 2CO + O₂ (고온 아크 조건에서의 가스 해리 반응)"},{"t":"p","v":"Fe + O ⇄ FeO (철의 산화 반응)"},{"t":"p","v":"FeO + C ⇄ Fe + CO ↑ (일산화탄소 가스 기포 유발 및 다공성 결함 생성)"},{"t":"p","v":"아크 열에 의해 해리된 산소 원자가 용융 철과 반응해 산화철(FeO)을 형성하고, 이것이 강재 속 탄소(C)와 화합하여 일산화탄소(CO) 가스를 방출합니다. 이 반응이 응고 시점에 급격히 전개되면서 외부로 배출되지 못한 CO 가스가 용착 금속 내에 갇혀 기공(Porosity) 및 피트(Pit) 결함을 형성합니다."},{"t":"p","v":"★ 실기 구술 대비 초특급 핵심 - 망가니즈(Mn) 및 규소(Si)의 화학적 탈산 반응:"},{"t":"p","v":"이를 차단하기 위해 CO₂용접용 전극 와이어에는 대량의 탈산계 합금 원소인 망가니즈(Mn)와 규소(Si)를 첨가합니다. 이 원소들은 철(Fe)보다 산소와의 친화력이 매우 강력하여 아래와 같은 우선 탈산 결합을 유발합니다."},{"t":"p","v":"FeO + Mn ⇄ MnO + Fe (산화 망가니즈 슬래그 부상 형성)"},{"t":"p","v":"2FeO + Si ⇄ SiO₂ + 2Fe (이산화규소 미세 슬래그 분리 부상)"},{"t":"p","v":"이 반응에 의해 가스 상태의 CO 대신 고체 산화물 형태의 슬래그(MnO, SiO₂)가 용융지 표면 위로 가볍게 떠올라 분리 배출되므로 용융 금속 내부의 기공 생성을 완벽하게 억제할 수 있습니다."},{"t":"h3","v":"1.4 용접 와이어의 종류 및 KS/AWS 표준 표기 규격"},{"t":"p","v":"CO₂ 가스아크용접용 소모 전극 와이어는 단면 전체가 균일한 재질로 구성되고 표면에 방청용 구리 도금 처리가 된 '솔리드 와이어(Solid Wire)'와, 튜브 관상 금속 내부를 특수 기능의 분말 플럭스로 채워 넣은 '플럭스 코어드 와이어(Flux Cored Wire)'로 양대 분류됩니다."},{"t":"table","rows":[["와이어 종류","보호가스 종류","주요 적용 강종","실무 특성 및 용도"],["YGW 11","CO₂ (100%)","연강 / 490N/㎟급 고장력강","대전류 전용 용접, 깊은 용입 및 두꺼운 후판 구조물 적합"],["YGW 12","CO₂ (100%)","연강 / 490N/㎟급 고장력강","중·소전류 및 단락 이행(220A 이하) 용접, 전자세 용접 적합"],["YGW 15","80% Ar + 20% CO₂","연강 / 490N/㎟급 고장력강","혼합가스 전용 대전류형, 극소 스패터 및 매우 수려한 비드 구현"],["YGW 21","CO₂ (100%)","연강 / 590N/㎟급 고장력강","60kg급 초고장력강 구조물, 차량, 압력용기용 정밀 맞대기용"]]},{"t":"p","v":"★ 솔리드 와이어 표기법 해독 (KS D 7106 기준):"},{"t":"li","v":"예시 기호: Y G W 1 3"},{"t":"li","v":"Y: 용접용 와이어(Wire)"},{"t":"li","v":"GW: 가스 실드 마그(MAG/CO₂) 용접 방법 규정"},{"t":"li","v":"13: 보호가스의 종류, 주요 적용 강재 성분 및 합금 성분 분류 코드"},{"t":"p","v":"★ 전극 와이어의 보관 수칙:"},{"t":"p","v":"1) 솔리드 와이어는 플라스틱 스풀(Spool) 구조로 제작되어 고온의 건조로에 넣을 경우 변형·용융되므로 절대 재건조할 수 없습니다. 따라서 개봉 후 방치 시 녹이 발생하므로 미사용 시 비닐 백 밀봉 보관해야 합니다."},{"t":"p","v":"2) 플럭스 코어드 와이어는 흡습 시 분말 플럭스의 수소 유입으로 기공 결함이 발생하므로 재건조가 가능합니다. 철제/코일 제품은 150℃에서 최소 5시간 이상, 플라스틱 스풀 제품은 변형 방지를 위해 50℃에서 최소 48시간 이상 충분히 저온 재건조를 가해야 합니다."},{"t":"h3","v":"1.5 보호가스 공급 설비의 구성 및 가스 제어 수칙"},{"t":"p","v":"CO₂ 가스는 액체 탄산으로 초고압 상태(기화 시 약 12,700~17,800ℓ 배출) 보관되므로 시스템 제어 밸브와 전기 히터, 감압 조정기의 취급 안전 요건을 필히 준수해야 합니다."},{"t":"li","v":"감압 조정기 및 가열용 히터(Heater): 고압 탄산가스가 조정기를 거쳐 상온으로 분출되면서 가스가 급격히 팽창하여 단열팽창(줄-톰슨 효과)을 일으킵니다. 이로 인해 주변 열을 빼앗아 밸브 온도가 영하 이하로 급강하하고, 기화 가스에 미세 부유하던 수분이 동결되어 드라이아이스를 형성하며 유로를 폐쇄시킵니다. 이를 방지하기 위해 압력 조정기 뒤편에 전기 가열용 히터(AC220V/190W 등)를 결선하며, 전원을 먼저 공급해 예열을 마친 후 용기 메인 밸브를 개방하는 정석 조작 절차를 준수합니다."},{"t":"li","v":"안전한 용기 개방 수칙: 용기 메인 밸브를 열기 전에 반드시 조정기 전면의 압력 조절용 핸들을 시계 반대 방향으로 완전히 돌려 풀어놓아야 합니다. 조절 핸들이 눌려 가압된 상태에서 고압 밸브를 급격히 열면 고압의 가스가 다량 분출되어 조정기 내부 부속 및 고압 압력계 폭발을 유발해 극히 위험합니다. 메인 밸브를 개방할 때에는 압력계의 정면을 비껴서 서서히 수동 개방하는 것이 안전 규격입니다."},{"t":"li","v":"유량 제어 및 방풍막 조치: 일반적인 적정 유량은 용접 전류에 비례하여 조정합니다. 200A 이하 소전류 대역에서는 10~15 ℓ/min, 200A 초과 대전류 대역에서는 20~25 ℓ/min 유량을 준수합니다. 보호가스는 풍속에 민감하여 풍속이 2.0 m/sec 이상이 되면 보호가스 기류가 날아가 기공 및 산화 결함을 유발하므로 반드시 바람막이(방풍막)를 가동해야 합니다."},{"t":"h2","v":"제2부: CO₂용접 재료 준비 대표 실전 평가 50제"},{"t":"p","v":"과정평가형 외부평가 지필 시험과 동일한 형태의 검정 문항입니다. 앞서 마스터한 공학 이론과 수치를 기반으로 정답을 골라보십시오."},{"t":"p","v":"[객관식 4지택일형: 1번 ~ 35번 / 단답식 주관식: 36번 ~ 50번]"}],"questions":[{"n":1,"type":"mcq","stem":"용접 모재를 보관 및 청결하게 유지하는 표준 작업 수칙으로 가장 타당하지 않은 것은 무엇입니까?","choices":["피용접재 표면에 녹이나 이물질이 있어도 아크 열의 고온에 소멸되므로 가용접 시에는 전처리를 생략한다.","모재 표면에 산화막(밀스케일)이 짙게 분포되어 있는 경우 용접 전 그라인딩 가공을 적용해 피막을 제거한다.","자재가 습기에 노출되면 수소 유입으로 인한 결함 원인이 되므로, 사용 순서는 반드시 선입선출 방식을 원칙으로 한다.","용접 철판 보관 시 부식 방지를 위해 받침판을 대어 지면 및 철판 간 틈새 통풍이 원활하도록 보관한다."],"answerIndex":1,"answerText":"① 피용접재 표면에 녹이나 이물질이 있어도 아크 열의 고온에 소멸되므로 가용접 시에는 전처리를 생략한다.","explain":"모재 표면의 녹, 수분, 기름, 산화막(밀스케일) 등을 완벽히 세정하지 않고 가용접 및 본용접을 강행할 경우, 아크 열에 의해 해리된 이물질 원소들이 수소 유입 및 산화철 형성을 야기해 융합 불량, 기공, 저온 지연균열 등의 결함을 발생시킵니다. 따라서 세정이 필수적입니다."},{"n":2,"type":"mcq","stem":"모재의 전처리 공정 중 산화막, 페인트, 기름 및 녹을 완전하게 제거해야 하는 궁극적인 용접 공학적 이유로 가장 옳은 것은 무엇입니까?","choices":["용입 깊이가 과도하게 비대해지는 것을 예방하기 위해서이다.","융합 불량, 균열, 기공 등의 기계적 결함 발생을 사전에 소멸시키기 위해서이다.","용접 와이어의 송급 속도를 더욱 증대시키기 위해서이다.","자동전격방지기의 작동 감도를 향상시켜 감전 위험을 예방하기 위해서이다."],"answerIndex":2,"answerText":"② 융합 불량, 균열, 기공 등의 기계적 결함 발생을 사전에 소멸시키기 위해서이다.","explain":"모재 표면 청결 관리의 궁극적인 공학적 가치는 용융지에 가스 결함 유입과 이물질로 인한 융합 방해 요소를 근원적으로 배제해, 용접 접합부의 기계적 무결성(기공, 균열 방지)을 확보하는 데 있습니다."},{"n":3,"type":"mcq","stem":"다음 중 수직 밀링머신과 특수 제작한 바이스를 활용하여 용접 모재 시험편의 베벨(V형) 홈 가공 작업을 수행하는 방법으로 틀린 것은 무엇입니까?","choices":["자재 가공 시 칩이 가혹하게 비산할 수 있으므로 필히 안전모와 보안경을 착용한다.","모재 고정 시 가공 중 가해지는 이송 토크에 튕겨 나가지 않도록 견고하게 바이스에 안착 고정한다.","생산성을 극대화하기 위해 한 번에 과도하게 연삭하도록 상하 이송 노브를 3mm 이상 깊게 가공한다.","가공이 완료된 후에는 수직 밀링머신 스위치를 차단하고, 최종 배전반 주전원 스위치도 이원적으로 OFF 조작한다."],"answerIndex":3,"answerText":"③ 생산성을 극대화하기 위해 한 번에 과도하게 연삭하도록 상하 이송 노브를 3mm 이상 깊게 가공한다.","explain":"수직 밀링머신 홈 가공 시 한 번에 과도하게 많은 연삭을 실행하면 밀링 팁의 마모와 가공 토크 증가로 시험편 변형 및 파손, 가공면 불량 등의 안전사고를 일으킵니다. 따라서 0.5~1.0mm 수준으로 조금씩 정밀 이송 가공해야 합니다."},{"n":4,"type":"mcq","stem":"탄소강의 V형 맞대기이음 홈 설계 가공 시 일반적으로 과정평가형 자격 검정 및 실무에서 제시되는 베벨 각도(A)와 정밀 가공 루트 면(B)의 정석 범위 치수가 바르게 짝지어진 것은 무엇입니까?","choices":["A: 15° ~ 20°, B: 0.5 ~ 1.0mm","A: 30° ~ 35°, B: 1.5 ~ 2.5mm","A: 45° ~ 50°, B: 3.0 ~ 3.5mm","A: 60° ~ 70°, B: 4.0 ~ 5.0mm"],"answerIndex":2,"answerText":"② A: 30° ~ 35°, B: 1.5 ~ 2.5mm","explain":"탄소강 SS275 시험판 V형 맞대기이음 개선 홈 가공 가이드에 따르면, 정밀 다듬질을 포함하여 한쪽 경사각인 베벨각은 30°~35°, 루트 면 두께는 용입 제어와 백비드 돌출 안정화를 위해 1.5~2.5mm 범위로 정밀 다듬질해야 합니다."},{"n":5,"type":"mcq","stem":"CO₂ 가스아크용접의 물리화학적 특성 중, 아크 열에 의해 해리된 산소 원자가 철(Fe)과 화합해 산화철(FeO)을 형성하고, 이것이 강 중 탄소(C)와 반응하여 방출되는 기포 가스로서 다공성 결함(기공, 피트)의 직접적인 원인이 되는 화학 기체는 무엇입니까?","choices":["이산화질소 (NO₂)","황화수소 (H₂S)","일산화탄소 (CO)","이산화탄소 (CO₂)"],"answerIndex":3,"answerText":"③ 일산화탄소 (CO)","explain":"CO₂ 가스는 고온 아크 분위기 하에서 일산화탄소(CO)와 산소(O₂)로 가열 해리됩니다. 이때 발생한 산화철(FeO)이 강 중 탄소(C)와 반응해 일산화탄소(CO) 기포 가스를 급격히 형성하며, 응고 과정에서 미처 방출되지 못한 가스가 다공성 기공(Porosity)과 피트를 발생시킵니다."},{"n":6,"type":"mcq","stem":"앞서 발생한 일산화탄소 기포 결함을 예방하기 위해 CO₂용접용 와이어에 다량 배합되어 용융지에서 강력한 우선 탈산 작용을 수행하는 2대 핵심 합금 원소는 무엇입니까?","choices":["니켈(Ni)과 크로뮴(Cr)","몰리브데넘(Mo)과 바나듐(V)","규소(Si)와 망가니즈(Mn)","구리(Cu)와 알루미늄(Al)"],"answerIndex":3,"answerText":"③ 규소(Si)와 망가니즈(Mn)","explain":"CO₂ 가스의 산화 반응으로 인한 다공성 결함(CO 기포)을 방지하기 위해, 와이어에 배합된 탈산 원소인 규소(Si)와 망가니즈(Mn)가 철(Fe)보다 강력하게 산소와 결합(FeO+Mn=MnO+Fe, 2FeO+Si=SiO2+2Fe)하여 고체 슬래그 형태로 표면 부상 및 배출됩니다."},{"n":7,"type":"mcq","stem":"규소(Si) 원소가 GMAW 솔리드 와이어의 탈산 작용을 위해 배합될 때, 규소 함량이 적정 범위를 초과하여 과도하게 증대될 경우 나타나는 용착 금속의 물리적 변화는 무엇입니까?","choices":["고온 균열의 민감도가 제로 수준으로 수렴하여 결함이 완전히 차단된다.","금속 이행 형태가 단락 이행에서 입상 용적 이행으로 무조건 전환된다.","인성과 연성이 함께 향상되어 연강의 용접부 성질이 우수해진다.","용착부의 강도는 소폭 증가하지만 반대로 인성과 연성이 극도로 감소하여 취성을 띤다."],"answerIndex":4,"answerText":"④ 용착부의 강도는 소폭 증가하지만 반대로 인성과 연성이 극도로 감소하여 취성을 띤다.","explain":"GMAW 용접 와이어에 첨가된 규소(Si)는 강력한 탈산제 기능을 수행하지만, 적정량(보통 0.40~1% 수준)을 초과하여 배합되면 용착 금속의 항복 강도는 다소 향상되는 반면 취성이 급증하고 인성과 연성은 급격하게 감퇴하는 치명적인 물리적 노화를 유발합니다."},{"n":8,"type":"mcq","stem":"와이어에 배합된 합금 원소 중 망가니즈(Mn)가 함유되었을 때의 주된 공학적 기능 및 과다 첨가 시 나타나는 야금학적 불이익 요인으로 가장 적절한 것은 무엇입니까?","choices":["아크 열량을 과도하게 상승시켜 두꺼운 후판 용접을 극도로 곤란하게 만든다.","가스 실드 효과를 증대시키지만, 언더컷을 심각하게 유발한다.","탈산 작용 및 용착 강도를 증가시키나, 지나치게 과다하면 고온 균열에 민감하게 만든다.","비드의 볼록한 형상을 부드럽게 유동시키나, 수소 가스를 유입시켜 기공을 유발한다."],"answerIndex":3,"answerText":"③ 탈산 작용 및 용착 강도를 증가시키나, 지나치게 과다하면 고온 균열에 민감하게 만든다.","explain":"망가니즈(Mn)는 탈산제와 더불어 강도 증가의 목적을 지니고 있어 1~2% 정도 와이어에 첨가됩니다. 다만 과도하게 첨가되면 고온에서의 수축 거동 중 입계 응력 한계를 초과하여 고온 균열(Hot Crack) 민감도를 급격히 상승시키는 부작용이 존재합니다."},{"n":9,"type":"mcq","stem":"고장력강용(50kg급) CO₂ 용접 와이어인 'YGW 11' 규격 기호에서 각 부호 및 숫자가 상징하는 공학적 의미를 해독한 것으로 가장 올바르지 않은 것은 무엇입니까?","choices":["Y: 전극 용착 성능을 나타내는 용착봉(Yielding Core)을 상징한다.","GW: 가스 실드 아크 마그(MAG) 용접용 전극 와이어임을 의미한다.","11: 보호가스 주요 강종 및 와이어의 합금 성분 분류 코드이다.","KS 규격에 의한 표기 체계이며, 연강 및 고장력강 솔리드와이어 표준 분류에 해당한다."],"answerIndex":1,"answerText":"① Y: 전극 용착 성능을 나타내는 용착봉(Yielding Core)을 상징한다.","explain":"규격 기호에서 'Y' 부호는 용융 전극 성능을 갖추어 정속 공급되도록 원형 릴에 감긴 소모식 '용접용 와이어(Wire)' 자체를 지칭하는 KS 고유 표기 규격입니다."},{"n":10,"type":"mcq","stem":"CO₂ 용접 와이어 규격 종류 중 단락 이행(Short-circuiting Transfer) 전용으로 분류되어, 220A 이하의 저전류 조건 하에서 박판 맞대기 용접 및 수평 자세 필릿 용접에 가장 최적의 작업 성능을 보이는 대표 품종은 무엇입니까?","choices":["YGW 11","YGW 12","YGW 15","YGW 21"],"answerIndex":2,"answerText":"② YGW 12","explain":"KS D 7025에 따르면, YGW 12는 연강 및 490N/㎟급 고장력강 솔리드와이어 분류 중 중·소전류 및 단락 이행(Short-circuiting, 220A 이하) 조건 하에서 가장 안정적인 아크와 고품질 비드를 확보할 수 있어 전자세 용접에 범용 적용됩니다."},{"n":11,"type":"mcq","stem":"아르곤(80%)과 탄산가스(20%)의 혼합 보호가스 분위기 하에서 대전류 용접에 주로 가동되는 대표적인 전용 와이어 종류로 바르게 짝지어진 것은 무엇입니까?","choices":["YGW 21 및 YGW 22","YGW 18 및 YGW 14","YGW 11 및 YGW 12","YGW 15 및 YGW 17"],"answerIndex":4,"answerText":"④ YGW 15 및 YGW 17","explain":"Ar(80%) + CO₂ (20%) 혼합 보호가스를 사용하는 분위기 하에서 대전류 및 중·소전류 스프레이 용적 이행을 원활히 지원하는 MAG 용접 전용 와이어의 분류 기호 명칭은 YGW 15, YGW 17 등입니다."},{"n":12,"type":"mcq","stem":"전극 와이어의 표면 방청 및 원활한 통전성을 유지하기 위해 솔리드 와이어 표면에 정밀 도금 처리되어 수록되는 화학 금속 원소는 무엇입니까?","choices":["크로뮴 (Cr)","알루미늄 (Al)","아연 (Zn)","구리 (Cu)"],"answerIndex":4,"answerText":"④ 구리 (Cu)","explain":"GMAW 솔리드 와이어는 플라스틱 스풀에 와인딩되어 가동되므로, 표면 방청(녹 방지) 및 콘택트 팁과의 전기 접촉 통전 저항을 최소화하기 위해 외경 표면에 '구리(Cu)'를 미세하고 정밀하게 도금 처리하는 도금 공정을 갖추고 있습니다."},{"n":13,"type":"mcq","stem":"솔리드 와이어(Solid Wire)와 플럭스 코어드 와이어(Flux Cored Wire)의 보관 및 건조 조건에 대한 설명 중 가장 잘못된 주장을 고르십시오.","choices":["솔리드 와이어는 플라스틱 스풀 구조이므로 수분을 머금었을 때 고온 건조기에 넣어 즉시 350℃ 재건조해야 한다.","플럭스 코어드 와이어는 분말 습기에 취약해 흡습 시 기공이 대량 발생하므로 사용 전 재건조가 핵심적이다.","코일이나 메이소나이트 스풀로 제작된 FCAW 와이어 제품은 150℃ 가열 환경에서 최소 5시간 이상 재건조한다.","플라스틱 스풀 타입으로 부품화된 FCAW 와이어는 변형을 방지하기 위해 50℃ 저온에서 최소 48시간 재건조한다."],"answerIndex":1,"answerText":"① 솔리드 와이어는 플라스틱 스풀 구조이므로 수분을 머금었을 때 고온 건조기에 넣어 즉시 350℃ 재건조해야 한다.","explain":"솔리드 와이어는 플라스틱 스풀(Plastic Spool) 재질로 부품 설계되어 있어, 건조 오븐이나 고온 건조로에 넣을 시 플라스틱이 변형 및 용융되어 기계를 망가뜨리고 와이어의 송급 장력을 소멸시킵니다. 따라서 솔리드 와이어는 절대 재건조할 수 없고 비닐 백 밀봉 보관해야 합니다."},{"n":14,"type":"mcq","stem":"작업자가 용접 작업을 마치고 4시간 이상 정기 휴식 또는 장기 보관을 적용할 경우, 와이어 송급 장치에 걸려 있던 플럭스 코어드 와이어의 습기 흡습을 차단하기 위한 현장 조치 사항으로 옳지 않은 것은 무엇입니까?","choices":["송급 장치에서 와이어 스풀을 완벽하게 분리한 후 초기 비닐 백에 건조제를 동봉 밀봉 보관한다.","탈착한 와이어 스풀을 온도 30±10℃, 습도 최대 60% 조건의 가동형 건조 오븐에 적재 보관한다.","비가 오거나 상대 습도가 매우 높은 날씨 조건에서는 작업 중단 시간이 1시간만 경과해도 흡습 방지 조치를 개시해야 한다.","와이어는 상온 노출 시 절대 흡습되지 않으므로 토치 라이너에 연결된 채로 개방 방치해 두어도 무방하다."],"answerIndex":4,"answerText":"④ 와이어는 상온 노출 시 절대 흡습되지 않으므로 토치 라이너에 연결된 채로 개방 방치해 두어도 무방하다.","explain":"현장 실무 수칙에 의하면, FCAW 와이어는 상온 노출 시 공기 중 수분을 빠르게 흡수하여 수소 기포 결함을 유발하므로 4시간 이상 정기 휴식 또는 중단 시 반드시 송급 장치에서 분리하여 전용 건조 오븐에 적재하거나 비닐 백 밀봉 처리를 이행해야 합니다."},{"n":15,"type":"mcq","stem":"다음 가스 금속 아크 용접(GMAW) 시 사용되는 보호가스 중 알루미늄 및 동합금 용접에서 기공을 최소화하고 보다 강력한 고입열 효과를 구현하기 위해 주로 아르곤에 첨가하여 배합하는 가스로 가장 적합한 것은 무엇입니까?","choices":["헬륨 가스 (He)","이산화탄소 가스 (CO₂)","질소 가스 (N₂)","수소 가스 (H₂)"],"answerIndex":1,"answerText":"① 헬륨 가스 (He)","explain":"아르곤(Ar)은 무색, 무취의 불활성 가스로 아크가 매우 안정적이나 후판 용접 시 열 전달이 느려 기공이 다량 발생할 우려가 있습니다. 여기에 열전달률이 아르곤보다 현저히 높은 '헬륨(He)' 가스를 배합하면 깊은 용입과 아크 에너지 증가 효과를 동시에 보장할 수 있습니다."},{"n":16,"type":"mcq","stem":"다음 중 이산화탄소(CO₂) 보호가스가 인체에 미치는 농도별 위험 거동 중, 장시간 노출 및 공기 하부 적체로 인해 급격히 사망(의식 불명 후 치사량)에 이르게 되는 치명적인 인체 안전 한계 농도는 몇 % 이상입니까?","choices":["1% ~ 2% 이상","3% ~ 4% 이상","5% ~ 6% 이상","10% ~ 15% 이상"],"answerIndex":4,"answerText":"④ 10% ~ 15% 이상","explain":"이산화탄소(CO₂) 가스는 누출되어 대기 중 농도가 10% 이상 도달할 시 급격한 호흡 곤란 및 의식불명으로 사망에 이르는 혹독한 독성 중독 증상을 보입니다. 15% 이상은 매우 위험한 상태이며 30% 이상은 완전한 치사 농도입니다."},{"n":17,"type":"mcq","stem":"액화 이산화탄소 가스 용기의 임계 온도는 약 31℃이며 직사광선 등에 오랜 시간 노출 시 폭발 위험이 가혹합니다. 이에 따라 산업안전 수칙에서 규정한 고압가스 충전 용기의 적정 보존 온도 상한 기준은 몇 ℃ 이하입니까?","choices":["30℃ 이하","40℃ 이하","50℃ 이하","60℃ 이하"],"answerIndex":2,"answerText":"② 40℃ 이하","explain":"액화 탄산가스의 임계 온도는 31℃이며 직사광선 등에 오랜 시간 노출 시 봄베(Cylinder) 내부가 완전히 액체 가스로 꽉 차올라 압력계 폭발을 유발하므로, 고압가스 안전 규정상 가스 용기는 상시 '40℃ 이하'의 서늘하고 통풍이 잘되는 그늘에 고정 기립 보관해야 합니다."},{"n":18,"type":"mcq","stem":"이산화탄소 고압 가스를 연속 송급하면서 다량의 가스가 용기로부터 매우 빠른 유속으로 분출될 때, 배관 내 가스의 급격한 체적 팽창으로 인해 동결(드라이아이스 형성)되어 유로가 폐쇄되는 공학적 원인(현상)을 완벽히 방지하기 위해 장착되는 설비 부속품은 무엇입니까?","choices":["고강도 가스 디퓨저","체결용 퀵 플러그 수량 커버","감압 조정기용 전기 히터 (Heater)","콘택트 팁 전용 스패터 클리너"],"answerIndex":3,"answerText":"③ 감압 조정기용 전기 히터 (Heater)","explain":"고압 탄산가스가 빠른 속도로 기화하며 단열 팽창할 때, 주위의 잠열을 급격히 흡수하는 줄-톰슨 효과로 인해 조정기 내부 온도가 급랭되어 얼음 및 고체 탄산(드라이아이스)이 형성되며 유로를 폐쇄시킵니다. 이를 방지하는 장치가 '전기 히터(Heater)'입니다."},{"n":19,"type":"mcq","stem":"CO₂ 용접기의 전기식 히터(Heater)를 안전하게 시공 기동하기 위한 정석 수동 조작 순서로 가장 타당한 것은 무엇입니까?","choices":["히터 전원을 먼저 콘센트에 체결해 완벽하게 예열시킨 다음, 용기 밸브를 점진적으로 서서히 개방한다.","히터는 가스 유량의 흐름에 의해 자동 자가 발전하므로 별도의 전원 입력 회로 구성이 불필요하다.","가접 시에는 히터를 끄고 본용접 개시 후 10분이 지난 시점에 히터 전원을 온(ON) 조작한다.","고압 용기 밸브를 최대로 개방한 즉시 가열 히터 콘센트를 접속해 가동한다."],"answerIndex":1,"answerText":"① 히터 전원을 먼저 콘센트에 체결해 완벽하게 예열시킨 다음, 용기 밸브를 점진적으로 서서히 개방한다.","explain":"히터의 결선 가동 시에는 히터 전원 콘센트(AC220V)를 먼저 입력 체결하여 가스 조정기 장치를 충분히 따뜻하게 예열(약 3~5분 전후)해 둔 다음, 용기 봄베 메인 밸브를 개방해야 동결 현상을 완벽히 차단하고 압력계를 안전하게 조작할 수 있습니다."},{"n":20,"type":"mcq","stem":"다음 중 산업안전보건법 및 고압가스 안전관리법에 의거하여 규정된 공장에서 사용되는 가스 용기별 표준 식별 도색이 올바르게 짝지어진 것은 무엇입니까?","choices":["산소 - 녹색, 이산화탄소 - 청색, 아르곤 - 회색","산소 - 청색, 이산화탄소 - 회색, 아르곤 - 녹색","산소 - 회색, 이산화탄소 - 황색, 아르곤 - 청색","산소 - 녹색, 이산화탄소 - 주황색, 아르곤 - 갈색"],"answerIndex":1,"answerText":"① 산소 - 녹색, 이산화탄소 - 청색, 아르곤 - 회색","explain":"고압가스 안전관리법 및 KS 가스안전 기준에 의거하여 규정된 공용 고압 가스 용기의 식별 표준 색상은 산소: 녹색, 이산화탄소: 청색, 아르곤: 회색 용기 도색을 상시 도포 유지해야 합니다."},{"n":21,"type":"mcq","stem":"이산화탄소 가스 조정기(압력 제어 밸브) 장치를 설치 조립하고 현장 실무에 적용할 때 절대로 접촉이나 묻는 행위를 금지하는 화학 유질성 물질은 무엇입니까?","choices":["방청 그리스, 석유, 페인트 등의 유질성 탄화수소 물질","석필 및 마킹용 백색 가루 수분 성분","비눗물 등의 기포 검사용 전용 세제 계면활성제","용접 모재 청소용 디스크 그라인더 휠 연마제"],"answerIndex":1,"answerText":"① 방청 그리스, 석유, 페인트 등의 유질성 탄화수소 물질","explain":"가압 조정기 조립 접속부 등에 그리스, 석유, 페인트 등의 탄화수소 유질성 윤활 물질이 묻게 되면, 산소 등 고압 가스 유입 시 화학적 연쇄 결합 반응으로 폭발 참사를 초래하므로 절대로 윤활 목적으로 오일을 발라서는 안 됩니다."},{"n":22,"type":"mcq","stem":"다음 중 CO₂ 가스아크용접 작업 조건 하에서 전류 밀도가 높고 홈 각이 좁은 V형 용접부에 적용 시, 이산화탄소 100% 단독 보호가스 하에서 가장 지배적으로 발현되는 전형적인 야금학적 '금속 이행(Metal Transfer)'의 형태는 무엇입니까?","choices":["스프레이 이행 (Spray Transfer)","입상 용적 이행 (Globular Transfer)","펄스 스프레이 이행 (Pulsed Spray Transfer)","고주파 교류 정전류 이행 (AC Transfer)"],"answerIndex":2,"answerText":"② 입상 용적 이행 (Globular Transfer)","explain":"이산화탄소(100% CO₂) 보호가스 분위기 하에서 대전류 및 중전류 영역 조건으로 GMAW 솔리드 와이어 용접을 수행할 시, 가스 고유의 해리 물리 특성으로 인해 아크 기둥 하단에서 굵은 입상 금속 물방울 형태로 용융되어 이행하는 '입상 용적 이행(Globular Transfer)'이 지배적으로 발현됩니다."},{"n":23,"type":"mcq","stem":"용접에 적합한 가스 실드 효과를 온전히 보장하기 위해 규정된 이산화탄소 가스의 일반적인 유량 기준으로 가장 타당한 것은 무엇입니까?","choices":["전류와 판 두께 범위에 관계없이 항상 5 ℓ/min 이하로만 유량을 단일 통제한다.","소전류(200A 이하) 10~15 ℓ/min, 대전류(200A 초과) 15~25 ℓ/min로 한다.","고품질 용착을 확보하기 위해 전류 세기와 무관하게 100 ℓ/min 이상 분출시킨다.","압력 조절 노브를 시계 방향으로 끝까지 가압 체결했을 때 나오는 유량으로 정한다."],"answerIndex":2,"answerText":"② 소전류(200A 이하) 10~15 ℓ/min, 대전류(200A 초과) 15~25 ℓ/min로 한다.","explain":"CO₂ 가스아크용접 시 가스 실드 효과를 온전히 보장하기 위해 규정된 표준 가스 사용 유량은 용접기의 용량 및 전류 조건에 따라 200A 이하 소전류 대역에서는 10~15 ℓ/min, 200A 초과 대전류 대역에서는 15~25 ℓ/min로 유량을 미세 조정하는 것이 기본 정석입니다."},{"n":24,"type":"mcq","stem":"보호가스가 날아가 아크가 불안정해지고 용융 금속의 산화·질화를 초래해 기공 결함을 형성하는 외부 환경 변수인 풍속(바람)의 표준 한계치와 그에 따른 실무 방지 대책으로 가장 옳은 규격은 무엇입니까?","choices":["강풍 시에는 가스 조정기의 예열 히터 연결을 분리해 기화 효율을 인위적으로 급감시킨다.","풍속 0.5m/sec 이상 시 무조건 공랭식 송풍기를 추가 가동해 보호가스를 순환시킨다.","풍속 2.0m/sec 이상 조건에서는 보호가스 비산을 막기 위해 반드시 바람막이(방풍막)를 설치한다.","바람이 심한 옥외 용접부에는 아크 전압을 40V 이상 과도하게 올려 스패터로 방막을 형성한다."],"answerIndex":3,"answerText":"③ 풍속 2.0m/sec 이상 조건에서는 보호가스 비산을 막기 위해 반드시 바람막이(방풍막)를 설치한다.","explain":"보호가스 흐름은 대기 바람에 매우 취약하며 풍속이 2.0m/sec 이상 도달할 시 유동 기류가 온전히 날아가 차폐 불량을 야기해 다공성 결함이 발생합니다. 이에 따라 풍속 2m/s 이상 시에는 현장 주위에 바람막이(방풍막)를 설치하여 용융 영역을 온전히 보호해야 합니다."},{"n":25,"type":"mcq","stem":"와이어 송급 장치(Wire Feeder) 내부에서 와이어 스풀에서 뽑아낸 와이어를 토치 케이블 선단까지 일정한 정속도로 밀어주는 데 가장 널리 사용되는 반자동 용접기 고유의 기본 송급 메커니즘 방식은 무엇입니까?","choices":["풀 (Pull) 방식","푸시 (Push) 방식","푸시-풀 (Push-Pull) 방식","더블-풀 (Double-Pull) 방식"],"answerIndex":2,"answerText":"② 푸시 (Push) 방식","explain":"푸시(Push) 방식은 와이어 스풀 및 릴 바로 뒤에 와이어 구동 송급 장치(Feed Roller)를 부착하여 토치 케이블 튜브 관을 통해 밀어주는 형태로, 토치가 매우 가볍고 직관적이어 일반적인 반자동 용접기 100%에 적용되는 기본 송급 방식입니다."},{"n":26,"type":"mcq","stem":"마찰 저항이 가혹하고 직경이 가늘어 꺾임 우려가 매우 큰 알루미늄(Al) 및 동합금 등의 연질 와이어를 정속 송급할 때 주로 채택되며, 송급 모터가 용접 토치부에 직접 위치해 와이어를 끌어당겨 송급하는 방식은 무엇입니까?","choices":["더블 푸시 방식","푸시-풀 방식","푸시 방식","풀 방식"],"answerIndex":4,"answerText":"④ 풀 방식","explain":"송급 장치(피더 모터)를 토치 손잡이부와 일체화하여 작동하는 풀(Pull) 방식은, 송급 시 발생하는 케이블 라이너 내부 마찰 거동 저항을 제로에 가깝게 낮출 수 있어 꺾임과 눌림 변형에 매우 민감하고 연한 재질의 세경 알루미늄(Al) 와이어 송급에 단독 가동됩니다."},{"n":27,"type":"mcq","stem":"연질 와이어의 단면 형상 찌그러짐과 스풀 풀림 오차를 완전히 방지하기 위해 채택되는 송급 롤러의 최적 구성 형태(조수) 및 그루브 형태의 매칭으로 가장 바람직한 조합은 무엇입니까?","choices":["동선 및 철선 절단 전용의 특수 절곡 칼날형 롤러 조합","1조 2롤러 - 널링(Knurled) 기요 롤러 조합","2조 4롤러 - 연한 단면 보호를 위한 완만한 U홈 롤러 조합","3조 6롤러 - 가혹한 구속을 가하는 날카로운 V홈 롤러 조합"],"answerIndex":3,"answerText":"③ 2조 4롤러 - 연한 단면 보호를 위한 완만한 U홈 롤러 조합","explain":"연질의 알루미늄 등은 롤러 압력이 과도하게 한 지점에 집중되면 와이어 외경의 찌그러짐 변형 및 표면 손상이 극심하게 발생합니다. 이를 분산 제어하기 위해 2조(4롤러) 송급 장치를 사용하며 가압면을 온화하게 잡아주는 라운드 형상의 U자 그루브 롤러를 가동해야 합니다."},{"n":28,"type":"mcq","stem":"다음 중 '와이어 돌출 길이(Stick Out)'의 공학적 정의를 명확하게 규명한 것은 무엇입니까?","choices":["토치 가스 노즐 선단에서 모재 표면까지의 이격 거리","콘택트 팁(Contact Tip) 전면 선단에서 전극 와이어 선단부까지의 돌출된 와이어 길이","용접 와이어 스풀 외경에서 송급 가압 롤러 중심점까지의 최단 이송 궤적","용착 금속 이면 백비드의 표면 덧살 두께의 최댓값 범위"],"answerIndex":2,"answerText":"② 콘택트 팁(Contact Tip) 전면 선단에서 전극 와이어 선단부까지의 돌출된 와이어 길이","explain":"와이어 돌출 길이(Stick Out)란 용접 중 전류 통전의 직접적 접점 기능을 수행하는 구리 합금재 콘택트 팁(Contact Tip) 전면 끝단에서부터 아크가 발생하기 직전의 용융 전극 와이어 끝단부까지 외부로 노출되어 나와 있는 와이어의 실측 굵기 및 길이 범위를 뜻합니다."},{"n":29,"type":"mcq","stem":"와이어 돌출 길이가 기준 규격보다 지나치게 과도하게 길어질 때 용접부와 전류 거동에 미치는 영향으로 타당한 것은 무엇입니까?","choices":["저항열 증가로 용융 속도는 커지나 전류와 용입이 줄고 아크가 불안정해진다.","용접 전류가 급속히 폭증하여 용입이 깊어지고 모재를 뚫는 용락이 발생한다.","노즐 내부에 스패터 적체 부착이 심화되어 보호가스 흐름이 크게 왜곡된다.","아크 전압이 수하특성 곡선을 따라 즉시 제로 전압의 무부하로 강압된다."],"answerIndex":1,"answerText":"① 저항열 증가로 용융 속도는 커지나 전류와 용입이 줄고 아크가 불안정해진다.","explain":"와이어 돌출 길이가 지나치게 길어지면 팁과 모재 간 저항열 증가로 와이어 용융속도는 비약적으로 증가하지만, 아크 길이가 흔들리고 용접 전류 및 용입 깊이가 현저히 저하되어 용입 부족 및 언더컷 등의 치명적인 기계적 결함을 유발합니다."},{"n":30,"type":"mcq","stem":"반대로 와이어 돌출 길이를 너무 과도하게 좁혀서(짧게) 유지하며 용접 작업을 이행할 경우 발생하는 현상으로 거리가 먼 것은 무엇입니까?","choices":["와이어 자체의 전기 저항 열량이 급격히 저하된다.","용접 전류와 용융 용입이 과도하게 상승된다.","콘택트 팁과 노즐 내경부에 스패터 부착 빈도가 가혹하게 폭증한다.","가스 차폐 효과가 현저하게 날아가 기공 발생 민감도가 즉시 소멸된다."],"answerIndex":4,"answerText":"④ 가스 차폐 효과가 현저하게 날아가 기공 발생 민감도가 즉시 소멸된다.","explain":"와이어 돌출 길이를 기준 미만으로 극도로 좁혀 시공할 시에는 전기저항열 저하로 전류값과 용입이 비정상적으로 과도하게 폭증하며, 아크와 용융지가 노즐과 팁 내부로 가혹하게 인접하여 콘택트 팁 내벽 구멍에 스패터가 다량 고착 부착되는 고장 원인을 야기합니다."},{"n":31,"type":"mcq","stem":"다음 물질안전보건자료(MSDS)에 지시된 용접 유해 흄 및 가스 차폐 작업 환경 수칙 중 밀폐공간에서의 산소 적정 농도 하한 기준 수치로 가장 옳은 것은 무엇입니까?","choices":["12% 이상","15% 이상","18% 이상","21% 이상"],"answerIndex":3,"answerText":"③ 18% 이상","explain":"산업안전보건기준에 규정된 밀폐 공간(용기 내부, 질식 위험실)에서의 안전 작업 대원칙 기준에 따르면 산소 적정 농도는 최소 '18% 이상'이 유지된 상태를 계측 확보한 후 가동을 개시해야 감전 및 저산소 질식 재해를 완벽히 통제할 수 있습니다."},{"n":32,"type":"mcq","stem":"CO₂가스아크용접 장비 운용 전, 가스 공급 계통의 정밀 '누설 검사(Leak Test)'를 행할 때 가동하는 가장 실용적이고 간편하며 신뢰성 높은 정석 시험법은 무엇입니까?","choices":["가변 저항 감지기를 연결한 고압 전류 절연성 전압 시험","라이터 불꽃을 연결 노즐 나사산 틈새에 직접 대어보는 연소 반응 시험","용기 밸브, 조정기, 가스 호스 조립 단자부에 비눗물을 직접 분무·도포하여 기포 검출 판정","아르곤가스를 강제로 대량 개방하여 귀로 들리는 유량 기류의 소리 판독 시험"],"answerIndex":3,"answerText":"③ 용기 밸브, 조정기, 가스 호스 조립 단자부에 비눗물을 직접 분무·도포하여 기포 검출 판정","explain":"가스 공급 배관의 고압 가스 누설 여부를 정밀 확인하고 용접 안전을 공고히 하기 위해 수행하는 가장 대중적인 '누설 검사'법은, 봄베 밸브 및 가스 호스 이음 단자부에 '계면활성 비눗물'을 도포 분무하여 미세하게 기포가 형성되는지 여부를 육안 판정하는 기포 탐상 시험입니다."},{"n":33,"type":"mcq","stem":"다음 중 CO₂가스 용기 내 기화 탄산이 떨어져 안전하고 완전한 고압 용기 '교체 작업'을 이행하는 요령으로 가장 올바르지 않은 것은 무엇입니까?","choices":["봄베(Cylinder) 메인 밸브를 완전 시계 방향 차단 조작하여 가스를 가둔다.","새 가스 용기로 교체하기 전에 반드시 체결용 너트 나사산 내부의 이물질과 먼지를 완벽하게 불어내 청소한다.","고압 용기는 넘어짐 사고의 위험성이 가혹하므로, 개별 봄베 거치대 또는 체인 결속 장치를 사용해 견고하게 기립 고정한다.","너트 나사산 체결 시 완전 밀착 조임을 생략하고 비눗물 검사 기포 발생 시 수동 손조임으로 대체한다."],"answerIndex":4,"answerText":"④ 너트 나사산 체결 시 완전 밀착 조임을 생략하고 비눗물 검사 기포 발생 시 수동 손조임으로 대체한다.","explain":"봄베(Cylinder)를 새로운 고압 충전 가스병으로 교체할 때에는 멍키스패너 등을 사용해 밸브를 서서히 조이며 결합하되, 가스 누설 비눗물 검사 시 미세한 누출 기포라도 발견되는 즉시 다시 메인 밸브를 견고하게 조이거나 테프론 밀착 부속 및 패킹을 신품 교체해야 합니다."},{"n":34,"type":"mcq","stem":"금속 내부를 충전하여 아크 안정성을 확보하는 플럭스코어드 와이어(FCAW)의 규격 분류 중, AWS A5.20에 의거하여 금홍석(Rutile)을 주성분으로 배합하고 보호가스 분위기 하에 중·후판 다층 용접에 가장 보편적으로 쓰이는 와이어 계통 기호는 무엇입니까?","choices":["T - 1","T - 3","T - 4","T - 5"],"answerIndex":1,"answerText":"① T - 1","explain":"플럭스코어드 와이어(FCAW) 중 T-1 계열은 탈산제 및 아크 안정에 유효한 금홍석(Rutile) 광물을 주요 성분으로 내장하고 있어 가스 차폐 분위기 하에서 스프레이 이행 아크 안정성이 우수하여 현장 중·후판 다층 용접에 전자세 용도로 광범위하게 쓰입니다."},{"n":35,"type":"mcq","stem":"다음 중 AWS A5.20 규격 하에서 염기성(Basic) 슬래그 플럭스 성분으로 조성되어, 극저수소 성능과 혹독한 극저온(-29℃) 파괴 시험 조건에서도 고인성 충격치(27J 이상)를 보장하도록 특화 설계된 극저수소계 와이어 표기 부호는 무엇입니까?","choices":["T - 2","T - 5","T - 6","T - 10"],"answerIndex":2,"answerText":"② T - 5","explain":"FCAW 와이어 분류 중 T-5 계열 와이어는 염기성(Basic) 슬래그 플럭스 계통으로 조성되어 수소 함유량이 극히 희박한 극저수소 성능을 보이며, 저온 충격파괴 한계가 엄격하게 설정된 해양 플랜트 및 고장력강 정밀 시공부에 인성 보장 용도로 특화되어 기동됩니다."},{"n":36,"type":"short","stem":"고압 가스 용기의 표준 보관 시 넘어짐 및 직사광선 폭발 등을 예방하기 위해 산업안전 수칙에서 지시하는 용기 보존 온도는 몇 ℃ 이하이어야 하는지 그 한계 온도 수치를 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"40℃ 이하","explain":"고압가스 안전관리법상 액화 탄산가스의 임계 온도는 31℃이며 직사광선 등에 기화 과열 시 압력계 손상 및 용기 폭발을 일으키므로 상시 그늘진 '40℃ 이하' 안전 구역에 체인 결속 기립 보존 보관해야 합니다."},{"n":37,"type":"short","stem":"이산화탄소(CO₂) 가스는 대기 중에 가스로 존재하며 누출 시 질식을 유발합니다. 이 가스가 공기보다 몇 배 무거운지 그 비중 값을 소수점 둘째 자리까지 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"1.53배","explain":"이산화탄소(CO₂) 가스의 공기 대비 물리적 비중 분자량 수치는 '1.53배'로 공기보다 현저히 무겁습니다."},{"n":38,"type":"short","stem":"밀폐 공간 내부 CO₂ 누출 및 가스 질식 시, 의식을 잃고 사망에 직접 이르게 만드는 공기 중 이산화탄소 유해 가스 한계 농도의 최솟값 수치(%)를 적으시오. 정답 입
