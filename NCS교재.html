력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"30%","explain":"CO₂ 농도 3~4%는 두통·현기증, 15% 이상은 위험 상태, 30% 이상에서 치명적(사망)이다. 10%는 사망 한계 농도가 아니다."},{"n":39,"type":"short","stem":"KS D 7106 표준 규격에 의한 와이어 분류 표기 중 `YGW 13` 기호에서 'GW' 부호가 내포하고 있는 명확한 용접 공학적 분류 명칭을 우리말로 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"마그용접용","explain":"KS D 7106은 연강·고장력강 마그(MAG)용접용 솔리드 와이어 규격이므로 YGW의 GW는 '마그용접용'을 뜻한다. 교재에 따라 GW를 '가스 실드 아크 용접용'으로 풀기도 한다."},{"n":40,"type":"short","stem":"보관 및 청결 관리 시 먼저 적치 입고된 모재 시험편 및 가공 소재를 녹 방지 및 품질 관리를 위해 먼저 출고시켜 용접에 가동하는 자재 출입 수칙의 명칭을 쓰시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"선입선출","explain":"모재 적치 보관 수칙에 따라, 먼저 입고되어 습기나 산화막이 가혹하게 진행될 수 있는 자재부터 차례대로 먼저 꺼내어 용접에 가동하는 자재 관리법은 '선입선출'입니다."},{"n":41,"type":"short","stem":"탄소강 SS275 시험판의 개선 홈 가공 설계 도면상에서 지시하는 한 패스당 30°~35° 사선 깎기에 해당하는 모재 '베벨각' 가공 오차 한계 범위를 정확히 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"30° ~ 35°","explain":"ASME 및 AWS 규격의 정석 홈 가공 설계 기준에 따른 V형 맞대기이음 SS275 자재의 한쪽 사선 가공 오차 한계 '베벨각' 범위는 '30° ~ 35°'입니다."},{"n":42,"type":"short","stem":"가압 롤러에서 토치 끝단까지의 원활한 정속 송급이 핵심인 CO₂용접기에서, 본 용접 개시에 앞서 가스 가열 분출 없이 와이어만을 토치 팁 밖으로 미세하게 송출시켜 장비 작동 유무와 롤러 가압력을 확인하는 전면 패널의 적색 필수 제어 스위치 명칭을 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"인칭 스위치 (Inching)","explain":"가스 밸브를 차단한 채 송급 모터만 작동시켜 와이어를 토치 팁 밖으로 정밀 돌출 송출시키는 전면 제어 스위치의 명칭은 '인칭 스위치(Inching)'입니다."},{"n":43,"type":"short","stem":"감압 조정기 내부에서 급격한 가스 팽창(단열팽창) 시 수분 동결과 드라이아이스 폐쇄를 완벽히 억제하기 위해 압력조정기 장치에 전원을 연결하여 사용하는 가열 장치의 명칭을 쓰시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"히터 (전기 가열기)","explain":"감압 및 방출 기화 시 단열팽창에 따른 줄-톰슨 효과로 조정기가 동결되어 유로가 막히는 동결 사고를 미연에 방지하기 위해 압력조정기 부속에 결선 가동하는 전기 가열 장치는 '히터'입니다."},{"n":44,"type":"short","stem":"고압 가스 용기의 식별을 위해 고압가스 안전관리법상 규정된 용기 외부 도색 도료 기준 중, '산소(Oxygen)' 봄베의 표준 식별 색상을 쓰시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"녹색","explain":"고압가스 안전관리법 시행령에서 규정한 '산소 가스' 봄베의 표준 식별 외부 도색은 '녹색'입니다."},{"n":45,"type":"short","stem":"고압 가스 용기의 식별을 위해 고압가스 안전관리법상 규정된 용기 외부 도색 도료 기준 중, '이산화탄소(CO₂)' 봄베의 표준 식별 색상을 쓰시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"청색","explain":"고압가스 안전관리법 시행령에서 규정한 '이산화탄소 가스' 봄베의 표준 식별 외부 도색은 '청색'입니다."},{"n":46,"type":"short","stem":"고압 가스 용기의 식별을 위해 고압가스 안전관리법상 규정된 용기 외부 도색 도료 기준 중, '아르곤(Argon)' 봄베의 표준 식별 색상을 쓰시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"회색","explain":"고압가스 안전관리법 시행령에서 규정한 '아르곤 가스' 봄베의 표준 식별 외부 도색은 '회색'입니다."},{"n":47,"type":"short","stem":"CO₂ 용접 시 보호가스 날림으로 인한 결함을 방지하기 위해, 풍속이 몇 m/sec 이상으로 강하게 부는 옥외 또는 실습 조건 하에서 '바람막이(방풍막)'를 의무 설치해야 하는지 그 최저 기준 풍속(m/sec) 값을 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"2m/sec 이상","explain":"보호 실드 가스의 흐름이 대기 바람에 날아가 결함이 형성되는 것을 원천 방지하기 위해, 바람막이 가동의 의무 기준이 되는 최저 '풍속' 기준은 '2m/sec 이상'입니다."},{"n":48,"type":"short","stem":"와이어 송급 장치(Wire Feeder)에서 모터 및 롤러 압력은 양호하나 콘택트 팁 선단과 와이어 전극 선단부 사이의 이격된 돌출부 길이의 공식 영문 및 국문 명칭을 정확히 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"와이어 돌출 길이 (Stick Out)","explain":"구리 전도용 콘택트 팁(Contact Tip) 전면 끝단부에서 아크가 발생하기 직전의 전극 와이어 끝단 선단부까지 외부 노출된 와이어 가압 실측 치수 명칭은 '와이어 돌출 길이(Stick Out)'입니다."},{"n":49,"type":"short","stem":"와이어 송급 시 와이어가 눌려 손상되는 결점을 예방하기 위해 알루미늄 등 연질 와이어 롤러에 U자 홈을 가공하거나 미끄러짐 방지를 위해 가압하는 물리적 다듬질 형상의 명칭을 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"널링 (Knurling)","explain":"연질 와이어의 단면 찌그러짐 변형을 예방하고 송급 마찰 구동력을 완벽하게 확보하기 위해 롤러에 홈을 깎거나 우둘투둘 가공하는 특수 다듬질 형태의 명칭은 '널링(Knurling)'입니다."},{"n":50,"type":"short","stem":"모재 개선 가공 중 홈 바닥의 수평 평면 부분을 가리키며, 용접 시 용락을 제어하고 균일한 이면 비드를 돌출시키기 위해 표준적으로 1.5~2.5mm 범위로 균일 가공하는 그루브 홈 하부 끝단의 공학적 명칭을 적으시오. 정답 입력란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"루트 면 (Root Face)","explain":"V형 홈 가공 하단부에서 수평면을 이루고 있으며, 용접 시 용락 결함을 원천 방어하고 이면 백비드 용입 안정화를 위해 1.5~2.5mm 균일 가공하는 가공 명칭은 '루트 면(Root Face)'입니다."}]},"11":{"unit":11,"title":"CO₂용접 장비 설치","code":"LM1601050204","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1장. CO₂용접 장비 설치 핵심 이론 요약"},{"t":"p","v":"CO₂ 가스 아크 용접(GMAW/FCAW)은 공학적으로 고효율성과 안정성을 극대화한 현대 산업의 핵심 접합 기술입니다. 본 단원에서는 정전압 특성과 상승 특성 등 전기적 기초 원리부터 1차측 입력 배선 및 누전차단기 계통 설계, 2차측 접지 및 절연 스페이드 마감 공법, 송급 모터 및 스프링 라이너 제어, 보호가스 가열 히터 및 레귤레이터 압력 유량 제어까지, 과정평가형 자격 외부 평가 기준의 전 범위를 완벽하게 정리하였습니다."},{"t":"h3","v":"1. CO₂ 용접기의 전기적 출력 외관 특성"},{"t":"p","v":"일반적인 피복아크용접기(SMAW)가 전류를 일정하게 유지하기 위해 수하특성(Drooping Characteristic) 또는 정전류 특성(Constant Current Characteristic)을 가집니다. 그러나 CO₂ 가스 아크 용접기는 직류 정전압 특성(DC Constant Voltage Characteristic) 또는 상승 특성(Rising Characteristic)을 채택하고 있습니다. 이 정전압 특성 하에서는 아크 전압이 거의 일정하게 유전되며, 용접 전류는 와이어 송급 속도에 따라 종속적으로 자동 변화하게 됩니다."},{"t":"li","v":"아크 길이 자기 제어 작용(Self-Regulation of Arc Length): 정전압 용접 전원에서는 작업자가 토치와 모재의 거리를 미세하게 흔들더라도, 아크 길이가 변하면 그에 따라 용접 전류가 급격히 변화하여 와이어 용융 속도를 조절함으로써 본래의 적정 아크 길이를 순식간에 복원해내는 성질을 뜻합니다. 예를 들어 아크 길이가 짧아지면 저항이 감소하고 전류가 일시적으로 급상승하여 와이어를 빠르게 녹여 아크 길이를 늘려 원래 길이로 복구시킵니다."},{"t":"p","v":"[표 1-1] 피복아크용접(SMAW)과 CO₂용접(GMAW)의 전원 특성 비교"},{"t":"table","rows":[["비교 항목","피복아크용접기 (SMAW)","CO₂ 가스아크용접기 (GMAW)"],["용접 전원 특성","수하특성 / 정전류 특성 (CC)","정전압 특성 / 상승 특성 (CV)"],["아크 길이 제어","작업자의 손동작 운봉에 직접 의존","정속도 송급에 의한 아크 길이 자기 제어"],["송급 제어 방식","수작업 공급 (용접봉 직접 교체)","송급 모터에 의한 정속도 자동 공급 방식"]]},{"t":"h3","v":"2. 용접기 설치 환경 및 1차/2차 전원 안전 결선"},{"t":"p","v":"CO₂ 용접기 설치 및 가동 환경 기준과 안전 규칙은 다음과 같습니다."},{"t":"p","v":"1) 설치 장소 요건: 습기와 먼지가 적고 바닥이 수평하고 견고해야 합니다. 용접기 내부 과열 방지 및 냉각을 위해 벽면이나 인접 장비로부터 최소 30cm 이상 이격하여 설치하며, 주위 온도는 -10~40℃ 범위를 균일하게 유지하고, 해발 고도 1,000m 이하의 환경에서 가동되어야 합니다."},{"t":"p","v":"2) 1차측 주 전원 결선 절차: 배전반 결선 시에는 반드시 배전반의 주 전원 스위치(MCCB)를 내린 후, 누군가 실수로 켜지 못하도록 '수리 중' 또는 '작업 중' 안전 표지판을 부착해야 감전 재해를 완전 예방할 수 있습니다. 1차 케이블의 끝단에 규격에 알맞은 구리 압착 터미널을 압착기를 사용하여 기계적으로 완전히 밀착 고정시킨 후 단단히 결선합니다. 접지선(초록색 또는 황색-녹색 줄)은 용접기 후면 접지 단자에 견고히 결합하여 지면과 물리적으로 전도 전극 접지를 유지시킵니다."},{"t":"p","v":"3) 2차측 출력 배선 및 절연 처리: 단자대에 결선할 때 양극(+) 단자는 와이어 송급 장치(Wire Feeder) 커넥터에 볼트-너트를 사용하여 유격 없이 고정하고, 음극(-) 단자는 모재 또는 정밀 작업대에 견고하게 이중 구속 체결(접지 집게 활용)합니다. 단자의 연결 노출부는 단락(쇼트) 방지 및 우발적 인체 감전 차단을 유도하기 위해 비닐 절연테이프나 원격 절연스페이드를 이용해 완전 절연 마감 처리합니다."},{"t":"h3","v":"3. 아크 전압 자동 계산 및 물리적 특성"},{"t":"p","v":"CO₂ 용접 공정에서 최적의 비드 외관을 확보하기 위해 아크 전류에 대응하는 적정 아크 전압(Vo)을 이론적으로 산출하는 표준 공식이 존재합니다."},{"t":"li","v":"박판 및 저전류 영역 (200A 이하): 아크 전압은 다음 식을 따릅니다."},{"t":"p","v":"V_o = 0.04 \\times I + 15.5 \\pm 1.5"},{"t":"li","v":"후판 및 고전류 영역 (200A 초과): 아크 전압은 다음 식을 따릅니다."},{"t":"p","v":"V_o = 0.04 \\times I + 20.0 \\pm 2.0"},{"t":"p","v":"예를 들어, 150A의 전류 조건으로 박판 용접을 시공하고자 할 경우 적정 표준 전압은 다음과 같이 계산됩니다:"},{"t":"p","v":"V_o = 0.04 \\times 150 + 15.5 = 6.0 + 15.5 = 21.5V (오차 범위: 20V ~ 23V)"},{"t":"h3","v":"4. 용접 토치 핵심 소모성 부품의 특성 및 관리"},{"t":"p","v":"CO₂ 토치는 기계적으로 자동 이송되는 솔리드 와이어를 받아 용접부에 전기를 통전시키고 가스를 분출하는 핵심 교구입니다."},{"t":"li","v":"콘택트 팁 (Contact Tip): 와이어에 전류를 공급하는 구리 합금 소모품입니다. 내부 구멍이 오랫동안 마모되면 통전 지점이 흔들려 아크가 격렬히 요동치고 스패터가 급증하게 됩니다. 팁 크기는 사용하는 와이어 지름(Ø1.2 등)과 정확히 1:1 매칭되어야 합니다."},{"t":"li","v":"스프링 라이너 (Spring Liner / Conduit): 송급 롤러에서 토치 끝단까지 와이어가 통과하는 강철선 튜빙관입니다. 내부 마찰 저항을 최저 수준으로 관리하고 에어 블로잉 청소를 매월 수행해야 와이어 잼(Jam)이나 끊김 불량을 영구 방지할 수 있습니다."},{"t":"li","v":"가스 디퓨저 및 노즐 (Gas Diffuser & Nozzle): 가스를 층류 형태로 고르게 분산하여 용융지를 산소와 질소로부터 차단(실딩)해주는 요소입니다. 노즐 내부에 가동 스패터 분순물이 고착되면 가스 분출 흐름이 교란되어 기공(Blow hole) 결함이 유발되므로, 주기적으로 스패터 부착 방지용 노즐 크림 등을 도포 관리합니다."},{"t":"h3","v":"5. 보호가스 공급 제어 및 가열 가스 히터의 공학적 원리"},{"t":"p","v":"1) 탄산가스(CO₂)의 동결 특성: 액화 이산화탄소가 기화하면서 주위로부터 엄청난 증발 잠열을 급격히 흡수하는 흡열 반응이 일어납니다. 이로 인해 조작 기계 레귤레이터 및 유량 제어기가 꽁꽁 얼어 동결되므로, 가스의 지속적인 흐름을 유도하기 위해 가스 가열 히터(Heater)를 반드시 부착해야 합니다. 히터 전원은 용접기 후면의 별도 전용 단자 콘센트(보통 AC 110V 또는 220V)에 상시 결선합니다. 가열 히터 전원을 가장 먼저 인가한 뒤 가스가 충분히 예열되면 용기 밸브를 개방하는 것이 계통 정석 수칙입니다."},{"t":"p","v":"2) 전류별 표준 가스 유량 제어 기준:"},{"t":"li","v":"소전류 및 단락 이행 영역 (200A 이하): 10 ~ 15 ℓ/min 설정 유지"},{"t":"li","v":"고전류 및 스프레이 이행 영역 (200A 초과): 20 ~ 25 ℓ/min 설정으로 보호 가압 증대"},{"t":"p","v":"3) 풍속 한계와 방풍 조치: 보호가스가 기류에 날아가면 용융지가 공기에 즉시 노출되어 산화/질화 반응으로 심각한 불량 기공이 유발됩니다. 일반적으로 CO₂ 용접에서 허용되는 임계 풍속은 1.5 m/sec 이하이며, 야외 등 풍속이 2.0 m/sec 이상으로 불어올 때는 방풍막(바람막이)을 견고하게 설치하여 용접 기류 보호막을 인위적으로 유지하는 것이 필수 법적 의무입니다."},{"t":"h2","v":"제2장. 대표 엄선 50제 실전 평가 시험지"},{"t":"p","v":"본 실전 평가는 과정평가형 자격 취득을 위해 고등학교 3학년 학생들이 고등급 합격을 성취할 수 있도록 변별력과 학문적 깊이를 완전히 확보하여 설계한 마스터 시험지입니다."},{"t":"li","v":"제1부: 4지선다형 객관식 평가 (1번 ~ 35번)"},{"t":"li","v":"제2부: 명칭/수치 중심 주관식 단답형 평가 (36번 ~ 50번)"},{"t":"h2","v":"제1부: 4지선다형 객관식 평가 (1번 ~ 35번)"}],"questions":[{"n":1,"type":"mcq","stem":"CO₂ 가스 아크 용접기(GMAW)의 주 전원과 전기적 출력 외관 특성에 대한 설명으로 가장 옳지 않은 것은?","choices":["아크 전류의 크기는 와이어의 기계적 송급 속도에 직접 정비례하여 결정된다.","아크 길이에 대한 일정한 전압을 자동 유지하기 위해 정전압 특성을 주로 사용한다.","부하 전류가 상승하면 단자 전압이 현저히 강하하는 수하특성을 가진다.","송급 모터가 와이어를 일정한 정속도로 자동 공급해주는 방식이 병행된다."],"answerIndex":3,"answerText":"③ 부하 전류가 상승하면 단자 전압이 현저히 강하하는 수하특성을 가진다.","explain":"CO₂ 가스 아크 용접기는 직류 정전압 특성(DC Constant Voltage) 또는 상승 특성의 용접 전원을 사용하여 아크 길이 자기 제어 능력을 발휘하며, 수하특성은 피복아크용접기(SMAW)의 대표적 전원 외관 특성입니다(NCS 학습모듈 LM1601050204_21v3 필요지식 참조)."},{"n":2,"type":"mcq","stem":"CO₂ 용접기 설치 장소의 공학적 표준 규격으로 올바르지 않은 것을 고르시오.","choices":["용접기의 냉각 및 화재 안전을 위해 다른 벽면이나 설비로부터 최소 30cm 이상 떨어뜨린다.","바닥이 수평하고 내진동성이 우수하며 습기와 유해 분진이 없는 견고한 장소에 기립한다.","실내 가동 주위 온도는 연중 -10℃ 이상 40℃ 이하 범위 내로 균일하게 관리 유지한다.","용접 전원 에너지 변환의 극대화를 유도하기 위해 가급적 진공 상태의 완전 밀폐실에서 작업한다."],"answerIndex":4,"answerText":"④ 용접 전원 에너지 변환의 극대화를 유도하기 위해 가급적 진공 상태의 완전 밀폐실에서 작업한다.","explain":"용접기 가동 시에는 적정 공기 순환 및 과열 예방을 유도하고 진공 상태나 완전 밀폐 상태는 가스 질식 재해를 초래하므로 피해야 합니다. 이격 거리는 최소 30cm 이상, 온도는 -10~40℃를 유지하는 것이 정석입니다."},{"n":3,"type":"mcq","stem":"1차 전원 및 배전반 케이블 결선 시 작업자가 전격(감전) 사고를 원천 방지하기 위해 가장 먼저 이행해야 할 정석 조치는?","choices":["배전반의 차단기(MCCB)를 완전히 내리고(OFF) '수리 중/작업 중' 명판을 확고히 부착한다.","절연 가죽 장갑을 땀에 젖은 상태로 착용한 후 접지 전선을 손으로 직접 체결한다.","1차 케이블의 단자를 절단한 뒤 고무테이프를 감지 않고 전압 설정 노브를 조작한다.","가스용기 밸브를 최대로 개방하여 주변 정전기 유도를 상쇄시키는 환기를 먼저 한다."],"answerIndex":1,"answerText":"① 배전반의 차단기(MCCB)를 완전히 내리고(OFF) '수리 중/작업 중' 명판을 확고히 부착한다.","explain":"현장 감전 재해 방지의 절대 1수칙은 배전반 메인 주 전원 스위치(MCCB)를 확실히 내린 뒤 타인의 오조작을 차단하기 위해 '수리 중' 또는 '작업 중' 안전 경고 명판을 부착하는 조치입니다."},{"n":4,"type":"mcq","stem":"CO₂ 용접 전원에서 가용 와이어 송급 속도와 돌출 길이가 결정되면 전류가 종속적으로 수렴·결정되는 물리적 전기 제어 작용은?","choices":["아크 강하 제어 작용 (Arc Droop Control)","아크 길이 자기 제어 작용 (Self-Regulation of Arc Length)","역률 효율 복합 지연 제어 작용 (Power Factor Regulation)","고주파 아크 스타트 고정 제어 작용 (HF Arc Start System)"],"answerIndex":2,"answerText":"② 아크 길이 자기 제어 작용 (Self-Regulation of Arc Length)","explain":"아크 전압이 거의 일정한 정전압 특성 하에서는 토치 거리가 멀어져 아크 길이가 늘어나면 용접 전류가 급감하여 와이어가 천천히 녹고, 거리가 가까워지면 전류가 급증하여 와이어가 빠르게 용융되어 최적의 전압 및 아크 길이를 본래 조건으로 복구시키는 '아크 길이 자기 제어 작용'이 일어납니다."},{"n":5,"type":"mcq","stem":"CO₂ 가스아크용접 시 극성은 일반적으로 직류 역극성(DCRP)을 많이 적용합니다. 역극성 적용 시의 공학적 특징으로 옳은 것은?","choices":["열이 텅스텐봉에 집중되어 후판의 고속 깊은 용입이 요구되는 작업에 극히 유리하다.","양극(+) 단자를 토치에, 음극(-) 단자를 모재에 접속하여 전자가 모재에서 토치로 이동한다.","모재 측의 열 집중 비율이 약 70%가 되어 용착 속도가 극단적으로 급하강한다.","아크가 대단히 안정되고 산화피막을 강제로 박리 파괴시키는 청정작용(Cleaning Action)이 나타난다."],"answerIndex":2,"answerText":"② 양극(+) 단자를 토치에, 음극(-) 단자를 모재에 접속하여 전자가 모재에서 토치로 이동한다.","explain":"DCRP는 토치(와이어) +, 모재 - 접속이므로 전자는 모재에서 토치로 흐른다. 텅스텐·모재 70% 설명은 CO₂ 역극성과 맞지 않는다."},{"n":6,"type":"mcq","stem":"CO₂ 용접의 최적 아크 전압(Vo)을 설계하고자 한다. 150A(박판 영역) 조건일 때 이론적 최적 아크 전압은 몇 V인가?","choices":["18.5V","21.5V","26.0V","28.5V"],"answerIndex":2,"answerText":"② 21.5V","explain":"박판 및 소전류 영역(200A 이하)에서의 아크 전압(Vo) 공식인 [Vo = 0.04 * I + 15.5 ± 1.5]에 I = 150A를 대입하면, Vo = 0.04 * 150 + 15.5 = 6.0 + 15.5 = 21.5V가 정밀 도출됩니다."},{"n":7,"type":"mcq","stem":"아크 전류가 300A(후판 영역) 조건일 때, 용접 표준 아크 전압(Vo)을 산출하는 계산식과 그 결과값이 바르게 짝지어진 것은?","choices":["Vo = 0.04 * 300 + 15.5 = 27.5V","Vo = 0.04 * 300 + 20.0 = 32.0V","Vo = 0.02 * 300 + 15.5 = 21.5V","Vo = 0.02 * 300 + 20.0 = 26.0V"],"answerIndex":2,"answerText":"② Vo = 0.04 * 300 + 20.0 = 32.0V","explain":"후판 및 고전류 영역(200A 초과)에서의 아크 전압 공식은 [Vo = 0.04 * I + 20.0 ± 2.0]입니다. 300A 대입 시 Vo = 0.04 * 300 + 20.0 = 12.0 + 20.0 = 32.0V가 도출됩니다."},{"n":8,"type":"mcq","stem":"용접 케이블과 배선 러그의 접촉 불량이나 나사 풀림 현상이 일어났을 때 초래되는 최악의 전기적·물리적 폐해는?","choices":["전격방지기의 작동 효율이 약 120%까지 기하급수적으로 폭등한다.","이산화탄소 가스의 산화 탈산 반응 속도가 강제로 정지된다.","접촉 저항의 급감으로 인해 전류 손실이 0이 된다.","접촉 저항의 급증으로 접합 단자가 과열 용융되어 손상되고 아크가 심하게 요동친다."],"answerIndex":4,"answerText":"④ 접촉 저항의 급증으로 접합 단자가 과열 용융되어 손상되고 아크가 심하게 요동친다.","explain":"케이블 단자와 단자대 결선 너트에 나사가 풀리거나 부식이 생기면 접촉 저항이 심각하게 급증하여 줄열(Joule Heat, Q=I^2 * R * t)이 과도히 발생하므로 터미널 단자대가 검게 타서 손상되거나 아크가 불안정하게 요동치게 됩니다."},{"n":9,"type":"mcq","stem":"CO₂ 용접토치의 스프링 라이너(Spring Liner / Conduit)의 설계 목적으로 가장 적합한 것은?","choices":["용융지 주위로 튀는 스패터를 자력으로 강제 흡착해 소멸시켜 준다.","보호가스를 토치 전방으로 미세 압착 조절하여 가스 혼합비를 제어한다.","와이어가 케이블 내부에서 꺾이지 않고 최소 마찰로 팁까지 송급되게 한다.","용접전류를 와이어 끝단에 100% 통전시켜 아크 발생을 자동 점화시킨다."],"answerIndex":3,"answerText":"③ 와이어가 케이블 내부에서 꺾이지 않고 최소 마찰로 팁까지 송급되게 한다.","explain":"스프링 라이너는 와이어 송급 롤러에서 토치 헤드 팁까지 와이어를 일정한 내부 경로로 유도해 가이드해주는 튜빙관으로, 내부 마찰을 최저로 제어해야 와이어의 기계적 송급이 일정하게 이행됩니다."},{"n":10,"type":"mcq","stem":"CO₂ 용접토치 가동 시 콘택트 팁(Contact Tip)의 마모 및 내경 확장이 가져오는 직접적인 시공 결함은?","choices":["통전 지점이 토치 내부에서 흔들려 아크가 불안정해지고 스패터가 많아진다.","보호가스의 분출 유량이 자동으로 2배 이상 초과 공급되어 낭비된다.","송급 모터가 역회전하여 와이어 스풀이 거꾸로 되감기게 된다.","용접기의 무부하 전압이 안전기준치인 20V 이하로 상시 강하한다."],"answerIndex":1,"answerText":"① 통전 지점이 토치 내부에서 흔들려 아크가 불안정해지고 스패터가 많아진다.","explain":"콘택트 팁 내부 구멍이 장시간 와이어 쓸림으로 인해 크게 마모되어 확장되면 전류 전도 지점이 요동치며 흔들리게 되므로, 전기적 통전 불량이 가중되어 아크가 심하게 흔들리고 용접 효율이 정지 또는 낙폭하며 다량의 스패터 불순물이 사방으로 비산됩니다."},{"n":11,"type":"mcq","stem":"CO₂ 용접 가스압 조정기(Regulator)에 전기식 가열 히터(Heater)를 반드시 부착 및 결선하여 상시 가동해야 하는 공학적 원인은?","choices":["탄산가스가 대기 중으로 기화할 때 엄청난 열을 흡수(증발 잠열 흡수)하여 조정기와 유량계가 얼어붙기 때문","탄산가스의 순도를 강제로 99.999%까지 압착 가열하여 이온화하기 위함","레귤레이터 내부 가스통의 온도를 350℃ 이상으로 높여 상온 균열을 방지하기 위함","가스가 기화하지 않고 청색 액체 상태를 유지할 수 있도록 온도를 고정하기 위함"],"answerIndex":1,"answerText":"① 탄산가스가 대기 중으로 기화할 때 엄청난 열을 흡수(증발 잠열 흡수)하여 조정기와 유량계가 얼어붙기 때문","explain":"액화 상태의 고압 탄산가스(CO₂)가 레귤레이터를 통과하여 상온 기체 상태로 기화하면서 주위의 증발 잠열을 대량 흡수(급랭 열흡수 현상)하게 됩니다. 이로 인해 유량계가 얼어 동결되므로, 콘센트 단자에 전선을 상시 결선하여 동결 방지 가열 히터를 켜주어야만 가스가 원활히 층류 방출됩니다."},{"n":12,"type":"mcq","stem":"용접 전류 영역에 따른 이산화탄소(CO₂) 보호가스의 표준 사용 유량 제어 범위로 가장 이상적인 배합은?","choices":["소전류 영역: 5 ℓ/min 이하, 고전류 영역: 10 ℓ/min","소전류 영역: 10 ~ 15 ℓ/min, 고전류 영역: 20 ~ 25 ℓ/min","소전류 영역: 30 ~ 40 ℓ/min, 고전류 영역: 50 ℓ/min 이상","전류에 관계없이 무조건 50 ℓ/min 이상 최대 유량 방출"],"answerIndex":2,"answerText":"② 소전류 영역: 10 ~ 15 ℓ/min, 고전류 영역: 20 ~ 25 ℓ/min","explain":"보호가스 최적 유량 배합 기준은 소전류(단락 이행 영역) 10 ~ 15 ℓ/min, 고전류(스프레이 이행 영역) 20 ~ 25 ℓ/min로 조작 가동하는 것이 공학 표준 수칙입니다."},{"n":13,"type":"mcq","stem":"CO₂ 용접에서 공기의 기류(바람)가 실드 환경에 미치는 악영향과 방풍 조치를 이행해야 하는 임계 풍속 규격은?","choices":["풍속이 0.5m/sec 이상일 때 국소 배기장치를 최대로 가동한다.","풍속이 1.5m/sec 이하에서는 항시 용접 스크린을 전체 해체한다.","풍속이 2.0m/sec 이상일 때는 가스 보호막이 날아가므로 반드시 방풍막을 설치해야 한다.","풍속이 5.0m/sec 이상일 때 비로소 토치 노즐의 가스 유량을 절반으로 강압한다."],"answerIndex":3,"answerText":"③ 풍속이 2.0m/sec 이상일 때는 가스 보호막이 날아가므로 반드시 방풍막을 설치해야 한다.","explain":"보호가스는 풍속에 극도로 취약합니다. 바람이 1.5m/sec 이하 조건에서는 비교적 안전하지만, 2.0m/sec를 초과하여 거칠게 불어올 때는 가스 차단 보호 장막이 찢겨 날아가므로 반드시 용접 주변에 방풍 스크린을 설치해야 가동 결함을 예방합니다."},{"n":14,"type":"mcq","stem":"보호가스 공급이 완전히 불능이 되거나 노즐 안쪽이 스패터 불순물로 꽉 막혔을 때, 아크 발생 즉시 비드 표면에 발생하는 치명적인 내부 용접 결함은?","choices":["마르텐사이트 급랭 지연 균열 결함","고온 수소 취성에 의한 균열 결함","언더컷(Undercut)과 슬래그 혼입 결함","기공(Porosity) 및 미세 피트 결함"],"answerIndex":4,"answerText":"④ 기공(Porosity) 및 미세 피트 결함","explain":"용접 용융지가 차단 보호막(Shield Gas)을 상실하게 되면 대기 중의 다량의 산소와 질소가 용융지 안으로 즉시 침투하여 응고 시 가스 배출 불능 상태가 되므로 비드 표면과 내부에 기공(Blow hole / Porosity) 및 미세 피트 불량 구멍이 대량 고착됩니다."},{"n":15,"type":"mcq","stem":"용접 배전반 누전차단기(ELB)와 배선용차단기(NFB)의 안전한 가동 관리에 대한 설명으로 가장 적합하지 않은 것은?","choices":["누전차단기(ELB)는 기기의 단락이나 지락 시 미세 누전 전류를 감지하여 0.03초 이내에 전원을 차단한다.","배선용차단기(NFB)는 과부하 전류나 합선 단선 시 선로를 안전하게 차단한다.","차단기 내부의 안전 퓨즈가 단선되었을 때는 동일한 정격 용량의 표준 제품으로 신속하게 선입 교체한다.","전원 차단 작업 시 습기가 있는 가죽장갑을 착용하고 차단기 스위치를 한 손으로 강하게 타격하는 것이 안전하다."],"answerIndex":4,"answerText":"④ 전원 차단 작업 시 습기가 있는 가죽장갑을 착용하고 차단기 스위치를 한 손으로 강하게 타격하는 것이 안전하다.","explain":"누전차단기 및 전기 장비를 젖은 절연장갑을 낀 상태로 만지거나 기기를 한 손으로 불성실하게 타격하는 조작은 전격 및 기계적 부작용을 유발하는 치명적인 전기적 위반 행동입니다."},{"n":16,"type":"mcq","stem":"액화 탄산가스(CO₂) 용기를 안전하게 새로운 용기로 교체하기 위한 교정 작업 절차 중 가장 부적절한 조치는?","choices":["다 사용한 가스통의 고압 메인 밸브를 먼저 시계 방향으로 완전히 차단한다.","용기 연결관과 레귤레이터를 전용 공구인 멍키스패너를 활용하여 체결 나사산에 마모가 없도록 서서히 분리한다.","교체 조립 후 가스 누설 여부를 성냥불이나 라이터 불꽃을 직접 근접시켜 불꽃 흔들림으로 감지한다.","고압 가스 조정기와 용기 연결 단자 접촉부의 이물질과 먼지를 결합 전에 완전 소거한다."],"answerIndex":3,"answerText":"③ 교체 조립 후 가스 누설 여부를 성냥불이나 라이터 불꽃을 직접 근접시켜 불꽃 흔들림으로 감지한다.","explain":"고압 탄산가스는 가연성 가스는 아니지만, 가스 누설 여부를 검사할 때 성냥불이나 라이터 불꽃을 직접 근접시키는 것은 폭발 위험이나 안전 관리 대원칙에 위배되는 극히 위험한 일입니다. 반드시 브러시로 중성 비눗물을 칠해 거품 기포 발생 유무를 안전하게 확인해야 합니다."},{"n":17,"type":"mcq","stem":"가스 압력 조정기(Regulator) 조작 중 고압의 메인 가스 밸브를 아주 급격히 확 열어젖혔을 때 일어나는 기계적 파손 재해는?","choices":["저압 유량 볼 게이지가 서서히 영점으로 조절되면서 자동 복구된다.","가스 용기 내부에 진공 저압이 걸리면서 용기가 안쪽으로 압착된다.","고압 가스가 조정기 압력계를 급격히 타격해 압력계가 파손되거나 폭발한다.","가열 히터의 가열 성능이 실시간으로 10배 이상 폭증하여 과열된다."],"answerIndex":3,"answerText":"③ 고압 가스가 조정기 압력계를 급격히 타격해 압력계가 파손되거나 폭발한다.","explain":"용기 상단의 고압 개방 메인 밸브를 아주 갑자기 급격히 돌려 열면, 고압(보통 50 ~ 70 kgf/㎠)의 액화 가스가 조정기 내부 압력계를 물리적으로 거칠게 타격하여 압력계가 그 자리에서 깨져 파손되거나 고온이 발생해 치명적인 폭발 사고를 유발할 수 있습니다."},{"n":18,"type":"mcq","stem":"CO₂ 가스 아크 용접 시 스패터(Spatter) 발생량을 줄이고 비드의 표면을 정밀하고 유연하게 제어하기 위해 아르곤(Ar)가스를 이산화탄소 가스와 혼합해 사용하는 가스 비율 표준 공법은?","choices":["탄산가스 95% + 산소 5%의 산화성 혼합 가스 적용","아르곤 75 ~ 85% + 탄산가스 15 ~ 25% 혼합(MAG) 적용","아세틸렌가스 50% + 질소가스 50% 균등 혼합 가스 적용","아르곤 10% + 헬륨 90% 후판용 초고온 혼합 가스 적용"],"answerIndex":2,"answerText":"② 아르곤 75 ~ 85% + 탄산가스 15 ~ 25% 혼합(MAG) 적용","explain":"CO₂ 가스의 단점인 심한 아크 요동과 다량의 스패터를 극복하기 위해, 보호가스로 아르곤 75 ~ 85%와 이산화탄소 15 ~ 25% 비율을 균일하게 배합한 혼합 가스 공법(MAG)을 적용하면 품질과 아크 안정성이 대폭 증대됩니다."},{"n":19,"type":"mcq","stem":"와이어 송급 장치(Wire Feeder) 전면 조립 시, 용접 토치의 전원 케이블을 송급 장치 커넥터에 완전 삽입하고 반 바퀴 정도 회전 체결하여 기계적 접촉저항 발생을 영구 방지하도록 유도하는 체결 부속품의 명칭은?","choices":["송급 가압 조절 손잡이","원격 전류 조절 상자","토치 조임 볼트 및 압착 고정 너트","9핀 원격 제어 커넥터"],"answerIndex":3,"answerText":"③ 토치 조임 볼트 및 압착 고정 너트","explain":"토치 전원 케이블을 와이어 송급 장치 커넥터에 빈틈없이 밀어 넣은 다음 조임 볼트 및 압착 고정 너트를 반 바퀴 이상 회전시켜 기계적으로 완전 결착해야만 접속 부분의 유격으로 인한 발열 현상을 완벽 차단할 수 있습니다."},{"n":20,"type":"mcq","stem":"가압 롤러 손잡이(Tension Knob) 조절 요령 중, 가압 손잡이를 너무 약하게 유격 조여놓았을 때 발생하는 기계적 와이어 송급 오작동 불량 현상은?","choices":["송급 롤러와 가압 베어링 사이에서 와이어가 헛돌아 송급이 불규칙하거나 완전히 정지된다.","와이어 송급 속도가 정상 한계치보다 3배 이상 초과 고속 회전한다.","와이어 콘택트 팁 단자부가 과열 용융되어 노즐에 접착 고착된다.","액화 탄산가스의 실딩 공급 압력이 0으로 즉시 강하된다."],"answerIndex":1,"answerText":"① 송급 롤러와 가압 베어링 사이에서 와이어가 헛돌아 송급이 불규칙하거나 완전히 정지된다.","explain":"송급 롤러와 가압 베어링 사이를 압착해주는 조절 손잡이의 압력이 너무 헐거우면 와이어 표면을 롤러가 압착하지 못하고 헛돌기 때문에, 와이어 송급 속도가 균일하지 못하고 불규칙하게 떨리거나 완전히 멈추는 오작동 불량이 유발됩니다."},{"n":21,"type":"mcq","stem":"반대로 가압 손잡이를 너무 과도하게 강한 토크로 조여 조립하였을 때 일어나는 기계적 불량 원인과 대책으로 옳은 것은?","choices":["와이어 외경이 납작하게 찌그러지고 표면 구리 도금막이 벗겨져 스프링 라이너 내부 저항이 가중된다.","콘택트 팁 내부에서 유격이 늘어나 송급 속도가 0이 된다.","가열 히터의 열전도가 차단되므로 가스 압력을 대폭 늘린다.","용접 전원 장치의 3상 입력 휴즈가 즉시 단선되므로 단선 차단기를 교체한다."],"answerIndex":1,"answerText":"① 와이어 외경이 납작하게 찌그러지고 표면 구리 도금막이 벗겨져 스프링 라이너 내부 저항이 가중된다.","explain":"가압 손잡이를 너무 과도한 토크로 조여놓으면 부드러운 연질의 솔리드 와이어 표면이 기계적으로 압착되어 찌그러지고 표면 구리 도금막이 완전히 긁혀 벗겨지며, 이 도금 찌꺼기가 스프링 라이너 내부에 누적되어 저항을 대폭 증가시키고 팁 마찰을 악화시킵니다."},{"n":22,"type":"mcq","stem":"CO₂ 가스아크용접기 전면 패널의 크레이터(Crater) 유/무 선택 스위치 전환 시, '크레이터 유(Crater ON)' 제어 회로의 작동 매커니즘으로 옳은 것은?","choices":["토치 스위치를 쥐면 즉시 아크가 꺼지고, 놓아야 비로소 고전류 아크가 점화된다.","스위치를 쥐었다 놓으면 용접 전류로 계속 가동되고, 종점에서 다시 쥐면 크레이터 저전류로 바뀐다.","토치 스위치를 쥐고 있는 동안에만 아크가 꺼지고, 놓는 순간 고압 스파크가 튄다.","크레이터 전류 제어를 완전히 생략하여 박판을 시점부터 종점까지 고속으로 시공한다."],"answerIndex":2,"answerText":"② 스위치를 쥐었다 놓으면 용접 전류로 계속 가동되고, 종점에서 다시 쥐면 크레이터 저전류로 바뀐다.","explain":"크레이터 유(Crater ON) 회로 모드는 수동 조작 시 토치 스위치를 처음 쥐었다가 놓으면 본용접 세팅 조건 전류로 계속 시공되다가, 최종 종점에서 스위치를 다시 쥐고 있는 동안에는 본용접 전류의 약 70% 수준인 크레이터 저전류 영역이 가동되어 크레이터 구멍 충전 처리를 손쉽게 이행하게 돕습니다."},{"n":23,"type":"mcq","stem":"CO₂ 아크용접용 와이어를 새로 송급하기 위해 사용하는 인칭(Inching) 스위치의 정상 작동 방식으로 올바른 것은?","choices":["토치 스위치와 히터를 가동하지 않고 오직 송급 모터만 수동 회전시켜 와이어를 토치 케이블 밖으로 밀어내어 돌출시키는 스위치","보호가스를 25 LPM으로 뿜어내어 호스 배관 내부의 가스 누출 여부를 비눗물로 확인하는 스위치","용접 전류 및 전압 값을 실시간으로 계산하는 수학 회로 구동 스위치","배전반 누전차단기의 단락 여부를 기계적으로 점검하여 경보음을 울려주는 안전 스위치"],"answerIndex":1,"answerText":"① 토치 스위치와 히터를 가동하지 않고 오직 송급 모터만 수동 회전시켜 와이어를 토치 케이블 밖으로 밀어내어 돌출시키는 스위치","explain":"인칭(Inching) 스위치는 토치 본체의 가스 솔레노이드 밸브나 고전압 용접 아크 회로를 전혀 작동시키지 않은 무부하 정지 상태에서, 오직 송급 롤러 모터만을 회전시켜 새로 교체한 와이어가 토치 케이블을 안전하게 통과해 팁 밖으로 돌출되도록 밀어내어 이송하는 수동 조작 스위치입니다."},{"n":24,"type":"mcq","stem":"와이어가 콘택트 팁 밖으로 지나치게 길게 돌출되어(와이어 돌출 길이 과다) 용접을 계속 시공할 때 발생하는 시공적 부작용은?","choices":["전류 밀도가 가중되어 아크 온도가 5,000℃ 이상 상승한다.","가스 실드 효과가 대폭 감쇄되어 기공이 발생하고 아크가 불안정해지며 용입이 현저히 얕아진다.","와이어 송급 모터가 급격히 역회전하여 메인 컨트롤러에 과전류 쇼트가 유발된다.","비드 외관이 극한으로 평평하고 넓어져 용입 깊이가 2배 이상 초과된다."],"answerIndex":2,"answerText":"② 가스 실드 효과가 대폭 감쇄되어 기공이 발생하고 아크가 불안정해지며 용입이 현저히 얕아진다.","explain":"와이어가 토치 끝단 노즐 밖으로 과도하게 길게 뻗어 나온 상태로 아크를 유지하게 되면, 아크 포인트와 노즐 사이의 거리가 너무 멀어져 실드 가스의 분사 가압력이 감쇄되고 가압 대기 공기가 쉽게 와류 유입되어 비드 표면 기공 발생을 급증시키며 용입 깊이가 얕아집니다."},{"n":25,"type":"mcq","stem":"CO₂ 반자동 용접토치의 가스 노즐(Nozzle) 안쪽에 고착되는 철분 스패터(Spatter)를 신속하게 소거하지 않고 누적 방치했을 때 초래되는 피해가 아닌 것은?","choices":["가스 분출 홀이 스패터 불순물로 막혀 실드 가스의 고른 층류 방출이 방해받는다.","보호 효과 감소로 인해 다량의 대기 유입이 유도되어 비드 내부에 기공 결함이 유발된다.","콘택트 팁과 노즐이 전기적으로 통전 단락되어 스위치를 켜지 않아도 상시 아크가 튀게 된다.","배전반에 설치된 감전 안전 접지선이 즉각적으로 용착 절단되어 단선된다."],"answerIndex":4,"answerText":"④ 배전반에 설치된 감전 안전 접지선이 즉각적으로 용착 절단되어 단선된다.","explain":"노즐 안쪽의 스패터 고착은 가스 유동을 방해하고 팁과 노즐을 쇼트 단락시키는 폐해를 유발하지만, 배전반에 물리적으로 매립 시공된 접지선 자체를 기계적으로 절단하는 것과는 무관합니다. 단, 단락에 의한 감전 및 기기 고장 유발은 치명적입니다."},{"n":26,"type":"mcq","stem":"용접 케이블 절연 피복의 손상 여부와 안전 점검 주기로 가장 알맞은 조합은?","choices":["일상 점검: 수시 및 작업 전후 발열/냄새 점검, 정기 점검: 3~6개월 단위로 피복 및 접지 상태 정밀 점검","일상 점검: 연 1회, 정기 점검: 10년 주기","일상 점검: 전혀 불필요, 정기 점검: 공사 완료 시 1회 한정","일상 점검: 용접 시 가스 누출 부위를 직접 손으로 가동 점검, 정기 점검: 수시 생략"],"answerIndex":1,"answerText":"① 일상 점검: 수시 및 작업 전후 발열/냄새 점검, 정기 점검: 3~6개월 단위로 피복 및 접지 상태 정밀 점검","explain":"매번 작업에 임하기 전 용접 케이블의 이상 소음, 타는 냄새, 피복 파손 여부를 상시 점검하는 것이 '일상 점검'이며, 3~6개월 주기로 전기적 누전 절연 피복의 손상 상태와 단자 조임 상태를 기구를 활용하여 정교하게 분석하는 것이 '정기 점검' 법적 요건입니다."},{"n":27,"type":"mcq","stem":"CO₂ 가스용기 가열 히터의 기계적 작동 순서로 감전 예방 및 동파 안전을 위한 올바른 절차를 고르시오.","choices":["히터의 기화용 전원 코드를 먼저 콘센트에 결선한 후 가스 통의 메인 고압 밸브를 천천히 연다.","가스통의 고압 밸브를 풀 기압으로 연 다음, 꽁꽁 얼어붙은 밸브에 물을 뿌리고 히터 코드를 결선한다.","용접 전류 조절 노브를 500A로 세팅한 다음, 히터 전선을 누전차단기 1차 터미널에 직접 쇼트 체결한다.","히터를 사용하지 않고 토치의 가스 디퓨저에 스패터 방지 크림을 최대로 충전하여 용접을 즉시 수행한다."],"answerIndex":1,"answerText":"① 히터의 기화용 전원 코드를 먼저 콘센트에 결선한 후 가스 통의 메인 고압 밸브를 천천히 연다.","explain":"전기 감전 사고를 완전히 예방하고 레귤레이터의 열 충격과 가스 동결을 영구 방지하기 위해 가열 히터 전원을 단자 콘센트에 가장 먼저 연결하여 충분히 온도를 확보한 다음, 고압 용기 메인 밸브를 아주 서서히 열어 가동하는 것이 완벽한 정석 조립 순서입니다."},{"n":28,"type":"mcq","stem":"고압가스 안전수칙 상 탄산가스 용기(Cylinder)의 물리적 보관 요건과 안전 취급 사항으로 틀린 것은?","choices":["고압가스 안전을 위해 충격이나 쓰러짐을 방지할 수 있는 단단한 철 체인 쇠사슬 고정 장치를 부착한다.","용기는 항시 통풍이 원활하고 직사광선을 피해 40℃ 이하의 차갑고 서늘한 장소에 똑바로 세워서 보관한다.","용기는 가스 종류에 따라 도색이 규정되어 있으므로 탄산가스 통은 청색(아르곤 회색)으로 구별해 관리한다.","용기 밸브를 원활하게 조작하기 위해 조정기의 조립 나사산과 밸브 주위에 점성이 있는 그리스나 석유 등의 유질성 오일을 도포 관리한다."],"answerIndex":4,"answerText":"④ 용기 밸브를 원활하게 조작하기 위해 조정기의 조립 나사산과 밸브 주위에 점성이 있는 그리스나 석유 등의 유질성 오일을 도포 관리한다.","explain":"고압가스 안전 규칙 상 산소나 고압 가스 밸브, 레귤레이터 조립 나사산에는 절대로 그리스, 석유, 오일 등 가연성/유질성 기름 물질을 도포하거나 부착하면 안 됩니다. 고압 기체 개방 시의 열로 인해 유질 물질이 급격히 폭발하거나 소생 화재를 유발할 위험이 매우 높기 때문입니다."},{"n":29,"type":"mcq","stem":"CO₂ 용접기 후면에서 3상 1차 입력 전압 배선 설정 시, 공급 전압이 380V일 때 올바른 결선 설정 공법은?","choices":["후면의 접속 금속 탭 링크 플레이트를 380V 명기 위치로 전환 배치하고 고정 볼트를 기계적으로 견고히 조여 결선한다.","전류 조정 노브를 조여서 220V로 감압한 다음 그냥 가동한다.","1차 케이블의 초록색 접지선을 가스 공급용 철 배관 말단에 직결하여 안전 접지를 대체한다.","용접기 후면을 분해하여 퓨즈 홀더 내부 퓨즈를 동선 철사로 감아 강제로 고정 결선한다."],"answerIndex":1,"answerText":"① 후면의 접속 금속 탭 링크 플레이트를 380V 명기 위치로 전환 배치하고 고정 볼트를 기계적으로 견고히 조여 결선한다.","explain":"3상 380V 전원 공급 시에는 용접기 후면 금속 플레이트 링크 탭의 위치를 380V 전용 단자 배열로 확실하게 맞춰 고정 볼트를 유격 없이 타이트하게 조여 조립해야 전기 흐름 변환 효율이 정상 작동합니다."},{"n":30,"type":"mcq","stem":"용접기 가동 중 특이한 진동, 이상 연소 타는 냄새, 전면 송급 모터 부근에서의 아크 쏠림 소음 등이 미세하게 감지되었을 때 즉각 취해야 할 현장 응급 처치는?","choices":["탄산가스의 사용 유량을 50 LPM으로 높여 주변 타는 연기를 강제 질식 소화시킨다.","인칭 스위치를 계속 눌러 내부 와이어를 강제로 5m 이상 돌출시켜 불량 부위를 밀어낸다.","아크 전압 제어 노브를 최대로 높여 이상 결함을 강제로 용착 소멸시킨다.","즉시 가동 토치를 작업대에 내려놓고 용접기 메인 전원 스위치 및 배전반 차단기를 완전히 차단하고 원인을 규명한다."],"answerIndex":4,"answerText":"④ 즉시 가동 토치를 작업대에 내려놓고 용접기 메인 전원 스위치 및 배전반 차단기를 완전히 차단하고 원인을 규명한다.","explain":"가동 중 타는 냄새나 불안정한 타격 스파크 및 소음 등 미세한 오작동이 감지되면 지체 없이 용접 작업을 완전 중단하고, 용접기 자체 메인 스위치와 배전반의 주 누전차단기를 즉시 꺼서 전류를 안전하게 차단한 뒤 전문 시설 관리자의 정밀 고장 수리를 의뢰해야 대형 화재 및 감전 재해를 방지합니다."},{"n":31,"type":"mcq","stem":"인버터 CO₂ 용접기의 내부 부품 청소 작업에 관한 안전 지침으로 가장 옳은 것은?","choices":["전원 스위치를 차단하자마자 즉시 외부 철제 덮개를 열고 물걸레로 내부 회로를 닦아 세척한다.","전원 차단 후에도 콘덴서에 잔류 전하가 남으므로, 5 ~ 10분 대기 후 마른 압축공기로 먼지를 제거한다.","전원 차단 여부와 관계없이 용접 가동 중에 압축공기를 분사해 먼지 제거와 환기를 함께 병행한다.","내부 PCB 기판에 먼지가 누적되면 접촉 불량이 생기므로 철 솔로 납땜 부위를 긁어서 제거한다."],"answerIndex":2,"answerText":"② 전원 차단 후에도 콘덴서에 잔류 전하가 남으므로, 5 ~ 10분 대기 후 마른 압축공기로 먼지를 제거한다.","explain":"용접기 가동 스위치를 차단한 직후에도 내부 메인 전원 콘덴서(Capacitor) 회로에는 치명적인 잔류 고압 전하가 일정 시간 충전된 상태로 남아있습니다. 따라서 스위치를 차단하고 약 5 ~ 10분 정도 충분히 시간을 두어 에너지를 완전 방전시킨 다음 덮개를 열고 압축공기(에어건)로 먼지를 털어내야 감전을 예방합니다."},{"n":32,"type":"mcq","stem":"와이어 송급 장치(Wire Feeder)에 내장된 원격 제어 조절 노브(Remote Adjustment Control)의 주요 제어 역할은 무엇인가?","choices":["용접 토치의 수랭식 냉각수 순환 모터를 자동으로 정지시키는 장치","용접부 이면에 가하는 알곤 가스의 퍼징 시간을 강제 조작하는 기능","작업 위치에서 용접 전류와 아크 전압을 원격으로 미세 조절하는 장치","배전반 누전차단기의 미세 누전 검출 감도를 조정 설정하는 장치"],"answerIndex":3,"answerText":"③ 작업 위치에서 용접 전류와 아크 전압을 원격으로 미세 조절하는 장치","explain":"원격 조절 상자는 용접기 본체 전면 조작 패널과 거리가 먼 현장에서 용접 비드 작업을 시공할 때, 작업자가 토치 근처에서 즉시 용접 전류와 아크 전압을 미세 세팅 세부 가동 제어할 수 있도록 도와주는 원격 이동식 케이블 조절 장치입니다."},{"n":33,"type":"mcq","stem":"CO₂ 가스아크용접 시 솔레노이드 가스 체크 밸브(Gas Check Switch)를 ON으로 설정하는 본래의 시험 목적은?","choices":["가스 가열 히터의 작동 온도를 -10℃ 이하까지 급랭 동결시켜 계속 유지하기 위함","와이어 송급 롤러의 가압 장력을 이론적으로 자동 계산하여 롤러 구동을 정지하기 위함","배전반의 교류 아크 3상 전원의 극성을 용접 개시 전에 미리 직류 정극성으로 강제 환원하기 위함","아크를 발생시키지 않고 보호가스가 배관으로 정상 방출되는지 점검하고 유량을 사전 조정하기 위함"],"answerIndex":4,"answerText":"④ 아크를 발생시키지 않고 보호가스가 배관으로 정상 방출되는지 점검하고 유량을 사전 조정하기 위함","explain":"가스 체크(GAS CHECK) 전면 스위치를 ON으로 설정하면 용접기 아크 전압 회로가 잠금 차단된 정지 상태에서 보호가스만을 송급 솔레노이드 밸브로 뿜어내어, 가스 누설 검사 비 Soap Water 테스트 및 볼 유량계의 흐름 세부 조정을 사전 이행할 수 있게 돕습니다."},{"n":34,"type":"mcq","stem":"CO₂ 용접 공정에 적합한 강철 솔리드 와이어(Solid Wire) 규격 표기 중 'YGW 11'이 내포하고 있는 공학적 정의는?","choices":["고온 균열 방지 전용 알루미늄 심선재 규격","아르곤 가스를 100% 실딩 보호가스로 사용하는 특수 티타늄 와이어 규격","가스 메탈 아크 용접용 연강 솔리드 와이어 및 표준 보호가스 배합 조성 규격","수중 가접 전용 연강 저수소 피복아크용접봉 규격"],"answerIndex":3,"answerText":"③ 가스 메탈 아크 용접용 연강 솔리드 와이어 및 표준 보호가스 배합 조성 규격","explain":"YGW 11은 KS 규격 상 연강 및 고장력강용 탄산가스 아크 용접용 강철 고체 솔리드 와이어(Solid Wire) 및 그에 적합한 가동 물리 화학적 배합 규격 기호입니다."},{"n":35,"type":"mcq","stem":"용접토치 스위치 단자 및 가스 연결 너트 조립 부근에서 미세하게 가스가 누출되고 있는 것을 감지하기 위해 작업 현장에서 사용하는 가장 실용적이고 확실한 사전 검사 물질은?","choices":["휘발성 가솔린 오일 및 점화 라이터 불꽃 대기","압착 고정용 특수 액체 그리스 페인트 및 시너 배합물","친환경 중성 비눗물 용액 및 기포 발생 점검 브러시","아세틸렌 누설 전용 연소 가스 탐지 소화용 방화수"],"answerIndex":3,"answerText":"③ 친환경 중성 비눗물 용액 및 기포 발생 점검 브러시","explain":"미세 가스 누설은 중성 비눗물을 브러시로 도포해 기포 발생 여부로 확인한다. 화기·유지류 사용은 발화와 오염 위험이 있어 금지된다."},{"n":36,"type":"short","stem":"CO₂ 가스 아크 용접 시, 아크 전류(A)가 증가하면 그에 따른 용접부의 비드 형상 물리적 변화 중 어떤 현상이 현저히 깊어지는지 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"용입 깊이 (Penetration Depth)","explain":"용접 아크 전류(I)의 세기는 비드의 표면 전착 속도와 직결되며, 아크 전류가 높을수록 모재가 녹아들어 가는 물리적 현상인 '용입 깊이'가 기하학적으로 깊어지게 됩니다."},{"n":37,"type":"short","stem":"용용액화 가스 조정기가 기화할 때 주변의 증발 잠열을 흡수하여 얼어붙는 현상을 방지하기 위해 사용하는 전기 가열 장치의 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"가스 가열 히터 (Gas Heater)","explain":"액화 탄산가스가 고압 조정기를 통과하여 대기 중으로 기화되면서 상당한 양의 증발 잠열을 주변에서 일시적으로 탈취하여 동결 현상이 발생하므로, 이를 영구 보수하기 위해 히터 코드를 결선해 사용하는 기기가 가스 가열 히터입니다."},{"n":38,"type":"short","stem":"CO₂ 용접기 전면 패널에 부착되어 있으며 용접 전류와 전압을 작업자가 직관적으로 확인하고 조율할 수 있도록 수치를 표시해주는 측정 계기판 2가지의 공학적 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"전류계 (A-Meter) 및 전압계 (V-Meter)","explain":"용접 패널 전면에 내장되어 작업 중인 용접 전류(A)와 전압(V)의 수치들을 실시간 디지털 및 아날로그 형태로 시각적으로 표시해주는 표준 계측 계기입니다."},{"n":39,"type":"short","stem":"GMAW/FCAW 용접기의 냉각 및 화재 예방을 위해 다른 벽면이나 장비로부터 띄워 설치해야 하는 안전 이격 거리 기준 수치(cm 단위)를 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"30cm 이상","explain":"용접기 장비 냉각팬의 원활한 공랭식 흡입 및 배기를 통한 내부 과열 소손을 소거하기 위해 벽면 또는 기계 사이의 안전 임계 이격 거리는 최소 30cm 이상으로 규정되어 있습니다."},{"n":40,"type":"short","stem":"용접기 가동 실내 주위 온도를 공학적으로 안전하게 관리 유지해야 하는 표준 임계 온도 범위의 상한값과 하한값(℃)을 바르게 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"-10℃ 이상 40℃ 이하","explain":"용접기 설치·사용 주위 온도 기준은 -10℃ 미만이나 40℃ 초과인 장소를 피하는 것이므로 하한값은 10℃가 아니라 -10℃다."},{"n":41,"type":"short","stem":"박판 용접 조건에서 용용전류가 150A일 때, 표준 공식을 적용하여 산출한 적정 아크 전압의 이론적 기준 전압(V)을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"21.5V","explain":"박판/소전류 영역 공식인 [Vo = 0.04 * I + 15.5]에 150A를 대입 계산하면 [Vo = 0.04 * 150 + 15.5 = 6.0 + 15.5 = 21.5V]가 도출됩니다."},{"n":42,"type":"short","stem":"후판 용접 조건에서 용용전류가 300A일 때, 표준 공식을 대입하여 계산한 적정 표준 아크 전압 이론치(V)를 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"32.0V","explain":"후판/대전류 영역 공식인 [Vo = 0.04 * I + 20.0]에 300A를 대입 풀이하면 [Vo = 0.04 * 300 + 20.0 = 12.0 + 20.0 = 32.0V]가 정확하게 산출됩니다."},{"n":43,"type":"short","stem":"용접 케이블 노출 단자의 접합 불량과 전격에 의한 감전 사고를 차단하기 위해 단자대 접속 완료 후 노출 연결 부위에 씌우거나 감아주는 절연 처리 소모재의 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"절연테이프 또는 절연커버 (절연스페이드)","explain":"용접 단자의 구리 금속 접촉 연결부를 완전 차단 및 밀폐 절연하기 위해 감거나 덮는 마감재를 절연테이프 또는 원격 절연커버라고 지칭합니다."},{"n":44,"type":"short","stem":"CO₂ 용접토치 케이블 내부에 들어있으며 송급 롤러에서 토치 끝단까지 와이어가 일정한 최소 마찰 저항으로 가이드되게 통로 역할을 해주는 소모성 관의 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"스프링 라이너 (Spring Liner / Conduit Tube)","explain":"송급 장치 피더로부터 공급되는 솔리드 와이어가 유연하고 흔들림 없이 토치 전면의 콘택트 팁까지 매끄럽게 통과해 가이드되도록 통로 역할을 수행하는 강철선 코일 내부 관입니다."},{"n":45,"type":"short","stem":"와이어에 전기 용접전류를 직접 전도하여 통전시켜 아크 발생을 매개해주는 구리 합금 토치 끝단의 핵심 소모 부품 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"콘택트 팁 (Contact Tip)","explain":"와이어가 분출 직전에 직접 접촉하여 대전류 용접 전기에너지를 효율적으로 와이어에 공급 통전해 주는 동합금 핵심 소모 부품입니다."},{"n":46,"type":"short","stem":"보호가스 흐름을 층류 형태로 고르게 분산 제어하여 용융지의 실드 작용을 안정화시켜주는 토치 헤드 부품의 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"가스 디퓨저 (Gas Diffuser)","explain":"토치 오리피스를 포함해 노즐 내경 층류 구조로 이산화탄소 가스를 골고루 방출·분산시켜주는 분사 배합 디퓨저 유닛입니다."},{"n":47,"type":"short","stem":"소전류 및 단락 이행 영역(200A 이하) 조건에서 이산화탄소(CO₂) 보호가스의 표준 유량 조절 임계치(ℓ/min 단위 범위)를 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"10 ~ 15 ℓ/min (LPM)","explain":"소전류 및 단락 용융 영역 시, 실드 보호 가압이 과도하여 가동 아크 기류를 교란하지 않도록 조율하는 표준 유량 제어 수치는 10 ~ 15 LPM 범위가 가장 이상적입니다."},{"n":48,"type":"short","stem":"고전류 및 스프레이 이행 영역(200A 초과) 조건에서 이산화탄소 보호가스의 최적 배합 송출 유량 범위(ℓ/min 단위 범위)를 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"20 ~ 25 ℓ/min (LPM)","explain":"고전류 스프레이 이행 용접 시에는 넓어진 용융지를 대기 공기로부터 확실하게 전체 차단 차폐해주어야 하므로 보호 가스 공급량을 증가시킨 20 ~ 25 LPM으로 유량 조작을 제어합니다."},{"n":49,"type":"short","stem":"CO₂ 가스 용기 상단 및 가스 분배 배관 말단에 견고히 부착하여 가스의 압력을 내리고 가동 사용 유량을 미세 측정·제어하는 장치의 명칭을 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"압력 조정기 및 유량계 (CO₂ Regulator & Flowmeter)","explain":"고압 가스통 내부의 보관 압력(50~70 kgf/㎠)을 낮은 안전 작동 유효 압력(2~3 kgf/㎠)으로 자동 강하시켜주고 가스 유량을 미세 제어 및 조율할 수 있도록 내장된 제어 장치 세트입니다."},{"n":50,"type":"short","stem":"CO₂ 용접 공정에서 방풍 대책(바람막이 스크린 설치)을 법적·시공적으로 강제 설치해야 하는 임계 풍속 기준 수치(m/sec)를 쓰시오. 답: _________________________________________","choices":[],"answerIndex":null,"answerText":"2.0 m/sec 이상","explain":"바람막이 및 방풍 장막을 현장에 무조건적으로 의무 가설·시공해야 하는 임계 풍속 한계 규격 수치는 2.0 m/sec 이상으로 정해져 있습니다."}]},"12":{"unit":12,"title":"CO₂용접 가용접 작업","code":"LM1601050205","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 이론 요약"},{"t":"h3","v":"1. 모재 치수 확인 및 개선 홈 설계 요건"},{"t":"p","v":"용접 조립 시, 접합하고자 하는 두 부재의 단면 형상을 기계적으로 다듬는 것을 '개선(홈, Groove) 가공'이라 한다. 가용접 및 본용접 전에 도면 및 용접절차사양서(WPS)에 제시된 개선 치수를 확인하고 설계적인 단차, 루트 간격, 개선 각도를 유지하는 것이 시공 품질의 기틀이 된다."},{"t":"h4","v":"용접부 주요 각부 명칭과 정의:"},{"t":"li","v":"개선 또는 홈 (Groove): 접합하고자 하는 두 부재의 맞대기 단면을 개선 가공하는 형상 영역 자체를 말한다."},{"t":"li","v":"용접의 토우 (Toe): 모재 표면과 용착금속 표면이 만나는 경계상의 교점을 의미한다."},{"t":"li","v":"용접의 루트 (Root): 이면 용접부(이면 비드)가 위치하는 그루브의 가장 깊은 최하단 중심부를 말한다."},{"t":"li","v":"용착금속 (Deposited metal): 용접봉이나 와이어가 아크 열에 의해 녹아 모재 접합부에 채워져 응고된 금속이다."},{"t":"li","v":"덧붙이 (Reinforcement): 모재 본래의 평평한 표면 높이보다 위쪽으로 더 두껍게 쌓아 올려진 용착금속의 여유 높이이다."},{"t":"li","v":"목두께 (Throat thickness): 용착금속의 단면에서 용접 루트를 통과하는 가상의 최소 두께이며, 용접 구조물의 응력 설계 및 안전성 계산에서 실질적인 구조적 두께로 사용된다."},{"t":"h3","v":"2. CO₂ 가스 아크 용접의 모재 두께별 표준 시공 조건"},{"t":"p","v":"CO₂ 가스 아크 용접은 소모 전극 와이어를 일정한 속도로 연속 송급하면서 와이어 끝단과 모재 사이에 아크를 발생하는 용극식 용접법이다. 이때 용입 깊이를 결정하는 가장 지배적인 인자는 전류(Current)이며, 전류가 높아질수록 용입은 깊어지고 용융 속도는 전류에 비례하여 증가한다. 반면 용접 속도가 필요 이상으로 빠르면 단위 길이당 입열량이 감소하여 용입이 극히 얕아지는 결함이 수반된다."},{"t":"p","v":"<표 1> CO₂ 용접 모재 두께별 표준 작업 조건 범위 (와이어 지름 1.2mm/1.6mm 기준)"},{"t":"table","rows":[["판 두께 (mm)","와이어 지름 (mm)","루트 간격 (mm)","용접 전류 (A)","아크 전압 (V)","용접 속도 (cm/min)","가스 유량 (ℓ/min)"],["6.0","1.2","2.0","220","22","35 ~ 45","15 ~ 20"],["9.0","1.2","2.0","320 ~ 330","31 ~ 33","45 ~ 55","20 ~ 25"],["12.0","1.2 또는 1.6","2.0","330","32 ~ 33","35 ~ 50","20 ~ 25"],["16.0","1.2 또는 1.6","2.0","330 ~ 450","33 ~ 38","45 ~ 55","20 ~ 25"]]},{"t":"h3","v":"3. CO₂ 가용접(Tack Welding)의 정밀 시공 및 변형 제어 수칙"},{"t":"p","v":"가용접은 본용접 전에 부품의 치수 정밀도를 유지하고 열변형에 의한 단차나 수축을 방지하기 위하여 임시로 짧게 고정 용접하는 가조립 단계의 공정이다. 급속한 열 확산과 급랭이 수반되어 균열(Crack), 기공(Blowhole), 슬래그 혼입 등 가접부 내부에 보이지 않는 중대 결함을 잔존시키기 쉬우므로 다음과 같은 대원칙을 준수해야 한다."},{"t":"li","v":"시공 숙련도 요건: 가용접은 단순히 고정하는 공정이 아니며 급랭 결함의 발생 위험이 높으므로, 원칙적으로 본용접사와 동등 이상의 고도의 기량을 가진 숙련자가 시공하여야 한다."},{"t":"li","v":"온도 관리 및 예열: 본용접과 동일한 수준의 예열 온도를 유지하여 급랭 마르텐사이트 변태로 인한 경화 및 저온 수소 균열을 예방해야 한다. 가용접 취부 용접 및 도그피스, 스트롱백 취부 시에도 동일 수준 예열이 필수적이다."},{"t":"li","v":"용접부 내 가접 기피 및 그라인딩: 원칙적으로 도면의 주요 압력부 및 안전성 핵심부 그루브(홈) 내부에는 가접을 피해야 한다. 본용접을 진행할 때는 홈 내부의 기존 가용접 부위를 사전에 완전 그라인딩(또는 백치핑)하여 결함을 완벽히 깎아낸 뒤 용접을 시공한다."},{"t":"li","v":"가용접 배치 금지 구역: 하중이 집중되는 부품의 끝단부, 날카로운 모서리(Corner), 각진 부위(응력집중부)와 본용접의 아크 스타트가 일어나는 시점 및 크레이터가 위치하는 종점부에는 결함 연쇄 전파를 방지하기 위해 가용접 배치를 절대 금지한다."},{"t":"li","v":"가는 용접봉(와이어) 사용과 높은 전류: 가용접 시에는 본용접에 사용하는 지름보다 조금 가는 직경의 전극을 사용하여 충분한 루트 용입을 확보하되, 아크 집중과 원활한 젖음성(Wetting)을 얻기 위해 평소 본용접 조건보다 약간 더 높은 융전류를 세팅하여 용입 불량을 극복한다."},{"t":"h3","v":"4. 가용접 비드 표준 길이와 배치 간격 규격"},{"t":"p","v":"가용접 비드의 표준 배치는 모재 두께(t)에 기반하여 공학적 한계치와 간격 범위가 명확하게 정해져 있으며 자격 지필 시험에 상시 출제되는 최우수 단골 테마이다."},{"t":"h4","v":"판 두께(t)에 따른 표준 가용접 비드 길이 수칙:"},{"t":"li","v":"박판 영역 (t ≤ 3.2mm): 가용접 비드 길이의 표준 한계치는 30mm 이상으로 제한한다. (되도록 치핑과 짧은 피치를 유지하여 본용접 시 비드 결성을 최소화한다.)"},{"t":"li","v":"중판 영역 (3.2mm < t ≤ 25mm): 가용접 비드 길이의 표준 한계치는 40mm 이상으로 시공하여 구조적 파단 수축 하중을 구속한다."},{"t":"li","v":"후판 영역 (25mm < t): 수축 억제와 취성 파괴 저지를 위해 가용접 비드 길이를 50mm 이상으로 매우 튼튼하게 시공하며 가접 전 충분한 광범위 예열을 병행하여야 한다."},{"t":"h4","v":"표준 가용접 배치 간격 공식:"},{"t":"li","v":"가용접 배치 간의 간격(Pitch)은 일반적으로 모재 두께(t)의 15배에서 30배(15t ~ 30t) 배를 기준으로 등간격 대칭 분할 배치하여 한쪽 쏠림에 의한 단차 변형을 억제한다."},{"t":"h3","v":"5. 변형 방지 치공구의 이점 및 결함 방지 아크 발생법"},{"t":"p","v":"가용접 및 본용접의 치수 균일화와 변형 구속을 위해 용접용 그립, 포지셔너(자세 조정), 정반, 스트롱백(Strong back) 등의 구속 치공구를 능동적으로 활용한다."},{"t":"h4","v":"용접 구속 지그 및 고정구 사용의 3대 이점:"},{"t":"li","v":"동일 규격 제품의 다량 생산(양산화) 실현"},{"t":"li","v":"제품 치수 정밀도 확보 및 용접 품질 신뢰성(재현성) 증대"},{"t":"li","v":"자연스러운 아래보기 용접 자세 유도로 작업 편의성 극대화 및 공정 효율(공정수 절약) 증대"},{"t":"h4","v":"지그 사용 시 유의해야 할 공학적 제한사항:"},{"t":"li","v":"과도한 구속력 제한: 구속 지그의 구속력이 지나치게 크면 열팽창 수축 거동이 완전히 억제되어 용접부 내부의 용착금속과 열영향부(HAZ)에 과도한 인장 잔류응력이 가중되며 이로 인해 고온 잔류 균열 또는 후열 처리 전 파손 균열을 초래하게 된다."},{"t":"li","v":"지그의 제작 단가가 구조물 대비 과도하게 비싸지 않아야 하고 취급 및 분해가 간편하여 청소성이 보장되는 정비성을 갖추어야 한다."},{"t":"h4","v":"기공 및 아크 스타트 결함 방지용 표준 아크 발생법:"},{"t":"li","v":"탭판(Run-off Tab)의 적용: 본 모재 개선 홈 바깥 영역에 보조용 탭판을 가접 설치하여 결함이 발생하기 쉬운 최초 아크 스타트 및 최종 크레이터부를 탭판에서 응고 소멸시킨 뒤 작업 완료 후 기계적으로 탈거하는 신뢰성 높은 용접법이다."},{"t":"li","v":"백스탭법 (Back step, 후진법): 용접 진행 방향과 반대로 스타트하여 초층 비드를 형성해 나가며 이전 용접 비드단과 자연스럽게 오버랩하여 연결부에 발생하기 쉬운 시점 결함을 아크 고열로 완전히 용해시켜 차단하는 기법이다."},{"t":"li","v":"홈 밖에서 스타트: 개선 홈 내부 중심부가 아닌 측면 사면 혹은 잉여 탭판에서 아크를 안착 및 안정화시킨 뒤 빠른 시간 내 토치의 거리와 각도를 조절하여 개선 중심 홈으로 인입되어 고품질 본비드를 쌓아나가는 요령이다."},{"t":"h2","v":"제2부: 대표 엄선 50제 실전 평가"},{"t":"p","v":"본 평가는 과정평가형 용접산업기사 외부평가 출제 대원칙에 따라 객관식 35문항, 단답형 및 계산형 주관식 15문항으로 정밀 설계되었습니다."}],"questions":[{"n":1,"type":"mcq","stem":"용접부 각부 명칭 중 모재 표면과 용착금속 표면이 만나서 이루는 교점을 지칭하는 올바른 명칭은 무엇인가?","choices":["용접의 루트 (Root)","용접의 토우 (Toe)","용착금속 (Deposited metal)","덧붙이 (Reinforcement)"],"answerIndex":2,"answerText":"② 용접의 토우 (Toe)","explain":"모재 표면과 용착금속 표면과의 교점을 '용접의 토우(Toe of weld)'라고 정밀 규정한다."},{"n":2,"type":"mcq","stem":"용접절차사양서(WPS)에 따라 강성을 갖춘 구조물의 응력 계산 시 실질적인 구조체 부하 단면으로 대입하는 설계 두께의 명칭은?","choices":["덧붙이 높이 (Reinforcement)","개선 깊이 (Groove depth)","실제 판 두께 t (Plate thickness)","이론 목두께 (Throat thickness)"],"answerIndex":4,"answerText":"④ 이론 목두께 (Throat thickness)","explain":"용접 구조 설계 상 응력 계산 및 강도 검증 시, 단면 부하의 대입 기준으로 실질적인 최소 두께인 '이론 목두께'를 사용한다."},{"n":3,"type":"mcq","stem":"CO₂ 가스 아크 용접 시 용입 깊이를 결정하는 가장 중요한 물리적 인자이며, 이 값이 상승함에 따라 용입이 거의 선형적으로 깊어지는 요인은 무엇인가?","choices":["아크 전압 (Voltage)","용접 전류 (Current)","보호가스 유량 (Flow rate)","노즐 직경 (Nozzle diameter)"],"answerIndex":2,"answerText":"② 용접 전류 (Current)","explain":"CO₂ 가스 아크 용접에서 용입 깊이를 결정하는 가장 핵심적인 요소는 용접 전류(Current)이며, 전류값의 제곱 혹은 정비례 관계에 의해 깊어진다."},{"n":4,"type":"mcq","stem":"CO₂ 용접 조건 중 용입이 과도하게 얕아지고 용착량이 부족하여 융합 불량을 초래하는 원인으로 가장 타당한 조작 상태는?","choices":["용접 속도가 정상 범위보다 과도하게 빠를 때","용접 전류가 과도하게 높을 때","와이어 송급 속도가 매우 빠를 때","이산화탄소 가스 압력이 정상 범위일 때"],"answerIndex":1,"answerText":"① 용접 속도가 정상 범위보다 과도하게 빠를 때","explain":"용접 속도가 한계 이상으로 너무 빨라지면 단위 길이당 투입되는 아크 입열 에너지가 격감하므로 모재가 제대로 녹지 못해 용입이 극히 얕아진다."},{"n":5,"type":"mcq","stem":"CO₂ 가스 아크 용접에서 판 두께 6.0mm 모재에 직경 1.2mm 와이어로 I형 맞대기 용접을 하고자 할 때, 표준 루트 간격의 조작 기준으로 적합한 치수는?","choices":["0 ~ 1.0mm","2.0mm","3.5mm","5.0mm"],"answerIndex":2,"answerText":"② 2.0mm","explain":"NCS 표 기준 판 두께 6.0mm I형 맞대기의 루트 간격은 1.5~2.0mm이고 표준 조작치는 2.0mm이므로 ②. 현장에 따라 판 두께의 1/3 이하(6÷3=2mm)로 잡기도 한다."},{"n":6,"type":"mcq","stem":"NCS 학습모듈 <표 1-15> 기준, 모재 두께 9.0mm에 솔리드 와이어 1.2mm 규격을 적용할 때, 권장되는 표준 아크 전압(V)의 범위로 올바른 것은?","choices":["12 ~ 15V","18 ~ 20V","31 ~ 33V","38 ~ 42V"],"answerIndex":3,"answerText":"③ 31 ~ 33V","explain":"NCS 학습모듈 <표 1-15> 기준, 모재 두께 9.0mm 조립 가용접 시 전류 320 ~ 330A 및 아크 전압 31 ~ 33V가 표준 수칙으로 매칭된다."},{"n":7,"type":"mcq","stem":"모재 두께 16mm 탄소강 판재에 와이어 1.2mm를 활용하여 맞대기 가용접 및 본용접을 진행할 때, 요구되는 이산화탄소 가스의 권장 표준 송급 유량 범위는?","choices":["5 ~ 8 ℓ/min","10 ~ 12 ℓ/min","15 ~ 18 ℓ/min","20 ~ 25 ℓ/min"],"answerIndex":4,"answerText":"④ 20 ~ 25 ℓ/min","explain":"NCS 학습모듈 <표 1-15> 조건 기준, 판 두께 16mm 후판 영역 용접 시 보호가스(이산화탄소) 권장 송급 유량은 20 ~ 25 ℓ/min로 다소 높게 세팅한다."},{"n":8,"type":"mcq","stem":"가용접(Tack Welding)의 정석 실무 기준에 대한 설명으로 공학적으로 가장 부적절한 설명은 무엇인가?","choices":["본용접의 급랭 균열을 방지하기 위해 가용접 시에도 사전 예열을 완벽히 유지한다.","중요한 강도 부재의 경우 가용접은 본용접사와 동등 이상의 고숙련자가 실시한다.","홈 내부의 가용접부는 결함을 차단하기 위해 본용접 진행 전 그라인더로 완전히 없앤다.","가접 조립 단계이므로 본용접보다 현격히 낮은 전류를 세팅하여 스패터를 최소화한다."],"answerIndex":4,"answerText":"④ 가접 조립 단계이므로 본용접보다 현격히 낮은 전류를 세팅하여 스패터를 최소화한다.","explain":"가용접은 급랭 속도가 본용접보다 훨씬 빠르므로 용입 불량 결함이 빈발한다. 따라서 가는 용접봉(와이어)을 쓰는 대신 본용접보다 높은 전류를 세팅하여 침투 용입력을 배가시켜야 한다."},{"n":9,"type":"mcq","stem":"NCS 가용접 작업 기준에 의거하여, 가용접 비드를 절대 배치해서는 안 되는 금지 구역으로 올바르게 짝지어진 것은?","choices":["엔드탭의 표면 내부 및 홈의 중심선에 인접한 영역 전체","구속 지그가 밀착 고정된 판재의 정중앙 대칭점","모재의 평평한 중앙부 및 홈의 진행 시작점 부근","부품의 모서리, 끝단부, 날카롭게 각진 곳(응력집중부)"],"answerIndex":4,"answerText":"④ 부품의 모서리, 끝단부, 날카롭게 각진 곳(응력집중부)","explain":"응력이 분산되지 않고 누적 고착되기 쉬운 부품의 날카로운 모서리(Corner), 끝단부, 각진 곳 및 크레이터가 남는 시·종점부에는 가용접 비드를 일절 배치하지 않는다."},{"n":10,"type":"mcq","stem":"가용접 시 본용접에 사용되는 와이어 지름보다 가늘고 세밀한 와이어를 선정하여 용접을 진행하는 핵심적인 공학적 이유는?","choices":["전류의 흐름을 고전압 상태로 억제하기 위함","가조립 단계에서 완전한 루트부 용입을 신속히 얻기 위함","와이어 송급 롤러의 기계적 슬립을 방지하기 위함","스패터 비산 면적을 줄여 수동 해머질을 면제하기 위함"],"answerIndex":2,"answerText":"② 가조립 단계에서 완전한 루트부 용입을 신속히 얻기 위함","explain":"가가접 시 본용접용 와이어보다 가는 와이어 규격을 적용하면 저전류 및 조작 집중 상태에서 충분하고 완전한 루트부 이면 용입을 용이하게 확보할 수 있다."},{"n":11,"type":"mcq","stem":"모재 판 두께가 3.0mm인 박판 강재를 용접 조건에 맞게 조립 가가접할 때, 준수해야 하는 가용접 비드의 표준 길이(mm) 한계치는?","choices":["10mm 이상","20mm 이상","30mm 이상","50mm 이상"],"answerIndex":3,"answerText":"③ 30mm 이상","explain":"NCS <표 3-5> 기준, 판 두께 3.2mm 이하의 극박판 및 박판 영역 조립 가접 시 1개 비드의 표준 길이는 최소 30mm 이상으로 균일화하여 시공한다."},{"n":12,"type":"mcq","stem":"판 두께 9.0mm인 중후판 모재에 대하여 가용접을 시공할 때, 열수축과 부품 어긋남 변형에 저항하기 위한 표준 가접 비드의 정밀 제어 길이(mm)는?","choices":["20mm 이상","30mm 이상","40mm 이상","60mm 이상"],"answerIndex":3,"answerText":"③ 40mm 이상","explain":"NCS <표 3-5> 및 <표 2-3> 조건에 의거하여, 판 두께 3.2mm 초과 25mm 이하 중판 영역 가가접 비드 길이는 최소 40mm 이상으로 튼튼하게 시공 구속한다."},{"n":13,"type":"mcq","stem":"ASME 및 KS 공학적 기준을 바탕으로 고강도 후판(판 두께 30mm 이상)을 정렬 조립하여 고정 가가접하고자 한다. 이때 요구되는 최소 가접 비드 길이는?","choices":["30mm 이상","40mm 이상","50mm 이상","80mm 이상"],"answerIndex":3,"answerText":"③ 50mm 이상","explain":"NCS <표 3-5> 조건 기준, 판 두께 25mm를 초과하는 후판 영역 가가접 시 1개 비드의 공학적 최소 제한 길이는 50mm 이상으로 두껍게 시공한다."},{"n":14,"type":"mcq","stem":"가용접을 진행할 때 각각의 임시 가접 비드 상호 간의 배치 간격을 선정하는 일반 표준 공식으로 가장 올바른 범위는?","choices":["모재 두께(t)의 50 ~ 80배 간격 (50t ~ 80t)","모재 두께(t)의 제곱승 배율 간격 (t²배)","모재 두께(t)의 2 ~ 5배 간격 (2t ~ 5t)","모재 두께(t)의 15 ~ 30배 간격 (15t ~ 30t)"],"answerIndex":4,"answerText":"④ 모재 두께(t)의 15 ~ 30배 간격 (15t ~ 30t)","explain":"가용접 비드를 분할하여 배치할 때의 표준 간격 수식은 모재 판 두께 t의 최소 15배에서 최대 30배(15t ~ 30t)를 기준으로 등간격 대칭 분할한다."},{"n":15,"type":"mcq","stem":"모재 판 두께(t)가 10mm인 중판 맞대기이음을 등간격 대칭법으로 가가접 배치하고자 한다. 표준 수식 범위(15t ~ 30t)에 부합하는 적정 가접 피치 간격의 한계 범위는?","choices":["50 ~ 100mm","150 ~ 300mm","400 ~ 500mm","600 ~ 800mm"],"answerIndex":2,"answerText":"② 150 ~ 300mm","explain":"가용접 배치 공식 '15t ~ 30t'에 판 두께 t = 10mm를 각각 대입 계산하면, 15 * 10 = 150mm부터 30 * 10 = 300mm 간격 범위가 정석 피치로 산출된다."},{"n":16,"type":"mcq","stem":"가용접 및 본용접 작업 시 용접 구조물의 치수 공차를 정확히 지키고 가접 공수를 단축하기 위해 사용하는 대표 치공구인 '용접 지그(Fixture)' 사용의 이점이 아닌 것은?","choices":["동일 규격 제품의 정밀 다량 생산 실현","작업 자세를 안정된 아래보기 자세로 교정하여 능률 향상","용접부 내부의 잔류 인장응력을 완전히 소거하여 응력 완화 효과 제공","구조물의 가조립 정밀도를 균일하게 유지하여 치수 신뢰성 제고"],"answerIndex":3,"answerText":"③ 용접부 내부의 잔류 인장응력을 완전히 소거하여 응력 완화 효과 제공","explain":"용접 지그는 생산성, 치수 균일 정밀도, 작업 편의성을 높이지만, 용접부 금속 조직 내부에 물리적으로 동반되는 수축 잔류응력을 소거하는 응력 완화 작용과는 무관하다."},{"n":17,"type":"mcq","stem":"용접 구조물 조립 단계에서 구속력이 극도로 높은 구속 지그를 남용했을 때 발생할 수 있는 중대 손상 및 물리적 결함은 무엇인가?","choices":["아크 전압 강하에 의한 불규칙한 자기 쏠림 발생","모재 표면의 기계적 밀스케일(산화막) 급격 증가","용접부 주변의 국부적 부식 전위 및 변색 가중","과도한 잔류응력 누적에 의한 가용접부의 균열 유발"],"answerIndex":4,"answerText":"④ 과도한 잔류응력 누적에 의한 가용접부의 균열 유발","explain":"구속 지그의 구속 가압력이 필요 이상으로 과도하면, 열팽창 및 수축 시의 기계적 거동을 완전히 차단하므로 가용접부와 HAZ부에 막대한 잔류 인장응력을 가중시켜 즉각적인 균열을 부른다."},{"n":18,"type":"mcq","stem":"용접 변형 예방 및 제어 공법 중, 용접 완료 후 발생할 열수축 변형의 방향과 변형량을 공학적으로 예측하여 조립 가접 단계에서 미리 반대 방향으로 2 ~ 5° 꺾어서 가조립을 구속하는 정밀 제어 공법의 명칭은?","choices":["강제 억제법 (Restraint method)","역변형법 (Reverse deformation)","냉각 도열법 (Cooling method)","수랭 동판 접촉법 (Water cooling)"],"answerIndex":2,"answerText":"② 역변형법 (Reverse deformation)","explain":"수축 뒤틀림 각변형량을 정밀 예측하여, 가조립 시 사전에 반대 방향(각도)으로 미리 꺾어 조립 구속한 뒤 용접 변형을 상쇄 소멸시키는 기법을 '역변형법'이라 한다."},{"n":19,"type":"mcq","stem":"CO₂ 가스 아크 용접 중, 초층 비드 개시점에서 상시 발생하는 기공(Blowhole) 및 용입 부족 결함을 근본적으로 방지하기 위해 개선 홈 외부 연장선에 별도 설치하여 시·종점 결함을 전이 응고시키는 치공구의 명칭은?","choices":["스트롱백 (Strong back)","탭판 (Run-off Tab)","보호용 석면포","세라믹 가스 가이드"],"answerIndex":2,"answerText":"② 탭판 (Run-off Tab)","explain":"본 모재 개선 홈 바깥 영역에 임시 연장하여 장착하는 '탭판(Run-off Tab)'은 기공 및 용입 부족 결함이 발생하기 쉬운 스타트 및 크레이터를 탭판 내부에서 마감 소멸시키는 치공구이다."},{"n":20,"type":"mcq","stem":"용접 진행 방향과 역방향으로 아크를 스타트하여 이전 용가재 용융 단부와 오버랩을 견고하게 수행함으로써 연결부 기공을 아크 열로 녹여 방지하는 운봉법의 올바른 명칭은?","choices":["전진 블록 적층법","캐스케이드 적층법","백스탭법 (후진법)","대칭 비석 운봉 배치법"],"answerIndex":3,"answerText":"③ 백스탭법 (후진법)","explain":"용접 진행선과 일시 역방향으로 아크를 안착 스타트하여 초층 비드를 안전하게 중첩해 쌓아나감으로써 결함을 방지하는 고품질 운봉 기법은 '백스탭법'이다."},{"n":21,"type":"mcq","stem":"용접 아크 점화 시 본 모재 중심의 개선 홈 한가운데에서 직접 스크래치를 치지 않고 사면 내부 슬로프 혹은 탭판에서 점화 후 인입되도록 조작하는 주된 이유는?","choices":["용접 게이지 측정 시 눈금 오차를 미연에 방지하기 위해","와이어 송급 롤러의 모터 마찰을 줄이기 위해","개선 홈 내부 중심부에 아크 충격 결함 및 루트 이물질 혼입을 차단하기 위해","고압 가스 조정기의 게이지 지침 바늘 바이브레이션을 억제하기 위해"],"answerIndex":3,"answerText":"③ 개선 홈 내부 중심부에 아크 충격 결함 및 루트 이물질 혼입을 차단하기 위해","explain":"개선 홈 중앙부에서 임의로 아크 스크래치 타격을 가하면 사면에 국부 아크 스트라이크 용락 또는 결함이 동반되므로, 슬로프 측면이나 보조판에서 안착 후 홈 내부로 인입 조작한다."},{"n":22,"type":"mcq","stem":"용접지그의 일종으로 두꺼운 평판 맞대기 이음 시 판 상호 간의 수평 단차를 정밀하게 수정하고 용접선 폭 방향의 뒤틀림과 각변형을 일시 구속하기 위해 교대로 취부하는 긴 바 형태 가용접 고정구의 명칭은?","choices":["마그네틱 그립","콤비네이션 집게","포지셔너 (Positioner)","스트롱백 (Strong back)"],"answerIndex":4,"answerText":"④ 스트롱백 (Strong back)","explain":"맞대기 용접 시 부재 상호 간의 일정한 수평 정렬을 유지(단차 수정)하고 두께 방향 뒤틀림과 각변형을 탄성 구속하여 가접을 쉽게 만드는 긴 바 형태 지그는 '스트롱백'이다."},{"n":23,"type":"mcq","stem":"용접 후 구조물의 잔류응력을 소거하고 열영향부 조직의 기계적 인성을 개선하기 위해, 규정된 노(Furnace) 내에 구조물을 넣고 적정 제어 온도로 유지 후 서서히 냉각하는 열처리 공법은?","choices":["피닝 (Peening) 작업","풀림 (Annealing) 노내 열처리","불림 (Normalizing) 공기 냉각","담금질 (Quenching) 수랭 급랭"],"answerIndex":2,"answerText":"② 풀림 (Annealing) 노내 열처리","explain":"구조물 전체를 규정된 안전 온도의 노(Furnace) 내에 장입하여 일정 시간 균일하게 열 보존한 뒤 서서히 냉각(서냉)시켜 내부 잔류응력을 완전히 제거하고 연성을 회복시키는 열처리는 '풀림(Annealing)'이다."},{"n":24,"type":"mcq","stem":"NCS 학습모듈 <그림 3-30>의 WPS(용접절차사양서)에 제시된 FCAW 공정의 가스 성분비 요건으로, 실드 효과를 최적화하기 위해 적용하는 보호가스의 화학식과 순도 기준은?","choices":["CO₂ 100% (순도 99.5% 이상)","Ar 100% (순도 99.99% 이상)","O₂ + CO₂ (혼합가스)","Ar 75% + He 25%"],"answerIndex":1,"answerText":"① CO₂ 100% (순도 99.5% 이상)","explain":"WPS <그림 3-30> 상에 규정된 FCAW 시 차폐가스(Gas Shielding) 표준 배합 조건은 이산화탄소 100%(CO₂ 100%)이며 순도는 최소 99.5% 이상의 고순도를 지향한다."},{"n":25,"type":"mcq","stem":"WPS에 명시된 다층 용접 층간 청소(Interpass Cleaning) 기준 중 가용접 및 각 패스 간 발생된 유해 슬래그와 산화 이물질을 완벽히 제거하기 위해 사용하는 표준 대표 도구 2가지는?","choices":["슬래그 해머 및 철솔","평줄 및 가스 토치","압착기 및 유압 잭","석필 및 강철 직각자"],"answerIndex":1,"answerText":"① 슬래그 해머 및 철솔","explain":"용접 이음부 홈 가공 영역 및 각 층 비드 사이에 고착된 다공성 유해 슬래그와 결함 성분을 완벽히 제거하기 위해 사용하는 표준 시공 도구는 '슬래그 해머'와 '철솔'이다."},{"n":26,"type":"mcq","stem":"용접 지그의 설계 및 선택 기준으로 볼 때 구속 지그가 갖추어야 할 최우선적 기계적 자격 요건은 무엇인가?","choices":["외력과 변형 하중에 저항하는 충분한 크기와 강성(Stiffness)","아크 열을 모재 중심 방향으로 완전히 반사시킬 수 있는 고광택 경면 표면","사용 후에도 잔류 자기를 보존하여 철분을 계속 흡착하는 자기 보존성","모재 수축 변형량에 맞춰 탄성 변형이 쉽게 일어나는 연질 구조체"],"answerIndex":1,"answerText":"① 외력과 변형 하중에 저항하는 충분한 크기와 강성(Stiffness)","explain":"가용접 및 정렬 치공구인 지그는 용접 중 발생하는 변형 모멘트 하중과 외력에 저항하여 고정해야 하므로 튼튼하고 굳건한 강력한 강성(Stiffness)과 구조적 크기를 확보해야 한다."},{"n":27,"type":"mcq","stem":"가용접 비드를 형성할 때, 본용접 전류값과 비교하여 가가접용 전류 세팅을 약간 높게 제어해야 하는 수동 조작 상의 이유는?","choices":["비드가 짧아 루트 초층에 용입 부족이 생기기 쉬우므로 이를 보완하기 위해","아크 전압의 미세 변동률을 회로에서 평활화하여 억제하기 위해","용착부 수소 성분의 가스 탈산 속도를 저온으로 냉각시키기 위해","송급 롤러의 마모를 줄이도록 와이어 송급 속도를 억제하기 위해"],"answerIndex":1,"answerText":"① 비드가 짧아 루트 초층에 용입 부족이 생기기 쉬우므로 이를 보완하기 위해","explain":"가용접 비드는 길이가 매우 짧아 급랭 결함과 용입 불량이 상시 수반되므로, 본용접 전류보다 전류값을 약간 높게 조정하여 깊은 초층 루트 용입 및 원활한 융합력을 강제로 얻어야 한다."},{"n":28,"type":"mcq","stem":"WPS상에서 가가접 예열 온도 한계를 설정할 때 결정적인 화학적 척도로 사용되며, 철강 재료 속 합금 성분을 탄소 함유량으로 환산 수식화하여 용접성(경화성)의 좋고 나쁨을 판정하는 변수는?","choices":["탄소 당량 (Ceq)","가스 수분 농도","와이어 돌출 길이 (ESO)","필릿 용접 각장 비율"],"answerIndex":1,"answerText":"① 탄소 당량 (Ceq)","explain":"모재의 가용접성 및 예열 온도 판정을 위해 철강 재료 내 합금 원소 함유 비율을 탄소 함유 가중치로 치환 수식화한 화학적 지표는 '탄소 당량(Ceq)'이다."},{"n":29,"type":"mcq","stem":"탄소 당량(Ceq)이 0.45%를 초과하고 0.6% 이하 범위의 탄소강 재료를 정밀 가가접하고자 할 때, 임시 가용접부의 마르텐사이트 균열을 억제하기 위한 표준 예열 온도의 정석 한계 범위는?","choices":["예열 필요 없음 (0℃ 시공)","40 ~ 70℃ 저온 예열","100 ~ 200℃ 정밀 가열 예열","300 ~ 400℃ 초고온 국부 예열"],"answerIndex":3,"answerText":"③ 100 ~ 200℃ 정밀 가열 예열","explain":"WPS 및 NCS 기준, 탄소 당량 Ceq 범위가 0.45% 초과 0.6% 이하 고강도 탄소강인 경우 수소 균열 결함을 방지하기 위해 100 ~ 200℃의 정밀 예열을 의무 적용한다."},{"n":30,"type":"mcq","stem":"가용접 시 시점 및 종점부(크레이터부)에 균열이 동반되기 쉬운 근본적인 물리 야금학적 원인에 대한 설명으로 가장 올바른 것은?","choices":["가용접은 비드 길이가 매우 짧아 용착부가 급랭되어 응력이 집중되기 때문","가스 유량이 순간적으로 급증하여 와이어 송급이 완전히 중단되기 때문","슬래그 해머의 타격 잔류 하중이 시·종점부에 그대로 누적되기 때문","이산화탄소 가스가 대기 중 산소보다 비중이 가벼워 가스 보호가 무력화되기 때문"],"answerIndex":1,"answerText":"① 가용접은 비드 길이가 매우 짧아 용착부가 급랭되어 응력이 집중되기 때문","explain":"가용접은 비드의 물리적 용착 길이가 극도로 짧아 입열량 대비 주변 모재로의 열 전도와 빼앗김이 현격히 빨라져 급속 가열 및 극랭 냉각 변태가 일어나 열적 응력이 가중되기 때문이다."},{"n":31,"type":"mcq","stem":"용접 구조물 제작 시, 용접절차사양서에 기재된 내용 중 반드시 용접 작업 전에 검토하여 환경 조건 및 시공성 지침을 확인해야 하는 항목이 아닌 것은?","choices":["모재의 기계적 성질 및 화학적 규격 (KS, ASME 등)","용접 장비의 극성 배선 및 가스 유량 세팅치","용접 감독자의 자격증 발행 연도 및 학력 정보","안전보건관리 지침 및 국소 배기장치의 가동 속도"],"answerIndex":3,"answerText":"③ 용접 감독자의 자격증 발행 연도 및 학력 정보","explain":"WPS 해독 및 검토 단계에서 용접 조건과 모재 합금 기계적 성질, 전류 전압 가스값 등을 검토하는 것은 본 용접 시공의 핵심이나, 용접 책임자의 학력이나 지극히 개인적인 사적 정보는 검토 대상에서 당연 배제된다."},{"n":32,"type":"mcq","stem":"WPS상에서 표기되는 용어 중 'CONTACT TUBE TO WORK DIST.'가 의미하는 정확한 치수 정의와 표준 범위는?","choices":["팁과 모재 간 와이어 돌출 길이 (약 15 ~ 25mm)","토치 노즐과 세라믹 가이드 간 이격 거리","분전반 차단기와 용접기 본체 간 배선 케이블 길이","자동전격방지기 2차 접지선 체결 단자 깊이"],"answerIndex":1,"answerText":"① 팁과 모재 간 와이어 돌출 길이 (약 15 ~ 25mm)","explain":"WPS 기재 용어 중 'CONTACT TUBE TO WORK DIST.'는 전류를 송급하는 콘택트 팁 선단과 피용접물(모재) 사이의 와이어 노출 거리(돌출 길이)를 뜻하며 표준 15 ~ 25mm로 제어한다."},{"n":33,"type":"mcq","stem":"가용접 조립 작업 완료 후 도면에 제시된 치수 허용 한계 부합 여부를 측정하여 판정하기 위해 사용하는 가장 핵심적인 정밀 용접 전용 측정 공구는?","choices":["다이얼 게이지","만능 용접게이지","수동 해머 및 석필","외경 마이크로미터"],"answerIndex":2,"answerText":"② 만능 용접게이지","explain":"가용접 및 본용접 전후의 다리 길이, 각장, 루트 간격, 개선 각도, 단차 치수 등을 한눈에 확인하여 합격 공차를 판정할 수 있도록 고안된 전용 다목적 기계 측정기는 '만능 용접게이지'이다."},{"n":34,"type":"mcq","stem":"가용접 후 가조립 상태를 정밀 진단한 결과, 예상보다 심각한 단차와 뒤틀림 변형이 감지되었다. 이때 시공자가 수행해야 하는 올바른 수정 조치 순서는?","choices":["클램프와 유압 잭, 가열 토치를 동원해 단차를 보정한 뒤 재정렬 고정한다.","이면 비드 부분에 용가재를 수작업으로 채워 넣어 외관상 평평하게 가린다.","용접 속도를 2배 이상 빠르게 올린 후 단층 비드로 한 번에 마감한다.","변형을 그대로 무시하고 본용접의 고전류로 밀어붙여 억지로 녹인다."],"answerIndex":1,"answerText":"① 클램프와 유압 잭, 가열 토치를 동원해 단차를 보정한 뒤 재정렬 고정한다.","explain":"부품 치수가 뒤틀린 결함 상태에서는 본용접을 개시하면 절대 안 되며, 가용접부를 조심스럽게 그라인딩 제거 후 수동 클램프 및 가열 토치, 유압기구를 동원하여 어긋남 각도를 보정한 뒤 재정렬해야 한다."},{"n":35,"type":"mcq","stem":"가용접 시 본용접 전용 수랭식 동판(Backing Copper Plate)을 용접선 이면 또는 측면에 밀착 배치하는 공학적 목적은 무엇인가?","choices":["이산화탄소 보호 가스의 분출 소모량을 50% 이상 대폭 절감하기 위해","와이어 끝단의 마모와 콘택트 팁 폐쇄 트러블을 차단하기 위해","아크의 집중률을 고전압 상태로 끌어올려 계속 유지하기 위해","용접 입열을 주변으로 도열시켜 모재의 열축적 변형을 억제하기 위해"],"answerIndex":4,"answerText":"④ 용접 입열을 주변으로 도열시켜 모재의 열축적 변형을 억제하기 위해","explain":"수랭 또는 공랭식 동판(Backing Plate)은 아크 열을 금속 구리의 높은 열전도성을 활용하여 신속하게 주변으로 도열(방산)시켜 줌으로써 과도한 국부 열축적 변형 및 뒤틀림을 억제 소멸시킨다."},{"n":36,"type":"short","stem":"WPS(용접절차사양서)에 기재되는 항목 중 'Preheat Temp. Min.'이 나타내는 구체적인 공학적 최소 온도의 명칭을 우리말로 쓰시오.","choices":[],"answerIndex":null,"answerText":"최소 예열 온도 (Minimum Preheat Temperature)","explain":"WPS 상에서 규격 모재의 급랭 경화 및 균열 결함을 억제하기 위해 시공 전에 반드시 확보해야 하는 최하단 안전 한계 가열 온도이다."},{"n":37,"type":"short","stem":"가용접 시 열 수축에 대응하기 위하여 두 판재의 맞대기 단면 사잇단에 삽입하여 일정한 홈 간격을 유지시키는 임시 강제 칩 치공구의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"끼움쇠 (Spacer / Gap spacer)","explain":"맞대기 이음에서 수축 하중에 대응하여 정확하고 균일한 루트 간격을 수렴 고정하기 위해 가접 정렬 시 틈새에 삽입하는 쐐기형 강재 칩이다."},{"n":38,"type":"short","stem":"모재 두께(t)가 12mm인 중판의 맞대기 가용접을 조립하고자 한다. 이때 NCS 가접 표준 길이 수칙에 의거하여 시공해야 하는 한 개 가접 비드의 표준 최소 길이(mm)는 얼마인가?","choices":[],"answerIndex":null,"answerText":"40mm","explain":"NCS 가용접 길이표에서 t=12mm는 3.2mm 초과~25mm 이하 중판이라 1개 가접 비드 최소 길이는 40mm다. 자료에 따라 두께의 2~3배(약 30mm)로 보기도 한다."},{"n":39,"type":"short","stem":"가용접 및 본용접 작업 시, 모재 두께 t가 25mm를 초과하는 중후판 영역에서 준수해야 하는 한 개 가접 비드의 표준 최소 길이(mm)는 얼마인가?","choices":[],"answerIndex":null,"answerText":"50mm","explain":"NCS 가용접 비드의 길이 기준 <표 3-5>에 의거하여, 모재 두께 t가 25mm를 초과하는 후판(thick plate)의 가가접 최소 비드 길이는 50mm 이상이다."},{"n":40,"type":"short","stem":"가용접 간격 공식 '15t ~ 30t' 수식을 적용할 때, 판 두께(t)가 6.0mm인 탄소강판 맞대기 이음에서 배치할 수 있는 가용접 비드 간의 적정 피치 간격 범위(mm)를 구체적인 수치로 산출하여 쓰시오.","choices":[],"answerIndex":null,"answerText":"90 ~ 180mm","explain":"가용접 적정 피치 간격 공식인 15t ~ 30t에 모재 두께 t = 6.0mm를 각각 대입 연산하면, 15 * 6 = 90mm부터 30 * 6 = 180mm 간격 범위가 정밀 산출된다."},{"n":41,"type":"short","stem":"용접부 결함을 유발하는 가연성 물질과 부식 원인을 차단하기 위해 가용접 시공 직전 개선 그루브 사면 양측 약 20mm 영역까지 완전히 그라인딩 제거해야 하는 3대 표면 유해 이물질(또는 스케일)을 쓰시오.","choices":[],"answerIndex":null,"answerText":"기름(유분), 수분(습기), 녹(산화 스케일)","explain":"개선 그루브 사면 양측 20mm 영역까지 이들 불순물이 고착되어 있으면 아크 열에 의해 수소 가스로 해리 변태하여 비드 내부 기공 및 저온 크랙을 직접 유발한다."},{"n":42,"type":"short","stem":"가용접 후 가조립 상태를 정밀 점검할 때, 개선 설계 그루브의 기하학적 형태를 결정짓는 핵심적인 3대 조립 기하학 요소(WPS 표기 기준)를 쓰시오.","choices":[],"answerIndex":null,"answerText":"루트 면 (Root face), 루트 간격 (Root gap), 개선 각도 (Groove angle)","explain":"WPS <그림 3-24> 및 도면에 명시되는 맞대기 그루브 조립 정렬 상태를 규정하는 절대적인 3대 기하학적 형상 치수 요소이다."},{"n":43,"type":"short","stem":"가용접부의 급랭 조직 형성을 막기 위해, 고탄소강이나 합금강 시공 시 가접할 부위를 본용접에 준하여 토치 등으로 미리 데워주는 열적 관리 공정의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"예열 (Preheating)","explain":"모재 가접부와 주변 열영향부의 급랭 냉각 속도를 지연시켜 마르텐사이트 변태 경화를 방지하고 내부 수소 성분을 방출 소거시키는 국부 온도 가열 작업이다."},{"n":44,"type":"short","stem":"용접 구조물 조립 공정에서 판 부재 상호 간의 수평 단차(어긋남)를 수정하고 각변형과 뒤틀림을 방지하기 위해 임시로 취부하는 일시 구속용 강재 치공구의 정밀 명칭을 영어 또는 국문으로 쓰시오.","choices":[],"answerIndex":null,"answerText":"스트롱백 (Strong back / 뒤틀림 방지재)","explain":"판재 상호 간의 단차 및 어긋남을 기계적으로 구속 및 정렬하고 용접 수축 각변형 뒤틀림을 방지하기 위해 일시 가접하는 대표적인 변형 방지 지그이다."},{"n":45,"type":"short","stem":"용접 시작점의 기공과 종점의 크레이터 결함을 완전히 소거하기 위해 용접 홈 양단 바깥에 임시로 부착하여 용접을 개시 및 종료하는 보조 탭판의 정식 영어 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"런오프 탭 (Run-off Tab / 엔드 탭)","explain":"용접선의 시작점과 종점부에서 필수적으로 수반되는 스타트 및 크레이터 결함을 모재 밖으로 유도 소멸시키기 위해 이음부 양단에 부착하는 임시 치공구판이다."},{"n":46,"type":"short","stem":"WPS상에서 가용접 및 다층 용접 층간 청소(Interpass Cleaning) 항목에 규정된 대표적인 기계적 제거 및 청소 요령 두 가지를 우리말로 쓰시오.","choices":[],"answerIndex":null,"answerText":"솔질 (Brushing / 와이어 브러싱), 연삭 (Grinding / 그라인딩)","explain":"WPS상에 규정된 'INITIAL OR INTERPASS CLEANING' 세부 제거 수칙으로, 가접부 및 패스 간 잔류 불용성 결함 물질을 기계적으로 깎아내는 정석 방법이다."},{"n":47,"type":"short","stem":"가용접 지그의 강성이 너무 크거나 과도하게 강제 구속할 경우, 수축 거동이 차단되어 용착금속 내부와 열영향부(HAZ)에 누적되어 균열을 초래하는 응력의 정식 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"잔류응력 (Residual stress / 잔류 인장응력)","explain":"외력을 완전히 제거한 후에도 고정 가압된 용접 구조체 내부에 응집 누적되어 고착된 응력으로, 균열(Crack) 및 지연 파괴를 직접 유발하는 주원인이다."},{"n":48,"type":"short","stem":"가용접 비드를 배치할 때 결함 방지를 위해 배치를 철저히 피해야 하는 응력 집중부 및 끝단 모서리를 제외하고, 용접 비드의 아크 개시점과 최종 크레이터가 만나는 부분의 명칭을 각각 쓰시오.","choices":[],"answerIndex":null,"answerText":"아크 스타트(시점) 및 크레이터(종점)","explain":"결함 발생 위험이 극도로 높아 가용접 배치를 완벽히 기피하고 본용접 시 백그라인딩 연마 가공이 상시 수반되는 비드의 초시 부분과 응고 수축부이다."},{"n":49,"type":"short","stem":"NCS 학습모듈 분류 기준상, 능력단위 'CO₂용접 가용접 작업'의 고유 NCS 분류 코드 번호를 정확히 기재하시오.","choices":[],"answerIndex":null,"answerText":"1601050205_21v4","explain":"대분류16 재료 - 중분류01 금속재료 - 소분류05 용접 - 세분류02 CO₂용접의 05번 능력단위이므로 코드는 1601050205_21v4(2021년 4차 개정)이다."},{"n":50,"type":"short","stem":"WPS상에서 표기되는 용어 중 'INITIAL OR INTERPASS CLEANING'이 의미하는 한국어 명칭을 정확히 쓰시오.","choices":[],"answerIndex":null,"answerText":"초층 및 층간 청소 (Initial or Interpass cleaning)","explain":"WPS상에 명시되어 각 용접 패스 및 층간을 시공하기 직전, 와이어 브러시나 수동 그라인더를 동원하여 슬래그와 결함을 깎아내게끔 의무화한 계통 공정 수칙이다."}]},"13":{"unit":13,"title":"솔리드와이어 필릿용접","code":"LM1601050212","group":"CO₂·솔리드·FCAW","theory":[{"t":"h2","v":"제1부: 솔리드와이어 필릿용접 핵심 공학이론"},{"t":"p","v":"솔리드와이어 필릿용접(LM1601050212)은 기계 구조물 및 건설 현장에서 가장 널리 쓰이는 가스 메탈 아크 용접(GMAW/CO2) 기법입니다. 본 이론 요약집은 T형 필릿용접부의 설계 기하학, 송급 장치 제어, 외관 규격, 기계적 시험 기준을 다룹니다."},{"t":"h3","v":"1. T형 필릿용접의 구조 설계 및 주요 치수 계산"},{"t":"p","v":"T형 필릿용접은 수평판 위에 수직판을 직각으로 배치하고, 그 모서리 접합부에 삼각형 모양의 단면을 지닌 용접 비드를 형성하는 기법입니다. 이때 강도 계산과 설계 적합도를 판정하는 3대 주요 치수는 다음과 같습니다."},{"t":"li","v":"다리 길이 (각장, Leg Length - h): 용접 루트부(Root)에서 각 모재 표면에 배치된 비드의 끝단(Toe, 토우)까지의 거리입니다. T형 대칭 필릿의 경우 두 다리 길이가 같도록(등각장) 조절해야 합니다."},{"t":"li","v":"이론 목두께 (Theoretical Throat - a): 필릿용접부 단면 내의 가상 직각이등변삼각형 루트점에서 빗변(표면선)에 내린 최단 거리(수선)를 의미합니다."},{"t":"li","v":"실제 목두께 (Actual Throat - d): 실제 기계적으로 형성된 용입부 끝점에서부터 비드 표면 가장 돌출된 부위까지의 최단 거리로, 이론 목두께에 실제 용입 깊이를 더한 값입니다."},{"t":"p","v":"★ [이론 목두께 산출 공식]"},{"t":"p","v":"수평재와 수직재 사이의 접합각이 90°인 대칭형 등각장(각장 = h)일 때, 기하학적 이론 목두께(a)는 다음 삼각비 공식으로 도출됩니다:"},{"t":"p","v":"a = h * cos(45°) ≒ 0.707 * h"},{"t":"h3","v":"2. 솔리드와이어 필릿용접의 자세별 표준 작업 조건"},{"t":"p","v":"GMAW 탄소강 솔리드와이어(Ø1.2mm, YGW11)를 사용하여 탄소강(SS275) 평판 필릿을 제작할 때, 중력의 영향과 용착 제어를 위해 자세별로 다음과 같이 용접 변수(전류, 전압)를 정밀하게 튜닝해야 합니다."},{"t":"table","rows":[["용접 자세 (Position)","용접 전류 (I, Ampere)","아크 전압 (V, Volt)","보호가스 유량 (L/min)"],["아래보기 (1F)","180 ~ 220 A","18 ~ 22 V","15 ~ 20 L/min"],["수 평 (2F)","160 ~ 200 A","18 ~ 21 V","15 ~ 20 L/min"],["수 직 (3F)","120 ~ 150 A","16 ~ 19 V","15 ~ 20 L/min"],["위보기 (4F)","130 ~ 160 A","17 ~ 20 V","15 ~ 20 L/min"]]},{"t":"h3","v":"3. 수작업 토치 진행 각도 및 와이어 송급 제어"},{"t":"p","v":"필릿용접 작업의 균일성 조작과 스패터 억제를 위해서는 토치의 각도 제어가 생명입니다. 대칭형 T-이음에서 용접 토치 작업각은 45°를 일정하게 조준하고, 용접 비드가 뻗어나가는 진행 방향에 대해서는 70°~80°의 경사각을 유지(후진법 기준)하는 것이 스패터가 적고 깊은 용입을 확보하는 가장 정석적인 방법입니다."},{"t":"p","v":"또한, 솔리드와이어 송급 방식은 와이어 송급 모터와 롤러를 장비 본체 직후에 배치해 긴 튜브 내부로 밀어내는 '푸시 방식', 토치 내부에 초소형 모터를 탑재해 알루미늄이나 연질 와이어를 당겨내는 '풀 방식', 그리고 이 두 모터를 동기화 제어하여 상호 당겨주고 밀어주는 '푸시-풀 방식'으로 구분됩니다."},{"t":"h3","v":"4. 필릿용접부 규격 검사 및 파면(파단) 시험"},{"t":"p","v":"과정평가형 외부평가 외관 및 기계시험 합격을 위해서는 다음과 같은 구체적 정량 치수들을 엄수해야 합니다."},{"t":"li","v":"허용 각장 편차 한계 규격: 도면에 표기된 설계 각장(h)에 대비하여, 실제 제작 후 측정값은 -20%에서 +50% 공차 범위 이내여야 합니다. (예: 설계 각장 10mm인 경우 실제 측정된 최소 다리길이는 8.0mm 이상, 최대 15.0mm 이하여야 규격 감점을 회피함)."},{"t":"li","v":"파면시험(Fracture Test) 합격 기준: T형 시편의 이면 방향에서 기계적 외력을 인가하여 가압 파단시킨 후, 단면의 루트부 융착 깊이를 검증합니다. 이때 두 모재가 맞닿은 루트부의 완벽한 융착(용입) 누적 길이가 전체 시편 용접 길이의 최소 50% 이상을 만족해야 합격 판정을 받습니다."},{"t":"h2","v":"제2부: 대표 실전 50제 평가 및 해설"},{"t":"p","v":"본 문제집은 고등학교 3학년 과정평가형 용접산업기사 실기 대비를 목적으로 편찬되었습니다. 중복이나 무의미한 템플릿성 중첩 문제를 완벽하게 전수 배제하고, 공학적 타당성이 검증된 객관식 35문항과 핵심 단답식 주관식 15문항으로 전면 개정(v2)하여 탑재하였습니다."},{"t":"p","v":"객관식 4지선다형 평가 문항 (1 ~ 35번)"}],"questions":[{"n":1,"type":"mcq","stem":"와이어 송급 시스템 중 송급 장치(피드 롤러와 모터)가 전극 와이어 스풀 직후에 위치하여 케이블 튜브 안쪽으로 와이어를 밀어내는 정석적인 방식을 무엇이라 하는가?","choices":["푸시(Push) 방식","풀(Pull) 방식","푸시-풀(Push-Pull) 방식","유도(Induction) 방식"],"answerIndex":1,"answerText":"① 푸시(Push) 방식","explain":"피드 롤러가 와이어 스풀 직후에 있어 토치 끝으로 밀어주는 구동 방식을 '푸시 방식'이라고 부릅니다. 이 방식은 Ø1.2mm 등 기계적 강도가 우수한 탄소강 솔리드와이어 송급에 가장 널리 쓰이는 표준 방식입니다."},{"n":2,"type":"mcq","stem":"수평재와 수직재가 90° 직각을 이루는 대칭 T형 필릿용접부에서 등각장의 길이를 h라고 명명할 때, 설계 강도 평가의 기준이 되는 이론 목두께(a)를 산출하는 정식 기하학 수식은?","choices":["a = h * sin(30°)","a = h * cos(30°)","a = h * cos(45°)","a = h * tan(45°)"],"answerIndex":3,"answerText":"③ a = h * cos(45°)","explain":"직각이등변삼각형 단면을 기하학적으로 해석하면 꼭지각 90°의 이등분선(45°) 수선 길이가 이론 목두께(a)가 되므로, 삼각비 cos(45°) ≒ 0.707을 대입한 a = h * cos(45°)가 성립합니다."},{"n":3,"type":"mcq","stem":"T형 필릿용접의 이론 목두께(a)와 다리길이(각장, h)의 실제 기하학 수식인 a ≒ 0.707h를 적용할 때, 설계 도면에 지정된 각장(h)이 12.0 mm라면 이 용접부의 공학적 이론 목두께는 얼마인가?","choices":["7.07 mm","8.48 mm","9.54 mm","10.21 mm"],"answerIndex":2,"answerText":"② 8.48 mm","explain":"공식 대입: a = 12.0 mm * 0.707 = 8.484 mm 입니다. 따라서 가장 근사한 수치는 ②번 8.48 mm 입니다."},{"n":4,"type":"mcq","stem":"솔리드와이어 수평 필릿용접(2F) 시공 시, 비드 상단 가장자리에 모재가 가파르게 녹아 파여 들어간 깊은 홈(언더컷) 결함이 빈발하였다. 이에 대한 대표적인 현장 해결책으로 옳지 않은 것은?","choices":["아크 전압을 과도하게 높여 아크를 넓게 확산시킨다.","토치 진행속도가 지나치게 빠르지 않도록 속도를 안정되게 유지한다.","토치 각도를 조절하여 수직판 측의 열량 공급을 균일하게 조화시킨다.","용접 전류를 기준값보다 다소 낮추어 입열량을 제어한다."],"answerIndex":1,"answerText":"① 아크 전압을 과도하게 높여 아크를 넓게 확산시킨다.","explain":"아크 전압이 과도하게 높으면 아크의 퍼짐이 커지고 비드가 얇고 넓어지면서 표면 가장자리가 잘 녹아 언더컷 결함을 유발하는 원인이 될 수 있습니다. 적정 아크 전압 세팅이 필요합니다."},{"n":5,"type":"mcq","stem":"탄산가스 아크용접에서 용접 속도와 아크 전압이 일정한 환경 하에 용접 전류를 연속적으로 높였을 때, 용접 비드의 형상 및 용입에 발생하는 변화로 가장 적합한 설명은?","choices":["용입 깊이가 얕아지며 비드 폭이 심하게 좁아진다.","용입 깊이가 점차 깊어지고 용착 속도가 증가한다.","비드 높이가 비정상적으로 납작해지며 스패터가 완전히 소멸한다.","오버랩 결함이 폭발적으로 발생하며 아크가 심하게 흔들린다."],"answerIndex":2,"answerText":"② 용입 깊이가 점차 깊어지고 용착 속도가 증가한다.","explain":"용접 전류는 용입 깊이 및 와이어 용착량에 정비례합니다. 따라서 전압과 속도가 일정할 때 전류를 증가시키면 아크 물리력 증대로 용입이 깊어지며 시간당 녹아내리는 와이어 양(용착 속도)이 늘어납니다."},{"n":6,"type":"mcq","stem":"과정평가형 용접산업기사 실기 외부평가 치수 규격에 근거하여, 설계도상 각장 치수가 h = 8.0 mm로 제시되었을 때 실제 측정한 각장값이 감점 기준을 회피하여 합격 처리되는 유효 측정 범위는?","choices":["5.0 mm ~ 10.0 mm","6.4 mm ~ 12.0 mm","7.0 mm ~ 11.5 mm","8.0 mm ~ 14.0 mm"],"answerIndex":2,"answerText":"② 6.4 mm ~ 12.0 mm","explain":"NCS 필릿용접의 다리길이 허용 오차 한계 규격은 -20%에서 +50%입니다. 최솟값: 8.0 * (1 - 0.2) = 6.4 mm 최댓값: 8.0 * (1 + 0.5) = 12.0 mm 입니다."},{"n":7,"type":"mcq","stem":"T형 필릿용접부의 기계적 파괴 시험에 속하는 파면(파단) 시험 합격 판정을 받기 위한 누적 루트부 용착(용입) 깊이 비율의 국가 규격 한계치는 전체 시험편 용접 유효길이 대비 최소 몇 % 이상이어야 하는가?","choices":["30% 이상","40% 이상","50% 이상","60% 이상"],"answerIndex":3,"answerText":"③ 50% 이상","explain":"필릿용접 파면시험 규정상 강제로 파단시킨 단면을 관찰했을 때, 완전하게 루트 융착 및 용입이 이루어진 구간의 누적 합계 길이가 전체 용접부 유효 길이의 50% 이상이어야 정상 합격 처리됩니다."},{"n":8,"type":"mcq","stem":"직류 용접 전원을 이용한 가스메탈아크용접(GMAW) 진행 시, 도선 주위에 불균형한 자력선이 생성되어 아크가 불꽃 쏠림 현상(자기 쏠림)을 나타낸다. 이에 대한 공학적 해결책으로 가장 부적절한 것은?","choices":["접지선(어스선)의 체결 위치를 용접 진행 방향의 반대 측으로 교체 결속한다.","용접부의 시점과 종점에 탭판(Run-off Tab)을 임시 결합한다.","용접 토치를 아크 쏠림이 일어나는 반대 방향으로 약간 기울여 조작한다.","접지 결선 시 어스 클램프를 2개 이상 설치하여 전류 통로를 다원화 분산한다."],"answerIndex":1,"answerText":"① 접지선(어스선)의 체결 위치를 용접 진행 방향의 반대 측으로 교체 결속한다.","explain":"자기 쏠림(아크 쏠림) 발생 시, 접지 체결점을 용접 진행방향 쪽으로 옮겨 결속하거나, 전류 경로를 분산하기 위해 접지 클램프를 다중 배치하는 것이 정석 대책입니다. 진행 방향 반대측으로 옮기면 쏠림이 유발될 수 있습니다."},{"n":9,"type":"mcq","stem":"GMAW/CO2 수평 필릿용접(2F) 수작업 조작 시, 용입이 우수하고 스패터 비산을 최소화하기 위해 권장되는 토치 작업각과 진행각(후진법 기준)의 조합으로 가장 옳은 것은?","choices":["작업각 30°, 진행각 50° ~ 60°","작업각 45°, 진행각 70° ~ 80°","작업각 60°, 진행각 80° ~ 90°","작업각 90°, 진행각 45° ~ 55°"],"answerIndex":2,"answerText":"② 작업각 45°, 진행각 70° ~ 80°","explain":"T형 수평 필릿 작업 시 수평판과 수직판 사이의 등분선인 작업각 45°를 고르게 조준하고, 진행 방향을 향해 토치를 70°~80° 기울이는 것이 슬래그 제어와 아크 안정에 가장 이상적입니다."},{"n":10,"type":"mcq","stem":"GMAW 보호가스로 이산화탄소(CO2) 100% 대신 아르곤(Ar) 80% + 이산화탄소(CO2) 20%의 혼합 가스를 충전 가동할 때 얻어지는 대표적인 물리적 시공 장점은 무엇인가?","choices":["용입 깊이가 아세틸렌가스보다 급격히 늘어난다.","아크의 스프레이 이행이 가능해져 스패터 비산량이 현저히 줄어들고 비드가 수려해진다.","용접부 주변의 냉각 속도를 낮추어 경도를 의도적으로 극대화한다.","아크 이온화 전압이 급속도로 올라가 무부하 전압을 높일 수 있다."],"answerIndex":2,"answerText":"② 아크의 스프레이 이행이 가능해져 스패터 비산량이 현저히 줄어들고 비드가 수려해진다.","explain":"Ar 비율이 80% 이상 섞인 혼합가스를 사용하게 되면 아크 특성이 단락 이행에서 미세 입자 스프레이 이행 형태로 유도될 수 있어, 스패터 비산량이 급격히 감소하고 대단히 곱고 수려한 비드가 완성됩니다."},{"n":11,"type":"mcq","stem":"가스 실드 아크 용접용 전극 와이어 규격인 'YGW 11'에서 문자 'Y'와 'GW'가 뜻하는 기하학적 의미 및 기술적 정의의 명칭은 무엇인가?","choices":["Y: 피복재 계통 구분, GW: 중력식 자동 용접기","Y: 가스텅스텐아크용접용, GW: 수평 자세 용접","Y: 가스 실드 용접용 솔리드와이어, GW: 가스 실드 아크 용접","Y: 고장력강 심선재, GW: 슬래그 형성형 피복제"],"answerIndex":3,"answerText":"③ Y: 가스 실드 용접용 솔리드와이어, GW: 가스 실드 아크 용접","explain":"KS 표준 기호 체계상 'Y'는 가스 실드 아크 용접용 솔리드와이어(Solid Wire)를 총칭하고, 'GW'는 가스 실드 아크 용접(Gas Shielded Arc Welding) 방식을 명시합니다."},{"n":12,"type":"mcq","stem":"작업장 안전보건관리에 의거하여 탄산가스(CO2) 가압 충전 용기의 취급 요령으로 가장 부적절한 안전 조치는?","choices":["가스 용기 보관소는 상온 40℃ 이하의 통풍이 수월하고 직사광선이 닿지 않는 서늘한 곳이어야 한다.","전도(넘어짐) 사고를 방지하기 위해 쇠사슬이나 전용 고정대를 이용하여 수직 기립식으로 단단히 고정한다.","잔량을 남김없이 쓰기 위해 용접 작업 전에 고압 가스 용기를 바닥에 눕혀 가동한다.","밸브의 개폐 동작 시에는 기름이 묻지 않은 전용 공구를 사용해야 하며 절대로 유질성이 묻어서는 안 된다."],"answerIndex":3,"answerText":"③ 잔량을 남김없이 쓰기 위해 용접 작업 전에 고압 가스 용기를 바닥에 눕혀 가동한다.","explain":"액화 탄산가스 용기를 눕혀서 가동하면 액상의 이산화탄소가 기화되지 않은 채 조정기로 직접 분출되어 레귤레이터 동결, 손상 및 화재 유발의 중대한 위험이 초래됩니다. 반드시 기립 고정 보관해야 합니다."},{"n":13,"type":"mcq","stem":"용접 기하 설계 도면에서 용접 보조기호 중 완성된 용접부의 표면을 그라인더 가공으로 부드럽게 마감하라는 의미의 가공 처리 기호는?","choices":["H","M","C","G"],"answerIndex":4,"answerText":"④ G","explain":"치핑(Chipping) 마감은 C, 그라인딩(Grinding) 마감은 G, 해머링(Hammering) 마감은 H, 기계 머시닝(Machining) 마감은 M으로 각각 규정되어 표기됩니다."},{"n":14,"type":"mcq","stem":"필릿용접 비드의 표면 윤곽이 평면 기준 안쪽으로 지나치게 파여 들어간 오목형(Concave) 비드가 형성되었을 때의 역학적 단점으로 가장 옳지 않은 것은?","choices":["정적 인장 강도가 저하되어 허용하중 한계 한도가 축소된다.","구조 설계 강도 미달로 규격 검사 시 즉시 감점 및 탈락 원인이 된다.","비드 중심부 목두께가 얇아져 인장하중 부하 시 전단 크랙에 매우 취약해진다.","응력 집중 계수가 수렴되어 고장력 용접부의 피로 수명이 극대화된다."],"answerIndex":4,"answerText":"④ 응력 집중 계수가 수렴되어 고장력 용접부의 피로 수명이 극대화된다.","explain":"오목형 비드는 비드 중앙부의 유효 목두께가 얇아지기 때문에 기계적으로 인장 및 전단 강도가 현저히 저하되고, 모재 경계부 및 중앙에 응력 집중을 가속하여 고장력 이음부에 크랙을 유발하는 중대 원인이 됩니다."},{"n":15,"type":"mcq","stem":"GMAW 와이어 송급 시스템의 와이어 가압 롤러(Feed Roller) 조절 노브를 필요 이상으로 강력한 압력으로 조였을 때 초래되는 기계적 트러블은 무엇인가?","choices":["와이어 송급 속도가 정상 속도 대비 2배 이상 폭발적으로 빨라진다.","연질의 와이어 단면이 찌그러져 납작해지면서 콘택트 팁 내부에서 잼(Jam)이 유발된다.","아크 전압이 과도하게 낮아져 전격방지기가 강제로 가동된다.","송급 장치 내부 모터가 완전히 역회전하여 스풀이 풀려 버린다."],"answerIndex":2,"answerText":"② 연질의 와이어 단면이 찌그러져 납작해지면서 콘택트 팁 내부에서 잼(Jam)이 유발된다.","explain":"송급 가압 조절 노브를 과도한 토크로 조이게 되면 와이어가 원형 단면을 잃고 찌그러지며 납작해집니다. 이 납작해진 와이어가 미세한 구멍인 콘택트 팁 구멍을 통과하지 못해 팁 내부에서 가로막히고 걸려(Jam) 와이어 송급이 완전히 중단되는 심각한 오작동의 근본 원인이 됩니다."},{"n":16,"type":"mcq","stem":"T형 필릿용접 운봉 조작 시, 열 축적이 원활하지 않고 대류 열방출이 수평판보다 극심한 수직벽 측에 보다 고른 아크 열량을 인가하여 비드 처짐을 방지하기 위해 조작하는 운봉 기법은?","choices":["나선형(Spiral) 운봉법","전진 1자형 운봉법","수직판 측 일시 정지 T형 위빙법","고속 좌우 지그재그 운봉법"],"answerIndex":3,"answerText":"③ 수직판 측 일시 정지 T형 위빙법","explain":"T형 필릿용접의 수동 위빙 조작 시 열량 공급 불균형을 방지하기 위해 열 축적이 적고 냉각 속도가 상대적으로 빠른 수직판 쪽에서 잠시 운봉을 멈추었다가(Dwell), 수평판 쪽으로 내려오는 운봉 조작이 정석입니다."},{"n":17,"type":"mcq","stem":"탄산가스 아크 용접기 제어 패널에서 '크레이터 유(ON)' 상태로 작동 모드를 조정한 후 본용접을 끝내고 스위치를 완전히 놓았을 때 나타나는 전기적 시퀀스 제어 거동은?","choices":["설정된 저전류·저전압으로 출력이 낮아져 크레이터를 메울 여유를 준다.","와이어 송급 모터가 역방향으로 고속 역회전하여 와이어를 되감아 흡입한다.","보호가스 솔레노이드 밸브가 아크 소멸 5초 전에 강제 차단된다.","용접기 1차측 주전원 메인 차단기가 연동되어 즉시 내려간다."],"answerIndex":1,"answerText":"① 설정된 저전류·저전압으로 출력이 낮아져 크레이터를 메울 여유를 준다.","explain":"크레이터 ON 기능은 본용접 종료부의 수축 함몰(크레이터) 결함을 메우기 위해 토치 버튼을 한번 놓았을 때 사전에 기밀 세팅된 소전류·소전압(본 전류의 약 60~70% 수준)으로 자동 감압 출력을 가동하여 용접사가 이 부위를 안전하게 채울 수 있도록 지원하는 지능형 시퀀스입니다."},{"n":18,"type":"mcq","stem":"GMAW/CO2 반자동 용접기 작동 시, 와이어 송급 제어 노브를 조작하여 송급 속도(WFS)를 고속으로 증가시켰을 때 이에 직접적으로 연동되어 상승 반응을 보이는 전기 용접 인자는?","choices":["용접 전류 (Welding Current)","아크 안정 저항치 (Resistance)","1차 전원 사용 효율 (Power Factor)","무부하 전압 (Open Circuit Voltage)"],"answerIndex":1,"answerText":"① 용접 전류 (Welding Current)","explain":"정전압 특성(CV)을 지닌 CO2 용접기에서는 와이어 송급 속도가 증가하면 단위 시간당 공급되는 금속 전극량이 많아져 아크 단락 및 통전량이 늘어납니다. 따라서 용접 전류계 지침은 와이어 송급 속도에 직접 정비례하여 수치가 동반 상승합니다."},{"n":19,"type":"mcq","stem":"수평 필릿용접(2F) 시공 과정 중 비드 외관의 형상이 불량하게 만들어지는 기하학적 형태 중, 중력의 거동에 의해 용융 금속이 수평 아래판으로 다소 흘러내려 처지고 수직벽 경계면 상단부에 골이 파여 발생하는 수하 결함은?","choices":["언더컷 및 처짐 비드","용입 부족 및 오버랩","은폐 균열 및 표면 선상 기공","크레이터 미세 균열"],"answerIndex":1,"answerText":"① 언더컷 및 처짐 비드","explain":"수평 필릿용접 시 비드가 아래 수평판 쪽으로 처져 넓어지면, 자연적으로 수직벽 상부 토우 부근에는 용융 채움재 공급이 부족해져 모재 가장자리가 파인 형태인 상단 언더컷(Undercut)과 하단 비드 흘러내림(Sagging)이 일어납니다."},{"n":20,"type":"mcq","stem":"GMAW 용접 작업 중에 토치 앞부분의 가스 노즐 내부에 가혹하게 들러붙어 적층된 금속 스패터(Spatter) 덩어리를 정기적으로 긁어내 청소하지 않았을 때 초래되는 용접 결함 거동은?","choices":["전격방지기용 마그네틱 퓨즈가 과전류로 과열되어 강제 용단","와이어의 경도가 급격히 팽창하여 송급기 모터의 강제 역회전","아크 전압의 미세 변동이 완전히 소멸되어 정전압 상태화","보호가스 흐름 방해로 대기가 유입되어 기공(Blowhole) 집단 형성"],"answerIndex":4,"answerText":"④ 보호가스 흐름 방해로 대기가 유입되어 기공(Blowhole) 집단 형성","explain":"노즐 내부 스패터 적층은 보호가스 분출 기류를 불규칙한 와류 형태로 흐트러뜨려 정상 실드막을 훼손시킵니다. 이로 인해 공기 중의 질소, 산소가 급속 차단되지 못하고 유입되어 대량의 기공(Blowhole)을 야기합니다."},{"n":21,"type":"mcq","stem":"고압 가스 안전관리법 규격에 근거하여 용접 작업장에 구비된 고압 가스 실린더(용기)의 표면 도색 기준 명칭 매칭 중 가장 옳은 것은?","choices":["아르곤(Ar) - 청색, 이산화탄소(CO2) - 녹색","아르곤(Ar) - 녹색, 이산화탄소(CO2) - 노란색","아르곤(Ar) - 회색, 이산화탄소(CO2) - 청색","아르곤(Ar) - 회색, 이산화탄소(CO2) - 주황색"],"answerIndex":3,"answerText":"③ 아르곤(Ar) - 회색, 이산화탄소(CO2) - 청색","explain":"국가 고압 가스 용기 표시 기준에 의거하여 아르곤(Ar) 가스 용기는 회색, 액화 이산화탄소(CO2) 용기는 청색, 액화 암모니아는 백색, 산소는 녹색으로 각각 정밀 구분 도색되어 있습니다."},{"n":22,"type":"mcq","stem":"슬리브 0.5 mm 하단 눈금선이 노출되어 통과한 상태이며 심블의 지시 침 선이 정확히 28을 가리키고 있을 때, 정밀 마이크로미터 측정 수치로 가장 타당한 눈금 총독출(mm)값은?","choices":["5.28 mm","5.50 mm","5.78 mm","6.28 mm"],"answerIndex":3,"answerText":"③ 5.78 mm","explain":"슬리브의 기본 지시선 5.0 mm를 넘어 하단의 0.5 mm선이 명확히 보이므로 기본 독출값은 5.5 mm가 되며, 여기에 회전 심블 눈금 0.28 mm(28/100)를 대입 가산하므로 총 판독값은 5.78 mm 입니다."},{"n":23,"type":"mcq","stem":"NCS 13편 수평 필릿 가용접(가접) 배치 조건 기준에 준거하여, 모재의 판재 두께가 t = 9.0 mm 인 연강판 부재를 가조립 가접하고자 한다. 이때 1개소당 적합한 임시 가용접 비드의 표준 지정 길이는?","choices":["10 mm 내외","20 mm 내외","40 mm 내외","60 mm 이상"],"answerIndex":3,"answerText":"③ 40 mm 내외","explain":"NCS 실무 시공 표준상 두께 3.2 mm 초과에서 25 mm 이하 범위(중판)의 구조재를 임시 가접할 때 표준 비드 가접 길이는 개당 40 mm 범위 이내로 견고하게 고착하도록 명시되어 있습니다. (3.2t 이하는 30mm, 25t 초과는 50mm)"},{"n":24,"type":"mcq","stem":"Ø1.2 mm 규격의 솔리드와이어 가스보호아크 용접 진행 시, 송급 성능을 기하고 안전 실드를 유지하기 위해 콘택트 팁(Contact Tip) 끝단에서 돌출된 와이어의 적정 '돌출 길이' 범위는?","choices":["3 ~ 5 mm","10 ~ 15 mm","25 ~ 35 mm","40 ~ 50 mm"],"answerIndex":2,"answerText":"② 10 ~ 15 mm","explain":"솔리드와이어 1.2mm 전극 단락 이행 조건(Short-Arc) 하에서 이상적인 전기 전도성 통전을 도모하고 아크 요동을 잡기 위한 돌출 길이는 10~15 mm 내외 범위를 정밀 유지하는 것이 안전합니다. (플럭스코어드와이어는 15~25mm)"},{"n":25,"type":"mcq","stem":"GMAW 장비 전기 결선 조작 시, 분전반 전원을 차단하고 안전하게 2차측 어스(Earth) 케이블 단자를 결속하고자 한다. 감전 예방 및 통전 신뢰를 위해 준수해야 할 정석 시공은?","choices":["접지 어스 선을 가스 배관 또는 수도 파이프 체결선에 조인트한다.","전선 가닥을 손으로 대충 꼬아 용접 작업대의 금속 틀에 그대로 감아 놓는다.","어스 케이블을 압착 단자 없이 작업대 주위에 느슨하게 걸쳐 둔다.","볼트 압착으로 단단히 결속 체결하고 접촉부에 절연 테이핑 조치를 한다."],"answerIndex":4,"answerText":"④ 볼트 압착으로 단단히 결속 체결하고 접촉부에 절연 테이핑 조치를 한다.","explain":"용접용 어스 단자는 미세한 접속 저항에 의해서도 고열 발생 및 아크 단절을 초래합니다. 접촉부는 확실히 동단자 압착 체결하고, 절연 수축 가공 또는 테이핑 처리를 통해 감전 위험 요소를 완벽 차단해야 정석입니다. (가스관/수도관 접지는 금지)"},{"n":26,"type":"mcq","stem":"피복아크 또는 가스메탈아크용접기 등의 비정상 무부하 전압을 강제로 저하 제어하여 휴지 시(아크 정지 시) 안전 사고 및 감전 재해를 미연에 방지하기 위해 부착하는 감전 방지 특수 부품의 표준 명칭은?","choices":["전기식 원격 제어 조절기 (Remote Controller)","누전 감지 경보기 (Ground Fault Interrupter)","고주파 발생 장치 (High Frequency Unit)","자동전격방지기 (Vacuum Relief Device / VRD)"],"answerIndex":4,"answerText":"④ 자동전격방지기 (Vacuum Relief Device / VRD)","explain":"자동전격방지기(VRD)는 무부하 동작 상태 시 아크 전압을 즉각적으로 인체에 무해한 안전 보호 전압 한도 범위(20~30V) 이하로 강하시켜 작업자의 전기 쇼크 감전사를 차단하는 대표 감전 안전 장치입니다."},{"n":27,"type":"mcq","stem":"GMAW 솔리드와이어 필릿용접 진행 시, 토치를 용접 비드 전진 방향으로 밀며 시공하는 '전진법'의 전형적인 기하학적 형상 및 아크 거동적 특징으로 옳은 것은?","choices":["아크 열이 전방으로 퍼져 비드가 평평하고 납작하게 깔리며 용입 깊이는 비교적 얕다.","아크 기류가 뒤쪽으로만 뿜어져 비드가 대단히 볼록하고 폭이 좁으며 용입이 극단적으로 깊어진다.","용융 속도가 저하되어 와이어 소모량이 급속도로 감소한다.","보호가스 보호 효율이 완전히 제로(0)가 되어 100% 기공이 발생한다."],"answerIndex":1,"answerText":"① 아크 열이 전방으로 퍼져 비드가 평평하고 납작하게 깔리며 용입 깊이는 비교적 얕다.","explain":"전진법은 용접 토치를 용접 전방 방향으로 진행하며 운봉하는 기법으로, 아크 열이 용접 진행 방향 앞쪽으로 분산되어 비드가 편평하고 넓어지며, 용입 깊이는 후진법 대비 상대적으로 다소 얕게 형성됩니다."},{"n":28,"type":"mcq","stem":"용접 비드 가장자리에 모재가 오목하게 녹아 파인 채 채워지지 않는 결함인 '언더컷(Undercut)'의 물리 야금학적 원인이 아닌 것은?","choices":["용접 아크 전류의 비정상적인 과다 공급 세팅","아크 전압의 과도한 상승에 따른 아크 길이 증대","토치 운봉 진행 운송 속도의 지나친 과속 조작","와이어 송급 롤러의 압력 부족에 따른 와이어 미끄러짐"],"answerIndex":4,"answerText":"④ 와이어 송급 롤러의 압력 부족에 따른 와이어 미끄러짐","explain":"와이어 롤러 압력 부족으로 와이어가 미끄러지면 송급 속도가 지연되거나 불규칙해질 뿐, 용접부 고열 집중에 따른 모재의 부분적 과다 용융 홈 결함인 언더컷 현상의 직접적인 공학적 생성 요인과는 거리가 멉니다."},{"n":29,"type":"mcq","stem":"필릿용접 이음의 기계적 강도를 설계할 때, 안전을 기하기 위해 허용 인장 하중을 산정할 때 기준값으로 대입하는 단면 계산의 유효 면적 명칭으로 가장 옳은 것은?","choices":["모재 평판의 폭과 두께를 서로 곱한 순수 단면적","용접 비드 덧살을 포함한 전체 외곽 표면적","이론 목두께(a)와 유효 길이(L)의 곱인 '유효 목면적'","가상 이등변 삼각형의 빗변 길이를 모두 합산한 외주 단면적"],"answerIndex":3,"answerText":"③ 이론 목두께(a)와 유효 길이(L)의 곱인 '유효 목면적'","explain":"필릿용접부는 하중 작용 시 기하학적으로 전단 파괴가 유효 목단면에 집중됩니다. 따라서 설계 강도 계산 시 유효 가압 단면적은 반드시 이론 목두께(a)와 용접 유효 길이(L)의 삼각 함수 곱으로 정의되는 '유효 목면적(a * L)'을 대입해야 합니다."},{"n":30,"type":"mcq","stem":"용접 기계 및 실습 기기의 전력 제어 선로 상에 삽입하여 누전 전류가 감지되면 정밀 전자 시퀀스를 거쳐 0.03초 이내에 선로를 초고속 자동 차단함으로써 작업자의 원천적 감전사고를 방지하는 전기 보호 기기는?","choices":["배선용 차단기 (MCCB / NFB)","고압 한류형 안전 퓨즈 (Fuse)","누전차단기 (ELB / ELCB)","전력 보상 콘덴서 (Condenser)"],"answerIndex":3,"answerText":"③ 누전차단기 (ELB / ELCB)","explain":"누전차단기(ELB)는 기기 외함 누전 시 유입/유출 전류 차를 검출하여 정격 유효 감도 전류 이하(보통 30mA)의 누설 감지 시 0.03초 이내에 선로 전원을 긴급 차단하는 완벽한 감전 예방 장치입니다."},{"n":31,"type":"mcq","stem":"수평 필릿용접(2F)의 다층 용접(Multi-pass Welding) 작업을 진행할 때, 각각의 패스(Pass) 시공을 마칠 때마다 반드시 이행해야 할 가장 중요한 층간 청소 및 시공 조치는 무엇인가?","choices":["냉각을 위해 매 층마다 물을 직접 살수 냉각 처리하여 마르텐사이트 조직을 유도한다.","전원을 매 층마다 리셋하고 접지선의 연결 위치를 반대 방향으로 바꾼다.","비드 표면의 실리카(Silica) 유리질 슬래그막을 완전히 제거하고 수분 흡습 방지를 위한 열풍 건조를 매번 한다.","와이어 브러시나 슬래그 해머를 사용하여 이전 비드 표면의 유리질 실리카 슬래그를 완벽하게 털어 청소한 후 다음 패스 용접을 실시한다."],"answerIndex":4,"answerText":"④ 와이어 브러시나 슬래그 해머를 사용하여 이전 비드 표면의 유리질 실리카 슬래그를 완벽하게 털어 청소한 후 다음 패스 용접을 실시한다.","explain":"GMAW/CO2 용접 시 비드 표면에 산화 반응 결과물로써 유리 형태의 갈색 실리카 슬래그(유리질 슬래그)막이 피복 형성됩니다. 이를 털어 내지 않고 그대로 후속 다층 패스 용접을 가동하면 비융착 슬래그 혼입 결함이 고스란히 적층되어 구조적 균열을 야기하므로, 완벽한 층간 솔질 청소가 철칙입니다."},{"n":32,"type":"mcq","stem":"GMAW 솔리드와이어 용접 전원 특성에 주로 채택되는 전기적 특성으로, 아크 길이가 물리적으로 늘어나 전압이 상승하면 용접 전류가 스스로 감축 반응하여 원래 안전한 아크 길이로 복귀하는 특성을 지닌 출력 외관 제어 장치 명칭은?","choices":["정전압 특성 (Constant Voltage Characteristic)","정전류 특성 (Constant Current Characteristic)","상승 전압 특성 (Rising Voltage)","수하 특성 (Drooping Characteristic)"],"answerIndex":1,"answerText":"① 정전압 특성 (Constant Voltage Characteristic)","explain":"정전압 특성(CV)은 아크 전압(길이)의 미세한 변화가 발생할 때, 스스로 전류를 대폭 변화시킴으로써 아크 길이를 본래 안정한 기밀 설정 치수로 자율 복구하는 '아크 길이 자기 제어 작용'을 구현하는 핵심 특성입니다."},{"n":33,"type":"mcq","stem":"T형 필릿용접의 조립 준비 단계에서 수평 지지판과 수직 돌출판 모재 사이의 정각 직각도(90°) 균형을 정합적으로 정렬 검증하기 위해 가장 널리 유용하게 활용되는 대표적 치공구의 명칭은?","choices":["가스 퍼징 세라믹 백킹재","용접 다리길이 정밀 게이지 및 직각자","프레스 유압 실린더 가공기","고압 아르곤 가압 유량 레귤레이터"],"answerIndex":2,"answerText":"② 용접 다리길이 정밀 게이지 및 직각자","explain":"가조립 조립 및 가용접 단계에서 수평과 수직 판재의 기하학적 90도 직각 상태를 잡기 위해 전용 직각자와 각장 게이지를 수시 대조 판정하여 틀어짐 변형에 미리 대응하는 가조립 법이 널리 기용됩니다."},{"n":34,"type":"mcq","stem":"용접 기법 작업 후 정리정돈 및 안전 사후 수칙에 해당되는 3정 5행 활동 중 '정돈'에서 강조하는 '3정' 관리 체계에 해당되지 않는 것은?","choices":["정품 (Correct Item)","정량 (Correct Quantity)","정위치 (Correct Place)","정격 (Correct Rating)"],"answerIndex":4,"answerText":"④ 정격 (Correct Rating)","explain":"3정 5행 관리 중 3정의 핵심 뼈대 구성요소는 정해진 위치에(정위치), 정해진 제품을(정품), 정해진 표준 수량만큼(정량) 질서 있게 지정 보관하는 체계입니다. 정격은 전기 회로 소자 등의 하중 특성 수치입니다."},{"n":35,"type":"mcq","stem":"가스 실드 아크 용접 시 아크 전압이 필요 전류 대비 과도하게 낮고 가압 노브 압력이 비대칭일 때 나타나는 기계 아크 물리 현상으로 가장 타당한 것은?","choices":["안정된 스프레이 아크 이행이 형성되어 소리가 거의 나지 않는다.","전극 와이어가 용융 풀에 처박히며 조대 스패터가 대량으로 튄다.","용입 깊이가 균일하게 평탄화되어 비드 결함이 완전 제로화된다.","보호가스 방출 속도가 2배로 상승하여 아크가 대단히 정숙해진다."],"answerIndex":2,"answerText":"② 전극 와이어가 용융 풀에 처박히며 조대 스패터가 대량으로 튄다.","explain":"전류 대비 전압 세팅이 지나치게 낮으면, 공급되는 속도만큼 와이어 끝단이 충분히 녹아 분사 이행되지 못하고 용융 풀(모재) 내에 쿡쿡 처박히는 단락 쇼크가 유발되며 크고 거친 조대형 스패터가 동반하여 대거 방출됩니다."},{"n":36,"type":"mcq","stem":"수평 필릿용접(2F)부의 용융 단면 형상을 설계상 계산할 때, 비드 표면의 모재 결합 끝단 지점을 가리키는 정식 공학 전문 약칭 명칭은 무엇인가?","choices":["루트(Root)","페이스(Face)","토우(Toe)","슬로트(Slot)"],"answerIndex":3,"answerText":"③ 토우(Toe)","explain":"용접 비드의 가상 표면 경계선과 모재 원판 표면이 서로 접하는 교차 경계 지점을 '토우(Toe)'라고 명명합니다. 토우 부위는 인장 및 굽힘 작용 시 응력 집중이 가장 심하게 발생하므로 형상을 균일하게 가공 마감해야 안전합니다."},{"n":37,"type":"mcq","stem":"연강용 GMAW 전극 와이어의 기계적·물리적 화학 성분 중 적열취성을 적극 억제하고 황(S) 성분에 의한 가혹한 고온 용접 균열을 중화시키기 위해 인위적으로 다소 균형 있게 배합을 강화해 놓은 대표 합금 화학 원소는?","choices":["구리 (Cu)","규소 (Si)","망가니즈 (Mn)","티타늄 (Ti)"],"answerIndex":3,"answerText":"③ 망가니즈 (Mn)","explain":"망가니즈(Mn) 원소는 모재 강도와 탈산 효율을 도모할 뿐만 아니라, 용재 내 악성 성분인 황(S)과 결합하여 MnS 화학물을 유도 형성함으로써, 가혹한 냉각 적열취성과 고온 열화 부식 균열을 적극적으로 억제하는 고마운 수단입니다."},{"n":38,"type":"mcq","stem":"탄산가스(CO2) 아크용접 도중, 대기 공기의 유입을 완전 억제하고 가압 기류 보호막을 완벽하게 수립하기 위해 규정된 표준 무풍 상태에서의 아르곤 가스 및 탄산가스 표준 방출 체적 유량 범위는?","choices":["1 ~ 3 L/min","5 ~ 8 L/min","15 ~ 20 L/min","40 ~ 50 L/min"],"answerIndex":3,"answerText":"③ 15 ~ 20 L/min","explain":"GMAW/CO2 반자동 시공 공정에서 바람이 없는 표준 내부 실습 기준 시 최상의 가스 배리어(Barrier)를 치기 위한 방출 유량은 분당 15~20 리터(L/min) 범위 내외로 분출 가동해 두는 것이 기공 결함 방지에 가장 좋습니다."},{"n":39,"type":"mcq","stem":"GMAW 용접기의 정격 사용률이 40% 이고 전체 가동 수명 측정 기준 주기가 10분이라고 가정하자. 본 장비를 안전 수명 한도 내에서 손상 없이 가동하기 위해 규정된 '최대 연속 아크 가동(통전) 시간'은?","choices":["2분","4분","6분","8분"],"answerIndex":2,"answerText":"② 4분","explain":"용접기의 1주기 기준 가동 시간은 통상 10분으로 정비 규정되어 있습니다. 정격사용률이 40% 이라는 것은 10분 주기 중 4분간은 연속 전력 아크를 발생해 시공하고, 나머지 6분간은 무부하 공회전으로 냉각시켜야 안전하다는 뜻입니다."},{"n":40,"type":"mcq","stem":"용접 작업 시 아크로부터 다량 방출되어 작업자의 안구에 도달 시 망막 상해 및 급성 광전안염(아크아이, 전안염)을 야기하는 파장 100 ~ 400 nm 범위의 매우 강력한 불가시 유해 광선은 무엇인가?","choices":["자외선 (Ultraviolet Ray)","적외선 (Infrared Ray)","감마선 (Gamma Ray)","레이저광선 (Laser)"],"answerIndex":1,"answerText":"① 자외선 (Ultraviolet Ray)","explain":"용접 아크 유발 광선 중 파장이 대단히 짧은 자외선은 각막 조직에 침투하여 아크아이 전안염과 피부 화상을 적극적으로 야기하므로 차광 렌즈 및 가죽 자켓, 보안면 구비가 절대 요구됩니다."},{"n":41,"type":"mcq","stem":"탄산가스 아크 용접 도중 고압의 CO2 가스가 감압 기어 내부에서 기화할 때 열 흡수(잠열 흡수) 기화 냉각 반응에 의해 조정기 내부에 서리가 발생하고 최종적으로 기어 배관이 동결 차단되는 오작동을 원천 예방하는 보조 보호구는?","choices":["냉동 건조식 압축공기 에어클리너","저수소계 분제 가열 건조 가마","가압 송기식 전동 방진 마스크","가열 가스 히터 (Gas Heater)"],"answerIndex":4,"answerText":"④ 가열 가스 히터 (Gas Heater)","explain":"고압 액화 탄산가스가 고압 용기로부터 기체로 감압 방출될 때 다량의 주변 잠열을 빼앗기 때문에, 레귤레이터 유량계 배관 부위가 수시로 빙결 차단됩니다. 이를 막기 위해 AC 110/220V 결선 전원을 연결해 덥혀주는 '가열 가스 히터'가 반드시 구비되어야 합니다."},{"n":42,"type":"mcq","stem":"솔리드와이어 필릿용접 완료 후 수공구 정리정돈 시, 팁 세정 플라이어(웰딩 플라이어) 및 슬래그 해머 등의 올바른 윤활 보관 요령으로 가장 타당한 조치는?","choices":["녹 방지를 위해 기름을 듬뿍 칠한 후 톱밥 상자에 묻어 보관한다.","마찰부의 오물과 습기를 닦고 기름을 얇게 도포해 3정 보관대에 적치한다.","보관 중인 공구의 탄화를 위해 불꽃 토치 가열을 주기적으로 해 둔다.","보관을 수월하게 하기 위해 어두운 지하실 흙벽 주위 바닥에 눕혀 보관한다."],"answerIndex":2,"answerText":"② 마찰부의 오물과 습기를 닦고 기름을 얇게 도포해 3정 보관대에 적치한다.","explain":"수공구 등의 사용 수명을 연장하고 감전 방지를 양호하게 하기 위해, 사용을 완료한 그라인더, 플라이어류는 가볍게 닦고 마모 마찰 구동 부위에 얇은 미량 그리스나 오일을 묻혀 지정된 '3정' 보관 선반에 정돈하는 것이 표준 규칙입니다."},{"n":43,"type":"mcq","stem":"수평 필릿용접의 본용접 전 전처리 과정에 해당하는 '밀스케일(Mill Scale)' 세척 제거에 쓰이는 가장 보편적이고 물리적인 공학 도구의 명칭은?","choices":["가열 가스 중성 토치 불꽃","고압 아르곤 세라믹 백킹 롤러","수직 드릴 프레스기","핸드 그라인더 및 와이어 와이어 휠 브러시"],"answerIndex":4,"answerText":"④ 핸드 그라인더 및 와이어 와이어 휠 브러시","explain":"압연 가공 과정에서 철판 표면에 얇고 견고하게 형성된 청회색 산화 피막(밀스케일)은 이산화탄소 용접 중 다량의 산화 철 화합물을 유도하여 융착 불량과 기공을 유발하는 원흉입니다. 시공 전에 핸드 그라인더로 반드시 하얗게 깎아 제거해야 합니다."},{"n":44,"type":"mcq","stem":"용접 전원 극성 중 교류(AC)와 대비하여, 직류 역극성(DCRP / DCEP) 결선 하에 솔리드와이어 용접을 시공할 때 모재와 용접 와이어 전극 측의 공학적 대칭 열분배 비율 법칙은?","choices":["모재 측 70%, 용접 전극 측 30%","모재 측 30%, 용접 전극 측 70%","모재 측 50%, 용접 전극 측 50%","모재 측 100%, 용접 전극 측 0%"],"answerIndex":2,"answerText":"② 모재 측 30%, 용접 전극 측 70%","explain":"직류 역극성(DCRP)은 용접 토치에 (+)극을 인가하고 모재에 (-)극을 대입하므로, 양이온이 양극인 토치/와이어 끝단을 가혹하게 때려 와이어 전극 측에 열량의 70%가 분배 집중되고 용입은 비교적 얕게 형성됩니다."},{"n":45,"type":"mcq","stem":"용접 변형 방지 대책 중 하나인 '역변형법(Reverse Deformation Method)'의 공학 원리를 기하학적으로 가장 바르게 규명한 설명은 무엇인가?","choices":["변형이 발생한 후 유압 프레스와 잭으로 가압하여 판을 수평으로 강제 복원하는 사후 교정 공법","용접 수축 변형량을 사전에 산출하여 미리 반대 방향으로 2°~3° 꺾어 가접 조립해 두는 공법","용접선 주위에 물을 계속 뿌려 급속 냉각시켜 수축 변형의 진행을 얼려 정지시키는 공법","용접 비드를 한 줄만 아주 두껍게 쌓아 그 자체의 강성으로 변형을 강제 구속하는 공법"],"answerIndex":2,"answerText":"② 용접 수축 변형량을 사전에 산출하여 미리 반대 방향으로 2°~3° 꺾어 가접 조립해 두는 공법","explain":"역변형법은 용접 시 발생하는 열 수축각과 인장 변형량을 용착부 가열각에 근거하여 사전 예측한 뒤, 조립 가조립 단계에서 미리 반대 각도로 틀어 고정 가접해 두어 용접 수축 완료 시 평판 상태를 유도하는 아주 공학적이고 경제적인 변형 방지 대책입니다."},{"n":46,"type":"mcq","stem":"CO2 솔리드와이어 필릿용접 완료 후 비드 외관을 육안 평가하였다. 이때 비드의 표면 및 발 가장자리에 용착 금속이 모재 표면 위로 흘러 덮여서 녹지 않고 얹혀 결합 경계를 훼손하는 불량 불착 결함의 명칭은?","choices":["오버랩 (Overlap)","언더컷 (Undercut)","기공 (Blowhole)","용융부 수축공 (Crater)"],"answerIndex":1,"answerText":"① 오버랩 (Overlap)","explain":"모재 열 인가량이 지나치게 낮고 와이어 공급 속도가 고속이거나 전압이 과소할 때, 모재를 충분히 용융시키지 못한 용착 금속이 표면 위로 그냥 밀려 겹쳐 덮인 채 경계선을 이루는 불착 상태를 '오버랩'이라고 부릅니다."},{"n":47,"type":"mcq","stem":"과정평가형 시험 중 안전 점검 지침에서 작업자가 용접기 덮개(케이스)를 완전히 열고 내부 전기 코일 부위의 누적 철가루나 분진을 고압 압축 공기로 사상 불어내 청소하고자 할 때, 반드시 행해야 할 최고 안전 예방 수칙은?","choices":["가압용 히터를 먼저 가동해 케이스 내부를 가압 상태로 유지한 뒤 압축공기를 분다.","접지 마개 연결선에 수돗물을 다량 살수하여 분진과 철가루를 씻어내는 세차 청소를 병행한다.","전원을 켠 채로 고속 풍압을 가해 통전 중에 곧바로 내부 분진을 불어서 제거한다.","차단기(NFB)를 내린 후 콘덴서 잔류 전압 방전을 위해 3분 이상 대기한 뒤 청소한다."],"answerIndex":4,"answerText":"④ 차단기(NFB)를 내린 후 콘덴서 잔류 전압 방전을 위해 3분 이상 대기한 뒤 청소한다.","explain":"용접기 내부 전원 트랜스 및 축전 콘덴서 계통은 차단기를 내려도 일정 시간 잔류 전하 고압 충전 상태가 지속되므로 대단히 위험합니다. 완전 오프 시킨 후 '3분 이상' 충분히 방전 시간 여유를 둔 뒤 절연 상태를 확인하고 압축공기 사상 청소를 하는 것이 안전 매뉴얼의 골자입니다."},{"n":48,"type":"mcq","stem":"GMAW/CO2 수평 필릿용접(2F)의 시점부에 아크를 최초 유도하여 가동할 때, 용접 시작 영역에 가스 배리어가 즉각 수립되지 않아 산화 및 질화 기공이 집단 생성되는 결함을 원천 배제하기 위해 장비 제어반에서 설정해 두어야 할 필수 보호 가스 제어 설정은?","choices":["주파수 상승 교번 폭 조정","크레이터 강제 차단 시간 10초 분출","후기 가스 (After-Flow Time) 제어시간 연장","초기 가스 (Pre-Flow Time) 선류 분사 제어 설정"],"answerIndex":4,"answerText":"④ 초기 가스 (Pre-Flow Time) 선류 분사 제어 설정","explain":"아크가 최초 스타트될 때 순간적인 대기 노출을 막기 위해, 실제 아크 발생 0.5~1초 전에 가스 밸브를 선행 개방하여 용접부 영역을 아르곤/탄산가스로 채우는 기능을 '초기 가스(프리플로우)' 설정이라고 합니다."},{"n":49,"type":"mcq","stem":"GMAW 필릿용접 시, 토치 팁과 모재 사이의 용접 아크 공간으로부터 미세한 입자 비드 불꽃이 사방으로 튀어 튀어나와 부착되는 원형 입자 덩어리들을 '스패터(Spatter)'라고 한다. 스패터 고착 방지를 위해 시공 전에 모재 강판 표면에 도포하는 방지 약품의 표준 종류는?","choices":["미량의 염산과 질산을 일정 비율로 섞은 화학 에칭 세정 용액","전기 전도성을 높이기 위해 도포하는 구리 미립 분말 가루","석유계 오일과 페인트용 그리스를 섞어 만든 혼합 도포유","수용성 스패터 부착 방지제(Anti-Spatter Spray)"],"answerIndex":4,"answerText":"④ 수용성 스패터 부착 방지제(Anti-Spatter Spray)","explain":"그라인딩 가공 시간과 비드 외관 훼손을 최소화하기 위해, 용접부 조인트 경계 주위로 수용성의 '스패터 부착 방지 스프레이'를 미리 도포해 두면 스패터 알갱이가 가볍게 털어져 나가 외관 품위가 극대화됩니다."},{"n":50,"type":"mcq","stem":"GMAW 솔리드와이어를 이용해 수평 필릿용접(2F) 진행 중, 본용접 비드를 끊기 전 크레이터 부위에 균열 및 다공성 핀홀 결함을 완벽히 충진 청정하기 위한 표준 조작법으로 옳은 설명은?","choices":["크레이터 전류로 비드 끝에서 원형 운봉을 2~3회 하여 함몰부를 메운 뒤 아크를 끊는다.","물을 분사하여 크레이터 균열 부위를 강제로 즉시 동결 수축시켜 마무리한다.","전류를 3배 올려 크레이터 부위 모재에 구멍을 완전히 뚫어 둔 뒤 끝낸다.","아크를 켠 채로 용접 진행 방향으로 초속 5cm 이상 빠르게 당겨 끊어 그대로 마무리한다."],"answerIndex":1,"answerText":"① 크레이터 전류로 비드 끝에서 원형 운봉을 2~3회 하여 함몰
