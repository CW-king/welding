function tableHTML(rows){
  /* (A)·①·가. 로 시작하는 표는 머리글 없는 대응표다 */
  var head = !!(rows[0]&&rows[0][0]) && !/^\s*(\(?[A-Za-z가-힣]\)|[①-⑮])/.test(rows[0][0]);
  var h='<div class="tblwrap"><table'+(head?'':' class="nohead"')+'>';
  rows.forEach(function(r,i){
    var th=(head&&i===0);
    h+='<tr>'+r.map(function(c){return (th?'<th>':'<td>')+esc(c)+(th?'</th>':'</td>');}).join('')+'</tr>';
  });
  return h+'</table></div>';
}
function paneTheory(pane,d){
  if(!d.theory||!d.theory.length){ pane.innerHTML='<div class="empty">이 단원은 이론 요약이 없습니다.</div>'; return; }
  var h='<div class="card theory">',open=false;
  d.theory.forEach(function(b){
    if(b.t==='li'){ if(!open){h+='<ul>';open=true;} h+='<li>'+esc(b.v)+'</li>'; return; }
    if(open){h+='</ul>';open=false;}
    if(b.t==='table') h+=tableHTML(b.rows);
    else if(b.t==='h2') h+='<h2>'+esc(b.v)+'</h2>';
    else if(b.t==='h3') h+='<h3>'+esc(b.v)+'</h3>';
    else if(b.t==='h4') h+='<h4>'+esc(b.v)+'</h4>';
    else h+='<p>'+esc(b.v)+'</p>';
  });
  if(open) h+='</ul>';
  pane.innerHTML=h+'</div>';
}

function qCardHTML(q,i,opts){
  opts=opts||{};
  var h='<div class="card q" data-i="'+i+'"><div class="qhead"><span class="qno">'+
    (opts.label||('문항 '+q.n))+'</span><span class="badge'+(q.type==='short'?' g':'')+'">'+
    (q.type==='short'?'주관식':'객관식')+'</span></div>'+
    '<div class="qstem">'+esc(q.stem)+'</div>';
  (q.tables||[]).forEach(function(t){ h+=tableHTML(t); });
  if(q.type==='mcq'){
    h+='<div class="chwrap">';
    q.choices.forEach(function(c,ci){
      h+='<button class="ch" data-c="'+(ci+1)+'"><span class="k">'+KCH[ci]+'</span>'+esc(c)+'</button>';
    });
    h+='</div>';
  }else{
    h+='<input class="sa" type="text" inputmode="text" placeholder="정답을 적어보세요 (선택)">';
  }
  h+='<div class="act"></div><div class="reveal hide"></div></div>';
  return h;
}
function revealHTML(q,correct){
  var a=q.type==='mcq'? (KCH[q.answerIndex-1]||'')+' '+esc(q.choices[q.answerIndex-1]||q.answerText)
                      : esc(q.answerText);
  var h='<span class="lab">'+(correct===true?'정답입니다 ✓':correct===false?'오답입니다 ✕':'정답')+'</span>'+
        '<div class="ansv">'+a+'</div>';
  if(q.explain) h+='<div class="exp">'+esc(q.explain)+'</div>';
  return h;
}

/* ── 문제집(열람) ── */
function paneBook(pane,d){
  var h='<div class="small muted" style="margin:2px 4px 10px">문항을 눌러 보기와 해설을 확인하세요. 아래 버튼으로 전체 해설을 한 번에 펼칠 수 있습니다.</div>'+
        '<div class="act" style="margin-bottom:12px"><button class="btn" id="allon">해설 모두 펼치기</button>'+
        '<button class="btn" id="alloff">모두 접기</button></div><div id="list"></div>';
  pane.innerHTML=h;
  var list=document.getElementById('list');
  d.questions.forEach(function(q,i){
    var c=el(qCardHTML(q,i));
    c.querySelector('.act').innerHTML='<button class="btn primary">정답·해설 보기</button>';
    var rv=c.querySelector('.reveal'), btn=c.querySelector('.act .btn');
    function show(on){
      rv.classList.toggle('hide',!on); btn.textContent=on?'해설 접기':'정답·해설 보기';
      if(on&&!rv.innerHTML) rv.innerHTML=revealHTML(q,null);
      if(q.type==='mcq') c.querySelectorAll('.ch').forEach(function(b,ci){
        b.classList.toggle('ok',on&&ci+1===q.answerIndex); });
    }
    btn.onclick=function(){ show(rv.classList.contains('hide')); };
    c.querySelectorAll('.ch').forEach(function(b){ b.onclick=function(){ show(true); }; });
    c._show=show; list.appendChild(c);
  });
  document.getElementById('allon').onclick=function(){ list.childNodes.forEach(function(c){c._show(true);}); };
  document.getElementById('alloff').onclick=function(){ list.childNodes.forEach(function(c){c._show(false);}); };
}

/* ── 풀기(자동채점) ── */
function paneQuiz(pane,d,u){ runQuiz(pane,d.questions,{unit:u,title:d.title}); }

function runQuiz(pane,qs,opt){
  if(!qs.length){ pane.innerHTML='<div class="empty">풀 문제가 없습니다.</div>'; return; }
  var i=0, res=new Array(qs.length).fill(null);
  pane.innerHTML='<div class="progress"><div class="pbar"><i></i></div>'+
    '<div class="pmeta"><span id="pm1"></span><span id="pm2"></span></div></div><div id="stage"></div>';
  var stage=document.getElementById('stage'), bar=pane.querySelector('.pbar>i');
  killNav();
  var nav=el('<div class="navbtns"><button class="btn" id="prev">이전</button>'+
             '<button class="btn primary" id="next">다음</button></div>');
  document.body.appendChild(nav);
  var cleanup=function(){ if(nav.parentNode) nav.parentNode.removeChild(nav);
    window.removeEventListener('hashchange',cleanup); };
  window.addEventListener('hashchange',cleanup);

  function paint(){
    var q=qs[i];
    bar.style.width=Math.round((i+1)/qs.length*100)+'%';
    document.getElementById('pm1').textContent=(i+1)+' / '+qs.length;
    var n=res.filter(function(x){return x!==null;}).length,
        ok=res.filter(function(x){return x===1;}).length;
    document.getElementById('pm2').textContent='정답 '+ok+' / 채점 '+n;
    stage.innerHTML=qCardHTML(q,i,{label:(opt.label?opt.label(q,i):'문항 '+q.n)});
    var card=stage.firstChild, rv=card.querySelector('.reveal'), act=card.querySelector('.act');
    var answered=res[i]!==null;

    if(q.type==='mcq'){
      card.querySelectorAll('.ch').forEach(function(b){
        b.onclick=function(){
          if(res[i]!==null) return;
          var pick=+b.dataset.c, right=pick===q.answerIndex;
          res[i]=right?1:0; mark(q,right,opt,i);
          card.querySelectorAll('.ch').forEach(function(x){
            x.disabled=true;
            var c=+x.dataset.c;
            if(c===q.answerIndex) x.classList.add('ok');
            else if(c===pick) x.classList.add('no');
          });
          rv.innerHTML=revealHTML(q,right); rv.classList.remove('hide');
          rv.classList.add(right?'ok':'no');
          setTimeout(function(){rv.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
          document.getElementById('pm2').textContent='정답 '+res.filter(function(x){return x===1;}).length+
            ' / 채점 '+res.filter(function(x){return x!==null;}).length;
        };
      });
    }else{
      act.innerHTML='<button class="btn primary">정답 확인</button>';
      var showed=false;
      act.firstChild.onclick=function(){
        if(showed) return; showed=true;
        rv.innerHTML=revealHTML(q,null)+
          '<div class="act"><button class="btn" data-v="1">맞았어요</button>'+
          '<button class="btn" data-v="0">틀렸어요</button></div>';
        rv.classList.remove('hide'); act.firstChild.disabled=true;
        rv.querySelectorAll('[data-v]').forEach(function(b){
          b.onclick=function(){ res[i]=+b.dataset.v; mark(q,res[i]===1,opt,i);
            rv.querySelectorAll('[data-v]').forEach(function(x){x.disabled=true;});
            b.classList.add(res[i]===1?'primary':''); toast(res[i]===1?'정답 처리했습니다':'오답노트에 담았습니다');
            document.getElementById('pm2').textContent='정답 '+res.filter(function(x){return x===1;}).length+
              ' / 채점 '+res.filter(function(x){return x!==null;}).length; };
        });
      };
    }
    if(answered){
      rv.innerHTML=revealHTML(q,res[i]===1); rv.classList.remove('hide');
      rv.classList.add(res[i]===1?'ok':'no');
      if(q.type==='mcq') card.querySelectorAll('.ch').forEach(function(x){
        x.disabled=true; if(+x.dataset.c===q.answerIndex) x.classList.add('ok'); });
      else act.innerHTML='';
    }
    document.getElementById('prev').disabled=(i===0);
    document.getElementById('next').textContent=(i===qs.length-1)?'결과 보기':'다음';
  }
  document.getElementById('prev').onclick=function(){ if(i>0){i--;paint();window.scrollTo(0,0);} };
  document.getElementById('next').onclick=function(){
    if(i<qs.length-1){ i++; paint(); window.scrollTo(0,0); } else { cleanup(); finish(); }
  };
  function finish(){
    var ok=res.filter(function(x){return x===1;}).length,
        n=res.filter(function(x){return x!==null;}).length;
    var pct=n?Math.round(ok/n*100):0;
    var h='<div class="card result"><div class="small muted">'+esc(opt.title||'')+'</div>'+
      '<div class="big">'+pct+'점</div><div class="muted small">'+n+'문항 채점 · 정답 '+ok+' · 오답 '+(n-ok)+'</div>'+
      '<div class="chips">';
    qs.forEach(function(q,k){ h+='<button class="chip'+(res[k]===1?'':' bad')+'" data-k="'+k+'">'+(k+1)+'</button>'; });
    h+='</div><div class="act" style="margin-top:18px">'+
      '<button class="btn" id="again">다시 풀기</button>'+
      '<button class="btn primary" onclick="go(\'#/\')">단원 목록</button></div></div>';
    pane.innerHTML=h;
    pane.querySelectorAll('.chip').forEach(function(b){
      b.onclick=function(){ runQuiz(pane,qs,opt); }; });
    document.getElementById('again').onclick=function(){ runQuiz(pane,qs,opt); };
  }
  paint();
}
function mark(q,right,opt,i){
  var u=opt&&(opt.unitOf?opt.unitOf(i):opt.unit);
  if(!u) return;
  var s=unitState(u); s.done[q.n]=right?1:0; save(); logStudy(right);
}

/* ═══════════ 오답노트 ═══════════ */
function viewWrong(){
  setHead('오답노트','틀린 문항 다시 풀기',true);
  var need=[];
  IDX.units.forEach(function(u){ var s=ST.u[u.unit]; if(!s) return;
    var ns=Object.keys(s.done).filter(function(k){return s.done[k]===0;});
    if(ns.length) need.push({u:u.unit,title:u.title,ns:ns.map(Number)}); });
  if(!need.length){ $app.innerHTML='<div class="empty">틀린 문항이 없습니다.<br>문제를 풀면 오답이 여기에 모입니다.</div>'; return; }
  $app.innerHTML='<div class="spin">불러오는 중…</div>';
  var out=[], left=need.length;
  need.forEach(function(g){
    loadUnit(g.u,function(d){
      d.questions.forEach(function(q){ if(g.ns.indexOf(q.n)>=0) out.push({q:q,u:g.u,t:g.title}); });
      if(--left===0){
        out.sort(function(a,b){return a.u-b.u||a.q.n-b.q.n;});
        $app.innerHTML='<div class="small muted" style="margin:12px 4px 10px">총 '+out.length+'문항</div><div id="pane"></div>';
        runQuiz(document.getElementById('pane'), out.map(function(x){return x.q;}),
          {title:'오답노트', label:function(q,i){return 'NCS '+out[i].u+'편 · 문항 '+q.n;},
           unitOf:function(i){return out[i].u;}});
      }
    });
  });
}

/* ═══════════ 랜덤 모의고사 ═══════════ */
function viewMock(){
  setHead('랜덤 모의고사','전 단원에서 무작위 출제',true);
  var ready=IDX.units.filter(function(u){return u.ready;});
  $app.innerHTML='<div class="card" style="padding:16px;margin-top:14px">'+
    '<div style="font-weight:800;font-size:15px">모의고사 설정</div>'+
    '<div class="small muted" style="margin-top:4px">전체 '+ready.length+'개 단원에서 무작위로 뽑습니다.</div>'+
    '<div class="qbtns" style="margin-top:14px">'+
      [20,30,50].map(function(n){return '<button class="qbtn" data-n="'+n+'">'+n+'문항</button>';}).join('')+
    '</div>'+
    '<div class="qbtns" style="margin-top:8px">'+
      '<button class="qbtn primary" data-n="50" data-only="mcq">객관식 50문항</button></div>'+
    '</div><div id="pane"></div>';
  $app.querySelectorAll('[data-n]').forEach(function(b){
    b.onclick=function(){ startMock(+b.dataset.n, b.dataset.only); };
  });
}
function startMock(n,only){
  var pane=document.getElementById('pane');
  pane.innerHTML='<div class="spin">문제를 뽑는 중…</div>';
  var ready=IDX.units.filter(function(u){return u.ready;});
  var left=ready.length, pool=[];
  ready.forEach(function(u){
    loadUnit(u.unit,function(d){
      d.questions.forEach(function(q){ if(!only||q.type===only) pool.push({q:q,u:u.unit}); });
      if(--left===0){
        for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
        var pick=pool.slice(0,n);
        $app.querySelector('.card').classList.add('hide');
        runQuiz(pane,pick.map(function(x){return x.q;}),
          {title:'랜덤 모의고사 '+n+'문항',
           label:function(q,i){return 'NCS '+pick[i].u+'편 · 문항 '+q.n;},
           unitOf:function(i){return pick[i].u;}});
      }
    });
  });
}

/* ═══════════ 시작 ═══════════ */
loadIndex(function(d){ IDX=d; render(); });
</script>
