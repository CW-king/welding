<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>NCS 용접 문제은행</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#1d4ed8; --brand-soft:#e8eefc; --ok:#047857; --ok-soft:#d9f2e6;
  --no:#b91c1c; --no-soft:#fde8e8; --warn:#b45309; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#141c2e;--ink:#e8edf7;--muted:#93a1bb;--line:#243149;
        --brand:#7aa2ff;--brand-soft:#1b2947;--ok:#4ade80;--ok-soft:#12301f;
        --no:#fca5a5;--no-soft:#3a1414;--warn:#fbbf24;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.62;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:54px}
.hd h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.iconbtn:active{background:var(--bg)}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:22px 4px 8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.g{background:var(--ok-soft);color:var(--ok)}
.badge.r{background:var(--no-soft);color:var(--no)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* ── 단원 카드 ── */
.unit{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-bottom:0;cursor:pointer}
.ulist .unit:first-child{border-radius:var(--r) var(--r) 0 0}
.ulist .unit:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:1px solid var(--line)}
.ulist{box-shadow:var(--shadow);border-radius:var(--r)}
.unum{flex:0 0 40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:14px}
.unit.done .unum{background:var(--ok-soft);color:var(--ok)}
.ubody{flex:1;min-width:0;display:block}
.utitle,.umeta{display:block}
.utitle{font-weight:700;font-size:14.5px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.umeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.bar{height:4px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.unit.locked{opacity:.5;cursor:default}

/* ── 요약 배너 ── */
.hero{padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center}
.ring{flex:0 0 68px;height:68px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px}
.hero .n{font-size:13px;color:var(--muted)}
.qbtns{display:flex;gap:8px;margin-top:12px}
.qbtn{flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.qbtn:active{transform:scale(.98)}
.qbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── 탭 ── */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff}

/* ── 이론 ── */
.theory{padding:4px 16px 18px}
.theory h2{font-size:16.5px;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line);letter-spacing:-.02em}
.theory h2:first-child{border-top:0;padding-top:0;margin-top:8px}
.theory h3{font-size:15px;margin:18px 0 6px;color:var(--brand)}
.theory h4{font-size:14px;margin:14px 0 4px}
.theory p{margin:7px 0;font-size:14.5px}
.theory li{font-size:14.5px;margin:5px 0 5px 2px;padding-left:13px;position:relative;list-style:none}
.theory li:before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--brand)}
.theory ul{margin:6px 0;padding:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:380px}
table.nohead{min-width:0;table-layout:fixed}
table.nohead td{word-break:keep-all;overflow-wrap:anywhere}
table.nohead td:first-child{width:34%;font-weight:700}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft);color:var(--brand);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{border-right:0}

/* ── 문제 ── */
.q{padding:15px 16px;margin-bottom:12px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.qno{font-weight:800;color:var(--brand);font-size:13px;flex:0 0 auto}
.qstem{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.6;white-space:pre-line}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card);font-size:14.3px;cursor:pointer;line-height:1.5}
.ch:active{border-color:var(--brand)}
.ch .k{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--line);
  color:var(--muted);font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px}
.ch.sel{border-color:var(--brand);background:var(--brand-soft)}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .k{background:var(--ok);color:#fff}
.ch.no{border-color:var(--no);background:var(--no-soft)}
.ch.no .k{background:var(--no);color:#fff}
.ch[disabled]{cursor:default}
.sa{width:100%;margin-top:9px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--bg);font-size:14.5px}
.sa:focus{outline:0;border-color:var(--brand)}
.reveal{margin-top:10px;padding:12px 13px;border-radius:11px;background:var(--brand-soft);font-size:14px}
.reveal.ok{background:var(--ok-soft)}.reveal.no{background:var(--no-soft)}
.reveal.ok .lab{color:var(--ok)}.reveal.no .lab{color:var(--no)}
.reveal .lab{font-weight:800;font-size:12px;color:var(--brand);letter-spacing:.04em;display:block;margin-bottom:3px}
.reveal .ansv{font-weight:700;font-size:14.5px}
.reveal .exp{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(125,140,170,.4);
  font-size:13.6px;line-height:1.65;white-space:pre-line}
.reveal .vnote{margin-top:8px;font-size:12.6px;line-height:1.55;color:var(--muted);
  padding:7px 9px;border-radius:8px;background:rgba(120,130,150,.12)}
.reveal .vnote em{font-style:normal;font-weight:800;color:var(--ink)}
.act{display:flex;gap:8px;margin-top:11px}
.btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.45}

/* ── 풀기 모드 ── */
.progress{position:sticky;top:54px;z-index:20;background:var(--bg);padding:10px 0 6px}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--brand);transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.navbtns{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:760px;margin:0 auto}
.result{padding:26px 18px;text-align:center;margin-top:16px}
.result .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--ok-soft);color:var(--ok);border:0;cursor:pointer}
.chip.bad{background:var(--no-soft);color:var(--no)}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:14px}
.spin{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#111827;color:#fff;
  padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.94}

.wkft{max-width:760px;margin:22px auto 0;padding:0 14px calc(24px + env(safe-area-inset-bottom));text-align:center}
.wkft a{display:inline-block;margin:0 3px 6px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);
  text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;background:var(--card)}
</style>
</head>

<div class="wrap" id="app"><div class="spin">불러오는 중…</div></div>

it":16,"title":"가스텅스텐아크용접 도면 해독","code":"LM1601050302","group":"GTAW","count":50,"mcq":35,"short":15,"theory":19,"ready":true},{"unit":17,"title":"가스텅스텐아크용접 재료 준비","code":"LM1601050303","group":"GTAW","count":50,"mcq":35,"short":15,"theory":61,"ready":true},{"unit":18,"title":"가스텅스텐아크용접 장비 설치","code":"LM1601050304","group":"GTAW","count":60,"mcq":45,"short":15,"theory":28,"ready":true},{"unit":19,"title":"가스텅스텐아크용접 가용접 작업","code":"LM1601050305","group":"GTAW","count":50,"mcq":35,"short":15,"theory":38,"ready":true},{"unit":20,"title":"가스텅스텐아크용접 맞대기용접","code":"LM1601050311","group":"GTAW","count":50,"mcq":35,"short":15,"theory":26,"ready":true}],"generated":"2026-08-20"};window.__DATA__={"1":{"unit":1,"title":"작업안전보건관리","code":"LM1601050001","group":"공통","theory":[{"t":"h2","v":"제1부: NCS 1편 작업안전보건관리 핵심 이론 요약"},{"t":"h2","v":"제1장. 용접작업 안전수칙 파악하기"},{"t":"h3","v":"1. 산업재해 예방 필수 안전수칙: 이크(IERC)의 개요 및 4대 추진과제"},{"t":"p","v":"산업재해 예방을 위한 필수 안전수칙인 '이크(IERC)'는 최근 대형 산업재해들의 원인을 정밀 분석하여 작업장에서 근로자의 생명과 안전을 보호하기 위해 스스로 정리해 실천하는 자율 안전 활동입니다. 이는 4대 추진과제와 17대 세부 실천수칙으로 구성됩니다."},{"t":"table","rows":[["추진과제","세부 실천 수칙"],["위험요인 드러내기 (Identify)","① 작업장 위험요인 발굴하기 ② 위험요인 목록 작성하기 ③ 작업장 위험요인 알려주기 ④ 확인된 위험요인 표시 및 표지하기"],["사고위험 없애기 (Eliminate)","⑤ 작업자가 위험요인 개선 요청하기 ⑥ 위험요인에 대해 근원적으로 안전조치하기 ⑦ 안전조치 이상유무 감시(담당자 지정)하기"],["잠재위험 통제하기 (Control)","⑧ 사고 위험성(발생 가능성 및 예상피해) 최소화하기 ⑨ 작업별 위험요인 관리책임자 지정하기 ⑩ 작업 전 안전교육 및 개인별 위험요인 숙지하기 ⑪ 개인 보호구 지급 및 착용하기 ⑫ 안전작업절차 표시 및 준수하기 ⑬ 작업 시작 전·중·후 안전점검하기 ⑭ 하청업체 안전작업책임자 지정 및 작업 관리하기"],["사고 시 신속 대응하기 (Response)","⑮ 개인별 대피요령과 역할 숙지하기 ⑯ 사고 발생시 긴급대피 및 관계기관에 신고하기 ⑰ 사고원인 및 대응의 적절성 조사 및 재발 방지 조치하기"]]},{"t":"h3","v":"2. 산업재해 발생 원인"},{"t":"p","v":"용접작업 환경에서 발생하는 사고는 인적 원인과 물적 원인으로 나뉩니다. 인적 원인(불안전한 행동)은 숙련도 부족, 흥분, 소홀 등의 심리적 요인과 피로, 수면 부족, 음주 등의 생리적 요인으로 세분됩니다. 물적 원인(불안전한 상태)은 환기 불량, 통로 차단 등 건물·환경 요인과 안전장치 결함, 불량 공구 등의 설비적 요인이 존재합니다."},{"t":"h3","v":"3. 안전보건 표지의 종류 및 안전표지 색채의 용도"},{"t":"table","rows":[["구분","색상 및 형태","주요 표준 기준 및 용도"],["경고 표지","황색 삼각형 + 흑색 부호","위험 요소 경고 (인화성 물질 경고, 고전압 경고 등)"],["금지 표지","적색 원형 + 흑색 부호","특정 행위의 금지 (화기금지, 출입금지 등)"],["지시 표지","청색 원형 + 백색 부호","특정 장비의 의무 착용 지시 (안전모 착용, 보안경 착용 등)"],["안내 표지","녹색 사각형 + 백색 부호","위생 및 피난 정보 안내 (비상구, 응급구호소 등)"],["출입 금지 표지","흰색 바탕 + 적색/흑색 글자","특정 장소의 외부인 출입 제한 안내"]]},{"t":"p","v":"※ 참고 - 녹십자 표지의 유래"},{"t":"p","v":"녹십자 표지는 1964년 노동부 예규 제6호에 의해 산업 안전의 상징으로 도입되었습니다. 서양에서는 십(十)자가 인애(仁愛)를 뜻하고, 동양에서는 복덕(福德)을 상징하며, 근로자의 주의를 환기시키고 재해를 예방하는 상징물로 사용됩니다."},{"t":"h3","v":"4. 용접 안전보호구의 종류 및 안전모/안전화의 구분"},{"t":"h4","v":"안전모의 종류 및 용도"},{"t":"table","rows":[["종류 기호","사용 구분","모체의 주요 재질"],["낙하방지용 (A)","물체의 낙하 또는 날아옴에 의한 머리 위험 방지","합성수지, 금속"],["낙하·추락방지용 (AB)","물체의 낙하 및 근로자가 떨어지는(추락) 위험 방지","합성수지"],["낙하·감전방지용 (AE)","물체의 낙하 및 머리부위의 전기 감전 예방","합성수지 (금속 불허)"],["다목적용 (ABE)","물체의 낙하, 추락, 머리부위 감전 위험을 동시 예방","합성수지 (절연재질)"]]},{"t":"h4","v":"안전화의 종류 및 사용 구분"},{"t":"li","v":"① 경작업용: 금속 선별, 전기제품 조립 등 비교적 가벼운 물체를 취급하는 작업장에서 사용합니다."},{"t":"li","v":"② 보통작업용: 기계공업, 금속가공업 등 손으로 일반 물체를 취급하는 공정 및 차량 사업장 등에서 사용합니다."},{"t":"li","v":"③ 중작업용: 광산, 중공업, 건설업 등에서 중량물을 운반하고 큰 충격을 유발하는 대형 부품 취급 작업에 적용합니다."},{"t":"h2","v":"제2장. 용접작업장 주변 정리 상태 점검하기"},{"t":"h3","v":"1. 하인리히와 수정 도미노 재해 이론 비교"},{"t":"table","rows":[["단계","하인리히 도미노 이론 (인과 관계)","수정 도미노 이론 (현대적 안전)"],["1단계","유전요소 및 사회적 환경 (유전적 단점 등)","통계의 부족 / 관리의 소홀 (제도 및 관리 부족)"],["2단계","개인적 결함 (조급하거나 난폭한 성격)","기본원리 / 기원 (지식 부족, 기술적 오판)"],["3단계","불안전한 행동 또는 불안전한 상태 (직접 제거 대상)","직접 원인 / 징후 (불안전한 상태 및 행동의 노출)"],["4단계","사고 (접합 불량, 추락 등 물리적 마찰)","사고 / 접촉 (에너지나 유해 물질과의 신체 접촉)"],["5단계","재해 (상해, 손상 및 인명 피해 발생)","상해 및 손상 / 손실 (최종적 근로자 및 재산의 손실)"]]},{"t":"p","v":"※ 핵심 실천 원칙: 재해 예방의 관건은 3단계인 '불안전한 행동 및 상태'를 완전 통제하고 차단하는 데 있습니다."},{"t":"h3","v":"2. 화재의 원인과 표준 화재 분류 체계"},{"t":"h4","v":"화재의 원인 3대 분류: ① 유류에 의한 착화, ② 유류에 의한 발화, ③ 전기에 의한 발화(단락, 누전, 과전류 등)"},{"t":"h2","v":"제3장. 안전 점검하기"},{"t":"h3","v":"1. 주기와 목적에 따른 안전점검의 분류"},{"t":"table","rows":[["안전점검 종류","점검의 주기 및 정의"],["일상 점검","현장 감독자 또는 작업 책임자가 자신이 담당하는 공정의 설비, 장비, 기계를 매일 작업 시작 전, 종료 시 또는 작업 중 수시로 확인하는 상시 점검입니다."],["정기 점검","일정 기간마다 규칙적으로 실시하는 점검으로, 각 분야의 책임자가 장비와 부속 시설의 마모, 피로, 부식, 파손 등 이상 유무를 종합 점검합니다. (주로 매주 또는 매월 1회)"],["특별 점검","기계·기구 및 주요 설비를 신설, 변경, 대개조하거나 고장으로 인한 정밀 수리 후에 행하는 비정기 점검입니다. 산업안전보건 강조기간이나 천재지변 발생 직후 실시하는 점검도 포함됩니다."],["임시 점검","정기점검 실시 후 다음 정기점검 기일 이전에 장비 작동 이상이 발견되거나 불안전한 징후가 나타날 때 긴급하게 임시로 행하는 수시 점검입니다."]]},{"t":"h3","v":"2. 아크용접용 전격방지기의 주요 역할 및 원리"},{"t":"p","v":"교류 아크용접은 전격(전기 쇼크) 위험이 상시 수반되므로 '자동전격방지기'의 설치가 필수적입니다."},{"t":"li","v":"① 감전 보호: 무부하 상태일 때 고전압(65~80V)의 용접기 2차측 전압을 안전 전압(20~30V) 이하로 저하시켜 감전으로부터 작업자를 절대적으로 보호합니다."},{"t":"li","v":"② 무부하 전력 손실 억제: 용접을 하지 않는 휴지 시간에 변압기의 와류 손실 및 히스테리시스 손실에 따른 무부하 손실 전력을 현격히 줄여줍니다."},{"t":"li","v":"③ 역률 개선 및 장비 보호: 전력 소모의 효율성을 증대하여 전체 전원장치의 역률을 개선하고 기기의 신뢰성을 극대화합니다."},{"t":"h2","v":"제4장. 물질안전보건자료(MSDS) 점검하기"},{"t":"h3","v":"1. 물질안전보건자료(MSDS)의 핵심 개요 및 16가지 표준 항목"},{"t":"p","v":"화학물질을 제조, 사용, 보관하는 사업장에서는 작업자가 상시 열람할 수 있도록 안전보건공단 또는 제조사의 물질안전보건자료(MSDS)를 비치해야 합니다. MSDS는 화학물질의 안전하고 건강한 처리를 보장하는 국제 표준 문서(16가지 필수 구성 항목)로 이루어집니다."},{"t":"table","rows":[["1. 화학제품과 회사에 관한 정보","9. 물리 화학적 특성"],["2. 유해성·위험성","10. 안전성 및 반응성"],["3. 구성성분의 명칭 및 함유량","11. 독성에 관한 정보"],["4. 응급조치요령","12. 환경에 미치는 영향"],["5. 폭발·화재시 대처방법","13. 폐기시 주의 사항"],["6. 누출사고 시 대처방법","14. 운송에 필요한 정보"],["7. 취급 및 저장방법","15. 법적 규제 현황"],["8. 노출방지 및 개인 보호구","16. 그 밖의 참고사항"]]},{"t":"h3","v":"2. 용접 공정 유해 요소별 응급 대처 요령 및 안전 기준"},{"t":"li","v":"① 유해 광선(아크 아이 및 전안염):"},{"t":"li","v":"강렬한 자외선/적외선에 노출되어 눈이 충혈되고 통증이 수반될 경우, '찬 물수건'을 사용해 즉시 냉습포(냉찜질) 조치를 수행하고 절대 눈을 비비지 않은 채 안정을 취합니다. 화상 예방을 위해 반드시 알맞은 차광도 번호의 필터 유리가 달린 용접용 차광보호구를 사용하고 외부 차단 커튼을 설치합니다."},{"t":"li","v":"② 피부 화상:"},{"t":"li","v":"1도(발적), 2도(물집), 3도(피부 및 신경 완전 손상)로 분류됩니다. 즉시 흐르는 찬물에 최소 20~30분 이상 화상 부위를 식혀 열기를 완전히 빼내며, 감염 예방을 위해 생성된 물집은 절대 터뜨리지 않고 마른 청결한 거즈로 가볍게 감싸 안고 신속히 전문 병원으로 이송합니다."},{"t":"li","v":"③ 가스 질식 및 유해 흄 중독:"},{"t":"li","v":"밀폐 구역이나 환기가 극히 제한된 탱크 내부 등에서 작업할 시에는 산소 농도를 측정하여 항상 '18% 이상'의 적정 산소 농도를 유지해야 하며, 작업 도중에는 로컬 환기 팬을 강제 작동하고 방독면 또는 송기마스크를 반드시 착용하여 안전을 확보합니다."},{"t":"h2","v":"제2부: NCS 1편 작업안전보건관리 실전 평가 50제"},{"t":"h4","v":"평가 문항 및 정답과 해설"}],"questions":[{"n":1,"type":"mcq","stem":"대형 산업재해의 주요 원인이 되는 기본적인 안전 수칙 미준수를 방지하기 위하여, 자율적으로 안전 점검 활동을 펼치는 재해 예방 4대 추진과제의 핵심 요약 기호로 옳은 것은?","choices":["IERC (이크)","OSHA","MSDS","KOSHA"],"answerIndex":1,"answerText":"① IERC (이크)","explain":"기본적인 안전수칙 미준수로 발생하는 대형 산업재해를 예방하기 위해 정리한 '4대 추진과제 및 17대 실천수칙'을 이크(IERC)라고 합니다."},{"n":2,"type":"mcq","stem":"이크(IERC)의 4대 추진과제에 해당하지 않는 항목은 무엇인가?","choices":["위험요인 드러내기 (Identify)","사고위험 없애기 (Eliminate)","잠재위험 통제하기 (Control)","사고 시 신속책임전가 (Responsibility)"],"answerIndex":4,"answerText":"④ 사고 시 신속책임전가 (Responsibility)","explain":"이크(IERC)의 4대 추진과제는 위험요인 드러내기(Identify), 사고위험 없애기(Eliminate), 잠재위험 통제하기(Control), 사고 시 신속 대응하기(Response)입니다."},{"n":3,"type":"mcq","stem":"다음 중 이크(IERC)의 '위험요인 드러내기(Identify)' 실천수칙으로 적합하지 않은 행동은?","choices":["작업장 위험요인을 성실히 발굴한다.","발굴한 유해 요인의 상세 목록을 작성한다.","작업장에서 위험요인을 확인하면 숨기고 혼자만 주의한다.","확인된 위험요인을 겉으로 표시하고 표지를 제작해 부착한다."],"answerIndex":3,"answerText":"③ 작업장에서 위험요인을 확인하면 숨기고 혼자만 주의한다.","explain":"위험요인은 모든 근로자가 알 수 있도록 공개적으로 알리고, 구별 가능한 표시 및 표지 조치를 취하여 겉으로 드러내야 합니다."},{"n":4,"type":"mcq","stem":"이크(IERC)의 '사고위험 없애기(Eliminate)' 실천수칙에 해당하는 내용은?","choices":["작업 전 안전보호장구 지급 및 착용","작업자가 위험요인을 직접 감지 시 전폭적인 개선 요청","개인별 비상시 대피 요령 교육 실시","작업 시작 전·중·후 장비에 대한 일상점검 수행"],"answerIndex":2,"answerText":"② 작업자가 위험요인을 직접 감지 시 전폭적인 개선 요청","explain":"사고위험 없애기 단계의 수칙은 작업자의 유해 요인 개선 요청, 근원적인 안전조치 실시, 안전조치 감시인 지정 등이 있습니다."},{"n":5,"type":"mcq","stem":"이크(IERC)의 '잠재위험 통제하기(Control)' 실천수칙에 해당하는 것은?","choices":["사고 발생 후 즉각 관계기관에 상황 신고","개인별 대피 역할 및 비상 통로 숙지","작업 전 안전교육 진행 및 보호구 착용","사고 원인 및 대응 적절성 정밀 재조사"],"answerIndex":3,"answerText":"③ 작업 전 안전교육 진행 및 보호구 착용","explain":"잠재위험을 예방적으로 관리하는 단계로, 대표적인 수칙으로는 작업 전 안전교육 실시, 개인보호구 지급 및 착용, 관리책임자 지정 등이 해당됩니다."},{"n":6,"type":"mcq","stem":"용접 작업 시 유독 가스가 체류하기 쉬운 밀폐구역 작업 전 이크(IERC)의 수칙에 근거하여 행해야 할 올바른 조치로 가장 옳지 않은 것은?","choices":["용접 흄 발생을 억제하기 위한 차단 설비나 환기 시설 확인","작업 전 산소 농도를 측정하여 반드시 18% 이상을 항상 확인","공기 송급식 송기마스크 등 고기능 안전보호구 착용","아세틸렌 누설 점검 시 라이터 불꽃을 사용하여 누설을 빠르게 찾음"],"answerIndex":4,"answerText":"④ 아세틸렌 누설 점검 시 라이터 불꽃을 사용하여 누설을 빠르게 찾음","explain":"가연성 고압가스인 아세틸렌의 누설을 확인할 때 라이터 등의 불꽃을 직접 대는 행동은 폭발과 대형 화재를 유발하는 극도의 불안전한 행동입니다. 반드시 비눗물을 이용해야 합니다."},{"n":7,"type":"mcq","stem":"산업재해가 발생하는 원인 중 작업자 개인의 무리, 과실, 난폭, 흥분 등과 관계가 깊은 것은 무엇인가?","choices":["생리적 인적 원인","심리적 인적 원인","환경적 물적 원인","설비적 물적 원인"],"answerIndex":2,"answerText":"② 심리적 인적 원인","explain":"정신적인 상태나 감정 변화, 판단 착오 등으로 기인하는 사고 원인을 심리적 인적 원인이라 정의합니다."},{"n":8,"type":"mcq","stem":"다음 중 산업재해의 물적 원인(불안전한 상태) 중 '설비적 원인'에 해당하는 것은 무엇인가?","choices":["안전장치가 고장났거나 결함이 있는 공구 및 기계의 방치 사용","작업장 복도 및 안전통로 내부의 조명 및 조도 부족","작업 공간이 좁고 미로 같은 형상","공장 내부의 전반적인 환기 상태의 장시간 작동 불량"],"answerIndex":1,"answerText":"① 안전장치가 고장났거나 결함이 있는 공구 및 기계의 방치 사용","explain":"설비적 요인은 기계장치, 안전보호구, 가공 치공구, 동력 배선 설비 자체의 구조적 결함이나 손상 및 정비 불량을 뜻합니다."},{"n":9,"type":"mcq","stem":"유해하고 위험한 장치 및 장소에 경고를 표시함으로써 근로자의 불안전 행동을 예방하려는 안전보건 표지의 목적으로 알맞은 것은?","choices":["장비의 마모 주기를 자동으로 감지하기 위함","작업자의 신체 능력을 평가하기 위함","생산 작업의 총체적 속도를 증대시키기 위함","주의력을 높여 재해를 미연에 방지하기 위함"],"answerIndex":4,"answerText":"④ 주의력을 높여 재해를 미연에 방지하기 위함","explain":"안전보건 표지는 직관적인 부호와 색채, 그림을 통해 유해성에 대한 높은 주의력을 키워 재해 위험을 감소시키는 데 가치가 있습니다."},{"n":10,"type":"mcq","stem":"안전표지 중 '황색 삼각형 모양에 흑색 부호 및 문자'로 도안되어 있는 표지의 명칭과 기능으로 옳은 것은?","choices":["경고 표지 - 작업장 내부의 일정 위험 요소를 사전에 경고","안내 표지 - 비상구 및 응급구호 구역의 안내 기능","금지 표지 - 일정한 행위를 허용하지 않음","지시 표지 - 작업 중 특정 개인보호구의 착용 강제 지시"],"answerIndex":1,"answerText":"① 경고 표지 - 작업장 내부의 일정 위험 요소를 사전에 경고","explain":"경고 표지는 황색 삼각형 바탕에 흑색 테두리 및 흑색 그림 기호로 위험을 사전에 인지시키는 표지입니다."},{"n":11,"type":"mcq","stem":"지시 표지의 색채 및 구조 표준 규격으로 알맞은 것은 무엇인가?","choices":["적색 원형에 흑색 사선 부호","노란색 삼각형에 백색 테두리","청색 원형 바탕에 백색 부호","녹색 사각형 바탕에 백색 문자"],"answerIndex":3,"answerText":"③ 청색 원형 바탕에 백색 부호","explain":"지시 표지는 반드시 지켜야 할 일종의 의무 명령을 뜻하며, 시인성이 강한 파란색 원형 바탕에 흰색 그림 기호로 도안됩니다."},{"n":12,"type":"mcq","stem":"비상구, 대피소, 피난소, 응급 구호소와 같이 재난 발생 시 피난을 유도하고 안내하는 '안내 표지'의 색상 구성 기준은?","choices":["흰색 바탕에 적색 원형 및 테두리","청색 바탕에 백색 원형 및 부호","녹색 사각형 바탕에 백색 부호 및 문자","노란색 삼각형 바탕에 청색 테두리"],"answerIndex":3,"answerText":"③ 녹색 사각형 바탕에 백색 부호 및 문자","explain":"안내 표지는 편안함과 안전을 유도하는 표준 녹색 사각형 바탕에 백색으로 정보가 도안됩니다."},{"n":13,"type":"mcq","stem":"대한민국 산업 안전의 상징물로 1964년 노동부 예규 제6호에 게시하여 위험 지역에 부착하도록 최초 권장된 '녹십자 표지'의 의미 중 동양적 유래의 의미로 올바른 것은?","choices":["인애(仁愛)","복덕(福德)","협동(協同)","성실(誠實)"],"answerIndex":2,"answerText":"② 복덕(福德)","explain":"서양에서 녹십자의 십(十)자는 인애(仁愛)를 의미하며, 동양적 의미로는 전통적으로 복덕(福德)을 의미해 산업 재해 예방의 간절함을 상징합니다."},{"n":14,"type":"mcq","stem":"안전표지 색채의 기능적 분류 중 '빨간색'이 의미하는 표준 안전 용도로 가장 알맞지 않은 것은?","choices":["방화 설비의 위치 및 식별 수칙","무조건적인 정지 신호","고도의 긴급한 위험 구역 경고","대피로의 명확한 통행 경로 안내"],"answerIndex":4,"answerText":"④ 대피로의 명확한 통행 경로 안내","explain":"대피로, 진행 신호, 구호 및 안전에 사용하는 표준 색채는 빨간색이 아니라 초록색(녹색)입니다."},{"n":15,"type":"mcq","stem":"충돌, 추락, 미끄러짐, 걸려 넘어짐 등 작업자가 가장 흔하게 겪는 일반적인 위험 요소에 주의력을 인가하도록 '주의 표지'에 광범위하게 쓰이는 색상은?","choices":["파란색","빨간색","자주색","노란색"],"answerIndex":4,"answerText":"④ 노란색","explain":"주의 및 경고에는 명도가 아주 강해 멀리서도 뚜렷이 구분할 수 있는 황색(노란색)이 표준 색채로 도용됩니다."},{"n":16,"type":"mcq","stem":"작업장에서 전기 배선의 통로, 구획, 정리정돈 상태를 시각화하여 나타낼 때 사용하는 표준 안전 표지 색상은?","choices":["자주색","검은색","청색","흰색"],"answerIndex":4,"answerText":"④ 흰색","explain":"안전 통로나 적재 장소의 경계, 기구 정리정돈 구획을 시각화해 겉으로 나타낼 때는 흰색을 사용합니다."},{"n":17,"type":"mcq","stem":"높이 또는 깊이가 최소 몇 미터 이상이 되어 작업자가 떨어지거나 실족하여 낙하하는 치명적인 재해 우려가 있는 장소에서 상시 안전벨트(안전대) 착용을 강제해야 하는가?","choices":["1m 이상","2m 이상","3m 이상","5m 이상"],"answerIndex":2,"answerText":"② 2m 이상","explain":"산업안전보건 기준에 관한 규칙에 따라 높이 또는 깊이가 2m 이상이 되는 낙하/추락 위험 구역에서는 안전대를 의무 설치 및 착용해야 합니다."},{"n":18,"type":"mcq","stem":"비행기 엔진 소리(약 120dB)나 조선소의 강한 소음(90dB 이상)이 고막에 장시간 인가될 위험이 높은 용접 공정 및 하역 공정에서 반드시 착용을 강제하는 표준 보호구는?","choices":["차광 보안경","방진 마스크","귀마개 또는 귀덮개","가죽 재킷"],"answerIndex":3,"answerText":"③ 귀마개 또는 귀덮개","explain":"강렬한 고소음 환경에서 작업자의 청력을 보호하고 난청 직업병을 예방하기 위해 소음방지용 귀마개 또는 귀덮개를 착용합니다."},{"n":19,"type":"mcq","stem":"안전모의 종류 기호 중 '물체의 낙하, 날아옴 및 근로자가 실족해 떨어지는 높은 낙하(추락) 위험'을 동시 경감하기 위해 사용하는 AE 모체의 재질은 무엇인가?","choices":["스테인리스강","순 연강 재질","경량 알루미늄 판","합성수지"],"answerIndex":4,"answerText":"④ 합성수지","explain":"감전 위험이 있는 AE 및 ABE형 안전모는 절대 금속 재질을 사용할 수 없으며, 절연 특성이 우수하고 기계적 강도가 보장된 합성수지를 표준 재질로 사용합니다."},{"n":20,"type":"mcq","stem":"피복 아크 용접 작업자의 눈이 강한 아크 자외선에 오랜 시간 노출되어 빨갛게 눈이 충혈되고 통증이 수반되는 질병인 전안염(아크 아이)이 발생했을 때 적합한 직접적인 응급 대처 요령은?","choices":["즉시 눈 주위를 뜨겁게 온찜질하여 혈액순환을 늘린다.","거친 수건으로 눈을 세게 문질러 이물질을 빠르게 배출한다.","차가운 물수건으로 냉습포(냉찜질)를 진행하고 눈을 감은 뒤 안정을 취한다.","일반 알코올 소독약을 사용해 안구 표면을 세척한다."],"answerIndex":3,"answerText":"③ 차가운 물수건으로 냉습포(냉찜질)를 진행하고 눈을 감은 뒤 안정을 취한다.","explain":"아크 빛 자외선에 의해 눈에 급성 각막염(전안염)이 발생해 충혈되고 통증이 나타날 때는 즉각 찬 물수건으로 냉습포를 한 뒤 안과 진료를 받아야 합니다."},{"n":21,"type":"mcq","stem":"용접 열 또는 슬래그 비산에 의해 발생하는 화상 등급 중 '피부가 붉게 부어오르는(발적) 증상만 있으며 경미한 상태'를 나타내는 등급은?","choices":["1도 화상","2도 화상","3도 화상","4도 화상"],"answerIndex":1,"answerText":"① 1도 화상","explain":"1도 화상은 상피 조직에만 열적 충격이 가해져 통증과 발적만 있는 상태로, 흐르는 찬물에 냉각시켜 안정화할 수 있는 가장 경미한 등급입니다."},{"n":22,"type":"mcq","stem":"화재 분류 및 표준 도색 표식 기준에서 전기에 의한 발화(단락, 누전, 분전반 누전 등)로 발생하는 'C급 화재' 시 표준 색상 표식은?","choices":["청색","무색","백색","황색"],"answerIndex":1,"answerText":"① 청색","explain":"전기 화재(C급 화재)의 표준 표식 색상은 청색(파란색)이며, 사용 시 전기가 차단되지 않은 상태에서의 전기 전도성 소화약제(물 등)의 살포는 절대 금지됩니다."},{"n":23,"type":"mcq","stem":"가장 전통적인 재해 연쇄 이론인 '하인리히 도미노 이론'의 5단계 중 3단계에 해당하는 인자이자, 재해 예방의 직접적인 제어 대상이 되는 것은?","choices":["사회적 환경 및 유전적 특성","개인의 성격적 결함","불안전한 행동 또는 불안전한 상태","예상치 못한 불의의 사고"],"answerIndex":3,"answerText":"③ 불안전한 행동 또는 불안전한 상태","explain":"하인리히 도미노 이론에 따르면 3단계인 불안전한 행동(인적) 또는 불안전한 상태(물적)를 제거하면 연쇄 반응이 끊어져 최종 5단계인 재해를 완전 예방할 수 있습니다."},{"n":24,"type":"mcq","stem":"현대적인 관리를 강조하는 '수정 도미노 이론'에서 재해 발생의 1단계 근원 원인으로 지목하는 것은 무엇인가?","choices":["통계의 부족 및 관리 조직의 지도/소홀","작업장 내 인화성 가스의 체류 방치","개인의 선천적 유전 및 성격적 결함","설비 물적 상태의 노후화 및 마모"],"answerIndex":1,"answerText":"① 통계의 부족 및 관리 조직의 지도/소홀","explain":"수정 도미노 이론(현대적 안전)은 관리 부실 및 제도적 제도 조직의 소홀(1단계)을 사고의 가장 큰 근원적 원인으로 분석합니다."},{"n":25,"type":"mcq","stem":"작업장 안전 관리를 위해 감독자 및 안전 책임자가 자신이 담당하는 설비, 장비, 기계를 '매일 작업 시작 전 또는 종료 시' 주도적으로 실행하는 점검의 명칭은?","choices":["정기 점검","특별 점검","임시 점검","일상 점검"],"answerIndex":4,"answerText":"④ 일상 점검","explain":"매일의 일과 전/후 혹은 수시로 작업 상태나 기계 부품 손상 상태를 현장 책임자가 직접 육안 및 동작 확인하는 것을 일상 점검이라 합니다."},{"n":26,"type":"mcq","stem":"주요 기계나 주요 공정 설비를 새로 신설하거나 대개조 공사를 진행한 경우, 또는 고장으로 인한 완전한 정밀 수리를 마친 직후에 비정기적으로 실시하는 특별한 안전점검은?","choices":["특별 점검","정기 점검","상시 점검","임시 점검"],"answerIndex":1,"answerText":"① 특별 점검","explain":"설비의 물리적 환경이나 구조적 변경, 신설, 정밀 분해 소독 및 수리 직후에 오작동 여부를 정밀 확인하는 비정기 점검을 특별 점검이라 합니다."},{"n":27,"type":"mcq","stem":"전격(감전) 위험도가 상시 존재하여 작업 전 특별히 안전 조치를 요구하는 '교류 아크 용접기'의 내부적 위험 원인은 무엇인가?","choices":["아크 발생 시 사용 전류가 너무 낮아서","정류 리액터가 높은 고전류 파형을 제어하지 못해서","교류 아크 용접기의 2차측 무부하 전압이 필요 이상으로 높아서","용접 전류가 항상 일정한 수하 특성을 가져서"],"answerIndex":3,"answerText":"③ 교류 아크 용접기의 2차측 무부하 전압이 필요 이상으로 높아서","explain":"교류 아크 용접기는 무부하 상태 시 2차측 전압이 대개 65~80V 수준으로 매우 높아, 인체 접촉 시 치명적인 감전 재해를 일으킬 수 있습니다."},{"n":28,"type":"mcq","stem":"교류 아크 용접기에 의무 설치하도록 규정된 '자동전격방지기'의 정상 작동 원리로 옳은 것은?","choices":["용접 중 전류의 세기를 항상 10A 이하로 하강시킨다.","무부하 시 2차측 전압을 20~30V 이하로 낮춘다.","용접 도중 고전압이 발생하면 주변 전원을 모두 차단한다.","아크에 고주파를 융합시켜 2차 전압을 0V로 고정한다."],"answerIndex":2,"answerText":"② 무부하 시 2차측 전압을 20~30V 이하로 낮춘다.","explain":"전격방지기는 용접 아크가 정지한 무부하 상태일 때, 2차측 단자 전압을 안전한 무부하 전압(20~30V) 수준으로 자동으로 낮추어 감전을 예방합니다."},{"n":29,"type":"mcq","stem":"전기를 안전하게 다루기 위해 작업장에서 실천하는 전기 안전 수칙 중 가장 올바르지 않은 행동은?","choices":["모든 스위치는 사용처 및 해당 전기 장비의 고유 명칭을 부착한다.","분전반 및 스위치 함 내부에 비상용 예비 공구와 마른 걸레를 상시 보관한다.","허가 없이 전기 배선을 임의 결선하거나 연장해 사용하지 않는다.","전원 코드를 플러그로부터 분리할 때는 선을 절대 당기지 않고 본체 헤드를 잡고 분리한다."],"answerIndex":2,"answerText":"② 분전반 및 스위치 함 내부에 비상용 예비 공구와 마른 걸레를 상시 보관한다.","explain":"분전반(스위치 함) 내부는 정밀 전기 부품과 고전압 결선이 존재하므로 가연물이나 물건을 수납, 방치하면 화재 및 전기적 단락 사고를 유발합니다."},{"n":30,"type":"mcq","stem":"화학물질의 유해성 및 예방 조치 절차를 담고 있는 국제적 통용 문서로, 취급 근로자가 쉽게 접근하고 볼 수 있는 장소에 상시 비치해야 하는 서류의 약어는?","choices":["MSDS (물질안전보건자료)","IERC (안전 4대 추진과제)","PQR (용접절차 검정기록서)","WPS (용접절차 사양서)"],"answerIndex":1,"answerText":"① MSDS (물질안전보건자료)","explain":"MSDS는 화학 제품의 물리화학적 특성, 유해성, 위험성, 응급 대처법 등을 상세히 기록한 국제 공통 문서입니다."},{"n":31,"type":"mcq","stem":"물질안전보건자료(MSDS)의 필수 작성 및 표준 구성 항목은 총 몇 가지 항목으로 이루어져 있는가?","choices":["10가지","12가지","16가지","20가지"],"answerIndex":3,"answerText":"③ 16가지","explain":"안전보건공단 및 글로벌 기준에 의거하여 MSDS는 화학회사 정보, 독성 정보, 폭발 화재 대처법 등을 포함한 총 16가지 표준 항목으로 제정되어 있습니다."},{"n":32,"type":"mcq","stem":"MSDS의 16가지 필수 항목 중 용접 재료 연소나 비산 가스 화재 발생 시 소화 방법 및 위험성을 나타내는 항목으로 옳은 것은?","choices":["4번 항목: 응급조치 요령","5번 항목: 폭발·화재시 대처방법","8번 항목: 노출방지 및 개인 보호구","11번 항목: 독성에 관한 정보"],"answerIndex":2,"answerText":"② 5번 항목: 폭발·화재시 대처방법","explain":"화학물질 고유의 화재 폭발 및 인화성 거동과 대처 진화 방법은 MSDS 5번째 항목인 '폭발·화재시 대처방법'에 고시됩니다."},{"n":33,"type":"mcq","stem":"용접 흄 유입, 가스 누설, 혹은 독성 화학물질 노출 사고가 발생했을 때 즉각적인 응급 처치 요령을 찾기 위해 확인해야 하는 MSDS 구성 항목은?","choices":["2번 항목: 유해성·위험성","4번 항목: 응급조치 요령","10번 항목: 안전성 및 반응성","13번 항목: 폐기시 주의사항"],"answerIndex":2,"answerText":"② 4번 항목: 응급조치 요령","explain":"화학 사고 피해자의 생명을 살리고 상태 손상을 최소화하는 즉각적 의학적 처치 절차는 MSDS 4번 항목인 '응급조치요령'에 구체적으로 나와 있습니다."},{"n":34,"type":"mcq","stem":"MSDS 자료의 사업장 비치 수칙에 대한 설명 중 가장 타당하지 않은 기준은?","choices":["회사 기밀 유지를 위해 전용 컴퓨터 하드디스크 깊숙이 암호를 설정해 보관하고 관리자만 승인 하에 열람한다.","새로운 자재가 도입되면 MSDS 요건을 업데이트하여 교육을 이수해야 한다.","근로자가 가장 보기 쉽고 접근하기 편리한 전용 서가에 항상 비치한다.","화학사고 및 직업병의 잠재적 위험성이 높은 용접실 내부에 즉각 접근 가능하도록 게시한다."],"answerIndex":1,"answerText":"① 회사 기밀 유지를 위해 전용 컴퓨터 하드디스크 깊숙이 암호를 설정해 보관하고 관리자만 승인 하에 열람한다.","explain":"MSDS는 누구나 사고 시 빠르게 열람하여 대처법을 찾는 생명 안전 문서이므로 절대 암호를 설정하거나 특정 권한자만 볼 수 있게 제한하여 관리해선 안 됩니다."},{"n":35,"type":"mcq","stem":"아크용접 작업 중 발생하는 강한 유해 광선(자외선)에 피부가 지속적으로 노출되었을 때 나타나는 피부 화상 증상 중 '물집이 형성되는 상태'를 나타내는 임상적 등급은?","choices":["1도 화상","2도 화상","3도 화상","4도 화상"],"answerIndex":2,"answerText":"② 2도 화상","explain":"물집(수포)이 관찰되는 화상은 '2도 화상'이며, 절대로 강제 파손하여 터뜨리지 않도록 보호해야 세균 침투 및 2차 감염을 예방할 수 있습니다."},{"n":36,"type":"short","stem":"산업재해 예방을 위한 필수 안전수칙 이크(IERC)의 4대 추진과제를 한글 명칭으로 모두 쓰시오.","choices":[],"answerIndex":null,"answerText":"위험요인 드러내기, 사고위험 없애기, 잠재위험 통제하기, 사고 시 신속 대응하기","explain":"이크(IERC)는 Identify(위험요인 드러내기)·Eliminate(사고위험 없애기)·Response(사고 시 신속 대응하기)·Control(잠재위험 통제하기)의 4대 추진과제다."},{"n":37,"type":"short","stem":"안전보건 표지 중 청색 원형 바탕에 백색 부호로 구성되어 특정 장비의 착용이나 안전 행동을 강력하게 요구하는 표지 유형의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"지시 표지","explain":"특정 행위를 반드시 따르도록 명령하고 의무를 부여하는 안전보건 표지는 '지시 표지'입니다."},{"n":38,"type":"short","stem":"안전표지 색채 기준에서 '안전, 피난, 위생 및 구호, 작업의 안전한 진행'을 의미하며 대피로와 비상구 지시등에 필수적으로 쓰이는 대표적인 표준 색상을 쓰시오.","choices":[],"answerIndex":null,"answerText":"녹색 (초록색)","explain":"안전 및 피난의 상징 색상이며, 비상구나 유도 안내선 등에 표준 색채로 쓰이는 색상은 녹색입니다."},{"n":39,"type":"short","stem":"안전모 중 '물체의 낙하, 날아옴에 의한 머리 위험을 방지하고 근로자의 추락 위험을 예방하며, 동시에 고전압 감전의 위험까지 동시 차단하기 위한' 전천후 다목적 안전모의 표준 등급 기호를 쓰시오.","choices":[],"answerIndex":null,"answerText":"ABE","explain":"낙하(A), 추락(B), 감전(E) 방지 기능을 한 몸에 모두 갖춘 다목적용 규격 기호는 ABE형입니다."},{"n":40,"type":"short","stem":"안전화 종류 중 '금속선별, 정밀 전기제품 조립 등 비교적 중량이 가벼운 경량 가연 고체를 다루는 경작업장'에서 주로 사용하는 안전화의 사용 구분 등급 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"경작업용","explain":"물리적 충격이나 강도가 비교적 낮은 공정에서 착용하는 규격을 '경작업용' 안전화라 합니다."},{"n":41,"type":"short","stem":"하인리히의 재해 예방 5단계 연쇄 이론 중 '안전사고 예방 활동 시 직접적인 제거 대상이 되는 핵심적 단계'인 제3단계의 명칭을 한글로 정확히 쓰시오.","choices":[],"answerIndex":null,"answerText":"불안전한 행동 또는 불안전한 상태","explain":"사고 발생 전 직접적인 징후가 되는 인적불안전 행동과 물적불안전 상태가 이에 속합니다."},{"n":42,"type":"short","stem":"수정 도미노 이론(현대적 안전 이론)에서 재해 발생의 근원 원인이 되는 배후적 원인이자 지식의 결여를 지칭하는 제2단계 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"기본원인(기원)","explain":"버드의 수정 도미노 5단계는 제어부족 → 기본원인(기원) → 직접원인(징후) → 사고(접촉) → 상해(손실)다. 2단계 정식 명칭은 '기본 원리'가 아니라 기본원인이다."},{"n":43,"type":"short","stem":"화재 분류 및 소화기 표시 규정 중 나무, 종이, 섬유 등 가연성 일반 가 Solids의 연소로 발생하는 일반화재의 등급 기호를 쓰시오.","choices":[],"answerIndex":null,"answerText":"A급 화재","explain":"가장 빈번하게 발생하며 물 등으로 쉽게 냉각 소화 가능한 일반화재는 A급으로 분류됩니다."},{"n":44,"type":"short","stem":"용접 기기와 부속 케이블의 마모, 노후, 손상, 피로 상태를 확인하기 위해 매일 용접 작업 개시 전에 실시하는 일상적 안전점검의 유형 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"일상 점검","explain":"매일 일과 시작 전후에 기계 성능을 직접 시운전하며 이상을 육안 확인하는 점검은 일상점검입니다."},{"n":45,"type":"short","stem":"교류 아크용접용 감전 사고를 완전히 제어하기 위해 2차측 무부하 전압을 안전한 수준인 20~30V 이하로 저하시켜 주는 의무 부착 장치의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"자동전격방지기 (전격방지기)","explain":"무부하 시 용접 전류 흐름이 차단되면 단자 전압을 전기적으로 강압하는 안전 보호장치는 전격방지기입니다."},{"n":46,"type":"short","stem":"물질안전보건자료(MSDS)의 16가지 항목 중 화학 사고 피해자에게 생명 소실을 막기 위해 행하는 긴급 일차적 응급 처치 조치가 기록된 표준 항목 번호와 그 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"4번 항목: 응급조치 요령","explain":"질식, 중독, 화상 시의 즉각적인 응급 처치 가이드라인은 MSDS 4번 항목인 '응급조치요령'에 상세히 기재되어 있습니다."},{"n":47,"type":"short","stem":"용접 작업 시 유해 가스가 체류하기 쉬운 환기가 극히 제한된 밀폐공간 내부에서 안전하게 작업을 시작하기 위한 최소 산소 농도 기준(%)을 정확한 수치로 쓰시오.","choices":[],"answerIndex":null,"answerText":"18% 이상","explain":"밀폐공간 내부 산소결핍 사고를 방지하기 위해서는 산소 농도를 상시 측정하여 18% 이상을 보장하여 가동해야 합니다."},{"n":48,"type":"short","stem":"용접 흄과 가스로 인한 호흡기 질환 및 중독 예방을 위해 밀폐된 작업 공간에 작업 전 가동하고 자극을 느낄 때 점검해야 하는 가공 배출 가스 강제 흡입 장치 설비의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"국소 배기 장치 (환기 시설)","explain":"용접 시 비산하는 독성 흄이나 유독 가스를 발생원 부근에서 흡입해 옥외로 배출하는 안전 설비는 국소 배기 장치입니다."},{"n":49,"type":"short","stem":"화상 사고 대처 요령 중 조직의 열적 손상을 줄이고 통증 완화를 위해 거즈에 적셔 20~30분간 환부에 대어주어야 하는 표준 냉각액의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"흐르는 찬물 (생수)","explain":"화상 즉시 열기를 배출하고 심부 조직 손상을 막는 가장 안전한 냉각 조치는 흐르는 찬물 또는 생수를 사용하는 것입니다."},{"n":50,"type":"short","stem":"화상 부위 표면에 액체 성분이 차올라 동그랗게 부풀어 오르는 조직 반응으로, 2차 세균 감염과 상처 흉터화를 방지하기 위해 절대로 임의로 파괴하여 터뜨려서는 안 되는 이것의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"물집 (수포)","explain":"2도 화상 시 나타나는 물집은 외부 바이러스 및 세균 유입을 막아주는 안전한 자연적 보호막 역할을 하므로 강제 돌출시켜 파괴하면 감염을 유발합니다."}]},"2":{"unit":2,"title":"작업 후 정리정돈","code":"LM1601050002","group":"공통","theory":[{"t":"h2","v":"제 1 부: NCS 2편 작업 후 정리정돈 핵심 이론"},{"t":"p","v":"용접 작업 완료 후 용접기의 전원을 차단하고 작업장에 관한 정리정돈을 철저히 실시하는 것은 전기적 감전, 가스 폭발 및 누설, 유해 흄가스로 인한 중독 등 작업장 내의 치명적인 산업재해를 예방하는 가장 근본적인 절차입니다. 본 이론 장에서는 NCS 과정평가 시험의 필수 학습 모듈인 '전원 차단', '보호가스 차단', '작업장 정리정돈'의 3대 핵심 영역을 단권화 요약하였습니다."},{"t":"h3","v":"1. 용접 완료 후 전원 차단하기 (학습 1)"},{"t":"p","v":"용접 작업을 종료하거나 장시간 중지할 때는 전기 안전사고 예방과 장비 손상을 막기 위해 철저한 순서대로 전원을 차단해야 합니다."},{"t":"p","v":"전원 차단 표준 작업 순서:"},{"t":"p","v":"1) 용접기의 본체 전원 스위치(ON/OFF)를 OFF 방향으로 내립니다."},{"t":"p","v":"2) 작업 구역 주변의 국소 배기장치 및 환기 시설의 개별 전원을 차단합니다."},{"t":"p","v":"3) 분전반(배전반) 내의 해당 용접기 직전 전원 스위치를 차단합니다."},{"t":"p","v":"4) 작업장 내의 메인 전원 차단 스위치를 최종 차단하고, 접지 및 케이블 거치 상태를 확인합니다."},{"t":"p","v":"※ 주의 사항: 사용 중인 용접기가 고장 나서 내부 검사를 할 때에는 커버를 열기 전 반드시 메인 스위치를 차단하고 최소 3분 이상 지난 후에 검사해야 합니다. 내부 콘덴서에 축적된 잔류 전하로 인한 감전사고를 방지하기 위함입니다."},{"t":"h3","v":"2. 보호가스 차단 및 계통 관리 (학습 2)"},{"t":"p","v":"보호가스는 아르곤(Ar)과 이산화탄소(CO2)를 주로 사용하며 고압 용기에 압축 저장되므로 가스 압력 레귤레이터 및 배관 라인의 안전 처리가 핵심입니다."},{"t":"table","rows":[["보호가스 종류","표준 용기 색상","비중 및 공기 대비 물리적 특성","핵심 취급 수칙"],["이산화탄소 (CO2)","청색","공기보다 무거움. 고농도 누출 시 질식 및 CO2 중독 주의","전기 히터 필수 부착 (드라이아이스 응결 방지)"],["아르곤 (Ar)","회색","공기보다 무거움 (비중 약 1.105). 밀폐 공간 내 체류 시 산소 결핍 질식 위험","사용 후 반드시 밸브를 완전히 잠그고 누설 비눗물 검사 시행"],["산소 (O2) - 대조용","녹색","조연성 물질로 연소 유발 위험성 매우 높음","기름, 그리스 등 유질성 물질 접촉 금지"]]},{"t":"p","v":"보호가스 차단 표준 작업 순서:"},{"t":"p","v":"1) 용기(실린더) 상부의 메인 병 밸브를 시계 방향으로 완전히 잠급니다."},{"t":"p","v":"2) 용접기 전면 패널의 '용접시 / 점검시' 선택 스위치를 '점검시(GAS CHECK)'에 놓아 호스 내부의 잔여 가스를 방출합니다."},{"t":"p","v":"3) 가스 조절기(레귤레이터)의 고압 게이지와 저압 게이지 지침이 모두 '0'을 가리키는 것을 확인합니다."},{"t":"p","v":"4) 유량계 조절 손잡이를 시계 방향으로 가볍게 잠그고, 누설 비눗물 검사로 최종 차단을 확인합니다."},{"t":"h3","v":"3. 작업장 정리정돈과 3정 5행의 실천 (학습 3)"},{"t":"p","v":"용접이 끝난 직후에는 바닥의 슬래그, 용접봉 꽁다리 및 튄 물(스패터)을 완벽히 정리해야 합니다. 특히 열기가 남아 있는 용접봉 꽁다리는 가연물에 접촉 시 화재를 유발하므로 즉시 회수 고철통에 수납해야 합니다."},{"t":"table","rows":[["분류","항목","구체적인 실무 적용 수칙"],["3정 (기준)","정위치, 정품, 정량","사용 완료한 수공구(몽키스패너, 줄, 망치 등)는 정해진 보관 위치 명판에 정량 비치 관리"],["5행 (행동)","정리 (整理)","필요한 것과 불필요한 것을 엄격히 구분하여, 불필요한 고철 모재 스크랩 및 폐용접봉은 즉시 폐기"],["5행 (행동)","정돈 (整頓)","필요한 물건을 규격, 종류, 두께별로 누구나 즉시 찾을 수 있도록 깨끗하게 배치"],["5행 (행동)","청소 • 청결","작업장 바닥 슬래그 쓸기, 그라인더 분진은 방진마스크 착용 후 집진기로 포집 청소 및 습관화"],["5행 (행동)","습관화 (마음가짐)","작업 전•중•후 안전보건관리 원칙과 안전수칙 서명 및 유지 보수 일지 작성의 일상화"]]},{"t":"h2","v":"제 2 부: NCS 2편 대표 엄선 50제 평가 문항"},{"t":"h3","v":"1. 객관식 4지선다형 문항 (1 ~ 35번)"}],"questions":[{"n":1,"type":"mcq","stem":"용접 작업을 정상적으로 마치거나 장시간 중지하기 위해 가장 먼저 이행해야 할 '전원 차단' 표준 순서로 옳은 것은?","choices":["용접기 스위치 차단 -> 배기 환기시설 스위치 차단 -> 배전반 분전 스위치 차단","배전반 분전 스위치 차단 -> 용접기 스위치 차단 -> 배기 환기시설 스위치 차단","배기 환기시설 스위치 차단 -> 배전반 분전 스위치 차단 -> 용접기 스위치 차단","용접기 스위치 차단 -> 배전반 분전 스위치 차단 -> 배기 환기시설 스위치 차단"],"answerIndex":1,"answerText":"① 용접기 스위치 차단 -> 배기 환기시설 스위치 차단 -> 배전반 분전 스위치 차단","explain":"용접기 본체 스위치를 끄면 전원이 1차 차단되며, 이후 용접 중 발생한 배출 가스를 마저 환기시킨 후 환기시설 스위치를 끄고 최종적으로 안전 배전반 분전 스위치를 안전하게 개방한다."},{"n":2,"type":"mcq","stem":"용접 작업을 완전히 끝냈을 때 배기 및 환기 시설 조작에 대한 안전수칙 중 옳은 것은?","choices":["가스가 정체되도록 배기 환기시설을 약풍으로 틀어둔다.","에너지를 절약하기 위해 반드시 배기 및 환기시설 전원을 완전히 차단한다.","밤사이 자연 환기가 되도록 모든 기계 환기 창문을 완전히 밀폐한다.","용접 전원과 동기화되어 배기스위치는 수동 조작하지 않는 것이 원칙이다."],"answerIndex":2,"answerText":"② 에너지를 절약하기 위해 반드시 배기 및 환기시설 전원을 완전히 차단한다.","explain":"용접을 완전히 종료하거나 장시간 중단할 때에는 환경 흄 가스 유해성 예방 및 불필요한 전기 대기 전력 소모를 방지하기 위해 배기 및 환기시설 전원을 차단하는 것이 표준 준수 수칙이다."},{"n":3,"type":"mcq","stem":"모든 물질을 구성하는 기본 단위인 원자의 구성을 설명한 것으로, 이 중 (-)전하를 띠며 원자핵 주위를 회전하는 이 소립자는 무엇인가?","choices":["양성자","중성자","전자","이온"],"answerIndex":3,"answerText":"③ 전자","explain":"원자는 (+)전하의 원자핵(양성자+중성자)과 그 주위 궤도를 도는 (-)전하의 전자로 이루어지며 전기적 흐름의 최소 단위가 된다."},{"n":4,"type":"mcq","stem":"전자의 흐름 또는 이동량을 의미하며, 단위로 암페어(A)를 사용하는 물리적인 전기 현상은 무엇인가?","choices":["전압","전류","저항","정전기"],"answerIndex":2,"answerText":"② 전류","explain":"단위 시간당 전기 회로의 단면을 통과하는 전하의 흐름 강도를 전류(Current, 기호 'I')라 부르며 표준 단위는 암페어(Ampere, A)를 쓴다."},{"n":5,"type":"mcq","stem":"전류를 흐르게 하는 전기적인 압력을 뜻하며, 단위로 볼트(V)를 사용하는 전위차 물리량은 무엇인가?","choices":["전압","전력","정전용량","전류"],"answerIndex":1,"answerText":"① 전압","explain":"도체 내부의 전류를 흐르게 만들어 주는 전위의 차이 즉 전기적인 압력을 전압(Voltage, 기호 'V')이라 칭하며 표준 단위는 볼트(Volt, V)를 사용한다."},{"n":6,"type":"mcq","stem":"용접 흄가스 발생 농도가 낮고, 용접작업자 2인당 점유 공간이 284㎡ 이상이며 실내 층고(천장높이)가 5m 이상일 때 설계 가능한 가장 경제적인 환기 방식은?","choices":["국소 배기 환기 방법","송배기식 동시 국소환기","전체 강제 환기 방법","자연 환기 방법"],"answerIndex":4,"answerText":"④ 자연 환기 방법","explain":"작업 공간이 충분히 넓고(2인당 284㎡ 이상), 천장 층고가 5m 이상으로 높아 자연 대류가 원활히 발생할 수 있는 환경에서는 가장 경제적이고 자연적인 자연 환기 방법을 우선 적용한다."},{"n":7,"type":"mcq","stem":"용접 작업장의 국소 배기장치를 설계할 때, 후드의 제어풍속이 너무 과도하게 크면 용접부에 어떤 치명적인 영향을 주는가?","choices":["아크열 손실로 용입이 불필요하게 깊어진다.","아크 전압이 현저히 강하되어 꺼진다.","보호가스가 교란되어 용접결함이 발생한다.","누설 전류로 전격 감전 위험이 증가한다."],"answerIndex":3,"answerText":"③ 보호가스가 교란되어 용접결함이 발생한다.","explain":"국소 배기장치의 흡입 풍속이 지나치게 강해 제어 속도 범위를 초과하게 되면, 아크 기둥 주변을 감싸고 있는 CO2/Ar 차폐 보호가스가 교란(터뷸런스 분산)되어 공기가 침입함으로써 기공이나 언더컷 등 용접 결함이 발생한다."},{"n":8,"type":"mcq","stem":"선체의 블록 조립이나 보일러 드럼 등 환기가 극히 불량하고 협소한 밀폐 공간 작업 시 송기와 배기가 동시에 이루어지도록 적용하는 특수 환기 장치의 명칭은?","choices":["자연 기류 통풍창","고정식 상방 후드형 닥트","벽체식 삿갓형 배기 후드","이동식 국소환기 장치"],"answerIndex":4,"answerText":"④ 이동식 국소환기 장치","explain":"밀폐되고 협소한 선체 구획 내 작업 시에는 공간적 한계로 고정 닥트를 설치할 수 없어, 기류 순환을 위해 송기와 배기를 동시에 원활히 가동하는 이동식 국소환기 장치가 가장 안전하다."},{"n":9,"type":"mcq","stem":"CO2 가스 등 보호가스 라인을 차단할 때, 레귤레이터 핸들을 잠그기 전에 가스 배관 내의 잔여 가스를 방출하기 위해 용접기 전면 패널에서 선택해야 하는 스위치 모드는?","choices":["용접시 (WELD)","정지시 (STOP)","점검시 (GAS CHECK)","자동시 (AUTO)"],"answerIndex":3,"answerText":"③ 점검시 (GAS CHECK)","explain":"보호가스 메인 병 밸브를 잠근 뒤, 배관 배관망 및 고압 호스 내부에 강하게 차 있는 잔여 가스를 완전 방출하여 안전압력으로 낮추기 위해 용접기 '점검시(GAS CHECK)' 노브를 가동한다."},{"n":10,"type":"mcq","stem":"보호가스 잔여가스 배출 과정을 수행할 때, 압력-유량 게이지의 바늘이 어느 수치에 도달해야 호스 내 가스가 완전히 배출된 것인가?","choices":["0","5","10","15"],"answerIndex":1,"answerText":"① 0","explain":"배관 내부의 가스가 잔압 없이 대기압 상태로 완전 방출되면, 조정기의 입•출력 압력 게이지 지침 바늘은 '0(Zero)'을 지시하게 되며 이 상태가 가스 차단 완료 기준이다."},{"n":11,"type":"mcq","stem":"압력 조정기(레귤레이터) 체결부나 가스용기 밸브 접속부에 그리스, 석유, 페인트 등의 유질성(油質성) 물질의 접촉을 절대 금지하는 핵심 이유는 무엇인가?","choices":["가스의 순도를 떨어뜨려 비드가 변색되기 때문","윤활 성분으로 인하여 유량계가 오작동하기 때문","고압 산소와 격렬히 반응하여 폭발할 위험 때문","호스의 고무 재질을 서서히 부식시키기 때문"],"answerIndex":3,"answerText":"③ 고압 산소와 격렬히 반응하여 폭발할 위험 때문","explain":"고압 산소는 아주 강력한 산화 촉진력을 지녀 유기물질인 그리스, 석유, 페인트 등과 접촉 시 상온에서도 순간적인 연소 반응 및 가스 팽창 압력에 의한 격렬한 폭발 사고를 일으킨다."},{"n":12,"type":"mcq","stem":"보호가스 라인을 신설하거나 실린더 교체 후 가스 누설 부위를 쉽고 간편하게 확인하기 위해 현장에서 가장 널리 쓰이는 표준 비파괴 검사법은?","choices":["비눗물 검사 (Leak Test)","침투 탐상 시험 (PT)","방사선 투과 시험 (RT)","초음파 탐상 시험 (UT)"],"answerIndex":1,"answerText":"① 비눗물 검사 (Leak Test)","explain":"현장에서 가장 빠르고 신속하며 비파괴적으로 가스 연결 누설부를 찾는 방법은 거품용 비눗물을 브러시로 발라 기포가 부풀어 오르는지 점검하는 '비눗물 가스 누설 검사법'이다."},{"n":13,"type":"mcq","stem":"압력 조정기(레귤레이터)에서 구조상 충격에 가장 약한 부품이며, 고압 가스 병 밸브를 개방할 때 가스가 뿜어져 나와 부상을 당할 우려가 있어 절대 정면에 서면 안 되는 곳은?","choices":["조정기 체결용 너트 나사부","압력계 (지침 지시부 정면)","가스 호스 삽입부","유량계 조절 손잡이"],"answerIndex":2,"answerText":"② 압력계 (지침 지시부 정면)","explain":"조정기의 압력 게이지 전면 유리는 구조상 고압 밸브 개방 시 충격을 받는 가장 약한 부분이므로, 밸브 작동 시 파손에 대비하여 작업자는 게이지 정면에서 비켜서 작업해야 한다."},{"n":14,"type":"mcq","stem":"고압 가스 실린더(용기) 보관 요령으로 안전 보건 수칙상 어긋나는 행동은?","choices":["실린더는 직사광선이 내리쬐지 않는 서늘한 상온 장소에 보관한다.","공간을 넓게 쓰기 위해 가스 용기는 수평으로 눕혀서 층층이 쌓아 보관한다.","체결된 가스 용기는 전도 방지 사슬 또는 거치 지그로 단단히 고정한다.","가연성 가스 용기와 산소(조연성) 가스 용기는 구획을 두어 격리 저장한다."],"answerIndex":2,"answerText":"② 공간을 넓게 쓰기 위해 가스 용기는 수평으로 눕혀서 층층이 쌓아 보관한다.","explain":"고압가스 용기는 직사광선을 피하고 서늘한 곳(40℃ 이하)에 전도 방지 조치를 한 뒤 '수직 기립' 보관하는 것이 원칙이다. 절대 수평으로 눕히거나 굴려서 충격을 주면 안 된다."},{"n":15,"type":"mcq","stem":"작업장 현장에서 물품을 정돈하는 기준인 '3정'에 해당하지 않는 정비 요소는?","choices":["정위치 (Right Location)","정품 (Right Product)","정량 (Right Quantity)","정색 (Right Color)"],"answerIndex":4,"answerText":"④ 정색 (Right Color)","explain":"작업장 정돈 3정 원칙은 정확한 보관 장소의 명시인 '정위치', 승인된 적격 물품 비치인 '정품', 그리고 안전한 관리 허용 수량 제한인 '정량'의 세 가지 조화이다."},{"n":16,"type":"mcq","stem":"공장 및 용접실습장의 환경 혁신 운동인 '5행(5S)'의 실행 행동 항목에 속하지 않는 것은?","choices":["정리 (整理)","정돈 (整頓)","정직 (正直)","청결 (淸潔)"],"answerIndex":3,"answerText":"③ 정직 (正直)","explain":"NCS 환경 품질 혁신을 위한 5행(5S)은 정리(Seiri), 정돈(Seiton), 청소(Seiso), 청결(Seiketsu), 습관화(Shitsuke)로 구성되며 정직은 도덕적 요인에 속한다."},{"n":17,"type":"mcq","stem":"NCS 작업장 정리정돈 및 안전 수칙에서 정의하는 '정리(整理)'의 올바른 의미는?","choices":["필요한 것과 불필요한 것을 구분하여 불필요한 것을 작업장에서 즉시 버리는 것","바닥과 벽면에 묻은 먼지와 기름기를 닦아내고 광을 내는 것","공구의 수량과 훼손 유무를 기입하여 대장으로 보관하는 것","필요한 물건을 필요한 장소에 누구나 사용하기 편리하게 수납하는 것"],"answerIndex":1,"answerText":"① 필요한 것과 불필요한 것을 구분하여 불필요한 것을 작업장에서 즉시 버리는 것","explain":"정리(整理)의 정확한 정의는 필요한 물건과 불필요한 쓰레기를 식별 구분하여, 불필요하고 쓰지 못하는 자재나 고철을 즉각 작업장 밖으로 이적 혹은 폐기 처리하는 활동이다."},{"n":18,"type":"mcq","stem":"NCS 실무 교육에서 제시하는 '정돈(整頓)'의 올바른 기능과 행동 요령은?","choices":["사용 완료된 그라인더의 연마날 파손 유무를 육안 검사하는 것","용접 실습장 바닥의 미끄러운 물기와 불순물을 쓸어 청소하는 것","고철통에 고철 모재 스크랩을 종류별로 모아 배출하는 것","필요한 공구를 누구나 3초 이내에 찾아 쓰도록 수납하는 것"],"answerIndex":4,"answerText":"④ 필요한 공구를 누구나 3초 이내에 찾아 쓰도록 수납하는 것","explain":"정돈(整頓)은 단순히 물건을 치우는 행위가 아니라 필요한 규격품을 사용 목적에 맞추어 보관함에 가지런히 정렬하여, 누구든지 찾고자 하는 물건을 즉각 찾아 쓸 수 있게 하는 레이아웃 정비 활동이다."},{"n":19,"type":"mcq","stem":"용접 작업을 정상적으로 끝낸 후 남은 여분의 모재 조각(스크랩)과 용접 평가를 마친 시편의 정리 분류 기준으로 가장 적절한 조치는?","choices":["크기와 모양에 상관없이 대형 스크랩통에 무작위 투입","모재의 재질(강종) 종류 및 판재 두께별로 완벽히 분류하여 전용 적치대에 정리","다음 조가 사용하기 편리하도록 개인 용접 작업대 밑에 그대로 비치","모재의 두께만 기준으로 하여 실외 방치"],"answerIndex":2,"answerText":"② 모재의 재질(강종) 종류 및 판재 두께별로 완벽히 분류하여 전용 적치대에 정리","explain":"용접 후 폐모재 및 잔여 모재의 보관 요령은 재사용 시의 시공 오차를 줄이기 위해 모재의 기계적•화학적 성질별 '종류'와 판재 '두께별'로 명판을 활용해 분류 보관한다."},{"n":20,"type":"mcq","stem":"연강용 CO2 가스메탈아크용접 솔리드 와이어의 KS 표준 규격 표기인 'Y GW 13'에서 첫 알파벳 문자 'Y'가 지시하는 의미는?","choices":["용접봉 (Electrode)","와이어 (Wire)","용가재 (Rod)","가스 차폐재 (Gas Shield)"],"answerIndex":2,"answerText":"② 와이어 (Wire)","explain":"KS 규격 와이어 표기법 'Y GW 13'에서 첫 머리 기호인 'Y'는 와이어(Wire) 선재 소모용 전극재 자체를 의미한다."},{"n":21,"type":"mcq","stem":"와이어 규격 표기인 'Y GW 13'에서 중간 문자 조합인 'GW'가 기술적으로 의미하는 용접 공정 형태는 무엇인가?","choices":["플럭스 코어드 아크 용접 (FCAW)","가스 텅스텐 아크 용접 (GTAW / TIG)","피복 아크 용접 (SMAW)","가스 실드 반자동 용접 (Gas Welding / GMAW)"],"answerIndex":4,"answerText":"④ 가스 실드 반자동 용접 (Gas Welding / GMAW)","explain":"중간 문자 조합 'GW'는 가스 실드 아크 용접(Gas Shield Metal Arc Welding) 공정을 통칭하는 KS 세부 기호 코드이다."},{"n":22,"type":"mcq","stem":"용접 작업이 끝난 후 사용하다 남은 용접 와이어 릴(Spool)을 와이어 피더기에서 탈거하여 장기간 보관할 때 가장 엄격히 통제해야 하는 환경 요인은 무엇인가?","choices":["실내 조도(빛의 세기와 조명 밝기)","습기(흡습으로 인한 녹 및 기공 결함)","진동 및 하중에 의한 기계적 마모","이산화탄소 대기압(주변 압력 변동)"],"answerIndex":2,"answerText":"② 습기(흡습으로 인한 녹 및 기공 결함)","explain":"용접 와이어의 주재료는 강선이므로 공기 중의 습기에 노출되면 즉시 산화막과 미세 녹이 생성되어 용접 비드 내부에 수소 유입 및 기공을 발생시킨다. 사용 후 반드시 비닐 밀봉 후 습기가 없는 건조한 곳에 정돈 보관해야 한다."},{"n":23,"type":"mcq","stem":"용접 실습 종료 후 장비 및 치공구를 보관함에 복귀시키는 과정에서 '안전 보호구' 카테고리로 분류되어 전용 살균 보관함에 보관해야 하는 물품은?","choices":["에어 그라인더 및 휠 연마석","피복 아크 용접용 홀더 케이블","차광유리가 부착된 용접용 헬멧(안면 보호구)","용접 다리길이 측정용 용접게이지"],"answerIndex":3,"answerText":"③ 차광유리가 부착된 용접용 헬멧(안면 보호구)","explain":"슬래그해머는 슬래그를 털어내기 위한 타격용 '수작업 공구'이며, 헬멧/보호안경/용접 재킷/발 덮개/방진마스크/안전화 등은 인체를 보호하는 '안전 보호구' 범위에 속한다."},{"n":24,"type":"mcq","stem":"용접 작업에 사용하는 수공구 중 가공 모재의 직각 여부를 확인하고 각도 조절에 상시 활용하는 도구의 표준 명칭은?","choices":["버니어캘리퍼스","용접게이지","직각자","줄(File)"],"answerIndex":3,"answerText":"③ 직각자","explain":"모재의 직각도 확인과 각도 기준 잡기에 상시 쓰는 수공구는 직각자(스퀘어)다. 용접게이지는 각장·목두께·언더컷 깊이 측정용이라 직각 확인 용도가 아니다."},{"n":25,"type":"mcq","stem":"전동식 또는 에어식 핸드 그라인더의 장기 보관 및 예방 보전 차원에서, 치공구 관리자가 보관 전 반드시 연삭숫돌의 파손 여부를 확인하고 가이드 활동부에 처리해야 하는 수칙은?","choices":["수랭 냉각 세척 처리","아세톤 용제 침전 처리","알코올 소독 윤활 처리","그리스 및 방청유 급유 처리"],"answerIndex":4,"answerText":"④ 그리스 및 방청유 급유 처리","explain":"연삭숫돌을 회전시키는 그라인더는 사용 후 이송 기어 및 축 활동 부분에 미세 먼지가 침입하지 않도록 에어로 털어내 청소한 후 기름 및 방방청 그리스를 급유하여 보관해야 수명이 유지된다."},{"n":26,"type":"mcq","stem":"작업자가 보관소에서 핸드 그라인더를 꺼내어 실무 작업을 개시하기 직전에 안전 확보를 위해 강제적으로 이행해야 하는 조치는?","choices":["공회전을 최소 1분 이상 가동하여 연마 디스크 회전 이상 소음 및 유격 점검","연마 날 표면에 물을 고르게 뿌려 방열 효과 극대화","그라인더를 고정 바이스에 단단히 물려 상시 구속 상태 확인","고압 전원에 직접 연결하여 아크 스트라이크 테스트 시행"],"answerIndex":1,"answerText":"① 공회전을 최소 1분 이상 가동하여 연마 디스크 회전 이상 소음 및 유격 점검","explain":"회전 공구인 그라인더는 숫돌의 미세 균열이나 베어링 축의 파손 유무를 사용 전 공회전을 통해 사전 확인하지 않으면, 고속 회전 중 디스크가 파열되어 비산하는 중대 위해를 가할 수 있다."},{"n":27,"type":"mcq","stem":"용접게이지(Welding Gauge)는 정밀 부품이므로 취급 시 떨어뜨려 충격을 가하거나 무리한 횡력을 가해서는 안 된다. 훼손 시 어떤 장비 관리상의 악영향이 발생하는가?","choices":["치수 측정 오차(정밀도 하락) 발생","차광 유리 자동 셔터 단선","용접 전류 유격 증가","전격 방지기 고장 유발"],"answerIndex":1,"answerText":"① 치수 측정 오차(정밀도 하락) 발생","explain":"용접게이지의 정밀 가동 부위나 지침 부가 물리적 타격을 입어 미세한 휨이나 변형이 발생하면, 실측 치수의 신뢰성이 하락하여 가용접 및 최종 용접부 치수 판정에 정밀도 하락을 초래한다."},{"n":28,"type":"mcq","stem":"수공구를 사용하기 전에 볼트, 너트 머리 부분이 뭉개지거나 작업자의 손이 미끄러지는 사고를 방지하기 위해 이행해야 하는 사용 전 관리 조치는?","choices":["공구 손잡이에 열을 가해 건조시킨다.","미끄러지지 않도록 묻어 있는 기름이나 방청유를 깨끗이 닦아낸다.","수공구를 물속에 침전시켜 단열 처리한다.","미끄럼 방지를 위해 표면에 굵은 모래를 고르게 도포한다."],"answerIndex":2,"answerText":"② 미끄러지지 않도록 묻어 있는 기름이나 방청유를 깨끗이 닦아낸다.","explain":"렌치나 몽키스패너 등 수공구에 방청 기름이나 수분이 묻어 있으면 타격이나 조임 작업 중 미끄러져 손가락 협착 및 손목 부상을 유발한다. 사용 전에 마른 걸레로 표면을 깨끗이 닦아내야 한다."},{"n":29,"type":"mcq","stem":"사용한 수공구의 관리 수칙 중 작업이 완료되었을 때 실행해야 하는 가장 정석적인 보관 요령은?","choices":["개인 작업복 호주머니에 안전모와 함께 수납한다.","용접 부스 바닥 구석의 모재 통 위에 올려둔다.","공구함, 공구선반 등 지정된 정위치 보관소에 정렬 정돈한다.","용접기 본체 케이스 커버 윗면에 정돈해 둔다."],"answerIndex":3,"answerText":"③ 공구함, 공구선반 등 지정된 정위치 보관소에 정렬 정돈한다.","explain":"사용한 수공구의 올바른 정돈 원칙은 분실 방지 및 차기 작업의 연속성을 위해 반드시 전용 적치대나 공구함 선반의 정위치 보관 영역에 분류 수납하여야 한다."},{"n":30,"type":"mcq","stem":"용접을 완전히 마친 뒤 바닥에 낙하된 용접봉 꽁다리(잔여 심선)와 비드 표면에서 털어낸 슬래그 분진을 철저하게 청소하여 폐기해야 하는 가장 큰 안전 보건상의 이유는 무엇인가?","choices":["화재 예방 및 미끄러짐·넘어짐 재해 예방","용접기의 고주파 전격 강도를 높이기 위함","국소배기장치의 필터 막힘을 방지하기 위함","용접기 전원의 소모를 최소화하기 위함"],"answerIndex":1,"answerText":"① 화재 예방 및 미끄러짐·넘어짐 재해 예방","explain":"용접 후 바닥에 흩어진 유리질의 굳은 슬래그 조각과 사용 후 버려진 원형 용접봉 꽁다리(잔여 심선)는 바닥을 극히 미끄럽고 굴러다니게 만들므로, 즉각 청소하지 않으면 작업자 미끄러짐과 전도에 의한 중대 낙상 사고의 근원이 된다."},{"n":31,"type":"mcq","stem":"그라인더 가공 작업을 마친 후 그라인더실을 빗자루와 청소 도구로 정리정돈할 때 작업자의 유해 분진 흡입을 방지하기 위해 착용해야 하는 수칙은?","choices":["특수 방진마스크 착용 및 집진 배기시설 가동","일반 일회용 덴탈마스크 착용 및 문 닫기","방독마스크 탈거 및 상방 송풍기 최대 가동","송기마스크 단독 착용 및 집진기 전원 차단"],"answerIndex":1,"answerText":"① 특수 방진마스크 착용 및 집진 배기시설 가동","explain":"그라인더 디스크 연마실은 회전 연삭 중 생성된 다량의 가느다란 미세 철분 가루와 숫돌 분진이 공기 중에 부유하므로, 폐 침착 방지를 위해 전용 방진마스크를 의무 착용하고 강력한 집진기 환기 시설을 가동하면서 청소해야 한다."},{"n":32,"type":"mcq","stem":"용접 작업장의 폐기물 수거통 관리 기준 중 환경 보건 및 분리수거 원칙에 부합하는 수칙은?","choices":["다 쓴 에어졸 캔(침투 탐상제 KD-PT 등)은 구멍을 뚫지 않고 고철통에 넣는다.","용접봉 폐 꽁다리는 일반 쓰레기 매립 봉투에 그대로 혼입 배출한다.","종이, 가죽, 철 스크랩을 하나의 가연물 드럼통에 통합 소각 처리한다.","가공 후 남은 고철 모재 스크랩은 폐모재 전용 '고철 회수통'에 따로 분리수거한다."],"answerIndex":4,"answerText":"④ 가공 후 남은 고철 모재 스크랩은 폐모재 전용 '고철 회수통'에 따로 분리수거한다.","explain":"환경보존 및 자원재활용 원칙에 근거하여, 잔여 모재 찌꺼기 및 스크랩 철 조각들은 일반 산업폐기물에 혼입 배출하지 않고 자원 회수통인 '고철 분리 전용 회수함'에 완벽히 분리수거한다."},{"n":33,"type":"mcq","stem":"가스 용접 및 절단 작업장 주변에 비치하는 표준 소화기(분말 소화기)의 이상 여부를 작업 후 점검할 때 가장 적절한 점검 방법은?","choices":["소화기를 거꾸로 세워 외벽을 망치로 때려 소리를 점검한다.","소화액 유통 기한을 확인하기 위해 비눗물을 묻혀본다.","소화기의 내부 소화약제를 바닥에 가끔 분사하여 압력을 확인한다.","분말 소화기의 지침 압력 게이지를 통해 녹색 범위 내에 바늘이 위치하는지 확인한다."],"answerIndex":4,"answerText":"④ 분말 소화기의 지침 압력 게이지를 통해 녹색 범위 내에 바늘이 위치하는지 확인한다.","explain":"가스 충전 용기 안전 보건 규격 색상에 따라 이산화탄소(탄산가스) 가스통은 '청색' 도색을 적용하며, 불활성 아르곤 가스 용기는 전면 '회색' 도색을 표준으로 지정해 식별 관리한다."},{"n":34,"type":"mcq","stem":"작업 안전보건 관리 수칙 상, 작업장 내의 자연 조명이 불충분하거나 눈부심이 있을 때 작업자 피로를 예방하고 가시성을 확보하기 위한 최저 옥내 조도(Lux) 범위는?","choices":["1 ~ 10 lx","10 ~ 20 lx","30 ~ 50 lx","100 ~ 200 lx"],"answerIndex":3,"answerText":"③ 30 ~ 50 lx","explain":"교재 안전보건 가이드는 옥내 작업장 가시성 확보용 최저 조도를 30~50 lx로 제시하므로 ③. 다만 산업안전보건기준 규칙은 그 밖의 작업 75 lx, 보통작업 150 lx 이상을 요구해 실무 기준은 더 높게 보기도 한다."},{"n":35,"type":"mcq","stem":"피복아크용접 회로의 전격방지기 및 내부 청소를 하기 전 작업자가 1차적으로 취해야 하는 전기적 안전조치는 무엇인가?","choices":["전원 스위치를 가동한 상태에서 내부 변압기에 압축공기를 분사한다.","주 분전반 전원을 차단하고 차단기 핸들에 '수리중•점검중' 안전 표지판을 부착한다.","접지선을 임시 가스 수도관에 고정 체결한다.","용접 케이블 커버를 젖은 장갑으로 감싸 전기를 흡수한다."],"answerIndex":2,"answerText":"② 주 분전반 전원을 차단하고 차단기 핸들에 '수리중•점검중' 안전 표지판을 부착한다.","explain":"변압기 및 콘덴서 부품 내부의 발열 방지 점검, 혹은 청소 작업을 시작할 때에는 뜻하지 않은 감전 피해를 100% 원천 예방하기 위해 메인 분전반 전원을 'OFF'하고 차단기 도어에 '수리중•점검중' 표지 명판을 명확히 부착하는 시건 장치를 취해야 한다."},{"n":36,"type":"short","stem":"용접 흄, 분진 및 유해가스가 지속적으로 발생하는 작업장에서 작업자의 진폐증 등 만성 질환을 예방하기 위해 주기적으로 환경오염 인자를 측정하여 이 물질들이 어떤 가이드라인 범주 내에 머무는지 점검해야 합니까? (초성 힌트: ㅎㅇㄴㄷ)","choices":[],"answerIndex":null,"answerText":"허용농도 (또는 유해인자 농도)","explain":"용접 작업 시 유독 가스와 미세 금속 흄, 부유 분진으로 인한 작업자의 만성 진폐증 피해를 원천 차단하기 위해 작업 현장 공기 중의 대상 화학 유해 물질이 공인된 '허용농도(Threshold Limit Value)' 범위 이내에 고정되어 있는지 주기적으로 점검 및 측정 관리한다."},{"n":37,"type":"short","stem":"모든 물질의 중심이 되는 양성자와 중성자의 결합체인 원자핵 주위를 도는 (-)전하의 불균형한 흐름에 의해 생겨나는 에너지 현상을 무엇이라고 합니까?","choices":[],"answerIndex":null,"answerText":"전기 (Electricity)","explain":"원자 구조 속에서 원자핵과의 속박을 이겨내고 이탈해 나온 음(-) 전하의 불균형한 이동 흐름 현상을 통칭하여 '전기'라고 부른다."},{"n":38,"type":"short","stem":"CO2 용접 작업 종료 후, 가스 차단 단계에서 실린더 밸브를 완전히 잠근 다음 호스 내 가스를 완전 방출했을 때 고압 및 저압 가스 게이지 압력 지침이 가리키는 숫자는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"0 (Zero / 영)","explain":"가스 누설과 고압 게이지 파열 및 장기 미사용 시 호스 경화를 예방하기 위해, 용접 실린더 밸브를 잠근 뒤 호스 라인 속의 잔여 에너지를 완전히 빼내어 게이지 압력 지침 바늘이 '0'을 완벽하게 가리키는 완전 대기압 상태를 만든다."},{"n":39,"type":"short","stem":"레귤레이터 가스 조절기에서 고압 가스 탱크 밸브를 열 때 작업자가 절대로 이 장치의 정면 방향에 위치하면 안 되는 부품의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"압력계 (Gauge)","explain":"압력조정기의 각 핵심 세부 부품 중 가스 지침용 압력계는 가장 기계적으로 얇은 다이어프램 박판 재질이 포함된 '가장 약한 부품'이므로, 고압 밸브 개방 시 순간적인 고압 유입 충격으로 파열될 소지가 있어 작업자는 절대로 압력계 전면 시선 궤적에 서지 않는다."},{"n":40,"type":"short","stem":"3정 5행(3정5S)의 작업장 관리 행동 요령 중, '작업장에서 필요한 것과 불필요한 것을 완벽히 구별하여 불필요한 모재 스크랩과 폐공구를 즉시 버리는 활동'을 뜻하는 단어는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"정리 (整理)","explain":"3정 5행(5S) 운동의 첫 행동으로 필요한 생산 적격 물품과 불필요한 폐고철, 꽁다리 등을 완벽히 분류하여 즉각 버리거나 다른 곳으로 배출하는 활동은 '정리'에 전형적으로 해당한다."},{"n":41,"type":"short","stem":"3정 5행(3정5S) 활동 중, '필요한 물건을 필요한 장소에 가지런히 명시해 배치하여 필요한 사람이 최소한의 시간에 즉시 찾아 쓰도록 만드는 구체적 배치 활동'을 뜻하는 단어는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"정돈 (整頓)","explain":"3정 5행(5S) 행동 가이드 중, 정리된 자재와 측정 도구 등을 누구나 이름표와 수량을 통해 즉각 찾아 쓰고 복귀시킬 수 있도록 가지런하고 편리하게 배치하는 활동은 '정돈'에 지시 매칭된다."},{"n":42,"type":"short","stem":"연강용 반자동 CO2 용접 와이어인 'Y GW 13'의 규격 기호에서, 맨 뒤의 숫자 '13'이 정의하고 지시하는 구체적인 세 가지 화학적 및 가스 사양의 적용 한계 분류는 무엇입니까? (3가지 요소를 간략히 나열하시오)","choices":[],"answerIndex":null,"answerText":"보호가스, 적용되는 강의 종류, 화학성분","explain":"KS 규격 와이어 표기 규격 'Y GW 13'의 뒷번호 코드는 용접 시 활용되는 전용 차폐 보호가스 계통 종류, 해당 용접봉의 모재 적용 강종 분류 범위, 그리고 연선 심선의 화학 성분 표준 사양 한계를 한데 지정 분류하는 규격 번호이다."},{"n":43,"type":"short","stem":"그라인더실의 금속 가공 작업장 청소 시 미세 쇳가루 분진이 호흡기로 흡입되는 치명적인 안전 보건 위해 요인을 방지하기 위해 작업자가 의무적으로 착용해야 하는 특수 안면 보호구는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"방진마스크","explain":"연마 가공 그라인더실 바닥이나 작업대 청소 시 미세 쇳가루 분재 가루와 철 가루 미세 분진이 체내 폐포에 침착하는 것을 원천 감쇄하기 위해 의무 착용하는 호흡용 안면 보호구는 '방진마스크'이다."},{"n":44,"type":"short","stem":"용접 실습장 바닥 청소 시 작업자가 용접 종료 후 열기가 완전히 식지 않은 용접봉 폐 꽁다리를 방치하면 가연성 헝겊이나 기름과 접촉해 유발되는 치명적인 현장 재해는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"화재 (Fire)","explain":"작업 종료 후 아직 표면 온도가 높은 고온 상태의 시편이나, 피복제가 불에 탄 고온의 용접봉 폐 꽁다리를 바닥 쓰레기나 가연물 주변에 무심코 던지거나 방치할 경우 잠복 화열에 의해 '화재' 재해가 즉시 발현될 수 있다."},{"n":45,"type":"short","stem":"수공구를 작업 개시 전 정비할 때 손에서 미끄러져 손가락 협착이나 타격을 방지하기 위해 반드시 공구 표면 및 손잡이에서 완전히 닦아내야 하는 이물질은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"기기나 손에 묻은 기름","explain":"멍키스패너나 바이스 등의 압착 수공구를 조일 때, 금속 가공 시 사용되거나 표면에 남은 윤활유 성분의 미끄러운 '기름(Oil)' 물질은 조임 가동 중 미끄러져 손목 골절이나 협착 충격 부상을 가할 수 있어 사전 걸레로 닦아 제거해야 한다."},{"n":46,"type":"short","stem":"3정 5행의 기초가 되는 '3정 원칙'에 해당되는 세 가지 필수 요소는 정품, 정위치, 그리고 무엇입니까?","choices":[],"answerIndex":null,"answerText":"정량 (Right Quantity)","explain":"3정 5행을 효율화하고 수량을 수시로 통제하여 과부하를 막는 '3정 기법'의 세 가지 기둥은 적정한 명판 부위 비치인 정위치, 정합 물품의 비치인 정품, 그리고 한도 초과 수량 적재를 막는 '정량'의 배치이다."},{"n":47,"type":"short","stem":"고압 가스를 저장 및 보관하는 강재 실린더 용기는 열화 및 가스 폭발 팽창을 방지하기 위해 직사광선을 피해 섭씨 몇 도 이하의 '어떤 온도 성격의 환경'에 상시 보관해야 합니까?","choices":[],"answerIndex":null,"answerText":"서늘한 곳 (또는 40도 이하의 상온 보관)","explain":"가연성 가스 용기의 외부 가열에 따른 폭발 안전 마진을 유지하기 위해 고압 가스 실린더는 직사광선을 완전 차단하고, 섭씨 40도 이하의 선선한 대류 상태가 정돈된 '서늘한 곳'에 기립 보관해야 한다."},{"n":48,"type":"short","stem":"용접기의 장시간 미사용 또는 정기 점검 시 케이스 덮개를 완전히 연 다음, 정류기 냉각 팬이나 변압기 권선에 수북이 쌓인 먼지를 불어내 방열 효과를 유지하는 데 사용하는 설비 공구는 무엇입니까?","choices":[],"answerIndex":null,"answerText":"압축공기 (에어 콤프레셔)","explain":"가동철심형 교류아크용접기 케이스 덮개를 열고 내부의 불순물 및 냉각 방열판, 변압기 권선 틈새에 낀 다량의 철분 먼지를 날려 없애기 위해 분출하는 고압의 세척 매체는 '압축공기(Compress Air / 에어콤프레셔 가동)'이다."},{"n":49,"type":"short","stem":"흄가스 유해 요인을 차단하기 위한 흄 배기 환기시설에 대해 작업 전 작동 유무를 수시 점검하고 스위치와 연결되어 통풍 기류를 생성하는 구멍 부위의 명칭은 무엇입니까?","choices":[],"answerIndex":null,"answerText":"환기구 (또는 환풍기)","explain":"흄가스 제거용 환기 설비가 원활히 작동하는지 확인하기 위해 용접 개시 전 개방 및 오동작 상태를 점검하는 통풍 닥트 연결부 및 팬 가동 구멍은 '환기구'이다."},{"n":50,"type":"short","stem":"용접 후 폐 모재와 잔여 시험편을 적치함에 정리 정돈하여 관리할 때, 모재의 성분 종류 분류와 더불어 무엇을 기준으로 삼아 층별 배치 분류를 시행해야 합니까?","choices":[],"answerIndex":null,"answerText":"두께 (Thickness)","explain":"사용 후 남은 시험편이나 여분의 잔여 철 모재는 다음 시공 시 그루브 설계와 가접 전류 및 각도의 재설계 오차를 없애기 위해, 모재의 연강 STS 등 성분 구분 외에도 판재의 '두께별'로 완벽히 구분 적재 관리하는 것이 필수 원칙이다."}]},"3":{"unit":3,"title":"용접절차사양서(WPS) 해독","code":"LM1601050003","group":"공통","theory":[{"t":"h2","v":"1. WPS / PQR / WPQ의 핵심 개념 및 연계 관계"},{"t":"p","v":"용접 공정에 있어서 품질 보증과 안전 확보를 위해 가장 먼저 작성되고 검증되는 체계가 바로 WPS(용접절차사양서), PQR(용접절차인정기록서), WPQ(용접사자격인정기록서)이다. 이 삼각 편대는 각각 규정된 공학적 검증과 표준 규격(AWS, ASME Sec.IX 등)에 따라 설계되고 제작된다."},{"t":"h3","v":"1.1 주요 문서의 정의와 작성 목적"},{"t":"li","v":"WPS (Welding Procedure Specification): 용접사에게 실제 작업장에서 수행해야 할 상세한 용접조건과 방법(전류, 전압, 용접속도, 모재 종류, 보호가스 등)을 기술한 작업 지침서이다. 현장에 의무적으로 배포 및 비치되어야 하는 실제적인 공학 지침 역할을 한다."},{"t":"li","v":"PQR (Procedure Qualification Record): 작성된 WPS 초안(Draft WPS)을 바탕으로 시험편을 실제 용접(Coupon Welding)해 본 후, 인장/굽힘 등의 파괴시험 결과를 기록하여 해당 WPS의 기술적 적합성을 공학적으로 증명하는 근거 서류이다. PQR은 원칙적으로 실제 기록이므로 오탈자 외에는 개정이 불가능하다."},{"t":"li","v":"WPQ (Welder Performance Qualification): WPS와 PQR이 공학적으로 검증된 공정(Procedure)의 증명이라면, WPQ는 해당 용접 공정을 실제 수행하는 용접사 개인의 기량과 숙련도가 기준에 충족하는지를 평가하고 자격을 인정하는 기록서이다."},{"t":"h3","v":"WPS와 PQR의 구조적 차이점 비교"},{"t":"table","rows":[["비교 항목","PQR (용접절차인정기록서)","WPS (용접절차사양서)"],["데이터 성격","시험편 용접 시 측정된 실제 수치 (Actual Values)","작업자가 시공할 수 있는 허용 범위 (Range Allowed)"],["개정 여부","원칙적 개정 불가 (오기 이외의 변경 불가)","변수 변경 및 설계 조건에 따라 지속적 개정 가능"],["타사 양도성","공급자/제작자 고유 책임으로 타사 양도 불가","동일한 PQR 근거 시 양도 또는 통합 배포 가능"],["기재 변수","실제 적용한 필수변수 및 추가필수변수 위주 표기","필수변수, 추가필수변수, 비필수변수 모두 상세 표기"]]},{"t":"h2","v":"2. ASME Sec.IX에 따른 용접 변수 분류 체계"},{"t":"p","v":"용접 조건이 설계상 변경되었을 때, WPS를 새로 다시 만들고 파괴 시험(PQ test)을 거쳐야 하는지의 여부는 ASME Sec.IX (QW-250) 규정의 변수 종류(Variables)에 따라 결정된다."},{"t":"h3","v":"2.1 필수변수, 추가필수변수, 비필수변수의 완벽 정의"},{"t":"p","v":"필수변수 (Essential Variables): 용접부의 야금학적 및 기계적 성질(특히 인장강도와 연성)에 직접적인 중대한 영향을 미치는 조건이다. 이 변수의 특정 한계치를 초과하여 변경할 경우, 기존의 PQR은 효력을 상실하며 반드시 신규 용접절차인정시험(PQ test)을 실시하여 새로운 PQR을 획득해야만 한다."},{"t":"p","v":"대표 사례: 용접 방법의 변경, 모재 P-No 변경, 충격 시험 무관 시 모재 두께 변경 범위를 초과하는 두께 변경 등."},{"t":"p","v":"추가필수변수 (Supplementary Essential Variables): 구조물이 극저온 환경에 노출되어 충격 시험(Impact Test)이 요구되는 합금강이나 저온용 강재 용접일 경우에만 '필수변수'로 전환되는 항목들이다. 인성을 확보하기 위한 제한 요건이다."},{"t":"p","v":"대표 사례: 열입력량(Heat Input)의 증가 제한, 층간 온도의 상승 제한, 모재 Gr-No 변경 등."},{"t":"p","v":"비필수변수 (Nonessential Variables): 용접부의 인장강도나 굽힘 성능에는 영향이 적어, 재인정 시험 없이 WPS 상에서 개정(Revision) 및 자유로운 변경 기재가 가능한 조건이다."},{"t":"p","v":"대표 사례: 운봉 방법(직선비드에서 위빙비드로 변경), 홈 각도의 미세 조절, 층간 청소 방법(브러시 사용 등)."},{"t":"table","rows":[["★ ASME 분류 기호 용어 정리 P-No: 재질의 기계적 성질과 용접성을 고려하여 PQ 시험 횟수를 획기적으로 줄이기 위해 유사 재질끼리 묶어 분류한 번호이다. Gr-No: 동일한 P-No 내부에서 인성(Toughness) 확보를 위한 충격 시험이 법적으로 요구될 때 다시 미세 분류한 번호이다. F-No & A-No: 용가재의 야금학적 화학 성분(A-No)과 용접 작업성 분류 코드(F-No)를 규정한 번호이다."]]},{"t":"h2","v":"3. 용접종류별 파괴 및 비파괴 인정 요건"},{"t":"p","v":"용접절차인정시험(PQ Test)에서 시험편의 건전성을 입증하기 위해서는 규격에 부합하는 파괴적 인장/굽힘 시험 등을 필히 수행해야 한다."},{"t":"h3","v":"3.1 모재 두께별 맞대기 용접시험 규정"},{"t":"p","v":"맞대기 용접시험(Groove Weld Coupon)의 주요 파괴시험 요건은 다음과 같다."},{"t":"li","v":"인장 시험 (Tensile Test): 이음부의 강도를 판정하기 위해 반드시 2개의 시험편을 가공하여 시험하며, 합격 기준은 해당 규격 모재의 최소 인장강도 이상이어야 한다."},{"t":"li","v":"굽힘 시험 (Bend Test): 연성 및 융합 불량, 내부 결함을 판정하기 위한 필수 시험이다. 모재의 두께에 따라 채취 방식이 다르다."},{"t":"li","v":"모재 두께 19mm (3/4 in) 이하: 표면(Face) 굽힘시험편 2개, 이면(Root) 굽힘시험편 2개 채취가 표준 요건이다."},{"t":"li","v":"모재 두께 19mm 초과 시: 용접 이음단면을 그대로 굽히는 측면(Side) 굽힘시험편 4개 채취가 필수적이다."},{"t":"h3","v":"3.2 필릿 용접부 비압력부 인정 요건"},{"t":"p","v":"필릿 용접(Fillet Weld) 비압력부 인정 시험 시에는 모재 내부의 용융 상태와 건전성을 판정하기 위해 시험편을 완전히 파단(파면)시키는 매크로(Macro) 시험을 실시한다. 이때 시험편의 수량은 판재(Plate)는 5개, 관재(Pipe)는 4개를 균일하게 채취하여 단면을 산부식시킨 뒤 침투 상태를 육안 검사한다."},{"t":"h2","v":"4. 예열 및 용접 후 열처리 (PWHT) 요건"},{"t":"p","v":"용접 시 급랭으로 인한 저온 균열 방지 및 용접 잔류응력 제거를 위해 예열(Preheat)과 후열(Post heating), 그리고 용접 후 열처리(PWHT: Post Weld Heat Treatment)를 수행한다. 이는 모재 강종 및 두께에 따라 필수적으로 준수해야 하는 공학적 핵심 변수이다."},{"t":"h3","v":"4.1 예열 및 층간 온도의 기본 수칙"},{"t":"p","v":"예열(Preheat)은 아크 열에 의한 급랭 조대화를 방지하고, 용접 잔류응력을 크게 완화하기 위해 모재를 선제가열하는 공정이다. 층간 온도(Inter-pass Temp)는 다층 용접 시 바로 이전 패스의 용접 잔존 열원에 의한 최고 온도이다. WPS 상에 규정된 예열 및 층간 온도 범위의 이탈은 필수 변수이다."},{"t":"h3","v":"4.2 재료별 후열처리(PWHT) 및 면제 규격 요건"},{"t":"table","rows":[["P-No","대표 규격 명칭","PWHT 규정 온도 (℃)","면제 최대 두께"],["P-1","탄소강 (SA516-70 등)","593 ~ 649 ℃","19.1 mm 이하 면제"],["P-3","합금강 (0.5Mo 강재 등)","593 ~ 677 ℃","16.0 mm 이하 면제"],["P-4","크롬-몰리 합금강","593 ~ 704 ℃","12.7 mm 이하 면제"],["P-5","고크롬 합금강","677 ~ 746 ℃","12.7 mm 이하 면제"]]},{"t":"h2","v":"5. 용접 입열량(Heat Input)의 수학적 계산법"},{"t":"p","v":"용접 입열량(Heat Input)은 용접 과정에서 단위 길이당 모재에 인가되는 열에너지의 양을 나타낸다. 입열량이 과도할 경우 용접부 조대화와 열영향부(HAZ)의 취화가 일어나며, 입열량이 부족하면 용입 부족이나 융합 불량이 발생한다."},{"t":"h3","v":"5.1 용접 입열량 공식 및 인자 해독"},{"t":"table","rows":[["★ 용접 입열량 표준 계산 공식 계산 공식: H = (E × I × 60) / v - H: 용접 입열량 (Heat Input) [단위: J/cm 또는 J/mm] - E: 아크 전압 (Arc Voltage) [단위: V] - I: 용접 전류 (Welding Current) [단위: A] - v: 용접 속도 (Travel Speed) [단위: cm/min 또는 mm/min] * 아크 열효율(η)이 주어질 경우 분자에 η를 추가로 곱해준다."]]},{"t":"h3","v":"5.2 실제 계산 예제 분석"},{"t":"p","v":"예제: 아크전압 24V, 용접전류 150A로 용접할 때, 용접 속도가 15 cm/min 이라면 입열량 H는 얼마인가?"},{"t":"p","v":"풀이 과정:"},{"t":"li","v":"전압(E) = 24 V, 전류(I) = 150 A, 속도(v) = 15 cm/min"},{"t":"li","v":"H = (24 × 150 × 60) / 15 = 216,000 / 15 = 14,400 [J/cm]"},{"t":"li","v":"이를 kJ 단위로 변환 시: 14,400 J/cm = 14.4 kJ/cm가 된다."},{"t":"h2","v":"6. NCS 3편 대표 엄선 실전 50제 평가문항"},{"t":"p","v":"본 문제 세트는 고등학교 3학년 과정평가형 자격취득 시험의 실전 합격률을 극대화하기 위해 출제 빈도가 가장 높은 유형들로 기획되었습니다."},{"t":"p","v":"객관식 4지선다형 35문항과 핵심 수치 및 계산 능력을 묻는 단답형 15문항으로 구성되었습니다."},{"t":"h3","v":"6.1 제1부: 객관식 4지선다형 (1번~35번)"}],"questions":[{"n":1,"type":"mcq","stem":"특정 용접의 시행에 필요한 상세한 용접조건 및 작업 지침을 기술한 문서로, 용접작업을 실질적으로 지시하는 문서의 명칭은 무엇인가?","choices":["WPS (Welding Procedure Specification)","WPQ (Welder Performance Qualification)","MTR (Mill Test Report)","PQR (Procedure Qualification Record)"],"answerIndex":1,"answerText":"① WPS (Welding Procedure Specification)","explain":"WPS는 용접사에게 구체적인 작업 방법과 전류, 전압 등의 수치적 지침을 직접 제공하는 지침서이다."},{"n":2,"type":"mcq","stem":"다음 중 용접절차인정기록서(PQR)에 대한 설명으로 가장 올바르지 않은 것은?","choices":["WPS 초안을 바탕으로 실제 용접한 조건과 시험 결과를 기록한 문서이다.","규정에 의거하여 실제 기록이므로 오탈자 수정 이외에는 마음대로 개정할 수 없다.","PQR의 인정 및 기록 책임은 전적으로 주문주(Client)에게만 있다.","PQR은 원칙적으로 타 업체에 양도하거나 판매할 수 없다."],"answerIndex":3,"answerText":"③ PQR의 인정 및 기록 책임은 전적으로 주문주(Client)에게만 있다.","explain":"PQR의 승인 및 보증 책임은 전적으로 공급자 또는 제작자(제조사)에게 귀속되며 타 업체에 일방적으로 임대하거나 양도할 수 없다."},{"n":3,"type":"mcq","stem":"다음 중 용접변수 변경에 따른 WPS와 PQR의 개정 및 신규 PQ 시험 요건에 대한 설명으로 올바른 것은?","choices":["비필수변수가 변경되어도 무조건 신규 PQ 시험을 하고 PQR을 받아야 한다.","필수변수가 규정 허용 범위를 초과하여 변경된 경우에는 반드시 신규 PQ 시험을 실시해야 한다.","추가필수변수는 충격 시험 요구 여부와 관계없이 항상 무조건 필수변수처럼 작동한다.","WPS는 한번 작성되면 어떤 변수가 변경되더라도 절대 개정하거나 수정할 수 없다."],"answerIndex":2,"answerText":"② 필수변수가 규정 허용 범위를 초과하여 변경된 경우에는 반드시 신규 PQ 시험을 실시해야 한다.","explain":"ASME 규정 상 필수변수가 범위 초과 변경될 경우 기존 PQR은 무효화되어 반드시 신규 PQ 테스트를 다시 치러야 한다."},{"n":4,"type":"mcq","stem":"다음 중 필수변수(Essential Variables)에 속하지 않는 요건은 무엇인가?","choices":["용접 방법(Welding Process)의 전면적인 변경","모재 재질 코드(P-No)의 변경","가스가 차폐되는 이음 홈부의 개선 각도 변경","백킹재(Backing)의 미적용에서 적용으로의 변경"],"answerIndex":3,"answerText":"③ 가스가 차폐되는 이음 홈부의 개선 각도 변경","explain":"이음 홈의 미세한 각도 조절은 비필수변수에 해당하여 PQ 시험의 재수행 없이 WPS의 개정 서술만으로 시공 가능하다."},{"n":5,"type":"mcq","stem":"충격 시험(Impact Test)이 요구되는 합금강 용접부 설계 시에만 필수변수로 격상되는 변수를 뜻하는 명칭은?","choices":["필수변수","추가필수변수","비필수변수","일반변수"],"answerIndex":2,"answerText":"② 추가필수변수","explain":"추가필수변수는 극저온 충격인성 시험이 추가적으로 발효될 때에만 필수 변수로 작용하는 중요 인자군이다."},{"n":6,"type":"mcq","stem":"다음 중 비필수변수(Nonessential Variables)에 해당하는 용접 인자로 가장 적합한 것은?","choices":["모재 P-No 간 이종 접합의 변경","보호가스의 공급 여부 및 조성 비율의 변경","백킹재(Backing)의 제거","운봉 기법의 변경 (직선 비드에서 위빙 비드로 변경)"],"answerIndex":4,"answerText":"④ 운봉 기법의 변경 (직선 비드에서 위빙 비드로 변경)","explain":"운봉 기법(직선 비드에서 위빙 비드로의 운봉법 전환)은 기계적 강도에 직접적 영향이 적어 비필수변수로 취급된다."},{"n":7,"type":"mcq","stem":"ASME Sec.IX에서 재질의 기계적 성질과 용접성을 고려하여 비슷한 재질끼리 묶어서 분류한 식별 번호는?","choices":["F-No","P-No","A-No","Gr-No"],"answerIndex":2,"answerText":"② P-No","explain":"ASME Sec.IX에서는 모재의 야금학적 화학 성분 및 용접성 유사성에 따라 P-No(P-Number)로 묶어서 분류하고 있다."},{"n":8,"type":"mcq","stem":"탄소강 및 저합금강에서 동일한 P-No 내부에서 충격 요구 조건이 발효될 때 저온 인성을 보증하기 위해 추가 분류하는 번호는?","choices":["Gr-No","F-No","A-No","UNS 번호"],"answerIndex":1,"answerText":"① Gr-No","explain":"Gr-No(Group Number)는 동일 P-No 강재 중 충격 인성 보증 요건이 부여될 때 세부적으로 한 번 더 분류하는 세분류 번호이다."},{"n":9,"type":"mcq","stem":"용가재(Filler Metal)의 사용 작업성과 작업 특성별 분류에 따라 매겨진 식별 번호 명칭은?","choices":["A-No","Gr-No","P-No","F-No"],"answerIndex":4,"answerText":"④ F-No","explain":"용가재의 현장 작업성 및 보호피복 특성에 따라 F-No가 부여되어 용접 효율성을 보증한다."},{"n":10,"type":"mcq","stem":"용착금속(Deposited Weld Metal)의 야금학적 화학 성분 분류에 따라 부여되는 기호는?","choices":["Gr-No","P-No","F-No","A-No"],"answerIndex":4,"answerText":"④ A-No","explain":"A-No는 모재가 응고되어 용융 정착된 용착금속(Deposited Weld Metal)의 순수한 화학 성분별 분류 체계이다."},{"n":11,"type":"mcq","stem":"다음 중 맞대기 용접(Groove Weld)의 용접절차인정시험(PQ test) 시 채취해야 하는 필수 인장시험편의 수량으로 옳은 것은?","choices":["1개","2개","3개","4개"],"answerIndex":2,"answerText":"② 2개","explain":"규정상 이음 맞대기 용접부 인정시험 시 기계적 강도를 평가하기 위해 인장시험편은 필히 2개 이상 시험하여야 한다."},{"n":12,"type":"mcq","stem":"용접인정시험에서 모재의 두께가 19mm 이하일 때 굽힘 시험을 수행하기 위한 표준 시험편 종류와 수량으로 옳은 것은?","choices":["표면 굽힘 2개, 이면 굽힘 2개","측면 굽힘 4개","표면 굽힘 1개, 이면 굽힘 1개","측면 굽힘 2개, 이면 굽힘 2개"],"answerIndex":1,"answerText":"① 표면 굽힘 2개, 이면 굽힘 2개","explain":"두께가 19mm(3/4 in) 이하인 시편 규격의 경우 표면 굽힘 2개 및 이면 굽힘 2개 채취를 표준 요건으로 명기하고 있다."},{"n":13,"type":"mcq","stem":"용접인정시험에서 모재의 두께가 19mm를 초과하는 두꺼운 후판일 때 굽힘 시험편의 표준 수량 및 종류는 무엇인가?","choices":["표면 굽힘 4개","이면 굽힘 4개","측면 굽힘 4개","측면 굽힘 2개, 표면 굽힘 2개"],"answerIndex":3,"answerText":"③ 측면 굽힘 4개","explain":"모재 두께가 19mm 초과하는 후판일 경우, 표면과 이면 전체를 한 번에 검증하기 위해 이음부 단면 전체를 측면에서 굽히는 측면 굽힘시험 4개가 표준이다."},{"n":14,"type":"mcq","stem":"필릿용접 비압력부 인정 시험 시 모재 내부의 침투 건전성을 판정하기 위해 수행하는 파괴 시험 방법 명칭은 무엇인가?","choices":["방사선 투과 시험 (RT)","매크로(Macro) 파면 시험","샤르피 충격 시험 (CVN)","인장 시험"],"answerIndex":2,"answerText":"② 매크로(Macro) 파면 시험","explain":"비압력 필릿용접의 경우 강도 판정 대신 용접 목두께와 루트부의 완전한 융합 및 내부 침투 건전성을 기하학적으로 평가하기 위해 매크로 파면시험을 실시한다."},{"n":15,"type":"mcq","stem":"필릿 용접 시험편 매크로 시험 시 채취해야 하는 표준 시험편의 개수 기준으로 옳은 것은?","choices":["판재는 5개, 관재는 4개","판재는 4개, 관재는 5개","판재와 관재 모두 4개","판재와 관재 모두 5개"],"answerIndex":1,"answerText":"① 판재는 5개, 관재는 4개","explain":"매크로 시험편은 판재(Plate) 용접의 경우 5개 단면, 관재(Pipe) 용접의 경우 4개 방향 단면 채취가 필수적이다."},{"n":16,"type":"mcq","stem":"다음 중 용접 전에 모재의 온도를 높여 급랭을 방지하고 균열을 예방하기 위한 조치를 뜻하는 용어는?","choices":["예열 (Preheat)","후열 (Post heating)","용접 후 열처리 (PWHT)","층간 온도 (Inter-pass temperature)"],"answerIndex":1,"answerText":"① 예열 (Preheat)","explain":"용접 전 모재에 일정한 열을 가하여 온도를 상승시키는 공정은 예열(Preheat)로 지칭된다."},{"n":17,"type":"mcq","stem":"다음 중 용접 후열처리(PWHT)를 실시하는 가장 궁극적인 목적에 해당하는 설명은 무엇인가?","choices":["용접부의 표면 광택 및 심미성 강화","용접 열영향부의 결정립 조대화 촉진","용접 잔류응력 완화 및 취성 균열 예방","용입 깊이를 임의로 확장하기 위함"],"answerIndex":3,"answerText":"③ 용접 잔류응력 완화 및 취성 균열 예방","explain":"PWHT(용접후 열처리)는 급랭으로 모재 내부에 가둬진 잔류응력을 해소하고 미세조직의 연성을 보강하기 위해 실시한다."},{"n":18,"type":"mcq","stem":"다음 중 탄소강(SA516-70 등, P-1) 모재의 표준 후열처리(PWHT) 온도 범위로 올바른 것은?","choices":["200 ~ 300 ℃","400 ~ 450 ℃","593 ~ 649 ℃","850 ~ 900 ℃"],"answerIndex":3,"answerText":"③ 593 ~ 649 ℃","explain":"탄소강(P-1)의 용접후 열처리(PWHT) 표준 온도는 ASME 기준 593 ~ 649 ℃ 범위로 규정되어 있다."},{"n":19,"type":"mcq","stem":"탄소강(P-1) 모재의 경우, 몇 mm 이하의 두께 범위에서 후열처리(PWHT) 의무가 통상적으로 면제되는가?","choices":["12.7 mm 이하","16.0 mm 이하","19.1 mm 이하","25.4 mm 이하"],"answerIndex":3,"answerText":"③ 19.1 mm 이하","explain":"탄소강 P-1 모재의 공학적 면제 요건은 호칭 두께가 19.1 mm (3/4 in) 이하인 경우에 충족된다."},{"n":20,"type":"mcq","stem":"다음 중 용접 입열량(Heat Input)을 구하는 공학적 계산 공식으로 올바른 것은?","choices":["H = (E × v × 60) / I","H = (E × I × 60) / v","H = (I × v × 60) / E","H = (E × I) / (v × 60)"],"answerIndex":2,"answerText":"② H = (E × I × 60) / v","explain":"용접 입열량 공식은 H = (E × I × 60) / v 이다. 전압(E), 전류(I)에 비례하고 속도(v)에 반비례한다."},{"n":21,"type":"mcq","stem":"아크 전압 20V, 용접 전류 100A, 용접 속도 12 cm/min 일 때, 용접 입열량 H는 몇 J/cm 인가?","choices":["10,000 J/cm","12,000 J/cm","15,000 J/cm","20,000 J/cm"],"answerIndex":1,"answerText":"① 10,000 J/cm","explain":"공식 대입: H = (20V × 100A × 60초) / 12 cm/min = 120,000 / 12 = 10,000 J/cm 이다."},{"n":22,"type":"mcq","stem":"용접 입열량 공식에서 입열량을 극대화하여 깊은 용입을 얻고자 할 때 적합한 제어 조치는 무엇인가?","choices":["아크 전압과 용접 전류를 높이고 용접 속도를 느리게 한다.","용접 전류를 낮추고 아크 전압을 낮춘다.","용접 속도만을 극한으로 빠르게 가속한다.","아크 전압과 용접 전류를 낮추고 용접 속도를 빠르게 한다."],"answerIndex":1,"answerText":"① 아크 전압과 용접 전류를 높이고 용접 속도를 느리게 한다.","explain":"수학적 비례식에 의해 인가되는 열량을 크게 하기 위해서는 전류(I)와 전압(E)을 크게 하고 속도(v)를 느리게 진행해야 한다."},{"n":23,"type":"mcq","stem":"용접 후 구조물에서 냉각 시 용접금속의 수축이나 모재의 기계적 구속으로 인해 내부에 발생하는 응력은 무엇인가?","choices":["인장응력","압축응력","잔류응력","굽힘응력"],"answerIndex":3,"answerText":"③ 잔류응력","explain":"용접 가열 후 냉각 시 불균일한 수축과 구속 조건에 의해 내부에 영구적으로 갇힌 응력은 용접 잔류응력이다."},{"n":24,"type":"mcq","stem":"T형 필릿용접부의 실제 목두께(Throat Thickness)와 각장(Leg Length, h) 사이의 관계식으로 옳은 것은? (단, 이등변삼각형 기준)","choices":["목두께 = 0.5 h","목두께 = 0.707 h","목두께 = 1.414 h","목두께 = 2.0 h"],"answerIndex":2,"answerText":"② 목두께 = 0.707 h","explain":"이등변삼각형 기하학 기준, 내접 삼각 목두께(a)는 각장(다리길이, h)에 sin 45°인 0.707을 곱해 산출한다."},{"n":25,"type":"mcq","stem":"층간 온도(Inter-pass temperature)에 대한 설명 중 가장 올바른 것은?","choices":["용접을 전개하기 전에 고정용 지그에 가하는 최저 온도","다층 용접 작업 시 바로 이전 패스 비드의 잔존 열원에 의한 최고 온도","용접이 최종 완료된 후 서랭로(Furnace) 내부의 유지 온도","용접 아크 주위의 공기 온도"],"answerIndex":2,"answerText":"② 다층 용접 작업 시 바로 이전 패스 비드의 잔존 열원에 의한 최고 온도","explain":"층간 온도는 다층 다패스 용접 시 용접선을 따라 전개할 때 이전 잔존 열원에 의해 형성되어 있는 시작부 최고 온도이다."},{"n":26,"type":"mcq","stem":"다음 비파괴 검사(NDT) 기호 중, 용접부 내부에 방사선을 투과시켜 필름의 감광 상태로 결함을 검출하는 방식을 뜻하는 기호는?","choices":["UT","RT","PT","MT"],"answerIndex":2,"answerText":"② RT","explain":"방사선을 투과시켜 내부 기공이나 균열을 필름 감광으로 관측하는 비파괴 기호는 RT(Radiographic Testing)이다."},{"n":27,"type":"mcq","stem":"다음 중 용접 결함인 언더컷(Undercut)이 발생하는 주된 물리적 원인은 무엇인가?","choices":["용접 전류가 너무 낮고 전압이 낮을 때","용접 속도가 비상식적으로 너무 느릴 때","용접 전류가 과다하게 높고 아크 길이가 길 때","저수소계 용접봉을 사용했을 때"],"answerIndex":3,"answerText":"③ 용접 전류가 과다하게 높고 아크 길이가 길 때","explain":"언더컷은 아크 열이 너무 강력하여 모재 개선 모서리가 필요 이상으로 깎여 나간 후 용착금속이 완전히 채워지지 못할 때 주로 발생한다."},{"n":28,"type":"mcq","stem":"다음 중 기공(Blow hole / Porosity) 결함을 방지하기 위한 대책으로 가장 적절하지 않은 것은?","choices":["피복제에 함유된 습기를 완전히 건조로에서 제거한 용접봉 사용","차폐가스(보호가스)의 적정 유량 제어 및 방풍막 설치","모재 개선면의 기름, 녹, 이물질의 그라인딩 청소","아크 길이를 길게 하고 습기가 높은 장소에서 신속 용접"],"answerIndex":4,"answerText":"④ 아크 길이를 길게 하고 습기가 높은 장소에서 신속 용접","explain":"아크 길이를 과도하게 길게 하거나 습기가 높은 환경에 노출될 경우 수소와 기공 결함이 급증하므로 피해야 한다."},{"n":29,"type":"mcq","stem":"다음 중 용접 비드의 양 끝단 또는 시점과 종점에 발생하는 아크 소멸 시 크레이터(Crater) 부위의 결함을 완전히 예방하기 위해 시험편 양 끝에 부착하는 판재 명칭은?","choices":["스캘롭 (Scallop)","조립 지그","백킹재 (Backing)","엔드 탭 (End Tab)"],"answerIndex":4,"answerText":"④ 엔드 탭 (End Tab)","explain":"비드 끝단부인 시점과 종점의 크레이터 균열을 예방하기 위해 시험편 양 끝단에 대어 시공하는 가보조 판재는 엔드 탭(End Tab)이다."},{"n":30,"type":"mcq","stem":"다음 중 용접 전류 전면 패널에서 조작할 때, 아크 스타트 시 감전을 예방하기 위해 무부하 전압을 20~30V로 자동 강하시켜주는 기기의 명칭은?","choices":["크레이터 제어기","고주파 고전압 장치","배전반 누전차단기","자동전격방지기"],"answerIndex":4,"answerText":"④ 자동전격방지기","explain":"용접을 전개하지 않는 무부하 상태에서 대기 전압을 감전 우려가 없는 20~30V의 낮고 안전한 상한 전압으로 낮춰주는 기기는 자동전격방지기이다."},{"n":31,"type":"mcq","stem":"다음 중 강판의 인장시험 시 나타나는 공칭응력-변형률 선도에서 항복을 지나 재료가 견딜 수 있는 최대의 응력을 뜻하는 명칭은?","choices":["항복강도","피로강도","인장강도","크리프강도"],"answerIndex":3,"answerText":"③ 인장강도","explain":"인장시험에서 도출되는 공칭 선도상 단면적당 견딜 수 있는 최고 하중 응력치는 인장강도(Tensile Strength)이다."},{"n":32,"type":"mcq","stem":"다음 중 용접 후 잔류응력을 기계적인 방법으로 완화하는 방법으로, 끝이 둥근 피닝 망치로 용접 비드 표면을 연속적으로 두드리는 응력 완화 공법은?","choices":["피닝법","노내 풀림법","저온 응력 완화법","국부 풀림법"],"answerIndex":1,"answerText":"① 피닝법","explain":"끝이 둥근 특수 피닝 해머로 비드 표면을 연속적으로 구타하여 내부 잔류응력을 완화하는 방법은 피닝법(Peening)이다."},{"n":33,"type":"mcq","stem":"용접 후 잔류응력을 완화하기 위해 구조물을 대형 노(Furnace) 내에 통째로 넣고 일정한 온도와 시간 동안 가열한 뒤 노 내에서 서랭하는 표준 열처리 공법은?","choices":["피닝법","수랭 냉각법","국부 풀림법","노내 풀림법"],"answerIndex":4,"answerText":"④ 노내 풀림법","explain":"용접물을 대형 가열로(Furnace) 내부에 수용하여 전체적으로 응력을 완화하는 열처리는 노내 풀림법이다."},{"n":34,"type":"mcq","stem":"다음 중 용접 이음의 설계 원칙으로 가장 부적절한 설명은 무엇인가?","choices":["용접 이음 및 비드를 특정 부위에 집중 배치한다.","반복하중을 받는 맞대기 이음의 비드 덧붙이는 과도하게 높이지 않는다.","크레이터 결함을 막기 위해 돌출부에 엔드 탭을 부착하여 시공한다.","응력 집중을 완화하기 위한 개선 홈 설계를 준수한다."],"answerIndex":1,"answerText":"① 용접 이음 및 비드를 특정 부위에 집중 배치한다.","explain":"용접선이 특정 부분에 집중 배향될 경우 응력이 과도하게 축적되어 치명적인 취성 파괴를 초래할 수 있으므로 분산 배치해야 한다."},{"n":35,"type":"mcq","stem":"다음 중 용접 입열량이 금속 열영향부(HAZ) 조직에 미치는 공학적 영향으로 가장 적절한 것은?","choices":["입열량이 너무 작으면 냉각이 매우 느려져 연성이 낮아진다.","입열량은 열영향부의 결정 조직 크기와 기계적 성질에 아무런 영향을 주지 않는다.","입열량이 크면 클수록 열영향부의 결정립 크기가 미세화되고 인성이 크게 향상된다.","입열량이 크면 냉각 속도가 매우 느려져 열영향부 조직이 조대화되고 충격 저항이 저하된다."],"answerIndex":4,"answerText":"④ 입열량이 크면 냉각 속도가 매우 느려져 열영향부 조직이 조대화되고 충격 저항이 저하된다.","explain":"입열량이 너무 과도하면 아크 공급 열에너지가 높아져 냉각 속도가 매우 정체되며, 결정 성장이 오래 지속되어 결정립 조대화 및 취화가 일어난다."},{"n":36,"type":"short","stem":"특정용접에 필요한 상세조건을 기술하여 용접사에게 지침을 제공하는 문서인 WPS와, 이 WPS의 기술적 적합성을 인장/굽힘 등의 시험 결과로 증빙하는 서류인 PQR 사이의 관계를 뜻하는 용어로, WPS는 어떤 문서를 반드시 근거(Basis)로 작성되어야 하는가?","choices":[],"answerIndex":null,"answerText":"PQR (용접절차인정기록서)","explain":"WPS는 임의 작성이 불가능하며, 반드시 인장 및 굽힘 파괴 시험 결과가 기록 및 보증된 PQR 문서를 유일한 공학적 근거(Basis)로 수립되어야 한다."},{"n":37,"type":"short","stem":"용접절차인정시험(PQ test) 시, 시험편의 모재 두께가 19mm 이하인 경우 필수적으로 채취하여 굽힘 성능을 검증해야 하는 굽힘 시험편의 상세 수량 조건(표면 및 이면 수량)을 적으시오.","choices":[],"answerIndex":null,"answerText":"표면 굽힘 2개, 이면 굽힘 2개 (총 4개)","explain":"두께 19mm 이하 모재 시험편은 표면 연성 검출을 위한 표면 굽힘 2개와 루트 용융부 결함 검출을 위한 이면 굽힘 2개를 채취한다."},{"n":38,"type":"short","stem":"용접절차인정시험(PQ test) 시, 시험편의 모재 두께가 19mm를 초과하는 후판일 경우 필수적으로 4개를 가공하여 단면 전체를 굽히는 굽힘 시험의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"측면 굽힘 시험 (Side Bend Test)","explain":"두께가 19mm 초과하는 후판은 이음단면 중심에서 측면으로 시험편을 가공하여 전체 높이를 수용해 굽히는 측면 굽힘시험 4개가 표준이다."},{"n":39,"type":"short","stem":"필릿 용접부의 비압력부 인정 시험 시, 용접부 품질 및 내부 용융 침투 건전성을 판정하기 위해 시험편을 부식시킨 후 육안으로 조직을 검사하는 시험의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"매크로 시험 (Macro Test)","explain":"필릿 비압력부 검사법으로 산용액 부식 후 육안으로 목두께와 루트부의 완전한 융합 및 내부 침투 건전성을 판정하는 시험이다."},{"n":40,"type":"short","stem":"필릿 용접 시험편을 매크로 시험할 경우, 규격에 따른 단면 채취 수량 조건에 대하여 판재(Plate)와 관재(Pipe) 각각의 기준 수량을 순서대로 적으시오.","choices":[],"answerIndex":null,"answerText":"판재(Plate)는 5개, 관재(Pipe)는 4개","explain":"NCS 필릿용접 교과 규정 기준, 매크로 시험 시 단면 채취 수량은 판재 5개소, 관재 4개소로 엄격히 규정되어 있다."},{"n":41,"type":"short","stem":"탄소강(SA516-70 등)의 용접에서 잔류응력을 제거하고 균열을 방지하기 위해 수행하는 용접 후 열처리를 지칭하는 영문 표준 약어를 적으시오.","choices":[],"answerIndex":null,"answerText":"PWHT (Post Weld Heat Treatment)","explain":"용접 직후 갇힌 잔류응력을 풀림 온도로 가열하여 소멸시키는 용접 후 열처리의 정식 영문 규격 약어이다."},{"n":42,"type":"short","stem":"ASME Sec.IX에 따라, 아크전압 24V, 용접전류 200A로 용접 작업을 진행할 때, 용접 속도가 20 cm/min 인 경우 발생하는 용접 입열량(Heat Input) 값은 몇 J/cm 인지 계산하여 정확한 수치로 적으시오.","choices":[],"answerIndex":null,"answerText":"14,400 [J/cm] (또는 14.4 kJ/cm)","explain":"공식 대입: H = (24V × 200A × 60초) / 20 cm/min = 288,000 / 20 = 14,400 J/cm 가 산출된다."},{"n":43,"type":"short","stem":"용접 입열량 공식 H = (E × I × 60) / v 에서 변수 I가 나타내는 물리 인자의 명칭과 표준 공학 단위를 명확히 쓰시오.","choices":[],"answerIndex":null,"answerText":"용접 전류, 암페어 (A)","explain":"입열량 계산식에서 대문자 I는 아크를 흐르는 용접 전류(Current)를 의미하며, 표준 물리 단위는 암페어(A)이다."},{"n":44,"type":"short","stem":"강판 맞대기 용접 이음 시 아크 열 영향에 따른 모재의 휨 변형을 방지하기 위하여, 용접 전에 모재를 반대 방향으로 미리 약간 구부려 놓는 기하학적 변형 방지법의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"역변형법 (Presetting / Reverse deformation)","explain":"가용접 후 냉각 시 발생하는 휨 변형량을 미리 고려하여 반대 방향으로 2~5°의 기하학적 각도 변형을 주는 방법이다."},{"n":45,"type":"short","stem":"용접을 정지했을 때 용융풀(용융지)이 그대로 응고되면서 수축되어 움푹 파이는 부분으로, 슬래그 혼입이나 균열이 발생하기 쉬워 아크를 짧게 하고 채워주어야 하는 용접부 말단 명칭을 적으시오.","choices":[],"answerIndex":null,"answerText":"크레이터 (Crater)","explain":"용접 아크를 차단하는 순간 비드 끝단부 용융풀이 중심 방향으로 수축 응고하면서 움푹하게 형성되는 분화구 모양의 소용돌이 형태 부위이다."},{"n":46,"type":"short","stem":"맞대기 용접부의 외관 검사 후 실시하는 굽힘 시험에서 균열 오차가 발생했을 때 불합격(0점)으로 판독하는 개별 균열의 단일 최대 허용 오차 크기 기준(몇 mm 이상)을 적으시오.","choices":[],"answerIndex":null,"answerText":"3mm 이상","explain":"외관 통과 후 치르는 굽힘 시험 합격 판정 규정상, 단일 균열의 크기가 3mm 이상 발현되거나 기공 합계가 불합격 범주에 들면 실격 처리(0점)된다."},{"n":47,"type":"short","stem":"T형 필릿 용접부의 이등변삼각형 단면 설계에 있어서, 도면에 제시된 다리 길이(각장) h가 10mm일 때, 이에 내접하는 최대 이등변삼각형 높이 기준의 이론 목두께(a) 수치는 몇 mm인지 계산하시오. (단, 소수점 셋째 자리에서 반올림하여 소수 둘째 자리까지 표기하시오.)","choices":[],"answerIndex":null,"answerText":"7.07 mm","explain":"삼각 목두께 산정 공식: 이론 목두께 a = 각장(h) × sin 45° = 10mm × 0.707 = 7.07mm 가 도출된다."},{"n":48,"type":"short","stem":"다층 용접 시, 바로 앞전 잔존 열원에 의해 용접부 선상에 남아 있는 모재 및 패스의 온도를 뜻하는 핵심 공학 용어를 적으시오.","choices":[],"answerIndex":null,"answerText":"층간 온도 (Inter-pass Temperature)","explain":"다층 다층용접 전개 시 바로 직전 비드 잔존 열원에 의해 가공부에 머물러 있는 최고 허용 온도를 의미하는 수험 단골 공학 용어이다."},{"n":49,"type":"short","stem":"ASME Sec.IX에서 재료의 충격 성능이 중요 변수로 등장하여 충격 시험(Impact test) 요건이 발생할 경우에만 필수변수로 승격하여 관리되는 용접 변수군의 명칭을 적으시오.","choices":[],"answerIndex":null,"answerText":"추가필수변수 (Supplementary Essential Variables)","explain":"ASME Sec.IX 상의 분류로 충격 시험 조건(인성 검증) 시에만 신규 PQ를 유발하는 필수 변수로 자동 변환되는 요인군이다."},{"n":50,"type":"short","stem":"용착부 인장강도 시험편 평가에 있어서, 모재의 최소 규격 인장강도가 60 kgf/mm² 이고, 인장 시험에서 용착 시험편이 파단되었을 때 측정된 인장강도가 50 kgf/mm² 인 경우, 이 맞대기 이음부의 이음 효율은 몇 %인지 산출하시오. (단, 퍼센트 기호 '%'를 반드시 명기하시오.)","choices":[],"answerIndex":null,"answerText":"83.33 % (또는 83.3%)","explain":"이음 효율 계산식: 이음 효율 = (용착부 인장강도 / 모재 인장강도) × 100 = (50 / 60) × 100 = 83.33% 가 성립한다."}]},"4":{"unit":4,"title":"피복아크용접 도면 해독","code":"LM1601050102","group":"피복아크용접","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 이론 요약"},{"t":"h3","v":"1.1 용접 기본기호 및 보조기호 해독"},{"t":"p","v":"용접기호는 설계자의 의도를 제작 및 용접 실무자에게 전달하는 표준화된 도면의 언어입니다. 용접기호의 기본 구성은 화살표, 기준선(수평 실선), 식별선(파선/점선), 그리고 꼬리로 구성되어 있으며, 각각의 요소는 용접 이음의 정확한 위치와 정보를 나타냅니다."},{"t":"h4","v":"표면 용접부 가공방법 기호 표준 규격"},{"t":"table","rows":[["가공방법명","표준 표시 기호","상세 설명 및 적용 기준"],["치핑 (Chipping)","C","용접부 표면의 덧살을 치핑 해머 등으로 때리거나 깎아내어 표면을 평탄하게 다듬는 가공 공정을 지시함."],["그라인딩 (Grinding)","G","연삭 그라인더를 사용하여 비드의 표면이나 토우부의 응력 집중부를 매끄럽게 연삭 마감하는 공정 지시."],["해머링 (Hammering)","H","용접 잔류응력의 완화와 변형 방지를 위해 비드 표면을 기계적으로 타격하여 연신시키는 가공 공정."],["머시닝 (Machining)","M","선반, 밀링 등 밀링 머신이나 공작기계를 사용하여 고정밀 밀착 가공 및 치수 마감을 지시함."],["롤링 (Rolling)","R","압연 또는 회전 롤러를 사용해 용접부 표면을 매끄럽게 가압 가공하는 표면 마감 작업 공정."],["미정 (Unspecified)","U","표면 가공이 필수적으로 요구되지만, 구체적인 가공 방법은 작업 환경에 따라 결정하도록 열어둔 상태."]]},{"t":"p","v":"※ 주의사항: KS 규격에서는 표면 가공방법 기호를 화살표 기준선의 꼬리(Tail) 부분에 명시하여 지시하지만, AWS 규격은 가공방법 기호를 기본 용접 보조기호 위에 결합하여 기준선상에 함께 기재하는 차이점이 있습니다."},{"t":"h3","v":"1.2 정투상법 및 각법 구분 기준"},{"t":"p","v":"용접 구조물 제작 도면은 입체 물체를 평면용지 상에 정확히 기하학적으로 배치하기 위하여 정투상법을 원칙으로 삼습니다. 제3각법은 정면도를 기준으로 평면도가 위쪽, 우측면도가 우측에 위치하는 정배치 투상도법이며, KS 제도 통칙의 대원칙입니다. 반면, 제1각법은 평면도가 정면도의 아래쪽에 투상되고, 좌측면도가 정면도의 우측에 투상되는 반대 배치의 원리를 가집니다."},{"t":"p","v":"★ 중요 시험 단골 기출 (실선과 파선의 위치에 따른 각법 구분)"},{"t":"p","v":"용접 기호의 기준 구조에서 수평 실선(Reference line)이 식별 점선(Identification line/파선)보다 위쪽에 기재되면 제3각법 도면에 해당하며, 수평 실선이 식별 점선의 아래쪽에 기재되면 제1각법 도면을 의미합니다. 이는 용접사가 도면의 표제란을 일일이 확인하지 않고도 도면 기호 자체에서 투상도 원리를 즉각 식별할 수 있는 핵심 이정표가 됩니다."},{"t":"h3","v":"1.3 재료 기호 및 도면 관리 기법"},{"t":"p","v":"도면에 표기되는 금속 재료 기호는 원칙적으로 강종 분류, 형상 구분, 강도를 암호화하여 구성합니다. 예를 들어, SF40에서 첫 기호 'S'는 강(Steel)을 뜻하고, 두 번째 'F'는 단조품(Forgings)을 지시하며, 숫자 '40'은 최저 인장강도가 40kg/mm²임을 규명합니다. 구조용 압연강재인 SS275는 탄소구조강이며 뒤의 숫자는 최저 항복강도(275 MPa)를 지시합니다. 도면에는 반드시 윤곽선, 중심마크, 표제란이라는 도면의 3대 필수 양식 요소가 누락 없이 기입되어야 기하학적 관리 효력을 가집니다."},{"t":"h3","v":"1.4 비파괴 시험(NDT) 기호 해독"},{"t":"p","v":"용접 시공 완료 후 용접부 내·외부의 미세 결함을 구조물 손상 없이 찾아내기 위한 비파괴 검사 기호 표기법입니다. 지시선은 기준선과 약 60°의 경사를 가지며, 검사 대상 위치를 정확히 화살표로 가리킵니다."},{"t":"h4","v":"비파괴 시험 종류별 한글 기호 대조 명칭:"},{"t":"li","v":"RT (Radiographic Testing) : 방사선 투과 시험 (내부 기공, 슬래그 혼입 등 부피성 결함 검사에 최적)"},{"t":"li","v":"UT (Ultrasonic Testing) : 초음파 탐상 시험 (내부의 미세 균열 및 미융합 등 선상 결함 검출에 유리)"},{"t":"li","v":"PT (Penetrant Testing) : 침투 탐상 시험 (표면에 열려 있는 균열 및 핀홀 등의 개구 결함 검출)"},{"t":"li","v":"MT (Magnetic Particle Testing) : 자분 탐상 시험 (강자성체 표면 및 직하부 표면 균열 검출에 적합)"},{"t":"li","v":"VT (Visual Testing) : 육안 시험 (외관 비드 치수 오차, 언더컷, 오버랩 등 1차 표면 검사)"},{"t":"li","v":"LT (Leak Testing) : 누설 시험 (용기 결함 부위의 압력 유지 여부 및 가스/액체 유출 검출)"},{"t":"h2","v":"제2부: 대표 엄선 50제 평가 문항"},{"t":"p","v":"NCS 4편 능력단위 및 과정평가형 자격 출제 기준에 준하는 엄선된 50문항입니다. 지필고사 실전 적응력을 극대화할 수 있는 유형별 문항 배치입니다."},{"t":"p","v":"(제1문~제35문: 객관식 4지선다형 / 제36문~제50문: 단답식 주관식)"}],"questions":[{"n":1,"type":"mcq","stem":"용접부 도면 해독 시 용접기호의 기본 구성 요소 중 수평으로 그어진 직선으로 실제 용접 이음 조건 정보들이 기입되는 뼈대 선을 무엇이라 부르는가?","choices":["기준선 (Reference line)","기선 꼬리 (Tail)","지시선 (Arrow)","식별선 (Identification line)"],"answerIndex":1,"answerText":"① 기준선 (Reference line)","explain":"기준선 (Reference line)은 용접기호의 핵심 중추 뼈대로 수평 실선으로 제도하며, 모든 용접 기본 치수, 기호 정보가 이에 밀착해 기입됩니다."},{"n":2,"type":"mcq","stem":"KS 및 ISO 규격의 표준 용접기호 표시법에서, 화살표가 지시하는 '지시선 쪽 (Arrow side)'에 실제로 용접을 수행하라는 정보는 기준선의 어느 위치에 표현하는가?","choices":["수평 실선의 위쪽","수평 실선의 아래쪽","식별선인 수평 파선의 밀착 하단","수평 실선에 밀착한 방향"],"answerIndex":4,"answerText":"④ 수평 실선에 밀착한 방향","explain":"KS 및 ISO 규정에서는 수평 기준선에 밀착하여 아래 또는 위에 표현하며, 정보 내용이 '실선(기준선) 방향'에 위치할 때 지시선 방향(화살표 지시 쪽) 용접을 통칭합니다."},{"n":3,"type":"mcq","stem":"도면 기호 해석 시, 수평 실선인 기준선과 수평 파선인 식별선이 결합된 기호가 주어졌다. 수평 실선이 수평 파선의 아래쪽에 배치되어 있을 때, 이 도면은 어떠한 정투상법을 적용하여 작성된 도면인가?","choices":["제1각법 도면","제3각법 도면","부등각 투상도","등각 투상도"],"answerIndex":1,"answerText":"① 제1각법 도면","explain":"용접기호에서 수평 실선(기준선)이 수평 파선(점선/식별선)보다 아래쪽에 배치되어 지시되는 표기는 제1각법 정투상도 설계 규칙에 속합니다. 반대로 실선이 파선 위에 있으면 제3각법 도면입니다."},{"n":4,"type":"mcq","stem":"용접 기본기호 중 양쪽에 홈 가공을 전혀 하지 않은 채 두 모재를 수평 밀착하여 맞닿게 결합한 'I형(평행) 맞대기 용접'을 나타내는 KS 규격의 표준 기호는?","choices":["V","||","▽","Y"],"answerIndex":2,"answerText":"② ||","explain":"홈 가공을 하지 않고 모재 단면을 그대로 맞대기 접합하는 평행 이음 용접의 KS 제도 표준 기본기호는 수평선에 두 줄의 평행 수직 실선을 긋는 '||'입니다."},{"n":5,"type":"mcq","stem":"용접부 표면의 비드 형상을 가공하는 보조기호 중 기계가공 기호인 'M'이 나타내는 가공 방법은 무엇인가?","choices":["그라인딩 가공","치핑 가공","해머링 가공","머시닝(기계) 가공"],"answerIndex":4,"answerText":"④ 머시닝(기계) 가공","explain":"알파벳 'M'은 머시닝(Machining), 즉 공작기계나 밀링 및 깎아내기 공정을 동원하여 비드 표면을 고정밀 기계 가공 및 평탄화 시공하라는 지시입니다."},{"n":6,"type":"mcq","stem":"용접부 표면 가공방법 보조기호 중 가공이 필수적임을 요구하지만 작업 환경과 공구 조건을 고려하여 가공 수단을 특정한 가공법으로 국한하지 않고 작업자 재량에 맡기는 기호는?","choices":["C","G","M","U"],"answerIndex":4,"answerText":"④ U","explain":"Unspecified를 지시하는 알파벳 대문자 'U'는 표면 마감 가공 처리는 필요하지만 작업 현장 상태를 유연하게 배려해 가공 수단 자체를 미정으로 열어두는 기호입니다."},{"n":7,"type":"mcq","stem":"용접 기호의 꼬리(Tail) 부분에 표시하며, 공장이 아닌 제품의 최종 설치 현장으로 조립 시편을 이동한 후에 기교 용접을 수행하라는 현장용접 보조기호의 도시법은?","choices":["지시선과 수평 기준선의 교점에 깃발(Flag)을 그린다.","지시선과 수평 기준선의 교점에 원(Circle)을 그린다.","기준선의 꼬리에 'FIELD' 문자 기호를 명기한다.","수평 기준선 가운데 부분에 검은색 점을 찍는다."],"answerIndex":1,"answerText":"① 지시선과 수평 기준선의 교점에 깃발(Flag)을 그린다.","explain":"현장용접 보조
