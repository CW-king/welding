 모재를 가장 우선 순위로 소모하여 장기 보관으로 인한 표면 산화와 습기 접촉을 억제합니다."},{"t":"li","v":"적치 간격 관리: 모재의 원활한 환기와 내부 습기 정체를 억제하기 위해 받침판 및 기반목을 활용하여 바닥으로부터 최소 10cm 이상 이격 적재합니다."},{"t":"li","v":"화학적 표면 청소: 모재 용접 홈 주위의 밀스케일(산화막), 수분, 기름때는 용융 금속 내부로 유입되어 기공(Blowhole) 및 슬래그 혼입 결함을 직결시키므로, 용접 착수 전 평형 줄이나 수동 그라인딩, 와이어 브러시로 완전 제거해야 합니다."},{"t":"h3","v":"2.2 이음부 홈 형상별 적용 규격"},{"t":"p","v":"맞대기 홈 가공 시 강도 향상과 함께 경제성(용가재 투입량 최소화)을 상충 보완하기 위해 적절한 그루브 형상을 선정합니다. TIG 용접은 SMAW에 비해 입열 제어가 정밀하므로 홈 가공의 미세 오차도 철저히 모니터링해야 합니다."},{"t":"li","v":"I형 홈: 판 두께 6mm 이하의 박판 구조물에 주로 적용되며, 개선 홈 가공비가 전혀 들지 않아 극도로 경제적입니다. 루트 간격은 0 ~ 1.6mm로 유지하는 것이 좋습니다."},{"t":"li","v":"V형 홈: 판 두께 6mm 초과 ~ 20mm 이하의 중판 구조물에 보편적으로 사용되며, 표준 홈 각도는 54° ~ 70° (일반적으로 60° 가작 많이 채택) 수준으로 가공합니다. 루트 면 두께는 1.5 ~ 2.5mm 범위가 정석입니다."},{"t":"li","v":"X형 홈: 판 두께 15mm ~ 40mm 급의 중·후판 구조물에 쓰이며, 동일 두께의 V형 대비 용착 금속의 소요량을 절반 가까이 경감시켜 수축 변형을 방지할 수 있습니다. 단, 이면 가우징이나 백치핑 연삭 작업이 후속 수반되어야 합니다."},{"t":"li","v":"U형 및 H형 홈: 모재가 극도로 두꺼운 16 ~ 50mm 범위 후판에 쓰이며, V형보다 홈의 상부 폭이 대단히 좁아도 루트 간격 '0'에서 완전 용입이 용이하고 용착량을 드라마틱하게 축소합니다. 가공 장비를 이용한 홈 가공 비용이 높은 단점이 있습니다."},{"t":"h3","v":"3. 용가재(Filler Metal) 및 전극봉·소모품 관리"},{"t":"p","v":"가스텅스텐아크용접은 비소모성 전극봉인 텅스텐봉을 전극으로 사용하여 아크를 유지하고 외부에서 용가재(Filler metal/용접봉)를 공급해 접합을 진행하는 대표적인 비소모식 아크용접 프로세스입니다. 따라서 이들 소모품의 등급과 물리 가공 상태는 아크의 안정성을 결정짓는 절대적 요소입니다."},{"t":"h3","v":"3.1 연강 및 스테인리스강용 용가재 규격 해독"},{"t":"p","v":"용가재의 규격은 모재의 기계적, 화학적 성능에 맞도록 화학 조성이 매칭되어야 합니다."},{"t":"li","v":"탄소강용 TIG 와이어: 대표 규격인 YGT50 (Y: 용접봉, G: 가스실드, T: 가스텅스텐아크용, 50: 최소 인장강도 50kgf/mm² 보증)은 연강 및 490N/mm²급 고장력강 맞대기 초층 및 전도성 용접에 사용되며, 습기 부식을 방지하기 위해 구리 도금 처리가 되어 공급됩니다."},{"t":"li","v":"스테인리스강용 와이어: 모재인 STS 304 용접 시에는 저탄소 오스테나이트 합금 성분을 매칭하기 위해 Y308 또는 탄소량을 0.03% 이하로 극도로 억제한 Y308L 용접봉을 선정합니다. 이종 자재(연강-스테인리스강) 용접부의 경우에는 탄소 확산과 크랙을 방지하기 위해 크롬(Cr)과 니켈(Ni) 함량이 비약적으로 높은 Y309(22%Cr-12%Ni) 와이어를 사용해야 합니다."},{"t":"h3","v":"3.2 텅스텐 전극봉 종류 및 색상 표식 표준"},{"t":"p","v":"텅스텐(W, 용융점 3,387℃, 비중 19.3)은 상온에서 물과 반응하지 않고 고온 강도가 우수하여 아크 전극으로 최적이지만, 전자방출 능력을 향상시키고 전극 소모를 경감하기 위해 1% ~ 2% 비율의 산화 원소들을 첨가해 사용합니다. 기호 및 표준 표식 색상은 다음과 같습니다."},{"t":"li","v":"순텅스텐 전극봉 (기호: YWP, 표식 색상: 녹색): 저렴하며 교류(AC) 전원 사용 시 아크 안정성이 우수하여 알루미늄 용접에만 주로 독점 적용됩니다."},{"t":"li","v":"2% 토륨 텅스텐 전극봉 (기호: YWTh-2, 표식 색상: 적색): 전자 방사 능력이 극히 우수하고 오염 저항성이 훌륭해 직류 정극성(DCEN)에서 탄소강과 스테인리스강의 고전류 용접에 광범위하게 쓰입니다. 다만, 토륨(Th)은 방사성 물질이므로 연마 가공 분진 흡입 방지를 위해 전용 집진기 작동과 방진 마스크 착용이 불가피합니다."},{"t":"li","v":"2% 산화란탄 텅스텐 전극봉 (기호: YWLa-2, 표식 색상: 황록색): 토륨 전극의 방사능 위험을 완벽 배제하기 위해 개발된 친환경 고기능 전극으로 전극 수명이 길고 우수한 아크 복원력을 띱니다."},{"t":"li","v":"2% 산화세륨 텅스텐 전극봉 (기호: YWCe-2, 표식 색상: 회색): 직류(DC) 및 교류(AC)를 가리지 않고 낮은 소전류에서 극히 우수한 초기 아크 스타트 능력을 유지해 초박판 및 복잡 미세 정밀 접합부에 강점을 보입니다."},{"t":"h3","v":"3.3 용접 전원에 따른 텅스텐 전극봉 끝 연마 공학 기하학"},{"t":"p","v":"텅스텐 전극봉의 연마 가공 상태는 아크의 쏠림(Blow)과 요동을 결정하는 1차 인자입니다."},{"t":"li","v":"직류 정극성 연마법: 모재에 열집중이 일어나는 DCEN(모재+, 전극-)을 사용할 때는 고전류가 뾰족한 끝단으로 일정하게 집중될 수 있도록 연마 각도를 30° ~ 50° 수준의 예리한 원추형(Sharp Cone)으로 기하 가공합니다. 끝을 가공할 때는 휠 그라인더를 전극봉의 '길이 방향'으로 마찰해야 합니다. 횡방향 가공 시 아크 흔들림이 유발됩니다."},{"t":"li","v":"교류 및 역극성 연마법: 전극봉 자체에 엄청난 열이 분산되는 교류(AC, 알루미늄용) 및 직류 역극성(DCEP)을 사용할 때는 전극봉 끝이 아크열에 의해 즉시 구형(Round/Ball) 변태되므로, 가공 단계에서 끝부분을 둥글게 원형 마감(Ball Tip)하여 결정립의 소손 비산을 사전에 방지합니다."},{"t":"li","v":"노즐 규격 매칭: 보호가스를 균일 기류로 유도하는 세라믹 노즐은 번호에 따라 안지름 크기가 설계되어 있습니다 (#5: 8.0mm, #6: 10.0mm, #7: 11.0mm). 전류가 커지고 유량이 많을수록 번호가 큰 노즐을 체결해야 난류 유입을 차단할 수 있습니다."},{"t":"h3","v":"4. 보호가스(Shielding Gas)의 물리 특성 및 설치"},{"t":"p","v":"보호가스는 아크 기둥과 고온의 용융풀을 공기 중의 해로운 산소(O₂), 질소(N₂), 수소(H₂) 등으로부터 완벽하게 격리, 밀폐하여 아크의 전기 거동을 돕고 산화 결함을 근원적으로 방제하는 용접의 생명선입니다."},{"t":"h3","v":"4.1 아르곤(Ar)과 헬륨(He) 가스의 장단점 완전 분석"},{"t":"p","v":"TIG 보호가스의 양대 기틀이 되는 아르곤(Ar)과 헬륨(He)의 물리 야금적 성능 대조는 지필과 수험에서 빈번하게 유도되는 중요 테마입니다."},{"t":"li","v":"아르곤 가스 (비중 1.105): 공기(비중 1.0)보다 무거워 하부 체류 성능이 탁월하므로 아래보기 용접 자세에서 아주 적은 유량(대략 5 ~ 15 L/min) 조건으로도 빈틈없는 차폐를 보장합니다. 이온화 에너지가 낮아 초기 아크 발생이 용이하며 가격이 비교적 저렴한 표준 보호가스입니다. 단, 산소 대체 기체이므로 밀폐 배관 내부 장시간 용접 시 산소 농도를 필히 감시하여 최소 18% 이상을 항상 확인해야 질식사를 방지합니다."},{"t":"li","v":"헬륨 가스 (비중 0.178): 현존 기체 중 수소 다음으로 가볍고 공기의 약 1/7배 무게에 불과해 청정 능력이 약하고 상승 산산되어 보호 유지가 불량합니다. 동일 실드막 구축을 위해 아르곤 대비 1.5 ~ 3배의 소모량이 필요하지만, 전리 아크 전압이 아르곤의 2~3배로 대단히 높아 극도의 고입열(Heat Input)과 넓고 깊은 용입을 확보할 수 있습니다. 동합금이나 열전도율이 비정상적으로 높은 알루미늄 후판 자동용접에 주로 쓰입니다."},{"t":"h3","v":"4.2 가스 퍼징(Purging) 요령"},{"t":"li","v":"퍼징(Purging)의 목적: 파이프나 용기 맞대기 용접 시 고열에 노출된 이면(뒷면) 용융지가 외부 공기와 접촉하여 벌집 모양으로 거칠게 그을리고 산화(Oxidation) 및 질화되는 현상을 원천 방지하기 위해 이면부에 고순도 아르곤 보호가스를 인입하여 내부 공기를 축출하는 품질 시공 공법입니다."},{"t":"li","v":"알루미늄/종이 테이프 퍼징 보조: 이면 용접 1층(초층 백비드) 통과 시 외부 공기가 그루브 틈으로 침입해 퍼지 효과가 반감되는 것을 막기 위해, 용접선 앞면에 가열 시 유해 기체 발생량이 극소화된 종이 테이프나 알루미늄 접착 테이프를 붙여 가스를 가둔 후 토치 운봉을 따라 조금씩 떼어내며 전진 용접합니다."},{"t":"table","rows":[["★ 고압 가스 용기 보관 대원칙 및 검사 압력 • 고압 가스 실린더는 외부 충격 및 부식 예방을 위해 반드시 고온 다습한 곳을 피하고 직사광선이 닿지 않는 서늘한 장소(40℃ 이하)에 기립 고정하고 이중 체인으로 결속해야 합니다. • 용기의 충전 표준 기압은 상온 35℃ 기준 150기압이며, 용기 안전 정기검사 시의 수압 내력 시험 압력(TP)은 24.5MPa (250 kg/cm2) 규격에 부합해야 승인됩니다. • 용기 도색 표준(산업 표준): 산소(초록색), 아르곤(회색), 탄산가스(청색), 아세틸렌(황색), 수소(주황색), 질소(회색), 암모니아(백색) 등으로 원치 않는 가스 유입 오작동 결속을 철저히 차단합니다."]]},{"t":"h2","v":"제2부: '재료 준비' 대표 엄선 50제 실전 평가"},{"t":"p","v":"과정평가형 용접산업기사 외부평가 지필 시험의 최근 10개년 기출 경향과 NCS 출제 가이드를 완벽하게 반영하여 설계한 대표 평가 문항 50제를 출제합니다. 본 모의고사는 객관식 4지택일형 35문항, 그리고 명확한 연산 및 단답식 서술형 주관식 15문항으로 구성되어 단원 이해도를 종합 판정합니다."}],"questions":[{"n":1,"type":"mcq","stem":"탄소강의 성질을 분류하는 철강 재료 기준에서, 공학적으로 ‘순철(Pure Iron)’을 정의하는 탄소 함유량(C)의 기준으로 올바른 것은 무엇입니까?","choices":["탄소 함유량이 0.01% 이하","탄소 함유량이 0.15% ~ 0.25% 범위","탄소 함유량이 2.0% 이상","탄소 함유량이 4.3% 고정"],"answerIndex":1,"answerText":"① 탄소 함유량이 0.01% 이하","explain":"순철은 불순물을 극도로 억제한 철로, 탄소 함유량은 보통 0.01% 이하(또는 0.02% 이하)를 나타내는 기계적 연질 소재입니다."},{"n":2,"type":"mcq","stem":"가스텅스텐아크용접(GTAW)으로 중탄소강(C 0.3% ~ 0.5%) 모재를 접합할 때 예열을 생략하고 시공할 경우 가장 발생하기 쉬운 중대한 용접 결함은 무엇입니까?","choices":["저온 경화에 의한 냉간 균열(Cold Crack)","용접 입열 부족으로 인한 비드 표면 언더컷(Undercut)","아르곤 보호가스 유량 부족에 따른 피트(Pit)","전극봉 오염에 기인한 슬래그 혼입"],"answerIndex":1,"answerText":"① 저온 경화에 의한 냉간 균열(Cold Crack)","explain":"탄소량이 0.3%를 초과하면 용접부 급랭 시 마르텐사이트 조직으로 변태되어 자경(Self-Hardening) 균열 민감도가 상승해 수소 기인형 냉간 균열이 유발됩니다."},{"n":3,"type":"mcq","stem":"스테인리스강 중 비자성(자성이 없음)을 띠고 있으며, 담금질 열처리에 의해서 경화되지 않고 TIG 용접에서 가장 우수한 용접성을 보이는 대표적인 조직 계열은 무엇입니까?","choices":["마텐자이트계","페라이트계","오스테나이트계","리드강 조직계"],"answerIndex":3,"answerText":"③ 오스테나이트계","explain":"오스테나이트계 스테인리스강(18Cr-8Ni 구조)은 비자성체이며, 담금질로 경화되지 않고 인성이 우수해 용접성이 우수합니다."},{"n":4,"type":"mcq","stem":"알루미늄 합금 계열 중 규소(Si)를 약 5%가량 다량 배합하여 응고 수축 시 발생하는 고온 균열(Hot Crack) 저항성을 극대화시켜 TIG 용접봉(용가재)으로 단골 채택되는 표준 기호 명칭은 무엇입니까?","choices":["A1100","A4043","A5356","A6061"],"answerIndex":2,"answerText":"② A4043","explain":"Al-Si 합금인 A4043은 고온 균열 저항성이 커서 균열이 발생하기 쉬운 알루미늄 주물 및 열처리 합금의 용가재로 단골 적용됩니다."},{"n":5,"type":"mcq","stem":"알루미늄 가스텅스텐아크용접 시 반드시 수반되어야 하는 ‘청정 작용(Cleaning Action)’을 극대화하기 위해 선정해야 하는 가장 이상적인 용접 전원 및 극성은 무엇입니까?","choices":["직류 정극성(DCEN) 전원의 단독 사용","직류 역극성(DCEP) 또는 교류(AC)","수하특성을 갖는 교류 정극성 전원","고주파를 중첩한 직류 펄스 전원"],"answerIndex":2,"answerText":"② 직류 역극성(DCEP) 또는 교류(AC)","explain":"양이온(Ar+)이 모재를 가격하여 표면의 단단한 산화피막(Al₂O₃)을 기계적으로 소거하는 청정 작용은 전극이 (+)가 되는 DCEP나 AC 주기에서만 발생합니다."},{"n":6,"type":"mcq","stem":"가스텅스텐아크용접에 사용되는 텅스텐 전극봉 중 ‘기호: YWTh-2, 표식 색상: 적색’에 해당하는 고성능 방사성 첨가 전극봉의 정확한 명칭은 무엇입니까?","choices":["순텅스텐 전극봉","1% 산화란탄 텅스텐 전극봉","2% 토륨 텅스텐 전극봉","2% 산화세륨 텅스텐 전극봉"],"answerIndex":3,"answerText":"③ 2% 토륨 텅스텐 전극봉","explain":"기호 YWTh-2 및 적색 표식은 2% 토륨 텅스텐 전극봉을 뜻하며, 높은 아크 안정성을 보입니다."},{"n":7,"type":"mcq","stem":"2% 토륨 텅스텐 전극봉(적색)을 그라인더로 가공할 때 발생하는 물리적 건강 위험 요인과 이를 예방하기 위한 안전 수칙으로 가장 적절하지 않은 것은 무엇입니까?","choices":["토륨은 천연 방사성 금속이므로 연마 시 분진과 침투가 위험합니다.","연마 시에는 집진장치 설비가 가동되는 지정 구역에서 수행해야 합니다.","작업자는 분진 유입을 막기 위해 1급 방진 마스크를 착용해야 합니다.","작업 효율을 높이기 위해 연마석 그라인더 연마 휠 표면에 수시로 그리스유를 도포해야 합니다."],"answerIndex":4,"answerText":"④ 작업 효율을 높이기 위해 연마석 그라인더 연마 휠 표면에 수시로 그리스유를 도포해야 합니다.","explain":"그라인더에 가연성 오일이나 기름을 칠하는 것은 화재 및 폭발을 유발하는 중대 오조작 금지 사항입니다."},{"n":8,"type":"mcq","stem":"가스텅스텐아크용접에서 직류 정극성(DCEN) 전원을 사용할 때, 텅스텐 전극봉의 가공 기하학 각도로 가장 권장되는 표준 범위는 몇 도 입니까?","choices":["5° ~ 15°의 극초예각 첨단 가공","30° ~ 50°의 예리한 원추형 가공","90° 직각으로 횡단 연마한 평면 가공","120° 이상 무딘 각도의 구형 가공"],"answerIndex":2,"answerText":"② 30° ~ 50°의 예리한 원추형 가공","explain":"직류 정극성(모재+, 전극-) 시 아크 집중 및 안전을 위해 텅스텐봉 끝은 30~50도의 예리한 원추 모양으로 길이 연마해야 합니다."},{"n":9,"type":"mcq","stem":"TIG 용접 텅스텐 전극봉 연마 시 연마석 휠의 조작 방향으로 아크 쏠림(Arc Blow)이나 요동을 완전 배제할 수 있는 유일한 정상 공공 가공 방향은 무엇입니까?","choices":["전극봉 길이 방향 (종선 가공)","전극봉 원주 회전 방향 (횡선 가공)","60° 사선 격자무늬 가공","전극 끝을 연마석 측면에 대고 편심 압착 회전"],"answerIndex":1,"answerText":"① 전극봉 길이 방향 (종선 가공)","explain":"가공 방향이 길이 방향이어야 아크가 흔들리지 않고 일직선 정상 집중됩니다. 횡방향 가공 시 아크가 심하게 흔들립니다."},{"n":10,"type":"mcq","stem":"용접용 불활성 보호 가스 중 공기보다 가벼운 비중(0.178)을 가지며, 아크 전압을 비약적으로 증가시켜 고입열 용입을 유도하는 가스는 무엇입니까?","choices":["아르곤(Ar) 가스","이산화탄소(CO₂) 가스","헬륨(He) 가스","질소(N₂) 가스"],"answerIndex":3,"answerText":"③ 헬륨(He) 가스","explain":"헬륨은 아르곤보다 비중이 낮아 위보기나 자동용접에 좋고, 고전압 고입열 깊은 용입 형성에 기여합니다."},{"n":11,"type":"mcq","stem":"아르곤(Ar) 가스를 보호가스로 사용하여 밀폐된 지하 배관 내부에서 가스텅스텐아크용접을 시행할 때 빈번히 유발되는 재해 요인과 이에 대처하기 위한 필수 산소(O₂) 적정 농도 수치는 얼마입니까?","choices":["질식사 위험, 적정 산소 농도 18% 이상 항시 확보","아크 분출 역화 위험, 산소 농도 12% 이하 차단","유해 흄 가스 중독 위험, 산소 농도 30% 이상 과충전","고압 용기 폭발 위험, 산소 농도 50% 고정"],"answerIndex":1,"answerText":"① 질식사 위험, 적정 산소 농도 18% 이상 항시 확보","explain":"아르곤은 공기보다 비거동 무겁기 때문에 밀폐 구역 바닥에 정체하여 질식을 일으키므로, 작업 전 산소농도가 최소 18% 이상인지 계측해야 합니다."},{"n":12,"type":"mcq","stem":"가스텅스텐아크용접에서 이면 용융 부위를 대기 공기로부터 정교하게 차단하여 거친 산화 및 질화 비드 형성을 제어하는 시공 공법 명칭은 무엇입니까?","choices":["일원화 제어 (Synergic Control)","예민화 방지처리 (Desensitization)","백가우징 (Back Gouging)","가스 퍼징 (Gas Purging)"],"answerIndex":4,"answerText":"④ 가스 퍼징 (Gas Purging)","explain":"맞대기 이면비드(백비드) 산화 방지를 위해 불활성 가스를 밀폐 공간 내부에 주입하는 공법은 '퍼징(Purging)'입니다."},{"n":13,"type":"mcq","stem":"스테인리스강(STS 304) 파이프 맞대기 TIG 용접의 초층 이면비드 형성 시, 그루브 앞면에 알루미늄 접착 테이프나 종이 테이프를 전면 부착하는 주된 목적은 무엇입니까?","choices":["용접 열영향부(HAZ)의 냉각 속도를 가속하기 위해","용접 아크에서 방출되는 유해 자외선 광선을 차단하기 위해","이면 퍼징가스를 용접 그루브 내부에 효과적으로 가두어 가두기 위해","용가재 공급 시 텅스텐봉과의 전기적 접촉 단락을 방지하기 위해"],"answerIndex":3,"answerText":"③ 이면 퍼징가스를 용접 그루브 내부에 효과적으로 가두어 가두기 위해","explain":"테이프로 전면을 밀폐하여 퍼징 가스를 내부에 가둠으로써 가스 소모량을 줄이고 완벽한 산화 방지 분위기를 확보하기 위한 조치입니다."},{"n":14,"type":"mcq","stem":"산업 표준에 따른 고압 가스 용기의 표준 색상 도색 매칭이 바르게 연결된 것은 무엇입니까?","choices":["산소 - 회색, 아르곤 - 청색","아세틸렌 - 황색, 아르곤 - 회색","탄산가스 - 녹색, 수소 - 담청색","산소 - 황색, 질소 - 주황색"],"answerIndex":2,"answerText":"② 아세틸렌 - 황색, 아르곤 - 회색","explain":"안전 표준 규격상 아세틸렌은 황색, 아르곤은 회색, 산소는 녹색, 탄산가스는 청색, 수소는 주황색 용기를 사용해야 합니다."},{"n":15,"type":"mcq","stem":"고압 가스 저장소의 보관 및 안전 관리 기준으로 올바르지 않은 것은 무엇입니까?","choices":["가스 용기 보관소 온도는 항상 40℃ 이하로 서늘하게 관리해야 합니다.","고압 가스 저장 구역 내에서 점화 라이터 불꽃 등 일체 화기 사용을 금지합니다.","가스 용기는 전도 방지를 위해 반드시 이중 체인을 활용해 눕혀서 보관해야 합니다.","밸브 가동 시 급격한 압력 가압 방지를 위해 정면을 피해 서서히 조작해야 합니다."],"answerIndex":3,"answerText":"③ 가스 용기는 전도 방지를 위해 반드시 이중 체인을 활용해 눕혀서 보관해야 합니다.","explain":"가스 용기는 절대로 눕혀서 보관하거나 방치해선 안 되며, 전용 거치대에 '세워서(기립)' 체인으로 견고하게 고정 보관해야 합니다."},{"n":16,"type":"mcq","stem":"TIG 세라믹 노즐 번호 중 ‘#6’ 규격 노즐의 표준 내부 안지름 크기는 몇 mm 입니까?","choices":["6.0mm","8.0mm","10.0mm","12.0mm"],"answerIndex":3,"answerText":"③ 10.0mm","explain":"#5는 8.0mm, #6은 10.0mm, #7은 11.0mm의 내경을 지닌 표준 규격 노즐입니다."},{"n":17,"type":"mcq","stem":"TIG 텅스텐 전극봉을 교류(AC) 알루미늄 용접용으로 조립하여 사용할 때, 전극 소손을 방지하기 위해 가공하는 전극봉 끝단 기하 형태로 가장 알맞은 것은 무엇입니까?","choices":["30° 각도의 뾰족한 끝 원추 가공","끝단 부분을 둥글게 원형 마감(Ball Tip)","60° 횡방향 사선 연마 가공","끝단을 니퍼로 비정형 파단 가공"],"answerIndex":2,"answerText":"② 끝단 부분을 둥글게 원형 마감(Ball Tip)","explain":"교류(AC) 시에는 전극에 인가되는 과도한 열량으로 끝단이 바로 녹아내리므로, 둥글게 원형 마감(Ball tip) 처리하여 전극 비산을 방지해야 합니다."},{"n":18,"type":"mcq","stem":"가스텅스텐아크용접의 용가재 표기 규격인 ‘YGT50-2.4-1000’에서 수치 ‘50’이 가리키는 정확한 기계적 설계 의미는 무엇입니까?","choices":["용접봉의 최소 화학 탄소 함유량 0.50%","용착 금속의 최소 인장강도 50 kgf/mm² 보증","용접봉 허용사용률 50%","용접 전류 최적 세팅 범위 50A ~ 150A"],"answerIndex":2,"answerText":"② 용착 금속의 최소 인장강도 50 kgf/mm² 보증","explain":"수치 50은 해당 와이어로 용접 시 용착금속이 보증해야 하는 최소 인장강도 기준(50 kgf/mm² 또는 490 N/mm²급)을 지칭합니다."},{"n":19,"type":"mcq","stem":"TIG 이종 금속(연강 판과 오스테나이트 스테인리스강 판) 용접 시, 결합 계면의 희석 균열을 방지하기 위해 선정해야 하는 최적의 스테인리스 합금 용가재 규격은 무엇입니까?","choices":["Y308","Y308L","Y309","Y410"],"answerIndex":3,"answerText":"③ Y309","explain":"이종금속 용접부의 연성 결핍 및 수축 크랙 제어를 위해서는 합금 원소(Cr, Ni) 함량이 월등히 높은 Y309 용접봉을 채택해야 안전합니다."},{"n":20,"type":"mcq","stem":"TIG 용접의 가스 제어 회로에서 아크가 정지된 후 텅스텐 전극봉의 산화 및 이물질 부착을 방지하고 냉각하기 위해 수초 간 가스를 계속 방출시키는 가스 지연 기능의 명칭은 무엇입니까?","choices":["가스 체크 (Gas Check)","일원화 퍼지","선류 가스 (Pre-flow)","후류 가스 (After/Post-flow)"],"answerIndex":4,"answerText":"④ 후류 가스 (After/Post-flow)","explain":"아크 소멸 후 고온의 텅스텐과 용융지를 보호하기 위해 가스를 일정 시간(보통 5~25초) 계속 흘려주는 것은 '후류 가스(After-flow)'입니다."},{"n":21,"type":"mcq","stem":"아르곤(Ar) 가스가 함유된 액화 실린더 가스를 기화 배관을 통해 인입 조작할 때, 고압가스 기화에 따른 팽창 배율은 부피 기준 약 몇 배에 달합니까?","choices":["1.5배","100배","500배","850배"],"answerIndex":4,"answerText":"④ 850배","explain":"액화 아르곤이 상온 기체로 기화 팽창할 때의 체적 팽창 배율은 약 850배에 이릅니다."},{"n":22,"type":"mcq","stem":"모재 표면에 생성된 얇은 부식막이나 레이저/가스절단 후 개선 부위에 부착된 단단한 산화피막(밀스케일)을 TIG 용접 전에 연삭 소거하는 데 최적화된 수동 동력 회전식 기계 공구의 명칭은 무엇입니까?","choices":["수동 핸드 그라인더","동력 전단기 (Shearing Machine)","유압식 교정 프레스","탁상 드릴머신"],"answerIndex":1,"answerText":"① 수동 핸드 그라인더","explain":"시험편 개선부 다듬질 및 슬래그·산화막 완벽 제어를 위한 최적의 전동 회전 공구는 '핸드 그라인더'입니다."},{"n":23,"type":"mcq","stem":"텅스텐 전극봉 중 란탄(Lanthanum) 성분을 약 1% ~ 2% 함유한 ‘YWLa-2’ 전극봉의 표준 식별 색상 매칭으로 올바른 것은 무엇입니까?","choices":["황록색","적색","회색","흑색"],"answerIndex":1,"answerText":"① 황록색","explain":"1% 산화란탄(YWLa-1)은 흑색, 2% 산화란탄(YWLa-2)은 황록색입니다."},{"n":24,"type":"mcq","stem":"모재의 두께가 약 9.0mm 수준인 연강 판재 2장을 1방향 맞대기 용접으로 완전한 루트 비드 용입을 유도하고자 홈 가공(베벨 홈)을 할 때, V형 홈 설계의 최적 베벨 각도로 가장 알맞은 범위는 몇 도 입니까?","choices":["15° ~ 20°","30° ~ 35°","50° ~ 60°","90° 고정"],"answerIndex":2,"answerText":"② 30° ~ 35°","explain":"V형 맞대기 시 홈 각도 60°를 작도하려면 한쪽 모재의 절단각(베벨각)은 그 절반 수준인 30° ~ 35° 범위여야 정상 개선 홈이 형성됩니다."},{"n":25,"type":"mcq","stem":"텅스텐 전극봉의 기하 연마 시 ‘편심 가공(끝부분이 중심에서 빗겨 연마됨)’이 발생했을 때 나타나는 아크의 비정상 거동 장애 요인으로 옳은 것은 무엇입니까?","choices":["용융 속도가 비정상적으로 급상승하는 과열 현상","가스 토치 내부에 급격한 역화 현상 발생","아크가 급격히 단락되어 소멸하는 현상","아크가 한 방향으로 쏠리는 아크 쏠림 발생"],"answerIndex":4,"answerText":"④ 아크가 한 방향으로 쏠리는 아크 쏠림 발생","explain":"편심 가공된 전극봉은 아크가 중앙에서 나오지 못하고 한쪽으로 편향 편심되는 '아크 쏠림'을 직접 유발합니다."},{"n":26,"type":"mcq","stem":"고압 가스 용기에 직결 부착하여 고압 충전 가스 압력을 사용하기 편리한 낮은 안정 압력(2차 은 배열은 5183 > 5356 > 4043 > 1100 순서이며, 연성은 그 역순입니다."},{"n":32,"type":"mcq","stem":"텅스텐 전극봉의 종류 중 ‘기호: YWCe-2, 표식 색상: 회색’을 띠고 있으며, 소전류 영역에서 초기 아크 개시율이 독보적으로 우수한 전극봉의 첨가 성분은 무엇입니까?","choices":["산화티탄 1%","산화지르코늄 1.5%","산화토륨 2%","산화세륨 2%"],"answerIndex":4,"answerText":"④ 산화세륨 2%","explain":"기호 YWCe-2는 회색을 띠는 2% 산화세륨 텅스텐 전극봉으로, 소전류 저전압 정밀 TIG 용접에서 광범위하게 사용됩니다."},{"n":33,"type":"mcq","stem":"강재 도면 해독 및 자재 표기에서 ‘SM400B’ 규격이 의미하는 정확한 재질 특성 명칭은 무엇입니까?","choices":["일반 구조용 압연 탄소 강재 (인장강도 400 MPa 보증)","기계 구조용 탄소 강재 (탄소량 0.40% 배합)","용접 구조용 압연 강재 (인장강도 400 MPa, B등급)","선박 구조용 극저탄소 압연 강재 (인성 무보증)"],"answerIndex":3,"answerText":"③ 용접 구조용 압연 강재 (인장강도 400 MPa, B등급)","explain":"SM은 용접 구조용 압연 강재(Welding Structural Rolled Steel)를 뜻하며, 400은 최저 인장강도 400 MPa을, B는 화학 성분 및 충격 인성 보증 등급을 의미합니다."},{"n":34,"type":"mcq","stem":"아르곤 고압 가스 용기 내에 표준 상온 35℃ 기준 최고 충전 압력(FP) 수치는 대략 몇 MPa 입니까?","choices":["1.5 MPa","15 MPa","25 MPa","150 MPa"],"answerIndex":2,"answerText":"② 15 MPa","explain":"용착 가스 충전 규격상 상온 표준 충전 기압은 '15 MPa (대략 150기압)' 수준으로 가압 충전 공급됩니다."},{"n":35,"type":"mcq","stem":"가스텅스텐아크용접 시 백비드 산화 제어 목적으로 가스 퍼징을 가동할 때, 가스 호스의 계통부 연결 연결부와 조정기 누설을 원천 방지하기 위해 가동해야 하는 가장 안전하고 간단한 검사 물질은 무엇입니까?","choices":["비눗물 기포 생성 검사","등유 오일 소량 도포","물 세척 에어 분사","인화성 라이터 가스 불꽃 타격"],"answerIndex":1,"answerText":"① 비눗물 기포 생성 검사","explain":"고압가스 안전 수칙상 계통 배관 누설 여부는 오직 무해한 기포 성질의 '비눗물 검사'를 활용해 거품 방출 유무로 확인해야 안전합니다.\n주관식 및 계산형 15문항 정답 및 해설"},{"n":36,"type":"short","stem":"WPS 상에서 모재 ‘STS 304 (t6.0)’ 판재를 맞대기 용접하고자 조립할 때, 용가재로 선정해야 하는 가장 알맞은 ‘스테인리스강용 와이어 종류 기호’는 무엇인지 기술하시오.","choices":[],"answerIndex":null,"answerText":"Y308 또는 Y308L","explain":"WPS 모재 관련 사항에서 STS304(오스테나이트계) 용접 시 용가재로는 동종 합금인 Y308 또는 극저탄소강용 Y308L 와이어를 매칭 선정해야 공학적으로 유효합니다."},{"n":37,"type":"short","stem":"가스텅스텐아크용접(GTAW)용 텅스텐 전극봉 중 순수 텅스텐 성분만 함유하여 알루미늄 용접 교류(AC) 전원 조건에 최적화된 전극봉의 ‘끝단 식별 표준 색상’은 무엇인지 쓰시오.","choices":[],"answerIndex":null,"answerText":"녹색 (Green)","explain":"기호 YWP에 해당하는 순텅스텐 전극봉의 표준 식별 표식 색상은 '녹색'이며, 교류 전원 하에서 전극봉 끝이 둥글게 원형 마감(Ball tip) 처리되어 안정된 아크를 인가합니다."},{"n":38,"type":"short","stem":"2% 토륨 텅스텐 전극봉(적색) 연마 시, 방사성 분진에 기인한 호흡기 질환 및 흡입 장해를 원천 예방하기 위해 작업장 연마기 설비에 반드시 가동 연동해야 하는 ‘기계 장치’의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"국소 배기 장치 및 집진 장치","explain":"2% 토륨 텅스텐 전극봉은 미량의 천연 방사성 금속원소인 토륨(Th) 및 감열 가스인 라돈을 함유하고 있어, 연마 가공 시 비산 분진 흡입을 완전 배제하기 위한 국소 집진 장치 가동이 절대 법적 요건입니다."},{"n":39,"type":"short","stem":"고압 가스 충전 용기 정기 검사 및 공학 성능 합격 판정을 통과하기 위해 수압 내력 시험을 할 때, 법적 합격 기준 압력 수치(TP)는 몇 MPa 인지 기술하시오.","choices":[],"answerIndex":null,"answerText":"24.5 MPa (250 kg/cm²)","explain":"고압가스 안전관리 법규 및 정기안전 검사 요건상 고압가스 충전 용기의 수압 시험 압력(TP) 합격치는 '24.5 MPa'에 부합해야 승인됩니다."},{"n":40,"type":"short","stem":"액화 아르곤(Ar) 기체가 실온에서 체적 팽창을 일으켜 기체 아르곤으로 기화될 때 발생하는 부피적 기화 팽창 배율은 약 몇 배에 달하는지 수치로 기술하시오.","choices":[],"answerIndex":null,"answerText":"약 850배","explain":"액화 아르곤(Ar)은 실온 가스로 기화 팽창할 때 약 850배에 이르는 부피 팽창 배율을 나타내므로, 배관 폐쇄 구역 설계 시 팽창 동파를 완전 제어해야 합니다."},{"n":41,"type":"short","stem":"알루미늄 용접 시 표면의 고융점 산화피막(Al₂O₃)을 기계적 양이온(Ar+) 타격을 통해 파괴함으로써 균일한 융합 비드를 유도해내는 TIG 고유의 ‘물리 야금학적 제거 작용’ 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"청정 작용 (Cleaning Action)","explain":"용융점 2015℃에 달하는 알루미늄 산화막을 아크 가동 DCEP/AC 영역에서 고속으로 때려부수는 용해 제거 거동을 '청정 작용'이라고 합니다."},{"n":42,"type":"short","stem":"TIG 용접 토치에 조립하는 소모품 세라믹 노즐 번호 중 ‘#5’ 노즐의 공학적 표준 ‘안지름(내경) 치수’는 몇 mm 인지 수치로 기술하시오.","choices":[],"answerIndex":null,"answerText":"8.0 mm","explain":"TIG 세라믹 보호 노즐 규격은 번호에 따라 안지름이 표준화되어 규정되며, #5 규격의 안지름 크기는 '8.0 mm'입니다."},{"n":43,"type":"short","stem":"TIG 직류 정극성(DCEN) 용접을 수행하기 위해 전극봉 끝단을 예리한 뾰족 원추형으로 길이 연마할 때 권장되는 최적 ‘연마 각도 범위’를 기술하시오.","choices":[],"answerIndex":null,"answerText":"30° ~ 50°","explain":"직류 정극성(DCEN) 하에서 예리한 아크 집중과 전극 열집중 유도를 확보하기 위한 전극봉의 정밀 연마 각도 범위는 '30° ~ 50° 예각'입니다."},{"n":44,"type":"short","stem":"가스텅스텐아크용접용 와이어 규격이 ‘YGT50’일 때, 이 용접봉의 최소 인장강도 보증 수치와 그 ‘공학 단위’까지 명확히 포함하여 완전한 명칭으로 기술하시오.","choices":[],"answerIndex":null,"answerText":"50 kgf/mm² (또는 490 N/mm²급 고장력강 용접봉)","explain":"YGT50에서 수치 '50'은 인장 시험 통과 시 보증해야 하는 용착금속의 '최소 인장강도가 50 kgf/mm²'임을 규정하고 있습니다."},{"n":45,"type":"short","stem":"TIG 용접 중 용접기 전원이 정지된 후 크레이터 함몰이나 전극봉의 대기 산화를 방지하기 위해 가스를 일정 시간 지속 지연 분출시키는 제어 밸브 조작 타이머 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"후류 가스 타이머 (After / Post-flow Timer)","explain":"아크 정지 버튼 터치 후 수초 간 가스 전자기밸브를 계속 방류 제어하여 고온의 용융풀 산화를 차단하는 가용 장치는 '후류 가스(After-flow) 제어 타이머'입니다."},{"n":46,"type":"short","stem":"보호가스로 아르곤(Ar)과 헬륨(He)을 배합한 혼합 가스를 조제하고자 할 때, 용입이 깊고 아크 안정성이 가장 조화롭게 복원되어 널리 채택되는 ‘아르곤과 헬륨의 가장 이상적인 표준 혼합 배율(%)’을 각각 기술하시오.","choices":[],"answerIndex":null,"answerText":"아르곤 75%, 헬륨 25%","explain":"TIG 용접 시 용입 깊이 증가와 최적의 아크 원추 집중성 유도, 기공 소멸을 위해 혼용되는 가장 보편적이고 이상적인 가스 표준 배율은 'Ar 75% - He 25%' 결속입니다."},{"n":47,"type":"short","stem":"고압 가스 저장소 내 가스 용기 안전 관리 기준에서, 보관소의 실내 상한 온도 한계는 몇 ℃ 이하로 엄격하게 통제되어야 하는지 수치로 기술하시오.","choices":[],"answerIndex":null,"answerText":"40℃ 이하","explain":"고압가스 안전 기준에 부합하기 위한 가스 충전 실린더 기립 거치대의 환경 통제 온도는 '40℃ 이하'로 냉각 유지되어야 합니다."},{"n":48,"type":"short","stem":"WPS에서 모재 등급이 ‘SM400C’일 때, 기호 ‘SM’의 정확한 전공 한글 명칭이 무엇인지 기술하시오.","choices":[],"answerIndex":null,"answerText":"용접 구조용 압연 강재","explain":"강재 등급 기호에서 'SM'은 '용접 구조용 압연 강재(Welding Structural Rolled Steel)'의 공식 야금 표준 명칭입니다."},{"n":49,"type":"short","stem":"파이프 용접 시 이면비드(백비드) 산화를 방지하기 위해 알루미늄 테이프로 용접 그루브 외관을 정교하게 밀봉 제어한 후, 아르곤 가스를 인입하여 내부 공기를 축출하는 이면 품질 가공 공법 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"이면 퍼징 (Back Purging / 가스 퍼징)","explain":"용융지의 대기 노출을 완벽 통제하기 위해 파이프 내부로 아르곤 가스를 주입해 내부 유해 공기를 축출 소거하는 가공 공법은 '이면 퍼징(Back Purging)'입니다."},{"n":50,"type":"short","stem":"모재 표면에 정체된 습기(수분)를 사전에 가열하여 증발 소멸시키고 야금학적 용접부 냉각 거동을 완화하여 저온 균열을 예방하는 사전 가열 처리 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"모재 예열 (Preheating 또는 수분 예열 건조 / Dry-out)","explain":"용접 시 고온 가열과 급랭 마르텐사이트 변태 방지, 수소 제어 및 표면 습기 원천 소거를 위해 시공 전 가동하는 열가공 처리는 '모재 예열(Preheating)'입니다."}]},"18":{"unit":18,"title":"가스텅스텐아크용접 장비 설치","code":"LM1601050304","group":"GTAW","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 공학이론"},{"t":"h3","v":"1. 용접기 설치 환경 및 공간 요건 (학습 1)"},{"t":"h4","v":"용접기 설치 장소의 필수 물리적 구비 조건: 가스텅스텐아크용접기(GTAW)는 고주파 교류(ACHF) 및 직류(DC) 전원을 혼용하므로 전기적 안정성과 냉각 공기의 순환, 그리고 정밀 전자 보드의 보호를 위해 엄격한 설치 기준을 준수해야 한다."},{"t":"table","rows":[["항목 구분","NCS 표준 규격 및 관리 한계","공학적 타당성 및 실패 시 피해"],["벽면 이격 거리","최소 30cm 이상 이격 유지","용접기 내부 주변압기, 정류기, 고주파 발생장치의 열 배출 차단 시 온도 경보 작동 및 소손 발생"],["주위 온도 범위","-10℃ ~ 40℃","영하 10도 이하 시 제어 PCB 열 충격 오류 발생 및 수랭 장치 동파 위험, 40도 초과 시 정격 사용률 급감"],["설치 고도 한계","해발 1,000m 이하","고지대 기압 저하에 따른 공기 밀도 감소로 인한 냉각팬 공랭 효율 저하 및 전극 간 절연 강도 약화"],["바닥 바닥면","수평하며 진동이 없는 견고한 콘크리트 바닥","장비의 기계적 쏠림으로 인한 레귤레이터 지침 바늘 오차 방지 및 수랭식 순환 펌프 수명 보존"],["주변 청결 요건","습기, 금속 먼지, 그라인더 미세 분진 격리","고주파 유도 시 금속 가루가 PCB 회로 기판에 침착되어 합선 및 오작동 소손 사고 유발"]]},{"t":"table","rows":[["★ 안전 최우선 통칙: 콘덴서 잔류 전류 소멸 및 압축공기 청소 교류아크용접기나 GTAW 복합용접기 내부를 청소하거나 점검할 때는 반드시 용접기 외부 1차 배전반 차단기를 완전히 내린 후(OFF), 용접기 콘덴서에 남아있는 잔류 전하가 완전히 소멸될 수 있도록 최소 '3분 이상' 대기한 뒤에 커버를 열고 건조한 압축공기를 불어넣어 미세 먼지를 소거해야 한다."]]},{"t":"h3","v":"2. 수공구 및 전력 측정기의 안전 취급"},{"t":"p","v":"장비를 설치하고 회로를 연결할 때는 규격에 맞는 적정 수공구를 활용하여 볼트와 너트의 접촉 저항을 차단해야 한다."},{"t":"h4","v":"수공구 조작 및 황동 피팅 주의사항: 멍키스패너(adjustable wrench)를 사용할 때는 볼트 머리에 턱을 단단히 밀착시키고 조절 노브를 조여 나사가 마모되지 않도록 조작해야 한다. 토치 조립이나 가스 조정기 체결 시 사용되는 황동(동합금) 재질의 너트는 강철에 비해 나사산이 뭉개지기 쉬우므로, 수공구 체결 시 과도한 힘을 가하지 않고 작업자의 '손/팔심의 약 70%' 정도의 적정 토크로만 조여 고정해야 하며 가스 누출은 반드시 비눗물을 분사하여 기포 발생 여부로 최종 진단해야 한다."},{"t":"h4","v":"클램프 미터의 측정 원리 및 1선 측정 법칙: 용접 전류와 전압을 정확히 계측하기 위해 전류·전압 측정기로 클램프 미터(Clamp Meter, 후크 메타)를 사용한다. 클램프 미터는 전선을 끊거나 단자를 분리하지 않고, 흐르는 전류에 의해 발생하는 주변 유도 자기장을 클램프(후크) 루프로 감싸 전자기 유도 현상을 통해 전류를 측정하는 장비이다. 측정 시 반드시 단상 1선의 도선만을 통과시켜 측정해야 하며, 다상 케이블을 일괄적으로 감쌀 경우 전류 벡터의 합이 0이 되어 측정이 불가능해진다."},{"t":"h3","v":"3. 1차측 입력 및 2차측 출력 케이블 표준 규격"},{"t":"p","v":"용접기의 정격 용량에 맞는 적정 굵기의 캡타이어 케이블을 선정하는 것은 허용 전류 초과에 따른 선로 과열 및 전압 강하 예방에 필수적이다."},{"t":"table","rows":[["정격 용량(A)","1차측 입력 케이블 굵기(지름 ㎜)","2차측 출력/접지 케이블 단면적(㎟)"],["200 A","5.5 ㎜ 이상","38 ㎟ 이상"],["300 A (표준 실습용)","8.0 ㎜ 이상","50 ㎟ 이상"],["400 A","14 0 ㎜ 이상","60 ㎟ 이상"]]},{"t":"h4","v":"단자 압착 가공 및 이중 절연 마감 절차: 케이블의 단부 가공 시에는 피복 제거 전용 칼을 사용해 조심스럽게 피복을 벗기고, 구리 소선이 끊어지지 않도록 전용 압착 터미널(러그)을 단자에 끼운 뒤 압착기로 정밀 압착 가공한다. 볼트·너트 조립부는 접촉 면적을 최대화하여 체결해야 전압 강하와 발열로 인한 화재를 방지할 수 있으며, 결속 후 노출된 구리 도체 부위는 감전 재해 방지를 위해 반드시 고무 절연 테이프와 비닐 절연 테이프로 2중 감아 주거나 수축 튜브, 전용 절연 커버로 마감 조치해야 한다."},{"t":"h3","v":"4. 배전반 차단기 조작 및 기기 접지 수칙"},{"t":"p","v":"용접 작업 안전의 기틀은 1차 전력 분전반의 차단기 안전 조작과 기기 외함의 완벽한 물리적 대지 접지로부터 시작된다."},{"t":"h4","v":"배선용차단기(NFB)와 누전차단기(ELB) 이원화 결선: 분전반 내에는 과전류 및 단락(합선) 사고 시 바이메탈의 열팽창이나 전자식 기구로 선로를 자동 차단하는 배선용차단기(NFB)와, 누전 발생 시 인체 통과 전류량 이하인 정격 감도 전류 30mA 이하, 0.03초 이내에 선로를 급격히 차단하는 감전 방지용 누전차단기(ELB)를 이원화하여 설치해야 한다. 전선 가공 및 용접기 설치 결선 중에는 반드시 차단기 레버를 아래로 내려 차단(OFF)하고, 배전반 커버에 타 작업자가 오조작하지 않도록 '점검 중', '수리 중' 명판을 확고히 고정 시건 장치해야 한다."},{"t":"h4","v":"초록색 접지선의 올바른 접지 규정: 용접기의 외함(케이스) 금속 프레임은 누설 전류가 직접 땅으로 방전될 수 있도록 두꺼운 단면적의 녹색(Green) 접지선을 이용해 대지에 고정된 접지봉에 강력히 체결해야 한다. 이때, 주변에 설치된 가스 파이프나 수도 파이프, 혹은 유해 가연성 기체가 흐르는 배관선에는 절대 접지선을 결속해서는 안 되며, 수도 배관 등의 화학 반응 부식을 방지하기 위해 단독 접지 공사를 시행하는 것이 정밀 전자기 감전 사고 예방을 위한 철칙이다."},{"t":"h3","v":"5. 보호가스 계통 및 레귤레이터 설치 (학습 2)"},{"t":"p","v":"TIG 용접 시 용융지와 전극봉의 산화 방지를 위해 사용되는 보호가스는 아르곤(Ar) 가스가 표준이며, 가스 제어 배관의 누설을 방지하는 레귤레이터 설치 공정이 정교해야 한다."},{"t":"h4","v":"개별 가스봄베 방식 vs 중앙집중 기화 장치 방식의 비교: 보호가스를 대량 연속으로 사용하는 산업 현장에서는 액화 아르곤 용기에 기화기(Vaporizer)를 설치해 기화시켜 공급하는 '중앙집중 공급 방식'이 봄베 25~30병 분량을 저장탱크 1병으로 대체해 가스 손실률을 줄이고 단가를 약 50% 절감하는 효과를 지닌다. 그러나 사용하지 않는 대기 상태에서도 자연 기화에 의한 내부 압력 상승으로 안전밸브를 통해 가스가 강제 배출되는 기화 방출 손실이 단점으로 작용한다. 반면, '개별 봄베 공급 방식'은 초기 투자 비용이 적고 설치가 지극히 간단하지만, 빈번한 봄베 교체 공수로 인해 가동 효율이 급락하는 상충적 특성을 지닌다."},{"t":"h4","v":"유량관 수직 설치 조건과 공학적 타당성: 아르곤 조정기(Regulator)는 고압 용기 내부의 압력(약 14.5 MPa)을 감압하여 최적의 작동 압력으로 변환하는 장치이며, 유량을 시각화하는 볼 게이지형 유량관(Flowmeter)이 지면에 완전히 '수직'이 되도록 정위치 체결 조립해야 한다. 수직 각도가 어긋나 기울어지면 유량관 내부 플로트 볼(Float Ball)의 마찰 계수 왜곡으로 실제 토치 배출 가스량과 게이지 표시 눈금 사이에 심각한 압력-유량 제어 오차가 유발된다."},{"t":"h4","v":"조정기 파손 방지를 위한 시동 시 밸브 조작 및 개방 안전 수칙: 용기 메인 밸브를 개방하기 전, 유량계 미세 제어 손잡이와 사용 압력 조절 손잡이가 반드시 완전히 닫혀(SHUT) 있는지 최우선 확인해야 한다. 밸브가 열려 있는 상태에서 메인 병밸브를 갑자기 가동 개방하면 엄청난 고압(145 bar 이상)이 유량관 유리 벽면을 타격하여 급격한 압력 충격으로 조정기가 파손되거나 비산하여 작업자가 중상을 입을 수 있다. 따라서 밸브를 개방할 때는 반드시 조정기 정면 위치를 멀리 벗어나 안전 지대 측면에 비켜 선 상태로 메인 밸브를 '서서히 1/4 ~ 1/2회전' 단계적으로 정밀 개방해야 한다."},{"t":"h3","v":"6. 용접 토치 사양 및 부속 부품 조립 (학습 3)"},{"t":"p","v":"토치 바디, 노즐, 콜릿 척, 콜릿 바디, 백캡(토치 캡)으로 구성되는 TIG 용접 토치는 작업 정격 전류와 열 발생 강도에 따라 적정 냉각 사양을 구비해야 한다."},{"t":"h4","v":"공랭식 토치 vs 수랭식 토치의 냉각 한계 및 선택 가이드: 정격 전류 200A 이하의 박판 및 단시간 단순 실습 시에는 자연 공기 냉각에 의존하는 가볍고 저렴한 '공랭식 토치'가 주로 운용된다. 반면, 200A 이상의 고전류를 수반하여 복사열이 극심한 대형 판재나 파이프 다층 맞대기 시공 시에는 용접기의 수랭 순환 장치와 직접 배관을 결선하여 용접 전원 케이블 피복 내부에 냉각수를 직접 강제 주입해 열손상을 완전히 배제하는 '수랭식 토치'를 탑재 운용해야 한다."},{"t":"table","rows":[["콜릿 바디 종류","가스 분출 구멍(Hole) 수","공학적 특성 및 용접 아크 보호 효과"],["일반 콜릿 바디","4 개","텅스텐 전극봉이 마모되어 짧아져도 40mm 부위까지 고정이 가능해 소모품 소비가 경제적이나 가스 분출 압력이 불균일함"],["변형 콜릿 바디","8 개","고온 내부 변형에 매우 강하며, 가스 구멍이 8개로 두 배 많아 보호가스를 정밀 제어하여 실딩 기류의 난류 발생을 억제함"],["가스 렌즈 바디","미세 메시 스크린","미세한 스테인리스 스크린 그물망 구조를 통과하며 완벽한 충류(Laminar flow) 가스 실드를 유도함. 노즐-모재 간 돌출 길이를 최대 25mm까지 극대화할 수 있어 협소한 틈새부 작업에 절대 유리함"]]},{"t":"h4","v":"세라믹 노즐 안지름 번호 규격 공식: 세라믹 노즐(가스 컵) 번호는 노즐 단면 안지름 규격 치수와 정교하게 비례 매칭된다. 노즐 번호 1단위는 안지름 치수 약 1.6mm(1/16 인치)를 점유하며, 예를 들어 시험에 가장 빈번히 등장하는 #6호는 약 10.0mm 안지름, #8호는 약 12.0mm, #10호는 약 15.0mm에 매칭되어, 적정 용접 전류와 가스 방출량에 맞춰 노즐 지름을 수식 기하학적으로 연계하여 탑재 선택해야 한다."},{"t":"h4","v":"롱 캡(Long Cap)과 단 캡(Short Cap)의 선택 및 조립 기준: 텅스텐 전극봉 뒤편을 보호하고 조임 토크를 전달하는 캡(Cap)은 가용 공간에 따라 롱 캡(Long Cap), 미디엄 캡, 그리고 단 캡(Short Cap)으로 나뉜다. 공간 확보가 원활한 전면 필릿 및 수평 맞대기 적층 작업 시에는 긴 신품 텅스텐 전극봉을 교체 없이 통째로 삽입 결속할 수 있는 '롱 캡'을 결속 조립한다. 반면, 밀폐 배관의 후면부나 이음 틈새가 극도로 협소해 토치 진입 간섭이 발생하는 수랭식 협소 홈 시공 시에는 텅스텐 봉을 알맞게 절단 가공하여 삽입한 뒤 기계적 공간 점유를 최소화하는 '단 캡'을 체결 조립하여 시야를 확보해야 한다."}],"questions":[{"n":1,"type":"mcq","stem":"가스텅스텐아크용접기(GTAW) 설치 시 벽면과의 이격 거리는 최소 30cm 이상 확보해야만 과열로 인한 온도 감지 센서 작동 및 부속 장치 소손을 예방할 수 있다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"가스텅스텐아크용접기(GTAW) 등 고출력 전자기기는 주변압기와 PCB 등의 강제 대기 환기 냉각 공간이 충족되어야 하므로 벽면 30cm 이격은 장비 수명 보존의 대원칙이다."},{"n":2,"type":"mcq","stem":"전류 및 전압을 정밀 계측하는 클램프 미터(Hook Meter)를 사용할 때는 다상(3상 등) 케이블 전체를 한 번에 루프 안에 감싸서 도선 전체를 일괄 측정하는 것이 정석 측정 수칙이다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"클램프 미터는 전자기 유도 전류 계측 시 단상 1선만을 클램프 루프 내부에 단독 통과시켜야 상호 벡터 유도 상쇄를 방지하여 측정이 가능하다."},{"n":3,"type":"mcq","stem":"용접기 내부 청소를 위하여 건조 압축공기를 가동 소거할 때는 내부 콘덴서의 전류 감전을 유발할 수 있으므로, 용접기 내부 전원 스위치만 끄고 별도의 배전반 1차 전원은 차단할 필요가 없다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"용접기 내부 전원 스위치를 내려도 1차측 고압 배전선은 전기가 통하므로 반드시 외부 배전반 1차 전원 차단기를 내리고(OFF), 콘덴서 잔류 전류 소멸을 위해 최소 3분 이상 대기 후 정비를 개시해야 안전하다."},{"n":4,"type":"mcq","stem":"아르곤(Ar) 가스 가열 히터 및 레큘레이터의 수평 각도가 10도 이상 기울어지면, 가스 흐름 지침관 속의 플로트 볼 마찰 저항이 변형되어 실제 배출량과 표시 유량계 사이에 심각한 계측 오차가 발생한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"레귤레이터(유량계)가 기울어지면 지침관 속 아르곤 가스의 상승에 대응하여 볼의 물리적 상하 마찰 저항이 불균일해져 표시 가스량 제어에 중대한 물리적 오차가 초과 유발된다."},{"n":5,"type":"mcq","stem":"TIG 용접에서 정격 전류 200A를 초과하는 고열의 대형 압력 용기 맞대기 용접 시에는 자연 대기 순환으로 냉각하는 공랭식 토치를 체결 가동하는 것이 토치의 물리적 수명 보존에 절대 유리하다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":2,"answerText":"② X (틀리다)","explain":"200A 초과의 고열 적층 적시에는 케이블의 고열 용융 피막 파괴를 방지하기 위해 강제 냉각수가 상시 순환되는 '수랭식 토치'를 구비 조립 탑재하는 것이 정석이다."},{"n":6,"type":"mcq","stem":"텅스텐 전극봉 뒤편의 롱 캡(Long Cap)은 신품 전극봉을 삽입하기에 용이하나, 협소부 용접 시 기계적 노즐 간섭이 유발되어 진입 장해를 일으킬 수 있으며 이때는 단 캡(Short Cap)과 잘린 전극봉으로 대체 체결하는 것이 타당하다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"롱 캡(Long Cap)은 신품 텅스텐 수용에 유용하나 협소 간섭 공간 진입 시 방해 요인이 되므로, 공간에 따라 전극봉을 알맞게 절단하여 단 캡(Short Cap)과 매칭하는 조립 수칙이 타당하다."},{"n":7,"type":"mcq","stem":"일반 콜릿 바디는 가스 분출 홀이 총 4개이지만 변형 콜릿 바디는 8개의 홀을 구비하고 있어, 용융부의 실드 흐름을 정밀 교반하여 난류를 억제하고 정밀한 충류 가스차폐막을 극대화한다.","choices":["O (맞다)","X (틀리다)"],"answerIndex":1,"answerText":"① O (맞다)","explain":"일반 콜릿 바디(4홀) 대비 변형 콜릿 바디는 8개의 가스 분출 구멍을 균일 각도로 배치하고 있어 기류 충류 차폐 능력이 탁월하게 극대화된다."},{"n":8,"type":"mcq","stem":"용접 케이블 가공 시 압착 터미널(러그) 전용 압착기를 이용해 기계적으로 강력 결속한 결선부는 감전을 완전 차단하기 위해 고무 절연 테이프와 비닐 절연 테이프로 반드시 2중 감거나 수축 튜브 등으로 이
