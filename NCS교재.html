기호는 수평 기준선과 경사 지시선의 교차점에 실제 평가 규격 깃발(Flag)을 비스듬하게 세워 도시함으로써, 외부 현장에서 용접을 수행하라고 명시합니다."},{"n":8,"type":"mcq","stem":"용접 이음부 부재 전체를 한 바퀴 돌아가며 중단 없이 전 둘레에 결합부를 연속해서 쌓아 나가는 '일주용접(온둘레용접)'의 기하학적 표시 기호는?","choices":["지시선과 기준선의 교점에 원형(Circle) 기호를 부착한다.","지시선과 기준선의 교점에 정삼각형 기호를 부착한다.","기준선의 꼬리 끝부분에 화살표를 표시한다.","기준선의 상단과 하단에 대칭 실선을 긋는다."],"answerIndex":1,"answerText":"① 지시선과 기준선의 교점에 원형(Circle) 기호를 부착한다.","explain":"부재 주변을 온둘레 한 바퀴 돌아가며 필릿이나 맞대기 용접을 계속해서 마무리하라는 일주용접의 기호는 기준선과 지시선의 꺾임 교차 중심에 원(Circle)을 그려 지시합니다."},{"n":9,"type":"mcq","stem":"정투상도법에서 물체를 정면, 평면, 측면 3개 방향에서 바라보았을 때 가로 세로 높이의 모서리 축이 정확히 상호 120도의 각도를 갖도록 입체적으로 표현하는 투상법의 명칭은 무엇인가?","choices":["사투상도 (Oblique projection)","등각 투상도 (Isometric projection)","부등각 투상도 (Dimetric projection)","투시 투상도 (Perspective projection)"],"answerIndex":2,"answerText":"② 등각 투상도 (Isometric projection)","explain":"세 모서리 각도가 평면상에 정확하게 120° 각도를 대칭 유지하도록 정밀 투영해 입체 구조물의 3면 형상을 단 한 눈에 구별할 수 있도록 작도하는 투상법을 등각 투상도라 합니다."},{"n":10,"type":"mcq","stem":"KS 제도 규격에서 가장 기본이 되는 제3각법 정투상도 정배치 규칙에서, 정면도(Front view)를 기준으로 정정당당하게 위쪽 공간에 정확히 나열하여 배치하는 정석 투상면의 명칭은?","choices":["우측면도 (Right side view)","저면도 (Bottom view)","배면도 (Back view)","평면도 (Top view)"],"answerIndex":4,"answerText":"④ 평면도 (Top view)","explain":"KS 제도 원칙의 3각법 기준에서 정면도를 중심 삼고 바로 정정당당하게 수직 상위 공간 영역에 고정해 제도하는 투상면은 위에서 물체를 내려다본 모양의 '평면도'입니다."},{"n":11,"type":"mcq","stem":"제3각법 정투상도 도면 배치 기준에서 정면도를 기준 삼아 물체의 보이지 않는 반대 뒷편 형상을 파악하기 위하여 가장 바깥쪽 구석에 주로 배치하는 투상도의 명칭은 무엇인가?","choices":["배면도 (Back view)","저면도 (Bottom view)","좌측면도 (Left side view)","우측면도 (Right side view)"],"answerIndex":1,"answerText":"① 배면도 (Back view)","explain":"정면도의 뒤편 형상이나 숨어 있는 전반적 구조를 표현하기 위해 3각법 투상도의 좌우 또는 상하 끝 구석 방향에 최종 배치하는 물체의 후면도를 '배면도'라 부릅니다."},{"n":12,"type":"mcq","stem":"금속 재료 기호 중 탄소강 주강품이나 구조용 금속자재의 기호 'SF40'에 대한 설명 중, 숫자 '40'이 담고 있는 구체적인 의미 및 단위는 무엇인가?","choices":["최저 항복강도 40 N/mm²","최대 탄소 함유량 0.40%","최저 인장강도 40 kg/mm²","허용 굽힘강도 40 GPa"],"answerIndex":3,"answerText":"③ 최저 인장강도 40 kg/mm²","explain":"탄소강 단조 자재 기호 'SF40'에서 제일 뒤에 기재하는 아라비아 숫자는 제작 자재의 공학적 '최저 인장강도' 사양을 지정하며, 표준 단위는 kg/mm²입니다."},{"n":13,"type":"mcq","stem":"도면의 윤곽선을 완성하기 위하여 제도 용지의 구석 모서리 네 군데에 반드시 포함해야 하며, 복사 및 마이크로 필름 보관 시 도면의 정렬과 복원 기준이 되는 굵은 실선의 십자 기호는?","choices":["표제란 (Title block)","윤곽선 (Border line)","중심마크 (Center mark)","비교 척도 (Scale scale)"],"answerIndex":3,"answerText":"③ 중심마크 (Center mark)","explain":"제도 용지의 정중앙 4개 대칭 지점에 정확하게 사방 십자 모양으로 표현하는 선을 '중심마크'라 부르며, 마이크로필름이나 도면 복사 시 정렬 기준입니다."},{"n":14,"type":"mcq","stem":"용접 자세 기호 중 도면해독 시 용접기호 꼬리에 로마자 알파벳 'V'로 특별 기재 지시가 있는 경우, 작업자가 용접부의 축을 수직으로 고정하고 시공해야 하는 표준 용접 자세는?","choices":["아래보기 자세 (Flat position)","수평 자세 (Horizontal position)","수직 자세 (Vertical position)","위보기 자세 (Overhead position)"],"answerIndex":3,"answerText":"③ 수직 자세 (Vertical position)","explain":"용접 지시 알파벳에서 'V'는 Vertical, 즉 수직 자세를 지시하며, 용접선이 수직 또는 연직 방향인 상태로 시편을 고정해 용접하는 조건입니다."},{"n":15,"type":"mcq","stem":"비파괴 시험(NDT)의 기본 도면 기재법에서, 시험 방법을 지시하는 기선을 기준선에 대해 몇 도 정도의 경사 직선으로 배치하여 화살표와 지시하는가?","choices":["30°","45°","60°","90°"],"answerIndex":3,"answerText":"③ 60°","explain":"비파괴 시험(NDT) 기호 해독 규정에서, 지시선(Arrow)은 시험 대상 용접 비드 중심부를 정밀하게 가리키도록 설계 기준선과 60° 경사 각도를 유지해 제도합니다."},{"n":16,"type":"mcq","stem":"도면에 사용되는 선의 종류 중 물체의 외관상 눈에 직접 보이는 형상 부분을 직접 굵고 정밀하게 실선으로 도시하는 데 사용되는 선은 무엇인가?","choices":["외형선 (Visible outline)","숨은선 (Hidden line)","중심선 (Center line)","가상선 (Phantom line)"],"answerIndex":1,"answerText":"① 외형선 (Visible outline)","explain":"물체의 겉표면에서 육안으로 직접 눈에 정면으로 보이는 윤곽선과 형상 테두리를 가장 명확히 그리기 위해 적용하는 선을 '외형선(굵은 실선)'이라 합니다."},{"n":17,"type":"mcq","stem":"물체가 가진 경사면이나 곡면 부품의 실제 정밀한 형상과 길이를 투상면에 올바르게 도시하기 위하여 일정한 비율로 확대하여 별도의 디테일을 그리는 도면 투상도법의 명칭은?","choices":["부분 투상도","국부 투상도","보조 투상도","확대도"],"answerIndex":4,"answerText":"④ 확대도","explain":"용접 구조물의 경사면이나 미세 부품 등의 형상이 도면 척도상 너무 작아 정확한 치수 표현과 검사 요령 전달이 곤란할 때 별도로 원형 구역을 지정하고 척도를 키워 상세히 묘사하는 도면을 '확대도(상세도)'라 부릅니다."},{"n":18,"type":"mcq","stem":"용접 구조물의 도면해독 과정에서 재료 기호 'SS275'라는 표기법을 발견하였다. 여기서 가운데에 위치한 알파벳 'S'와 마지막 숫자 '275'의 올바른 기하학적 명칭 조합은?","choices":["규격(Structural) - 최저 인장강도 275 MPa","강재(Steel) - 최저 항복강도 275 MPa","단조(Forging) - 최저 항복강도 275 N/mm²","강(Steel) - 탄소 함유량 0.275%"],"answerIndex":2,"answerText":"② 강재(Steel) - 최저 항복강도 275 MPa","explain":"기호 SS275에서 앞의 SS는 Structural Steel(탄소구조강)을 뜻하며, 마지막 숫자 275는 자재가 보장하는 '최저 항복강도(Yield Strength)'를 지시하는 공학 수치이며 단위는 MPa입니다."},{"n":19,"type":"mcq","stem":"도면 제도 원칙상 가상선(Phantom line)을 나타내는 표준 선의 종류는 다음 중 어느 것인가?","choices":["중간 굵기의 파선(점선)","가는 1점 쇄선","가는 2점 쇄선","파형의 아주 가는 실선"],"answerIndex":3,"answerText":"③ 가는 2점 쇄선","explain":"제도 통칙상 가상선(물체의 앞뒤 대칭 연장부나 인접 부품의 배치 한계 등 가상의 외곽선)을 도시하는 선은 가는 2점 쇄선입니다."},{"n":20,"type":"mcq","stem":"비파괴 시험 기호 중 방사선을 시험편 이면에 투과시켜 내부 결함부의 음영 농도차를 필름에 감광시켜 기록 판독하는 기호 명칭은 무엇인가?","choices":["UT","RT","PT","MT"],"answerIndex":2,"answerText":"② RT","explain":"방사선 투과 시험(Radiographic Testing)을 의미하는 공인 비파괴 검사 기호는 RT입니다. 구조물 내부의 기공 및 슬래그 등 체적 결함 검출에 매우 우수한 비파괴 검사입니다."},{"n":21,"type":"mcq","stem":"강관이나 압력 배관용 탄소 강관 규격 표기에서 'SPPS'가 나타내는 배관 강종의 의미는 무엇인가?","choices":["일반 구조용 탄소 강관","압력 배관용 탄소 강관","보일러 및 열교환기용 강관","저온 배관용 탄소 강관"],"answerIndex":2,"answerText":"② 압력 배관용 탄소 강관","explain":"배관 자재 표기 중 SPPS는 Steel Pipe for Pressure Service의 한글 약어 표준 명칭으로, 고압 보일러나 내부 배관 유체 전송에 쓰이는 '압력 배관용 탄소 강관'을 의미합니다."},{"n":22,"type":"mcq","stem":"용접 도면의 표제란(Title block)에서 '척도: NS'라고 명기되어 있는 경우, 이 기호가 내포하고 있는 공학적 치수 정의는 무엇인가?","choices":["도면의 형상과 치수가 비례하지 않음 (Not to Scale)","축척 비율을 알 수 없는 무제한 상태 (New Scale)","특수한 공학 척도를 임의로 조정한 척도 (Special Scale)","실제 크기와 동일하게 1:1로 제도함 (Natural Scale)"],"answerIndex":1,"answerText":"① 도면의 형상과 치수가 비례하지 않음 (Not to Scale)","explain":"척도 NS는 Not to Scale의 표준 약어 기호로서 도면 형상이 일정한 축척 비율대로 정비례되어 제도되지 않았으므로 도면 스케일을 재지 말고 오직 수치 치수 조건만을 적용하라는 뜻입니다."},{"n":23,"type":"mcq","stem":"투상도 그리기 원칙상 도면에서 대상물의 보이는 형상을 가장 대표적이고 특징적으로 명확히 전달할 수 있도록 반드시 첫 관문으로 선정해야 하는 기준면은?","choices":["정면도","평면도","우측면도","좌측면도"],"answerIndex":1,"answerText":"① 정면도","explain":"물체의 가로, 세로, 높이를 포함하여 대상 제품의 전반적인 모양, 주기적 특성, 주요 시공 특징을 가장 대표적으로 보여주는 투상 기준면을 '정면도'로 선정해야 합니다."},{"n":24,"type":"mcq","stem":"선의 우선순위 제도 통칙에 따라, 도면상에 외형선(굵은 실선), 숨은선(파선), 중심선(1점 쇄선), 절단선(1점 쇄선 및 끝단의 굵은 선)이 기하학적으로 같은 자리에 겹칠 경우, 가장 우선하여 그리는 선은?","choices":["숨은선","중심선","외형선","절단선"],"answerIndex":3,"answerText":"③ 외형선","explain":"도면에 선이 같은 위치에 복잡하게 겹칠 때에는 '외형선(굵은 실선)'을 가장 상위 우선순위로 간주해 우선적으로 제도해야 하며, 그 다음 숨은선, 절단선, 중심선 순서로 밀려납니다."},{"n":25,"type":"mcq","stem":"용접 기본기호 중 한쪽 모재의 끝부분만을 한 면으로 베벨 홈 가공을 하고, 루트 간격을 두고 결합하여 단면 V형 모양의 그루브를 형성하는 용접 기호는?","choices":["V형 맞대기 용접","한 면 개선형 맞대기 용접","넓은 루트면 K형 용접","J형 맞대기 용접"],"answerIndex":2,"answerText":"② 한 면 개선형 맞대기 용접","explain":"한 면만을 사선 베벨 개선 가공을 취하고 용접을 실시하는 그루브 홈 형상 기호는 '한 면 개선형 맞대기 용접'입니다."},{"n":26,"type":"mcq","stem":"용접부 비파괴시험 기호 중 시험을 구조물의 특수한 외벽이나 용기 안쪽 양쪽 면 모두에서 양방향 동시 또는 독립적으로 수행하라는 기재법은?","choices":["NDT 기호를 기준선의 꼬리(Tail) 양쪽에 기재한다.","NDT 기호를 지시선 화살표의 시작과 끝에 부착한다.","NDT 기호를 수평 기준선 양쪽(위와 아래)에 각각 병기한다.","NDT 기호 주위에 검은 점을 두 개 대칭으로 그린다."],"answerIndex":3,"answerText":"③ NDT 기호를 수평 기준선 양쪽(위와 아래)에 각각 병기한다.","explain":"비파괴 기호에서 수평 기준선의 상부와 하부 양쪽에 검사 기호(예: RT/UT)를 동시 또는 별도로 중복 기입하는 구조는 시험편의 안팎 양쪽 모든 방향에서 비파괴 시험을 다 진행하라는 뜻입니다."},{"n":27,"type":"mcq","stem":"제3각법 정투상도 원리에 따라 우측면도(Right side view)를 배치하는 올바른 기하학적 공간 위치는?","choices":["정면도의 바로 아래쪽","정면도의 바로 위쪽","정면도의 바로 좌측 방향","정면도의 바로 우측 방향"],"answerIndex":4,"answerText":"④ 정면도의 바로 우측 방향","explain":"KS 표준인 제3각법 정투상도 정배치 규칙에서, 정면도에서 우측을 바라본 우측면도는 정면도의 우측 바로 옆방향 수평 선상에 정확하게 정렬하여 그리는 것이 제도 약속입니다."},{"n":28,"type":"mcq","stem":"도면해독 시 용접기호의 기준선 아래쪽에 정보 기호가 표기되어 있고, AWS A2.4 규격을 전제하고 있다면 이 용접은 실제 어디에 수행해야 하는가?","choices":["화살표가 지시하는 쪽 (Arrow side)","화살표 반대쪽 (Other side)","지시선 쪽과 반대쪽을 포함한 양면 전체","시공자의 임의적인 판단에 따른 한 면"],"answerIndex":1,"answerText":"① 화살표가 지시하는 쪽 (Arrow side)","explain":"AWS A2.4 도면 기호 시스템에서는 수평선(기준선)의 아래쪽(Below)에 적히거나 그려진 기호 내용은 오직 지시선 화살표가 지시하고 있는 그 '지시선 쪽 (Arrow side)'에 실제로 용접하라는 지시입니다. (반대로 위쪽 기재는 반대쪽 용접 지시입니다.)"},{"n":29,"type":"mcq","stem":"배관 도면 해독 시 파이프나 원통형 물체를 투상하는 경우, 대상물을 이해하기 쉽게 정면도를 보완하는 최소 투상법 도면으로 선정하기에 가장 알맞은 투상 수 구성은?","choices":["정면도 단 1면도로 완성","정면도와 평면도만 도시하는 2면도","정면도와 우측면도만 도시하는 2면도","정면도, 평면도, 우측면도를 포함하는 3면도"],"answerIndex":3,"answerText":"③ 정면도와 우측면도만 도시하는 2면도","explain":"원통형이나 둥근 파이프형 구조물은 단면 중심대비 형상이 전방향 동일하므로 정면도로 축 방향의 상세 구조를 파악하고, 우측면도로 지름 및 동심도 형상을 확인하는 2면도로 충분하게 완전한 해독이 가능합니다."},{"n":30,"type":"mcq","stem":"용접 결함부의 비파괴시험 기호 중 침투액을 모재 표면에 균일하게 도포하여 표면으로 열려 있는 미세한 균열이나 핀홀에 빨려 들어간 지시 모양을 확인하는 기호는?","choices":["UT","PT","MT","ET"],"answerIndex":2,"answerText":"② PT","explain":"용접 완료 부위의 표면 결함을 검출하기 위하여 붉은색 침투 지시액을 표면에 듬뿍 바른 후 현상액을 뿌려 흰색 바탕에 붉은 점으로 미세 표면 균열을 육안 관찰 판독하는 기호는 PT(침투 탐상 시험)입니다."},{"n":31,"type":"mcq","stem":"도면에 사용되는 치수기입 원칙에 대한 설명 중 가장 타당하고 공학적인 지침에 부합하는 기준은?","choices":["치수는 도면의 외형선 및 해칭선 내부에 직접 중복 기입한다.","치수의 표준 단위는 밀리미터(mm)이며 단위 기호는 생략한다.","치수선은 숨은선과 평행하게 도면 테두리 안쪽 아무 곳에나 배치한다.","소수점이 들어가는 정밀 치수는 기본 배척 비율로 크게 곱해 기입한다."],"answerIndex":2,"answerText":"② 치수의 표준 단위는 밀리미터(mm)이며 단위 기호는 생략한다.","explain":"도면 제작 제도 통칙상 모든 기재 치수의 표준 단위는 밀리미터(mm) 단위계를 채택하는 것을 세계 표준 규칙으로 하고, 별도로 명시하지 않으며 숫자 뒤에 mm 단위 기호는 혼란 방지를 위해 전면 생략하여 표기합니다."},{"n":32,"type":"mcq","stem":"배관용 강관 표기 'SPPS 38 - Sch 80'에서 뒤쪽의 '80'이 나타내는 배관 자재 정보는?","choices":["탄소 함유량 0.80%를 뜻하는 강종 구분 기호","최저 인장강도 80 kg/mm²를 보증한다는 표시","관의 두께 계열을 정하는 스케줄 번호(Sch. No.)","파이프의 표준 바깥지름이 80mm라는 치수 표시"],"answerIndex":3,"answerText":"③ 관의 두께 계열을 정하는 스케줄 번호(Sch. No.)","explain":"SPPS는 압력 배관용 탄소강관 기호이고 앞의 38은 최저 인장강도(kg/mm²), 뒤에 붙는 Sch 80은 관의 두께 계열을 정하는 스케줄 번호다. 스케줄 번호가 커질수록 관이 두꺼워져 높은 압력을 견딘다."},{"n":33,"type":"mcq","stem":"도면 제작 규격상 형강 치수 표기법 중 'H-200 × 200 × 8 × 12' 형식에 대한 올바른 형강 치수 항목 순서 조합은?","choices":["H형강 - 너비 × 높이 × 플랜지 두께 × 웨브 두께","H형강 - 높이 × 너비 × 플랜지 두께 × 웨브 두께","H형강 - 너비 × 높이 × 웨브 두께 × 플랜지 두께","H형강 - 높이 × 너비 × 웨브 두께 × 플랜지 두께"],"answerIndex":4,"answerText":"④ H형강 - 높이 × 너비 × 웨브 두께 × 플랜지 두께","explain":"H형강 치수 기입 표준 배열 규칙은 'H-높이(H) × 너비(B) × 웨브 두께(t1) × 플랜지 두께(t2)'의 순서가 공식이므로, 'H-높이 × 너비 × 웨브 두께 × 플랜지 두께' 순서가 유일한 정답입니다."},{"n":34,"type":"mcq","stem":"용접 기본기호 표기법 중 '겹침 접합부 용접'을 도시할 때 사용하는 표준 KS 용접 기호 형태는?","choices":["수평선 위에 대각선 두 줄을 평행하게 그린다.","로마자 대문자 'Z'를 거꾸로 뒤집어 표현한다.","알파벳 소문자 'e'를 기준선 중간에 기입한다.","수평선 하단에 필릿 삼각형 기호를 대칭으로 배치한다."],"answerIndex":2,"answerText":"② 로마자 대문자 'Z'를 거꾸로 뒤집어 표현한다.","explain":"겹침 접합부 용접 기본기호는 두 판이 겹쳐 어긋난 단면을 본떠 대문자 Z를 뒤집은 계단 모양으로 그린다. 평행한 사선 두 줄은 경사(서페이싱) 접합부 기호다."},{"n":35,"type":"mcq","stem":"ASME 규격이나 국제 비파괴 규정에서 누설시험(Leak Testing)을 나타내는 비파괴 기호의 영문 매칭은?","choices":["VT","ET","ST","LT"],"answerIndex":4,"answerText":"④ LT","explain":"ASME 및 ISO 비파괴 공통 규격에서 기체나 용기 기밀의 균열 누설을 판독하는 Leak Testing 누설 시험의 기호는 LT입니다."},{"n":36,"type":"short","stem":"용접기호의 구성 요소 중, 지시선(화살표)과 수평 실선 기준선의 교점에 위치하며 공장이 아닌 현장 조립 설치 후 시공을 지시하는 기호의 정밀 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"현장용접 보조기호","explain":"기준선과 지시선의 꺾임 접점에 깃발(Flag)을 비스듬하게 그리는 기호입니다."},{"n":37,"type":"short","stem":"도면 제작 통칙상 물체의 보이지 않는 내·외부 형상을 숨겨진 파선이나 점선 형태로 제도하는 굵기 중간의 가는 점선의 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"숨은선 (Hidden line)","explain":"물체의 보이지 않는 형상을 도면상에 중간 굵기의 파선(점선)으로 작도하여 표현하는 표준 선입니다."},{"n":38,"type":"short","stem":"KS B 0052 기준에 준하여, 화살표 실선에 용접 기호 정보가 밀착해 있는 경우, 화살표의 방향과 용접 위치의 관계는 어떠한 상태를 지시하는지 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"화살표가 가리키는 지시선 쪽 (Arrow side) 용접","explain":"KS B 0052 기준, 실선에 용접 기호가 밀착해 있는 면은 언제나 화살표가 실제 가리키는 부위의 용접을 뜻합니다."},{"n":39,"type":"short","stem":"정투상도 배치 규칙 중, 물체를 투상하는 순서가 '눈 → 물체 → 투상면'의 경로로 이어지며, 정면도의 아래쪽에 평면도가 배치되는 특수 각법의 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"제1각법 (1st angle projection)","explain":"물체 투상 경로가 눈-물체-투상면 순서이며, 정면도의 아랫부분 공간에 평면도가 위치하는 정투상 각법입니다."},{"n":40,"type":"short","stem":"세 모서리 축선이 서로 만나는 각도가 균일하게 각각 120°를 이루어 입체적인 투영 형상을 그리는 3D 정투상법 계열의 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"등각 투상법 (Isometric projection)","explain":"평면상에 3개 축이 만나 이루는 세 모서리 각도가 정비례하여 정확히 120°를 이루도록 그려 입체감을 주는 제도법입니다."},{"n":41,"type":"short","stem":"강재 재료 표기 중 'SF40' 기호에서 가운데 위치한 알파벳 'F'가 지시하는 자재 가공 형상 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"철강 단조품 (Forgings)","explain":"기호 'SF40'의 두 번째 자리인 F는 Forgings(단조품)를 나타냅니다."},{"n":42,"type":"short","stem":"비파괴 시험(NDT) 기호 중, 자성체 시편 표면에 자분을 산포하고 자화시켜 표면 및 미세 직하부의 결함 지시 모양을 현상하는 시험의 영문 기호 2자를 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"MT (Magnetic Particle Testing)","explain":"자성이 발생하는 강자성체 시험편 표면에 자분을 산포하여 표면 결함 지시를 자력선으로 검출하는 MT 기호입니다."},{"n":43,"type":"short","stem":"비파괴 시험 기호 중 방사선(X-ray 또는 Gamma-ray)을 투과시켜 시험편 내부 결함의 위치와 깊이를 음영으로 정밀 검출하는 내부 검사법의 약어를 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"RT (Radiographic Testing)","explain":"X선 또는 감마선의 재질 투과율 차이를 필름에 음영으로 정밀 검출 기록하는 내부 비파괴 시험 기호입니다."},{"n":44,"type":"short","stem":"비파괴시험 기호 기재 시, 시험부 지시선은 수평 기준선과 대략 몇 도의 표준 각도를 가지고 경사지게 연결해야 하는지 수치를 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"60°","explain":"비파괴 시험기호에서 지시선과 기준 수평선 사이의 각도는 제도 통칙상 표준 '60도'로 설정해 지시선을 긋습니다."},{"n":45,"type":"short","stem":"용접부 표면 가공 마감 보조기호 중 그라인더를 동원하여 비드 표면을 고르게 다듬는 작업을 지시하는 가공 기호 알파벳 1자를 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"G (Grinding)","explain":"그라인더(연삭기) 공구를 가동하여 용접부 덧살 부위를 매끄럽게 표면 연삭 처리하라는 표준 기호입니다."},{"n":46,"type":"short","stem":"도면해독 시 용접기호의 지시선 꼬리(Tail)가 생략되지 않고 기재되어 있을 때, 이 꼬리표 영역에 주로 명시하는 지시 사항 정보 2가지를 기술하시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"용접방법, 비파괴 시험 방법 (또는 용접 규격 사양)","explain":"꼬리(Tail) 부분에는 도면 기호 자체로 표기가 곤란한 구체적인 용접방법(예: GTAW, SMAW), 비파괴 사양 규정 등을 텍스트로 적습니다."},{"n":47,"type":"short","stem":"용접기호 해독에서 수평 실선이 수평 파선보다 아래쪽에 배치되어 있을 때, 이는 기하학적으로 어떠한 각법 투상 원칙이 적용되었음을 의미하는가? ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"제1각법 도면","explain":"용접기호에서 수평 실선이 파선의 아래에 배치되는 독특한 형식은 제1각법이 적용되었음을 기하학적으로 공표하는 수칙입니다."},{"n":48,"type":"short","stem":"도면 관리에서 굵기 0.5mm 이상의 아주 굵은 실선으로 제도 용지 가장자리를 따라 반드시 긋고 도면 영역을 구획해야 하는 선의 제도 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"윤곽선 (Border line)","explain":"제도 도면 용지의 네 테두리를 따라 반드시 굵기 0.5mm 이상의 굵은 실선으로 둘러쳐 구획해야 하는 외곽선을 윤곽선이라 합니다."},{"n":49,"type":"short","stem":"재료 기호 'SS275'에서 앞자리에 위치한 영문 'SS'가 내포하고 있는 일반 탄소강 자재의 한글 표준 명칭을 쓰시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"일반 구조용 압연강재 (또는 탄소구조강)","explain":"앞 기호 SS는 Structural Steel의 약어로서 구조용 빌딩이나 인장 부재에 널리 쓰이는 일반 구조용 압연 강재를 지칭합니다."},{"n":50,"type":"short","stem":"비파괴 탐상검사 기호 중, 초음파의 공학적인 반사 및 투과 전파 특성을 수신기 화면에 펄스로 표시하여 재질 내부 미세 균열을 고감도로 찾는 검사법의 기호를 기술하시오. ○ 정답 기재란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"UT (Ultrasonic Testing)","explain":"초음파의 매질 경계면 반사 시간과 진폭 전파 특성을 화면 펄스로 검사 판독하여 내부 균열을 완벽하게 검출하는 UT 기호입니다."}]},"5":{"unit":5,"title":"피복아크용접 재료 준비","code":"LM1601050103","group":"피복아크용접","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 이론 요약 (재료 준비 단권화)"},{"t":"h3","v":"1.1 용접 모재의 표면 청결 및 보관 수칙"},{"t":"p","v":"피복아크용접 품질의 원천은 모재 표면의 철저한 세정과 보관 상태에 있습니다. 습기와 불순물은 아크 열을 만나 수소를 방출하고 기공이나 고온 균열 등의 구조적 치명상을 야기하므로 아래의 규칙을 엄수해야 합니다."},{"t":"li","v":"모재 보관 간격 유지: 용접 모재(철판) 보관 시 철판과 철판 사이에 간격을 두어 통풍이 원활하게 유지되도록 받침판(기반목)을 반드시 활용합니다."},{"t":"li","v":"습기 배제: 피용접물에 물기나 습기가 다량 있으면 용접 불량이 발생하므로, 반드시 통풍이 잘 되고 습도가 극소화된 고지대 혹은 지정 창고에 보관합니다. 표면에 잔여 물기나 서리가 존재할 경우 용접 전 열(가스 토치 등)을 가하여 습기를 완전히 증발 제거해야 합니다."},{"t":"li","v":"적치 제한: 하중과 진동에 의한 변형을 막기 위해 철판을 지나치게 무리하게 대량으로 쌓아두지 않습니다."},{"t":"li","v":"산화막 그라인딩 처리: 모재 표면에 생성된 밀스케일(산화막) 및 미세 녹은 아크 불량과 가공 정밀도를 떨어뜨리므로, 용접 전에 반드시 평줄이나 수동 핸드 그라인더, 와이어 철 솔을 활용하여 완전 윤이 날 때까지 제거해야 합니다."},{"t":"li","v":"선입선출 대원칙: 장기 방치로 인한 내부 편석 및 균열, 국부 부식을 방지하기 위해 입고일자를 엄격히 추적하여 오래된 것부터 최우선 배정 사용합니다."},{"t":"h3","v":"1.2 모재 개선(Groove) 홈 가공 요령 및 가공 장비"},{"t":"p","v":"용접 시험편 및 구조물의 안정적인 용입과 루트부 이면비드(백비드) 형성을 위해 홈 가공(개선 가공)을 고도로 조밀하게 수행해야 합니다. 개선각의 오차는 과다한 용착금속 소비로 경제적 비용을 가중시키거나 용입 부족, 융합 불량을 초래하는 원인이 됩니다."},{"t":"h4","v":"개선 가공의 정석 수칙 및 주요 공작 기계 1. 수직 밀링머신(Vertical Milling Machine): 수직 밀링머신과 특수 제작 바이스 조(Jaw)를 활용해 시험편을 기립 고정하고 페이스 커터나 엔드밀을 각도 조절하여 베벨 각도를 정확하게 30°~35°로 정밀 가공합니다. 수작업에 비해 개선 정밀도가 극도로 우수하여 합격률을 획기적으로 상승시키는 장비입니다. 2. 가스 절단 및 그라인더 보정: 가스절단기를 이용해 베벨각 30°~35°(AWS 30°, ASME 35° 기준) 범위로 예비 절단한 다음, 줄(평줄)과 수동 그라인더를 사용하여 모재를 평평하게 다듬고 루트 면(Root Face)의 두께를 1.5~2.5mm 범위로 오차 없이 수평 가공합니다. 3. 굽힘 변형 바로잡기: 가스 절단 및 밀링 도중 열 변형이나 가공 외력에 의해 평판이 약간이라도 휘었을 경우, 가용접 및 가조립 수행 전에 반드시 동망치나 해머로 평평하게 평판 바로잡기를 완료해야 합니다."},{"t":"h3","v":"[표 1-1] 판 두께 및 구조에 따른 개선 홈(그루브) 형상의 정석 분류"},{"t":"table","rows":[["홈 형상 (Groove Type)","적용 판 두께 (mm)","구조적 특성 및 용접 경비 특징"],["I형 홈 (Square)","6mm 이하 박판","개선 가공이 매우 불필요하거나 간소하며 루트 간격을 적절히 유지할 시 신속하고 가장 경제적임."],["V형 홈 (Single V)","15mm 이하 중판","한쪽 면에서 가공하며 작업성이 우수하나, 두께가 두꺼워질수록 용착금속량이 급증하여 변형과 비용이 큼."],["U형 홈 (Single U)","16~50mm 중후판","V형에 비해 루트 부 너비가 넓어 초층 용착 속도가 우수하고 용착금속 소비가 적어 두꺼운 판에 유리하나 홈 가공이 까다로움."],["X형 홈 (Double V)","15~40mm 중후판","양면 대칭 용접이 가능하여 V형 대비 각변형과 용착금속 소비를 현격하게 경감할 수 있으나 이면 따내기(백가우징) 필수."],["H형/K형 홈 (Double U/K)","40mm 이상 극후판","초극후판 중요 부위에 적용하며 용착금속과 수축 변형을 극소화하기 위해 선정. 가공비가 매우 큼."]]},{"t":"h3","v":"1.3 연강용 피복아크용접봉 규격 및 분류 기호 완벽 해석"},{"t":"p","v":"과정평가형 외부평가 및 국가기술자격 필기 시험에서 항상 변별력 넘치게 다루어지는 것이 피복아크용접봉 분류 기호의 정밀 독해입니다. KS D 7004 및 AWS 규격의 매칭 원리를 완벽하게 암기해야 합니다."},{"t":"p","v":"예시 기호: E4316 (AWS E7016)"},{"t":"p","v":"1. 첫머리글자 \"E\" (Electrode): 용접 전기 회로에서 아크를 일으키는 전류를 통하게 하는 아크 용접용 전극봉임을 뜻합니다."},{"t":"p","v":"2. 앞 두 자리 \"43\" (최소 인장강도): 용착금속이 완전히 인장되어 파단될 때 견디는 최소 인장강도 값을 나타내며, 43은 43kg/mm² (또는 420N/mm²) 이상의 기계적 파괴 성능을 공식 보증한다는 의미입니다. AWS 규격의 E7016에서 \"70\"은 70ksi (약 49,000psi, 49kg/mm²) 이상을 지칭합니다."},{"t":"p","v":"3. 세 번째 자리 \"1\" (용접 자세): 용접봉으로 작업할 수 있는 표준 수용 가능 자세를 정의합니다."},{"t":"li","v":"1: 전자세(F, V, OH, H-Fillet 모두 가능)"},{"t":"li","v":"2: 아래보기(F) 및 수평 필릿(H-Fillet) 자세 한정"},{"t":"li","v":"3: 아래보기(F) 자세 전용"},{"t":"li","v":"4: 아래보기, 수평, 수직 하향(V-Down) 전용 등"},{"t":"p","v":"4. 네 번째 자리 \"6\" (피복제 계통): 피복제 주성분과 슬래그 타입을 규정합니다. 16은 석회석과 형석이 주성분인 저수소계(Low Hydrogen Type)를 지시합니다. (예: 01=일미나이트계, 11=고셀룰로오스계, 13=고산화티탄계, 16=저수소계, 24=철분 산화티탄계, 26=철분 저수소계 등)"},{"t":"h3","v":"1.4 대표 피복용접봉 품종별 특징 (일미나이트계 vs 저수소계)"},{"t":"p","v":"가장 대표적인 범용 용접봉인 일미나이트계(E4301)와 중요 압력 배관 및 구조물용 저수소계(E4316)는 극명한 공학적 대비를 이룹니다."},{"t":"p","v":"■ E4301 일미나이트계 (Ilmenite Type)"},{"t":"li","v":"피복제 중 티탄철광(FeTiO3, 일미나이트) 분말을 주원료(약 30% 이상)로 첨가합니다."},{"t":"li","v":"아크가 지극히 안정적이고 슬래그 박리(찌꺼기 떨어짐) 성능이 엄청나게 뛰어나 비드 외관이 미려합니다."},{"t":"li","v":"기계적 성질 중 연신율이 저수소계보다 낮으며 고온 열전도로 인한 수축 과정에서 고온 균열(Hot Crack)을 일으키기 쉽다는 결점이 있어, 고압 용기나 교량 등 주요 하중 구조물의 보강 용접에는 절대로 사용하지 않습니다."},{"t":"p","v":"■ E4316 저수소계 (Low Hydrogen Type)"},{"t":"li","v":"피복제 중에 탄산칼슘(CaCO3, 석회석)과 형석(CaF2)을 대량 함유하여 용융 시 발생하는 다량의 이산화탄소 가스로 수소의 분압을 떨어뜨려 용착금속 속 수소 함유량을 타 용접봉의 약 1/10 수준으로 제어합니다."},{"t":"li","v":"수소 함유량이 극히 낮아 저온 균열 및 비드 밑 균열(Underbead crack) 억제력이 상상을 초월할 정도로 강하고 기계적 성질(인성 및 강인성)이 최상위 수준입니다."},{"t":"li","v":"치명적인 단점으로 아크 발생 시 불안정하며 용접 시작점에서 유독 기공(Blowhole)이 호발하기 쉬우므로 아크를 홈 밖에서 일으켜 들어오는 백 스탭(Back Step, 후진법) 운봉이 필수적입니다. 또한 피복제가 대기 중 수분에 극단적으로 민감하여 항시 건조 보관해야 합니다."},{"t":"h3","v":"[표 1-2] 산업안전보건법 및 KS 표준 용접봉 종류별 표준 건조 조건"},{"t":"table","rows":[["피복재 계통","대표 기호","표준 건조 온도","유지 시간 및 관리 수칙"],["일미나이트계","E4301","70 ~ 100℃","30 ~ 60분 간 건조. 1차 포장 개봉 시 기본적으로 즉시 사용 가능하나 개봉 후 8시간 경과 분은 필히 재건조 수립."],["고산화티탄계","E4313","70 ~ 100℃","30 ~ 60분 간 건조. 비드 외관이 우수한 일반 경구조물용으로 수분 흡수 시 스패터가 급증함."],["저수소계","E4316","300 ~ 350℃","1 ~ 2시간 (60 ~ 120분) 고온 건조 강력 권장. 건조 완료 후 보온 용기(70℃~100℃)에 넣어 관리하고 현장에서는 휴대용 건조통(Quiver) 필수 사용."]]},{"t":"p","v":"※ 핵심 수칙: 용접봉은 1회에 한하여 재건조(Re-baking)를 허용하며, 무제한적인 반복 재건조는 피복제의 화학적 조성 파괴 및 접착력 감퇴로 외벽 탈락을 유발하므로 법적으로 전면 통제됩니다."},{"t":"h3","v":"1.5 용접봉 심선재 성분 배합 및 불순물 최소화 이유"},{"t":"p","v":"피복아크용접봉의 속살인 심선(Core Wire)은 용착부로 직접 녹아들어가 용착금속(Deposited Metal)을 만드는 원천이므로 극도로 고순도의 성분 조절이 수반되어야 합니다. 일반적으로는 탄소 함유량이 매우 극소화된 저탄소 림드강(Low Carbon Rimmed Steel)을 심선재(SWR 11, SWR 21 등)로 채택합니다."},{"t":"p","v":"■ 불순물 원소들의 해로운 영향과 관리 한계치"},{"t":"p","v":"1. 황(S, Sulfur) 및 인(P, Phosphorus): 결정입계에 저융점 화합물(FeS 등)을 형성하여 고온 변형 도중 알갱이 틈 사이가 갈라지는 황 균열(설퍼 크랙, Sulfur Crack) 및 극저온 취성을 대량 조장합니다. 따라서 일반적으로 일반 구조용 강재는 S 함량을 0.04~0.05% 이하, 중요 용접 구조용 강재(SM강)는 0.04% 이하(KS 심선재 표준 SWR 11 기준 0.023% 이하)로 강력 제어합니다."},{"t":"p","v":"2. 규소(Si, Silicon): 탈산 작용에 유효하나 과도할 시 용착금속을 과하게 경화시켜 기계적 연신율을 저하시킵니다."},{"t":"p","v":"3. 구리(Cu, Copper): 구리는 저융점 금속으로 입계에 침투하여 적열취성을 조장하므로, KS 심선 화학 성분 상 Cu 함량을 최소한 0.20% 이하로 제지하는 것을 철칙으로 삼습니다."},{"t":"h3","v":"1.6 용접 전류 산정 규칙 및 조정 인자"},{"t":"p","v":"용접 시 시공 현장 배전 전력과 모재 성질을 고려하여 표준 전류를 설정해야 합니다. 용접 전류를 너무 가혹하게 높게 설정하면 아크 쏠림, 과다 스패터 분출, 언더컷 결함이 발생하고, 반대로 지나치게 소극적으로 낮추면 용입 부족이나 오버랩 결함이 호발합니다."},{"t":"p","v":"■ 적정 전류 계산 및 선정 인자"},{"t":"p","v":"1. 단면적당 비례식 (정석 요령): 연강용 일반 피복아크용접봉 기준, 일반적으로 용접봉 심선 단면적 1mm²당 약 10~11A의 전류 강도를 인가하는 것을 대표준으로 삼습니다."},{"t":"p","v":"2. 모재 두께 및 형상: 필릿용접 이음부나 두꺼운 후판은 모재로의 열 확산(냉각) 속도가 폭풍처럼 빠르기 때문에 일반 평판 맞대기 용접보다 아크 열량 보충을 위해 현격히 높은 세기의 용접 전류를 설정해야 합니다."},{"t":"h3","v":"[표 1-3] 모재 판 두께 및 용접봉 지름별 표준 설정 전류 대조표"},{"t":"table","rows":[["모재 판 두께 (mm)","용접봉 심선 지름 (mm)","표준 설정 전류 범위 (A)"],["3.2mm 이하","Ø 2.0","40 ~ 60 A"],["3.2 ~ 6.0mm","Ø 2.6 ~ 3.2","50 ~ 125 A"],["6.0 ~ 9.0mm","Ø 3.2 ~ 4.0","80 ~ 160 A"],["9.0mm 이상 후판","Ø 4.0 ~ 5.0","130 ~ 220 A"]]},{"t":"h2","v":"제2부: NCS 5편 대표 엄선 50제 실전 평가"},{"t":"h3","v":"2.1 [선택형 35문항]"}],"questions":[{"n":1,"type":"mcq","stem":"용접 모재의 보관 및 청결 관리 수칙으로 가작 적절하지 않은 것은?","choices":["철판 보관 시 통풍을 방지하기 위해 틈새 없이 수직으로 빈틈없이 기밀하게 밀착 적치한다.","강재 가공이나 용접 전에 모재 표면의 녹, 물기, 기름 등 유질성 오염물을 완전히 그라인더로 세척한다.","모재 보관 장소는 습기가 침투하지 못하도록 방습 대책을 세운 고지대로 선정한다.","용접재료의 선입선출 방식을 엄격하게 적용하여 장기 적치로 인한 노화를 차단한다."],"answerIndex":1,"answerText":"① 철판 보관 시 통풍을 방지하기 위해 틈새 없이 수직으로 빈틈없이 기밀하게 밀착 적치한다.","explain":"철판을 보관할 때는 표면의 환기와 통풍을 통해 부식을 예방해야 하므로, 철판과 철판 사이에 받침판(기반목)을 두어 일정한 물리적 간격을 벌려 적재하는 것이 정석 수칙입니다. 밀착 적치는 습기를 가두는 최악의 행위입니다."},{"n":2,"type":"mcq","stem":"모재의 화학적 성분 중 용착금속의 결정입계에 저융점 화합물을 형성하여 고온 상태의 고온 균열(Hot crack)을 직접적으로 야기하는 최악의 유해 불순물은?","choices":["탄소(C)","인(P)","규소(Si)","황(S)"],"answerIndex":4,"answerText":"④ 황(S)","explain":"황(S)은 연강용 용착금속 내부에서 저융점의 황화철(FeS) 결정입계를 다량 유도하여 금속이 고온으로 수축 변형을 거칠 때 응력 불균형을 이기지 못하고 스스로 미세하게 찢어지는 설퍼 크랙(Sulfur crack)을 호발합니다."},{"n":3,"type":"mcq","stem":"KS D 3508에 따른 연강용 피복아크용접봉 심선재 화학 성분 배합 상, 적열취성 및 고온 균열 억제를 위해 구리(Cu) 함유량은 최대 몇 % 이하로 규제하는가?","choices":["0.05% 이하","0.20% 이하","0.50% 이하","1.00% 이하"],"answerIndex":2,"answerText":"② 0.20% 이하","explain":"KS D 3508 표준 규격에서는 연강용 용접봉 심선재의 구리(Cu) 화학 성분 배합 한도를 구리의 저융점 결정 입계 조장 및 적열취성 방지를 위해 엄밀하게 0.20% 이하로 제지하고 있습니다."},{"n":4,"type":"mcq","stem":"과정평가형 시험편 가공에 널리 사용되는 공작기계로, 바이스에 특수 조(Jaw)를 결합하여 베벨 각도를 정확하고 균일한 30°~35° 개선 홈으로 정밀 가공할 수 있는 최적의 장비는?","choices":["수평 선반","셰이퍼","수직 밀링머신","레이디얼 드릴링머신"],"answerIndex":3,"answerText":"③ 수직 밀링머신","explain":"공작실의 수직 밀링머신은 정교한 3차원 축 이송 및 회전 가공을 통해, 시험편의 한쪽 베벨각(경사각)을 오차 0.1mm 이내의 극도로 완벽한 30°~35° 직선 베벨 면으로 개선 홈 밀링 가공해 냅니다."},{"n":5,"type":"mcq","stem":"피복아크용접봉의 기호 표시 체계가 'E4316'일 때, 숫자 '43'이 공식 보증하는 기계적 성질의 구체적 의미는?","choices":["용착금속의 최소 항복강도가 43kg/mm² 이상이다.","용착금속의 최소 인장강도가 43kg/mm² 이상이다.","피복제 중 철분 함유량이 최소 43% 이상이다.","용접 가능 최대 판 두께가 43mm 이하이다."],"answerIndex":2,"answerText":"② 용착금속의 최소 인장강도가 43kg/mm² 이상이다.","explain":"앞의 두 자리 숫자인 '43'은 피복아크용접봉으로 완착된 용융 용착금속이 외력에 저항하여 늘어나며 버티는 한계 강도인 '최소 인장강도가 43kg/mm² (420N/mm²) 이상'임을 공식적으로 인증해 줍니다."},{"n":6,"type":"mcq","stem":"AWS 용접봉 규격인 'E7016'에서 앞의 두 자리 숫자 '70'이 나타내는 용착금속의 최소 인장강도 기준치는 몇 ksi 이상인가?","choices":["43 ksi 이상","60 ksi 이상","70 ksi 이상","100 ksi 이상"],"answerIndex":3,"answerText":"③ 70 ksi 이상","explain":"AWS 규격(미국용접협회)의 'E7016'에서 앞 두 자릿수 '70'은 미 규격 기준인 70 ksi (약 49kg/mm²) 이상의 최소 인장강도 요건을 지시하는 대등 규격 매칭 코드입니다."},{"n":7,"type":"mcq","stem":"피복아크용접봉의 기호 표시 체계인 'E4316'에서 세 번째 자리 숫자 '1'이 나타내는 표준 용접 자세는?","choices":["아래보기 및 수평 필릿 자세","아래보기 전용 자세","수직 및 위보기 한정 자세","전(E)자세"],"answerIndex":4,"answerText":"④ 전(E)자세","explain":"세 번째 자리 숫자 '1'은 중력 하중과 무관하게 아래보기(F), 수평(H), 수직(V), 위보기(OH) 자세 등 '전자세(All Position)'로 유연하게 운봉 시공이 가능하다는 뜻입니다."},{"n":8,"type":"mcq","stem":"피복아크용접봉 기호 중 아래보기(F) 및 수평 필릿(H-Fillet) 용접 자세에만 한정하여 적용할 수 있도록 허가된 기호는?","choices":["E4316","E4301","E4324","E4311"],"answerIndex":3,"answerText":"③ E4324","explain":"철분 산화티탄계 E4324는 피복제에 다량의 철 가루가 혼입되어 있어 아래보기(1G) 및 수평 필릿 자세 용접에는 우수한 고속 용착 속도를 발휘하지만, 중력 작용으로 흘러내리는 수직 및 위보기 자세 용접은 전면 불가능합니다."},{"n":9,"type":"mcq","stem":"피복아크용접봉 기호인 'E4316'에서 네 번째 자리 숫자 '16'이 나타내는 피복제 계통의 표준 명칭은?","choices":["저수소계","철분 산화철계","일미나이트계","고산화티탄계"],"answerIndex":1,"answerText":"① 저수소계","explain":"네 번째 기호 코드인 '16'은 피복제 내부에 탄산칼슘과 불화칼슘 등을 적극 주입 배합하여 용착금속 내 확산성 수소를 최소화하는 대표적인 '저수소계(Low Hydrogen)'의 전형적인 규격 부호입니다."},{"n":10,"type":"mcq","stem":"석회석(CaCO3)과 형석(CaF2)을 대량 첨가하여 용착금속 내부의 수소 농도를 극한으로 떨어뜨려 저온 균열 방지력이 압도적인 용접봉은?","choices":["E4311 (고셀룰로오스계)","E4301 (일미나이트계)","E4313 (고산화티탄계)","E4316 (저수소계)"],"answerIndex":4,"answerText":"④ E4316 (저수소계)","explain":"E4316 저수소계 용접봉은 고압 환경이나 교량, 후판 용접 시 수소 가스로 인한 지연 균열 및 비드 밑 균열(Underbead crack)을 완벽하게 억제하여 최고 수준의 안전성과 인성을 발휘하는 핵심 품종입니다."},{"n":11,"type":"mcq","stem":"E4316 저수소계 용접봉을 현장 실무 및 지필 시험에서 취급할 때, 사용 전 규정 온도와 유지 시간 조건으로 가장 올바른 것은?","choices":["70 ~ 100℃에서 30 ~ 60분","150 ~ 200℃에서 1시간","300 ~ 350℃에서 1 ~ 2시간","400 ~ 500℃에서 3시간"],"answerIndex":3,"answerText":"③ 300 ~ 350℃에서 1 ~ 2시간","explain":"저수소계 용접봉은 피복제의 고유 성분 보호와 결합 수분(흡착 수분)의 고온 제거를 위해 실습 전 300 ~ 350℃의 로(Oven) 속에서 1 ~ 2시간 (60 ~ 120분) 강력 고온 재건조를 필수로 거쳐야 아크 기공이 없습니다."},{"n":12,"type":"mcq","stem":"일미나이트계(E4301) 피복아크용접봉의 사용 전 표준 건조 조건으로 가장 적합한 온도는?","choices":["70 ~ 100℃","150 ~ 200℃","300 ~ 350℃","건조가 절대 불필요함"],"answerIndex":1,"answerText":"① 70 ~ 100℃","explain":"일미나이트계(E4301) 및 고산화티탄계(E4313) 등 일반 연강용 피복용접봉은 습기 방청을 위해 70 ~ 100℃의 비교적 온화한 온도 범위에서 30 ~ 60분 정도 가볍게 건조하여 반출하면 충분합니다."},{"n":13,"type":"mcq","stem":"저수소계 용접봉은 대기 중에 그대로 장시간 노출 시 피복제가 습기를 무섭게 흡수하므로, 완전 건조 완료 후 현장에 반출할 때까지 최소 몇 ℃ 수준의 보온 보관고 내부에서 상시 대기시켜야 하는가?","choices":["상온(20℃)","70 ~ 100℃","200℃ 이상","350℃"],"answerIndex":2,"answerText":"② 70 ~ 100℃","explain":"고온 건조로에서 나온 저수소계 용접봉은 상온에 노출되는 순간 바로 흡습을 가속하므로, 항시 대기실 보온고(70 ~ 100℃ 조건) 내에 엄격하게 보온 보관하여 온도를 따뜻하게 지속 유지 관리해야 합니다."},{"n":14,"type":"mcq","stem":"피복아크용접봉의 건조 한계성과 품질 관리 상의 수칙으로 가장 올바르지 않은 것은?","choices":["저수소계 용접봉은 완전히 건조되었더라도 현장 반출 후 4~8시간이 지나면 재차 흡습하므로 주의한다.","현장에서 쓰다 남은 용접봉은 수거 후 최대 1회에 한하여 재건조(Re-baking)를 적용할 수 있다.","피복제가 지나치게 수분을 가득 머금으면 용착금속 내부 기공(Blowhole) 및 저온 균열이 다량 발생한다.","용접봉은 많이 건조할수록 좋으므로 매주 일요일마다 정기적으로 연속 3회 이상 전량 고온 재건조를 시공한다."],"answerIndex":4,"answerText":"④ 용접봉은 많이 건조할수록 좋으므로 매주 일요일마다 정기적으로 연속 3회 이상 전량 고온 재건조를 시공한다.","explain":"용접봉 피복제는 유리 바인더 성분 등으로 굳어 있으므로, 2회 이상의 불필요한 중복 재건조를 가하면 피복제 자체의 결정 격자가 완전 붕괴되어 운봉 도중 피복제가 스스로 껍질째 떨어져 나가 용착불량 및 슬래그 다량 혼입을 초래합니다. 재건조는 법적으로 딱 '1회'에 한합니다."},{"n":15,"type":"mcq","stem":"연강용 피복아크용접 심선재로 가장 널리 사용되며, 탄소 함량이 지극히 극소화된 강괴로부터 인발 가공되어 불순물이 통제된 강종은?","choices":["저탄소 림드강","고망간 내마모강","중탄소 킬드강","고탄소 합금강"],"answerIndex":1,"answerText":"① 저탄소 림드강","explain":"연강용 피복아크용접 심선은 용착금속의 기공과 균열을 제어하기 위해 불순물을 극소화한 '저탄소 림드강(rimmed steel)' 제강 코일 봉(SWR 11, SWR 21 등)을 냉간 인발하여 사용합니다."},{"n":16,"type":"mcq","stem":"일미나이트계(E4301) 용접봉에 대한 공학적 설명 중 가장 적합하지 않은 것은?","choices":["피복제 중에 티탄철광분말을 주성분으로 배합한다.","아크가 극도로 안정적이고 스패터가 적으며 슬래그 박리성이 좋아 비드 파형이 지극히 곱다.","연신율이 매우 우수하고 인성이 충부하여 보일러 동체나 중요 고압용기의 최우선 용접용으로 쓰인다.","중요 구조물이 아닌 일반 기계부품 및 경구조물의 용접에 널리 사용된다."],"answerIndex":3,"answerText":"③ 연신율이 매우 우수하고 인성이 충부하여 보일러 동체나 중요 고압용기의 최우선 용접용으로 쓰인다.","explain":"일미나이트계는 수축 응력 시 결정 입계 균열(고온 균열) 발생성이 강하고 인성이 상대적으로 저하되기 때문에, 안전성이 극도로 중시되는 '보일러 압력동체'나 중요 플랜트, 교량 하중 지지부에는 전면 사용이 금지되어 있습니다."},{"n":17,"type":"mcq","stem":"E4316 저수소계 용접봉의 물리적 특징으로 가장 올바르지 않은 것은?","choices":["용착금속 내 확산성 수소량이 다른 용접봉에 비해 약 1/10 수준으로 매우 적다.","강력한 탈산 작용으로 용착금속 내부 산소량이 적어 인성과 충격 연성이 우수하다.","아크가 약간 불안정하고 용접 속도가 일미나이트계 대비 상대적으로 더딘 편이다.","용접 시작점과 끝점에서 아크가 워낙 강해 기공이나 슬래그가 절대 발생하지 않는 고유의 장점이 있다."],"answerIndex":4,"answerText":"④ 용접 시작점과 끝점에서 아크가 워낙 강해 기공이나 슬래그가 절대 발생하지 않는 고유의 장점이 있다.","explain":"저수소계 용접봉은 아크 열에 의한 슬래그 피복 형성이 늦고 시작 시 이산화탄소 가스 배출 압력이 약하여, 비드 시작점에서 미세한 공기 산화 가스가 갇혀 초기 기공(Blowhole)이 자주 터지는 성향이 농후합니다. 결코 결함 무방 지대의 용접봉이 아닙니다."},{"n":18,"type":"mcq","stem":"저수소계(E4316) 용접 작업 시, 용접 시작점에서 무부하 가스가 모재를 덮지 못해 기공(Blowhole)이 자주 터지는 물리적 결함을 방지하기 위해 수행하는 특수 운봉 기법은?","choices":["전진 블록법 (Forward block method)","캐스케이드법 (Cascade method)","후진법 (Back step method, 백스탭)","오버랩법 (Overlap method)"],"answerIndex":3,"answerText":"③ 후진법 (Back step method, 백스탭)","explain":"저수소계 E4316의 초기 기공 결함을 완벽하게 격퇴하기 위해선, 본 용접 개선선 시작점보다 약간 앞쪽(진행 방향)에서 아크를 먼저 일으켜 용융지를 안정화시킨 후, 다시 역방향으로 진행해 들어가는 '백 스탭(후진법, Back Step)' 시공이 절대적 의무 사항입니다."},{"n":19,"type":"mcq","stem":"피복아크용접에서 적정 용접 전류를 선정할 때 사용하는 정석 비례식으로, 연강용 용접봉의 가장 이상적인 표준 전류 밀도는 용접봉 심선 단면적 1mm²당 몇 A 범위인가?","choices":["1 ~ 2 A / mm²","10 ~ 11 A / mm²","30 ~ 40 A / mm²","100 ~ 120 A / mm²"],"answerIndex":2,"answerText":"② 10 ~ 11 A / mm²","explain":"피복아크용접 전류의 표준 산정 이론에 따르면, 심선재 단면적 1mm²당 대략 10 ~ 11A 범위의 아크 전자를 통과시키는 것이 아크 쏠림과 과다 스패터를 방지하는 가장 이상적인 표준 전류밀도 설계입니다."},{"n":20,"type":"mcq","stem":"후판이나 필릿 용접부에서 용접 작업을 수행할 때, 일반 평판 맞대기 용접보다 유독 용접 전류값을 상당히 높은 세기로 상향 인가해주어야 하는 주된 공학적 배경은?","choices":["용접봉이 닿는 면적이 넓어서 전기 저항이 0이 되기 때문이다.","후판 및 필릿 용접부는 입열량이 모재로 매우 급속하게 열 확산(냉각)되기 때문이다.","용착금속의 응고 속도를 극도로 늦추어 결정입자를 과대화하기 위함이다.","슬래그의 점성을 임의로 높여 비드 처짐을 전면 차단하기 위함이다."],"answerIndex":2,"answerText":"② 후판 및 필릿 용접부는 입열량이 모재로 매우 급속하게 열 확산(냉각)되기 때문이다.","explain":"후판이나 필릿 용접부는 입열량이 모재로 매우 급속하게 냉각 및 분산(열 확산)되기 때문에, 일반 평판 맞대기 용접과 같은 수준의 전류를 흘리면 모재가 녹지 않아 용입 부족이나 오버랩 결함이 호발하므로 전류를 높게 설정해야 합니다."},{"n":21,"type":"mcq","stem":"용접 모재 및 심선재 내부 불순물 중 저온취성(Cold shortness)을 조장하여 겨울철 영하 환경에서 충격 저항을 급격히 떨어뜨리는 치명적인 화학 원소는?","choices":["티타늄(Ti)","규소(Si)","망간(Mn)","인(P)"],"answerIndex":4,"answerText":"④ 인(P)","explain":"인(P) 원소는 저온에서 철강재의 인장 연성을 급격하게 연화 붕괴시켜 약한 충격에도 유릿장처럼 갈라지는 '저온 취성(Cold Shortness)'을 심각하게 유발하는 악질적인 원소입니다."},{"n":22,"type":"mcq","stem":"모재의 두께가 9.0mm인 판재에 저수소계 E4316 Ø4.0mm 용접봉을 사용하여 아래보기(F) 용접을 수행할 때, 가장 적절한 표준 아날로그/디지털 조정 전류 범위는?","choices":["40 ~ 60 A","60 ~ 80 A","140 ~ 160 A","220 ~ 250 A"],"answerIndex":3,"answerText":"③ 140 ~ 160 A","explain":"9.0mm 두께 판재에 Ø4.0mm E4316 저수소계 용접봉을 사용할 때, 아날로그/디지털 용접기의 정석 아래보기 전류 범위는 '140 ~ 160 A' 부근입니다. (박판 Ø2.0은 40~60A)"},{"n":23,"type":"mcq","stem":"피복아크용접봉의 피복제가 수행하는 매우 중요한 가스차단 야금 작용 및 전기적 역할에 해당되지 않는 것은?","choices":["전기 전도성이 매우 큰 구리 피막을 입혀 용접봉 홀더와의 절연 상태를 전면 타파한다.","고온에서 산소와 질소로부터 용융지를 엄격히 차단 보호하기 위해 일산화탄소(CO) 및 수소 등의 가스를 방출한다.","아크 발생을 안정시켜 스패터 분출을 경감하고 전류 흐름을 보조한다.","용융지에 적당한 슬래그를 형성하여 냉각 속도를 완만히 제어함으로써 응력과 경화를 예방한다."],"answerIndex":1,"answerText":"① 전기 전도성이 매우 큰 구리 피막을 입혀 용접봉 홀더와의 절연 상태를 전면 타파한다.","explain":"용접봉 피복제는 전류가 도선 측면으로 닿아 불필요한 부위에서 방전 스파크가 터지는 감전 및 화재 사고를 방지하기 위해 단단한 고유의 '전기적 절연 작용'을 병행 수행합니다. 전도성을 높이지 않습니다."},{"n":24,"type":"mcq","stem":"용접봉 피복제에 다량의 철분(Iron Powder) 분말을 30~50% 정도 혼합하여 제조된 용접봉(예: E4324, E4326)을 사용할 때, 일반 용접봉 대비 현격하게 향상되는 공정상 지표는?","choices":["가스 소모량 절감","용착 속도(생산성)의 비약적 향상","저온 균열 방지성","용입 깊이의 무제한 증가"],"answerIndex":2,"answerText":"② 용착 속도(생산성)의 비약적 향상","explain":"피복제 내부에 철 가루(Iron Powder)를 대량 혼합하면 아크 열에 의해 철 가루 자체가 부가적인 용가재 역할을 동시에 영위하므로, 단위시간당 모재로 녹아 들어가는 용착 속도가 타 용접봉 대비 비약적으로 상승하여 시공 능률이 엄청나게 극대화됩니다."},{"n":25,"type":"mcq","stem":"모재 V형 개선 가공 시 판 두께가 9.0mm일 때, 평줄이나 수동 그라인더를 사용하여 가공하는 표준 루트 면(Root Face)의 두께 범위는?","choices":["0 ~ 0.5 mm","1.5 ~ 2.5 mm","4.0 ~ 5.0 mm","6.0 ~ 8.0 mm"],"answerIndex":2,"answerText":"② 1.5 ~ 2.5 mm","explain":"과정평가형 자격 시험 및 실기 실무 규정 상, SS275 연강 9.0t 모재 개선 시 표준으로 다듬어야 하는 루트 면의 정석 두께는 '1.5 ~ 2.5 mm' 범위입니다."},{"n":26,"type":"mcq","stem":"용접 모재의 변형 교정 및 가공 완료 상태를 도면의 정밀한 치수대로 검사하기 위해 활용하며, 개선각(베벨각), 언더컷 깊이, 다리 길이(각장), 목두께 등을 일괄 측정할 수 있는 수공구형 측정기는?","choices":["아날로그 마이크로미터","정밀 버니어캘리퍼스","마스터 용접게이지","두께 측정용 피치 게이지"],"answerIndex":3,"answerText":"③ 마스터 용접게이지","explain":"수작업 실습장과 품질검사실의 필수 도구인 '마스터 용접게이지(Welding Gauge)'는 가위 형상의 슬라이드 자를 밀착시켜 개선각, 비드 높이, 각장, 언더컷 깊이 등을 단 3초 만에 원스톱으로 판독해 낼 수 있는 정밀 수공구 측정기입니다."},{"n":27,"type":"mcq","stem":"철강재에 존재하는 수소(Hydrogen) 기체가 다층 용접 후 냉각 과정에서 빠져나가지 못하고 국부적으로 집중되어, 시공 후 수 시간 내지 수일 후에 불시에 발생하는 가장 치명적인 지연 결함은?","choices":["저온 균열 및 비드 밑 균열","수축 응력에 의한 균열","응고 중 발생하는 고온 균열","황 성분에 의한 설퍼 크랙"],"answerIndex":1,"answerText":"① 저온 균열 및 비드 밑 균열","explain":"강재 내부에 고압 가스 형태로 갇힌 수소 원자는 용접 완료 후 상온까지 완전히 식는 과정에서 결정입계 공극으로 몰려들어 팽창 응력을 유발하고, 시공 후 수 시간 뒤에 스스로 갈라지는 '저온 지연 균열'을 조장합니다."},{"n":28,"type":"mcq","stem":"용접 작업 중 고온 상태에서 산소 및 대기 중의 질소가 용착금속 내부로 고농도로 침입하여 질화물 및 산화물을 다량 석출함으로써 용접부 강도와 인성을 극단적으로 떨어뜨리는 현상의 원인은?","choices":["아크 길이를 극도로 너무 짧게 유지했기 때문","아크 길이가 비정상적으로 과하게 길어졌기 때문","저수소계 용접봉을 너무 과하게 고온 건조했기 때문","용접 전류값을 적정 범위보다 현저히 낮추었기 때문"],"answerIndex":2,"answerText":"② 아크 길이가 비정상적으로 과하게 길어졌기 때문","explain":"용접 아크의 길이(거리)를 너무 과도하게 띄운 상태로 제어 불능 운봉을 수행하면, 대기 중의 산소와 질소가 용융지 표면으로 대량 혼입되어 질화철 및 산화철을 형성하여 비드가 지극히 부스러지고 강도가 폭풍 저하됩니다."},{"n":29,"type":"mcq","stem":"용접봉 심선 단면적이 8 mm²이고, 적정 전류 밀도를 10 A / mm²로 엄격하게 대입하여 용접을 진행하고자 할 때, 발전기형/인버터형 용접기 전면 패널에 설정해야 하는 가장 이상적인 용접 전류값은?","choices":["40 A","80 A","120 A","160 A"],"answerIndex":2,"answerText":"② 80 A","explain":"심선 단면적이 8 mm²이고 이상적인 전류 밀도 표준이 10 A/mm²이므로, 두 값을 곱하면 '8 × 10 = 80 A'가 최적의 세팅 전류값으로 정밀 산출됩니다."},{"n":30,"type":"mcq","stem":"연강용 피복아크용접봉 심선재 성분(SWR 11 기준) 중 아크열에 반응해 강력한 산화철을 환원시키며 황과의 화합물을 만들어 고온 취성을 방지하는 유효한 탈산 원소는?","choices":["구리 (Cu)","규소 (Si)","망간 (Mn)","인 (P)"],"answerIndex":3,"answerText":"③ 망간 (Mn)","explain":"망간(Mn)은 철강에 함유된 악질적인 황(S) 원소와 최우선적으로 반응하여 고순도의 황화망간(MnS) 슬래그를 강제로 형성하고, 황이 철과 반응해 FeS(저융점 화합물)을 만드는 입계 분리를 차단함으로써 적열취성 및 설퍼 크랙을 완벽 격퇴합니다."},{"n":31,"type":"mcq","stem":"저수소계(E4316) 용접봉 피복제 성분 중 형석(CaF2)이 아크 열을 만나 고온 분해될 때 생성되며, 수소 이온과 결합해 확산성 수소 농도를 극소화하는 핵심 원소는?","choices":["불소 이온","칼슘 이온","산소 이온","탄소 이온"],"answerIndex":1,"answerText":"① 불소 이온","explain":"형석에서 유래한 고온 불소 이온은 아크 중심부에서 수소 기체와 만나 지극히 안정한 불화수소(HF) 가스로 결합하여 대기 중으로 영구 방출됨으로써, 용착금속 내부 확산성 수소 농도를 극한으로 감쇠시킵니다."},{"n":32,"type":"mcq","stem":"모재 개선면 가공 시, 기계 부품 및 교량 등 강력한 인장 강도가 고도로 유지되어야 하는 최고 등급 결합을 위해 설계되는 앙방향 개선 홈 형상은?","choices":["일면 베벨형 홈","I형 홈","V형 홈","X형 홈"],"answerIndex":4,"answerText":"④ X형 홈","explain":"15mm를 초과하는 중후판 및 치명적인 피로 하중이 작용하는 교량 구조물 결합부는, 각변형을 대칭적으로 전면 억제하고 용착금속의 총 소모량을 획기적으로 감축하기 위해 양면 개선 방식인 'X형 홈'을 고도의 정석으로 채택합니다."},{"n":33,"type":"mcq","stem":"피복아크용접에서 아크 쏠림(Arc Blow) 현상이 가혹하게 일어나 비드 파형이 흩어지고 슬래그 혼입이 심각해질 때, 이를 방지하기 위한 기술적 대책으로 옳지 않은 것은?","choices":["직류(DC) 용접기 대신 교류(AC) 용접기를 투입한다.","용접 시작선과 종단부에 엔드 탭(Run-off plate) 및 보조판을 장착한다.","접지점을 용접부로부터 최대한 멀리 이격한다.","아크 길이를 길게 하여 운봉 각도를 최대한 90° 직각으로 세운다."],"answerIndex":4,"answerText":"④ 아크 길이를 길게 하여 운봉 각도를 최대한 90° 직각으로 세운다.","explain":"아크 쏠림을 방지하기 위해선 아크 길이를 길게 띄우는 것이 아니라, 오히려 '아크 길이를 최대한 짧게 유지'하여 아크를 단단히 구속시키고, 운봉 각도를 뒤쪽으로 약간 눕히는 것이 물리적으로 지극히 올바른 방지 대책입니다."},{"n":34,"type":"mcq","stem":"완전 고온 건조된 저수소계 용접봉이라도 대기 중에 방치할 시 몇 시간 이상 경과되면 한계흡습량(0.5%)을 초과하여 기공을 다량 유발하므로 다시 건조해야 하는가?","choices":["4시간 경과 시","24시간 경과 시","1주일 이후","1시간 이내"],"answerIndex":1,"answerText":"① 4시간 경과 시","explain":"아무리 정성껏 건조된 우수한 저수소계 용접봉이라도 외부 상온 환경에 방출되는 순간, 대기 중 가스 상 수분을 포획하기 시작하여 대략 '4시간 경과 시'에 규정 허용 한계치인 0.5% 수분율을 완전히 초과하게 되므로 다시 재건조해야 합니다."},{"n":35,"type":"mcq","stem":"피복용접봉 보관 창고의 습기 흡수 방지 대책으로 가장 적절하지 않은 것은?","choices":["용접봉 박스를 바닥 콘크리트에 직접 밀착 적치하여 지열을 흡수시킨다.","진동과 충격, 하중이 가해지지 않는 지정된 안전 정반 위에 분류 적재한다.","습도가 일시적으로 상승하는 지하 주차장이나 급수 배관 주변 적치를 완전히 불허한다.","용접봉은 항상 지면보다 10cm 이상 기립 고정된 목재 받침판(팔레트) 위에 적재 보관한다."],"answerIndex":1,"answerText":"① 용접봉 박스를 바닥 콘크리트에 직접 밀착 적치하여 지열을 흡수시킨다.","explain":"용접봉 박스를 공장이나 대기실 바닥 콘크리트에 직접 밀착 적치하면 바닥의 냉기와 국부 습기가 종이 박스를 투과하여 피복제를 치명적으로 습하게 만들므로, 법적으로 바닥으로부터 최소 10cm 이상 기립 고정된 목재 팔레트 위에 층적해야 합니다."},{"n":36,"type":"short","stem":"모재 보관 시 물기나 습기로 인한 아크 결함과 산화막 형성을 근본적으로 차단하기 위해, 철판과 철판 사이에 자연 환기가 통풍되도록 고정하는 받침용 판의 표준 명칭을 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"받침판 (또는 기반목 / Pallet)","explain":"철판 보관 시 통풍과 습기 예방을 극대화하기 위해 철판 사이에 일정한 간격을 벌려 고정 지지해 주는 필수 부자재입니다."},{"n":37,"type":"short","stem":"수작업 개선 가공 시 줄(평줄)을 사용하여 가공하는 V형 홈의 표준 각도 범위(°)와 루트 면(Root Face)의 가공 두께 범위(mm)를 구체적으로 제시하시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"개선각: 30°~35° / 루트 면 두께: 1.5~2.5mm","explain":"수작업 그라인딩 시 줄과 그라인더로 가공 조절해야 하는 국가기술자격 연강 모재 V형 홈의 엄격한 표준 가공 규격 범위입니다."},{"n":38,"type":"short","stem":"피복아크용접봉 기호 'E4316'에서 숫자 '1'이 나타내는 표준 용접 자세는 무엇인지 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"전자세 (All Position)","explain":"E4316 세 번째 자리에 위치한 숫자 1은 아래보기, 수평, 수직, 위보기 자세 모두를 수용 및 조작할 수 있음을 보증합니다."},{"n":39,"type":"short","stem":"석회석(CaCO3)과 형석(CaF2)을 피복제 주성분으로 하여 용착금속 내부 확산성 수소 함유량이 극히 낮아 연성이 뛰어난 피복제 계통의 대표 명칭은 무엇인가? ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"저수소계 (Low Hydrogen Type)","explain":"피복제에 CaCO3 등을 첨가하여 확산성 수소를 최소화한 품종으로, 고장력강 및 후판 중구조물 용접의 핵심 대명사입니다."},{"n":40,"type":"short","stem":"E4316 저수소계 용접봉을 사용하기 전, 피복제 내부의 습기를 원천 차단하기 위해 규정된 표준 건조 온도 범위(℃)와 유지 시간 범위(시간)를 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"건조 온도: 300 ~ 350℃ / 유지 시간: 1 ~ 2시간 (60 ~ 120분)","explain":"저수소계 용접봉의 물리적 결정 결합수와 미세 흡착 수분을 완전히 날려 기공을 차단하기 위한 가장 정석적인 고온 가열 조건입니다."},{"n":41,"type":"short","stem":"저수소계 용접봉은 현장 반출 시 공기 중 수분 흡수가 매우 원활하므로, 작업 현장에서 학생들이 항상 소량씩 용접봉을 담아 아크 용접기 근처에 두고 사용하는 휴대용 건조 보온 통의 영문 학술 명칭을 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"휴대용 건조통 (또는 보온통 / Quiver)","explain":"건조로에서 나온 저수소계 용접봉을 수분 흡수로부터 보호하며 실습 작업자가 지정된 실습 정반 근처에 거치하고 쓸 수 있도록 제작된 보온 장치입니다."},{"n":42,"type":"short","stem":"연강용 피복아크용접봉 심선재 성분 배합 상, 적열취성 및 결정입계 고온 균열 방지를 목적으로 KS D 3508 규격에서 최대 0.20% 이하로 엄격하게 인출 규제하는 금속 원소 기호는 무엇인가? ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"구리 (Cu)","explain":"적열취성과 결정입계 갈라짐을 대량 조장하여 용착 안정성을 훼손하는 원소로, KS 규격 상 최대 0.20% 이하로 제지됩니다."},{"n":43,"type":"short","stem":"용접봉의 표준 전류 선정 시, 심선 단면적 1mm²당 정석으로 비례 배합하는 가장 이상적인 전류(A)의 범위를 기술하시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"심선 단면적 1mm²당 약 10 ~ 11 A","explain":"적정 전류는 심선 단면적 1mm²당 10~11A. 예로 ø4.0은 단면적 12.6mm²×10~11≈126~139A. 문헌에 따라 10~13A로 보기도 한다."},{"n":44,"type":"short","stem":"E4316 저수소계 용접봉은 용접 개시 초기에 무부하 대기 접촉으로 시작부 기공이 자주 발생하므로, 용접 시작점에서 역방향으로 아크를 발생시킨 뒤 전진하는 특수 운봉 기법의 한국어 명칭을 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"백 스탭법 (후진법 / Back Step)","explain":"용접 시작점에서 약 20~30mm 전진 지점에서 아크를 일으킨 다음 뒤로 전진해 들어옴으로써 초기의 불완전 보호 가스로 인한 기공을 완벽히 소화해 내는 기법입니다."},{"n":45,"type":"short","stem":"필릿 용접부나 두꺼운 후판 용접을 수행할 때, 일반 평판 맞대기 용접부보다 더 강한 고전류 세기를 용접기에 반드시 세팅해야 하는 공학적 이유를 '냉각 속도' 및 '열 확산' 관점에서 서술하시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"후판/필릿 용접부는 입열량이 모재로 매우 신속하게 흡수 및 분산(열 확산)되기 때문","explain":"이로 인해 아크 에너지가 소멸되어 용착 속도가 따라가지 못하고 모재 용융 불량이 호발하므로, 높은 용접 전류를 흘려 열을 보충해야 합니다."},{"n":46,"type":"short","stem":"일반 범용인 일미나이트계(E4301) 용접봉은 작업성이 우수하나 수축 과정에서 입계에 치명적인 갈라짐을 야기할 수 있어 중요 하중 구조물에 쓰이지 않는다. 이 치명적인 결함 균열의 학술 명칭은 무엇인가? ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"고온 균열 (Hot Crack / 적열 취성 균열)","explain":"일미나이트계는 인성이 다소 약하고 수축 응력 시 결정입계 고융점 화합물 분리로 인한 찢어짐에 취약하여 중요 구조물 용접에는 결코 적용이 불가능합니다."},{"n":47,"type":"short","stem":"모재의 변형 각도 및 용접부 비드의 각장(Leg length), 목두께, 언더컷 깊이 등을 복합 정밀 검사하기 위해 용접 실습장에서 항상 구비해 두는 슬라이드형 정밀 수공구 측정기의 명칭은 무엇인가? ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"마스터 용접게이지 (Welding Gauge)","explain":"개선 베벨 각도, 비드 높이, 각장, 언더컷 깊이, 루트 간격 등을 일괄 및 신속하게 측정 판독할 수 있는 다용도 마킹 수공구입니다."},{"n":48,"type":"short","stem":"아크 길이가 지나치게 길어질 때, 대기 중의 산소와 질소가 용융지에 다량 고온 침입하여 비드의 인성과 연성을 극도로 저하시키는 야금학적 불량 반응 명칭을 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"아크 공기 산화 및 질화 현상","explain":"아크 길이가 너무 과하게 길어지면 산소 및 대기 중의 질소가 비드 내부로 대량 투과되어 취성 화합물을 과도하게 석출시킴으로써 강도가 붕괴되는 현상입니다."},{"n":49,"type":"short","stem":"정격 2차 전류가 250A이고 정격 사용률이 40%인 피복아크용접기에서, 실제 실습용으로 용접 전류를 150A로 하향 조정하여 아래보기 용접을 진행하고자 한다. 이때 용접기가 타지 않고 견딜 수 있는 안전한 '허용 사용률(%)'을 정밀 계산 공식 과정을 대입하여 구하시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"허용 사용률: 111.11 % (또는 약 111%)","explain":"공식 과정: 허용 사용률 = (정격 2차 전류 / 실제 용접 전류)² × 정격 사용률\n대입 계산: (250 / 150)² × 40 = (1.6667)² × 40 = 2.7778 × 40 = 111.11 %\n해설: 실제 세팅 전류를 정격보다 낮추었기 때문에 용접기가 열적으로 더욱 안전해져 허용 사용률이 100%를 초과하는 정상적인 결과입니다."},{"n":50,"type":"short","stem":"용착금속의 고온 응고 균열 및 저온 지연 균열을 유발하지 않기 위해 일반구조용 강재 및 용접구조용 강재(SM강)의 화학 분석 성분 중 황(S) 함량은 각각 최대 몇 % 이하로 법적 통제되는지 두 개의 기준치를 쓰시오. ▶ 수험생 작성란: __________________________________________________","choices":[],"answerIndex":null,"answerText":"일반 구조용 강재(SS275): S 0.050% 이하 / 용접 구조용 강재(SM): S 0.035% 이하","explain":"KS D 3503 SS275는 S 0.050% 이하, KS D 3515 SM강은 S 0.035% 이하이다. 교재의 SM 0.04% 이하는 규격값과 다르다."}]},"6":{"unit":6,"title":"피복아크용접 장비 설치","code":"LM1601050104","group":"피복아크용접","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 이론 요약 (이론 단권화)"},{"t":"h3","v":"1. 피복아크용접기 표준 설치 환경 및 기술 기준"},{"t":"p","v":"피복아크용접 장비는 정밀 기계부품과 높은 전기 에너지를 취급하므로 아래의 7대 표준 환경 기준에 맞추어 완벽하게 설치해야 소손 및 전기 사고를 예방할 수 있다."},{"t":"li","v":"건조한 실내 환경 유지: 습기는 전기 절연을 파괴하는 주원인이므로 실내의 건조한 장소여야 하며, 벽면으로부터 최소 30cm 이상 이격하여 설치해야 용접기 내부의 열 배출(통풍)이 원활하게 이루어진다."},{"t":"li","v":"주위 온도 조건: 주변 환경 온도는 -10℃ 이상, 40℃ 이하를 엄격히 유지해야 인버터 소자 및 변압기 코일의 물리적 특성을 보존한다."},{"t":"li","v":"고도 제약: 대기압 감소로 인한 절연 거리 파괴를 막기 위해 해발 고도 1,000m 이하인 장소여야 한다."},{"t":"li","v":"수평 견고성: 진동으로 인한 볼트 풀림 및 전도를 예방하기 위하여 견고한 구조의 수평 바닥에 설치한다."},{"t":"h3","v":"2. 가설 분전함 및 전기 계통 안전 수칙"},{"t":"p","v":"용접기 전원 공급을 제어하는 분전함 설비는 현장 전기사고를 원천 차단하기 위한 4대 규칙을 따른다."},{"t":"li","v":"차단기 이원화 배치: 메인 배전반에는 개폐기를 모두 NFB(No Fuse Breaker, 배선용 차단기)로 부착하고, 실제 작업자가 근접 조작하는 분기 분전함에는 누전 사고를 예방하기 위해 분기용으로 ELB(Earth Leakage Breaker, 누전 차단기)를 반드시 장착해야 한다."},{"t":"li","v":"차단 절차와 명판 부착: 용접기 설치 및 내부 점검 전에는 반드시 1차 전원 스위치를 차단해야 하며, 차단기 전면에 '수리 중' 표지판(명판)을 명시하여 타인이 무단으로 투입하는 전기 재해를 철저히 차단한다."},{"t":"li","v":"안전 퓨즈 관리: 퓨즈 교체 시 철선이나 구리선 등 비규격 전선을 임의로 사용해서는 절대 안 되며, 정격 용량에 맞는 전용 안전 퓨즈를 사용한다."},{"t":"h3","v":"3. 용접기 정격 용량별 케이블 및 전선 규격 표준"},{"t":"p","v":"피복아크용접기의 허용 사용 전류에 부합하는 정밀 규격 케이블을 사용하지 않을 경우 전선 발열 및 과도한 전압 강하가 발생한다. KS C 9602 및 교육 표준에 기반한 규격 대조표는 다음과 같다."},{"t":"table","rows":[["정격 용량 (A)","정격 사용률 (%)","1차측 케이블 규격 (굵기 지름 mm)","2차측 출력 케이블 규격 (단면적 ㎟)","해당 모델 표준 정격량"],["AW 200A","40%","5.5 mm 이상","38 ㎟ 이상","인버터 200"],["AW 300A","40%","8.0 mm 이상","50 ㎟ 이상","인버터 300"],["AW 400A","40%","14.0 mm 이상","60 ㎟ 이상","정류기 400"],["AW 500A","60%","27.0 mm 이상","80 ㎟ 이상","공업형 500"]]},{"t":"p","v":"※ 공학적 유의사항: 1차측 케이블이 굵기 표준 미달 시, 저항 증가로 전압 강하가 심화되어 아크 출력이 크게 저하되며 장기 가동 시 화재 사고를 유발하므로 정격 규격 준수가 필수적이다."},{"t":"h3","v":"4. 자동 전격 방지기(VRD)의 작동 원리 및 종류"},{"t":"p","v":"교류아크용접기는 무부하 전압이 70~80V로 비교적 높아 작업자가 충전부에 닿을 경우 치명적인 감전사를 초래할 수 있다. 자동 전격 방지기(VRD)는 아크가 중단된 무부하 상태에서 전압을 즉시 감지하여 안전 보호 기준 전압인 20~30V 이하로 자동 저하시켜 감전을 예방하는 핵심 안전장치다."},{"t":"li","v":"작동 원리: 용접 작업 중에는 높은 전압이 유지되다가 용접봉을 모재에서 떼는 단락 종료 즉시 보조 변압기와 전기 릴레이 회로가 작동하여 2차 전압을 20~30V로 급강하시킨다. 다시 모재에 용접봉을 가볍게 접촉시키는 순간 미세한 전류를 감지해 0.06초 이내의 빠른 시동 속도로 메인 변압기 회로를 ON하여 고압 아크를 가동한다."},{"t":"li","v":"전격방지기 부착 각도: 외장형 전격방지기는 전기 접점 오동작 방지를 위해 원칙적으로 직각(수직)으로 부착해야 하며, 협소 공간 등 어쩔 수 없는 경우에도 기울기 각도가 20°를 넘지 않도록 정밀 시공하여 견고하게 결속해야 한다."},{"t":"li","v":"전격방지기의 계통식 분류 및 특징:"},{"t":"table","rows":[["구분","마그네틱 접점 방식","반도체 소자 무접점 방식"],["장점","• 전압 변동이 적고, 무부하 전압차가 낮음 • 외부 자장에 의한 오동작 위험이 적음 • 고장 빈도가 적고 가격이 저렴함","• 시동 감도가 매우 빠르고 작업이 용이함 • 아크 제어가 용이해 정밀 용접에 적합함 • 소음이 없고 수명이 반영구적임"],["단점","• 물리적 접점으로 마그넷 수명이 짧음 • 시동 감도가 다소 낮아 정밀용접용 부적합 • 기기 중량이 무거움","• 외부 누설 자장에 의한 오동작 우려 있음 • 초기 입력 전압 변동에 민감하게 반응함 • 분진 및 수분에 매우 취약함"],["주요 용도","• 정밀성을 요하지 않는 구조물 용접 • 단순 보수용접 및 철 구조 가접","• 고품질 박판 용접 및 세밀 가용접 • 가접 빈도가 매우 높은 정밀 기계 부품 조립"]]},{"t":"h3","v":"5. 용접 케이블 가공, 단자 압착 및 감전 마감 작업"},{"t":"p","v":"용접 케이블 결선 시의 작은 유격은 아크 쏠림, 누전 및 전기 저항 과열로 이어지므로 엄격한 표준 가공 매뉴얼을 준수해야 한다."},{"t":"li","v":"케이블 수공구 및 탈피법: 용접 전선 칼을 이용해 가공용 캡타이어 피복 끝단을 약 1.0~1.5cm 정도 정밀 탈피한다. 구리 심선 소선들이 한 가닥도 단선되지 않도록 주의 깊게 정리한다."},{"t":"li","v":"압착 단자(Lug) 체결: 용량별 압착기(Crimping Tool)를 사용해 구동 부싱을 삽입한 뒤, 동 재질의 러그(lug)를 기계적으로 완전히 밀착 압착한다. 나사가 이완되면 전기 접촉 저항으로 고온의 열이 발생해 피복을 태우므로 스패너를 사용해 용접기 단자 볼트·너트에 단단히 결속한다."},{"t":"li","v":"이중 절연 보수 요령: 체결 후 충전 단자가 노출되어 감전되는 것을 막기 위해, 노출된 결선 부위를 1차로 절연 고무테이프로 촘촘히 팽팽하게 당기며 보수한 후, 2차로 절연 비닐테이프로 이중 마감하여 안전한 완전 절연 커버 구조를 형성한다."},{"t":"li","v":"접지선(Earth)의 시공 수칙: 용접기 외함과 모재 작업대는 전기적 대지와 등전위를 이루도록 접지선을 연결해야 한다. 녹색 접지선을 용접기 후면 접지 볼트에 확실히 고정하며, 접지시설이 부족하다고 하여 주변의 가스관이나 가연성 액체 운반 배관에 접지하는 행위는 대형 폭발 화재를 유발하므로 절대 금지한다."},{"t":"h3","v":"6. 용접기 극성(Polarity)과 아크 특성 분석"},{"t":"p","v":"직류(DC) 용접은 극성이 고정되어 전자의 일방향 흐름이 형성되므로, 용접 홀더와 모재 어스의 접속 극성 상태에 따라 열전달 및 용입 거동이 극단적으로 바뀐다."},{"t":"table","rows":[["극성 구분","결선 결합 방식","아크 발열량 배분","용접 결과적 형상 및 주 사용 용도"],["직류 정극성 (DCSP / DCEN)","• 용접봉 홀더: (-)극 연결 • 모재 및 작업대: (+)극 연결","• 모재 측: 60~75% 집중 • 용접봉 측: 25~40% 배분","• 모재의 용입이 깊고 예리함 • 비드 폭이 좁은 쐐기형 형성 • 용접봉 용융이 다소 느림 • 주로 두꺼운 후판 용접에 적합"],["직류 역극성 (DCRP / DCEP)","• 용접봉 홀더: (+)극 연결 • 모재 및 작업대: (-)극 연결","• 모재 측: 25~40% 배분 • 용접봉 측: 60~75% 집중","• 모재의 용입이 얕고 안전함 • 비드 폭이 넓게 형성됨 • 용접봉 용융 속도가 매우 빠름 • 박판, 합금강, 스테인리스강, 주철 및 비철금속 용접에 최적"],["교류 아크용접 (AC)","• 극성이 고전압 주파수로 수시 교차함","• 양 극단에서 거의 동일(50:50)","• 정극성과 역극성의 중간 수준 용입 • 아크 쏠림(자기 쏠림) 현상이 완전히 방지되는 강력한 효과 • 가장 범용적으로 저가형 고강도 작업에 활용"]]},{"t":"li","v":"수하특성(Drooping Characteristic): 부하 전류(용접 전류)가 증가하면 아크 내부 부하가 늘어나 단자 전압이 크게 떨어지는 특성으로 피복아크용접기의 기본 특성이다."},{"t":"li","v":"정전류특성(Constant Current): 용접사의 수수 조작 미숙으로 아크 길이가 미세하게 흔들려도, 아크 전류(용접 전류)가 거의 변하지 않고 일정하게 보존되는 특성으로 균일한 용입 품질 유지의 비결이다."},{"t":"h3","v":"7. 용접기 효율 및 사용률 산출 수식"},{"t":"p","v":"용접기의 온도 보호 및 시공 계획 수립을 위한 핵심 전력 수학 공식으로, 과정평가형 외부평가 지필시험에 매년 주관식 5점 만점으로 출제되는 대표 유형이다."},{"t":"li","v":"① 사용률 (Duty Cycle)"},{"t":"p","v":"용접작업 시간과 휴식 시간을 포함하여 총 10분을 기준으로 한 실제 아크 기포 방출 시간 비율이다."},{"t":"p","v":"* 사용률(%) = [ 아크 발생 시간 / (아크 발생 시간 + 휴식 시간) ] × 100"},{"t":"li","v":"② 허용사용률 (Allowable Duty Cycle) - 가장 중요!"},{"t":"p","v":"용접기에 표기된 정격 2차 전류보다 낮은 전류로 작업을 수행할 때, 안전하게 연속 가동할 수 있는 상향 조정된 허용 비드 시간 비율이다."},{"t":"p","v":"* 허용사용률(%) = [ (정격 2차 전류)² / (실제 용접 전류)² ] × 정격 사용률(%)"},{"t":"li","v":"③ 역률 (Power Factor) 및 효율 (Efficiency)"},{"t":"p","v":"* 역률(%) = [ 소비전력(kW) / 전원 입력(kVA) ] × 100"},{"t":"p","v":"* 효율(%) = [ 아크 출력(kW) / 소비전력(kW) ] × 100"},{"t":"h2","v":"제2부: 대표 엄선 50제 실전 평가 시험지"},{"t":"p","v":"고등학교 3학년 과정평가형 용접산업기사 외부평가 기준에 맞춰 진위형(O/X) 10문항, 연결형 5문항, 4지선다 객관식 20문항, 그리고 고난도 계산/단답식 주관식 15문항으로 엄격하게 안배한 실전 평가 문항입니다."}],"questions":[{"n":1,"type":"mcq","stem":"피복아크용접기 내부를 점검하거나 먼지를 제거하기 전에는 반드시 1차 전원 스위치를 차단해야 한다.","choices":["O","X"],"answerIndex":1,"answerText":"① O","explain":"일상적인 내부 정전기 소멸 및 확실한 감전 방지를 위해 1차 주 개폐기를 내린 상태에서 실시해야 안전합니다."},{"n":2,"type":"mcq","stem":"피복아크용접기 설치 시 통풍을 양호하게 하려면 벽면으로부터 최소 10cm 이상 이격해야 한다.","choices":["O","X"],"answerIndex":2,"answerText":"② X","explain":"벽면과의 최소 안전 이격 거리는 30cm 이상이어야 열 배출 능력이 원활합니다."},{"n":3,"type":"mcq","stem":"수하특성이란 부하 전류가 증가함에 따라 용접기 단자 전압이 저하하는 특성이다.","choices":["O","X"],"answerIndex":1,"answerText":"① O","explain":"부하 전류가 증가할 때 전압이 수하하는 특성이 수하특성(Drooping)이며 피복아크용접기의 기본 외관 거동입니다."},{"n":4,"type":"mcq","stem":"직류 역극성(DCRP)은 용접봉을 음극(-), 모재를 양극(+)에 연결하는 방식이다.","choices":["O","X"],"answerIndex":2,"answerText":"② X","explain":"용접봉이 양극(+), 모재가 음극(-)인 상태가 직류 역극성(DCRP)입니다."},{"n":5,"type":"mcq","stem":"자동전격방지기(VRD)는 무부하 시 2차측 홀더 전압을 20~30V 이하의 안전한 수준으로 전격 저하시킨다.","choices":["O","X"],"answerIndex":1,"answerText":"① O","explain":"무부하 시 감전을 원천 차단하기 위해 무부하 전압을 20~30V 이하로 낮추어 유지합니다."},{"n":6,"type":"mcq","stem":"이동식 소형 아크 용접기(3kW급)는 1차측 코드선을 전원 콘센트에 직접 끼워 사용할 수 있다.","choices":["O","X"],"answerIndex":1,"answerText":"① O","explain":"소형 인버터식 3kW 이하 용접기는 간편식 220V 코드 콘센트 단독 연결 가동이 규격상 허용됩니다."},{"n":7,"type":"mcq","stem":"전격방지기의 시동 감도가 느린 단점을 지닌 결선 방식은 반도체 소자 무접점 방식이다.","choices":["O","X"],"answerIndex":2,"answerText":"② X","explain":"시동 감도가 낮고 마그네트 수명이 짧은 단점은 '마그네트 접점 방식'의 한계점입니다."},{"n":8,"type":"mcq","stem":"용접 케이블 가공 시, 1차측 입력선 표준 규격이 가늘어지면 전선 저항이 감소하여 출력이 증가한다.","choices":["O","X"],"answerIndex":2,"answerText":"② X","explain":"1차측 선이 규격 미달로 가늘어지면 전선 저항이 상승하여 전압강하와 선 발열 화재를 유발합니다."},{"n":9,"type":"mcq","stem":"용접기 전면 패널의 크레이터 조정 기능은 본 용접 비드가 다 끝나는 종점부에 기공과 언더컷을 예방하기 위한 전류 제어 장치이다.","choices":["O","X"],"answerIndex":1,"answerText":"① O","explain":"크레이터 처리는 마무리 용착 금속 부위의 수축 기공 및 균열 방지를 유전 제어하는 필수 장치입니다."},{"n":10,"type":"mcq","stem":"정격 2차 전류보다 낮은 실제 전류로 용접할 경우 용접기의 허용 사용률은 정격 사용률보다 감소한다.","choices":["O","X"],"answerIndex":2,"answerText":"② X","explain":"낮은 전류를 쓰면 공학 수식상 허용 사용률은 제곱에 비례하여 크게 증가합니다."},{"n":11,"type":"mcq","stem":"다음 아크 용접기의 전기적 출력 특성과 그 정의를 바르게 짝지어 연결하시오. (A) 수하 특성 (가) 아크 길이가 변해도 아크 전류는 전혀 변하지 않는 전류 균일성 (B) 정전류 특성 (나) 부하 전류가 증가하면 단자 전압이 크게 저하하는 전압 강하 특성 (C) 정전압 특성 (다) 부하 전압이 다소 변화해도 단자 전압은 항상 일정하게 유지되는 성질","choices":["(A)-(나), (B)-(가), (C)-(다)","(A)-(가), (B)-(나), (C)-(다)","(A)-(다), (B)-(가), (C)-(나)","(A)-(나), (B)-(다), (C)-(가)"],"answerIndex":1,"answerText":"① (A)-(나), (B)-(가), (C)-(다)","explain":"수하 특성은 부하 전류 증가 시 전압이 강하하는 (나) 특성이며, 정전류 특성은 아크 길이 변동에도 전류가 유지되는 (가) 특성, 정전압은 전압 변동이 억제되는 (다) 특성입니다."},{"n":12,"type":"mcq","stem":"다음 용접기 극성에 따른 발열 및 특징을 바르게 짝지어 연결하시오. (A) 직류 정극성 (DCSP) (가) 양 전극에서 아크 열이 50%씩 균일 배분되며 자기쏠림을 원천 방지함 (B) 직류 역극성 (DCRP) (나) 모재측에 70% 열이 배분되어 용입이 매우 깊고 봉 녹음이 느림 (C) 교류 용접 (AC) (다) 용접봉에 70% 열이 집중되어 용입이 얕고 박판/비철금속에 적합함","choices":["(A)-(나), (B)-(다), (C)-(가)","(A)-(가), (B)-(나), (C)-(다)","(A)-(다), (B)-(나), (C)-(가)","(A)-(나), (B)-(가), (C)-(다)"],"answerIndex":1,"answerText":"① (A)-(나), (B)-(다), (C)-(가)","explain":"정극성(DCSP)은 모재 양극 결선으로 열량 70% 집중(나), 역극성(DCRP)은 용접봉 양극으로 용접봉 70% 발열(다), 교류(AC)는 균등 분배(가) 특성을 보입니다."},{"n":13,"type":"mcq","stem":"다음 누전 예방 전기 설비와 장치의 설명으로 알맞은 관계를 찾아 연결하시오. (A) 배선용 차단기 (NFB) (가) 용접을 중지한 무부하 상태에서 전압을 20~30V의 안전 전압으로 낮춤 (B) 누전 차단기 (ELB) (나) 배전반 메인 계통에 배치되는 과전류 보호용 퓨즈 없는 차단기 (C) 자동 전격 방지기 (다) 분기 분전함의 지락, 누전 발생 시 신속히 부하를 차단하는 장치","choices":["(A)-(나), (B)-(다), (C)-(가)","(A)-(가), (B)-(나), (C)-(다)","(A)-(다), (B)-(나), (C)-(가)","(A)-(나), (B)-(가), (C)-(다)"],"answerIndex":1,"answerText":"① (A)-(나), (B)-(다), (C)-(가)","explain":"메인 개폐기에는 NFB(나), 분기 분전함에는 지락 방지용 ELB(다)가 오며, 전격을 막는 자동전격방지기(가)의 배치 관계입니다."},{"n":14,"type":"mcq","stem":"피복아크용접기 정격 용량(AW)에 따른 표준 1차측 입력 케이블 굵기(지름)의 매칭이 옳은 것은? (A) AW 200 (가) 14.0 mm 이상 수용 (B) AW 300 (나) 5.5 mm 이상 수용 (C) AW 400 (다) 8.0 mm 이상 수용","choices":["(A)-(나), (B)-(다), (C)-(가)","(A)-(가), (B)-(나), (C)-(다)","(A)-(다), (B)-(나), (C)-(가)","(A)-(나), (B)-(가), (C)-(다)"],"answerIndex":1,"answerText":"① (A)-(나), (B)-(다), (C)-(가)","explain":"표준 입력 전선 지름 규격은 AW200이 5.5mm(나), AW300이 8.0mm(다), AW400이 14.0mm(가)입니다."},{"n":15,"type":"mcq","stem":"피복아크용접기 정격 용량(AW)에 따른 표준 2차측 출력 케이블 단면적(㎟) 매칭이 옳은 것은? (A) AW 200 (가) 60 ㎟ 이상 규격 (B) AW 300 (나) 38 ㎟ 이상 규격 (C) AW 400 (다) 50 ㎟ 이상 규격","choices":["(A)-(나), (B)-(다), (C)-(가)","(A)-(가), (B)-(나), (C)-(다)","(A)-(다), (B)-(나), (C)-(가)","(A)-(나), (B)-(가), (C)-(다)"],"answerIndex":1,"answerText":"① (A)-(나), (B)-(다), (C)-(가)","explain":"표준 2차측 출력 전선 단면적 규격은 AW200이 38㎟(나), AW300이 50㎟(다), AW400이 60㎟(가)입니다."},{"n":16,"type":"mcq","stem":"피복아크용접기를 벽으로부터 최소 30cm 이상 이격하여 설치하도록 하는 공학적인 이유로 가장 타당한 것은?","choices":["고전압 입력 시 누설 전류의 전도를 완벽히 격리하기 위해","용접기 내부 부품의 냉각을 위한 풍량 통풍을 원활히 하기 위해","아크 발생 시 주변 도구와의 자기적인 아크 쏠림을 상쇄하기 위해","안전 퓨즈의 기계적 교체를 쉽게 수행하기 위해"],"answerIndex":2,"answerText":"② 용접기 내부 부품의 냉각을 위한 풍량 통풍을 원활히 하기 위해","explain":"용접기 벽면 30cm 이격은 장비 내부 변압기와 인버터 소자 등에서 나오는 열을 배출하고 통풍 냉각하기 위함입니다."},{"n":17,"type":"mcq","stem":"피복아크용접기의 표준 설치 환경 온도로 옳지 않은 것은?","choices":["실내 최저 온도 범위: -10℃ 이상","실내 최고 온도 범위: 40℃ 이하","용접기 보존 특화 온도: 영하 25℃ 이하","표준 유지 적정 주위 온도: 10 ~ 40℃"],"answerIndex":3,"answerText":"③ 용접기 보존 특화 온도: 영하 25℃ 이하","explain":"피복아크용접 장비는 극저온 동결 소손을 예방하기 위해 주변 주위 온도를 -10℃ ~ 40℃ 사이로 조절해야 합니다."},{"n":18,"type":"mcq","stem":"피복아크용접기의 구비 조건에 대한 설명 중 잘못된 것은?","choices":["구조가 간단하고 작동 및 조작이 간편해야 한다.","사용 중 열화 소손을 막기 위해 온도 상승이 적어야 한다.","부하 변동에 강하고 아크가 안정적으로 유지되어야 한다.","직류 용접기는 무부하 전압이 100V 이상이어야 한다."],"answerIndex":4,"answerText":"④ 직류 용접기는 무부하 전압이 100V 이상이어야 한다.","explain":"용접기의 무부하 전압이 너무 높으면 전격 감전 위험이 커집니다. 규정상 직류는 50~60V, 교류는 70~80V 정도를 유지해야 하며, 100V 이상의 초고압은 금지됩니다."},{"n":19,"type":"mcq","stem":"다음 중 교류아크용접기에 전격방지기(VRD)를 장착했을 때 얻을 수 있는 장점에 해당하는 것은?","choices":["무부하 전력의 와류 및 히스테리시스 전력 손실을 크게 억제한다.","용접 입열량이 기하급수적으로 늘어나 용입이 예리해진다.","아크 전류의 크기를 수백 배 증폭하여 고속 용접을 유도한다.","교류의 위상각을 균일하게 보정하여 자기 쏠림을 완전 방지한다."],"answerIndex":1,"answerText":"① 무부하 전력의 와류 및 히스테리시스 전력 손실을 크게 억제한다.","explain":"전격방지기(VRD)는 감전 방지뿐만 아니라 무부하 상태의 불필요한 무부하 전류 흐름을 억제하여 변압기 철심의 와류 손실 및 히스테리시스 손실을 절감하고 전력 절전 효과를 줍니다."},{"n":20,"type":"mcq","stem":"전격방지기의 종류 중 반도체 소자 무접점 방식에 대한 설명으로 옳은 것은?","choices":["구조가 간단하고 무게가 가볍고 가격이 매우 저렴하다.","시동 감도가 빠르고 아크 제어가 정밀하여 가용접이 많은 작업에 적합하다.","외부 누설 자장의 영향으로부터 오동작 우려가 전혀 없다.","습기나 용접 분진에 대단히 강해 실외 현장에서 주로 쓴다."],"answerIndex":2,"answerText":"② 시동 감도가 빠르고 아크 제어가 정밀하여 가용접이 많은 작업에 적합하다.","explain":"반도체 소자 방식(SCR 등 무접점 방식)은 무접점 전기 스위칭 제어를 통해 시동 감도가 극히 신속하여 가용접 및 정밀 미세용접 시공에 탁월합니다. 다만 분진과 습기에는 약합니다."},{"n":21,"type":"mcq","stem":"피복아크용접기 2차 출력 케이블 가공 시 표준 단자(러그) 체결 요령으로 옳은 것은?","choices":["심선의 피복을 벗길 필요 없이 볼트로 강하게 눌러 압착한다.","전선의 구리 소선 중 약 절반가량은 이완 방지를 위해 잘라내고 결속한다.","압착기를 사용하여 규격에 부합하는 동 러그를 빈틈없이 압착해 볼트로 단단히 조인다.","아크 쏠림 예방을 위해 러그 주변에 기름(그리스)을 듬뿍 주유한다."],"answerIndex":3,"answerText":"③ 압착기를 사용하여 규격에 부합하는 동 러그를 빈틈없이 압착해 볼트로 단단히 조인다.","explain":"출력 단자는 피복을 약 1cm 탈피하고 단선 소선 없이 온전히 러그에 삽입한 후, 전용 유압/기계 압착기로 완전 압착 결속하여 나사 결합을 견고하게 하는 것이 표준입니다."},{"n":22,"type":"mcq","stem":"결선된 2차측 충전부 및 단자 접속부의 감전 재해 예방을 위한 마감 조치로 가장 적합한 것은?","choices":["방수 세정을 위해 결선부 주변 바닥에 물을 충분히 살포한다.","도체의 통전을 위해 피복 없이 전선을 구리 전선으로 노출한다.","볼트 체결부 위에 비닐이나 면장갑을 가볍게 씌워 고정해 둔다.","1차로 절연 고무테이프를 감은 후 2차로 비닐테이프로 이중 절연한다."],"answerIndex":4,"answerText":"④ 1차로 절연 고무테이프를 감은 후 2차로 비닐테이프로 이중 절연한다.","explain":"전기 감전 방지용 이중 절연은 1차 절연 고무테이프로 고무 충진 밀착 마감 후, 2차 비닐테이프로 표면을 기계적 마찰로부터 완벽히 보호 및 절연하는 방법입니다."},{"n":23,"type":"mcq","stem":"용접기 배전반 접지 시공 수칙으로 절대 해서는 안 되는 위험천만한 행동은 무엇인가?","choices":["규격 녹색 접지선을 전용 접지극이나 접지봉에 완벽히 접속하는 것","외함 접지 볼트를 멍키스패너로 빈틈없이 결속 고정하는 것","현장 수도 배관이나 접지 공사 단자에 분리형 접지를 시공하는 것","신속한 임시 접지를 위해 가스 수송 배관에 접지 집게를 물리는 것"],"answerIndex":4,"answerText":"④ 신속한 임시 접지를 위해 가스 수송 배관에 접지 집게를 물리는 것","explain":"가스 수송 배관이나 인화성 액체 운반 배관에 용접 전류가 흐르게 되면 아크 불꽃이나 전기 유도로 대형 가스 폭발 화재 참사를 부르므로 절대 금기 사항입니다."},{"n":24,"type":"mcq","stem":"직류 정극성(DCSP)으로 피복아크용접을 할 때 나타나는 일반적인 현상으로 옳은 것은?","choices":["용입이 얕고 비드 폭이 대단히 넓어진다.","모재의 용입이 깊고 비드 폭이 좁아진다.","용접봉의 용융 속도가 아주 빠르고 용입이 없다.","박판 용접이나 비철금속 용접에 주로 응용된다."],"answerIndex":2,"answerText":"② 모재의 용입이 깊고 비드 폭이 좁아진다.","explain":"정극성(DCSP)은 모재가 (+)극이 되며, 전자가 모재와 강하게 충돌하므로 전체 아크 열량의 약 70%가 모재에 집중됩니다. 따라서 깊은 용입과 좁은 비드를 생성하며 후판에 쓰입니다."},{"n":25,"type":"mcq","stem":"직류 역극성(DCRP)이 직류 정극성(DCSP)에 비해 가지는 고유한 장점에 해당하는 시공 대상은?","choices":["고압 중화학 설비용 극후판 합금강 모재","교류 아크 안정성이 우수해 아크 쏠림을 방지해야 하는 후판 탄소강","박판, 주철, 고탄소강, 스테인리스강 및 비철금속의 용접","수하특성을 유지해야 하는 정밀 기계 부품"],"answerIndex":3,"answerText":"③ 박판, 주철, 고탄소강, 스테인리스강 및 비철금속의 용접","explain":"역극성(DCRP)은 용접봉에 열이 70% 집중되므로 모재가 덜 녹아 뚫어지는 용락 현상을 방지합니다. 따라서 녹기 쉬운 박판, 주철, 스테인리스강, 비철금속 용접에 유리합니다."},{"n":26,"type":"mcq","stem":"교류아크용접기가 직류아크용접기와 비교하여 가지는 결정적인 전기 기술적 이점은?","choices":["비피복 용접봉을 사용해도 아크가 대단히 안정된다.","완전무결한 직류 아크 안정을 공급한다.","극성 변화가 임의로 신속하게 이루어진다.","용접부에 발생하는 아크 쏠림(자기 쏠림) 현상을 완벽히 방지한다."],"answerIndex":4,"answerText":"④ 용접부에 발생하는 아크 쏠림(자기 쏠림) 현상을 완벽히 방지한다.","explain":"교류(AC)는 전류의 방향과 세기가 주파수 주기로 주기적 교차 변화하므로 누설 자기장 분포가 상쇄되어 아크가 한쪽으로 밀려 쏠리는 '자기 쏠림(아크 쏠림)' 현상이 발생하지 않습니다."},{"n":27,"type":"mcq","stem":"용접전류 200A, 아크전압 20V, 실제 용접 속도 12cm/min 조건으로 일직선 용접을 수행할 때 발생하는 용접 입열량(H, J/cm)은 얼마인가?","choices":["10,000 J/cm","15,000 J/cm","20,000 J/cm","30,000 J/cm"],"answerIndex":3,"answerText":"③ 20,000 J/cm","explain":"입열량 H = 60 × E × I / v = 60 × 20 × 200 / 12 = 240,000 / 12 = 20,000 J/cm 입니다."},{"n":28,"type":"mcq","stem":"정격 2차 전류가 300A이고, 정격 사용률이 40%인 아크용접기로 실제 200A의 전류로 용접을 가동한다면 이 용접기의 허용 사용률은 몇 %인가?","choices":["60 %","90 %","120 %","180 %"],"answerIndex":2,"answerText":"② 90 %","explain":"허용사용률 = (정격 2차 전류 / 실제 전류)^2 × 정격 사용률 = (300 / 200)^2 × 40 = 2.25 × 40 = 90% 입니다."},{"n":29,"type":"mcq","stem":"아크용접기의 소비전력이 12 kW이고 전원 입력이 15 kVA일 때 이 용접기의 역률은 몇 %인가?","choices":["60 %","70 %","80 %","90 %"],"answerIndex":3,"answerText":"③ 80 %","explain":"역률(%) = 소비전력 / 전원 입력 × 100 = 12 / 15 × 100 = 80% 입니다."},{"n":30,"type":"mcq","stem":"용접기의 아크 출력이 8 kW이고 소비전력이 10 kW일 때 이 용접기의 효율은 몇 %인가?","choices":["60 %","70 %","80 %","90 %"],"answerIndex":3,"answerText":"③ 80 %","explain":"효율(%) = 아크 출력 / 소비전력 × 100 = 8 / 10 × 100 = 80% 입니다."},{"n":31,"type":"mcq","stem":"다음 중 고압 배관 및 탄소강관의 관 두께 규격을 지시하는 '스케줄 번호(SCH No.)'를 바르게 설명한 것은?","choices":["스케줄 번호가 작아질수록 관의 두께가 비례하여 두꺼워진다.","스케줄 번호는 관의 바깥지름(OD)의 치수 밀리미터를 지시하는 값이다.","스케줄 번호가 커질수록 두께가 두꺼워지며 고압 배관용임을 알 수 있다.","스케줄 번호는 용접 시 필요한 가스 퍼징의 단위 유량을 지시한다."],"answerIndex":3,"answerText":"③ 스케줄 번호가 커질수록 두께가 두꺼워지며 고압 배관용임을 알 수 있다.","explain":"압력 배관용 강관 규격에서 스케줄 번호(SCH)는 두께를 의미하며, 번호가 증가할수록 두께가 두꺼워지므로 고압 사양에 해당합니다."},{"n":32,"type":"mcq","stem":"아크용접기 가동 중 용접 전선과 단자 접속부 노화로 인해 연기와 함께 타는 냄새가 날 때 즉각 취해야 할 현장 대책은?","choices":["아크를 끊지 않고 더 높은 고전류로 속도 조정하여 열을 식힌다.","즉시 작업을 멈추고 1차 메인 스위치를 OFF한 뒤 결선부를 정비한다.","발열 부위에 빠르게 냉수를 살포하여 동결 해빙을 유도한다.","전격방지기 Test 스위치를 수차례 눌러 오동작을 상쇄한다."],"answerIndex":2,"answerText":"② 즉시 작업을 멈추고 1차 메인 스위치를 OFF한 뒤 결선부를 정비한다.","explain":"용접기 단자 및 전선 타는 냄새는 이완에 따른 접촉저항 과열이 원인입니다. 아크 발생을 즉각 멈춘 뒤 주 차단기를 차단하고 결선부를 보수해야 화재를 막습니다."},{"n":33,"type":"mcq","stem":"다음 중 인체가 감전되었을 때 흘러 들어가는 전류 크기별 신체적 영향으로 잘못 짝지어진 것은?","choices":["1 mA 내외: 약간 찌릿짜릿한 전격 감각을 인지하는 전격 감지 단계","5 mA 내외: 심한 통증을 느끼며 근의 수의적 자유 통제가 가능한 한계 단계","20 mA 내외: 근육이 극심하게 경련하고 수축되어 움직일 수 없는 불수의 상태","100 mA 내외: 대단히 안전하여 전격 저항 절전 효율이 극대화되는 상태"],"answerIndex":4,"answerText":"④ 100 mA 내외: 대단히 안전하여 전격 저항 절전 효율이 극대화되는 상태","explain":"100mA 수준의 전류가 인체에 흐르면 심실세동을 유발하여 심장 정지와 함께 사망에 이르는 치명적인 고위험 감전 한계치입니다."},{"n":34,"type":"mcq","stem":"인버터식 DC 아크용접기 설치 가동을 위한 결선 시, '직류 정극성(DCSP)'으로 표준 시공하고자 한다. 단자 결선 매칭이 올바른 것은?","choices":["용접기 (+)단자: 용접봉 홀더선 / (-)단자: 모재 접지 클램프선","용접기 (+)단자: 모재 접지 클램프선 / (-)단자: 용접봉 홀더선","용접기 (+)단자: 입력 메인 가선 L1선 / (-)단자: 누전 어스선","용접기 (+)단자: 누전 차단기 중성선 / (-)단자: 전격방지기 신호선"],"answerIndex":2,"answerText":"② 용접기 (+)단자: 모재 접지 클램프선 / (-)단자: 용접봉 홀더선","explain":"직류 정극성(DCSP)은 용접봉 홀더를 음극(-)에, 모재(작업대 어스)를 양극(+)에 체결하는 배선 구조입니다."},{"n":35,"type":"mcq","stem":"피복아크용접기 부속장치 중 '핫 스타트(Hot Start)' 장치의 사용 목적과 이점으로 틀린 것은?","choices":["초기 아크 점화 순간에만 용접 전류를 정격 전원 이상으로 자동 순간 증폭시킨다.","아크 발생 시 시작점 부위의 용융을 쉽게 하여 아크 스타트를 원활하게 돕는다.","초기 비드 시점의 기공(Blow Hole)과 슬래그 혼입 결함을 완전 예방한다.","전격방지기 2차 무부하 전압을 상시 5V 이하로 일정하게 보존 유지한다."],"answerIndex":4,"answerText":"④ 전격방지기 2차 무부하 전압을 상시 5V 이하로 일정하게 보존 유지한다.","explain":"핫 스타트 장치는 스타트 시점의 국부 고전류 인가 장치로, 초기 용입 증진 및 결함 예방용입니다. 전격방지 무부하 전압 제어와는 전혀 무관합니다."},{"n":36,"type":"short","stem":"정격 2차 전류가 400A이고, 정격 사용률이 40%인 아크용접기로 실제 200A의 전류로 아래보기 맞대기용접을 수행하려 한다. 이 용접기의 안전 작동 한계치인 '허용 사용률(%)'을 구하는 식과 최종 답안을 명확히 쓰시오.","choices":[],"answerIndex":null,"answerText":"160%","explain":"허용사용률은 실제 전류의 반비례 제곱에 비례하므로 (400/200)^2 * 40 = 160%가 됩니다."},{"n":37,"type":"short","stem":"아크용접기를 가동하여 실제 10분 동안 아크를 연속 발생시킨 시간이 4분이고, 다음 아크 시점까지 정지하고 대기(휴식)한 시간이 6분이다. 이 용접기의 '실제 사용률(%)'을 구하는 공식과 답안을 명확히 제시하시오.","choices":[],"answerIndex":null,"answerText":"40%","explain":"10분을 기준으로 총 4분 아크 발생이므로 실제 사용률은 40%입니다."},{"n":38,"type":"short","stem":"아크전류 200A, 아크전압 30V, 실제 진행 속도 15cm/min 조건으로 판재 용접부 비드잇기를 완수하였다. 이 용접부 단위길이 1cm당 외부로부터 가해진 전기적 에너지인 '용접 입열량(H, J/cm)'을 구하는 공식과 풀이 과정 및 정답을 기술하시오.","choices":[],"answerIndex":null,"answerText":"24,000 J/cm","explain":"E=30V, I=200A, v=15cm/min이므로 공식에 대입하면 24,000 J/cm이 산출됩니다."},{"n":39,"type":"short","stem":"아크용접기 규격 표준 사양서 명판에 '소비전력 15 kW, 전원 입력 20 kVA'로 지시되어 있다. 이 용접기의 전기 에너지 유효 효율 지수인 '역률(%)'을 구하는 공식과 정답을 쓰시오.","choices":[],"answerIndex":null,"answerText":"75%","explain":"역률은 유효소비전력 15kW를 피상전력 입력 20kVA로 나눈 비율이므로 75%입니다."},{"n":40,"type":"short","stem":"어느 용접기의 아크 출력이 9 kW이고, 용접기 자체 변압 및 내부 전력 손실을 포함해 실제로 한 시간 동안 계측된 소비전력이 12 kW이다. 이 용접기의 전력 '효율(%)'을 계산 공식과 함께 구하시오.","choices":[],"answerIndex":null,"answerText":"75%","explain":"효율은 실제 아크 에너지로 전사된 출력을 총 소비전력으로 나눈 값인 75%입니다."},{"n":41,"type":"short","stem":"교류아크용접기(AW) 규격 표준(KS C 9602) 중 'AW-300' 모델의 교류 피복 아크용접기가 보장하는 최고 2차 무부하 전압 규격(V)은 몇 V 이하인지 명확한 수치를 쓰시오.","choices":[],"answerIndex":null,"answerText":"85V 이하","explain":"KS C 9602 최고 무부하 전압은 AW-200·300·400이 85V 이하, AW-500만 95V 이하이다. 따라서 AW-300은 85V 이하이다."},{"n":42,"type":"short","stem":"교류아크용접기(AW) 규격 표준 중 공업용 및 대형 후판 설비에 대폭 쓰이는 'AW-500' 용접기 모델이 견딜 수 있는 최고 2차 무부하 전압(V)의 정밀 한계 수치는 몇 V 이하인가?","choices":[],"answerIndex":null,"answerText":"95V 이하","explain":"KS C 9602에서 AW-500의 최고 2차 무부하 전압은 95V 이하로 규정된다. 86V라는 규격값은 없다."},{"n":43,"type":"short","stem":"아크용접기의 출력 전류가 흘러가도 전압 변동에 흔들리지 않고 일정한 전류가 항상 유지되어 용접사의 손 미숙에 따른 전력 이완을 방지해주는 피복아크용접기 고유의 출력 특성 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"정전류 특성 (Constant Current Characteristic)","explain":"아크 길이가 불안정하게 요동쳐도 용접전류가 일정 수준으로 부합 제어되는 특성을 정전류 특성이라 부릅니다."},{"n":44,"type":"short","stem":"교류아크용접기 1차 배선용 차단기(NFB)에서 용접기 입력 단자로 직접 수용되는 1차측 입력 전원의 두 가닥 중, 정격 사용 전류 300A(AW-300) 장비일 때 구비해야 할 '최소 케이블 규격 지름(mm)'은 몇 mm 이상인가?","choices":[],"answerIndex":null,"answerText":"8 mm 이상","explain":"정격 300A 장비용 1차 입력 케이블의 최소 표준 규격 지름은 8.0mm 이상으로 규정되어 있습니다."},{"n":45,"type":"short","stem":"피복아크용접기 정격 사용 전류 400A(정류기형 400A 포함)의 대형 장비를 현장에 안전 결선하여 가동하려 한다. 이때 구비해야 하는 2차측 출력 케이블(홀더선 및 모재 접지선)의 '최소 단면적 규격(㎟)'은 얼마인가?","choices":[],"answerIndex":null,"answerText":"60 ㎟ 이상","explain":"정격 400A의 장비 성능을 감안한 2차 출력 전용 캡타이어선 케이블의 최소 단면적 규격은 60 ㎟ 이상입니다."},{"n":46,"type":"short","stem":"인버터식 DC 피복아크용접기를 가동하여 모재를 아주 깊고 예리하게 용입시키는 동시에, 비드 폭이 대단히 조밀한 비드를 만들고자 한다. 이때 결선해야 하는 직류 극성의 공학적 명칭(풀네임 또는 표준 약어)을 쓰시오.","choices":[],"answerIndex":null,"answerText":"직류 정극성 (DCSP 또는 DCEN)","explain":"모재 측에 70% 고열량이 집중되어 깊은 용입과 조밀 비드를 얻을 수 있는 결선 방식은 직류 정극성입니다."},{"n":47,"type":"short","stem":"박판 연강재나 합금강, 주철 및 스테인리스강과 같이 열 전도율 및 열 팽창이 심해 용접부가 쉽게 뚫리는 용락 결함을 원천 예방해야 하는 모재에 시공할 때, 아크 열을 용접봉 홀더 측으로 70% 집중시키는 '직류 극성'의 명칭을 명확히 기재하시오.","choices":[],"answerIndex":null,"answerText":"직류 역극성 (DCRP 또는 DCEP)","explain":"용접봉 홀더 측에 열을 집중시켜 모재의 과도한 열 손상을 방지하고 얕은 용입을 확보하는 극성은 직류 역극성입니다."},{"n":48,"type":"short","stem":"감전 재해 예방을 위한 자동 전격 방지기(VRD)를 용접기에 외장하여 취부하고자 한다. 이때 전격방지기 외함을 부착하는 '표준 부착 각도' 및 '허용 오차 범위(기울기 도수)' 규격을 명확히 기입하시오.","choices":[],"answerIndex":null,"answerText":"수직(직각) 부착, 기울기 각도 20도 이내","explain":"오동작 차단을 위해 연직 수직으로 부착하는 것이 정석이며, 불합리한 공간 등 특수 경우에도 20도 이내로 설치해야 안전합니다."},{"n":49,"type":"short","stem":"용접 케이블 가공 중 탈피와 러그 압착을 완료한 뒤 단자 접촉 이완 과열을 방지하기 위해 가하는 테이핑 마감 시, 이중 보호막을 위해 순차적으로 사용해야 하는 두 가지 절연 테이프 명칭을 순서대로 명확히 기술하시오.","choices":[],"answerIndex":null,"answerText":"절연 고무테이프, 절연 비닐테이프","explain":"1차로 연신율이 우수해 밀착도가 좋은 고무테이프를 사용하고, 그 위에 2차로 외부 습기 및 마찰 보호용 비닐테이프를 감는 것이 정석 이중 보수법입니다."},{"n":50,"type":"short","stem":"현장 가설 분전함 설계 수칙 중, 용접 배선 설비 계통 전반을 보호하고 차단하는 메인(Main) 개폐기와 분기 개폐기(Branch)에 각각 장착해야 하는 '표준 전기 차단기 두 가지 종류'의 명칭을 순서대로 쓰시오.","choices":[],"answerIndex":null,"answerText":"배선용 차단기 (NFB), 누전 차단기 (ELB)","explain":"배전 계통 제어에는 퓨즈 없는 배선용 차단기(NFB)를 설치하고, 분기 라인에는 작업자 누전 보호를 위해 감도가 우수한 누전 차단기(ELB)를 이원 설치합니다."}]},"7":{"unit":7,"title":"피복아크용접 가용접 작업","code":"LM1601050105","group":"피복아크용접","theory":[{"t":"h2","v":"제1장. 피복아크용접 가용접 작업 NCS 핵심 요약"},{"t":"h3","v":"1. 가용접(Tack Welding)의 본질적 메커니즘과 중요성"},{"t":"p","v":"가용접(태그용접)은 본용접을 수행하기 전, 설계 도면에 정의된 정확한 조립 치수와 개선(Groove) 홈 형상, 루트 간격(Gap)을 일시적으로 고정하기 위해 이음부에 시행하는 짧은 비드의 임시 용접입니다. 많은 작업자들이 가용접을 단순히 거쳐가는 임시 단계로 경시하는 경향이 있으나, 가용접부는 대부분 본용접 비드 내부로 완전히 융합되어 최종 제품의 일부분으로 남게 됩니다."},{"t":"p","v":"특히 가용접은 용착 부피가 매우 작은 상태에서 모재의 거대한 냉각 흡열작용으로 인해 매우 극심한 '급랭(Rapid Cooling)'을 겪게 되므로 기공(Blow hole), 슬래그 혼입, 저온 균열 등의 용접 결함이 본용접에 비해 훨씬 쉽게 발생합니다. 따라서 가용접은 본용접사 이상의 기량을 가진 숙련자가 동일한 조건에서 규정된 예열 온도를 완벽하게 준수하며 견고하게 시공해야만 안전한 구조물 강도를 얻을 수 있습니다."},{"t":"h3","v":"2. 가용접 비드의 길이 및 배치 간격 표준 규격"},{"t":"p","v":"판 두께 및 구조적 중요성에 따른 가용접의 공학적 설계 수치 기준은 아래와 같이 엄격히 한정됩니다."},{"t":"table","rows":[["모재 판 두께 (t)","표준 가용접 비드 길이","가용접 배치 간격 수칙"],["t ≤ 3.2 mm (박판)","30 mm 이상","일반적으로 모재 두께(t)의 15 ~ 30배(15~30t) 간격으로 균일하게 배치합니다."],["3.2 mm < t ≤ 25 mm (중판)","40 mm 이상","대형 구조물이나 균열 위험도가 높은 중후판의 이음부에서는 강성을 확보하기 위해 간격을 보정합니다."],["t > 25 mm (후판)","50 mm 이상","강성 구속력이 크므로 충분한 길이와 강력한 구속성을 유지할 수 있도록 피치를 산정합니다."]]},{"t":"p","v":"★ 주의사항: 강도적 측면에서 가장 취약하거나 물리적 힘이 집중되는 '응력 집중부(응력 집중 구역)'인 부품의 맨 끝단 모서리, 급격한 단차부, 각진 코너 지역은 응력의 누적으로 결함 발생이 매우 빈번하므로 원칙적으로 가용접 위치로 지정하는 것을 금지합니다. 단, 자격시험 및 규정된 시험편 제작 시에는 모재의 가용 구간을 최대화하기 위하여 한시적으로 허용됩니다."},{"t":"h3","v":"3. 가용접 전기 제어 및 운봉 조건"},{"t":"li","v":"적정 용접봉 지름: 가용접은 단시간 내에 확실한 슬롯 용입과 비드 안착을 위해 본용접에 사용되는 지름보다 한 단계 가는(소경) 용접봉을 사용합니다."},{"t":"li","v":"전류 제어 수칙: 짧은 아크 기둥으로 순간적인 융합을 이끌어내기 위해, 용융 효율을 높이도록 본용접의 규정 전류 범위보다 약간 높은 전류값(고전류)을 가용접 조건으로 조정하여 가동합니다."},{"t":"li","v":"가용접 결함 보수: 본용접 개시 전에 홈 내부 가용접 비드 표면의 슬래그 결함은 와이어브러시와 해머링으로 완전히 털어내야 하며, 결함이 내포된 가접 비드는 본용접 열량으로 녹이려 하지 말고 그라인더나 백치핑(Back Chipping)을 가해 완전히 깎아낸 뒤 재시공해야 결함 합치를 방지할 수 있습니다."},{"t":"h3","v":"4. 용접 변형 방지를 위한 4대 시공 대책"},{"t":"p","v":"금속은 고온 가열 시 팽창하고 냉각 시 거칠게 수축하는 성질이 있습니다. 용접부는 극부 열집중으로 인해 강한 인장 잔류응력과 굴곡 변형이 유발되며, 이를 방지하기 위한 엔지니어링 시공 기법은 다음과 같이 4가지 계통으로 구분됩니다."},{"t":"li","v":"억제법(구속법): 클램프, 볼트, 조립 지그, 혹은 스트롱백(Strong Back) 등의 구속 전용 장치를 기계적으로 부착해 용접부 수축 거동을 원천적으로 억제하는 공법입니다. 변형 방지율은 최고이나 내부에 극심한 잔류응력이 가두어지므로 균열 감수성이 높은 고장력강에는 사후 균열을 예방하기 위해 구속도를 완화해야 합니다."},{"t":"li","v":"역변형법(사전 변형법): 용접 후 열변형에 의해 휘어지거나 꺾일 방향과 변형량을 시공 전에 경험적으로 예측하여, 그 양만큼 반대 방향으로 2~3°가량 역각도를 준 상태에서 조립하는 공법입니다. (굽힘 수축 각변형 대응에 탁월)"},{"t":"li","v":"루트 간격 역변형량 공식: 모재가 전방으로 전진 용접되면서 점점 수축하여 루트 갭이 닫히는 현상을 극복하기 위해 종점부 갭을 더 넓게 가접합니다. 공식: D = d + 0.015L (d=시작 갭, D=끝단 갭, L=전체 용접 길이)"},{"t":"li","v":"냉각법(도열법): 용접부 배면이나 열 영향부에 수랭식 구리 동판을 긴밀하게 밀착시키거나 석면포 냉각, 살수법(물 뿌리기)을 가해 아크 열량이 주변 모재로 확산되는 것을 급속도로 차단(도열)하여 열영향부(HAZ) 면적을 극소화하고 변형을 줄이는 공법입니다."},{"t":"li","v":"가열법(예열공법): 용접부 전체 또는 주변 국부 구역을 사전에 토치 등으로 균일하게 가열하여 아크열과 모재 간의 온도 경사(Gradient)를 완만하게 만듦으로써, 열충격을 방지하고 급랭을 억제하여 변형력을 고르게 분산시키는 시공법입니다."},{"t":"h3","v":"5. 용접 구조물의 안전성 산정 안전율 기준"},{"t":"p","v":"용접 이음부가 가해지는 외력(하중)의 성질과 운전 조건에 견딜 수 있도록 보수적 설계 한계를 정하는 물리적 지수를 안전율(Safety Factor)이라 합니다. 하중의 작용 특성에 따른 안전율 기준은 ASME 및 일반 공업 규격에서 다음과 같이 명확히 규정하고 있습니다. (안전율 = 극한강도 / 허용응력)"},{"t":"li","v":"정하중(Static Load) 조건: 안전율 = 3"},{"t":"li","v":"동하중(Dynamic Load) 조건: 안전율 = 5"},{"t":"li","v":"충격하중(Impact Load) 조건: 안전율 = 8"},{"t":"li","v":"교번하중(Alternative Load) 조건: 안전율 = 12"},{"t":"h2","v":"제2장. NCS 피복아크용접 가용접 작업 대표 엄선 50제"}],"questions":[{"n":1,"type":"mcq","stem":"능력단위 '피복아크용접 가용접 작업' 학습모듈의 대원칙에 따라, 가용접(Tack welding) 시 비드 표면에 형성되는 슬래그와 결함에 대한 보수 조치로 가장 올바른 지침은 무엇입니까?","choices":["슬래그는 대기 차폐 기능을 하므로 제거하지 않고 그대로 본용접을 진행하여 융합시킨다.","가용접 결함부는 본용접의 고열량 아크 열로 완전 융융 처리가 가능하므로 보수하지 않아도 무방하다.","가용접 완료 후 와이어브러시와 치핑망치로 슬래그를 완전히 제거하고 결함 발견 시 그라인더로 깎아낸 뒤 본용접을 개시해야 한다.","박판 용접에 한하여 슬래그 혼입 부위 위에 덧살올림을 1패스 추가하여 피닝한다."],"answerIndex":3,"answerText":"③ 가용접 완료 후 와이어브러시와 치핑망치로 슬래그를 완전히 제거하고 결함 발견 시 그라인더로 깎아낸 뒤 본용접을 개시해야 한다.","explain":"가용접부에 발생된 슬래그는 슬래그 섞임, 기공, 융합 불량 등의 중대 결함 원인이 됩니다. 따라서 본용접 실시 전에 철솔(와이어브러시)과 슬래그망치로 완전히 제거해야 하며, 결함이 발견된 가접부는 그라인더나 정으로 완전히 깎아낸 후 용접해야 본용접부의 품질 결함 합치를 예방할 수 있습니다."},{"n":2,"type":"mcq","stem":"피복아크용접 가용접부 설계 기준에 의거하여, 모재의 두께가 9.0 mm(중판)일 때 적용되는 표준 가용접 비드의 단일 최소 길이는 얼마입니까?","choices":["20 mm 이상","30 mm 이상","40 mm 이상","50 mm 이상"],"answerIndex":3,"answerText":"③ 40 mm 이상","explain":"NCS 학습모듈 표준 가용접 비드 길이에 따르면 판 두께 3.2mm 이하는 30mm, 3.2mm 초과 25mm 이하는 40mm, 25mm 이상은 50mm 이상으로 규정하고 있습니다. 모재 판 두께가 9.0mm이므로 40mm 이상이 정확한 최소 규격입니다."},{"n":3,"type":"mcq","stem":"용접 변형 방지 대책 중 하나인 '역변형법'을 적용하고자 합니다. 이음부 수평 횡방향 각변형을 방지하기 위하여 가용접(가접) 단계에서 조립 시 사전에 꺾어 주어야 하는 경험상의 표준 적정 역변형 각도는 얼마입니까?","choices":["0.5 ~ 1.0°","2 ~ 5°","10 ~ 15°","15 ~ 30°"],"answerIndex":2,"answerText":"② 2 ~ 5°","explain":"피복아크용접 및 타 용접 맞대기 이음 가접에서 각변형 방지를 위해 사전에 주는 역변형량은 모재 두께와 용접 조건에 따라 차이가 있으나, 경험상 2°~5° 범위에서 반대 방향으로 꺾어 가접하는 것이 가장 표준적인 각도 시공법입니다."},{"n":4,"type":"mcq","stem":"용접 설계 구조물의 강도 안전성을 검토하기 위해 '안전율(Safety Factor)'을 산정하고자 합니다. 이음부에 심한 진동이나 방향 변환이 주기적으로 작용하는 '교번하중(Alternative Load)'이 가해질 때 적용되는 정석 안전율 수치는 얼마입니까?","choices":["3","5","8","12"],"answerIndex":3,"answerText":"③ 8","explain":"언윈(Unwin) 안전율은 정하중 3, 동하중(편진 반복) 5, 교번하중(양진) 8, 충격하중 12다. 따라서 교번하중은 8이다."},{"n":5,"type":"mcq","stem":"용접 구조물의 조립 및 가용접 작업 단계에서 부품의 특정 부위에 변형 방지 조치 없이 가접할 경우 응력 누적으로 크랙이 발생하기 쉬운 '가용접 금지 구역'에 해당하지 않는 곳은 어디입니까?","choices":["판재의 외곽 모서리 끝단부","단면이나 각도가 급격히 일그러진 응력집중부","본용접 시초선 및 최종 크레이터 종점부","용접선 길이 중간의 홈 내 대칭 지점"],"answerIndex":4,"answerText":"④ 용접선 길이 중간의 홈 내 대칭 지점","explain":"응력이 고도로 집중되는 부품의 끝, 모서리, 각진 곳 등은 가용접을 피하는 것이 대원칙입니다. 용접선 길이 중간이나 홈 중앙의 분산 포인트는 대칭법이나 스킵법 조립에 유리한 곳으로 가접 배치 간격의 대상 지점이 됩니다."},{"n":6,"type":"mcq","stem":"피복아크 가용접(Tack welding) 시 아크의 즉각적인 점화와 융합 결함 예방을 위한 전기적 조건 설정 수칙으로 가장 타당한 설명은 무엇입니까?","choices":["아크를 길게 유지하기 위해 본용접 대비 매우 낮은 극저전류를 선정한다.","아크 발생의 용이성을 확보하기 위해 본용접 전류값보다 다소 높은 전류값(고전류)을 적용한다.","용접봉의 소모를 방지하기 위해 정격 전류의 50% 이하의 특수 수하특성을 유지한다.","무조건적으로 직류 역극성만을 고정 배선하여 아크 쏠림을 활성화한다."],"answerIndex":2,"answerText":"② 아크 발생의 용이성을 확보하기 위해 본용접 전류값보다 다소 높은 전류값(고전류)을 적용한다.","explain":"가용접은 매우 짧은 비드를 시공하는 특성상 아크 시작 결함이나 융합 불량을 방지해야 합니다. 따라서 아크 점화(Start)가 극히 쉽고 모재의 국부적 급랭 냉각에 열량을 신속 공급할 수 있도록 본용접 전류 범위의 상한값 수준이나 다소 높은 전류(고전류) 조건을 인가하여 시공하는 것이 이상적입니다."},{"n":7,"type":"mcq","stem":"용접 후 변형이 발생하였을 때, 비교적 두께가 얇은 박판(3.0 mm 이하) 강판에 열적 소성변형을 가해 국부 수축으로 변형을 똑바로 교정하는 공학적 가열 교정 공법의 명칭은 무엇입니까?","choices":["직선 수축법 (선상 가열법)","점 수축법 (점 가열법)","수랭 동판 도열법","피닝법 (Peening)"],"answerIndex":2,"answerText":"② 점 수축법 (점 가열법)","explain":"박판 구조물에 유발된 변형 교정은 가열 온도 500~600℃ 정도로 30초 내외 단시간 가열 후 급랭하여 교정하는 '점 수축법(점 가열법, 가열부 지름 20~30mm)'이 주로 사용됩니다. 반면 형재(H빔, 앵글 등)나 긴 구조물의 선형 변형에는 '직선 수축법(선상 가열법)'이 표준 교정 공법으로 채택됩니다."},{"n":8,"type":"mcq","stem":"용접 수축 변형을 기계적으로 완전 구속하여 방지하는 '억제법(구속법)'에서 주로 사용되는 조립 치공구 중, 맞대기 이음부의 양 강판 각변형(뒤틀림)을 구속하기 위해 배면에 임시 부착하는 보강 고정구의 명칭은 무엇입니까?","choices":["턴 테이블 (포지셔너)","스트롱 백 (Strong Back)","엘보 앵글 지그","캠브리지 측정 게이지"],"answerIndex":2,"answerText":"② 스트롱 백 (Strong Back)","explain":"맞대기 이음이나 판재 조립 시 각변형 및 뒤틀림 변형을 강제 억제(구속)하기 위하여 용접선 배면 또는 날개부에 용접 고정하는 전용 고정구를 스트롱 백(Strong Back) 또는 구속 바라고 부릅니다. 이는 강력한 변형 억제력을 제공합니다."},{"n":9,"type":"mcq","stem":"다음 중 가용접 간격(Tack pitch) 산정 시, 모재 두께 t가 12.0 mm인 강판의 표준 가용접 배치의 공학적 간격 한계치로 가장 적절한 범위는 무엇입니까?","choices":["30 ~ 60 mm","60 ~ 120 mm","180 ~ 360 mm","720 ~ 960 mm"],"answerIndex":3,"answerText":"③ 180 ~ 360 mm","explain":"NCS 가용접 기준에 의하면 가용접 배치의 적정 피치 간격은 모재 판 두께 t의 15배에서 30배(15t ~ 30t)입니다. 판 두께 t가 12.0mm이므로, 최소 간격 = 12 * 15 = 180mm이며, 최대 간격 = 12 * 30 = 360mm입니다. 따라서 180~360mm 범위가 수학적으로 타당합니다."},{"n":10,"type":"mcq","stem":"길이가 500 mm인 맞대기이음 용접부를 역변형 갭 수축 공식을 활용하여 조립하려고 합니다. 시작점의 루트 간격을 d = 3.0 mm로 설정하였을 때, 용접 전진 시 수축 폐쇄 거동을 보상하기 위한 종점부(끝단)의 예측 루트 간격 D는 몇 mm가 되도록 가접해야 합니까?","choices":["3.0 mm","5.5 mm","7.5 mm","10.5 mm"],"answerIndex":4,"answerText":"④ 10.5 mm","explain":"종점부의 역변형 갭 보상 공식인 D = d + 0.015 * L을 활용합니다. 여기서 d = 3.0 mm 이고, 전체 용접 길이 L = 500 mm 이므로, D = 3.0 + 0.015 * 500 = 3.0 + 7.5 = 10.5 mm가 됩니다. 따라서 종점부 루트 간격을 10.5mm로 벌려 조립해야 최종 이면비드가 오차 없이 형성됩니다."},{"n":11,"type":"mcq","stem":"다층 용접 시공 시, 각 층마다 비드를 조금씩 단계적으로 쌓아가며 최종 층까지 결합시켜 나가는 방식으로서 고정 및 구속력이 극도로 강한 '중후판의 구속용접 균열 방지'에 가장 탁월한 블록형 용착 시공법은 무엇입니까?","choices":["블록법","전진법","빌트업법","캐스케이드법"],"answerIndex":1,"answerText":"① 블록법","explain":"블록법(Block sequence)은 부분적으로 최종 층까지 용접을 완성시킨 후 순차적으로 다른 블록으로 전진 이행하는 특수 용착 시공법입니다. 수축 변형을 극도로 구속해야 하는 후판 및 중구조물의 구속 용접에서 고온/저온 균열을 전면 방지하기 위해 비석법(스킵법) 등과 조합되어 활용됩니다."},{"n":12,"type":"mcq","stem":"가용접 및 가공 측정 단계에서 다목적으로 활용되는 '캠브리지 게이지(Cambridge gauge)'를 사용하여 정밀하게 측정하거나 판독할 수 없는 항목은 무엇입니까?","choices":["용접부 개선 그루브 각도","용접 비드 표면의 언더컷 깊이","용착부의 비괴 파괴 초음파 내부 결함 위치 및 반사 파형","필릿 용접부의 각장(Leg length) 및 비드 높이"],"answerIndex":3,"answerText":"③ 용착부의 비괴 파괴 초음파 내부 결함 위치 및 반사 파형","explain":"캠브리지 게이지는 언더컷 깊이, 비드 높이, 각장, 필릿 치수, 개선 홈 각도 등을 신속 정확하게 현장에서 수작업 측정하는 다목적 기계식 게이지입니다. 초음파 탐상이나 비파괴 탐상의 반사 파형 확인 등은 전자 탐상 장비(UT)가 필요하므로 기계식 게이지로는 측정할 수 없습니다."},{"n":13,"type":"mcq","stem":"용접부 변형의 원인 중 하나인 열전도를 국부적으로 차단하여 열영향부 면적을 영구 차단하는 '냉각법(도열법)'의 상세 시공 방식으로 부적절한 사례는 무엇입니까?","choices":["용접부 배면이나 좌우에 구리 동판을 긴밀하게 대어 열을 유도 흡수시킨다.","박판 용접 시 뒷면에 살수 장치로 직접 분무 냉각하는 살수법을 병용한다.","용접 열에 도열 기능을 확보하기 위해 물에 적신 석면포를 용접선 인근에 덮는다.","용융 금속부와 아크 기둥에 직접 찬물을 대량 살수하여 아크 방전을 냉각 억제한다."],"answerIndex":4,"answerText":"④ 용융 금속부와 아크 기둥에 직접 찬물을 대량 살수하여 아크 방전을 냉각 억제한다.","explain":"냉각법(도열법)은 열영향부(HAZ) 주변의 열 확산을 억제하기 위해 수랭 동판 배치, 살수, 적신 석면포 등을 주변 모재나 배면에 대어 도열하는 공법입니다. 활성화된 아크 기둥이나 녹아있는 용융풀(용융 금속부)에 직접 다량의 물을 살수할 경우 강력한 산화/질화 작용 및 급랭으로 아크 소멸, 금속 조직 취화 및 심각한 전격 감전 사고를 유발하므로 절대 금지합니다."},{"n":14,"type":"mcq","stem":"과정평가형 시험 및 현장 실무에서 용접 조형물 조립이나 기계 부품 조립 시, 모재가 수평 정반 및 조립대 바닥면과 정밀 직각 수직이 되도록 정위치 고정하는 목적으로 사용되는 필수 수공구 및 측정 치공구 조합으로 옳은 것은 무엇입니까?","choices":["마그네틱 직각 자석 및 직각자(Square)","그라인더 연삭지석과 버니어캘리퍼스","피닝 해머와 콤비네이션 집게","철솜과 슬래그 게이지"],"answerIndex":1,"answerText":"① 마그네틱 직각 자석 및 직각자(Square)","explain":"모재 두 장을 정위치 각도(90도 수직)로 정확히 가조립 가접하기 위해서는 마그네틱 직각 자석척(Magnetic chuck)이나 정밀 직각자(Square)를 활용해 단차와 각도를 완전 교정한 상태에서 고정 후 시공하는 것이 조립 불량을 전면 예방하는 표준 기법입니다."},{"n":15,"type":"mcq","stem":"용접 이음 설계 단계에서, 용접 구조물의 변형을 원천적으로 억제하기 위한 설계적 변형 예방 조치 중 잘못된 방안은 무엇입니까?","choices":["용접 설계 시 가급적 필릿 용접에 의존하고 겹치기 구조를 무제한 확장한다.","용접부가 너무 겹치거나 고밀도로 밀집되지 않도록 배치 설계를 분산한다.","강성을 균일하게 보강하기 위하여 가능한 대칭형 및 회전 대칭 설계형으로 배치한다.","구조물의 하중 한도 내에서 개선 홈 각도를 되도록 작게 하여 용착량을 최소화한다."],"answerIndex":1,"answerText":"① 용접 설계 시 가급적 필릿 용접에 의존하고 겹치기 구조를 무제한 확장한다.","explain":"용접 변형 방지를 위한 적정 설계 원칙에 의하면 용착량을 강도상 필요한 최소한으로 규정하기 위해 개선 각도를 되도록 작게 유지하고, 긴 연속 용접을 피해야 하며, 불필요한 이음 중복을 피해야 합니다. 불필요한 겹치기 구조의 확장은 오히려 용착 부피 증가와 열 변형 응력 누적을 초래하므로 지양해야 합니다."},{"n":16,"type":"mcq","stem":"가용접 후 본용접을 개시하기 전에, 가접 비드의 상태를 최종 육안 검사(VT)하는 항목으로 판정 타당성이 적은 것은 무엇입니까?","choices":["가용접 비드의 길이 및 폭 치수가 도면 규격에 부합하는지 여부","두 모재 이음면의 배면 단차 및 어긋남 오차가 허용공차(0.1t 이하) 범위 내인지 여부","가용접 비드 내부에 균열이나 조대한 블로홀(기공) 등 육안 결함이 박리되어 존재하는지 여부","사용 예정인 본용접기 내부 전해 콘덴서의 잔류 전압 전하량"],"answerIndex":4,"answerText":"④ 사용 예정인 본용접기 내부 전해 콘덴서의 잔류 전압 전하량","explain":"가용접 검사는 조립 치수, 단차 어긋남 상태, 가접 비드의 균열/슬래그 유무를 판단하는 외관 검사가 중심입니다. 본용접기 내부 전해 콘덴서의 잔류 전하량이나 회로 측정은 장비 설치/점검 항목이며, 가조립 가용접의 품질 판정과는 무관합니다."},{"n":17,"type":"mcq","stem":"용접 설계에서 이음부의 인장 한도를 보장하기 위해 사용하는 '이음 효율(Joint Efficiency)' 공식을 바르게 나타낸 것은 무엇입니까?","choices":["이음 효율 = (모재의 인장강도 / 용접 시험편의 인장강도) * 100","이음 효율 = (용접 시험편의 인장강도 / 모재의 인장강도) * 100","이음 효율 = (극한 하중 / 안전율) * 100","이음 효율 = (실제 목두께 / 이론 목두께) * 100"],"answerIndex":2,"answerText":"② 이음 효율 = (용접 시험편의 인장강도 / 모재의 인장강도) * 100","explain":"용접이음의 성능 효율을 수치화하는 이음 효율 공식은 이음 효율 = (용접 시험편의 인장강도 / 모재의 인장강도) * 100 [%]로 정의됩니다. 연강 및 고품질 이음부에서는 용착부 인장강도가 모재보다 강해 모재 파단이 일어남으로써 효율 100%를 보증하는 경우가 많습니다."},{"n":18,"type":"mcq","stem":"가용접 시 본용접용 피복아크 용접봉보다 다소 얇은 용접봉을 사용해야 하는 주요 기술적 이유는 무엇입니까?","choices":["용접봉의 용착 능률을 무조건 높이기 위해","좁은 홈에서 신속한 아크 점화와 용입 균일성을 위해","교류용접기의 단선 부하를 억제하기 위해","피복재 내부에 탈산 작용을 중지시키기 위해"],"answerIndex":2,"answerText":"② 좁은 홈에서 신속한 아크 점화와 용입 균일성을 위해","explain":"가용접은 제한된 좁은 루트 개선 홈이나 협소한 조립 틈새에서 임시 고정하는 공정이므로, 신속한 융합 및 안정된 아크 집중을 유도하고 루트 단면 오차를 유발하지 않도록 본용접용보다 상대적으로 가는 소경 용접봉을 사용하는 것이 기술적 정석입니다."},{"n":19,"type":"mcq","stem":"모재 두께 t가 3.0 mm 미만인 박판 구조물을 결합할 때 적용되는 NCS 가용접 표준 비드 길이로 가장 타당한 기준 규격은 무엇입니까?","choices":["10 mm 이상","20 mm 이상","30 mm 이상","50 mm 이상"],"answerIndex":3,"answerText":"③ 30 mm 이상","explain":"NCS 표준 가용접 비드 규정(표 2-3 및 표 3-1)에 따르면, 판 두께가 3.2mm 이하(박판 포함)인 경우에는 표준 가용접 비드의 단일 길이를 최소 30mm 이상 확보하도록 지정하고 있습니다."},{"n":20,"type":"mcq","stem":"용접 구조물의 가용접 작업 수행 시, 열영향부의 급랭을 예방하고 경도 상승에 의한 지연 균열(저온 균열) 방지에 기여하는 대표적인 선행 열처리 대책은 무엇입니까?","choices":["예열 (Preheating)","피닝 (Peening)","고체 고용화 열처리","어닐링 (Annealing)"],"answerIndex":1,"answerText":"① 예열 (Preheating)","explain":"예열은 모재에 미리 일정한 열을 가해 급랭 조직의 형성(경화 조직 차단)을 지연시키고 수소의 방출을 원활히 유도함으로써 저온 지연 균열을 미연에 전면 예방하는 가장 신뢰도 높은 가용접 전처리 대책입니다."},{"n":21,"type":"mcq","stem":"다음 중 용접부 수축 거동이 자유단 상태로 전개되어, 시공 시 수축 스트레스 분산과 열응력 제거 효과가 뛰어나 '가장 먼저 용접을 개시해야 하는' 용접 구조물의 결합 조립 대원칙은 무엇입니까?","choices":["수축량이 가장 큰 이음부를 가장 나중에 용접한다.","수축 변형이 일어날 변형량이 가장 크게 예상되는 중구속 단면 이음을 가장 먼저 시공한다.","수축량이 자유롭게 거동할 수 있는 자유단 방향으로 용접 진행 순서를 설계한다.","강도상 무관한 보강재 필릿용접을 맞대기용접 전처리보다 우선 완공한다."],"answerIndex":3,"answerText":"③ 수축량이 자유롭게 거동할 수 있는 자유단 방향으로 용접 진행 순서를 설계한다.","explain":"용접 시공 시 변형 및 응력을 제어하기 위한 수축 순서의 대원칙에 따르면, 이음부 수축 거동은 자유로운 자유단으로 항상 도피할 수 있도록 유도하기 위해 고정도가 큰 구속단을 피해 자유단 방향으로 전개하는 것이 정석입니다."},{"n":22,"type":"mcq","stem":"피복아크용접 가용접부에 기공(Blow hole) 결함이 빈번하게 형성되었을 때, 이 기공의 주요 형성 유발 인자와 관계가 가장 먼 것은 무엇입니까?","choices":["용접봉의 피복제가 건조 상태 불량으로 과도한 수분을 함유하고 있을 때","가용접 시 지나치게 고전류를 사용하여 아크 길이가 너무 과도하게 길어졌을 때","모재 홈 내부 표면에 유분, 수분, 페인트, 밀스케일 등의 이물질이 고착되어 있을 때","가스 퍼징 장치 내부 아르곤 보호가스의 유량이 과도하게 높을 때"],"answerIndex":4,"answerText":"④ 가스 퍼징 장치 내부 아르곤 보호가스의 유량이 과도하게 높을 때","explain":"기공의 발생은 수분 흡습에 의한 수소 방출, 이물질 가스화, 아크 길이의 과대화 등에 의해 일어납니다. 피복아크용접은 슬래그 차폐 방식을 사용하므로 가스 퍼징 및 아르곤 보호가스를 전혀 적용하지 않아 관계가 없습니다."},{"n":23,"type":"mcq","stem":"용접 게이지의 활용 요령 중, 필릿 용접 이음에서 모재 표면의 접점 끝부분을 뜻하는 '토우(Toe)'부 인근에 발생한 국부적인 파임 홈인 '언더컷(Undercut)'의 깊이를 신속하게 한 번에 밀어 측정 판독하는 단독 게이지의 명칭은 무엇입니까?","choices":["하이로(Hi-Lo) 단차 게이지","필릿 사이즈 판단 게이지","캠브리지 게이지 내의 언더컷 촉침 바늘","버니어캘리퍼스 깊이 바"],"answerIndex":3,"answerText":"③ 캠브리지 게이지 내의 언더컷 촉침 바늘","explain":"언더컷은 비드 토우부에 유발되는 미세 파임 결함으로, 정밀 측정을 위해 캠브리지 게이지 전면에 있는 언더컷 전용 촉침 바늘(포인터)을 밀착시켜 깊이를 판독 규정(0.3~0.5mm 이하 허용)과 대조 검사합니다."},{"n":24,"type":"mcq","stem":"가용접 후 변형 교정에 가장 탁월하게 활용되는 수공구 중 하나인 '슬래그 망치(슬래그 해머)'를 사용한 피닝(Peening) 처리에 대한 설명으로 올바른 공학적 장점은 무엇입니까?","choices":["표면층에 인장 소성변형을 가하여 응력 균열을 촉진한다.","비드 표면을 타격해 소성변형을 주어 잔류응력을 완화한다.","아크 쏠림을 자기적으로 차단하여 융입 깊이를 증가시킨다.","가접부 내부 세라믹 뒷댐재의 밀착성을 강화한다."],"answerIndex":2,"answerText":"② 비드 표면을 타격해 소성변형을 주어 잔류응력을 완화한다.","explain":"피닝(Peening)은 용접 완료 직후 뜨거운 상태의 비드 표면을 해머 등으로 타격하여 인장 잔류응력이 유발된 부위에 압축 소성변형을 인위적으로 발생시킴으로써 잔류응력 완화 및 변형을 경감하는 매우 탁월한 보조 시공법입니다."},{"n":25,"type":"mcq","stem":"가용접에 동원되는 치공구 중 하나인 '용접 지그(Welding jig)'가 충족해야 하는 우수 지그의 기본적 구비 요건과 거리가 먼 설명은 무엇입니까?","choices":["모재를 틀어짐 없이 확실하고 정교하게 구속할 수 있는 충분한 기계적 강성과 강성을 보유해야 한다.","용접 비드 생성 위치와 자세를 손쉽게 변경할 수 있는 유연한 회전 및 구동 구조여야 한다.","가용접물과 모재의 부착(착탈) 조작이 극히 쉽고 청소 관리가 간편해야 한다.","한번 조립하면 모재와 지그가 영구 합체되어 탈거되지 않도록 일체형 전단 결합을 보증해야 한다."],"answerIndex":4,"answerText":"④ 한번 조립하면 모재와 지그가 영구 합체되어 탈거되지 않도록 일체형 전단 결합을 보증해야 한다.","explain":"용접용 지그는 구조물을 정밀하게 지지하되 가용접 완료 후 완성품의 분해 및 탈거가 신속하고 용이한 '착탈식 구조'여야 합니다. 영구 결착되어 분리가 불가능하다면 완제품 생산에 지장을 줍니다."},{"n":26,"type":"mcq","stem":"다음 용접 수축 변형을 설계 단계에서 제어하기 위한 설계적 해결 수칙으로 가장 정석에 위배되는 설계 오류 조항은 무엇입니까?","choices":["용착량이 많은 개선 각이 70° 이상으로 큰 두꺼운 맞대기 V홈 설계를 무차별 적용한다.","맞대기 설계 시 판 두께가 서로 상이할 때 경사각 테이퍼를 주어 급격한 단면 변화를 상쇄한다.","구조 성능상 요구되는 필요 최소한의 용착 금속 부피를 유지한다.","부재 이음 배치를 용접선이 가능한 구조적 중립축에 대칭으로 위치하도록 설계한다."],"answerIndex":1,"answerText":"① 용착량이 많은 개선 각이 70° 이상으로 큰 두꺼운 맞대기 V홈 설계를 무차별 적용한다.","explain":"용착 금속량이 과도할수록 열팽창 수축에 따른 변형과 잔류응력이 심해집니다. 따라서 개선 홈 각도를 용접 작업 지장이 없는 한 최소화(베벨각 30°~35°, 홈각 60°~70°)하는 것이 설계적 예방 대책의 핵심이며, 홈각을 대폭 늘리는 후판 가공은 변형을 증대시킵니다."},{"n":27,"type":"mcq","stem":"모재 두께 t가 25.0 mm를 초과하는 고강성 후판 강재 결합에 적용하는 단일 가용접 비드의 표준 최소 길이는 얼마입니까?","choices":["20 mm 이상","30 mm 이상","40 mm 이상","50 mm 이상"],"answerIndex":4,"answerText":"④ 50 mm 이상","explain":"NCS 표준에 의거하여 후판(두께 25.0mm 초과) 이음 구조물에 시행하는 표준 가가접 비드 길이는 50mm 이상 확보하여 강한 기계적 지지력을 보장해야 안전사고를 방지할 수 있습니다."},{"n":28,"type":"mcq","stem":"용접 이음부에 가해지는 작용 외력의 한도가 일시적으로 극심히 작용하는 '충격하중(Impact Load)' 조건 하에서 구조 설계 시 적용해야 하는 보수적인 정격 안전율 수치는 얼마입니까?","choices":["3","5","8","12"],"answerIndex":4,"answerText":"④ 12","explain":"언윈 안전율은 정하중 3, 동하중 5, 교번하중 8, 충격하중 12이다. 충격하중은 순간 응력이 가장 커 12를 적용한다."},{"n":29,"type":"mcq","stem":"가용접의 기술적 중요성에 대한 실무 가이드 중 가장 적절한 기술적 공학 논거는 무엇입니까?","choices":["가용접부는 본용접 비드 내부로 완전히 융합되어 최종 구조재의 품질을 좌우하므로 고도의 숙련과 안전관리가 필수적이다.","박판 용접 시에는 가용접 비드의 두께를 모재 두께의 3배 이상으로 투껍게 구축해야 수축을 막는다.","모서리 용접부에 기공 결함이 빈번해도 본용접 와이어가 자동으로 탈산하므로 보수가 면제된다.","가용접부는 본용접부의 백치핑에 의해 전량 자동 연소 제거되므로 가접사의 숙련도는 무관하다."],"answerIndex":1,"answerText":"① 가용접부는 본용접 비드 내부로 완전히 융합되어 최종 구조재의 품질을 좌우하므로 고도의 숙련과 안전관리가 필수적이다.","explain":"가용접부는 본용접 시 비드와 완전히 일체화되어 잔존하므로, 가용접의 완성도가 최종 품질을 직결 결정합니다. 따라서 본용접사와 동등 이상의 기량을 갖춘 작업자가 정밀 시공하여 내부 융합 결함을 최소화해야 합니다."},{"n":30,"type":"mcq","stem":"두 두꺼운 판을 조립 가접할 때, 판재 상호 간의 평행 어긋남인 '이면부 단차(Misalignment)'를 제어하기 위한 표준 허용 한계 오차값은 모재 두께(t) 대비 얼마 수준 이내로 제어하는 것이 규정입니까?","choices":["모재 두께의 10% (0.1t) 이내 및 최대 3mm 이하","모재 두께의 50% (0.5t) 이내 및 최대 5mm 이하","무조건적으로 0.01 mm 정밀 밀봉 오차 고정","오차가 발생할수록 용입 깊이가 확보되므로 단차가 클수록 유리하다."],"answerIndex":1,"answerText":"① 모재 두께의 10% (0.1t) 이내 및 최대 3mm 이하","explain":"일반
