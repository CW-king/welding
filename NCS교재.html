식 토치","압축 공기 주입 가열 토치","아르곤 가스 예열식 고전류 토치"],"answerIndex":2,"answerText":"② 공랭식 토치","explain":"200A 이하 소용량 박판 세팅 시에는 토치가 지극히 경량이고 구조 조작 및 동선이 간편한 '공랭식 토치'를 구비 결속하는 것이 실무상 경제적이다."},{"n":23,"type":"mcq","stem":"텅스텐 전극봉을 연마기나 탁상용 그라인더로 정밀 연마할 때, 작업자의 안전을 지키고 그라인더의 기계적 충격 손상 비산을 차단하기 위해 서서 가공 작업을 수행해야 하는 올바른 위치는?","choices":["그라인더의 정면 정중앙","연마석 숫돌의 우측 또는 좌측 측면","용접기 본체 바로 뒷면 공간","배전반 차단 스위치 직전 위치"],"answerIndex":2,"answerText":"② 연마석 숫돌의 우측 또는 좌측 측면","explain":"텅스텐 연마 시 숫돌 연마석이 마찰 과열로 파손 비산 파괴될 때 정면 얼굴 타격을 방지하기 위해 작업자는 반드시 그라인더 숫돌 결의 측면에 우측/좌측 경사하여 밀착 정밀 연마를 수행해야 한다."},{"n":24,"type":"mcq","stem":"다음 중 TIG 용접 토치 부속 부품인 가스 노즐(세라믹 컵)의 번호에 따른 단면 안지름 규격 치수 매칭이 옳지 않은 것은?","choices":["#4호 = 6.0 ㎜","#6호 = 10.0 ㎜","#8호 = 12.0 ㎜","#10호 = 18.0 ㎜"],"answerIndex":4,"answerText":"④ #10호 = 18.0 ㎜","explain":"#10호의 안지름 규격 치수는 약 15.0mm (15/16 인치)이며, 18.0mm는 부적합한 규격 왜곡 수치이다."},{"n":25,"type":"mcq","stem":"텅스텐 전극봉을 삽입 결속하는 콜릿 바디 중에서, 미세 스크린 망을 통과시켜 완벽한 충류(Laminar) 실드를 형성하며 전극봉의 노즐 끝단 기준 돌출 길이를 최대 25mm까지 길게 빼내어 협소 홈 시공이 가능하도록 고안된 최근 부품은?","choices":["일반 콜릿 바디","변형 8홀 콜릿 바디","가스 렌즈 바디(Gas Lens)","단형 특수 오리피스 바디"],"answerIndex":3,"answerText":"③ 가스 렌즈 바디(Gas Lens)","explain":"가스 렌즈 바디는 조립된 미세 스테인리스 그물망 필터에 의해 정밀 난류가 억제되어 직선형 충류 가스막이 형성되므로 25mm 텅스텐 돌출 시에도 완벽한 실딩 품질을 자랑한다."},{"n":26,"type":"mcq","stem":"수공구 몽키스패너(adjustable wrench)를 올바르게 사용하여 볼트/너트를 조이거나 풀 때 마모를 차단하기 위한 정석 수칙으로 틀린 것은?","choices":["고정턱과 가동턱 모두를 볼트 머리 평면에 단단히 밀착시킨다.","가동 턱이 있는 조절 기구부의 유격을 최소화하여 결속한다.","힘을 가할 때 가동 턱 방향이 아닌, 고정 턱 방향으로 스패너 자루를 밀어서 힘을 가한다.","수공구를 조절할 때 나사산 유격을 넓게 잡고 끝단을 비스듬히 걸쳐 강하게 조인다."],"answerIndex":4,"answerText":"④ 수공구를 조절할 때 나사산 유격을 넓게 잡고 끝단을 비스듬히 걸쳐 강하게 조인다.","explain":"몽키스패너는 유격을 완전히 닫아 조여 볼트 머리 육각면에 완전 밀착하여 가동 자루 부분을 고정 턱 방향으로 회전시켜 힘을 가해야 볼트의 기계적 마모 소손을 막는다."},{"n":27,"type":"mcq","stem":"클램프 미터(Hook Meter, 후크 메타)로 용접기의 정격 소비 부하 전류를 비파괴 계측하고자 도선을 루프에 통과시킬 때, 올바른 전류 계측법은?","choices":["계측하고자 하는 단상 1선의 도선만을 분리하여 루프에 단독 통과시킨다.","녹색 접지선과 출력 양극 케이블을 동시에 꼬아서 함께 통과시킨다.","단자 전압이 상승한 2차 출력선 케이블 3선을 모두 묶어 감싼다.","3상 전원 3선 케이블 도선 전체를 루프 안에 일괄 감싼다."],"answerIndex":1,"answerText":"① 계측하고자 하는 단상 1선의 도선만을 분리하여 루프에 단독 통과시킨다.","explain":"클램프 미터 측정 시 다상선을 일괄 루프에 감싸면 전선로 간 유도 자기장 합이 제로(0)로 상쇄되어 측정이 불가하므로 계측선 1선만을 완벽 격리 통과시켜야 부하 지수가 정확히 지시된다."},{"n":28,"type":"mcq","stem":"용접 결선부 단자 가공 시 압착 터미널(러그)을 체결하고 볼트로 고정한 노출 부위를 감지 차단하여 작업자를 감전 재해로부터 보호하기 위한 필수 절연 마감 조치법으로 가장 정석적인 방법은?","choices":["고무 절연테이프를 이중으로 감거나 전용 수축 튜브로 덮어 마감한다.","피복 손상부를 황동 선 와이어 브러시로 매끄럽게 그라인딩하여 제거한다.","볼트 와셔 간격을 넓게 벌려 통풍을 유도하고 공기 절연에 맡긴다.","그리스 및 기계 오일을 단자 피복 표면에 고르게 도포 분사한다."],"answerIndex":1,"answerText":"① 고무 절연테이프를 이중으로 감거나 전용 수축 튜브로 덮어 마감한다.","explain":"단자 노출 부위는 누전 및 감전 소손을 차단하기 위해 고무 및 비닐 절연 테이프로 이중 보호 마감 조치하는 것이 안전 공학상 최고의 결속 정석 수칙이다."},{"n":29,"type":"mcq","stem":"배전반 누전차단기(ELB)의 주요 기계적 내장 기구 기능으로 가장 거리가 먼 것은?","choices":["선로 누전 시 통과 전류 편차를 감지하여 0.03초 이내 초고속 차단","모재 단락(합선) 시 전기적 과전류 유입 선로 강제 차단","무부하 전압을 상시 20~30V 이하의 전기적 수치로 자동 감압 제어","정격 이상 지락 사고 차단 기능을 통한 작업자 심실세동 예방"],"answerIndex":3,"answerText":"③ 무부하 전압을 상시 20~30V 이하의 전기적 수치로 자동 감압 제어","explain":"무부하 전압을 상시 20~30V로 감압 자동 복원 제어하는 기구는 교류아크용접기 안전 장치인 '자동전격방지기(VRD)'의 핵심 기구 특성이다."},{"n":30,"type":"mcq","stem":"아르곤 가스의 중앙집중 공급 방식 중에서 액화 아르곤 용기에 기화기(Vaporizer)를 결선 가동하여 기화 공급하는 설비의 주요 공학적 특징에 해당하지 않는 것은?","choices":["개별 봄베 공급식에 비해 가스 단가를 대폭 줄일 수 있어 대량 연속 사용 시 지극히 경제적이다.","가동 중 가스 교체를 위해 조업을 중단할 필요가 없어 작업 능률이 최대화된다.","다수 용기 수량 관리가 불필요하여 안전 관리 측면에서 체계적이다.","장기간 공장을 가동하지 않는 대기 상태에서도 용기 내부 자연 기화가 전혀 발생하지 않아 영구 가스 손실이 제로(0)이다."],"answerIndex":4,"answerText":"④ 장기간 공장을 가동하지 않는 대기 상태에서도 용기 내부 자연 기화가 전혀 발생하지 않아 영구 가스 손실이 제로(0)이다.","explain":"중앙집중식 액화 아르곤 기화 설비는 공장 대기 시 가동 중단 시에도 보온 기화 탱크 특성상 내부 압력 상승에 의해 안전밸브로 기체 가스가 자동 자연 소모 방출되는 누설 손실이 유발된다."},{"n":31,"type":"mcq","stem":"텅스텐 전극봉 뒤편의 토치 백캡(Cap)을 선택 조립할 때, 롱 캡(Long Cap)과 단 캡(Short Cap)의 올바른 실무 조립 기준으로 옳은 것은?","choices":["수랭식 협소 배관 홈 TIG 용접 시 공간 간섭을 피하기 위해 롱 캡을 체결한다.","평탄한 아래보기 자세의 다층 적층 용접 시 신품 긴 전극봉을 교체 없이 삽입하기 위해 롱 캡을 결속한다.","작업 공간이 좁아 토치 접근이 난해한 구석진 구간 시공 시 롱 캡을 우선 체결하여 고정 각도를 비튼다.","단 캡을 조립할 때는 신품 전극봉을 자르지 않고 뒤편으로 통째로 돌출시켜 고정해야 한다."],"answerIndex":2,"answerText":"② 평탄한 아래보기 자세의 다층 적층 용접 시 신품 긴 전극봉을 교체 없이 삽입하기 위해 롱 캡을 결속한다.","explain":"롱 캡은 신품 텅스텐 전극 수용에 지극히 경제적이고 양호하나 공간 장해가 있는 틈새부 적층 시에는 단 캡과 절단 전극봉 매칭 조립이 기하학적으로 최적이다."},{"n":32,"type":"mcq","stem":"다음 가스텅스텐아크용접 장비의 부속 장치 및 계통 결선 중에서, '고주파 발생 장치'의 주요 탑재 기능으로 가장 타당한 설명은?","choices":["용접 도중 극성을 정극성과 역극성으로 매초 60회 고속 전환하는 장치","전극봉이 모재에 접촉하지 않아도 아크가 스타트되도록 고주파를 인가하는 장치","정격 효율을 높이기 위해 출력 직류 역성을 평활 파형으로 변환하는 대형 리액터","가스 렌즈 내부의 기류 압력을 25배로 가압하는 고압 송풍 제어 장치"],"answerIndex":2,"answerText":"② 전극봉이 모재에 접촉하지 않아도 아크가 스타트되도록 고주파를 인가하는 장치","explain":"고주파 발생 장치(ACHF 전원 연동 기구)는 비접촉식 아크 스타트를 유도하여 텅스텐 전극의 끝단 오염 소손 및 용착금속 텅스텐 혼입 결함을 완전 차단해주는 필수 회로 안전 장치이다."},{"n":33,"type":"mcq","stem":"다음 중 황동(동합금) 재질로 가공된 고압 아르곤 가스 봄베 체결용 너트 및 나사를 체결 스패너로 가동할 때 나사산 뭉개짐(손상)을 방지하기 위한 정밀 수지 토크 관리 수칙은?","choices":["작업자의 손가락 및 팔심 강도의 약 70% 정도만 사용하며 과도한 완력을 금지한다.","나사산의 기밀 유지를 위해 그리스 및 유질 페인트를 나사 홈에 듬뿍 도포한 후 결속한다.","파이프 가스 렌치를 사용해 온 힘을 다해 250% 토크로 한계치까지 조인다.","수공구를 비스듬히 걸쳐 턱 유격을 최대로 가압한다."],"answerIndex":1,"answerText":"① 작업자의 손가락 및 팔심 강도의 약 70% 정도만 사용하며 과도한 완력을 금지한다.","explain":"동합금으로 주조 가공된 너트 나사는 마모 계수가 현저히 작아 야금학적으로 과한 힘 유입 시 뭉개짐 파손이 직결 유발되므로 완력의 70% 수준 적정 토크만으로 세팅해야 정석이다."},{"n":34,"type":"mcq","stem":"TIG 용접 토치의 소모성 구성 부품 중에서, 콜릿 척(Collet Chuck)을 콜릿 바디 내부에 정확히 압착 조립한 후 텅스텐 전극봉의 흔들림을 막고 최종 결속 고정하는 역할을 담당하는 토치 부품은?","choices":["테플론 링(절연체)","가스 노즐(세라믹 컵)","토치 백캡(Back Cap)","진행각 스프링 라이너"],"answerIndex":3,"answerText":"③ 토치 백캡(Back Cap)","explain":"토치 백캡(Cap)을 조여 결속력을 전달하면, 콜릿 바디 내부의 분할 콜릿 척이 전극봉 지름을 사방에서 정밀 압착하여 텅스텐 봉의 유격 흔들림을 완벽히 차단 결속 고정한다."},{"n":35,"type":"mcq","stem":"다음 중 가스 가열 히터가 결합된 아르곤 조정기의 기밀 조립 완료 후, 가스 배관 전체 계통의 가스 누설 여부를 작업 착수 전 검사하는 표준 방법으로 가장 안전하고 확실한 수칙은?","choices":["수랭 냉각 장치를 가동하여 냉각수의 수압 변동계 눈금을 관찰한다.","아르곤 가스의 전자기 전도율 측정기로 대지 저항 지수를 계측한다.","라이터 불꽃을 결합 연결 너트 홈부에 직접 대어 그을음을 확인한다.","비눗물을 연결부 주변에 분사한 후 기포가 생기는지 육안 확인한다."],"answerIndex":4,"answerText":"④ 비눗물을 연결부 주변에 분사한 후 기포가 생기는지 육안 확인한다.","explain":"나사 체결 틈새 가스 누설은 불꽃을 가동 대조하면 절대 안 되며, 계통 가스 주입 후 비눗물을 피팅부에 정밀 분사하여 계통 가스 버블 발생 유무로 최종 판정하는 것이 가장 양호하다."},{"n":36,"type":"mcq","stem":"가스텅스텐아크용접기(GTAW) 전원 장치에 전원이 정상 인가되었을 때 작동 이상 및 과부하 트러블 발생 시 전면 조작 패널에 작동하는 필수 보호 회로 경고 지시등 명칭은?","choices":["POWER 등 (녹색)","READY 등 (황색)","WARNING 등 (적색)","TIG SPOT 등 (청색)"],"answerIndex":3,"answerText":"③ WARNING 등 (적색)","explain":"과부하, 누전, 냉각수 차단 등 TIG 전원 트러블 유발 시 이상 전류 감지 차단 회로에 의해 전면의 적색 'WARNING' 경고 지시등이 즉각 작동 점등된다."},{"n":37,"type":"mcq","stem":"다음 중 교류아크용접기(SMAW)와 가스텅스텐아크용접기(GTAW)의 전기 안전 수칙 중 '자동전격방지기(VRD)'가 내장 작동할 때의 설명으로 타당하지 않은 것은?","choices":["아크를 발생시키지 않는 무부하 대기 시에 전기적 무부하 전압을 20~30V 이하의 안전 강압 한계치로 강하 제어한다.","용접을 시작하면 급격한 유도 기전력 작용으로 순식간에 차단을 해제하여 용접 아크 전압을 원활히 송급한다.","전기적 충격 감전 재해와 용접기의 기계적 전력 손실을 동시에 예방하는 기구이다.","마그네틱 접점 방식 전격방지기는 분진 및 습기 침투에 대단히 취약하여 수명이 매우 긴 특성을 지닌다."],"answerIndex":4,"answerText":"④ 마그네틱 접점 방식 전격방지기는 분진 및 습기 침투에 대단히 취약하여 수명이 매우 긴 특성을 지닌다.","explain":"마그네틱 기계식 전격방지기는 접점 부위 마모 한계가 존재하여 가동 정밀 수명이 상대적으로 짧으며, 반도체 소자 무접점 전격방지기가 정밀도가 빠르고 물리적 감도가 높으며 수명이 영구적으로 길다."},{"n":38,"type":"mcq","stem":"다음 가스텅스텐아크용접기(GTAW) 극성 중, '모재에 (+)극을 연결하고, 텅스텐 전극봉에 (-)극을 연결하는 방식'에 해당하며, 아크 열분배가 모재 70% 집중되어 용입이 좁고 깊어 연강 및 스테인리스강 등 탄소강 용접에 가장 널리 이용되는 정밀 극성 지표는?","choices":["직류 정극성 (DCEN / DCSP)","직류 역극성 (DCEP / DCRP)","교류 고주파 펄스 (ACHF)","가포화 교교류 리액터"],"answerIndex":1,"answerText":"① 직류 정극성 (DCEN / DCSP)","explain":"직류 정극성(DCEN)은 모재 양극(+), 텅스텐 음극(-) 결선으로 충돌 에너지 70%가 모재에 집중되어 좁고 깊은 용입 비드 형성에 최적이며 강, 스텐 시공의 바이블이다."},{"n":39,"type":"mcq","stem":"알루미늄 및 마그네슘 합금 용접 시 직류 역극성(DCEP)이나 교류 전원(AC)을 사용할 때 작동하는 공학적 특성으로, 모재 금속 표면에 존재하는 융점이 매우 높은 강한 산화물 피막(Al₂O₃)에 불활성가스 양이온이 강하게 충돌하여 기계적으로 피막을 깨끗이 소거 파괴하는 물리 화학적 정밀 제거 현상은?","choices":["청정 작용","아크 쏠림 현상","침투 탐상 현상","고온 균열 현상"],"answerIndex":1,"answerText":"① 청정 작용","explain":"직류 역극성 및 교류 용접 시 불활성 가스 이온이 모재 표면에 강하게 충돌하여 높은 고융점의 산화막 피막을 걷어내는 물리 화학적 고속 제거 작용이 바로 청정 작용(Cleaning Action)이다."},{"n":40,"type":"mcq","stem":"TIG 용접에서 아크를 끊은 뒤에도 일정 시간 동안 보호가스를 토치 노즐 끝으로 계속 배출 공급하여, 고온으로 가열된 텅스텐 전극봉과 급랭 응착되는 용융지(크레이터부)의 산화 오염을 완벽히 방지하는 타이머 설정 장치와 적정 지연 시간 기준은?","choices":["초기 가스 (PRE-FLOW) 시간: 0.1~0.5초","후기 가스 (AFTER-FLOW) 시간: 5~10초","아크 전압 제어 시간: 30초","단락 이행 주파수: 120Hz"],"answerIndex":2,"answerText":"② 후기 가스 (AFTER-FLOW) 시간: 5~10초","explain":"용접 종료 후 고열의 텅스텐 전극봉의 산화 마모 및 크레이터 융합부 결함을 소멸 방지하기 위해 5~10초의 후기 가스(AFTER FLOW) 차폐 시간 타이머 유지가 공학적 안전 필수 조건이다."},{"n":41,"type":"mcq","stem":"TIG 용접기 전원 및 가스 계통 설비 설치가 모두 완료된 후, 기 가동 확인을 위해 용접기 전면 패널의 스위치를 조작할 때, 아르곤 유량계의 볼 유량을 적정 수준으로 체크 계측할 수 있도록 토치로 직접 아르곤 가스를 송출 유도하는 제어 노브 장치 명칭은?","choices":["용접/점검(GAS CHECK) 노브","펄스 폭 조절 다이얼","핫 스타트 제어 스위치","아크 특성 조절 리액터"],"answerIndex":1,"answerText":"① 용접/점검(GAS CHECK) 노브","explain":"유량계 유리 눈금관 내 아르곤 제어 지표를 육안 확인 설정하기 위해, 아크 발생 전 토치로 유입 가스를 미리 선분사하여 체크 유도하는 전용 다이얼은 가스체크(GAS CHECK) 노브 장치이다."},{"n":42,"type":"mcq","stem":"가압 조절 손잡이를 조여 솔리드 와이어 및 플럭스코어드 와이어를 노즐 밖으로 강제 돌출 제어하기 위해, 용접 토치 스위치를 가동하지 않고 와이어 송급 장치만 단독 고속 구동하는 조작 보조 단추 스위치는?","choices":["가스 체크 스위치","비상 정지 버튼 (EMERGENCY)","토치 트래킹 스위치","인칭 스위치 (INCHING)"],"answerIndex":4,"answerText":"④ 인칭 스위치 (INCHING)","explain":"용접 토치에 와이어를 표준 돌출 길이에 맞춰 밀어 이송 조절할 때, 가스 실드 무단 소모를 방지하기 위해 송급 모터 롤러만 단독 고속 인칭 이송 구동하는 스위치는 인칭(INCHING) 버튼이다."},{"n":43,"type":"mcq","stem":"다음 TIG 용접기 전원 케이블 및 출력 계통 단자 접속 공정 중 전기적 접촉 마찰 저항이 과도하게 증가하여 접속부가 시뻘겋게 열화 발열되고 단자가 용융 단선되는 원인으로 가장 타당한 설명은?","choices":["결선용 고정 볼트와 너트의 조임 토크가 부족하여 나사가 유격으로 느슨해진 접촉 저항 증대 상태일 때","출력 음극(-) 단자에 모재 접지 어스 클램프선을 볼트로 강력하게 결속 밀착 가공했을 때","수랭 냉각 관 내부 냉각수의 유량이 분당 20L 초과 상태로 지속 순환 가동할 때","전선 터미널 압착을 38스퀘어 규격 케이블로 타당하게 시공했을 때"],"answerIndex":1,"answerText":"① 결선용 고정 볼트와 너트의 조임 토크가 부족하여 나사가 유격으로 느슨해진 접촉 저항 증대 상태일 때","explain":"출력 단자부 결선 볼트 결속 토크가 느슨해져 나사 유격이 증대되면, 그 접합부 틈새에 전기적 '접촉 저항'이 유입 기하급수적으로 폭등하여 심각한 열화 및 단자 용융 화재가 초래된다."},{"n":44,"type":"mcq","stem":"TIG 용접용 텅스텐 전극봉의 단부 가공(연마) 상태가 기계적으로 불량하여 끝단이 뭉개지거나, 연마석 숫돌 그라인더 결에 수직 방향으로 원주 마찰 가공되었을 때 발생하는 공학적 아크 불량 특징은?","choices":["아크가 모재의 용융 방향과 일직선으로 정교하게 집중 유도된다.","용입이 고온에 집중되어 비드가 정밀하고 평활하게 형성된다.","아크 스타트가 어려워지고 방전이 사방으로 튀는 아크 쏠림이 유발된다.","텅스텐 전극봉 소모량이 대폭 절감되어 사용 수명이 영구적으로 극대화된다."],"answerIndex":3,"answerText":"③ 아크 스타트가 어려워지고 방전이 사방으로 튀는 아크 쏠림이 유발된다.","explain":"전극봉 단부가 수직 방향이 아닌 횡방향 원주형 결 그라인딩 연마 가공되거나 뭉개질 시, 전자의 방출 거동이 불규칙적으로 흐트러져 아크가 격렬히 사방 요동치는 아크 쏠림 불안정이 수반된다."},{"n":45,"type":"mcq","stem":"작업장 환경 요건 중 용접 흄 가스와 연마 미세 분진을 국소적으로 즉시 포집하여 대기 중 배출 정화 처리하는 국소 배기장치의 후드(Hood) 설계 및 운용 실무 수칙으로 옳지 않은 것은?","choices":["흄 발생원에 후드 입구를 최대한 밀착 배치하여 오염 공기를 포집한다.","미세 분진 흡입을 방해하는 기류 교란 풍속을 최소화하기 위해 방풍막을 설치한다.","가스 실드를 교란하여 비드 기공을 유발하지 않도록 적정 제어 배기 유속을 지킨다.","대형 옥외 환풍기만 작동하고 흡입 후드를 2m 높이에 멀리 배치한다."],"answerIndex":4,"answerText":"④ 대형 옥외 환풍기만 작동하고 흡입 후드를 2m 높이에 멀리 배치한다.","explain":"국소 배기장치는 흄 발생원과 후드 거리가 가까울수록 포집률이 거리 제곱에 반비례하여 급격히 향상되므로, 후드를 작업 부위 최소 30cm 이내 최단거리 밀착 배치하여 국소 포집 가동하는 것이 정석이다."},{"n":46,"type":"short","stem":"가스텅스텐아크용접기 내부의 주변압기와 PCB 회로 판 등의 먼지를 압축공기로 소거 정비할 때, 내부 고전압 콘덴서의 잔류 전하로부터 전격(감전) 사고를 예방하기 위해 전원 오프(OFF) 후 대기해야 하는 최소 기준 시간은 몇 분(min)인가?","choices":[],"answerIndex":null,"answerText":"3 분 (3 min) 이상","explain":"용접기 내부 전원 차단 후 콘덴서 전류 방전 필수 시간 기준"},{"n":47,"type":"short","stem":"300A 정격 용량을 지닌 TIG 용접 설비를 3상 380V 가동 배전반에 결선하고자 할 때, 허용 전류 초과에 따른 선로 화재를 소멸 방지하는 1차측 입력 전원 케이블의 최소 규격 굵기 지름은 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"8 ㎟ 이상 (공칭 단면적 기준, 지름 8 mm가 아님)","explain":"용접기 용량별 케이블 표에서 300A급 1차측은 8 ㎟이며 이는 '단면적'이다. 지름 8 mm는 약 50 ㎟에 해당해 1차측(약 30A)에는 과대하다."},{"n":48,"type":"short","stem":"TIG 용접 300A 정격 용량 설비 설치 시 전압 강하와 스패터 및 아크 단선을 방지하는 2차측 접지 케이블의 안전 규격 최소 단면적은 몇 스퀘어(㎟)인가?","choices":[],"answerIndex":null,"answerText":"50 ㎟ (스퀘어) 이상","explain":"300A 전원 장치 2차측 어스 및 전극 출력선 단면적 굵기 표준"},{"n":49,"type":"short","stem":"아르곤 레귤레이터를 아르곤 가스 고압 용기에 수직 기립 조립할 때, 나사산 뭉개짐(손상)을 방지하기 위해 가해야 하는 동합금 전용 적정 수지 손가락 조임 완력 토크 한계치는 작업자 총 완력 강도의 약 몇 % 인가?","choices":[],"answerIndex":null,"answerText":"약 70% 수준의 손가락 및 팔심","explain":"레귤레이터의 황동 나사산은 과조임 시 뭉개지므로 총 완력의 약 70% 정도 손힘으로만 조인다. 교재에 따라 '공구 없이 손조임'으로 표현하기도 한다."},{"n":50,"type":"short","stem":"세라믹 노즐 번호 #6호가 지칭하는 안지름 규격 치수는 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"약 10.0 ㎜ 안지름","explain":"세라믹 노즐 번호 6호의 안지름 크기 수치 규격"},{"n":51,"type":"short","stem":"세라믹 노즐 번호 #8호가 가리키는 규격 단위 안지름 치수는 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"약 12.0 ㎜ 안지름","explain":"세라믹 노즐 번호 8호의 안지름 크기 규격"},{"n":52,"type":"short","stem":"세라믹 노즐 번호 #10호가 명시하는 최종 출구부의 표준 안지름 크기는 몇 mm인가?","choices":[],"answerIndex":null,"answerText":"약 15.0 ㎜ 안지름","explain":"세라믹 노즐 번호 10호의 안지름 치수"},{"n":53,"type":"short","stem":"가변 저항 회로 기구를 지녀 전원 원격 제어가 가장 용이하고 조작 스위치 구성이 단순해 학교 및 정밀 기계 부품 보수 공법에 널리 장착 가동되는 교류 아크 용접기 제어 방식 분류 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"가포화 리액터형 (또는 리액터 제어식)","explain":"가변 저항 제어 및 원격 조작 조립성이 우수한 용접기 종류"},{"n":54,"type":"short","stem":"배전반 누전차단기(ELB)가 지닌 인체 전격 방지 핵심 메커니즘인 정격 차단 가동 정밀 지표는 '정격 감도 전류 30mA 이하' 및 누전 차단 작동 작동 시간 몇 초 이내인가?","choices":[],"answerIndex":null,"answerText":"0.03 초 이내 초고속 전기 차단","explain":"누전 발생 시 감전 피해를 소멸하는 ELB의 안전 정격 차단 시간"},{"n":55,"type":"short","stem":"TIG 용접에서 정격 전류 200A 초과 가열 후판 맞대기 용접 및 가접 연속 적층 시, 복사열 방출 제어와 케이블 피복 용융 예방을 위해 냉각수 전용 배관을 필수 결선하는 토치 냉각 시스템 방식 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"수랭식 (Water-cooled Type)","explain":"고전류 다층 맞대기 적층 전용 강제 순환 냉각 가동 시스템 명칭"},{"n":56,"type":"short","stem":"TIG 용접 토치 구성 소모품 중, 텅스텐 전극봉 끝단 돌출 길이를 극대화(최대 25mm)하여 협소 홈 시공이 원활하도록 다층 스테인리스 미세 철망 스크린 메시가 내장 조립된 정밀 콜릿 바디 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"가스 렌즈 바디 (Gas Lens Body)","explain":"미세 촘촘한 망 메시 통과를 통해 laminar flow를 구현하는 특수 바디"},{"n":57,"type":"short","stem":"TIG 맞대기 및 필릿 이음부 가접 시, 용착 비드의 끝부분 크레이터 결함 예방을 위해 토치 스위치를 누르면 가스가 아크 전압보다 먼저 선분출되어 실딩 효과를 극대화하는 용접 지연 제어 설정 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"송급 가스 예열 / 가스 선분류 (Pre-flow) 시간 설정","explain":"TIG 비드 초층 크레이터 균열 소멸을 위한 전가스 분사 제어"},{"n":58,"type":"short","stem":"TIG 다층 비드 시공 종료 시, 토치 아크가 중단된 상태에서도 텅스텐 전극봉과 가열 용착부의 급랭 산화 부식을 소멸하기 위해 아르곤 가스를 지연 배출시키는 '후기 가스 타이머'의 안전 권장 제어 시간은 몇 초(sec)에서 몇 초 범위인가?","choices":[],"answerIndex":null,"answerText":"5 ~ 10 초 (sec)","explain":"TIG 비드 종점 크레이터 및 전극봉 급랭 산화 부식 소멸을 위한 후류 가스 표준 지연 시간"},{"n":59,"type":"short","stem":"단선 회로 분리 파괴 결선 조치 없이 전류 자기장 주변 유도자기 가동 지수를 클램프 루프로 계측하는 전류 측정기 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"클램프 미터 (Clamp Meter / 후크 메타)","explain":"전자기 유도 자기장을 통과시켜 부하 전류를 비파괴 간편 계측하는 장비"},{"n":60,"type":"short","stem":"TIG 용접에서 '모재에 플러스(+)극을 결속하고 전극봉에 마이너스(-)극을 결속하여 모재 깊은 용입 효과를 유도하는 극성 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"직류 정극성 (DCEN / DCSP)","explain":"모재 70% 고온 열 집중을 유도하여 좁고 깊은 용입을 확보하는 GTAW 핵심 극성"}]},"19":{"unit":19,"title":"가스텅스텐아크용접 가용접 작업","code":"LM1601050305","group":"GTAW","theory":[{"t":"h2","v":"제1부: NCS 기반 핵심 공학이론 요약 (이론 단권화)"},{"t":"h3","v":"1. 가용접(Tack Welding)의 정의 및 공학적 목적"},{"t":"p","v":"가용접은 본용접을 수행하기에 앞서, 설계도면과 규격집에 명시된 용접 구조물의 외관 치수와 정밀한 기하학적 형상을 유지하기 위해 모재 개선 홈의 그루브(Groove) 가공부나 조립 접합부를 일시적으로 고정해 두는 대단히 짧은 비드의 임시 용접(Tack Welding)을 의미한다. 가용접 단계는 본용접 후 최종 구조물의 기계적 무결성과 형상 안정성을 결정짓는 선행 시공 절차로서, 가용접의 위치, 비드 길이, 간격이 올바르게 설계되지 못할 경우 본용접 진행 중에 심각한 각변형, 뒤틀림, 수축 단차 등 치명적인 시공 불량을 직면하게 되므로 철저한 기술 규격을 준수하여야 한다."},{"t":"table","rows":[["💡 가용접 시공의 필수 핵심 3대 안전·품질 원칙 1. 기량 검증 대원칙: 가용접은 국부적 아크 급랭 열이력을 동반하므로 저온 균열 및 기공 등 용접부 결함을 방지하기 위해 본용접사와 대등하거나 그 이상의 고도화된 기술적 숙련도를 갖춘 유자격 용접사가 작업을 시행해야 한다. 2. 예열(Preheat) 동등 적용: 가용접은 비드 길이가 매우 짧아 용착 금속과 열영향부(HAZ)의 냉각 속도가 극단적으로 빨라지므로 마르텐사이트 조직 형성 및 수소 지연 균열 위험성이 극대화된다. 따라서 본용접 조건에 규정된 예열 온도와 동일한 온도 조건에서 반드시 예열을 가하고 작업을 개시하여야 한다. 3. 결함부 제거 및 백치핑(Back-chipping): 홈 내부에 가용접을 부득이하게 시행한 경우 본용접 시 결함을 완전 소멸시키기 위해 그라인더 또는 가우징을 사용하여 결함부 및 가접부를 깨끗이 소거한 후 백치핑 사상 작업을 완료해야 한다."]]},{"t":"h3","v":"2. 가용접의 이음 형상별 배치 기준 및 기하학적 제약"},{"t":"p","v":"가스텅스텐아크용접(GTAW)을 활용한 임시 가조립 가접을 시공할 때는 응력 거동과 형상 구조에 따른 기하학적 규정을 준수해야 한다. 특히 구조 응력이 복잡하게 집중되거나, 용접선이 겹치는 부위는 결함 발생 우려가 대단히 높으므로 가용접을 원칙적으로 전면 배제하여야 한다."},{"t":"h3","v":"2.1 I형 맞대기이음 가용접 규정"},{"t":"li","v":"루트 간격 밀착 유지: 백킹재(뒷받침) 홈의 정중앙에 모재 용접선이 일치하도록 정렬하고, 루트 간격이 벌어지지 않도록 거의 없도록 밀착 조립한다."},{"t":"li","v":"가용접 배치 간격: 가용접 지점 간의 간격은 일반적으로 판 두께(t)에 비례하여 설계하며, 공학적으로 모재 두께의 25배(25t) 내외를 표준 간격으로 배치한다."},{"t":"li","v":"가접 조립 시퀀스: 여러 장의 평판 모재를 복합적으로 배열하여 조립하는 가용접은 끝단에서부터 순차적으로 배치하는 것이 원칙이다. 다만 실무 및 평가 준비 과정에서는 양 끝단을 견고하게 먼저 가접(Tack)한 후, 중앙부를 가용접하고 나머지 지점을 고정하면 치수 제어가 훨씬 용이해진다."},{"t":"li","v":"작업 청정도 유지: 가용접 완료 직후 와이어브러시 및 그라인더 사상 가공을 통해 표면의 산화막과 슬래그를 완벽하게 청소해야 본용접 합격률을 보장받을 수 있다."},{"t":"h3","v":"2.2 T형 필릿이음 가용접 규정"},{"t":"li","v":"보조 조립 치공구 활용: T형으로 조립되는 수평판과 수직판의 기하학적 직각도(90°) 유지를 위해 보조 지지판과 강력 C-클램프 등의 구속 지그를 완벽히 활용하여 조립해야 한다."},{"t":"li","v":"응력집중부 가접 금지: 구조물의 날카로운 모서리(Corner), 끝단부, 각진 경계 부위는 아크 응력이 고도로 집중되어 응착 피로 성능과 인성을 저해시키는 취약 지점이므로 가용접 위치로 절대로 설정해서는 안 된다."},{"t":"li","v":"시·종점부 결함 회피: 맞대기 본용접의 열쇠구멍(Key Hole) 형성과 이면비드 안착을 위해 가용접 비드는 용접부 시점과 종점(크레이터 발생 위험지)을 피해 배치한다."},{"t":"h3","v":"3. 용접 변형의 발생 기구와 공학적 변형 제어 기법"},{"t":"p","v":"용접 시 부재에 가해지는 고온의 열에너지는 모재 내부의 불균일한 급속 열팽창과 냉각 과정에서의 국부 수축 변형을 유발한다. 특히 응고 용융풀 주위에는 고온부 압축력에 의한 영구적인 소성 변형이 발생하며, 이는 구조물의 형상 불량 및 수명 단축을 일으키는 인장 잔류응력으로 고착화된다. 따라서 잔류응력과 소성 변형 거동을 사전에 제어하고 완화시키는 교정법 및 시공법 숙지는 국가검정 외부평가 지필과 실기 구술 시험의 필수 공략 핵심 이론이다."},{"t":"h3","v":"3.1 3차원 공간 수축 방향에 따른 변형 분류"},{"t":"p","v":"용접 변형은 공간적 방향성에 따라 크게 3가지 축(용접선 평행 방향, 직각 폭 방향, 두께 방향)으로 나뉜다. 이 중 두께 방향 수축은 기하학적 치수가 대단히 작아 무시되는 편이나, 용접선 방향과 폭 방향의 변형 거동은 주요 구조물 설계 시 면밀히 계산되어 반영되어야 한다."},{"t":"table","rows":[["수축 방향 분율","면내 변형 (In-plane Distortion)","면외 변형 (Out-of-plane Distortion)"],["용접선 방향 수축 (Longitudinal)","종수축 (Longitudinal Shrinkage) 회전변형 (Rotational Distortion)","종굽힘 변형 (Longitudinal Distortion)"],["폭 방향 수축 (Transverse)","횡수축 (Transverse Shrinkage)","횡굽힘 변형 (Transverse Distortion) → 대표적으로 각변형 (Angular Distortion) 발생"]]},{"t":"h3","v":"3.2 설계적 및 시공적 조립 수정 제어 기법"},{"t":"li","v":"설계적 관점: 최소 용착량(Minimum Deposit Area)을 갖도록 개선 그루브 형상의 갭(Gap) 및 베벨 홈 각도를 최적 설계값(60°±5°)으로 사전 조정하여 불필요한 열 변형 입열량을 줄인다."},{"t":"li","v":"시공적 관점: 변형이 발생할 것으로 예상되는 수치(각변형 등)만큼 사전에 반대 방향으로 2° 이하의 정밀 역변형 각도를 사전에 꺾어 준 후 조립 지그로 구속(Clamping) 및 스티프너(Stiffener)를 부착 시공한다."},{"t":"li","v":"구조 중립축 고려: 대형 종굽힘(Longitudinal Distortion) 변형 방지를 위해, 단면의 도심 즉 중립축에 대해 용접선에서 가해지는 수축 모멘트의 합이 '0'에 수렴하도록 정밀하게 정렬 조립 상태를 설계 수정해야 한다."},{"t":"h3","v":"3.3 스트롱 백(Strong-back) 지그의 역학적 원리 및 설계 조건"},{"t":"p","v":"스트롱 백은 맞대기용접 시 모재 상하판의 높이 단차를 일직선으로 교정하고, 꺾임 각변형과 비틀림 뒤틀림을 완벽하게 구속 제어하기 위해 일시적으로 이면이나 표면에 가접하여 설치하는 정밀 보강 지그이다."},{"t":"li","v":"양단 고정 방식: 변형이 크게 구속되는 대칭 구조물 조립 시 가접 보온 지그를 고정하여 판 상호 간의 일직선도 정밀성을 확보한다."},{"t":"li","v":"일단 유동 방식: 용접선이 길어 수축에 의한 길이 단축 및 종방향 수축 균열이 명확하게 예상되는 조립 환경에서는, 스트롱 백의 한쪽만 가접하여 구속력을 일부분 슬라이딩 방식으로 완화시킴으로써 잔류응력 축적으로 인한 초층 저온 균열 발생 위험성을 구조적으로 우회한다."},{"t":"li","v":"사후 가공 철저: 본용접이 완성된 직후에는 스트롱 백을 모재 충격을 회피하여 가스 불꽃 절단 또는 그라인더 절단으로 정밀 사상 제거해야 하며, 제거부가 모재 인성을 손상하지 않도록 깨끗이 마무리 사상 연마 작업을 거쳐야만 비파괴 탐상 시험(PT/MT)에서 불합격을 회피할 수 있다."},{"t":"h3","v":"4. 용접 구조물의 역학적 조립 시공 대원칙"},{"t":"p","v":"NCS 및 용접산업기사 실기 실무에서 변형과 인장 잔류응력을 최소화하기 위한 7대 조립 시퀀스 대원칙을 반드시 엄격히 준수하여 배치하여야 한다."},{"t":"table","rows":[["조립 순서 규칙","구체적인 시공 및 역학적 논거"],["1. 자유단 방출 원칙","동일 평면 내에서 다량의 이음부가 배치될 경우, 용접 수축량 및 인장 잔류응력 배출이 원활하도록 구속되지 않은 자유단(Free End) 쪽으로 수축 변형을 이동시키며 시공한다."],["2. 대칭 용접 원칙","용접 구조물의 기하학적 중심선(Centerline)을 기준으로 좌우/상하 대칭적으로 용접을 진행하여 변형 거동의 벡터 방향을 상호 균형있게 소멸시킨다."],["3. 모멘트 합 제로(0)","용접선 방향의 가열 수축 모멘트가 단면 중심축에 대해 상호 대칭으로 작용하게 설계하여 굽힘 비틀림 각변형의 상쇄를 유도한다."],["4. 맞대기 우선 원칙","맞대기이음과 필릿이음이 하나의 구조물 내에서 상호 교차할 경우, 용착량과 기하학적 수축 수치 거동이 월등히 큰 맞대기용접을 선행한 후 필릿용접을 나중에 수행한다."],["5. 중앙에서 방사형","구조물의 지리적 중앙에서부터 외부(끝 방향) 방사형으로 용접을 진행하여 국부적인 강성 구속을 완화한다."],["6. 가접용 지그 최대화","치수 형상 유지를 위해 탄성 역변형 지그, 포지셔너, 정반 및 스트롱 백을 최대한 시공에 복합 적용하여 물리적 구속 변형 억제력을 제어한다."],["7. 파이프(Tube) 원주 원칙","파이프 용접 시에는 최하단부인 6시 방향(위보기, Overhead)에서 아크를 생성하여 상향 상진으로 타고 올라가 최상단인 12시 방향(아래보기, Flat)에서 시퀀스를 마감하고 반대편도 동일하게 하단 위보기에서 시작하여 상단 아래보기에서 마감하여 용착 결함을 배제한다."]]},{"t":"h3","v":"5. GTAW용 텅스텐 전극봉 연마 원추 기하학 규격"},{"t":"p","v":"가스텅스텐아크용접(GTAW) 시 아크 기둥의 집중성과 물리적인 용입 및 비드 형상을 올바르게 조작하기 위해서는 전원 극성(DCEN/DCEP/AC) 및 적정 전류 부하 범위에 맞추어 텅스텐 전극봉 끝단 원추부 연마 기하학(Tip Grinding Geometry) 규정을 완벽히 연마 가공해야 한다."},{"t":"table","rows":[["전원 극성 및 부하 조건","끝단 연마 원추 길이 규격 (L)","아크 거동 및 공학적 특성"],["직류(DC) 200A 이하 저부하","원추 연마 길이 L ≒ 3D (D: 텅스텐 전극봉 지름)","끝단을 날카롭게 뾰족한 각도로 정밀 연마한다. 저전류 영역에서 아크 집중성과 지향성을 극대화시켜 극도의 박판 용접 시 언더컷이나 융합불량 없는 좁고 정밀한 비드를 실현한다."],["직류(DC) 200A 이상 고부하","원추 연마 길이 L ≒ 2D (D: 텅스텐 전극봉 지름)","끝단 원추 각도를 조금 둔하게(대략 30°~45°) 가공한다. 고부하 열량으로 인한 전극봉 끝단의 열화 소모 및 탈락을 방지하고 안정한 용입 기둥을 확보한다."],["교류(AC) 알루미늄 비철용","원추 연마 길이 L ≒ D / 2 (끝단 반구형 둥근 가공)","반주기 역극성 시간 동안 전극봉에 가해지는 과도한 열량(70% 전극 열 배분)에 아크 폭발 현상을 배제하기 위해, 끝단을 둥근 반구형태(Ball end)로 가공하여 고밀도 청정작용과 기하학적 균일 아크 전도를 유지한다."]]},{"t":"h2","v":"제2부: 대표 엄선 50제 마스터 실전 평가"},{"t":"p","v":"본 평가는 국가검정 과정평가형 용접산업기사 외부평가 최신 기출경향과 출제기준을 분석하여 엄선된 객관식 35문항과 고변별력 단답식/계산식 주관식 15문항으로 입체적으로 구성되었습니다. 모든 문제는 실제 NCS 학습모듈에 완전히 근거합니다."},{"t":"h3","v":"1. 4지선다형 객관식 실전 35문항"}],"questions":[{"n":1,"type":"mcq","stem":"다음 중 가용접(Tack Welding)의 공학적 목적과 역할에 대한 설명으로 가장 옳지 않은 것은?","choices":["본용접 전에 모재 그루브 개선면의 치수와 결합부 조립 정밀도를 유지하기 위해 실시한다.","용접 구조물이 본용접 중 열수축에 의해 각변형과 뒤틀림이 일어나는 것을 사전에 억제한다.","가용접 비드는 잠정 고정을 위한 임시 용접이므로 용접부 기계적 강도와 안전성에는 기여하지 않는다.","제품의 정밀도를 균일하게 하여 다량 생산 시 용접 조립 작업을 고도로 단순화시킨다."],"answerIndex":3,"answerText":"③ 가용접 비드는 잠정 고정을 위한 임시 용접이므로 용접부 기계적 강도와 안전성에는 기여하지 않는다.","explain":"가용접은 임시 고정이지만, 가용접 비드가 본용접 부의 초층(루트) 비드 내부에 매립되어 용융되거나, 외부 구속력을 전담하여 잔류응력을 수용하는 등 구조물의 역학적 신뢰성과 최종 인성에 막대한 직간접 영향력을 행사한다."},{"n":2,"type":"mcq","stem":"NCS 19편 학습모듈의 안전 보건 규정상 가용접 작업을 수행하기 위한 작업자의 자격 요건으로 옳은 것은?","choices":["가용접은 잠정 임시 고정이므로 숙련도가 낮거나 초보 용접사가 경험용으로 시행해도 무방하다.","본용접사와 대등하거나 혹은 그 이상의 우수한 기량과 숙련도를 갖춘 유자격 용접사가 수행하여야 한다.","가용접은 아크 열효율 제어가 불필요하므로 조립 지그 기계 세팅 작업자가 자율적으로 시행한다.","본용접 품질과 가용접은 역학적으로 상호 무관하므로 어떠한 작업자가 수행해도 강도 저하는 발생하지 않는다."],"answerIndex":2,"answerText":"② 본용접사와 대등하거나 혹은 그 이상의 우수한 기량과 숙련도를 갖춘 유자격 용접사가 수행하여야 한다.","explain":"가용접 비드는 급랭 속도가 본용접보다 매우 빨라 기공, 슬래그 혼입, 저온 균열 등이 발생할 감수성이 극히 높다. 따라서 이러한 결함을 방지하기 위해 반드시 본용접사와 동등하거나 그 이상의 숙련도를 지닌 검증된 용접사가 가용접을 시공해야 한다."},{"n":3,"type":"mcq","stem":"가스텅스텐아크용접(GTAW)을 활용하여 박판 및 중판 탄소강 구조물의 가용접을 시공할 때, 가용접부의 예열(Preheat) 온도 기준에 대한 공학적 설명으로 옳은 것은?","choices":["가용접 비드는 길이가 매우 짧아 급랭하기 쉬우므로, 본용접 규정 조건과 '동일한 예열 온도'를 반드시 준수해야 한다.","가용접은 짧은 아크 전도로 열영향이 경미하므로 예열을 가하지 않고 상온에서 즉시 급속 가접한다.","가용접 단계에서는 본용접 예열 규정 온도의 1.5배 이상으로 가열하여 용과재 소모량을 증가시킨다.","예열은 모재 변형을 더 극대화시키는 부작용이 있으므로, 가용접 작업 전에는 무조건 예열을 금지하여야 한다."],"answerIndex":1,"answerText":"① 가용접 비드는 길이가 매우 짧아 급랭하기 쉬우므로, 본용접 규정 조건과 '동일한 예열 온도'를 반드시 준수해야 한다.","explain":"가용접부는 비드 길이가 30~50mm 정도로 대단히 짧아 용접 열량이 주위 모재로 급격히 빼앗겨 냉각되는 온도 기울기가 가파르다. 이로 인한 경화 조직 형성과 저온 수소 지연 균열을 예방하기 위해 반드시 본용접과 '동일한 예열 온도' 조건에서 예열을 완료한 뒤 가접해야 한다."},{"n":4,"type":"mcq","stem":"가용접 비드를 홈(Groove) 내부 그루브에 부득이 배치하였을 경우, 본용접 시 결함을 방지하기 위해 수행하여야 하는 올바른 조치는?","choices":["홈 안의 가용접부는 본용접 금속과 완벽히 융합되므로 아무런 가공 없이 그대로 덮어 본용접을 진행한다.","홈 내부에 가접된 비드를 본용접 수행 전 핸드 그라인더로 사상하여 완전히 갈아내고 백치핑 청소를 완료한다.","가용접부 위에 슬래그 해머 타격만 가하여 산화막을 깨뜨린 후 즉시 전진법으로 아크 용융을 시작한다.","본용접 아크 전압을 낮추어 가용접 비드가 녹지 않도록 우회 비드를 길게 쌓아 용착시킨다."],"answerIndex":2,"answerText":"② 홈 내부에 가접된 비드를 본용접 수행 전 핸드 그라인더로 사상하여 완전히 갈아내고 백치핑 청소를 완료한다.","explain":"그루브 홈 내부에 시공된 임시 가용접 비드는 본용접 금속 아크 전도 시 융합 불량이나 기공, 슬래그 섞임 등 복합 결함을 야기할 우려가 대단히 높다. 따라서 본용접 작업을 개시하기 전 그라인딩 가공을 통해 가접부를 완전히 소거하고 백치핑 사상을 완료하는 것이 품질 검사 합격의 정석이다."},{"n":5,"type":"mcq","stem":"다음 중 가용접을 배치하기에 부적절한 '가용접 절대 금지 구역'으로 올바르게 짝지어진 것은?","choices":["평판 중앙부, 맞대기 개선 홈 표면","구조물의 날카로운 모서리(Corner) 및 응력이 과도하게 집중되는 부위","가용접용 조립 지그와 스토퍼가 완벽히 고정된 부위","평판의 중심선으로부터 좌우 대칭이 이루어지는 수평 구간"],"answerIndex":2,"answerText":"② 구조물의 날카로운 모서리(Corner) 및 응력이 과도하게 집중되는 부위","explain":"구조물의 모서리(Corner) 및 각진 경계 부위는 열수축 인장 응력 벡터가 한곳으로 급격히 수렴 축적되는 '응력집중부'이다. 이 구역에 취약한 급랭 가용접 비드가 안착하면 본용접 시 극심한 고온/저온 취성 파괴 균열이 전파되므로 철저히 가접을 배제해야 한다."},{"n":6,"type":"mcq","stem":"강도상 대단히 중요한 주요 이음부 가용접 시, 용착 불량, 슬래그 혼입, 기공 등 용접부 결함이 연속적으로 누적되어 발생하는 것을 막기 위해 피해야 하는 시공 위치는?","choices":["지그 바이스 가압 가해부 정중앙 지점","모재 두께의 25배 이상 떨어져 구속력이 균일한 지점","모재의 수평 가이드선 및 스트롱 백 이면부","구조물의 시점(아크 시작점)과 종점(크레이터부)"],"answerIndex":4,"answerText":"④ 구조물의 시점(아크 시작점)과 종점(크레이터부)","explain":"본용접의 완전한 백비드(이면비드) 용입의 열쇠인 키홀(Key Hole) 형성과 크레이터 함몰부 처리를 위해, 본용접 비드의 시작 지점(시점)과 아크 마감부(종점, 크레이터부)는 가용접을 피해 배치하는 것이 결함 발생을 사전에 소멸시키는 규칙이다."},{"n":7,"type":"mcq","stem":"I형 맞대기이음 용접 구조물을 가용접으로 일시적 조립 고정을 할 때, 루트 간격 및 정렬 조건으로 가장 적합한 것은?","choices":["보호가스 뒷받침 홈 정중앙에 용접선을 정확히 밀착시키고 루트 간격이 거의 없도록 배치 정렬한다.","루트 간격을 최소 5.0mm 이상 벌려 다량의 용가재가 급격히 유입되도록 개선 홈을 구속한다.","판 단차 수정을 회피하기 위해 한쪽 판을 3.0mm 이상 겹치도록 편심 단차를 주어 가접한다.","가용접 지점마다 루트 간격을 0mm에서 4mm까지 지그재그 형태로 변동시켜 각변형률을 분산시킨다."],"answerIndex":1,"answerText":"① 보호가스 뒷받침 홈 정중앙에 용접선을 정확히 밀착시키고 루트 간격이 거의 없도록 배치 정렬한다.","explain":"I형 맞대기이음 가조립 시에는 보호가스 이면 퍼징 효과와 완전 용입을 위해 모재의 맞대기선을 뒷받침 홈 정중앙에 정확히 일치 정렬시키고 루트 간격(Gap)은 거의 없도록 조밀하게 밀착 가접하는 것이 원칙이다."},{"n":8,"type":"mcq","stem":"I형 맞대기이음 가조립 가용접 시, 모재 두께(t)에 비례하여 가용접 지점 간의 간격을 정하는 대원칙의 공학적 기준으로 옳은 것은?","choices":["모재 두께의 약 5배 (5t)","모재 두께의 약 10배 (10t)","모재 두께의 약 25배 (25t)","모재 두께의 약 50배 (50t)"],"answerIndex":3,"answerText":"③ 모재 두께의 약 25배 (25t)","explain":"가가용접 지점 간의 적정 배치 거리는 판 두께(t)가 두꺼워질수록 강력한 구속 지지력이 요구되므로, 모재 두께의 25배(25t)를 표준 간격 범위로 산정하여 등간격으로 가접을 전개한다."},{"n":9,"type":"mcq","stem":"여러 장의 모재 판재를 일렬로 배열하여 조립하는 가용접 공정에서, 치수 단차 제어와 각변형 방지를 도모하기 위한 가장 편리한 가용접 배치 순서는?","choices":["중앙 한 점만 가접한 후 즉시 본용접을 개시한다.","왼쪽 끝에서 시작하여 오른쪽 끝까지 한 방향으로 순차적으로 모든 지점을 배치한다.","양 끝단을 먼저 확실히 가접(Tack)하여 형상을 잡은 후, 정중앙을 가접하고 나머지 지점을 가용접한다.","지그재그 임의 배치를 기본으로 하여 뒤틀림이 일어나는 순간 반대 방향을 대량 가접한다."],"answerIndex":3,"answerText":"③ 양 끝단을 먼저 확실히 가접(Tack)하여 형상을 잡은 후, 정중앙을 가접하고 나머지 지점을 가용접한다.","explain":"여러 장의 모재 판재 조립 시 가용접은 끝에서부터 순차적 배열이 대원칙이지만, 실무 조립 작업 시에는 기하학적 형상 단차를 방지하고 편리하게 가접하기 위해 양 끝단을 우선 고정 가접(Tack)한 후 중앙부를 가접하고 나머지 지점을 채워 나가는 절차가 매우 효과적이다."},{"n":10,"type":"mcq","stem":"T형 필릿이음 구조물의 가조립 시, 수평판과 수직판의 완벽한 수직도(90도)를 유지하고 뒤틀림 각변형을 방지하기 위해 역학적으로 적용해야 하는 치공구 세트는?","choices":["보조 지지판 및 클램프 지그","수동 그라인더 및 와이어브러시","텅스텐 전극 연마기 및 직각자","멍키스패너 및 동해머 타격구"],"answerIndex":1,"answerText":"① 보조 지지판 및 클램프 지그","explain":"T형 필릿이음 조립 시 가용접 전 모재 간의 정밀한 90도 각도 조립과 면외 각변형 억제를 위해서는 보조 지지판과 강력 C-클램프 등 압착 구속 치공구를 긴밀하게 결합 적용하여야 한다."},{"n":11,"type":"mcq","stem":"다음 중 용접변형(Welding Distortion)의 발생 기구를 물리적 관점에서 올바르게 설명한 것은?","choices":["전자기력에 의한 아크 쏠림(자기 쏠림) 현상으로 인해 아크 기둥이 물리적으로 한쪽으로 강하게 경사지기 때문이다.","용착 금속 내에 다량 침투한 수소 가스가 상온에서 기화 팽창하면서 내부 압력에 의해 굽힘 현상을 가하기 때문이다.","아크 고온에 의한 화학적 가스 해리 작용으로 결정립계가 과대 조대화되어 휨 현상이 발생한다.","금속의 가열 시 급격한 열팽창과 냉각 시의 체적 수축 과정에서 고온 응고부에 영구 압축 소성변형이 잔류하기 때문이다."],"answerIndex":4,"answerText":"④ 금속의 가열 시 급격한 열팽창과 냉각 시의 체적 수축 과정에서 고온 응고부에 영구 압축 소성변형이 잔류하기 때문이다.","explain":"용접 변형은 가열 시 팽창하려는 금속 부피가 주변 구속과 온도 차이에 의해 압축 소성 변형을 겪고, 응고 냉각 과정에서 원래 체적으로 완화 복원되지 못하고 물리적 수축 상태로 고착 잔류하기 때문에 나타난다."},{"n":12,"type":"mcq","stem":"용접 변형의 3차원 공간 거동 중 두께 방향 수축 변형량은 일반적으로 치수가 미미하여 무시되는 편이다. 그렇다면 변형 방지 설계 시 가장 지배적으로 고려해야 할 수축 방향 2가지는?","choices":["용접선 방향 수축 및 폭 방향 수축","중립축 수축 및 비드 높이 수축","두께 방향 수축 및 체적 수축","전자기 방향 수축 및 표면 거칠기 수축"],"answerIndex":1,"answerText":"① 용접선 방향 수축 및 폭 방향 수축","explain":"용접 수축에 의한 변형 거동은 공간 축상 3방향 중 두께 방향 수축량은 치수가 매우 미미하여 거동 계산에서 생략되나, 용접선 평행 방향 수축과 개선 홈 폭 방향 수축 거동은 대단히 큰 종굽힘, 각변형, 뒤틀림을 야기하므로 집중 설계 인자로 취급된다."},{"n":13,"type":"mcq","stem":"용접선 방향 수축에 기인하여 발생하는 면내 변형과 면외 변형이 올바르게 짝지어진 것은?","choices":["면내 변형: 종수축, 회전변형 / 면외 변형: 종굽힘 변형","면내 변형: 횡수축, 각변형 / 면외 변형: 좌굴 변형","면내 변형: 각변형, 종수축 / 면외 변형: 횡굽힘 변형","면내 변형: 나선 변형, 종굽힘 / 면외 변형: 회전변형"],"answerIndex":1,"answerText":"① 면내 변형: 종수축, 회전변형 / 면외 변형: 종굽힘 변형","explain":"용접선 방향 수축에 기인하는 면내 변형에는 종수축(Longitudinal Shrinkage)과 진행에 따른 회전변형(Rotational Distortion)이 속하며, 면외 방향으로 완만한 곡선을 그리며 구부러지는 현상을 종굽힘 변형(Longitudinal Distortion)이라 정의한다."},{"n":14,"type":"mcq","stem":"폭 방향 가열 수축 거동 시, 실제 용접부에서는 판 두께 방향의 온도 분포가 불균일하여 면외의 횡굽힘 변형이 유발된다. 이를 지칭하는 보편적인 용어는?","choices":["종수축 변형","좌굴 변형(Buckling)","각변형(Angular Distortion)","회전변형(Rotational Distortion)"],"answerIndex":3,"answerText":"③ 각변형(Angular Distortion)","explain":"가열에 의한 온도 분포가 판 두께 방향으로 균일하지 않아 국부 수축량 편차에 의해 모재 가 용접 중심선을 축으로 꺾여 구부러지는 횡굽힘 면외 변형을 각변형(Angular Distortion)이라 부른다."},{"n":15,"type":"mcq","stem":"다음 중 용접변형을 제어하기 위해 조립 단계를 '설계적인 측면'에서 수정 보완하는 방법으로 가장 적당한 것은?","choices":["용착량이 최소가 되도록 V 홈의 루트 간격과 개선 각도를 축소 수정한다.","모재를 물에 젖은 석면포로 덮어 강제로 급랭시키는 냉각 수랭법을 개시한다.","용접 전원 장치에 전격방지기 및 고주파 아크 발생기를 이중으로 결선한다.","가조립 완료 후 이음부를 망치로 강하게 두들기는 열간 피닝법을 실시한다."],"answerIndex":1,"answerText":"① 용착량이 최소가 되도록 V 홈의 루트 간격과 개선 각도를 축소 수정한다.","explain":"가조립 정렬 확인 후 변형을 경감하기 위해 조립 조건을 '설계적 측면'에서 수정한다는 의미는, 모재 V 개선 각도와 루트 갭을 기준 한계치(60도 내외)로 정밀하게 축소 수정함으로써 불필요한 용착 금속량과 가열 입열량을 소거해 주는 가공 설계를 말한다."},{"n":16,"type":"mcq","stem":"긴 구조물의 용접에 의한 종굽힘 변형을 원천적으로 차단하기 위해 조립 시 단면 설계 측면에서 수정해야 할 사항은?","choices":["맞대기용접의 다층 쌓기 시 캐스케이드법 대신 무조건 빌트업법을 적용한다.","용접선의 교차를 최대로 늘려 수축 부하를 분산 제어한다.","개선각도를 90도 이상으로 대폭 늘려 입열 전도 방향을 다각화한다.","단면의 도심이자 구조 중립축을 정밀 고려하여 용접선 위치를 이동 수정한다."],"answerIndex":4,"answerText":"④ 단면의 도심이자 구조 중립축을 정밀 고려하여 용접선 위치를 이동 수정한다.","explain":"용접선의 수축 인장력이 단면의 가열 중립축에서 어긋나면 거대한 종굽힘 모멘트 하중이 발생하여 비틀림 굽힘이 일어난다. 따라서 조립 시 설계상 구조 중립축을 정밀 분석하여 용접선 위치를 도심에 일치시키도록 조립 상태를 정밀 수정해야 한다."},{"n":17,"type":"mcq","stem":"다음 중 용접 시공 시 가조립 변형이 명확히 예상될 때, 시공적(작업적) 측면에서 수립해야 하는 수정 제어 조립법에 해당하지 않는 것은?","choices":["역변형 상태 수정 조립 (2도 이하의 사전 역변형 적용)","조립용 바이스 및 클램프(Clamping) 구속 지그 활용","스티프너(Stiffener) 부착 보강 수정 시공","고속 자동 일원화 제어 회로 설치 및 고전류 다운슬로프 제어"],"answerIndex":4,"answerText":"④ 고속 자동 일원화 제어 회로 설치 및 고전류 다운슬로프 제어","explain":"수정 제어 가조립 조립법으로는 역변형법(사전 꺾임), C-클램프 및 바이스 구속 지그 활용, 강성 보강 스티프너 부착이 시공적으로 속하며, 고속 제어 회로 배선 등은 전력 하드웨어 설치 부문이므로 조립 시공 수정 범주에 해당하지 않는다."},{"n":18,"type":"mcq","stem":"맞대기용접 시 모재 상하판의 단차를 완벽히 교정하고, 꺾임 각변형 및 뒤틀림을 구속 방지하기 위해 용접 전에 표면이나 이면에 일시적으로 가접 설치하는 치공구의 명칭은?","choices":["포지셔너 (Positioner)","턴 테이블 (Turn Table)","스트롱 백 (Strong-back)","매니퓰레이터 (Manipulator)"],"answerIndex":3,"answerText":"③ 스트롱 백 (Strong-back)","explain":"맞대기이음 가조립 단계에서 판 상호 간의 수직 단차를 수정하고, 본용접 열량에 의한 각변형과 비틀림 나선 변형을 강하게 역학 구속하기 위해 표면이나 이면에 일시 가접하는 보강 지그는 스트롱 백(Strong-back)이다."},{"n":19,"type":"mcq","stem":"스트롱 백(Strong-back)을 설계 및 가접할 때, 모재 길이가 길어 수축에 의한 초층 루트 지연 균열이나 구속 균열이 명확하게 우려될 경우 채택해야 하는 조립 고법은?","choices":["양쪽 모두를 견고하게 완전 구속하여 가접하는 양단 고정 방식","한 쪽이 수축 거동에 따라 유동할 수 있도록 한 쪽만 가접하는 일단 유동 방식","아크 시작점에만 집중적으로 100mm 이상 길게 가접하는 크레이터 가접 방식","스트롱 백을 가접하지 않고 단순히 모재 위에 올려두는 무구속 적재 방식"],"answerIndex":2,"answerText":"② 한 쪽이 수축 거동에 따라 유동할 수 있도록 한 쪽만 가접하는 일단 유동 방식","explain":"수축 균열(구속 저온 균열) 방지와 잔류응력 완화가 명확히 조립 조건상 요구될 때에는 스트롱 백의 양단을 고정하지 않고, 일단을 가접하지 않고 유동(Sliding)이 가능하도록 일단 유동 방식으로 가접 설계하여 수축 완화 거동을 실현한다."},{"n":20,"type":"mcq","stem":"본용접 완료 후 스트롱 백(Strong-back)을 소거할 때 가해지는 기계적 손상을 방지하기 위한 정석 관리 수칙은?","choices":["모재 표면에 충격을 주는 수동 해머 해머질로 강제 타격하여 날려 보낸다.","가스 절단기 또는 사상 그라인더를 사용하여 모재 손상 없이 소거하고 마무리 연마 사상 작업을 정밀히 시행한다.","스트롱 백은 모재의 영구 보강재이므로 본용접 완료 후에도 절대로 제거하지 않고 그대로 방치 보존한다.","비파괴 방사선 투과 시험(RT) 시 투과도 향상을 위해 스트롱 백 부근을 아크에어가우징으로 깊게 파내어 소거한다."],"answerIndex":2,"answerText":"② 가스 절단기 또는 사상 그라인더를 사용하여 모재 손상 없이 소거하고 마무리 연마 사상 작업을 정밀히 시행한다.","explain":"본용접 마감 후 스트롱 백 제거 시 모재에 해머 질을 가하면 국부 충격 전단 파괴 균열이 HAZ에 유발된다. 따라서 사상 그라인더나 가스불꽃으로 모재 손상 없이 소거하고, 제거부 자리를 매끄럽게 그라인딩 연마 사상해야 품질 검사에서 합격할 수 있다."},{"n":21,"type":"mcq","stem":"용접 구조물의 조립 시 변형과 잔류응력을 예방하기 위한 7대 조립 시공 원칙 중 '수축이 자유롭게 자유단 방출'되도록 조립하는 방법은?","choices":["동일 평면 내 복합 이음 시 수축은 가능한 자유단(Free End) 쪽으로 보내며 시공 순서를 수립한다.","이음을 최대한 한곳에 밀집 구속시킨 상태에서 사방을 동시 용접한다.","용착량이 비교적 작은 필릿용접을 전체 구조물에서 무조건 선행 완료한다.","수축이 발생하기 전 고온(700도 이상)에서 살수법으로 찬물을 대량 살포한다."],"answerIndex":1,"answerText":"① 동일 평면 내 복합 이음 시 수축은 가능한 자유단(Free End) 쪽으로 보내며 시공 순서를 수립한다.","explain":"동일 평면상 다수의 용접부가 겹쳐 있을 때 구속과 열 수축 응력의 상쇄 및 방출을 도모하려면 수축이 저항을 받지 않고 배출될 수 있는 구속되지 않은 자유단(Free End) 쪽으로 시공 순서를 배열해야 한다."},{"n":22,"type":"mcq","stem":"용접 이음에 의해 발생하는 열변형 벡터 힘이 상호 균형을 이루어 소쇄되도록 하는 '대칭 용접 원칙'의 정석 방법은?","choices":["모재의 왼쪽 끝에서 오른쪽 끝까지 쉬지 않고 논스톱으로 고속 전진 운봉하여 마친다.","구조물의 중심선(Centerline)을 기준으로 좌우·상하에 균형 있게 분산하여 용접한다.","비드 단면적을 구간마다 임의로 다르게 하여 단차별 전류 값을 각각 개별 세팅한다.","용착 금속이 한곳에 집중 적층되도록 다층 쌓기를 빌트업법으로만 계속 편향 시공한다."],"answerIndex":2,"answerText":"② 구조물의 중심선(Centerline)을 기준으로 좌우·상하에 균형 있게 분산하여 용접한다.","explain":"변형 최소화를 위한 대칭 용접 원칙은 용접 구조물의 평면 중심선(Centerline)을 원점으로 하여 좌우 및 상하 방향에 동일 전력 입열 벡터가 작용하도록 시공 순서를 대칭 배합하여 수축력을 상호 상쇄 제어하는 기법이다."},{"n":23,"type":"mcq","stem":"용접 구조물 조립 시 맞대기이음(Butt Joint)과 필릿이음(Fillet Joint)이 동시에 혼재하여 발생할 경우, 변형 제어를 위한 올바른 용접 시공 순서는?","choices":["두 용접의 선행 순서는 변형에 아무런 영향을 미치지 않으므로 작업자의 편의에 따라 혼합 동시 진행한다.","맞대기와 필릿을 대각선 교차 지점에서 동일 아크 열원으로 동시 위빙 접합한다.","필릿용접을 완벽하게 우선 선행 완료한 후, 수축 변형을 무시하고 맞대기용접을 나중에 시행한다.","수축 및 변형량 거동이 월등히 크게 나타나는 맞대기용접을 먼저 완전히 완료한 후, 필릿용접을 나중에 진행한다."],"answerIndex":4,"answerText":"④ 수축 및 변형량 거동이 월등히 크게 나타나는 맞대기용접을 먼저 완전히 완료한 후, 필릿용접을 나중에 진행한다.","explain":"맞대기이음은 필릿이음보다 훨씬 두꺼운 단면과 많은 용착 적층 열량이 가해지므로 물리적 수축 변형 거동이 대단히 크게 작용한다. 따라서 수축 거동이 큰 맞대기이음을 사전에 먼저 완료하여 형상을 굳힌 후 필릿용접을 후행하는 것이 정석 조립 시퀀스이다."},{"n":24,"type":"mcq","stem":"구조물이 수평 방향으로 길게 나열되는 대형 블록 부재 조립 시, 강성 구속을 완화하고 변형을 배출하기 위한 정석 용접 시공 순서 방향은?","choices":["구조물의 정중앙부(중심 영역)에서 시작하여 외부 바깥 끝단 방향으로 용접을 뻗어 나간다.","용접 진행 방향과 역방향이 완벽히 교차하는 전진블록법으로 우측 단독 편향 용접한다.","고정 지그를 모두 해체한 임시 가조립 상태에서 바닥면 회전 롤러를 고속 가동하여 회전 용접한다.","블록의 바깥쪽 테두리 양 끝에서 시작하여 내부 정중앙 방향으로 용접을 모아온다."],"answerIndex":1,"answerText":"① 구조물의 정중앙부(중심 영역)에서 시작하여 외부 바깥 끝단 방향으로 용접을 뻗어 나간다.","explain":"용접 수축이 자유롭게 빠져나가도록 구속이 작은 중앙부에서 시작해 바깥 끝단 방향으로 용접을 뻗어 나가는 것이 대형 블록 조립의 정석입니다. 바깥에서 안쪽으로 모아오면 수축 여유가 사라져 잔류응력과 균열이 집중됩니다. ※ 원본 교재에 정답·해설이 누락되어 표준 이론에 근거해 보완한 문항입니다."},{"n":25,"type":"mcq","stem":"가스텅스텐아크용접(GTAW/TIG)을 활용하여 파이프 원주(원형 관) 조립 용접 시, 중력에 의한 용락 방지 및 비드 결함 제어를 위한 표준 조립 용접 시퀀스는?","choices":["최상단 12시(아래보기)에서 아크를 생성하여 하향으로 타고 내려와 6시(위보기)에서 끝낸다.","최하단 6시(위보기) 자세에서 아크를 생성하여 상향 상진으로 타고 올라가 최상단 12시(아래보기)에서 완료한다.","파이프 내부에서 고압 아르곤 가스를 송풍하며 3시 방향에서 9시 방향으로 수평 직선 용접한다.","텅스텐 전극봉을 역극성으로 배선하여 원주 용접 속도를 분당 1m 이상 고속 제어한다."],"answerIndex":2,"answerText":"② 최하단 6시(위보기) 자세에서 아크를 생성하여 상향 상진으로 타고 올라가 최상단 12시(아래보기)에서 완료한다.","explain":"파이프 용접 시 중력에 의해 용융지가 하방으로 용락(Burn-through)되는 것을 막고, 아크 열을 균일 전도시키기 위해 최하단 6시 위보기(Overhead) 자세에서 시작하여 상향 상진으로 타고 올라가 최상단 12시 아래보기(Flat) 자세에서 마감 정렬 시공한다."},{"n":26,"type":"mcq","stem":"직류(DC) 전원을 사용하고 전류 부하 범위가 200A 이하인 박판 가스텅스텐아크용접(GTAW) 시, 안정한 아크 지향성과 집중성을 확보하기 위한 텅스텐 전극봉 끝단 원추 연마 길이(L) 규격은? (단, D는 전극봉 지름)","choices":["L ≒ D / 2","L ≒ D","L ≒ 2D","L ≒ 3D"],"answerIndex":4,"answerText":"④ L ≒ 3D","explain":"직류(DC) 200A 이하의 저전류 박판 GTAW 시공 시에는 아크의 지향 집중성을 극대화시키기 위해 텅스텐 전극봉 끝단을 날카롭게 원추형으로 연마해야 하므로, 원추 연마 길이(L)를 지름(D)의 약 3배(L ≒ 3D) 크기로 정밀 가공 연마한다."},{"n":27,"type":"mcq","stem":"직류(DC) 전원을 사용하고 전류 부하 범위가 200A를 초과하는 고부하 다층 GTAW 용접 시, 전극봉 끝단의 과도한 열화 소모 및 탈락 결함을 방지하기 위해 가공하는 끝단 원추 연마 길이(L) 규격은? (단, D는 전극봉 지름)","choices":["L ≒ D / 2","L ≒ D","L ≒ 2D","L ≒ 3D"],"answerIndex":3,"answerText":"③ L ≒ 2D","explain":"직류(DC) 200A 이상의 고전류 부하 용접 시 전극봉 끝이 과도하게 뾰족하면 아크열에 의해 텅스텐 끝단이 용융 소손되어 용융지 내부로 탈락 분출되는 텅스텐 혼입 결함이 유발된다. 따라서 끝단 원추부 연마 길이(L)를 지름(D)의 약 2배(L ≒ 2D) 크기로 다소 뭉뚝하게 둔각 연마 가공한다."},{"n":28,"type":"mcq","stem":"알루미늄 합금이나 마그네슘 합금 등을 교류(AC) 전원을 사용하여 가스텅스텐아크용접(GTAW) 조립 가용접 시, 아크 분산과 폭발을 제어하기 위해 연마하는 텅스텐 전극봉의 기하학 형태와 연마 원추 길이(L)는? (단, D는 전극봉 지름)","choices":["끝단을 날카롭게 연마하여 L ≒ 3D로 가공한다.","끝단 각도를 15도 미만으로 매우 좁게 하여 L ≒ 5D로 정밀 연마한다.","끝단을 둥근 반구형(Ball end) 형태로 연마 가공하며 L ≒ D / 2 규격으로 연마한다.","전극봉 몸체 자체를 편심 가공하여 사각형 단면 형상으로 샌딩 연마한다."],"answerIndex":3,"answerText":"③ 끝단을 둥근 반구형(Ball end) 형태로 연마 가공하며 L ≒ D / 2 규격으로 연마한다.","explain":"교류(AC) 전원을 가동하는 알루미늄 비철금속 가조립 가용접 시에는 전극봉 단면에 가해지는 양극 열전도 충격을 흡수 분산시키기 위해 텅스텐 전극봉 끝단을 둥근 반구형(Ball-end)으로 연마하며, 원추 연마 길이 규격 L ≒ D / 2 로 조작하여 안정한 클리닝 거동을 유도한다."},{"n":29,"type":"mcq","stem":"가용접 비드를 모재 V 홈 그루브 내부에 정성껏 시공할 때, 아크 발생을 대단히 신속하고 원활하게 이끌기 위한 올바른 전륫값 제어 수칙은?","choices":["아크 발생을 위해 본용접 전류 규정 값보다 10%~20%가량 높은 전류 값을 세팅하여 가접한다.","아크를 부드럽게 하려고 저전류 수하특성을 유지하여 용과재가 홈 벽면에 천천히 융착되게 한다.","아크 발생 점을 그루브 홈 외부 모재면으로 넓게 분산시켜 아크 스트라이크를 다량 유발한다.","본용접 시 설정 전륫값보다 전압과 전류를 의도적으로 낮추어 용융지의 급랭을 유도한다."],"answerIndex":1,"answerText":"① 아크 발생을 위해 본용접 전류 규정 값보다 10%~20%가량 높은 전류 값을 세팅하여 가접한다.","explain":"가용접은 용착 비드가 짧아 아크 발생 시작 속도가 매우 신속해야 한다. 따라서 아크 발생 지연에 의한 융합 불량 및 기공을 회피하기 위해 가접 아크 형성 시에는 본용접 시보다 10%~20% 가량 약간 높은 전류 값을 순간 통전하여 조작한다."},{"n":30,"type":"mcq","stem":"용접 구조물의 가용접 작업 중 표면 및 이면에 발생한 슬래그(Slag) 결함에 대한 올바른 품질 보증 처리 대책은?","choices":["슬래그의 표면 경화력을 이용해 본용접 수축률을 억제하도록 조립 지그 내부에 매립 보관한다.","슬래그 부위에 녹 방지 방청유 및 유질성 오일을 도포하여 아크 분위기를 CO2 가스로 치환한다.","슬래그는 본용접 진행 중에 아크 열에 모두 녹아 연소 증발하므로 별도의 제거가 불필요하다.","가용접 단계에서 생긴 슬래그는 슬래그 해머와 철 솔, 그라인더로 잔류물 없이 완전 제거한다."],"answerIndex":4,"answerText":"④ 가용접 단계에서 생긴 슬래그는 슬래그 해머와 철 솔, 그라인더로 잔류물 없이 완전 제거한다.","explain":"가용접 단계에서 유발된 산화막과 슬래그 결함을 잔류한 상태로 본용접을 덮어씌우면, 전 층의 슬래그가 본용접부 깊숙이 매립되는 치명적인 구조 결함인 슬래그 섞임(Slag Inclusion)이 유출된다. 반드시 슬래그 해머 및 철 솔로 100% 청정 세정 완료해야 한다."},{"n":31,"type":"mcq","stem":"다음 중 가용접 시 발생하는 아크(Arc) 기둥의 3대 열역학적 물리 요소가 아닌 것은?","choices":["아크 기둥의 열적 집중성 및 지향성","보호가스(Ar)의 기밀 차폐성과 분사 유량","모재 및 용과재의 용융·급랭 응고 속도","용제 플럭스의 화학 탈산 해리 반응"],"answerIndex":4,"answerText":"④ 용제 플럭스의 화학 탈산 해리 반응","explain":"GTAW는 플럭스(용제)를 쓰지 않는 불활성 가스 차폐 용접법이므로 ‘용제 플럭스의 탈산 해리 반응’은 아크 기둥의 열역학 요소가 될 수 없습니다. ※ 원본 교재에 정답·해설이 누락되어 표준 이론에 근거해 보완한 문항입니다."},{"n":32,"type":"mcq","stem":"탄소강 모재의 두께가 t9.0mm 일 때, 공학적으로 가용접 비드의 간격을 모재 두께의 25배로 균일하게 배치하고자 한다. 다음 중 적정 가용접 비드 간 거리(mm)는?","choices":["100 mm","150 mm","225 mm","350 mm"],"answerIndex":3,"answerText":"③ 225 mm","explain":"모재 두께(t)가 9.0mm 일 때, 공학 표준 가용접 비드 간 거리 공식인 25t 대입 시, 25 × 9.0mm = 225mm 거리가 도출된다."},{"n":33,"type":"mcq","stem":"두께 25mm를 초과하는 중후판 강재 가조립 가용접 시 발생하기 쉬운 용접 결함인 '저온 균열(지연 균열)'을 억제하기 위해 수립해야 하는 필수적 온도 제어 요건은?","choices":["가용접 완료 즉시 얼음물을 투하하는 급랭 강제 냉각","상온(0도 이하) 노출 방치 및 가스 퍼징 전면 생략","모재 재질 및 강도 등급에 알맞은 충분한 예열 온도 적용과 서랭 보온 관리","층간 온도를 최대 500도 이상으로 가열 유지하는 지속 가스 가열"],"answerIndex":3,"answerText":"③ 모재 재질 및 강도 등급에 알맞은 충분한 예열 온도 적용과 서랭 보온 관리","explain":"중후판 가용접은 극심한 구속도가 가해져 저온 수소 지연 균열 위험도가 매우 가파르다. 이를 소멸시키기 위해서는 강재 성분 분석 규격에 지정된 적정 예열 온도를 완벽히 가한 후 가접하고, 냉각 시에도 보온재 등을 덮어 서랭(Slow Cooling)을 유도해야 저온 응력 취성이 완화된다."},{"n":34,"type":"mcq","stem":"가스텅스텐아크용접(GTAW) 시 산소 유입으로 인한 용융지 산화를 막기 위해, 접착제가 약하게 도포되고 연소 시 유해 가스 성분이 발생하지 않는 가두리 보호 가스 퍼징 보조재는?","choices":["일반 셀로판 종이테이프","알루미늄 전용 실링 테이프","유질성 페인트 그리스 필름","고무 아스팔트 프라이머 시트"],"answerIndex":2,"answerText":"② 알루미늄 전용 실링 테이프","explain":"이면 퍼징 구역을 막는 보조재로는 접착력이 약하고 연소 시 유해가스가 나오지 않는 알루미늄 전용 실링 테이프를 사용합니다. 셀로판·유질성 필름은 연소 시 가스와 탄화물을 발생시켜 용융지를 오염시킵니다. ※ 원본 교재에 정답·해설이 누락되어 표준 이론에 근거해 보완한 문항입니다."},{"n":35,"type":"mcq","stem":"가용접 작업이 구조물의 치수 안정성에 절대적인 영향을 미침에도 불구하고, 구속력(Constraint Force)이 너무 가혹하게 크게 작동하도록 지그를 조립할 때 발생하는 부작용은?","choices":["용접부 변형이 영구 소멸되어 어떠한 응력도 잔류하지 않는다.","인장 잔류응력이 과도하게 축적되어 용접 구조물 균열(Crack) 및 저온 파괴가 발생하기 쉽다.","용착 용융 속도가 2배 이상 빨라져 용과재 소비량이 급감한다.","보호가스의 층류 유도가 방해되어 기공(Blowhole) 결함만 증가한다."],"answerIndex":2,"answerText":"② 인장 잔류응력이 과도하게 축적되어 용접 구조물 균열(Crack) 및 저온 파괴가 발생하기 쉽다.","explain":"용접 구조물의 치수를 정밀하게 유지한다는 목적 하에 지그의 물리 구속력(Constraint Force)을 너무 가혹하게 높여 수축 변형을 강제로 틀어막으면, 내부 응력이 소성 변형으로 완화되지 못하고 극한의 인장 잔류응력으로 고착 누적되어 용접부 파괴와 비드 균열을 직면한다. 2. 명확한 기술형 주관식 15문항 정답 및 정밀 공학해설"},{"n":36,"type":"short","stem":"가용접(Tack Welding)의 원래 공학 정의이자, 본용접 전에 모재 그루브를 잠정적으로 고정하기 위해 시공하는 이 임시 용접의 영문 실무 통칭 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"가용접 (또는 가접, Tack Welding)","explain":"본용접을 가하기 전 부재의 임시 고정을 위해 가하는 짧은 임시 비드 용접으로 실무 영어 명칭은 Tack Welding(가용접, 가접)이라 부른다."},{"n":37,"type":"short","stem":"가용접 비드를 배치할 때 응력이 극단적으로 가혹하게 집중되는 부품의 끝, 각진 경계면, 그리고 날카로운 이 부위는 결함 발생 우려로 가용접 배치를 절대로 금지한다. 이 금지 부위를 총칭하는 기계공학 명칭은?","choices":[],"answerIndex":null,"answerText":"응력집중부 (또는 모서리, 코너, Corner)","explain":"기하학적 급변점이나 부품 모서리 등 응력집중부에는 국부 인장 피로가 격하게 유발되므로 가용접 배치를 완벽히 금지하는 구역이다."},{"n":38,"type":"short","stem":"I형 맞대기이음 가용접 시, 모재 정렬 상태 및 치수 유지를 위해 가용접 배치 지점 간의 간격은 통상 모재 두께(t)의 몇 배 정도로 설정하는 것이 보편적인 기준인가?","choices":[],"answerIndex":null,"answerText":"25배 (또는 25t)","explain":"I형 맞대기이음 가용접 가조립 시, 형상 휨 방지를 위한 최적의 역학적 구속 거리로 모재 두께(t)의 25배를 가접 간격으로 삼는 것이 공학 표준이다."},{"n":39,"type":"short","stem":"두께가 서로 다른 이종재료 가용접 시, 용착 금속 냉각 속도의 차이 및 열변형율 편차로 인한 저온 균열 파괴를 예방하기 위해, 예열 온도는 조립 자재 중 어느 쪽 자재의 예열 온도를 따라가야 하는가?","choices":[],"answerIndex":null,"answerText":"예열 온도가 더 높은 쪽의 자재 온도 (높은 예열 온도)","explain":"서로 다른 이종재료의 조립 가용접 시에는 냉각 균열 저항성이 상대적으로 취약하여 높은 예열 온도를 필요로 하는 쪽 자재의 예열 온도를 전체 이음부 예열 기준으로 적용해야 용접부 저온 파괴를 예방할 수 있다."},{"n":40,"type":"short","stem":"가열 및 응고 냉각 거동 중, 용접선과 '직각 방향'으로 발생하는 영구적인 면내 수축 변형을 무엇이라 부르는가?","choices":[],"answerIndex":null,"answerText":"횡수축 변형 (Transverse Shrinkage)","explain":"용접 진행 축인 용접선 방향에 대하여 정확히 수직인 90도 직각 방향으로 발생하는 면내 열수축 변형 현상을 횡수축 변형이라 정의한다."},{"n":41,"type":"short","stem":"가열 온도 분포가 판 두께 방향으로 상이하여 모재가 용접선을 중심으로 해 꺾이고 꺾여 구부러지는 대표적인 횡굽힘 변형을 지칭하는 용접 용어는?","choices":[],"answerIndex":null,"answerText":"각변형 (Angular Distortion)","explain":"판 두께 방향의 급격한 온도차로 인한 수축률 단차 때문에, 용접 중심선을 축으로 판재가 꺾여 올라가는 횡굽힘 변형을 각변형이라 지칭한다."},{"n":42,"type":"short","stem":"박판 용접 시 용접선 방향으로 가해지는 압축 열응력에 견디지 못하고 얇은 평판이 나선형 비틀림 형태로 튀어 오르며 비틀리는 면외 변형 현상을 무엇이라 부르는가?","choices":[],"answerIndex":null,"answerText":"좌굴 변형 (Buckling Distortion)","explain":"두께가 얇은 박판 강재 용접 시 진행방향 압축 열응력을 견디지 못하고 평판이 3차원 물결 형태로 비틀리며 튀어 오르는 면외 압축 소성 변형을 좌굴 변형이라 정의한다."},{"n":43,"type":"short","stem":"설계적인 조립 상태 수정 측면에서 용착량을 최소화하여 용접 수축 변형을 극소화시키기 위해 가공 조정하여야 하는 홈의 각부 구성 요소 2가지는?","choices":[],"answerIndex":null,"answerText":"베벨 개선 각도 및 루트 갭 (Gap)","explain":"개선 베벨 홈 각도와 루트 갭을 기준 치수 이하로 좁게 가공함으로써, 본용접 시 용가재 소비량과 용융 입열 자체를 소거해 변형을 근원적으로 줄여줄 수 있다."},{"n":44,"type":"short","stem":"시공적 변형 방지 측면에서, 용접 후 발생할 수축 변형량과 각도를 미리 수학적으로 예상하여 그 변형량만큼 반대 방향으로 2도 이하 꺾어 조립하는 기법의 명칭은?","choices":[],"answerIndex":null,"answerText":"역변형법 (또는 사전 역변형법)","explain":"용접 후 가열 냉각에 의한 수축 변형량 및 각도 방향을 미리 공학적으로 역산하여, 그 반대 방향으로 2도 이하의 사전 꺾임을 가해 준 후 구속 조립 시공하는 기법이다."},{"n":45,"type":"short","stem":"맞대기이음 조립 시 판 상호 간의 일직선도 단차를 교정함과 동시에, 각변형 및 뒤틀림 방지를 위해 표면이나 이면에 일시적으로 가접 설치하는 고정용 구속 지그의 명칭은?","choices":[],"answerIndex":null,"answerText":"스트롱 백 (Strong-back)","explain":"판 단차 일직선 교정 및 본용접 중의 각변형 비틀림 휨을 완벽하게 수평 억제 구속하기 위해 임시 가접 설치하는 대표 구속 치공구이다."},{"n":46,"type":"short","stem":"수축에 의한 길이방향 인장 균열 및 구속 잔류응력을 완화하기 위해, 스트롱 백(Strong-back) 보강재의 한 쪽 끝단만 가접하여 수축 거동이 부분적으로 가능하게 조립하는 시공 방식의 명칭은?","choices":[],"answerIndex":null,"answerText":"일단 유동 방식 (일단 유동 설치법)","explain":"길이가 긴 모재 맞대기 시공 시 구속력이 과도하면 균열이 가접 비드에 전파된다. 스트롱 백 보강재의 한 쪽 끝만 가접하여 길이 수축 여유 거동을 주어 잔류응력을 소멸시키는 조립 공법이다."},{"n":47,"type":"short","stem":"용접 구조물의 조립 순서 결정 원칙 중 맞대기이음(Butt Joint)과 필릿이음(Fillet Joint)이 동시에 교차 배치될 때, 수축량이 월등히 크므로 반드시 먼저 선행 완료하여 조립해야 하는 이음 방식은?","choices":[],"answerIndex":null,"answerText":"맞대기이음 (Butt Joint)","explain":"수축량 및 변형 에너지가 필릿 용착 비드부보다 월등히 광범위하므로, 변형이 큰 맞대기용접을 선행하여 형태를 완전 굳힌 후 필릿용접을 나중에 처리하는 것이 조립 순서 제1대원칙이다."},{"n":48,"type":"short","stem":"직류(DC) 전원을 활용하여 아크를 제어할 때, 부하 전류가 200A 이하인 박판 GTAW의 경우 텅스텐 전극봉 끝단의 원추 연마 길이(L)는 전극봉 지름(D)의 몇 배 크기로 뾰족하게 연마해야 아크 집중도가 확보되는가?","choices":[],"answerIndex":null,"answerText":"3배 (또는 L ≒ 3D)","explain":"전류 부하 200A 이하의 박판 GTAW 시공 시 아크 집중성과 지향성을 유지해 융합불량 결함을 방지할 목적으로 전극봉 지름(D)의 약 3배에 달하도록 뾰족하게 원추 연마한다."},{"n":49,"type":"short","stem":"교류(AC) 전원을 사용하여 알루미늄 합금 조립 용접 시, 아크 분산을 예방하기 위해 텅스텐 전극봉 끝단 원추 연마 길이(L)는 전극봉 지름(D)의 0.5배(D/2) 구격으로 가공하고 끝단부를 어떤 기하학 형상으로 둥글게 가공해야 하는가?","choices":[],"answerIndex":null,"answerText":"반구형 (또는 둥근 형상, Ball end)","explain":"교류 전도 시 반주기 역극성 조건 하에서 가해지는 과도한 극판 열 충격에 의한 전극봉 탈락을 방지하고 균일한 아크 기둥을 형성하기 위해 전극 끝단을 반구형 형태로 가공 조작한다."},{"n":50,"type":"short","stem":"용접 직후 비드가 고온 상태(약 700도 부근)일 때, 끝이 구면인 구형 해머로 용접 비드 부위를 연속 타격하여 가벼운 소성 변형을 줌으로써 가용접부의 인장 잔류응력을 소멸 완화시키는 물리적 잔류응력 제거 완화법의 명칭은 무엇인가?","choices":[],"answerIndex":null,"answerText":"피닝법 (Peening)","explain":"용접 직후 비드가 고온 상태(약 700도 이상)일 때 끝이 둥근 피닝 해머로 타격을 가하여 표면 기계적 가공 연신 소성 거동을 유발함으로써 잔류 인장응력을 소쇄 완화하는 물리적 방법이다."}]},"20":{"unit":20,"title":"가스텅스텐아크용접 맞대기용접","code":"LM1601050311","group":"GTAW","theory":[{"t":"h4","v":"가스텅스텐아크용접(GTAW) 전원 극성 및 열야금학적 거동"},{"t":"p","v":"가스텅스텐아크용접(GTAW/TIG) 공정에서 아크 열의 물리적 분배 및 비드의 기하학적 거동은 사용 전원의 형태(직류, 교류) 및 외부 회로 극성에 따라 극명한 상충 관계(Trade-off)를 형성한다."},{"t":"table","rows":[["구분","직류 정극성 (DCSP/DCEN)","직류 역극성 (DCRP/DCEP)","고주파 교류 (ACHF)","출처 및 비고"],["결선 상태","모재 (+), 전극봉 (-)","모재 (-), 전극봉 (+)","주기적 극성 교번 (+/-)","KS B ISO 9606-1 기준"],["아크 열분배","모재 70% | 전극봉 30%","모재 30% | 전극봉 70%","모재 50% | 전극봉 50%","교재 기술 사항 지표"],["용입 및 비드","용입 깊이가 매우 깊고 폭이 좁음","용입 깊이가 얕고 비드 폭이 넓음","용입 및 비드 폭 모두 중간 형태","피복제/텅스텐 열적 한계"]]},{"t":"li","v":"직류 정극성(DCSP/DCEN): 음전하가 전극봉에서 나와 모재로 급격히 가속 충돌하므로 모재에 70%의 열이 집중되어 좁고 깊은 용입 비드를 얻을 수 있으며, 강철, 스테인리스강, 황동 등의 고융점 금속에 주로 사용된다."},{"t":"li","v":"직류 역극성(DCRP/DCEP): 열의 70%가 전극봉에 집중되므로 텅스텐 전극의 열적 허용치를 초과하여 소모가 극심해져 일반적인 TIG 용접에서는 사용되지 않는다."},{"t":"li","v":"고주파 교류(ACHF): 주기적으로 극성이 교번하여 정극성의 열적 집중성과 역극성의 산화막 파괴 메커니즘을 동시 확보할 수 있어, 표면에 강력한 산화피막(Al2O3, 융점 2,050℃)이 존재하는 알루미늄 및 마그네슘 용접에 필수적이다."},{"t":"h4","v":"텅스텐 전극봉의 종류 및 선단 연마 가공 기하학"},{"t":"p","v":"텅스텐 전극봉은 비소모성 전극으로서 고유의 원소 첨가 배합에 따라 표식 색상과 물리 화학적 방출 원리가 엄격히 구별되며, 아크의 집중성과 수명을 제어하기 위해 선단 형상을 전원에 따라 완벽히 제어하여 연마해야 한다."},{"t":"li","v":"텅스텐 전극봉 종류별 고유 표준 색상: 순텅스텐 전극봉은 녹색, 란탄(1~2%) 첨가 텅스텐은 황록색, 세륨 텅스텐은 회색, 2% 토륨 텅스텐은 적색으로 규격화된다."},{"t":"li","v":"직류 전원 전용 선단 원추 연마각: 직류 정극성 시에는 아크를 한곳으로 극대화하여 좁고 정밀한 용입을 유도하기 위해, 전극봉 선단을 축방향으로 날카롭게 뾰족한 원추 기하학 형태로 그라인딩 연마해야 한다. 연마 길이는 직류 200A 이하 저부하 시 L ≒ 3D, 200A 초과 고부하 시 L ≒ 2D 비율을 유지하는 것이 교재 지침의 정석이다."},{"t":"li","v":"교류 전원 비철금속 전용 반구형 선단 연마: 알루미늄 용접 등에 사용되는 고주파 교류(ACHF)의 경우, 역극성 주기에 전극봉 선단이 과열되므로 날카롭게 뾰족하게 연마하면 선단이 녹아내려 용융지에 용락 결함을 초래한다. 따라서 교류 용접 시작 전 사전에 용접봉 끝단을 약 L ≒ D/2 가량의 구 모양(끝단 반구형) 또는 약간 평평한 형태로 기하학적 조정을 수행해야 안정적인 충류 아크가 구현된다."},{"t":"h4","v":"자세별 적정 용접 전류 및 텅스텐 돌출 길이 조정 공식"},{"t":"p","v":"TIG 맞대기용접의 다층 용접 시공 품질은 아래보기(PA/1G), 수평(PC/2G), 수직(PF/3G), 위보기(PE/4G) 등 시공 자세와 각 층별 텅스텐 전극봉의 적정 돌출 설계에 직접 수렴한다."},{"t":"li","v":"자세별 전형적인 루트(초층) 및 표면 적정 전류: 아래보기(F) 자세 1층 이면비드 용접 시 연강용 YGT50, Ø2.4 용가재 기준 전류는 70~120A 범위를 조절하며, 수평(H) 자세는 흘러내림을 방지하기 위해 70~90A 범위, 수직(V) 상진 자세는 60~80A의 비교적 좁고 제어된 전압 전류 구간을 유지하는 것이 이론적 한계이다."},{"t":"p","v":"★ [공학 실무 가이드: 텅스텐 돌출 길이의 과학적 조정 규칙]"},{"t":"p","v":"1층 이면비드 초층 용접 시에는 가스 세라믹 노즐을 개선 홈 내부에 최대한 접근시키면서도 전극봉이 홈 깊숙이 침투할 수 있도록 노즐 단면 기준 약 10~13mm로 길게 돌출 제어해야 한다. 반면, 2층 중간층 및 표면 비드 용접 시에는 이미 개선 홈 내부에 용착금속이 높게 안착되어 있으므로, 텅스텐 돌출 길이를 5~7mm 수준으로 조절하여 용접 아크 길이(1~2mm)를 닿지 않을 정도로 가깝게 통제해야 토치 실드막이 무너지지 않는다. 이를 어기고 표면층에서 과도하게 전극을 길게 뽑아두면 외부 기류에 아크 실드가 교란되어 기공(Blowhole) 및 산화 결함을 피할 수 없다."},{"t":"h4","v":"스테인리스강의 야금학적 이면 산화 제어 및 가스 퍼징(Purge) 계통"},{"t":"p","v":"스테인리스강(STS 304 등) 및 비철 금속은 고온에서 산소와 친화력이 매우 극심하여 대기에 그대로 노출된 이면 루트부가 크롬 산화물 및 슬래그 형태의 벌집 산화비드로 전락하여 내부식성과 기계적 성질을 완전히 잃어버리는 치명적인 취성을 띤다. 이를 물리적으로 완벽히 차단하기 위해 이면 퍼징 계통을 설계해야 한다."},{"t":"li","v":"밀폐형 퍼징 가스 계통: 맞대기 개선 이음부 틈새로 아르곤 가스가 빠져나가지 않도록 연소가 잘 되고 유해가스가 거의 없는 15~24mm 폭의 얇은 종이테이프나 알루미늄 테이프로 홈의 상부를 밀폐한 후, 용접 토치가 우측으로 전진하며 녹여나감에 따라 테이프를 조금씩 박리 및 연소시키면서 이면 비드를 완전 불활성 차폐 하에 응고시킨다."},{"t":"li","v":"가스 퍼지 유량 공식 및 플러싱(Flushing): 퍼지 가스의 유량은 이면 구조물의 전체 체적에 따라 0.5 ~ 42 L/min 범위 내에서 가변 적용한다. 이론상 구조물 기밀 내부 체적의 최소 4배 이상의 유량을 먼저 밀어 넣어 공기를 완전히 배출시키는 '플러싱(Flushing)'을 수행(10~20초 이상 이면 퍼지 선행)한 후, 용접 진행 중에는 외부 공기 유입이 불가능한 수준의 약간의 미압만을 균일하게 유지한다."},{"t":"li","v":"★ 단골 출제 전기공학적 안전 계통 (가스 라인 이원화): 이면 퍼지에 사용되는 보호 가스 공급 라인은 용접기 토치로 공급되는 차폐 가스 라인과 절대로 동일한 하나의 라인에서 병렬 분기하여 공유하면 안 된다. 만약 단일 가스 공급 계통에서 두 라인을 병렬 연결하여 작동시키면, 토치 스위치를 가동할 때 양측 라인의 유량 간 상충 및 압력 저하가 발생하여 토치 세라믹 노즐로 배출되는 아르곤 가스의 유량이 급격히 소실된다. 이는 용착 금속의 완전 질화를 유도하므로, 이면 퍼지 라인은 반드시 별도의 개별 유량조절계(레귤레이터 가스 라인 개별 회로)에 직결 배관 설치해야 안전율 한계를 충족할 수 있다."},{"t":"h4","v":"용접 변형 방지를 위한 시공 기법"},{"t":"p","v":"용접에 의한 수축 변형을 방지하기 위해서는 다음과 같은 야금학적·기계적 제어 수칙을 엄격하게 적용하여야 한다."},{"t":"li","v":"가용접 수 및 역변형 설정: 변형이 우려되는 경우 평판 아래보기는 약 5° 내외의 역변형을 미리 주어 맞대기 정렬 가접하고, 가용접의 개수를 적절히 확보하여 구속한다."},{"t":"li","v":"구속 지그 및 열흡수판 활용: 구속 지그 및 변형 억제 장치를 강하게 고정하며, 용접선 주변에 동판 또는 알루미늄판 열흡수판을 배치하여 열을 급속 흡수·발산시킴으로써 소성 변형 온도 구간 도달을 억제한다."},{"t":"li","v":"용접 순서 대칭 설계: 다층 및 대칭 맞대기용접 수행 시 용접 순서를 대칭 배분하여 수축 응력이 상호 상쇄 완화되도록 시공 계획을 도식화한다."}],"questions":[{"n":1,"type":"mcq","stem":"가스텅스텐아크용접(GTAW)에서 직류 정극성(DCSP) 결선 상태와 아크 열에너지 분배의 물리적 특징으로 옳은 것은?","choices":["모재가 (+)극이며 아크 열의 70%가 모재에 집중되어 좁고 깊은 용입을 형성한다.","모재가 (-)극이며 아크 열의 70%가 전극봉에 집중되어 넓고 얕은 용입을 형성한다.","모재가 (+)극이며 아크 열의 30%가 모재에 집중되어 텅스텐 소모가 매우 극심하다.","모재가 (-)극이며 아크 열의 50%가 전극봉에 집중되어 청정작용이 우수하다."],"answerIndex":1,"answerText":"① 모재가 (+)극이며 아크 열의 70%가 모재에 집중되어 좁고 깊은 용입을 형성한다.","explain":"TIG 용접에서 직류 정극성(DCSP)은 전극봉을 음극(-), 모재를 양극(+)으로 결선한다. 양극 부분인 모재에 전자가 충돌하면서 아크 열의 70%가 분배되어 깊고 좁은 용입을 형성하는 공학적 특성이 존재한다."},{"n":2,"type":"mcq","stem":"가스텅스텐아크용접에서 직류 역극성(DCRP)을 실무 용접 공정에서 거의 사용하지 않는 야금학적 원인으로 가장 적합한 것은?","choices":["아크의 열에너지가 모재에 지나치게 70% 이상 편중되어 용융 풀이 통제 불능으로 녹아내리기 때문이다.","열의 70%가 전극봉에 편중되어 텅스텐 전극 선단이 과열되어 녹아내리며 아크가 극도로 불안정해지기 때문이다.","청정작용이 너무 강력하게 발생하여 모재의 모서리 결함 가공부가 변형 손상되기 때문이다.","교류 전원에 비해 장비 구매 비용 및 전력 소비 역률 효율이 대폭 감하하기 때문이다."],"answerIndex":2,"answerText":"② 열의 70%가 전극봉에 편중되어 텅스텐 전극 선단이 과열되어 녹아내리며 아크가 극도로 불안정해지기 때문이다.","explain":"직류 역극성(DCRP)은 열의 70%가 전극봉에 전도되어 집중되므로 비소모성이어야 할 텅스텐 전극 선단이 매우 빠르게 녹아내리며 아크를 통제 불가능하게 만들어 실무 용접에서는 거의 쓰이지 않는다."},{"n":3,"type":"mcq","stem":"알루미늄(Al) 합금의 TIG 맞대기용접 시 고주파 교류(ACHF) 전원을 사용하는 핵심 공학적 목적은 무엇인가?","choices":["모재 전반의 예열 및 층간 열 분포를 90% 이상 차단하여 용입 깊이를 30mm 이상 확보하기 위함이다.","알루미늄 표면의 고융점 산화피막(Al2O3)을 역극성 주기의 이온 충돌 효과로 파괴(청정작용)하기 위함이다.","텅스텐 전극봉의 연마 각도를 항상 뾰족한 15° 각도로 보호하여 수명을 연장하기 위함이다.","이면 Purge 가스의 Ar 분사 유량을 소전류에서도 100 LPM 이상으로 자동 감압하기 위함이다."],"answerIndex":2,"answerText":"② 알루미늄 표면의 고융점 산화피막(Al2O3)을 역극성 주기의 이온 충돌 효과로 파괴(청정작용)하기 위함이다.","explain":"알루미늄 합금의 표면에는 융점 2,050℃의 매우 질긴 산화피막(Al2O3)이 존재하는데, 고주파 교류의 역극성 주기 동안 가스 이온이 모재 표면을 강타하는 충돌 물리력으로 이 산화막을 타격하여 제거하는 '청정 작용'이 필수적으로 기능한다."},{"n":4,"type":"mcq","stem":"텅스텐 전극봉의 종류 및 첨가 산화물 성분 표식 색상의 규격 대조가 옳게 짝지어진 것은?","choices":["순텅스텐 전극봉 - 녹색","2% 토륨 텅스텐 전극봉 - 회색","란탄 텅스텐 전극봉 - 적색","세륨 텅스텐 전극봉 - 황록색"],"answerIndex":1,"answerText":"① 순텅스텐 전극봉 - 녹색","explain":"국제 및 KS 표준 전극봉 식별 규격에 따라 순텅스텐은 녹색, 2% 토륨은 적색, 2% 란탄은 황록색, 세륨 텅스텐은 회색 표식 띠로 명확하게 분류 규정된다."},{"n":5,"type":"mcq","stem":"가스텅스텐아크용접기 제어 패널에서 크레이터 제어 스위치를 '1회(유 제어)'로 설정했을 때, 용접 본류 종료 시 작동하는 크레이터 전류의 크기는 일반적으로 어떻게 조절하는가?","choices":["본용접 전류의 약 150% 수준으로 일시 고전류 승하 조절한다.","본용접 전류의 약 70% 수준으로 감압하여 열량 수축 속도를 제어한다.","본용접 전류와 완벽히 동일한 전류(100%)를 주어 전격을 유도한다.","전류를 즉시 0A로 소거하여 무부하 상태로 대기한다."],"answerIndex":2,"answerText":"② 본용접 전류의 약 70% 수준으로 감압하여 열량 수축 속도를 제어한다.","explain":"용접의 종점부에서는 급격한 전원 차단으로 용축 구공인 크레이터가 발생하고 수축 균열이 쉽게 유발된다. 따라서 토치 제어 회로의 크레이터 유 기능을 통해 최종 전류를 약 30~40% 감압하여 공급함으로써 서서히 채워 균열을 소멸시킨다."},{"n":6,"type":"mcq","stem":"TIG V형 맞대기용접에서 1층 이면비드(Root Pass) 시공을 수행할 때, 루트 갭(Root Gap) 거리를 용접 시작 시점부보다 끝나는 종점부에서 넓게 벌리는 공학적 이유로 옳은 것은?","choices":["아세틸렌 예열 불꽃의 가압력을 끝단부에서 4배 이상 상승시키기 위해","텅스텐 전극봉의 돌출 길이를 끝 지점에서 15mm 이상 추가 돌출시키기 위해","용접 속도를 종점부에서 10배 이상 가속하여 덧살을 높이기 위해","용접 진행에 따른 열 수축과 소성 응력 거동으로 루트 갭이 점점 닫히는 현상을 보완하기 위해"],"answerIndex":4,"answerText":"④ 용접 진행에 따른 열 수축과 소성 응력 거동으로 루트 갭이 점점 닫히는 현상을 보완하기 위해","explain":"TIG 맞대기용접 전진 시 열수축으로 인해 루트 간격이 점진적으로 오그라들어 닫히는 경향을 보인다. 시점부를 3.0mm로 했다면 수축 수치를 예측하여 종점부는 약 4.0mm 내외로 선제 배정하여 넓혀두는 것이 야금학적 정석 조립법이다."},{"n":7,"type":"mcq","stem":"가스텅스텐아크용접 시 아래보기(PA/1G) 및 수직(PF/3G) 맞대기용접에서 정석적인 토치 운봉 각도로 옳은 것은?","choices":["진행 반대 방향으로 진행각 70~80°를 조절하고, 작업각은 90°를 유지한다.","진행 방향으로 진행각 40~50°를 조절하고, 작업각은 45°를 유지한다.","진행 반대 방향으로 진행각 10~20°를 조절하고, 작업각은 60°를 유지한다.","진행 방향으로 진행각 80~90°를 조절하고, 작업각은 30°를 유지한다."],"answerIndex":1,"answerText":"① 진행 반대 방향으로 진행각 70~80°를 조절하고, 작업각은 90°를 유지한다.","explain":"TIG 맞대기용접의 정석 운봉 자세는 토치 진행각을 진행 반대 방향으로 70~80°(작업의 진행을 관찰하고 보호 실드를 유지하기 위함), 작업각은 좌우 균일하게 90°를 조절하고, 용가재는 용접선과 10~30°를 유지하는 각도 조절이 필요하다."},{"n":8,"type":"mcq","stem":"TIG 용접 시 텅스텐 전극봉의 끝단 돌출 길이는 아크 실드 건전성과 직결된다. 아래보기 1층 이면비드 용접과 표면 비드 용접 시의 올바른 전극봉 돌출 길이 세팅은?","choices":["이면비드 용접 시 세라믹 노즐 끝단 기준 1~2mm 돌출, 표면 비드 용접 시 15~20mm 돌출","이면비드 및 표면 비드 모두 세라믹 노즐 단면 기준 수평 '0mm'로 고정 설정","자세와 층 수에 전혀 관계없이 일률적으로 25mm 이상 최대한 길게 돌출 제어","이면비드 용접 시 세라믹 노즐 끝단 기준 10~13mm 돌출, 표면 비드 용접 시 5~7mm 돌출"],"answerIndex":4,"answerText":"④ 이면비드 용접 시 세라믹 노즐 끝단 기준 10~13mm 돌출, 표면 비드 용접 시 5~7mm 돌출","explain":"초층 이면비드 용접 시에는 가스컵 및 노즐이 개선 각 외부의 간섭을 피해 루트 부근에 근접 침투해야 하므로 10~13mm로 길게 뽑아야 한다. 반대로 표면 비드 용접 시에는 용착부가 높으므로 실드 효율 유입 방지를 위해 5~7mm 수준으로 짧게 통제해야 한다."},{"n":9,"type":"mcq","stem":"스테인리스강 TIG 맞대기용접부의 이면(Root) 비드가 대기 중 산소와 결합하여 심각하게 그을려 산화 슬래그 비드로 저락하여 인성과 내부식성을 상실하는 취성 결함을 무엇이라 부르는가?","choices":["언더컷(Undercut) 결함","크레이터 균열(Crater Crack) 결함","이면비드 산화(Oxidation) 결함","슬래그 혼입(Slag Inclusion) 결함"],"answerIndex":3,"answerText":"③ 이면비드 산화(Oxidation) 결함","explain":"오스테나이트 스테인리스강은 고온 야금 영역에서 공기와 극소량이라도 접촉 시 표면에 크롬 복합 산화물이 형성되어 벌집 형태의 타버린 비드가 되는데, 이를 이면비드 고온 대기 접촉 산화 결함이라 한다."},{"n":10,"type":"mcq","stem":"스테인리스강 이면비드의 고온 대기 접촉 산화 현상을 차단하기 위해 밀폐 테이프를 이용한 퍼징(Purge) 계통을 가동할 때, 가용 퍼징 종이테이프의 최적 표준 폭 규격은?","choices":["5 ~ 10 mm","15 ~ 24 mm","50 ~ 60 mm","100 mm 이상 무제한"],"answerIndex":2,"answerText":"② 15 ~ 24 mm","explain":"TIG 스테인리스 용접 이면부의 밀폐성 테이핑은 일반적으로 두께가 얇고 연소가 잘 되는 전용 알루미늄 또는 종이테이프를 활용하며, 표준 부착 폭은 약 15~24mm 규격을 사용한다."},{"n":11,"type":"mcq","stem":"대형 파이프 배관 및 압력구조물의 TIG 용접 시 퍼지 가스 유량 설계에 대한 설명 중 가장 타당하지 않은 것은?","choices":["용접 개시 전 사전에 구조물 체적의 약 4배 이상의 아르곤 가스로 플러싱을 완료해야 한다.","퍼지가 일단 완료되어 산소 농도가 제어되면 용접 진행 중에는 미압 상태만 지속 유지한다.","퍼지 가스의 배출 속도는 구조물의 내부 체적에 따라 0.5 ~ 42 L/min 범위에서 조율한다.","용접 전 모재 내부 체적의 1.1배 수준의 극소 가스로 1초간 살포 후 즉시 가열한다."],"answerIndex":4,"answerText":"④ 용접 전 모재 내부 체적의 1.1배 수준의 극소 가스로 1초간 살포 후 즉시 가열한다.","explain":"가스 퍼징 시 초기에는 모재 내부 산소를 완벽 배출시키기 위해 전체 기밀 구조 체적의 최소 4배 이상의 아르곤 유량으로 충분히 세정(Flushing)해야 기공 및 언더컷을 원천 소멸할 수 있다."},{"n":12,"type":"mcq","stem":"★ 단골 출제: TIG 맞대기용접 시 이면 퍼지 가스 라인과 용접 토치 가스 라인의 계통 결선 방법으로 옳은 것은?","choices":["하나의 가스 레듈레이터 배출구에서 가스 호스를 병렬 Y자 분기하여 토치와 이면 퍼지에 연결한다.","퍼지 전용과 토치 전용 가스 라인을 각각 독립된 유량조절계에 개별 직결하여 이원 배관한다.","토치 가스 라인은 생략하고 이면 퍼지 가스만 100 LPM 이상으로 공급하여 양쪽에 공용한다.","이면 퍼지 계통은 공기 압축기를 이용하여 일반 대기 에어 1차 전력을 저압 결선 주입한다."],"answerIndex":2,"answerText":"② 퍼지 전용과 토치 전용 가스 라인을 각각 독립된 유량조절계에 개별 직결하여 이원 배관한다.","explain":"차폐 가스 라인과 퍼지 가스 라인은 독립적으로 운용되어야 한다. 하나의 유량조절계에서 Y자로 병렬 분기하게 되면 유량 간 상충 및 압력 배합 차가 발생하여 세라믹 노즐로 분사되는 아르곤 가스의 유량이 순간적으로 무너져 용접부가 질화되는 참사가 발생하므로 개별 직결 이원 배관하여야 한다."},{"n":13,"type":"mcq","stem":"가스텅스텐아크용접에 사용되는 비소모성 전극 재료의 공학적 구비요건으로 가장 부적절한 것은?","choices":["금속 중 융점이 가장 높아야 한다. (텅스텐 융점 약 3,400℃)","전극 선단에서의 전자방출(Electron Emission)이 원활하고 양호해야 한다.","전기저항률이 매우 높아서 전극봉 자체에서 고열이 발생하도록 유도해야 한다.","아크 과열에 견딜 수 있도록 열전도성이 양호하고 우수해야 한다."],"answerIndex":3,"answerText":"③ 전기저항률이 매우 높아서 전극봉 자체에서 고열이 발생하도록 유도해야 한다.","explain":"TIG용 전극봉은 비소모성이며 전류 도통도가 우수해야 하나 자체 전극봉 내부에서 전력 손실 저항으로 인한 고열이 가압 축적되는 것을 막기 위해 고유 전기저항률은 극히 낮고 열전도성이 양호해야 이상적이다."},{"n":14,"type":"mcq","stem":"TIG 용접 시 세라믹 노즐을 통해 공급되는 보호 가스의 건전한 실드 효과를 파괴하여 기공(Blowhole)을 유발하는 현장 요인으로 볼 수 없는 것은?","choices":["용접 현장의 대기 바람 세기가 풍속 1.0 m/sec 이하로 매우 고요하고 잔잔한 경우","레귤레이터 가스 실린더 내의 가스 압력이나 유량이 규정치보다 현저히 부족한 경우","세라믹 노즐의 선단 내부에 비산된 스패터 꽁다리가 달라붙어 가스 충류 기류를 방해하는 경우","전극봉 돌출 길이를 20mm 이상 터무니없이 길게 뽑아 아크 실드 커버 범위를 이탈한 경우"],"answerIndex":1,"answerText":"① 용접 현장의 대기 바람 세기가 풍속 1.0 m/sec 이하로 매우 고요하고 잔잔한 경우","explain":"바람이 풍속 1.5 m/sec 이상으로 강하게 불면 보호가스의 기류가 교란되므로 기공이 유발된다. 풍속 1.0 m/sec 이하의 안착된 고요한 상태는 실드막 보존에 최적의 요건이다."},{"n":15,"type":"mcq","stem":"알루미늄 맞대기 TIG 용접 준비 시, 모재 표면에 상존하는 강고한 알루미늄 산화피막(Al2O3)의 용융 온도는 대략 얼마인가?","choices":["약 660 ℃","약 1,000 ℃","약 1,539 ℃","약 2,050 ℃"],"answerIndex":4,"answerText":"④ 약 2,050 ℃","explain":"알루미늄 모재 자체의 융점은 약 660℃이나, 표면에 견고하게 자리 잡은 산화피막(Al2O3)의 용융 온도는 극고온인 2,050℃에 수렴하므로 청정 작용을 통한 피막 제거 없이는 본용접의 융합이 원천 불가능하다."},{"n":16,"type":"mcq","stem":"TIG 아래보기 V형 맞대기용접 2층(중간층) 용접 전류는 1층(초층) 전류와 비교하여 어떻게 통제하는가?","choices":["무조건 400A 이상의 초고전류를 주어 다층 빌드업을 즉시 마감한다.","교류 고주파 펄스 전류를 0A로 영점 소거하여 통제한다.","1층 전류보다 오히려 50% 수준으로 크게 떨어뜨려 서랭시킨다.","1층 전류와 완전히 동일하거나 약 10~20A 범위 내에서 높여서 전진 속도를 일치시킨다."],"answerIndex":4,"answerText":"④ 1층 전류와 완전히 동일하거나 약 10~20A 범위 내에서 높여서 전진 속도를 일치시킨다.","explain":"다층 맞대기 용접에서 2층 및 표면 비드를 용접할 때는 이미 응고된 전 층의 열량을 보존한 상태이므로 1층 초층 전류 전류세기(70~90A)와 완전히 동등하거나 또는 10~20A 범위 가량 높여서 신속하게 용착을 빌드업 한다."},{"n":17,"type":"mcq","stem":"용접 종점에서 토치 스위치를 꺼 아크를 완전 차단한 후, 대기 중 산소에 의한 고온의 텅스텐 전극봉 및 크레이터 응고부 산화를 물리적으로 방어하기 위한 필수 후처리 공정은?","choices":["후기가스(After-flow) 분출 시간(5~10초) 동안 토치를 크레이터 위에 유지한다.","용접 아크 중단 즉시 상온의 소화수를 크레이터 함몰부에 분사하여 급속 냉각시킨다.","토치 가스 밸브를 즉시 SHUT 잠그고 멍키스패너로 조여 잔류 가스를 완전 소거한다.","고온 상태 그대로 수직 밀링머신 바이스에 고정하여 크레이터 산화층을 즉시 깎아낸다."],"answerIndex":1,"answerText":"① 후기가스(After-flow) 분출 시간(5~10초) 동안 토치를 크레이터 위에 유지한다.","explain":"아크 중단 시 고온 상태의 텅스텐 전극 선단 및 크레이터가 공기 중에 그대로 노출되면 순간 산화되어 검게 타거나 텅스텐 소모를 가속한다. 후기가스 분출(5~10초) 동안 크레이터부 위에서 토치를 유지하며 아르곤 가스 냉각 통제를 실행하는 것이 필수적인 시공법이다."},{"n":18,"type":"mcq","stem":"가스텅스텐아크용접에서 아크 열효율 및 비드 단면 형상에 지대한 영향을 주는 아크 길이(Arc Length)의 표준 시공 치수로 가장 적합한 것은?","choices":["1 ~ 2 mm 수준으로 텅스텐 선단이 모재에 닿지 않을 정도로 극히 가깝게 유지한다.","10 ~ 15 mm 수준으로 아크를 최대한 길게 뽑아 넓게 가열한다.","50 mm 이상으로 토치를 공중에 들어 올려 스파크 방전을 유도한다.","0 mm로 전극봉을 모재 용융 풀에 완전히 담그고 진행한다."],"answerIndex":1,"answerText":"① 1 ~ 2 mm 수준으로 텅스텐 선단이 모재에 닿지 않을 정도로 극히 가깝게 유지한다.","explain":"TIG 용접에서 정밀한 아크 열에너지 및 좁고 깊은 용입 유도를 위한 표준 아크 길이는 1~2mm 정도로 매우 좁고 타이트하게 통제해야 양호한 비드를 구현할 수 있다."},{"n":19,"type":"mcq","stem":"스테인리스강의 이면 Purge 가스로 아르곤(Ar) 이외에 오스테나이트계 STS 및 동합금에 한정하여 치환 사용이 가능한 불활성 지향적 가스는?","choices":["이산화탄소 (CO2) 가스","질소 (N2) 가스","산소 (O2) 가스","수소 (H2) 가스"],"answerIndex":2,"answerText":"② 질소 (N2) 가스","explain":"오스테나이트 스테인리스강 및 구리 계열의 이면 Purge 가스로는 아르곤 외에도 가격이 비교적 저렴하고 불활성 야금 화학적 성질에 수렴하는 질소(N2) 가스의 치환 충진 제어가 가능하다."},{"n":20,"type":"mcq","stem":"미국용접학회(AWS) 자격 규정에 따른 평판 맞대기 용접 자세 기호 중 '수평(Horizontal) 자세'를 지칭하는 표준 표기법은?","choices":["1G (PA)","2G (PC)","3G (PF)","4G (PE)"],"answerIndex":2,"answerText":"② 2G (PC)","explain":"미국용접협회(AWS) 규정에 근거하여 아래보기는 1G, 수평 자세는 2G, 수직은 3G, 위보기는 4G로 표기하며, 맞대기용 그루브(Groove) 용접의 약어인 G를 배치 표기한다."},{"n":21,"type":"mcq","stem":"TIG 용접 시 아크 발생 전에 가스 배관 라인 내의 잔존 산소 배출 및 실드막 선행 형성을 위해 짧게 가스를 배출시키는 제어 변수 명칭은?","choices":["초기가스 (Pre-flow) 시간","후기가스 (After-flow) 시간","업슬로프 (Up-slope) 시간","다운슬로프 (Down-slope) 시간"],"answerIndex":1,"answerText":"① 초기가스 (Pre-flow) 시간","explain":"아크 발생 지점에 아르곤 불활성 보호 피막을 사전에 가압 형성하고 배관 내 산소를 미리 배출하기 위해 가열 개시 전 선제적으로 배출되도록 설계된 제어 수치는 초기가스(Pre-flow) 시간이다."},{"n":22,"type":"mcq","stem":"TIG V형 맞대기 용접 시공 완료 후 굽힘시험(Guided Bend Test)을 위한 표면 및 이면 시험편의 표준 가공 규격 폭 치수는 대략 얼마인가?","choices":["10 mm","25 mm","38 mm","100 mm"],"answerIndex":3,"answerText":"③ 38 mm","explain":"과정평가형 및 용접국가기술자격 굽힘시험용 평판 시험편의 표준 절단 폭은 기계 가공 및 평탄 다듬질을 수반한 38mm 규격으로 명시된다."},{"n":23,"type":"mcq","stem":"Guided 굽힘시험 시편의 외관 및 굴곡부 검사 시, 단일 균열의 크기가 최소 몇 mm 이상일 때 무조건 감점 없이 즉시 0점(실격) 불합격 판정하는가?","choices":["1 mm 이상","2 mm 이상","3 mm 이상","5 mm 이상"],"answerIndex":3,"answerText":"③ 3 mm 이상","explain":"굽힘면 외관 품질 기준 상 단일 균열의 치수가 3mm 이상 점유하고 존재하거나, 또는 3mm 미만일지라도 전체 균열의 합계가 7mm를 초과하면 가차 없이 0점(실격) 불합격으로 규정한다."},{"n":24,"type":"mcq","stem":"굽힘시험편 굽힘면 검사에서 크기가 3mm 이하인 작은 균열일지라도, 시험편 표면에 존재하는 모든 미세 균열의 합계 치수가 총 몇 mm 이상일 때 불합격(0점) 처리되는가?","choices":["4 mm 이상","5 mm 이상","7 mm 이상","10 mm 이상"],"answerIndex":3,"answerText":"③ 7 mm 이상","explain":"3mm 미만의 미세 균열일지라도 시험편 표면에 존재하는 수많은 미세 균열들의 누적 합산 치수가 7mm를 넘어설 경우 기계적 건전성 한계를 충족하지 못한 것으로 판정하여 0점 불합격 처리한다."},{"n":25,"type":"mcq","stem":"TIG 맞대기용접 완료 후 굽힘시험 굴곡부의 표면 결함 중 기포 및 작은 균열의 누적 개수가 총 몇 개를 초과할 경우 불합격으로 규정하는가?","choices":["3개 초과","5개 초과","8개 초과","10개 초과"],"answerIndex":4,"answerText":"④ 10개 초과","explain":"굽힘부 표면에 잔존하는 미세기포, 균열, 슬래그 혼입 개수가 10개를 초과할 경우 연성 및 건전성이 결여된 결함부로 최종 판정하여 불합격 규정한다."},{"n":26,"type":"mcq","stem":"TIG 용접 완료 후 용접부 주변의 변형된 시편 판재를 실무 교재 지침에 따라 수정 바로잡기 하려 할 때 활용하는 대표적인 수공구는?","choices":["플라스틱 망치","멍키스패너","강철 해머(쇠망치)","드라이버"],"answerIndex":3,"answerText":"③ 강철 해머(쇠망치)","explain":"변형 교정은 소성변형을 줘야 하므로 정반 위에 놓고 강철 해머로 타격한다 → ③. 플라스틱 망치는 타격력이 약해 교정이 아닌 표면 보호용이다."},{"n":27,"type":"mcq","stem":"TIG 용접 전류 300A 정격 기기를 사용하여 장시간 연속 용접을 수행하려 할 때, 전극 및 토치의 열적 파손을 차단하기 위한 최적의 토치 냉각 계통은?","choices":["가스 급속 팽창 드라이아이스 냉각 방식","공랭식 (Air-cooled) 냉각 방식","수랭식 (Water-cooled) 순환 냉각 방식","자연 냉각 (Natural-cooled) 방식"],"answerIndex":3,"answerText":"③ 수랭식 (Water-cooled) 순환 냉각 방식","explain":"TIG/GTAW 용접에서 200A~300A 이상의 정격 고전류 가동 시 토치 케이블 전력 도통에 의한 발열 및 아크 복사열이 심하므로, 케이블 및 토치 내부에 냉각수를 강제 순환시키는 수랭식 토치 계통을 조립하여야 안전하다."},{"n":28,"type":"mcq","stem":"TIG 용접 회로에서 접지 케이블 및 가스 결선 부위의 볼트 체결 불량으로 인해 일어나는 전기공학적 트러블슈팅 현상으로 볼 수 없는 것은?","choices":["접속부에서 접촉저항 증가로 인한 과도한 이상 발열 발생","용접 전압 전류 공급의 불규칙 요동으로 인한 아크 불안정 현상","전력 손실 증가에 따른 정격 용접 성능 출력의 대폭 하락","아르곤 가스의 공급 압력이 자동으로 20배 이상 과도하게 승압되는 현상"],"answerIndex":4,"answerText":"④ 아르곤 가스의 공급 압력이 자동으로 20배 이상 과도하게 승압되는 현상","explain":"단자 체결 불량은 과도한 이상 발열 발생, 출력 저하, 아크 흔들림을 유발하나, 고압 가스 용기의 내부 물리 압력은 기화 잠열 및 가스 밸브 물리량에만 수렴하므로 전력 저항 불량과는 전혀 무관하다."},{"n":29,"type":"mcq","stem":"가스텅스텐아크용접에서 전극봉 선단 연마 가공 시, 텅스텐 전극봉의 그라인딩 스크래치 결 방향은 어떻게 연마하는 것이 아크 집중성에 가장 이상적인가?","choices":["전극봉의 축 방향 (길이 방향)에 평행하게 연마한다.","전극봉의 횡 방향 (둥근 원주 방향)으로 회전 연마한다.","사선 45° 방향으로 지그재그 연마한다.","연마 결은 상관없으므로 불규칙하게 연마한다."],"answerIndex":1,"answerText":"① 전극봉의 축 방향 (길이 방향)에 평행하게 연마한다.","explain":"그라인더로 텅스텐 전극봉을 연마할 때 축방향(길이 방향)과 평행하게 연마를 조작하여 그라인딩 결을 형성해야 전자가 선단 뾰족한 끝으로 안정적으로 수렴 방출되어 아크 요동 및 집중성 불량이 발생하지 않는다."},{"n":30,"type":"mcq","stem":"TIG 용접 토치 내부에서 가스를 완전 충류 형태로 가스 퍼짐 없이 일정하게 전방 분사 유도하여 차폐 성능을 극대화시키는 소모성 보조 부속품의 명칭은?","choices":["롱 캡 (Long Cap)","세라믹 노즐 (Ceramic Nozzle)","콜릿 척 (Collet Chuck)","가스 렌즈 (Gas Lens)"],"answerIndex":4,"answerText":"④ 가스 렌즈 (Gas Lens)","explain":"TIG 토치 내부에 벌집 형태의 금속 망을 수반한 가스 렌즈(Gas Lens) 부속품을 결속하게 되면, 배출되는 아르곤 가스의 기류를 완전 충류 분사 형태로 복원 유도하여 차폐 성능을 극대화한다."},{"n":31,"type":"mcq","stem":"용접 아크 차폐용 가스로 비중이 약 1.38로 공기(1.0)보다 무거워 하방으로 안정적인 실드 분위기를 장시간 조성하는 가스 원소는?","choices":["아르곤 (Argon, Ar)","헬륨 (Helium, He)","질소 (Nitrogen, N2)","이산화탄소 (CO2)"],"answerIndex":1,"answerText":"① 아르곤 (Argon, Ar)","explain":"아르곤(Ar)은 원자량 39.95, 비중 약 1.38 수준으로 대기보다 약 1.38배가량 무거워 아래보기 용접 시 모재 개선 홈 내부에 안정적인 불활성 보호 담요를 견고하게 형성하는 물리적 이점이 존재한다."},{"n":32,"type":"mcq","stem":"용접 아크 차폐용 가스로 비중이 약 0.138로 매우 가벼워 상방으로 급격히 날아가나, 아크 전압이 매우 높고 고입열 분사를 유도하여 후판 고속 용접에 유리한 불활성 가스는?","choices":["아르곤 (Ar)","헬륨 (He)","산소 (O2)","질소 (N2)"],"answerIndex":2,"answerText":"② 헬륨 (He)","explain":"헬륨(He)은 비중 0.138로 대기보다 가벼워 급격히 날아오르는 성질을 가지나, 아크 열전도가 매우 우수하고 아크 전압을 30~50%가량 높여주어 후판 및 고속 열량 집중 용접 시공에 극도로 유리하다."},{"n":33,"type":"mcq","stem":"TIG 용접에서 전극봉 선단 연마 시 선단을 칼날처럼 지나치게 뾰족하게 가공하여 미세한 파편이 용융 풀 속으로 혼입되어 취성 파단을 일으키는 용접 결함 명칭은?","choices":["기공 (Blowhole)","텅스텐 혼입 (Tungsten Inclusion)","융합 불량 (Lack of Fusion)","크레이터 함몰 (Crater Sink)"],"answerIndex":2,"answerText":"② 텅스텐 혼입 (Tungsten Inclusion)","explain":"전극 선단 가공 불량으로 인해 미세한 텅스텐 입자가 강제 탈락하여 모재 용융지 내부에 고체 알갱이 형태로 결착되어 X-Ray 비파괴 탐상 시 불투명한 흰 점으로 검출되는 취성 파단 결함을 텅스텐 혼입 결함이라 부른다."},{"n":34,"type":"mcq","stem":"TIG 용접 작업 시 발생하는 유해 광선(자외선)에 과도 노출되어 밤중에 눈에 극심한 통증과 눈물이 유발되는 대표적인 안과 질환명은?","choices":["망막 박리(망막층 분리)","백내장(수정체 혼탁)","전안염(아크 아이)","녹내장(안압 상승)"],"answerIndex":3,"answerText":"③ 전안염(아크 아이)","explain":"용접 아크에서 발산되는 강렬한 자외선에 안전 차광 필터 없이 장시간 노출되면 결막 및 각막 상피에 화상 염증 반응이 일어나며, 밤중에 안구 건조 및 극심한 통증을 유발하는 전안염(아크 아이)을 겪게 된다."},{"n":35,"type":"mcq","stem":"다음 중 맞대기 V형 그루브 용접 홈 설계 시 용가재의 소비량과 열변형량을 동시에 극소화할 수 있는 가장 경제적인 후판용 홈 형상은?","choices":["I형 홈","V형 홈","X형 홈","U형 홈"],"answerIndex":3,"answerText":"③ X형 홈","explain":"동일 두께 판재를 이음할 경우, 양면 용접이 가능한 X형(양면 V형) 맞대기 설계는 단면 V형 개선에 비해 용착금속 소비량을 약 50%가량 감소시킬 수 있어 야금학적 수축 변형량과 자재 소비 단가를 극소화하는 최고의 경제적 홈 설계 방식이다."},{"n":36,"type":"short","stem":"TIG 용접 시 직류 정극성(DCSP) 결선 하에서 전극봉과 모재 사이의 열에너지 물리적 분배율(%)을 쓰시오.","choices":[],"answerIndex":null,"answerText":"모재 70%, 전극봉 30%","explain":"직류 정극성(DCSP) 하에서는 음전하가 가속되어 결합 양극인 모재(+)로 격돌하므로 70%의 격돌 열량이 모재에 발생하여 텅스텐 과열 소모를 막고 좁고 깊은 용입을 형성한다."},{"n":37,"type":"short","stem":"TIG 맞대기용접 다층 시공 시, 용접 응력이 한곳에 결착되지 않고 상호 대칭 완화되도록 시공 계획 수립 시 준수해야 하는 변형 예방용 기본 용접 배치 순서 원칙을 쓰시오.","choices":[],"answerIndex":null,"answerText":"대칭 용접 순서 준수 (Symmetrical Sequence)","explain":"구조물의 뒤틀림 및 종굽힘 수축을 막기 위해 가접 단계에서부터 본용접 시공에 이르기까지 용접 배치를 대칭 수축 응력이 상호 감하 상쇄되도록 순서를 정교하게 설계 배정하여 용접해야 한다."},{"n":38,"type":"short","stem":"TIG 아래보기 t6.0 연강판 V형 맞대기 용접 시, 열수축 변형에 선제 대응하기 위해 개선 홈의 루트 간격(Root Gap)을 용접 시점부와 종점부에서 각각 몇 mm로 다르게 설계 설정해야 하는지 각각 그 수치를 쓰시오.","choices":[],"answerIndex":null,"answerText":"시작부(시점부) 3.0 mm, 끝나는 부분(종점부) 4.0 mm (허용 범위: 시작 2.5~3.2mm, 끝 3.5~4.0mm)","explain":"TIG 용접 시 고온 가열 진행에 따라 평판 맞대기 갭이 닫히는 열팽창 수축 현상이 동반된다. 이를 공학적으로 예방하기 위해 시작점은 약 3.0mm(또는 2.5~3.2mm)로 고정하고, 끝나는 종점부는 약 4.0mm(또는 3.5~4.0mm)로 확장 배정 가접한다."},{"n":39,"type":"short","stem":"TIG 용접 시 교류(AC) 전원을 사용하여 알루미늄 및 마그네슘 합금을 용접할 때, 표면의 강력한 산화피막을 자동으로 소거 및 제거해 주는 물리적 작용 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"청정 작용 (Cleaning Action)","explain":"교류 전원의 역극성 주기 동안 차폐 가스 양이온이 모재 표면을 고속 타격하여 2,050℃의 강고한 알루미늄 산화피막을 물리적으로 탈락 청소하고 순수 모재를 용융 풀로 흘려보내는 작용이다."},{"n":40,"type":"short","stem":"오스테나이트계 스테인리스강(STS 304)의 초층 이면비드 TIG 맞대기용접 시, 극심한 고온 산화와 그을림으로 인한 비드 품질 저하를 방지하기 위해 이면에 가동해야 하는 필수 불활성 차폐 보호 가스 공정 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"이면 가스 퍼징 (Back Purging)","explain":"공기 중 산소 및 질소 유입으로 인한 크롬의 격렬한 산화 야금 반응을 차단하고, 이면에 매끄럽고 은백색인 은연한 백비드를 성형 응고시키기 위해 이면에 불활성 가스를 사전 충진 차폐하는 기법이다."},{"n":41,"type":"short","stem":"TIG 용접에서 전극의 산화를 방지하기 위해 아크 중단 즉시 토치를 떼지 않고, 전극봉 선단 온도가 300℃ 이하로 냉각될 때까지 가스를 계속 분사 유지해 주는 제어 시간 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"후기가스 (After-flow) 시간","explain":"용접 아크 전원 소거 직후 산소 대기 차단이 무너지는 순간을 대비하여, 텅스텐 전극 온도가 산화 반응 온도 이하인 300℃ 밑으로 원활히 강압 냉각될 때까지 가스 공급 제어 회로를 유지 배출시키는 시간이다."},{"n":42,"type":"short","stem":"TIG 용접용 세륨 텅스텐 전극봉에 부여된 고유 표준 식별 표식 색상을 쓰시오.","choices":[],"answerIndex":null,"answerText":"회색 (Grey)","explain":"산화 세륨을 1~2% 가량 소량 균일 첨가하여 전자방출성을 향상한 TIG 전극봉 규격 분류 표준 식별 도장 띠 색상은 회색이다."},{"n":43,"type":"short","stem":"TIG 용접용 2% 토륨 텅스텐 전극봉에 부여된 고유 표준 식별 표식 색상을 쓰시오.","choices":[],"answerIndex":null,"answerText":"적색 (Red)","explain":"2% 토륨 텅스텐 전극봉은 우수한 아크 개시율과 고부하를 견디는 내열 성능을 가지며, 표준 표식 색상은 적색으로 마킹 규격화된다."},{"n":44,"type":"short","stem":"가스텅스텐아크용접 시 텅스텐 전극봉의 돌출 길이 조정은 층별 홈의 깊이에 따라 제어되어야 한다. 이면비드(초층) 용접 시와 표면 비드 용접 시의 가스 세라믹 노즐 단면 기준 정석적인 텅스텐 전극봉 돌출 길이 범위를 각각 mm 치수로 쓰시오.","choices":[],"answerIndex":null,"answerText":"초층 이면비드 용접 시: 10~13 mm 돌출, 표면 비드 용접 시: 5~7 mm 돌출","explain":"홈이 깊은 초층 이면비드는 노즐 단면 기준 10~13mm로 길게, 표면 비드는 실드 효율 유지를 위해 5~7mm로 짧게 돌출시킨다. 교재에 따라 맞대기 3~6mm로 보기도 한다."},{"n":45,"type":"short","stem":"국가기술자격 굽힘시험 평가 시 표면 및 이면 시험편의 가공 폭 치수(mm)와, 즉시 불합격(0점)으로 처리되는 단일 균열의 최소 크기 한계 수치(mm)를 각각 쓰시오.","choices":[],"answerIndex":null,"answerText":"시험편 폭: 38±2 mm (또는 38mm), 즉시 실격(0점) 단일 균열 크기: 3 mm 이상","explain":"국가검정 Guided 굽힘시험용 표준 가열 절단 연마 폭은 38mm 규격이며, 굽힘면 외관 품질 상 3mm를 초과하는 단일 균열 검출 시 기계적 건전성 전단 결여로 간주하여 즉시 0점 탈락 처리한다."},{"n":46,"type":"short","stem":"TIG 용접 시 보호 가스의 아크 차폐 건전성을 극대화하기 위해 토치 내부에 장착하는 가스 충류 분사 유도망의 부속 장치 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"가스 렌즈 (Gas Lens)","explain":"콜릿 바디 전면부에 결합하는 동 도금 또는 스텐 미세 밀도가 융착된 망 부속품으로 가스의 분출 특성을 충류로 가속 치환해 주는 차폐 품질 핵심 소모품이다."},{"n":47,"type":"short","stem":"알루미늄 TIG 용접에서 교류 전원을 가동하기 전, 전극 선단이 과열되어 녹아내려 용융지에 파편이 떨어지는 결함을 예방하기 위해 전극 선단을 어떤 형태로 조정 및 가공해야 하는지 그 연마 형태를 쓰시오.","choices":[],"answerIndex":null,"answerText":"선단 반구형 (구 모양 또는 끝단 반구 가공)","explain":"교류 TIG 용접의 역극성 주기에 전극 선단이 과도하게 가열 수렴하므로, 뾰족하게 연마 가공해둔 선단이 아크 복사열로 녹아 떨어지는 것을 소멸 차단하기 위해 선단 끝부분을 반구 모양으로 둥글게 사전 조작해야 한다."},{"n":48,"type":"short","stem":"TIG 맞대기용접 시 모재의 변형률을 억제하기 위해 용접 홈의 반대 방향으로 사전에 꺾어 가접을 고정해 주는 변형 예방용 조립법의 명칭을 쓰시오.","choices":[],"answerIndex":null,"answerText":"역변형법 (Presetting Method)","explain":"용접 사후 가열 수축 응력에 의한 각변형 변형 한계치를 사전에 예측한 후, 맞대기 가접 시 용접선 반대 방향으로 1~2° 또는 5° 내외의 경사각을 선제적으로 꺾어 구속 설정하는 시공 공법이다."},{"n":49,"type":"short","stem":"TIG 용접 시 차폐 가스 라인과 이면 퍼징 가스 라인을 병렬 연결하지 않고 가열 및 가스 제어를 완벽하게 이원화 배관해야 하는 전기공학적/유체역학적 기술적 원인을 쓰시오.","choices":[],"answerIndex":null,"answerText":"Y자 병렬 연결 시 토치 스위치 작동 단계에서 이면 퍼지 라인과 유량 간 상충 및 압력 강하가 일어나 토치 세라믹 노즐로 배출되는 가스 유량이 급격히 하락하여 대기 혼입 결함이 유발되기 때문이다.","explain":"한 선로에서 병렬 배관 시 토치 트리거를 누를 때마다 이면 퍼지 라인 쪽으로 가스 유량이 극심하게 새거나 토치 노즐로 분사되어야 할 보호 가스 유량이 붕괴해 실드가 깨져 다공성 용접 결함이 유발되므로 원천 독립 개별 유량조절계에 배관 조작하여야 한다."},{"n":50,"type":"short","stem":"스테인리스강 이면비드 산화 제어 퍼징 시스템 가동 시, 용접을 개시하기 전에 기밀 내부 공기를 완전히 배출시키기 위해 전체 구조물 내부 체적의 최소 몇 배 이상의 아르곤 가스를 불어넣는 플러싱(Flushing) 세정을 수행해야 하는지 배수를 쓰시오.","choices":[],"answerIndex":null,"answerText":"최소 4배 이상","explain":"스테인리스강 이면 밀폐 용접 전, 내부 산소 농도를 완전 소거하여 산화 전락 결함을 원천 예방하기 위해서는 사전에 기밀 배관 구조물 내부 체적의 최소 4배 이상의 아르곤 가스를 불어넣어 플러싱을 완료해야 한다."}]}};</script>

  if(HAS_GAS) return google.script.run.withSuccessHandler(function(s){done(JSON.parse(s));})
                                      .withFailureHandler(fail).getUnit(u);
  fetch('data/ncs'+(u<10?'0':'')+u+'.json').then(function(r){return r.json();}).then(done).catch(fail);
}
function fail(e){
  var msg=String(e&&e.message||e);
  var local=(location.protocol==='file:');
  var tip = HAS_GAS
    ? '구글 드라이브 폴더에 json 파일 21개가 모두 올라갔는지, Code.gs의 FOLDER_ID가 맞는지 확인해 주세요.'
      +'<br>Apps Script 편집기에서 <b>설치점검</b> 함수를 실행하면 원인을 바로 알려줍니다.'
    : (local
        ? '이 파일은 <b>Apps Script에 붙여넣어 배포한 뒤</b>에 동작합니다.<br>'
          +'그냥 열어서 확인하시려면 <b>NCS용접_문제은행_단일파일.html</b> 을 여세요.'
        : '문제 데이터(data 폴더의 json 파일들)를 찾지 못했습니다.<br>'
          +'index.html 과 data 폴더가 같은 위치에 있어야 합니다.');
  $app.innerHTML='<div class="empty" style="text-align:left;max-width:520px;margin:0 auto">'
    +'<div style="font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px">문제 데이터를 불러오지 못했습니다</div>'
    +'<div style="font-size:14px;line-height:1.7">'+tip+'</div>'
    +'<div class="small" style="margin-top:14px;opacity:.7">기술 정보: '+esc(msg)+'</div></div>';
}

var MEM={}, LS=null;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); LS=localStorage; }catch(e){}
function sget(k,d){ try{var v=(LS?LS.getItem(k):MEM[k]); return v?JSON.parse(v):d;}catch(e){return d;} }
function sset(k,v){ var s=JSON.stringify(v); if(LS){try{LS.setItem(k,s);}catch(e){}} MEM[k]=s; }
var KEY='ncsweld.v1';
var ST=sget(KEY,{u:{}});          // ST.u[unit] = {done:{n:1|0}, last:idx}
function unitState(u){ if(!ST.u[u]) ST.u[u]={done:{},last:0}; return ST.u[u]; }
function save(){ sset(KEY,ST); }
/* 학습 달력 공용 기록 (내학습.html 과 공유) */
function logStudy(ok){ try{
  var K='wking_study_v1', L={d:{}};
  try{ var r=localStorage.getItem(K); if(r) L=JSON.parse(r)||{d:{}}; }catch(e){}
  L.d=L.d||{};
  var dt=new Date(), T=Math.floor((dt-dt.getTimezoneOffset()*6e4)/864e5);
  var e=L.d[T]||[0,0]; e[0]++; if(ok) e[1]++; L.d[T]=e;
  localStorage.setItem(K, JSON.stringify(L));
}catch(e){} }

var $app=document.getElementById('app'), $title=document.getElementById('title'),
    $sub=document.getElementById('subtitle'), $back=document.getElementById('back');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');

function killNav(){
  var ns=document.querySelectorAll('.navbtns');
  for(var i=0;i<ns.length;i++) ns[i].parentNode.removeChild(ns[i]);
}
function render(){
  var h=(location.hash||'#/').replace(/^#/,'');

  killNav();
  window.scrollTo(0,0);
  if(h==='/'||h===''){ return viewHome(); }

/* ═══════════ 홈 ═══════════ */
function stats(){
  var t=0,d=0,w=0;
  IDX.units.forEach(function(u){
    if(!u.ready) return; t+=u.count;
    var s=ST.u[u.unit]; if(!s) return;
    for(var k in s.done){ d++; if(s.done[k]===0) w++; }
  });
  return {total:t,done:d,wrong:w};
}
function viewHome(){
  setHead('NCS 용접 문제은행','과정평가형 용접산업기사 대비',false);
  var s=stats(), pct=s.total?Math.round(s.done/s.total*100):0;
  var right=s.done-s.wrong, acc=s.done?Math.round(right/s.done*100):0;
  var html='<div class="card hero">'+
    '<div class="ring" style="background:conic-gradient(var(--brand) '+(pct*3.6)+'deg, var(--line) 0);">'+
      '<span style="width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center">'+pct+'%</span></div>'+
    '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">나의 학습 진도</div>'+
    '<div class="n">푼 문제 '+s.done+' / '+s.total+' 문항 · 정답률 '+acc+'%</div>'+
    '<div class="qbtns">'+
      '<button class="qbtn primary" onclick="go(\'#/mock\')">랜덤 모의고사</button>'+
      '<button class="qbtn" onclick="go(\'#/wrong\')">오답노트 '+(s.wrong?'('+s.wrong+')':'')+'</button>'+
    '</div></div></div>';

  var groups=[];
  IDX.units.forEach(function(u){ if(!groups.length||groups[groups.length-1].g!==u.group) groups.push({g:u.group,items:[]});
    groups[groups.length-1].items.push(u); });
  groups.forEach(function(gp){
    html+='<div class="sec-t">'+esc(gp.g)+'</div><div class="ulist">';
    gp.items.forEach(function(u){
      var st=ST.u[u.unit], n=0, ok=0;
      if(st) for(var k in st.done){ n++; if(st.done[k]===1) ok++; }
      var p=u.count?Math.round(n/u.count*100):0;
      html+='<button class="unit'+(p>=100?' done':'')+(u.ready?'':' locked')+'" '+
        (u.ready?'onclick="go(\'#/u/'+u.unit+'/theory\')"':'disabled')+'>'+
        '<span class="unum">'+u.unit+'</span><span class="ubody">'+
        '<span class="utitle">'+esc(u.title)+'</span>'+
        '<span class="umeta">'+(u.ready
            ? (u.count+'문항 · 객관식 '+u.mcq+' / 주관식 '+u.short+(n?' · 진도 '+p+'%':''))
            : '자료 준비 중')+'</span>'+
        (u.ready&&n?'<span class="bar"><i style="width:'+p+'%"></i></span>':'')+
        '</span></button>';
    });
    html+='</div>';
  });
  html+='<div class="sec-t">도구</div><div class="ulist"><button class="unit" onclick="resetAll()">'+
    '<span class="unum" style="background:var(--no-soft);color:var(--no)">↺</span><span class="ubody">'+
    '<span class="utitle">학습 기록 초기화</span><span class="umeta">진도·오답노트를 모두 지웁니다</span></span></button></div>';
  $app.innerHTML=html;
}
function resetAll(){ if(confirm('학습 기록을 모두 지울까요?')){ ST={u:{}}; save(); render(); toast('초기화했습니다'); } }

function viewUnit(u,tab){
  var meta=IDX.units.filter(function(x){return x.unit===u;})[0]||{};
  setHead('NCS '+u+'편','· '+ (meta.title||''),true);
  $app.innerHTML='<div class="spin">불러오는 중…</div>';
  loadUnit(u,function(d){
    var html='<div class="card" style="padding:14px 16px;margin-top:14px">'+
      '<div style="font-weight:800;font-size:16px;letter-spacing:-.02em">'+esc(d.title)+'</div>'+
      '<div class="small muted" style="margin-top:2px">능력단위코드 '+esc(d.code)+' · 문항 '+d.questions.length+'개</div></div>'+
      '<div class="tabs">'+
      ['theory:이론 요약','book:문제집','quiz:문제 풀기'].map(function(t){
        var k=t.split(':')[0];
        return '<button aria-selected="'+(tab===k)+'" onclick="go(\'#/u/'+u+'/'+k+'\')">'+t.split(':')[1]+'</button>';
      }).join('')+'</div><div id="pane"></div>';

    if(tab==='theory') paneTheory(pane,d);
    else if(tab==='book') paneBook(pane,d);
