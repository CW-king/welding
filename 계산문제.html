<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>용접 계산문제</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#b45309; --brand-soft:#fdf0dd; --ok:#047857; --ok-soft:#d9f2e6;
  --no:#b91c1c; --no-soft:#fde8e8; --warn:#b45309; --f-soft:#fff8ec; --f-line:#f3d9b1;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06); --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#141c2e;--ink:#e8edf7;--muted:#93a1bb;--line:#243149;
        --brand:#fbbf24;--brand-soft:#2a2011;--ok:#4ade80;--ok-soft:#12301f;
        --no:#fca5a5;--no-soft:#3a1414;--warn:#fbbf24;--f-soft:#1f1a10;--f-line:#4a3a1c;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.62;-webkit-text-size-adjust:100%;word-break:keep-all;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:54px}
.hd h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:22px 4px 8px}
.muted{color:var(--muted)}.hide{display:none!important}

/* 처음 화면 */
.intro{padding:16px;margin-top:14px}
.intro b{font-size:16px}
.intro p{margin:6px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 0}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed=true]{color:#1a1206}}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.topic .tn{font-weight:800;font-size:16px;letter-spacing:-.02em}
.topic .tf{font-size:12.5px;color:var(--muted);line-height:1.45}
.topic .tc{margin-top:4px;font-size:12px;font-weight:700;color:var(--brand)}
.topic .bar{width:100%;height:4px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.topic .bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.wide{grid-column:1/-1}
.quick{display:flex;gap:8px;margin-top:12px}
.qbtn{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.qbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.qbtn.primary{color:#1a1206}}

/* 공식 카드 */
.formula{background:var(--f-soft);border:1px solid var(--f-line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.formula h2{margin:0 0 8px;font-size:15px}
.formula ul{margin:0;padding-left:18px}
.formula li{margin:5px 0;font-size:14.5px}
.formula code{font-family:inherit;font-weight:800;background:rgba(180,83,9,.1);border-radius:6px;padding:1px 6px}
@media (prefers-color-scheme:dark){.formula code{background:rgba(251,191,36,.14)}}
.formula .tip{margin-top:8px;font-size:13px;color:var(--muted)}

/* 문제 */
.q{padding:15px 16px;margin-top:12px}
.qhead{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qno{font-weight:800;color:var(--brand);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.k{background:#e6edfd;color:#1d4ed8}
.badge.hot{background:var(--no-soft);color:var(--no)}
@media (prefers-color-scheme:dark){.badge.k{background:#141d33;color:#93b4fd}}
.qstem{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.65}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-size:15px;cursor:pointer;line-height:1.5}
.ch .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}.ch.ok .k{background:var(--ok);color:#fff}
.ch.no{border-color:var(--no);background:var(--no-soft)}.ch.no .k{background:var(--no);color:#fff}
.ch[disabled]{cursor:default}
.chwrap.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chwrap.imgs .ch{margin-top:0;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal{margin-top:10px;padding:12px 13px;border-radius:11px;background:var(--brand-soft);font-size:14.3px}
.reveal.ok{background:var(--ok-soft)}.reveal.no{background:var(--no-soft)}
.reveal .lab{font-weight:800;font-size:12px;letter-spacing:.04em;display:block;margin-bottom:3px}
.reveal.ok .lab{color:var(--ok)}.reveal.no .lab{color:var(--no)}
.reveal .ansv{font-weight:700}
.reveal .exp{margin-top:7px;padding-top:7px;border-top:1px solid rgba(120,130,150,.28);line-height:1.65}
.reveal .exp b{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.reveal .seen{margin-top:7px;font-size:12.5px;color:var(--muted)}
.vnote{margin-top:7px;font-size:12.6px;line-height:1.55;color:var(--muted);padding:7px 9px;border-radius:8px;background:rgba(120,130,150,.12)}
.vnote em{font-style:normal;font-weight:800;color:var(--ink)}
.figwarn{margin-top:7px;font-size:12.5px;color:var(--warn)}
.act{display:flex;gap:8px;margin-top:11px}
.btn{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.figs{margin:10px 0 2px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.figbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:100%;line-height:0}
.figbox img{display:block;max-width:100%;height:auto}
.zoom{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:8px;background:rgba(15,23,42,.55);color:#fff;font-size:13px;line-height:26px;text-align:center;cursor:pointer}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,12,20,.92);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.lb.on{display:flex}
.lb img{width:min(96vw,900px);max-height:80vh;object-fit:contain;margin:auto;background:#fff;border-radius:12px;padding:12px}
.lb .close{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:19px;cursor:pointer}
@media (prefers-color-scheme:dark){.figbox{background:#000;border-color:#24314966}.figbox img,.lb img{filter:invert(1)}.lb img{background:#000}}
.status{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 0;font-size:13.5px;color:var(--muted);font-weight:600}
.status button{border:0;background:none;color:var(--brand);font-weight:800;cursor:pointer;font-size:13.5px}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:14px}
.foot{margin-top:26px;padding:14px 4px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
</style>
</head>

장강도)×100 = (280/400)×100 = 70%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-08-22|30","k":"산업기사","d":"2020-08-22","topic":"효율·역률","seen":["산업기사 2020-08-22","산업기사 2017-08-26"],"q":"두께 4mm인 연강 판을 I형 맞대기 이음 용접을 한 결과 용착금속의 중량이 3kg이었다. 이때 융착효율이 60%라면 용접봉의 사용중량은 몇 kg인가?","c":["4","5","6","7"],"a":2,"w":"용접봉 사용중량 = 용착금속 중량 / 용착효율 = 3 / 0.6 = 5kg.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-08-22|32","k":"산업기사","d":"2020-08-22","topic":"입열·발열량","seen":["산업기사 2020-08-22","산업기사 2015-08-16"],"q":"피복 아크 용접에서 아크전류 200A, 아크전압 30V, 용접속도 20㎝/min 일 때 용접 길이 1㎝당 발생하는 용접입열 (Jpule/㎝)은?","c":["12000","15000","18000","20000"],"a":3,"w":"용접입열 H = 60EI/v = (60×30×200)/20 = 18000 J/cm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-08-04|34","k":"산업기사","d":"2019-08-04","topic":"연신율·경도","seen":["산업기사 2019-08-04","산업기사 2013-03-10"],"q":"약 2.5g의 강구를 25cm 높이에서 낙하시켰을 때 20cm 튀 어 올랐다면 쇼어경도(HS) 값은 약 얼마인가? (단, 계측통 은 목층형(C형)이다.)","c":["112.4","192.3","123.1","154.1"],"a":3,"w":"HS = (10000/65)×(h/h0) = (10000/65)×(20/25) = 153.8×0.8 ≒ 123.1.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-03-03|42","k":"산업기사","d":"2019-03-03","topic":"가스·용기","seen":["산업기사 2019-03-03","산업기사 2015-03-08"],"q":"46.7리터의 산소용기에 150kgf/cm2이 되게 산소를 충전하 였고, 이것을 대기 중에서 환산하면 산소는 약 몇 리터 인가?","c":["4090","5030","6100","7005"],"a":4,"w":"대기 중 환산 산소량 = 용기 내용적 × 충전 압력 = 46.7 × 150 = 7005 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-04-28|33","k":"산업기사","d":"2018-04-28","topic":"응력·강도","seen":["산업기사 2018-04-28","산업기사 2006-05-14"],"q":"그림과 같이 완전용입 T형 맞대기 용접 이음에 굽힘 모멘트 M = 9000kgf/cm가 적용할 때 최대 굽힘 응력(kgf/cm2)은? (단, L=400mm, ℓ=300mm, t = 20mm, P(kgf)는 하중이다.)","c":["30","45","300","450"],"a":1,"w":"굽힘 단면계수 Z=t·ℓ²/6=2×30²/6=300cm³, σ=M/Z=9000/300=30kgf/cm². (t=20mm=2cm, ℓ=300mm=30cm)","note":"","g":["f976"],"gc":[],"v":"","f":0,"gl":0,"figs":["f976"],"src":"기출"},{"id":"산업기사|2018-04-28|37","k":"산업기사","d":"2018-04-28","topic":"응력·강도","seen":["산업기사 2018-04-28","산업기사 2014-03-02"],"q":"그림과 같은 겹치기 이음의 필릿 용접을 하려고 한다. 허용 응력이 50Mpa, 인장하중이 50kN, 판두께가 12mm일 때 용접 유효길이는 약 몇mm인가?","c":["59","73","69","83"],"a":1,"w":"목두께 a = 0.707×12 = 8.49mm, 양면 필릿이므로 L = P/(2aσ) = 50000/(2×8.49×50) ≒ 59mm","note":"","g":["f977"],"gc":[],"v":"","f":0,"gl":0,"figs":["f977"],"src":"기출"},{"id":"산업기사|2018-03-04|29","k":"산업기사","d":"2018-03-04","topic":"목두께·환산길이","seen":["산업기사 2018-03-04","산업기사 2010-03-07"],"q":"판두께 8mm를 아래보기 자세로 15m, 판두께 15mm를 수직 자세로 8m 맞대기 용접 하였다. 이 때 환산 용접 길이는 얼마인가? (단, 아래보기 맞대기 용접의 환산계수는 1.32이 고, 수직 맞대기 용접의 환산 계수는 4.32이다.)","c":["44.28m","48.56m","54.36m","61.24m"],"a":3,"w":"환산 용접길이 = 15m×1.32 + 8m×4.32 = 19.8 + 34.56 = 54.36m.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-03-04|37","k":"산업기사","d":"2018-03-04","topic":"응력·강도","seen":["산업기사 2018-03-04","산업기사 2009-07-26"],"q":"용착금속의 인장강도가 40kgf/mm2이고 안전율이 5 라면 용접이음의 허용응력은 몇 kgf/mm2 인가?","c":["8","20","40","200"],"a":1,"w":"허용응력 = 인장강도/안전율 = 40/5 = 8 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-03-04|49","k":"산업기사","d":"2018-03-04","topic":"사용률","seen":["산업기사 2018-03-04","산업기사 2014-08-17"],"q":"정격전류가 500 A인 용접기를 실제는 400 A로 사용하는 경우의 허용사용률은 몇 % 인가? (단, 이 용접기의 정격사용 률은 40% 이다.)","c":["60.5","62.5","64.5","66.5"],"a":2,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (500/400)²×40 = 1.5625×40 = 62.5%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-08-26|34","k":"산업기사","d":"2017-08-26","topic":"응력·강도","seen":["산업기사 2017-08-26","산업기사 2006-03-05"],"q":"강판의 두께가 7mm, 용접길이가 12mm인 완전 용입된 맞대기 용접부위에 인장하중을 3444kgf로 작용시켰을 때 용접 부에 발생하는 인장응력은 약 몇 kgf/mm2인가?","c":["0.024","41","82","2009"],"a":2,"w":"σ = P/(t×ℓ) = 3444/(7×12) = 3444/84 = 41 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-03-05|32","k":"산업기사","d":"2017-03-05","topic":"입열·발열량","seen":["산업기사 2017-03-05","산업기사 2006-03-05"],"q":"용접전류가 120A, 용접전압이 12V, 용접속도가 분당 18㎝ /min 일 경우에 용접부의 입열량은 몇 Joule/㎝인가?","c":["3500","4000","4800","5100"],"a":3,"w":"입열량 H=60EI/v=60×12 V×120 A/18 cm/min=86400/18=4800 J/cm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-03-05|46","k":"산업기사","d":"2017-03-05","topic":"사용률","seen":["산업기사 2017-03-05","산업기사 2013-06-02"],"q":"아크 용접기로 정격2차 전류를 사용하여 4분간 아크를 발생 시키고 6분을 쉬었다면 용접기의 사용률은?","c":["20 %","30 %","40 %","60 %"],"a":3,"w":"사용률 = 아크 발생시간/(아크 발생시간+휴식시간)×100 = 4/(4+6)×100 = 40 %.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-08-21|40","k":"산업기사","d":"2016-08-21","topic":"목두께·환산길이","seen":["산업기사 2016-08-21","산업기사 2006-03-05"],"q":"필릿 용접의 이음 강도를 계산할 때 목 길이 10mm 라면 목 두께는?","c":["약 7mm","약 10mm","약 12mm","약 15mm"],"a":1,"w":"목두께 = 목길이(다리길이)×cos45° = 10×0.707 ≈ 7mm. 이론 목두께는 다리길이의 약 0.7배다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-03-06|33","k":"산업기사","d":"2016-03-06","topic":"연신율·경도","seen":["산업기사 2016-03-06","산업기사 2018-08-19"],"q":"처음길이가 340mm인 용접 재료를 길이방향으로 인장시험 한 결과 390mm가 되었다. 이 재료의 연신율은 약 몇 % 인가?","c":["12.8","14.7","17.2","87.2"],"a":2,"w":"연신율 = (늘어난 길이/처음 길이)×100 = (390-340)/340×100 = 50/340×100 ≒ 14.7%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-03-06|45","k":"산업기사","d":"2016-03-06","topic":"입열·발열량","seen":["산업기사 2016-03-06","산업기사 2010-05-09"],"q":"저항용접에 의한 압접에서 전류 20A, 전기저항 30Ω, 통전 시간 10 sec일 때 발열량은 약 몇 cal 인가?","c":["14400","24400","28800","48800"],"a":3,"w":"H = 0.24 I²Rt = 0.24 × 20² × 30 × 10 = 0.24 × 400 × 300 = 28800cal.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-03-06|59","k":"산업기사","d":"2016-03-06","topic":"사용률","seen":["산업기사 2016-03-06","산업기사 2011-08-21"],"q":"AW300 용접기의 정격사용률이 40%일 때 200 A로 용접을 하면 10분 작업 중 몇 분까지 아크를 발생해도 용접기에 무 리가 없는가?","c":["3분","5분","7분","9분"],"a":4,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (300/200)²×40 = 2.25×40 = 90%, 즉 10분 중 9분까지 아크를 낼 수 있다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2015-08-16|33","k":"산업기사","d":"2015-08-16","topic":"효율·역률","seen":["산업기사 2015-08-16","산업기사 2009-03-01"],"q":"강판의 두께 15mm, 폭 100mm의 V형 홈을 맞대기 용접이 음할 때 이음효율을 80%, 판의 허용응력을 35kgf/mm2로 하면 인장하중(kgf)은 얼마까지 허용할 수 있는가?","c":["35000","38000","40000","42000"],"a":4,"w":"허용하중 = 허용응력×단면적×이음효율 = 35×(15×100)×0.8 = 42000 kgf.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2014-10-11|32","k":"기능사","d":"2014-10-11","topic":"사용률","seen":["기능사 2014-10-11","특수용접기능사 2014-01-26"],"q":"정격 2차 전류 200A, 정격 사용률 40%, 아크 용접기로 150A의 용접전류 사용시 허용 사용률은 약 얼마인가?","c":["51%","61%","71%","81%"],"a":3,"w":"허용사용률 = (정격2차전류/실제전류)² × 정격사용률 = (200/150)² × 40 = 1.78 × 40 ≒ 71%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2014-07-20|34","k":"기능사","d":"2014-07-20","topic":"가스·용기","seen":["기능사 2014-07-20","기능사 2011-10-09"],"q":"35℃에서 150kgf/cm2으로 압축하여 내부용적 45.7리터의 산소 용기에 충전하였을 때, 용기속의 산소량은 몇 리터 인가?","c":["6855","5250","6150","7005"],"a":1,"w":"산소량 = 용기 내용적 × 충전압력 = 45.7 L × 150 kgf/cm² = 6855 L.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-03-02|46","k":"산업기사","d":"2014-03-02","topic":"기타 계산","seen":["산업기사 2014-03-02","산업기사 2018-08-19"],"q":"두께가 12.7mm인 강판을 가스 절단하려 할 때 표준드래 그의 길이는 2.4mm이다. 이 때 드래그는 몇 % 인가?","c":["18.9","32.1","42.9","52.4"],"a":1,"w":"드래그(%) = 드래그 길이/판 두께 ×100 = 2.4/12.7×100 ≈ 18.9%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2013-10-12|19","k":"특수용접기능사","d":"2013-10-12","topic":"기타 계산","seen":["특수용접기능사 2013-10-12","특수용접기능사 2003-10-05"],"q":"가스절단에서 재료 두께가 25㎜ 일 때 표준드래그의 길이는 다음 중 몇 ㎜ 정도 인가?","c":["10","8","5","2"],"a":3,"w":"표준 드래그 = 판두께의 약 20% → 25 × 0.2 = 5㎜","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"산업기사|2013-03-10|23","k":"산업기사","d":"2013-03-10","topic":"목두께·환산길이","seen":["산업기사 2013-03-10","산업기사 2009-03-01"],"q":"필릿 용접에서 목길이가 10mm일 때 이론 목두께는 몇 mm 인가?","c":["약 5.0","약 6.1","약 7.1","약 8.0"],"a":3,"w":"이론 목두께 a = 0.707 × 목길이 = 0.707 × 10 = 7.07 ≒ 7.1mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-08-26|39","k":"산업기사","d":"2012-08-26","topic":"응력·강도","seen":["산업기사 2012-08-26","산업기사 2009-03-01"],"q":"그림과 같이 강판 두께(t) 19mm, 용접선의 유효길이(ℓ) 200mm, h1, h2가 각각 8mm, 하중(P) 7000 kgf 가 작용할 때 용접부에 발생하는 인장응력은 약 몇 kgf/mm2 인가?","c":["0.2","2.2","4.8","6.8"],"a":2,"w":"σ = P / (목두께 × 유효길이) = 7000 / ((8+8) × 200) = 7000 / 3200 ≈ 2.2 kgf/mm².","note":"","g":["f783"],"gc":[],"v":"","f":0,"gl":0,"figs":["f783"],"src":"기출"},{"id":"특수용접기능사|2011-07-31|6","k":"특수용접기능사","d":"2011-07-31","topic":"가스·용기","seen":["특수용접기능사 2011-07-31","기능사 2014-01-26"],"q":"내용적 40.7 리터의 산소병에 150kgf/㎠의 압력이 게이지에 표 시되었다면 산소병에 들어 있는 산소량은 몇 리터인가?","c":["3400","4055","5055","6105"],"a":4,"w":"산소량 = 40.7 × 150 = 6105 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2011-06-12|52","k":"산업기사","d":"2011-06-12","topic":"전기·퓨즈","seen":["산업기사 2011-06-12","산업기사 2006-08-06"],"q":"40kVA의 교류아크 용접기의 전원전압이 200V일 때 전원 스위치에 넣을 퓨즈의 용량은 몇 A 인가?","c":["50","100","150","200"],"a":4,"w":"퓨즈 용량 = 1차 입력(VA)/전원전압 = 40000/200 = 200A. 용접기 용량 kVA를 VA로 바꿔 전압으로 나누면 된다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2011-04-17|17","k":"기능사","d":"2011-04-17","topic":"응력·강도","seen":["기능사 2011-04-17","특수용접기능사 2009-03-29"],"q":"연강의 인장 시험에서 하중 100N, 시험편의 최초 단면적이 20㎟ 일 때 응력은 몇 N/㎟인가?","c":["5","10","15","20"],"a":1,"w":"응력 = 하중/단면적 = 100N ÷ 20㎟ = 5 N/㎟.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2011-02-13|30","k":"특수용접기능사","d":"2011-02-13","topic":"가스·용기","seen":["특수용접기능사 2011-02-13","특수용접기능사 2014-01-26"],"q":"액체 이산화탄소 25kg 용기는 대기 중에서 가스량이 대략 12700L 이다. 20L/min의 유량으로 연속 사용할 경우 사용 가 능한 시간(hour)은 약 얼마인가?","c":["60시간","6시간","10시간","1시간"],"a":3,"w":"12700 L ÷ 20 L/min = 635분 ≈ 10.6시간 → 약 10시간","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2010-07-11|37","k":"기능사","d":"2010-07-11","topic":"가스·용기","seen":["기능사 2010-07-11","특수용접기능사 2007-09-16"],"q":"가변압식 토치의 팁 번호가 400번을 사용하여 중성불꽃으로 1시간 동안 용접할 때, 아세틸렌가스의 소비량은 몇 ℓ 인가?","c":["400","800","1600","2400"],"a":1,"w":"가변압식(프랑스식) 팁 번호는 표준불꽃으로 1시간 동안 소비하는 아세틸렌 양(ℓ)을 뜻하므로 400번 = 400ℓ이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2010-03-07|21","k":"산업기사","d":"2010-03-07","topic":"응력·강도","seen":["산업기사 2010-03-07","산업기사 2007-03-04"],"q":"다음 그림과 같은 용접부에 인장하중이 5000kgf 작용할 때 인장응력은 몇 kgf/mm2 인가?","c":["20","25","30","35"],"a":2,"w":"인장응력 = 하중/(판두께×용접길이) = 5000/(10×20) = 25 kgf/mm².","note":"","g":["f659"],"gc":[],"v":"","f":0,"gl":0,"figs":["f659"],"src":"기출"},{"id":"특수용접기능사|2010-01-31|41","k":"특수용접기능사","d":"2010-01-31","topic":"가스·용기","seen":["특수용접기능사 2010-01-31","특수용접기능사 2015-04-04"],"q":"15℃, 1kgf/cm²하에서 사용 전 용해아세틸렌 병의 무게가 50kgf이고, 사용 후 무게가 47kgf일 때 사용한 아세틸렌 양은 몇 리터인가?","c":["2915","2815","3815","2715"],"a":4,"w":"(50 − 47) × 905 = 2715 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2010-01-31|31","k":"기능사","d":"2010-01-31","topic":"가스·용기","seen":["기능사 2010-01-31","특수용접기능사 2014-10-11"],"q":"아세틸렌은 각종 액체에 잘 용해된다. 그러면 1기압 아세톤 2ℓ에는 몇 ℓ의 아세틸렌이 용해되는가?","c":["2","10","25","50"],"a":4,"w":"아세틸렌은 1기압에서 아세톤 1ℓ당 약 25ℓ가 녹으므로, 아세톤 2ℓ에는 25 × 2 = 50ℓ가 용해된다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2010-01-31|30","k":"기능사","d":"2010-01-31","topic":"가스·용기","seen":["기능사 2010-01-31","기능사 2009-07-12"],"q":"내용적 33.7ℓ의 산소병에 150kgf/㎠ 의 압력이 게이지에 표시되었다면 산소병에 들어 잇는 산소량은 몇 ℓ 인가?","c":["3400","5055","4700","4800"],"a":2,"w":"산소량 = 내용적 × 게이지압력 = 33.7 × 150 = 5055ℓ이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2008-03-02|45","k":"산업기사","d":"2008-03-02","topic":"전기·퓨즈","seen":["산업기사 2008-03-02","특수용접기능사 2009-01-18"],"q":"1차 입력이 22kVA 인 피복 아크용접기에서 전원 전압이 220V라면 퓨즈는 다음 중 몇 A 가 가장 적합한가?","c":["50","100","200","400"],"a":2,"w":"1차 전류 = 1차 입력/전원 전압 = 22000VA/220V = 100A이므로 퓨즈 용량은 100A가 적합하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2007-09-16|12","k":"특수용접기능사","d":"2007-09-16","topic":"기타 계산","seen":["특수용접기능사 2007-09-16","특수용접기능사 2014-10-11"],"q":"연강판 두께가 25.4㎜ 일 때 표준 드래그 길이로 가장 적합한 것은?","c":["2.4㎜","5.2㎜","10.2㎜","25.4㎜"],"a":2,"w":"표준 드래그 = 판두께의 약 20% → 25.4 × 0.2 ≈ 5.1 → 5.2㎜","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2005-10-02|23","k":"특수용접기능사","d":"2005-10-02","topic":"가스·용기","seen":["특수용접기능사 2005-10-02","특수용접기능사 2010-07-11"],"q":"내용적 40리터, 충전압력이 150인 산소용기의 압력이 100까 지 내려갔다면 소비한 산소의 량은 몇 리터인가?","c":["2000","3000","4000","5000"],"a":1,"w":"소비량 = 내용적 × 압력 차 = 40 × (150 − 100) = 2000 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2002-04-07|3","k":"특수용접기능사","d":"2002-04-07","topic":"가스·용기","seen":["특수용접기능사 2002-04-07","특수용접기능사 2004-04-04"],"q":"내용적 40리터의 산소 용기에 100kgf/㎝2의 산소가 들어 있다면 가변압식 팁 200번으로 중성불꽃을 사용하여 용접할 때, 몇 시간 사용할 수 있는가 ?","c":["20시간","15시간","10시간","8시간"],"a":1,"w":"산소량 = 40 × 100 = 4000 L. 가변압식 200번 = 시간당 200L → 4000 ÷ 200 = 20시간","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"comcbt","mock":false},{"id":"산업기사|2020-08-22|54","k":"산업기사","d":"2020-08-22","topic":"사용률","seen":["산업기사 2020-08-22"],"q":"AW-400, 정격 사용률이 60%인 아크용접기로 300A의 전류 로 용접한다면 허용 사용률은 약 몇 %인가?","c":["90","100","107","126"],"a":3,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (400/300)²×60 = 1.78×60 ≈ 107%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-06-06|21","k":"산업기사","d":"2020-06-06","topic":"응력·강도","seen":["산업기사 2020-06-06"],"q":"두께가 5mm인 강판을 가지고 다음 그림과 같이 완전 용입 의 맞대기 용접을 하려고 한다. 이 때 최대 인장하중을 50000M 작용시키려면 용접 길이는 얼마인가? (단, 용접부의 허용 인장응력은 100MPa이다.)","c":["50mm","100mm","150mm","200mm"],"a":2,"w":"σ=P/(t·ℓ)에서 필요 단면적 A=P/σ=50000N/100N/mm²=500mm², ℓ=A/t=500/5=100mm.","note":"","g":["f1002"],"gc":[],"v":"","f":0,"gl":0,"figs":["f1002"],"src":"기출"},{"id":"산업기사|2020-06-06|27","k":"산업기사","d":"2020-06-06","topic":"효율·역률","seen":["산업기사 2020-06-06"],"q":"인장강도가 530M/mm2인 모재를 용접하여 만든 용접시험편 인 인장강도가 380N/mm2일 때 이 용접부의 이음효율은 약 몇 %인가?","c":["52","72","94","140"],"a":2,"w":"이음효율 = (용접부 인장강도/모재 인장강도)×100 = (380/530)×100 ≒ 71.7%, 약 72%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-06-06|28","k":"산업기사","d":"2020-06-06","topic":"연신율·경도","seen":["산업기사 2020-06-06"],"q":"최초길이가 15mm인 시험편을 인장시험 후 20mm가 되었을 경우 연신률은 약 몇 %인가?","c":["13","23","33","53"],"a":3,"w":"연신율 = (늘어난 길이−처음 길이)/처음 길이×100 = (20−15)/15×100 ≒ 33.3%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-06-06|46","k":"산업기사","d":"2020-06-06","topic":"사용률","seen":["산업기사 2020-06-06"],"q":"정격 사용률이 50%이고, 정격 2차 전류가 300A인 아크 용접기를 사용하여 실제 300A로 용접한다면 용접기의 허용 사용률은 몇 %인가?","c":["34.7","41.7","50","72"],"a":3,"w":"허용사용률 = (정격2차전류/실제 용접전류)²×정격사용률 = (300/300)²×50 = 50%. 정격전류 그대로 쓰면 정격사용률과 같다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2020-06-06|49","k":"산업기사","d":"2020-06-06","topic":"전기·퓨즈","seen":["산업기사 2020-06-06"],"q":"1차 입력이 40kVA인 피복아크 용접기에서 전원 전압이 200V라면 퓨즈의 용량은 몇 A가 가장 적합한가?","c":["100","150","200","250"],"a":3,"w":"퓨즈 용량 = 1차 입력/전원 전압 = 40,000VA/200V = 200A.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-08-04|30","k":"산업기사","d":"2019-08-04","topic":"응력·강도","seen":["산업기사 2019-08-04"],"q":"V형 맞대기 이음에 완전 용입된 경우 용접선에 직각 방향으로 5000kgt의 인장하중이 작용하고 모재 두께가 5mm, 용접선 길이가 5cm 일 때 이음부에 발생되는 인장 응력은 kgt/mm2인가?","c":["2","20","200","2000"],"a":2,"w":"인장응력 = 하중/(모재 두께×용접선 길이) = 5000/(5×50) = 20 kgf/mm². 용접선 5cm를 50mm로 환산해 계산한다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-08-04|31","k":"산업기사","d":"2019-08-04","topic":"응력·강도","seen":["산업기사 2019-08-04"],"q":"연강의 맞대기 용접이음에서 용착급속의 인장강도가 45kgt/mm2, 안전율 3일 때 용접 이음의 허용응력은 몇 kgt/mm2인가?","c":["10","15","20","25"],"a":2,"w":"허용응력 = 인장강도/안전율 = 45/3 = 15 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-08-04|50","k":"산업기사","d":"2019-08-04","topic":"사용률","seen":["산업기사 2019-08-04"],"q":"정격 2차 전류 300A인 용접기에서 200A로 용접 시 허용사 용률은 몇 % 인가? (단, 정격 사용률은 40%이다.)","c":["75","90","100","120"],"a":2,"w":"허용사용률 = (정격 2차 전류/실제 용접전류)²×정격사용률 = (300/200)²×40 = 2.25×40 = 90%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-08-04|56","k":"산업기사","d":"2019-08-04","topic":"입열·발열량","seen":["산업기사 2019-08-04"],"q":"전기 저항 용접에 의한 압전에서 전류 25A, 저항 20Ω, 동 전시간 10s 일 때 발열량은 약 몇 cal인가?","c":["300","1200","6000","30000"],"a":4,"w":"H = 0.24 I²Rt = 0.24×25²×20×10 = 0.24×625×200 = 30,000 cal.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-03-03|21","k":"산업기사","d":"2019-03-03","topic":"응력·강도","seen":["산업기사 2019-03-03"],"q":"연강의 맞대기 용접 이음에서 용착금속의 인장강도가 100kgf/mm2이고 안전률이 5일 때 용접 이음의 허용응력은 몇 kgf/mm2인가?","c":["10","20","40","80"],"a":2,"w":"허용응력 = 인장강도/안전율 = 100/5 = 20 kgf/mm²","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2019-03-03|25","k":"산업기사","d":"2019-03-03","topic":"연신율·경도","seen":["산업기사 2019-03-03"],"q":"표점거리가 50mm인 인장 시험편을 인장 시험한 결과 62mm로 늘어났다면 연신율(%)은 얼마인가?","c":["12","18","24","30"],"a":3,"w":"연신율 = (늘어난 길이-표점거리)/표점거리 ×100 = (62-50)/50 ×100 = 24%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-08-19|47","k":"산업기사","d":"2018-08-19","topic":"기타 계산","seen":["산업기사 2018-08-19"],"q":"ø3.2mm인 용접봉으로 연강 판울 가스 용접하려 할 때 선택하여야 할 가장 적합한 판재의 두께는 몇 mm인가?","c":["4.4","6.6","7.5","8.8"],"a":1,"w":"D = T/2 + 1 → 3.2 = T/2 + 1 → T = 4.4㎜","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"comcbt","mock":false},{"id":"산업기사|2018-04-28|30","k":"산업기사","d":"2018-04-28","topic":"효율·역률","seen":["산업기사 2018-04-28"],"q":"20kg의 피복 아크 용접봉을 가지고 두께 9mm 연강판 구조 물을 용접하여 용착되고 남은 피복중량, 스패터, 잔봉, 연소 에 의한 손실 등의 무게가 4 kg이었다면 이 때 피복 아크 용접봉의 용착 효율은?","c":["60%","70%","80%","90%"],"a":3,"w":"용착효율 = 용착금속 중량/용접봉 중량 = (20-4)/20 × 100 = 80%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-04-28|55","k":"산업기사","d":"2018-04-28","topic":"효율·역률","seen":["산업기사 2018-04-28"],"q":"무부하 전압 80V, 아크 전압 30V, 아크 전류 300A, 내부 손실이 4kw인 경우 아크 용접기의 효율은 약 몇 %인가?","c":["59","69","75","80"],"a":2,"w":"효율 = 아크출력/(아크출력+내부손실) = (30×300)/(9000+4000) = 9000/13000 ≒ 69%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-03-04|34","k":"산업기사","d":"2018-03-04","topic":"효율·역률","seen":["산업기사 2018-03-04"],"q":"어떤 용접구조물을 시공할 때 용접봉이 0.2톤이 소모되었는 데, 170kgf의 용착금속 중량이 산출되었다면 용착효율은 몇 % 인가?","c":["7.6","8.5","76","85"],"a":4,"w":"용착효율 = (용착금속 중량/용접봉 사용량)×100 = 170/200×100 = 85%. 0.2톤 = 200kgf임에 주의한다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2018-03-04|58","k":"산업기사","d":"2018-03-04","topic":"사용률","seen":["산업기사 2018-03-04"],"q":"용접기의 아크 발생시간을 6분, 휴식시간을 4분이라 할 때 용접기의 사용률은 몇 %인가?","c":["20","40","60","80"],"a":3,"w":"사용률 = 아크시간/(아크시간+휴식시간)×100 = 6/(6+4)×100 = 60%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-08-26|23","k":"산업기사","d":"2017-08-26","topic":"목두께·환산길이","seen":["산업기사 2017-08-26"],"q":"필릿용접에서 다리길이가 10mm인 용접부의 이론 목두께는 약 몇 mm인가?","c":["0.707","7.07","70.7","707"],"a":2,"w":"이론 목두께 a = 0.707 × 다리길이 = 0.707 × 10 = 7.07mm이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-08-26|47","k":"산업기사","d":"2017-08-26","topic":"전기·퓨즈","seen":["산업기사 2017-08-26"],"q":"용접전류 200A, 전압 40V 일 때 1초 동안에 전달되는 일률 을 나타내는 전력은?","c":["2kW","4kW","6kW","8kW"],"a":4,"w":"전력 P = 전류 × 전압 = 200A × 40V = 8000W = 8kW.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-05-07|27","k":"산업기사","d":"2017-05-07","topic":"응력·강도","seen":["산업기사 2017-05-07"],"q":"V형 맞대기 용접에서 판 두께가 10mm, 용접선의 유효길이가 200mm 일 때, 5N/mm2의 인장응력이 발생한다면 이 때 작용하는 인장하중은 몇 N 인가?","c":["3000","5000","10000","12000"],"a":3,"w":"P = σ×t×L = 5N/mm²×10mm×200mm = 10000N","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-05-07|57","k":"산업기사","d":"2017-05-07","topic":"사용률","seen":["산업기사 2017-05-07"],"q":"정격 2차 전류가 300A, 정격 사용률 50%인 용접기를 사용 하여 lOOA 의 전류로 용접을 할 때 허용 사용률은?","c":["5.6 %","150 %","450 %","550 %"],"a":3,"w":"허용사용률 = (정격2차전류/실제전류)²×정격사용률 = (300/100)²×50 = 450%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2017-03-05|23","k":"산업기사","d":"2017-03-05","topic":"응력·강도","seen":["산업기사 2017-03-05"],"q":"두께가 5 ㎜ 인 강판을 가지고 다음 그림과 같이 완전 용입 의 맞대기 용접을 하려고 한다. 이 때 최대 인장하중을 50000N 작용 시키려면 용접 길이는 얼마인가? (단, 용접부의 허용 인장응력은 100 MPa 이다.)","c":["50 ㎜","100 ㎜","150 ㎜","200 ㎜"],"a":2,"w":"완전용입 맞대기이므로 σ=P/(t·L) → L=P/(σ·t)=50000 N/(100 N/mm²×5 mm)=100 mm.","note":"","g":["f932"],"gc":[],"v":"","f":0,"gl":0,"figs":["f932"],"src":"기출"},{"id":"산업기사|2016-08-21|21","k":"산업기사","d":"2016-08-21","topic":"응력·강도","seen":["산업기사 2016-08-21"],"q":"완전한 맞대기 용접이음의 굽힘모멘트(Mb)=12000N·㎜가 작용하고 있을 때 최대굽힘응력은 약 몇 N/mm2인가? (단, l=300㎜, t=25㎜)","c":["0.324","0.344","0.384","0.424"],"a":3,"w":"굽힘응력 σ=6Mb/(l·t²)=6×12000/(300×25²)=72000/187500≈0.384N/mm².","note":"","g":["f917"],"gc":[],"v":"","f":0,"gl":0,"figs":["f917"],"src":"기출"},{"id":"산업기사|2016-08-21|60","k":"산업기사","d":"2016-08-21","topic":"사용률","seen":["산업기사 2016-08-21"],"q":"Aw-240용접기로 180A를 이용하여 용접한다면, 허용 사용 율은 약 몇 %인가? (단, 정격 사용율은 40%이다.)","c":["51","61","71","81"],"a":3,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (240/180)²×40 = 1.78×40 ≈ 71%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2016-07-10|3","k":"기능사","d":"2016-07-10","topic":"응력·강도","seen":["기능사 2016-07-10"],"q":"용착금속의 인장강도가 55N/m2, 안전율이 6이라면 이음의 허용응력은 약 몇 N/m2인가?","c":["0.92","9.2","92","920"],"a":2,"w":"허용응력 = 인장강도 ÷ 안전율 = 55 ÷ 6 = 9.17 ≈ 9.2 N/m².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2016-07-10|23","k":"기능사","d":"2016-07-10","topic":"사용률","seen":["기능사 2016-07-10"],"q":"정격 2차 전류 200A, 정격 사용률 40%인 아크용접기로 실제 아크 전압 30V, 아크 전류 130A로 용접을 수행한다고 가정할 때 허용 사용률은 약 얼마인가?","c":["70%","75%","80%","95%"],"a":4,"w":"허용사용률 = (정격 2차 전류 ÷ 실제 전류)² × 정격사용률 = (200/130)² × 40 = 2.37 × 40 ≈ 95%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-05-08|23","k":"산업기사","d":"2016-05-08","topic":"응력·강도","seen":["산업기사 2016-05-08"],"q":"맞대기 용접이음에서 강판의 두께 6mm, 인장하중 60kN을 작용시키려 한다. 이때 필요한 용접 길이는? (단, 허용 인장 응력은 500MPa이다.)","c":["20mm","30mm","40mm","50mm"],"a":1,"w":"σ = P/(t×L) → L = P/(t×σ) = 60,000N/(6mm×500N/mm²) = 60,000/3,000 = 20mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-05-08|36","k":"산업기사","d":"2016-05-08","topic":"목두께·환산길이","seen":["산업기사 2016-05-08"],"q":"현장용접으로 판 두께 15mm를 위보기 자세로 20m 맞대기 용접할 경우 환산 용접 길이는 몇 m 인가? (단, 위보기 맞대기 용접 환산계수는 4.8이다.)","c":["4.1","24.8","96","152"],"a":3,"w":"환산 용접 길이 = 실제 용접 길이 × 환산계수 = 20m × 4.8 = 96m.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2016-05-08|54","k":"산업기사","d":"2016-05-08","topic":"가스·용기","seen":["산업기사 2016-05-08"],"q":"용해 아세틸렌가스를 충전하였을 때의 용기 전체의 무게가 65kgf이고, 사용 후 빈병의 무게가 61kgf였다면, 사용한 아세틸렌 가스는 몇 리터(L)인가?","c":["905","1810","2715","3620"],"a":4,"w":"아세틸렌 1kgf는 약 905L이므로, 사용량 = 905 × (충전 후 무게－빈병 무게) = 905 × (65－61) = 3,620L.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2016-04-02|43","k":"특수용접기능사","d":"2016-04-02","topic":"응력·강도","seen":["특수용접기능사 2016-04-02"],"q":"인장시험편의 단면적이 50㎟이고, 하중이 500kgf일 때 인장 강도는 얼마인가?","c":["10kgf/㎟","50kgf/㎟","100kgf/㎟","250kgf/㎟"],"a":1,"w":"인장강도 = 500 ÷ 50 = 10 kgf/㎟","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"특수용접기능사|2016-04-02|19","k":"특수용접기능사","d":"2016-04-02","topic":"응력·강도","seen":["특수용접기능사 2016-04-02"],"q":"맞대기 용접이음에서 판 두께가 6㎜, 용접선 길이가 120㎜, 인장응력이 9.5N/㎟일 때 모재가 받는 하중은 몇 N인가?","c":["5680","5860","6480","6840" ":["특수용접기능사 2015-04-04"],"q":"AW300, 정격사용률이 40%인 교류아크 용접기를 사용하여 실제 150A의 전류 용접을 한다면 허용 사용률은?","c":["80%","120%","140%","160%"],"a":4,"w":"AW300 → 정격 300A. 허용사용률 = (300/150)² × 40 = 160%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"특수용접기능사|2015-04-04|23","k":"특수용접기능사","d":"2015-04-04","topic":"기타 계산","seen":["특수용접기능사 2015-04-04"],"q":"다음 중 두께 20㎜인 강판을 가스 절단하였을 때 드래그 (drag)의 길이가 5㎜이었다면 드래그 양은 몇 %인가?","c":["5","20","25","100"],"a":3,"w":"드래그(%) = 5 ÷ 20 × 100 = 25%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"기능사|2015-04-04|18","k":"기능사","d":"2015-04-04","topic":"응력·강도","seen":["기능사 2015-04-04"],"q":"맞대기이음에서 판 두께 100㎜, 용접 길이 300㎝, 인장하중이 9000kgf일 때 인장응력은 몇 kgf/cm2인가?","c":["0.3","3","30","300"],"a":2,"w":"인장응력 = 하중 / (판두께×용접길이) = 9000 / (10㎝×300㎝) = 9000/3000 = 3 kgf/㎠. 판 두께 100㎜를 10㎝로 단위 환산하는 것이 핵심이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2015-03-08|31","k":"산업기사","d":"2015-03-08","topic":"응력·강도","seen":["산업기사 2015-03-08"],"q":"용접이음 강도 계산에서 안전율을 5로 하고 허용 응력을 100MPa이라 할 때 인장강도는 얼마인가?","c":["300MPa","400MPa","500MPa","600MPa"],"a":3,"w":"안전율 = 인장강도 / 허용응력 이므로 인장강도 = 안전율 × 허용응력 = 5 × 100 = 500MPa.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2015-03-08|32","k":"산업기사","d":"2015-03-08","topic":"응력·강도","seen":["산업기사 2015-03-08"],"q":"다음 그림은 겹치기 필릿용접 이음을 나타낸 것이다. 이음 부에 발생하는 허용응력은 5MPa일 때 필요한 용접 길이(ℓ) 는 얼마인가? (단, h=20mm, P=6kN이다.)","c":["약 42mm","약 38mm","약 35mm","약 32mm"],"a":1,"w":"겹치기 양면 필릿이므로 τ = P/(2×0.707×h×ℓ). ℓ = 6000/(2×0.707×20×5) = 6000/141.4 ≒ 42mm.","note":"","g":["f862"],"gc":[],"v":"","f":0,"gl":0,"figs":["f862"],"src":"기출"},{"id":"산업기사|2015-03-08|34","k":"산업기사","d":"2015-03-08","topic":"효율·역률","seen":["산업기사 2015-03-08"],"q":"인장강도가 430MPa인 모재를 용접하여 만든 용접시험편의 인장강도가 350MPa일 때 이 용접부의 이음효율은 약 몇 % 인가?","c":["81","90","71","122"],"a":1,"w":"이음효율 = (용접시험편 인장강도/모재 인장강도)×100 = (350/430)×100 ≒ 81%.","note":"", 강도는 43kgf/mm2이다.)","c":["716kgf","4450kgf","40635kgf","58050kgf"],"a":4,"w":"P = 인장강도 × 단면적 = 43 × (9 × 150) = 43 × 1350 = 58050 kgf.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-05-25|22","k":"산업기사","d":"2014-05-25","topic":"응력·강도","seen":["산업기사 2014-05-25"],"q":"두께가 5mm인 강판을 가지고 완전 용입의 T형 용접을 하려고 한다. 이때 최대 50000N 의 인장하중을 작용시키려면 용접길이는 얼마인가? (단, 용접부의 허용 인장응력은 100MPa 이다.)","c":["50 mm","100 mm","150 mm","200 mm"],"a":2,"w":"완전 용입이므로 목두께=판두께. L = P/(t×σ) = 50000/(5×100) = 100mm","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-05-25|24","k":"산업기사","d":"2014-05-25","topic":"응력·강도","seen":["산업기사 2014-05-25"],"q":"T형 이음(홈 완전 용입)에서 P=31.5kN, h=7mm 로 할 때 용접 길이는 얼마인가? (단, 허용 응력은 90 MPa 이다.)","c":["20 mm","30 mm","40 mm","50 mm"],"a":4,"w":"L = P/(h×σ) = 31500N/(7mm×90N/mm²) = 50mm","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-05-25|36","k":"산업기사","d":"2014-05-25","topic":"효율·역률","seen":["산업기사 2014-05-25"],"q":"연강판 용접 인장 시험에서 모재의 인장 강도가 3500MPa, 용접 시험편의 인장 강도가 2800MPa로 나타났다면 이음 효율은?","c":["60%","70%","80%","90%"],"a":3,"w":"이음효율 = (용접부 인장강도/모재 인장강도)×100 = (2800/3500)×100 = 80%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-05-25|51","k":"산업기사","d":"2014-05-25","topic":"가스·용기","seen":["산업기사 2014-05-25"],"q":"용해 아세틸렌 가스를 충전하였을 때 용기 전체의 무게가 34kgf 이고 사용 후 빈병의 무게가 31kgf이면, 15℃, 1kgf/cm2 하에서 충전된 아세틸렌 가스의 양은 약 몇 L 인가?","c":["465 L","1054 L","1581 L","2715 L"],"a":4,"w":"아세틸렌 양(L) = 905×(충전 후 무게 - 빈병 무게) = 905×(34-31) = 2715 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-05-25|55","k":"산업기사","d":"2014-05-25","topic":"가스·용기","seen":["산업기사 2014-05-25"],"q":"내용적 40리터의 산소용기에 140kgf/cm2의 산소가 들어있 다. 350번 팁을 사용하여 혼합비 1 : 1의 표준불꽃으로 작 업하면 몇 시간이나 작업할 수 있는가?","c":["10시간","12시간","14시간","16시간"],"a":4,"w":"총 산소량 = 40L×140 = 5600L, 350번 팁은 시간당 산소 350L 소비. 5600/350 = 16시간","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2014-04-06|47","k":"특수용접기능사","d":"2014-04-06","topic":"사용률","seen":["특수용접기능사 2014-04-06"],"q":"아크 발생 시간이 3분, 아크 발생 정지 시간이 7분일 경우 사용률(%)은?","c":["100%","70%","50%","30%"],"a":4,"w":"사용률 = 3 ÷ (3 + 7) × 100 = 30%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"산업기사|2014-03-02|26","k":"산업기사","d":"2014-03-02","topic":"응력·강도","seen":["산업기사 2014-03-02"],"q":"연강을 용접 이음할 때 인장강도가 21 N/mm2, 허용응력 7 N/mm2이다. 정하중에서 구조물을 설계할 경우 안전율 은 얼마인가?","c":["1","2","3","4"],"a":3,"w":"안전율 = 인장강도 / 허용응력 = 21 / 7 = 3","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2014-03-02|32","k":"산업기사","d":"2014-03-02","topic":"입열·발열량","seen":["산업기사 2014-03-02"],"q":"아크 전류가 300A, 아크 전압이 25V, 용접속도가 20cm/min 인 경우 발생되는 용접 입열은?","c":["20000 J/cm","22500 J/cm","25500 J/cm","30000 J/cm"],"a":2,"w":"용접입열 H = 60EI/v = 60×25×300/20 = 22500 J/cm","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2014-01-26|12","k":"특수용접기능사","d":"2014-01-26","topic":"가스·용기","seen":["특수용접기능사 2014-01-26"],"q":"내용적이 40L , 충전압력이 150kgf/㎠인 산소용기의 압력이 50kgf/㎠까지 내려갔다면 소비한 산소의 량은 몇 L인가?","c":["2000 L","3000 L","4000 L","5000 L"],"a":3,"w":"소비량 = 40 × (150 − 50) = 4000 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"특수용접기능사|2013-10-12|5","k":"특수용접기능사","d":"2013-10-12","topic":"사용률","seen":["특수용접기능사 2013-10-12"],"q":"정격사용률 40%, 정격 2차 전류300(A)인 용접기로 180(A)전 류를 사용하여 용접하는 경우 이 용접기의 허용사용률은? (단, 소수점 미만은 버린다)","c":["109%","111%","113%","115%"],"a":2,"w":"허용사용률 = (300/180)² × 40 = 2.778 × 40 ≈ 111%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":true},{"id":"기능사|2013-10-12|25","k":"기능사","d":"2013-10-12","topic":"전기·퓨즈","seen":["기능사 2013-10-12"],"q":"200V용 아크 용접기의 1차 입력이 15KVA일 때 퓨즈의 용량은 얼마(A)가 적합한가?","c":["65","75","90","100"],"a":2,"w":"1차 전류 = 1차 입력/전원 전압 = 15,000VA/200V = 75A이므로 퓨즈 용량은 75A가 적합하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-08-18|21","k":"산업기사","d":"2013-08-18","topic":"효율·역률","seen":["산업기사 2013-08-18"],"q":"맞대기 용접 시험편의 인장강도가 650N/mm2 이고, 모재의 인장 강도가 700N/mm2 일 경우에 이음 효율은 약 얼마인가?","c":["85.9%","90.5%","92.9%","98.2%"],"a":3,"w":"이음효율 = (용접시험편 인장강도 / 모재 인장강도)×100 = (650/700)×100 = 92.9%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-08-18|23","k":"산업기사","d":"2013-08-18","topic":"응력·강도","seen":["산업기사 2013-08-18"],"q":"그림과 같이 폭 50 mm, 두께 10 mm의 강판을 40 mm만 을 겹쳐서 전둘레 필릿 용접을 한다. 이 때 100 kN의 하중 을 작용시킨다면 필릿 용접의 치수는 얼마로 하면 좋은가? (단, 용접 허용응력은 10.2 kN/cm2)","c":["약 2 mm","약 5 mm","약 8 mm","약 11 mm"],"a":3,"w":"전둘레 용접길이 L=2×(5+4)=18cm, σ=P/(0.707·f·L) → 10.2=100/(0.707·f·18), 0.707f=0.545cm, f≈0.77cm≈8mm","note":"","g":["f804"],"gc":[],"v":"","f":0,"gl":0,"figs":["f804"],"src":"기출"},{"id":"산업기사|2013-08-18|53","k":"산업기사","d":"2013-08-18","topic":"전기·퓨즈","seen":["산업기사 2013-08-18"],"q":"1차 입력 전원 전압이 220 V인 용접기의 정격용량이 20 kVA라면 가장 적합한 퓨즈의 용량은?","c":["50","100","150","200"],"a":2,"w":"1차 전류 = 정격용량/입력전압 = 20000VA/220V ≈ 90.9A이므로 그보다 큰 표준 용량인 100A 퓨즈가 적합하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2013-07-21|22","k":"기능사","d":"2013-07-21","topic":"가스·용기","seen":["기능사 2013-07-21"],"q":"용해 아세틸렌을 충전했을 때 용기의 전체 무게가 27Kgf이 고 사용 후 빈 용기의 무게가 24Kgf이었다면 순수 아세틸렌 가스의 양은?","c":["2715ℓ","2025ℓ","1125ℓ","648ℓ"],"a":1,"w":"용적 = 905 × (충전 후 무게 - 빈 용기 무게) = 905 × (27-24) = 2715 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2013-07-21|23","k":"기능사","d":"2013-07-21","topic":"전기·퓨즈","seen":["기능사 2013-07-21"],"q":"용접전류 150A, 전압이 30V 일 때 아크출력은 몇 kW인가?","c":["4.2kW","4.5kW","4.8kW","5.8kW"],"a":2,"w":"아크출력 = 아크전압 × 아크전류 = 30V × 150A = 4500W = 4.5kW","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-06-02|26","k":"산업기사","d":"2013-06-02","topic":"응력·강도","seen":["산업기사 2013-06-02"],"q":"다음 [그림]과 같은 V형 맞대기 용접에서 굽힘 모멘트(Mb) 가 1000 N∙m 작용하고 있을 때, 최대 굽힘 응력은 몇 MPa 이가? (단, ℓ = 150 mm, t = 20 mm 이고 완전 용입이다.)","c":["10","100","1000","10000"],"a":2,"w":"σ=Mb/Z, Z=ℓt²/6=0.15×0.02²/6=1×10⁻⁵ m³ → σ=1000/1×10⁻⁵=1×10⁸ Pa=100 MPa.","note":"","g":["f798"],"gc":[],"v":"","f":0,"gl":0,"figs":["f798"],"src":"기출"},{"id":"산업기사|2013-06-02|40","k":"산업기사","d":"2013-06-02","topic":"응력·강도","seen":["산업기사 2013-06-02"],"q":"단면적이 150mm2, 표점거리가 50mm인 인장시험편에 20kN의 하중이 작용할 때 시험편에 작용하는 인장응력(σ)은?","c":["약 133 GPa","약 133 MPa","약 133 KPa","약 133 Pa"],"a":2,"w":"σ=P/A=20,000 N/150 mm²=133.3 N/mm²=133 MPa. 표점거리는 응력 계산과 무관하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-06-02|55","k":"산업기사","d":"2013-06-02","topic":"효율·역률","seen":["산업기사 2013-06-02"],"q":"2차 무부하접압이 80V, 아크전압 30V, 아크전류 250A, 내 부손실 2.5kW라 할 때, 역률은 얼마인가?","c":["50%","60%","75%","80%"],"a":1,"w":"역률 = (아크전압×전류 + 내부손실)/(무부하전압×전류) = (30×250+2500)/(80×250) = 10000/20000 = 50%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2013-04-14|6","k":"특수용접기능사","d":"2013-04-14","topic":"효율·역률","seen":["특수용접기능사 2013-04-14"],"q":"2차 무부하전압이 80V, 아크전류가 200A, 아크전압 30V, 내부 손실 3KW일 때 역률(%)은?","c":["48.00%","56.25%","60.00%","66.67%"],"a":2,"w":"아크출력 = 30 × 200 = 6kW, 전원입력 = 80 × 200 = 16kVA → 역률 = (6 + 3) ÷ 16 × 100 = 56.25%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2013-04-14|30","k":"기능사","d":"2013-04-14","topic":"사용률","seen":["기능사 2013-04-14"],"q":"피복 아크 용접기의 아크 발생 시간과 휴식시간 전체가 10 분이고 아크 발생 시간이 3분일 때 이 용접기의 사용률(%)은?","c":["10%","20%","30%","40%"],"a":3,"w":"사용률 = 아크 발생시간 ÷ (아크시간＋휴식시간) × 100 = 3/10 × 100 = 30%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2013-04-14|39","k":"기능사","d":"2013-04-14","topic":"가스·용기","seen":["기능사 2013-04-14"],"q":"가변압식 토치의 팁 번호 400번을 사용하여 표준불꽃으로 2 시간 동안 용접할 때 아세틸렌가스의 소비량은 몇 ℓ인가?","c":["400","800","1600","2400"],"a":2,"w":"가변압식(프랑스식) 팁 번호는 1시간당 아세틸렌 소비량(ℓ)이다. 400ℓ/h × 2시간 = 800ℓ.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-03-10|35","k":"산업기사","d":"2013-03-10","topic":"응력·강도","seen":["산업기사 2013-03-10"],"q":"맞대기 용접부에 3960 N 의 힘이 작용할 때 이음부에 발생 하는 인장 응력은 약 몇 N/mm2 인가? (단, 판 두께는 6mm, 용접선의 길이는 220mm로 한다.)","c":["2","3","4","5"],"a":2,"w":"σ = P/(t×L) = 3960/(6×220) = 3 N/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2013-03-10|54","k":"산업기사","d":"2013-03-10","topic":"기타 계산","seen":["산업기사 2013-03-10"],"q":"그림은 피복 아크 용접봉에서 피복제의 편심 상태를 나타낸 단면도이다. D′ = 3.5mm, D = 3mm 일 때 편심률은 약 몇 % 인가?","c":["14%","17%","18%","20%"],"a":2,"w":"편심률 = (D′-D)/D ×100 = (3.5-3)/3 ×100 = 16.7 ≒ 17%. 규격상 편심률은 3% 이내여야 한다.","note":"","g":["f790"],"gc":[],"v":"","f":0,"gl":0,"figs":["f790"],"src":"기출"},{"id":"산업기사|2013-03-10|55","k":"산업기사","d":"2013-03-10","topic":"사용률","seen":["산업기사 2013-03-10"],"q":"정격 2차 전류가 300A, 정격 사용률 50%인 용접기를 사용 하여 100A의 전류로 용접을 할 때 허용 사용률은?","c":["250%","350%","450%","500%"],"a":3,"w":"허용사용률 = (정격2차전류/실제전류)² × 정격사용률 = (300/100)² × 50 = 9×50 = 450%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2013-01-27|32","k":"기능사","d":"2013-01-27","topic":"기타 계산","seen":["기능사 2013-01-27"],"q":"연강판의 두께가 4.4㎜인 모재를 가스 용접할 때 가장 적합한 가스 용접봉의 지름은 몇 ㎜인가?","c":["1.0","1.5","2.0","3.2"],"a":4,"w":"D = T/2 + 1 = 4.4/2 + 1 = 3.2㎜","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"comcbt","mock":false},{"id":"기능사|2013-01-27|25","k":"기능사","d":"2013-01-27","topic":"가스·용기","seen":["기능사 2013-01-27"],"q":"산소병의 내용적이 40.7리터인 용기에 압력이 100kg/cm2로 충전되어 있다면 프랑스식 팁 100번을 사용하여 표준 불꽃으로 약 몇 시간까지 용접이 가능한가?","c":["16시간","22시간","31시간","41시간"],"a":4,"w":"40.7 × 100 = 4070 L ÷ 100 L/h ≈ 41시간","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"comcbt","mock":false},{"id":"기능사|2013-01-27|2","k":"기능사","d":"2013-01-27","topic":"효율·역률","seen":["기능사 2013-01-27"],"q":"맞대기 용접이음에서 모재의 인장강도는 450Mpa이며, 용접 시험편의 인장강도가 470Mpa일 때 이음효율은 약 몇%인가?","c":["104","96","60","69"],"a":1,"w":"이음효율 = 470 ÷ 450 × 100 ≈ 104%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"comcbt","mock":false},{"id":"특수용접기능사|2013-01-27|33","k":"특수용접기능사","d":"2013-01-27","topic":"응력·강도","seen":["특수용접기능사 2013-01-27"],"q":"연강의 인장시험에서 하중 100N, 시험편의 최초 단면적이 50 ㎟일 때 응력은 몇 N/㎟인가?","c":["1","2","5","10"],"a":2,"w":"응력 = 하중 ÷ 단면적 = 100 ÷ 50 = 2 N/㎟","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2013-01-27|4","k":"특수용접기능사","d":"2013-01-27","topic":"전기·퓨즈","seen":["특수용접기능사 2013-01-27"],"q":"용접전류가 100A, 전압이 30V일 때 전력은 몇 KW 인가?","c":["4.5KW","15KW","10KW","3KW"],"a":4,"w":"전력 = 전압 × 전류 = 30 × 100 = 3000W = 3kW","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2013-01-27|1","k":"특수용접기능사","d":"2013-01-27","topic":"가스·용기","seen":["특수용접기능사 2013-01-27"],"q":"내용적이 33.7ℓ인 산소용기에 15MPa로 충전하였을 때 사용 가 능한 용기내의 산소량은?","c":["약 505.5ℓ","약 5055ℓ","약 13575ℓ","약 12673ℓ"],"a":2,"w":"15MPa ≈ 150kgf/㎠ → 33.7 × 150 ≈ 5055 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2012-10-20|2","k":"기능사","d":"2012-10-20","topic":"가스·용기","seen":["기능사 2012-10-20"],"q":"15℃. 1kgf/ccm2 하에서 사용 전 용해아세틸렌 병의 무게가 50kgf 이고, 사용후 무게가 47kgf 일 때 사용한 아세틸렌의 양은 몇 L 인가?","c":["2915","2815","3815","2715"],"a":4,"w":"용해아세틸렌 양 = 905 × (사용 전 무게 - 사용 후 무게) = 905 × (50-47) = 2715 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-08-26|34","k":"산업기사","d":"2012-08-26","topic":"목두께·환산길이","seen":["산업기사 2012-08-26"],"q":"2매의 판이 100° 의 각도로 조립되는 필릿 용접 이음의 경우 이론 목두께는 다리 길이의 약 몇 % 인가?","c":["70.7%","65%","50%","55%"],"a":2,"w":"이론 목두께 a = 다리길이 × cos(θ/2) = z × cos(100°/2) = z × cos50° = 0.643z, 즉 약 65%다. 직각(90°)일 때가 cos45° = 70.7%다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-08-26|37","k":"산업기사","d":"2012-08-26","topic":"효율·역률","seen":["산업기사 2012-08-26"],"q":"65%의 용착효율을 가지고 단일의 V형 홈을 가진 20mm 두께의 철판을 3m 맞대기 용접했을 때, 필요한 소요 용접봉의 중량은 약 몇 kgf 인가? (단, 20mm 철판의 용접부 단면적은 2.6 cm2 이고, 용착 금속의 비중은 7.85 이다.)","c":["7.42","9.42","11.42","13.42"],"a":2,"w":"용착금속량 = 2.6cm² × 300cm × 7.85 = 6123g ≈ 6.12kgf, 소요 용접봉 = 6.12 ÷ 0.65 ≈ 9.42kgf.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-08-26|42","k":"산업기사","d":"2012-08-26","topic":"사용률","seen":["산업기사 2012-08-26"],"q":"정격 2차 전류 300A의 용접기에서 실제로 200A의 전류로서 용접한다고 가정하면 허용 사용률은 얼마인가? (단, 정격 사용률은 40%라고 한다.)","c":["80%","85%","90%","95%"],"a":3,"w":"허용사용률 = (정격 2차 전류/실제 전류)² × 정격 사용률 = (300/200)² × 40 = 2.25 × 40 = 90%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2012-07-22|31","k":"특수용접기능사","d":"2012-07-22","topic":"가스·용기","seen":["특수용접기능사 2012-07-22"],"q":"15℃, 1kgf/㎠ 하에서 사용 전 용해아세틸렌 병의 무게가 50kgf 이고, 사용 후 무게가 45kgf 일 때 사용한 아세틸렌의 양은 약 몇 L 인가?","c":["2715","3178","3620","4525"],"a":4,"w":"(50 − 45) × 905 = 4525 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2012-07-22|11","k":"특수용접기능사","d":"2012-07-22","topic":"가스·용기","seen":["특수용접기능사 2012-07-22"],"q":"15℃, 15기압에서 50L 아세틸렌 용기에 아세톤 21L가 포화, 흡수되어 있다. 이 용기에는 약 몇 L 의 아세틸렌을 용해시킬 수 있는가?","c":["5875","7375","7875","8385"],"a":3,"w":"아세톤 21L × 25 × 15기압 = 7875 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2012-07-22|30","k":"기능사","d":"2012-07-22","topic":"가스·용기","seen":["기능사 2012-07-22"],"q":"가스용접을 하기 전 용기의 무게는 57kg이었다. 용접 후 무게가 55kg이었다면 이 때 사용한 용해아세틸렌 가스의 양은 몇 L 인가?(단, 15℃, 1기압 하에서 아세틸렌가스 1kg의 용 적은 905L 이다.)","c":["905","1810","2715","3620"],"a":2,"w":"사용량 = (57-55)kg × 905L/kg = 2 × 905 = 1810L.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-05-20|21","k":"산업기사","d":"2012-05-20","topic":"응력·강도","seen":["산업기사 2012-05-20"],"q":"용접 잔류응력의 완화법인 응력제거 풀림에서 적정온도는 625±25℃(탄소강)를 유지한다. 이 때 유지시간은 판 두께 25mm에 대하여 약 몇 시간이 적당한가?","c":["30분","1시간","2시간 30분","3시간"],"a":2,"w":"탄소강의 응력제거 풀림은 625±25℃에서 판 두께 25mm당 1시간 유지가 기준이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-05-20|25","k":"산업기사","d":"2012-05-20","topic":"가스·용기","seen":["산업기사 2012-05-20"],"q":"용적 40리터의 아세틸린 용기의 고압력계에서 60기압이 나 타났다면, 가변압식 300번 팁으로 약 몇 시간을 용접할 수 있는가?","c":["4.5시간","8시간","10시간","20시간"],"a":2,"w":"아세틸렌량 = 용적×압력 = 40L×60 = 2400L, 300번 팁은 시간당 300L 소비 → 2400/300 = 8시간.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-05-20|37","k":"산업기사","d":"2012-05-20","topic":"목두께·환산길이","seen":["산업기사 2012-05-20"],"q":"필릿 용접부의 내력(단위 길이당 허용력) f =1700kgf/cm의 작용을 견디어 낼 수 있는 용접 치수(다리 길이) h는 약 몇 mm 인가? (단, 용접부의 허용응력 σ = 1000 kgf/cm2 이다.)","c":["12","17","21","25"],"a":4,"w":"필릿 목두께 a = 0.707h이므로 f = 0.707h·σ → h = f/(0.707σ) = 1700/(0.707×1000) = 2.4cm ≒ 24mm, 보기 중 약 25mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2012-04-08|33","k":"특수용접기능사","d":"2012-04-08","topic":"응력·강도","seen":["특수용접기능사 2012-04-08"],"q":"다음 중 용착금속의 인장가동 55kgf/㎟ 에 안전율이 6 이라면 이음의 허용응력은 약 몇 kgf/㎟ 인가?","c":["330","92","9.2","33"],"a":3,"w":"허용응력 = 55 ÷ 6 ≈ 9.2 kgf/㎟","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2012-04-08|7","k":"기능사","d":"2012-04-08","topic":"효율·역률","seen":["기능사 2012-04-08"],"q":"맞대기용접 이음에서 모재의 인장강도는 40kgf/mm2 이며, 용접 시험편의 인장강도가 45kgf/mm2 일 때 이음효율은 몇 % 인가?","c":["104.4","112.5","125.0","150"],"a":2,"w":"이음효율 = (용접시험편 인장강도/모재 인장강도)×100 = (45/40)×100 = 112.5%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2012-04-08|23","k":"기능사","d":"2012-04-08","topic":"사용률","seen":["기능사 2012-04-08"],"q":"정격전류 200A, 전격사용율 40%인 아크 용접기로 실제 아크 전압 30V, 아크 전류 130A로 용접을 수행한다고 가정할 때 허용사용률은 약 얼마인가?","c":["70%","75%","80%","95%"],"a":4,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (200/130)²×40 = 2.367×40 ≒ 94.7%로 약 95%다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-03-04|24","k":"산업기사","d":"2012-03-04","topic":"연신율·경도","seen":["산업기사 2012-03-04"],"q":"용접부 인장시험에서 최초의 길이가 50mm이고 인장시험편 의 파단 후의 거리가 60mm일 경우에 변형율은?","c":["10%","15%","20%","25%"],"a":3,"w":"변형률 = (늘어난 길이/원래 길이)×100 = (60-50)/50×100 = 20%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2012-03-04|39","k":"산업기사","d":"2012-03-04","topic":"응력·강도","seen":["산업기사 2012-03-04"],"q":"다음 그림과 같이 두께(h) = 10mm인 연강판에 길이(ℓ) = 400mm로 용접하여 1000N의 인장하중(P)을 작용시킬 때 발생하는 인장응력 (σ)은?","c":["약 177Mpa","약 125Mpa","약 177Kpa","약 125Kpa"],"a":3,"w":"목두께 a=0.707×10≈7.07mm, 단면적 A=2×7.07×400≈5657mm². σ=P/A=1000/5657≈0.177N/mm²=0.177MPa=약 177kPa.","note":"","g":["f749"],"gc":[],"v":"","f":0,"gl":0,"figs":["f749"],"src":"기출"},{"id":"산업기사|2012-03-04|59","k":"산업기사","d":"2012-03-04","topic":"가스·용기","seen":["산업기사 2012-03-04"],"q":"이론적으로 순수한 카바이드 5kg에서 발생할 수 있는 아세틸렌 량은 약 몇 리터인가?","c":["3480ℓ","1740ℓ","348ℓf","34.8ℓ"],"a":2,"w":"순수 카바이드 1kg에서 아세틸렌 약 348ℓ가 발생하므로 5kg이면 348×5 = 1740ℓ이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2012-02-12|6","k":"특수용접기능사","d":"2012-02-12","topic":"사용률","seen":["특수용접기능사 2012-02-12"],"q":"AW300인 교류 아크 용접기로 쉬지 않고 계속적으로 용접작업 을 진행할 수 있는 용접전류는 약 몇 암페어[A] 이하 인가? (단, 이때 허용사용률은 100%이며, 이 용접기의 정격 사용률은 40[%] 이다.)","c":["138[A] 이하","154[A] 이하","189[A] 이하","226[A] 이하"],"a":3,"w":"허용사용률 100%가 되는 전류: 100 = (300/I)² × 40 → I = 300 × √0.4 ≈ 189.7A → 189A 이하 (AW300의 정격사용률 40%)","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2012-02-12|30","k":"기능사","d":"2012-02-12","topic":"기타 계산","seen":["기능사 2012-02-12"],"q":"다음 중 두께 20mm인 강판을 가스 절단하였을 때 드래그 (drag)의 길이가 5mm 이었다면 드래그 양은 몇 % 인가?","c":["4.0%","20%","25%","100%"],"a":3,"w":"드래그 양 = (드래그 길이/판 두께)×100 = (5/20)×100 = 25%이다. 표준 드래그는 판 두께의 약 20%이다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2011-10-09|30","k":"특수용접기능사","d":"2011-10-09","topic":"응력·강도","seen":["특수용접기능사 2011-10-09"],"q":"맞대기 용접 이음에서 최대 인장하중이 8000kgf이고, 판두께 가 9㎜, 용접선의 길이가 15cm일 때 용착금속의 인장강도는 약 몇 kgf/㎜2인가?","c":["5.9","5.5","5.6","5.2"],"a":1,"w":"인장강도 = P ÷ (t × ℓ) = 8000 ÷ (9 × 150) ≈ 5.9 kgf/㎟ (15cm = 150㎜)","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2011-10-09|25","k":"기능사","d":"2011-10-09","topic":"입열·발열량","seen":["기능사 2011-10-09"],"q":"아크 전류가 200A, 아크 전압이 25V, 용접 속도가 15cm/min인 경우 용접 길이 1cm 당 발생하는 전기적 에너 지는?","c":["10000(J/cm)","15000(J/cm)","20000(J/cm)","25000)J/cm)"],"a":3,"w":"입열량 H = 60EI/v = 60×25×200/15 = 300000/15 = 20000 J/cm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2011-08-21|27","k":"산업기사","d":"2011-08-21","topic":"연신율·경도","seen":["산업기사 2011-08-21"],"q":"두께 10mm, 폭 20mm인 시편을 인장시험 한 후 파단된 부 위를 측정하였더니 두께 8mm, 폭 16mm가 되었을 때 단면 수축율은 얼마인가?","c":["82%","64%","48%","36%"],"a":4,"w":"단면수축률 = (원단면적－파단단면적)/원단면적 × 100 = (10×20 － 8×16)/(10×20) × 100 = (200－128)/200 × 100 = 36%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2011-08-21|34","k":"산업기사","d":"2011-08-21","topic":"연신율·경도","seen":["산업기사 2011-08-21"],"q":"표점거리가 50mm인 인장 시험편을 인장시험한 결과 62mm 로 늘어났다면 연신율은 얼마인가?","c":["12%","18%","24%","20%"],"a":3,"w":"연신율 = (늘어난 길이－표점거리)/표점거리 × 100 = (62－50)/50 × 100 = 24%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2011-08-21|56","k":"산업기사","d":"2011-08-21","topic":"가스·용기","seen":["산업기사 2011-08-21"],"q":"용해된 아세틸렌의 양은 50리터의 용기에서 21리터가 포화 흡수되어 있는데, 15℃, 15기압에서 아세톤 1리터에 아세틸렌 324리터가 용해되어 있다면 50리터 용기에서 아세틸렌 약 몇 리터를 용해시킬 수 있는가?","c":["3246","1169","4156","6804"],"a":4,"w":"아세톤 1L가 아세틸렌 324L를 녹이므로, 아세톤 21L × 324 = 6804L를 용해시킬 수 있다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2011-07-31|29","k":"기능사","d":"2011-07-31","topic":"전기·퓨즈","seen":["기능사 2011-07-31"],"q":"200V용 아크용접기의 1차 입력이 150KVA일 때, 퓨즈의 용량은 얼마[A]가 적당한가?","c":["65[A]","75[A]","90[A]","100[A]"],"a":2,"w":"퓨즈 용량 = 1차 입력[VA] ÷ 전원전압 = 15,000 ÷ 200 = 75[A]. 1차 입력을 전압으로 나누면 1차측 전류가 나온다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2011-06-12|29","k":"산업기사","d":"2011-06-12","topic":"응력·강도","seen":["산업기사 2011-06-12"],"q":"다음 그림과 같은 맞대기 용접 이음에서 강판의 두께를 10㎜로 하고 최대 2500N의 인장하중을 작용시킬 때 필요한 용접 길이는? (단, 용접부의 허용인장응력은 10N/mm2 이다.)","c":["25㎜","23㎜","20㎜","18㎜"],"a":1,"w":"σ = P/(t×L)에서 L = P/(σ×t) = 2500/(10×10) = 25mm. 맞대기 이음은 판 두께를 목두께로 보고 계산한다.","note":"","g":["f710"],"gc":[],"v":"","f":0,"gl":0,"figs":["f710"],"src":"기출"},{"id":"산업기사|2011-06-12|33","k":"산업기사","d":"2011-06-12","topic":"응력·강도","seen":["산업기사 2011-06-12"],"q":"용접부에 인장, 압축의 반복하중 30 ton이 작용하는 폭 600㎜인 두 장의 강판을 I형 맞대기 용접 하였을 때, 두 강판의 두께가 약 몇 ㎜ 이면 견딜 수 있는가? (단, 허용 응력 σa= 6.3 kg/mm2로 한다.)","c":["1㎜","2㎜","6㎜","8㎜"],"a":4,"w":"σ = P/(t×b)에서 t = P/(σ×b) = 30000kg/(6.3×600) = 7.9 ≒ 8mm. 30ton은 30000kg으로 바꿔 대입한다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2011-04-17|1","k":"특수용접기능사","d":"2011-04-17","topic":"가스·용기","seen":["특수용접기능사 2011-04-17"],"q":"3.37리터의 산소 용기에 150kgf/㎠으로 산소를 충전하여 대기 중에서 환원하면 산소는 몇 리터인가?","c":["5055","6066","7077","8088"],"a":1,"w":"산소량 = 33.7 × 150 = 5055 L","note":"원본의 3.37리터는 33.7리터의 오기로 보여요(정답 5055 = 33.7 × 150).","g":[],"gc":[],"v":"x","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2011-03-20|58","k":"산업기사","d":"2011-03-20","topic":"사용률","seen":["산업기사 2011-03-20"],"q":"정격 2차 전류 400A, 정격 사용율이 50%인 교류 아크용 접기로서 250A로 용접할 때 이 용접기의 허용 사용율은?","c":["128%","122%","112%","95%"],"a":1,"w":"허용사용률 = (정격2차전류/실제전류)²×정격사용률 = (400/250)²×50 = 2.56×50 = 128%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"기능사|2011-02-13|28","k":"기능사","d":"2011-02-13","topic":"전기·퓨즈","seen":["기능사 2011-02-13"],"q":"1차측 입력이 24kVA인 용접기의 전원이 200 V 일 때, 가장 적합한 퓨즈의 용량은?","c":["100 A","120 A","150 A","240 A"],"a":2,"w":"1차 전류 = 입력/전압 = 24,000VA / 200V = 120A 이므로 퓨즈 용량은 120A가 적합하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2010-10-03|43","k":"특수용접기능사","d":"2010-10-03","topic":"효율·역률","seen":["특수용접기능사 2010-10-03"],"q":"맞대기 용접 이음에서 모재의 인장강도는 45kgf/㎟이며, 용접 시 험편의 인장강도가 47kgf/㎟ 일 때 이음 효율은 약 몇 %인가?","c":["104","96","60","69"],"a":1,"w":"이음효율 = 47 ÷ 45 × 100 ≈ 104%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2010-10-03|11","k":"특수용접기능사","d":"2010-10-03","topic":"가스·용기","seen":["특수용접기능사 2010-10-03"],"q":"산소병 내용적이 40.7L인 용기에 100kgf/㎠로 충전되어 있다 면 프랑스식 팁 100번을 사용하여 표준불꽃으로 약 몇 시간까 지 용접이 가능한가?","c":["약 16시간","약 22시간","약 31시간","약 40시간"],"a":4,"w":"산소량 = 40.7 × 100 = 4070 L. 프랑스식 100번 = 시간당 100L → 4070 ÷ 100 ≈ 40시간","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2010-07-25|23","k":"산업기사","d":"2010-07-25","topic":"응력·강도","seen":["산업기사 2010-07-25"],"q":"두께가 6.4mm인 두 모재의 맞대기 이음에서 용접이 음부가 4536kgf의 인장하중이 작용할 경우 필요한 용접부의 최소 허용길이(mm)는 약 얼마인가? (단, 용접부의 허용인장응력 은 14.06kgf/mm2 이다.)","c":["50.4mm","40.3mm","30.1mm","20.7mm"],"a":1,"w":"L = P/(σ×t) = 4536/(14.06×6.4) = 4536/89.98 ≒ 50.4mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2010-07-11|50","k":"특수용접기능사","d":"2010-07-11","topic":"응력·강도","seen":["특수용접기능사 2010-07-11"],"q":"맞대기 이음에서 판 두께 10㎜, 용접선의 길이 200㎜, 하중 9000kgf에 대한 인장응력(σ)은?","c":["4.5kgf/㎠","3.5kgf/㎠","2.5kgf/㎠","1.5kgf/㎠"],"a":1,"w":"인장응력 = P ÷ (t × ℓ) = 9000 ÷ (10 × 200) = 4.5 kgf/㎟","note":"원본 보기의 단위 kgf/㎠는 kgf/㎟의 오기로 보여요.","g":[],"gc":[],"v":"x","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"기능사|2010-07-11|5","k":"기능사","d":"2010-07-11","topic":"응력·강도","seen":["기능사 2010-07-11"],"q":"맞대기 용접 이음에서 최대 인장하중이 800kgf 이고, 판 두께가 5mm, 용접선의 길이가 20cm 이 때 용착 금속의 인장 강도는 몇 kgf/mm2 인가?","c":["0.8","8","80","800"],"a":1,"w":"인장강도 = 하중/단면적 = 800/(5×200) = 800/1000 = 0.8kgf/mm². 용접선 20cm는 200mm로 환산한다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2010-05-09|36","k":"산업기사","d":"2010-05-09","topic":"사용률","seen":["산업기사 2010-05-09"],"q":"AW-400인 용접기 50대를 설치하고자 할 때 전원 변압기는 어느 정도 용량을 설비해야 하는가? (단, 용접기의 평균전류 는 200A, 무부하 전압은 80V, 사용율은 70%이다.)","c":["320 kVA","420 kVA","460 kVA","560 kVA"],"a":4,"w":"용접기 1대 용량 = 무부하전압×평균전류×사용률 = 80×200×0.7 = 11.2kVA. 50대이므로 11.2×50 = 560kVA.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2010-03-28|5","k":"특수용접기능사","d":"2010-03-28","topic":"사용률","seen":["특수용접기능사 2010-03-28"],"q":"정격전류 200A, 전격사용율 45%인 아크 용접기로써 실제 아크 전압 30V, 아크 전류 150A로 용접을 수행한다고 가정할 때 허 용사용률은 약 얼마인가?","c":["70%","80%","90%","100%"],"a":2,"w":"허용사용률 = (200/150)² × 45 = 1.778 × 45 = 80%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2010-03-07|37","k":"산업기사","d":"2010-03-07","topic":"응력·강도","seen":["산업기사 2010-03-07"],"q":"그림과 같은 V형 맞대기 용접에서 굽힘 모멘트(Mb)가 10000 kgf·cm 작용하고 있을 때, 최대 굽힘 응력은 몇 kgf/cm2 인가? (단, ℓ = 150mm, t = 20mm 이고 완전 용 입일 때이다.)","c":["10","1000","100","10000"],"a":2,"w":"단면계수 Z = ℓt²/6 = 15×2²/6 = 10 cm³, 굽힘응력 = M/Z = 10000/10 = 1000 kgf/cm².","note":"","g":["f660"],"gc":[],"v":"","f":0,"gl":0,"figs":["f660"],"src":"기출"},{"id":"산업기사|2010-03-07|51","k":"산업기사","d":"2010-03-07","topic":"사용률","seen":["산업기사 2010-03-07"],"q":"정격 2차 전류 200[A], 정격사용율 50%인 아크 용접기로 실제 150[A]의 전류로 용접할 경우 허용사용율은 약 몇 % 인가?","c":["69","78","89","95"],"a":3,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 = (200/150)²×50 = 1.78×50 ≈ 89%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2010-03-07|56","k":"산업기사","d":"2010-03-07","topic":"효율·역률","seen":["산업기사 2010-03-07"],"q":"무부하 전압 80V, 아크 전압 30V, 아크 전류 200A까지의 아크용접기의 역률을 계산하면? (단, 내부손실은 4kW 이다.)","c":["80%","62.5%","90%","72.5%"],"a":2,"w":"역률 = (아크전압×전류 + 내부손실)/(무부하전압×전류) = (30×200+4000)/(80×200) = 10000/16000 = 62.5%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2010-01-31|15","k":"특수용접기능사","d":"2010-01-31","topic":"가스·용기","seen":["특수용접기능사 2010-01-31"],"q":"산소-아세틸렌 용접에서 표준불꽃으로 연강판 두께 2.0㎜를 60분간 용접하였더니 200리터의 아세틸렌가스가 소비되었다 면, 가장 적당한 가변압식 팁의 번호는?","c":["100번","200번","300번","400번"],"a":2,"w":"가변압식 팁 번호 = 1시간 아세틸렌 소비량(L) → 60분에 200L이면 200번","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2010-01-31|2","k":"특수용접기능사","d":"2010-01-31","topic":"전기·퓨즈","seen":["특수용접기능사 2010-01-31"],"q":"병렬접속저항에서 R₁=4[Ω], R₂=5[Ω], R₃=10[Ω]일 때 합성 저항은 약 몇 [Ω]인가?","c":["1.8","18","19","1.9"],"a":1,"w":"병렬 합성저항 1/R = 1/4 + 1/5 + 1/10 = 0.55 → R ≈ 1.8Ω","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2009-07-26|27","k":"산업기사","d":"2009-07-26","topic":"연신율·경도","seen":["산업기사 2009-07-26"],"q":"인장시험 결과 시험편의 파단 후의 단면적 20mm2 이고 원 단면적 25mm2일 때 단면수축률은?","c":["20%","30%","40%","50%"],"a":1,"w":"단면수축률 = (원단면적 − 파단 후 단면적)/원단면적 × 100 = (25 − 20)/25 × 100 = 20%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2009-07-26|29","k":"산업기사","d":"2009-07-26","topic":"응력·강도","seen":["산업기사 2009-07-26"],"q":"그림과 같은 겹치기 이음의 필릿 용접을 하려고 한다. 허용 응력을 5kgf/mm2라 하고 인장하중을 5000 kgf, 판두께 12 ㎜ 이라고 할 때, 필요한 용접 유효 길이는 약 몇 ㎜인가?","c":["83","73","69","59"],"a":4,"w":"양면 필릿의 목두께 a = 0.707×12 = 8.49mm이므로 L = P/(2aσ) = 5000/(2×8.49×5) ≈ 59mm.","note":"","g":["f650"],"gc":[],"v":"","f":0,"gl":0,"figs":["f650"],"src":"기출"},{"id":"산업기사|2009-07-26|44","k":"산업기사","d":"2009-07-26","topic":"효율·역률","seen":["산업기사 2009-07-26"],"q":"교류 용접기에서 무부하 전압 80V, 아크전압 25V, 아크전류 300A 이며, 내부손실 3㎾라 하면 이때 용접기의 효율은 약 몇 % 인가?","c":["71.4","70.1","68.3","66.7"],"a":1,"w":"아크출력 = 25V×300A = 7500W, 효율 = 아크출력/(아크출력+내부손실) = 7500/(7500+3000) = 0.714 → 71.4%. 무부하 전압은 역률 계산에만 쓴다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2009-07-12|3","k":"특수용접기능사","d":"2009-07-12","topic":"응력·강도","seen":["특수용접기능사 2009-07-12"],"q":"용착금속의 인장강도 45kgf/㎟에 안전율이 9라면 이음의 허용 응력은 몇 kgf/㎟인가?","c":["50","0.5","5","10"],"a":3,"w":"허용응력 = 인장강도 ÷ 안전율 = 45 ÷ 9 = 5 kgf/㎟","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2009-05-10|23","k":"산업기사","d":"2009-05-10","topic":"연신율·경도","seen":["산업기사 2009-05-10"],"q":"용접부 인장시험에서 최초의 길이가 40mm이고, 인장시험편 의 파단 후의 거리가 50mm 일 경우에 변형율 ε는?","c":["10%","15%","20%","25%"],"a":4,"w":"변형률 ε = (L−L0)/L0 × 100 = (50−40)/40 × 100 = 25%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2009-05-10|30","k":"산업기사","d":"2009-05-10","topic":"응력·강도","seen":["산업기사 2009-05-10"],"q":"그림과 같이 폭 60mm 두께 12mm 강판을 60mm만을 겹쳐 서 전둘레 필릿용접을 한다. 여기에 9000kgf의 하중을 작용 시킨다면 필릿용접의 치수는 약 몇 mm 인가? (단, 용접의 허용응력은 1000 kgf/cm2 으로 한다.)","c":["5.3","9.2","12.1","16.4"],"a":1,"w":"전둘레 용접길이 L = 2×(60+60) = 240mm, 허용응력 1000kgf/cm² = 10kgf/mm². f = P/(0.707·L·σ) = 9000/(0.707×240×10) ≈ 5.3mm.","note":"","g":["f642"],"gc":[],"v":"","f":0,"gl":0,"figs":["f642"],"src":"기출"},{"id":"산업기사|2009-05-10|36","k":"산업기사","d":"2009-05-10","topic":"응력·강도","seen":["산업기사 2009-05-10"],"q":"맞대기 용접 이음에서 강판의 두께 6mm 이고 용접길이 200mm, 인장하중 6000kgf 작용시 용접 이음부에 발생하는 인장응력은 몇 kgf/mm2 인가?","c":["4","5","6","7"],"a":2,"w":"σ = P/(t×L) = 6000/(6×200) = 5 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2009-05-10|55","k":"산업기사","d":"2009-05-10","topic":"전기·퓨즈","seen":["산업기사 2009-05-10"],"q":"1차 압력이 30kWa인 피복 아크 용접기에서 전원 전압이 200V라면 퓨즈의 용량은 몇 A가 가장 적합한가?","c":["75","100","150","300"],"a":3,"w":"퓨즈 용량 = 1차 입력/전원 전압 = 30,000VA/200V = 150A.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2008-10-05|15","k":"특수용접기능사","d":"2008-10-05","topic":"가스·용기","seen":["특수용접기능사 2008-10-05"],"q":"35℃에서 120kgf/㎠으로 압축하여 충전한 용기속의 산소량이 5604 리터라면 내부 용적은 몇 리터로 계산되는가?","c":["0.02","58.84","67.25","46.7"],"a":4,"w":"산소량 = 내용적 × 압력 → 내용적 = 5604 ÷ 120 = 46.7 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2008-07-27|24","k":"산업기사","d":"2008-07-27","topic":"응력·강도","seen":["산업기사 2008-07-27"],"q":"다음 그림과 같은 완전 용입된 연강판 맞대기 이음부에 굽 힘모멘트 Mb = 10000 kgf·cm가 작용할 때, 용접부에 발생 하는 최대 굽힘응력은 약 ㎏f/cm2인가? (단, 용접길이 300mm이고, 판두께는 10mm이다.)","c":["0.2","20","200","2000"],"a":4,"w":"단면계수 Z = bh²/6 = 30×1²/6 = 5cm³, σ = Mb/Z = 10000/5 = 2000 kgf/cm².","note":"","g":["f604"],"gc":[],"v":"","f":0,"gl":0,"figs":["f604"],"src":"기출"},{"id":"산업기사|2008-07-27|35","k":"산업기사","d":"2008-07-27","topic":"응력·강도","seen":["산업기사 2008-07-27"],"q":"그림과 같이 강판의 두께가 9mm이고 용접길이가 200mm이 며 최대 인장하중이 72000㎏f이 작용하고 있을 때 용접부에 발생하는 인장응력은 약 ㎏f/mm2인가?","c":["20","30","40","80"],"a":3,"w":"σ = P/(t×L) = 72000/(9×200) = 40 kgf/mm².","note":"","g":["f605"],"gc":[],"v":"","f":0,"gl":0,"figs":["f605"],"src":"기출"},{"id":"산업기사|2008-07-27|57","k":"산업기사","d":"2008-07-27","topic":"사용률","seen":["산업기사 2008-07-27"],"q":"정격 2차 전류 300A의 용접기에서 실제로 200A의 전류로 용접하면 허용 사용률은 얼마인가? (단, 정격 사용률은 60% 이다.)","c":["43%","90%","135%","30%"],"a":3,"w":"허용사용률 = (정격 2차 전류/실제 전류)²×정격사용률 = (300/200)²×60 = 2.25×60 = 135%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2008-05-11|27","k":"산업기사","d":"2008-05-11","topic":"응력·강도","seen":["산업기사 2008-05-11"],"q":"그림과 같은 용접부에 발생하는 인장응력(σt)은 약 몇 kgf/mm2인가?","c":["1.46","1.67","2.16","2.6"],"a":2,"w":"σt = P/(t×ℓ)로 구한다. 그림의 하중과 판두께·용접길이를 대입하면 약 1.67 kgf/mm²가 된다.","note":"","g":["f586"],"gc":[],"v":"","f":0,"gl":0,"figs":["f586"],"src":"기출"},{"id":"산업기사|2008-05-11|32","k":"산업기사","d":"2008-05-11","topic":"목두께·환산길이","seen":["산업기사 2008-05-11"],"q":"폭 50㎜, 두께 12.7㎜인 강판 두장을 38㎜만큼 겹쳐서 전주 필릿용접을 하였다. 여기에 외력 P=9000kgf의 하중을 작용 시킬 때 필요한 필릿용접 이음의 치수(목길이)는 몇 ㎝인가? (단, 용접부의 허용응력은 σa=1020kgf/cm2 이다.)","c":["0.99","1.4","0.49","0.7"],"a":4,"w":"전주 필릿 총길이 L = 2×(5+3.8) = 17.6cm, f = P/(0.707×L×σa) = 9000/(0.707×17.6×1020) ≒ 0.7cm.","note":"","g":["f591"],"gc":[],"v":"","f":0,"gl":0,"figs":["f591"],"src":"기출"},{"id":"산업기사|2008-05-11|37","k":"산업기사","d":"2008-05-11","topic":"응력·강도","seen":["산업기사 2008-05-11"],"q":"연강의 맞대기 용접이음에서 인장강도가 28kgf/mm2 이고, 안전율이 5일 때 이음의 허용응력은 약 몇 kgf/mm2 인가?","c":["0.18","1.80","0.56","5.60"],"a":4,"w":"허용응력 = 인장강도 / 안전율 = 28 / 5 = 5.6 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2008-03-02|35","k":"산업기사","d":"2008-03-02","topic":"입열·발열량","seen":["산업기사 2008-03-02"],"q":"아크 전류가 300A 아크 전압이 25V 용접 속도가 20cm/min 인 경우 용접길이 1cm 당 발생 되는 용접 입열은?","c":["20000","22500","25500","30000"],"a":2,"w":"용접입열 H = 60EI/v = 60×25×300/20 = 22500 J/cm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2008-03-02|38","k":"산업기사","d":"2008-03-02","topic":"응력·강도","seen":["산업기사 2008-03-02"],"q":"강판 두께 9㎜, 용접선 유효길이 150㎜, 홈의 깊이 h1, h2가 각각 3㎜인 V형 맞대기 용접을 불완전 용입으로 용접하고, 9000kgf 의 하중이 용접선과 직각 방향으로 작용하는 경우 압축 응력은 몇 kgf/mm2인가?","c":["20","15","10","5"],"a":3,"w":"불완전 용입 V형의 목두께는 h1+h2 = 3+3 = 6mm. σ = P/(a×l) = 9000/(6×150) = 10 kgf/mm².","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2008-03-02|47","k":"산업기사","d":"2008-03-02","topic":"가스·용기","seen":["산업기사 2008-03-02"],"q":"내용적 40리터의 산소용기에 조정기의 고압측 압력계가 50 를 지시하고 있다면, 이 용기에는 잔류 산소가 몇 리터(L) 있는가?","c":["100","200","1000","2000"],"a":4,"w":"잔류 산소량 = 내용적 × 게이지 압력 = 40L × 50kgf/cm² = 2000L.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-08-05|23","k":"산업기사","d":"2007-08-05","topic":"응력·강도","seen":["산업기사 2007-08-05"],"q":"용접부에 인장, 압축의 반복하중 30 ton 이 작용하는 폭이 600mm 인 두 장의 강판을 I 형 맞대기 용접 하였을 때, 두 강판의 두께가 몇 mm 이면 견딜 수 있겠는가? (단, 허용응력 σa=6.3kf/mm2 로 한다.)","c":["약 1mm","약 2mm","약 6mm","약 8mm"],"a":4,"w":"σ = P/(t·L)에서 t = P/(σa·L) = 30000/(6.3×600) = 30000/3780 ≒ 7.9mm이므로 약 8mm가 필요하다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-08-05|41","k":"산업기사","d":"2007-08-05","topic":"기타 계산","seen":["산업기사 2007-08-05"],"q":"두께 3.2mm 의 연강판을 가스용접하려고 한다. 모재 두께가 1mm 이상일 때 용접봉의 지름을 결정하는 방법에 의한 가스 용접봉의 지름은?","c":["1.0mm","2.6mm","3.2mm","4.0mm"],"a":2,"w":"가스용접봉 지름 D = T/2 + 1 = 3.2/2 + 1 = 2.6mm 이다(모재 두께 1mm 이상일 때).","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-08-05|59","k":"산업기사","d":"2007-08-05","topic":"사용률","seen":["산업기사 2007-08-05"],"q":"정격 2차 전류가 300A, 정격사용율이 40%인 아크용접기로 200A 의 용접전류를 사용하여 용접하는 경우의 허용사용률 (%)은?","c":["60","70","80","90"],"a":4,"w":"허용사용률 = (정격2차전류/실제전류)² × 정격사용률 = (300/200)² × 40 = 2.25 × 40 = 90%","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-05-13|38","k":"산업기사","d":"2007-05-13","topic":"효율·역률","seen":["산업기사 2007-05-13"],"q":"용접부의 인장시험에서 모재의 인장강도가 45kgf/mm2이고 용접부의 인장강도가 31.5kgf/mm2 로 나타났다면 이 재료의 이음 효율은 얼마 정도인가?","c":["62%","70%","78%","90%"],"a":2,"w":"이음효율 = (용접부 인장강도/모재 인장강도)×100 = (31.5/45)×100 = 70%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-05-13|53","k":"산업기사","d":"2007-05-13","topic":"효율·역률","seen":["산업기사 2007-05-13"],"q":"교류 용접기의 아크 출력이 9.0kW 이고, 내부 손실이 4.0kW 일 때 용접기의 효율은?","c":["약 54.1%","약 69.2%","약 74.3%","약 89.5%"],"a":2,"w":"효율 = 아크출력/(아크출력+내부손실)×100 = 9.0/(9.0+4.0)×100 = 9/13 = 69.2%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2007-03-04|43","k":"산업기사","d":"2007-03-04","topic":"사용률","seen":["산업기사 2007-03-04"],"q":"정격 2차 전류 300[A], 정격사용율 50%인 아크 용접기로 실제 200[A]의 전류로 용접할 경우 허용 사용율은 몇 %인가?","c":["200","156","112.5","98.7"],"a":3,"w":"허용사용률 = (정격2차전류/실제전류)² × 정격사용률 = (300/200)² × 50 = 2.25 × 50 = 112.5%.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"특수용접기능사|2007-01-28|2","k":"특수용접기능사","d":"2007-01-28","topic":"가스·용기","seen":["특수용접기능사 2007-01-28"],"q":"아세틸렌이 충전되어 있는 병의 무게가 64Kg이었고, 사용 후 공병의 무게가 61Kg이었다면 이 때 사용된 아세틸렌의 양은 몇 리터인가? (단, 아세틸렌의 용적은 905리터임)","c":["348","450","1044","2715"],"a":4,"w":"아세틸렌 1kg ≈ 905 L → (64 − 61) × 905 = 2715 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"특수용접기능사|2006-10-01|7","k":"특수용접기능사","d":"2006-10-01","topic":"가스·용기","seen":["특수용접기능사 2006-10-01"],"q":"아세톤은 각종 액체에 잘 용해된다. 15℃ 15기압에서 아세톤 2L에 아세틸렌이 몇 L 정도가 용해되는가?","c":["150L","225L","375L","750L"],"a":4,"w":"아세톤 1L에 1기압당 25L → 25 × 15기압 × 2L = 750 L","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"건시스템","mock":false},{"id":"산업기사|2006-08-06|39","k":"산업기사","d":"2006-08-06","topic":"응력·강도","seen":["산업기사 2006-08-06"],"q":"V형 맞대기 용접(완전용입)에서 용접선의 유효길이가 300㎜ 이고, 용접선에 수직하게 인장하중 13500 ㎏f이 작용 하면 연강판의 두께는 몇 ㎜인가? (단, 인장응력은 5 ㎏f/mm2 임)","c":["25","16","12","9"],"a":4,"w":"σ = P/(t·L) → t = P/(σ·L) = 13500/(5×300) = 9mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2006-08-06|45","k":"산업기사","d":"2006-08-06","topic":"가스·용기","seen":["산업기사 2006-08-06"],"q":"산소용기의 용량이 30리터이다. 최초의 압력 150 kgf∙cm2 이고, 사용 후 100 kgf∙cm2 으로 되면 몇 리터의 산소가 소 비 되는가?","c":["1020","1500","3000","4500"],"a":2,"w":"소비량 = 내용적 × 압력차 = 30 × (150-100) = 1500 L.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2006-08-06|60","k":"산업기사","d":"2006-08-06","topic":"사용률","seen":["산업기사 2006-08-06"],"q":"정격 2차 전류가 600[A]인 용접기의 정격 사용률이 40%, 허용사용률이 57.6%였다면, 실제 용접 작업시의 용접 전류 는 몇 [A]인가?","c":["500","600","700","800"],"a":1,"w":"허용사용률 = (정격전류/실제전류)²×정격사용률 → 57.6 = (600/I)²×40, (600/I)² = 1.44, 600/I = 1.2, I = 500A.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2006-05-14|32","k":"산업기사","d":"2006-05-14","topic":"응력·강도","seen":["산업기사 2006-05-14"],"q":"V형 맞대기 용접(완전한 용입)에서 판 두께가 10mm 용접선의 유효길이가 200mm일 때, 여기에 50Kgf/mm2의 인장(압 축)응력이 발생한다면 용접선에 직각방향으로 몇 Kgf의 인장(압축)하중이 작용하겠는가?","c":["2000Kgf","5000Kgf","10000Kgf","15000Kgf"],"a":3,"w":"P = σ×A = σ×t×L, 단면적 = 10×200 = 2000mm²이므로 하중 = 5×2000 = 10000 kgf가 된다.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2006-05-14|34","k":"산업기사","d":"2006-05-14","topic":"응력·강도","seen":["산업기사 2006-05-14"],"q":"두께가 6.4mm인 두 모재의 맞대기 이음에서 용접 이음부가 4536 kgf의 인장하중이 작용할 경우 필요한 용접부의 최소 허용길이(mm)는? (단, 용접부의 허용인장응력은 14.06Kg/mm2이다.)","c":["50.4","40.3","30.1","20.7"],"a":1,"w":"L = P/(σ×t) = 4536/(14.06×6.4) = 4536/89.98 ≈ 50.4mm.","note":"","g":[],"gc":[],"v":"","f":0,"gl":0,"figs":[],"src":"기출"},{"id":"산업기사|2006-05-14|35","k":"산업기사","d":"2006-05-14","topic":"응력·강도","seen":["산업기사 2006-05-14"],"q":"다음 그림과 같은 필릿이음의 용접부 인장응력(kgf/mm2)은 얼마 정도 인가?","c":["약 1.4","약 3.5","약 5.2","약 7.6"],"a":2,"w":"필릿은 목 }
function qCard(q,i){
  var hot=q.seen.length>1?'<span class="badge hot">'+q.seen.length+'번 출제</span>':'';
  var h='<div class="card q" data-id="'+esc(q.id)+'"><div class="qhead"><span class="qno">'+i+'</span><span class="badge k">'+esc(KLAB[q.k]||q.k)+'</span><span class="badge">'+esc(q.topic)+'</span>'+hot+'</div>';
  h+='<div class="qstem">'+esc(q.q)+'</div>';
  if(q.f&&!q.g.length&&!q.gc.length)h+='<div class="figwarn">원본 시험지의 그림은 실을 수 없었어요. 보기와 숫자로 풀어 보세요.</div>';
  if(q.g.length)h+='<div class="figs">'+q.g.map(figBox).join('')+'</div>';
  if(q.gl)h+='<div class="figwarn">보기 ①~④는 위 그림 안에 있어요.</div>';
  if(q.gc.length){h+='<div class="chwrap imgs">'+q.gc.map(function(id,ci){return '<button class="ch" data-c="'+(ci+1)+'"><span class="k">'+KCH[ci]+'</span>'+figBox(id)+'</button>';}).join('')+'</div>';}
  else h+='<div class="chwrap">'+q.c.map(function(c,ci){return '<button class="ch" data-c="'+(ci+1)+'"><span class="k">'+KCH[ci]+'</span>'+esc(c)+'</button>';}).join('')+'</div>';
  h+='<div class="rv hide"></div><div class="act"><button class="btn sh">정답 보기</button></div></div>';
  return h;
}
function answer(card,q,pick,restore){
  var chs=card.querySelectorAll('.ch');chs.forEach(function(b){b.disabled=true;var n=+b.dataset.c;if(n===q.a)b.classList.add('ok');else if(pick&&n===pick)b.classList.add('no');});
  var ok=pick==null?null:pick===q.a;var rv=card.querySelector('.rv');
  var h='<div class="reveal '+(ok===true?'ok':ok===false?'no':'')+'"><span class="lab">'+(ok===true?'정답!':ok===false?'오답':'정답')+'</span><div class="ansv">'+KCH[q.a-1]+(q.gc.length?'번':' '+esc(q.c[q.a-1]))+'</div>';
  if(q.w)h+='<div class="exp"><b>풀이</b>'+esc(q.w)+'</div>';
  if(q.v==='x')h+='<div class="vnote"><em>원본 시험지의 정답 표시를 바로잡은 문항입니다.</em> '+esc(q.note)+'</div>';
  else if(q.v==='u')h+='<div class="vnote"><em>정답을 끝까지 확정하지 못한 문항입니다.</em> 원본 시험지에 표시된 답을 그대로 두었습니다.</div>';
  if(q.mock)h+='<div class="vnote">건시스템이 기출을 바탕으로 지문을 일부 고친 「재구성」 문제예요.</div>';
  h+='<div class="seen">출제: '+esc(q.seen.map(function(s){return s.replace(/^기능사 /,'용접기능사 ').replace(/^산업기사 /,'용접산업기사 ');}).join(', '))+'</div></div>';
  rv.innerHTML=h;rv.classList.remove('hide');card.querySelector('.sh').textContent='정답 감추기';
  if(!restore&&pick!=null){ST.done[q.id]=ok?1:0;save();logStudy(ok);}
}
var CUR=null;
$app.addEventListener('click',function(ev){
  var b;
  if((b=ev.target.closest('.seg button'))){FILTER=b.dataset.k;ST.k=FILTER;save();home();return;}
  if((b=ev.target.closest('.topic'))){var T=TOPICS[+b.dataset.t];CUR=function(){list(T.t,pool().filter(function(q){return q.topic===T.t;}),T);};CUR();return;}
  if((b=ev.target.closest('[data-go]'))){var g=b.dataset.go;CUR=function(){g==='all'?list('자주 나온 순 전체',pool(),null):list('틀린 문제',pool().filter(function(q){return ST.done[q.id]===0;}),null);};CUR();return;}
  if(ev.target.closest('.zoom')){var im=ev.target.closest('.figbox').querySelector('img');var lb=document.getElementById('lb');lb.querySelector('img').src=im.src;lb.classList.add('on');ev.stopPropagation();return;}
  var card=ev.target.closest('.q');if(!card)return;var q=ITEMS.find(function(x){return x.id===card.dataset.id;});
  if((b=ev.target.closest('.ch'))&&!b.disabled){answer(card,q,+b.dataset.c);return;}
  if((b=ev.target.closest('.sh'))){var rv=card.querySelector('.rv');if(rv.classList.contains('hide')){answer(card,q,null,true);}else{rv.classList.add('hide');b.textContent='정답 보기';}}
});
document.getElementById('lb').addEventListener('click',function(){this.classList.remove('on');});
$back.onclick=function(){home();};
home();
</script>
</body>
</html>
